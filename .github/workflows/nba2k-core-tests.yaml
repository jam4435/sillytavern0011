name: nba2k-core-tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/nba2k/**'
      - '.github/workflows/nba2k-core-tests.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/nba2k/**'
      - '.github/workflows/nba2k-core-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba2k-core-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - name: Run NBA2K core tests
        run: >
          pnpm exec vitest run
          --configLoader native
          --pool threads
          --reporter verbose
          src/nba2k/engine/positioning.test.ts
          src/nba2k/engine/resolveAction.test.ts
          src/nba2k/engine/possession.test.ts
          src/nba2k/engine/possessionCalibration.test.ts
          src/nba2k/engine/rotation.test.ts
          src/nba2k/engine/rotationPlan.test.ts
          src/nba2k/engine/rotationCalibration.test.ts
          src/nba2k/engine/teamStyle.test.ts
          src/nba2k/engine/teamPower.test.ts
          src/nba2k/engine/leagueStats.test.ts
          src/nba2k/engine/season.test.ts
          src/nba2k/engine/coachProfile.test.ts
          src/nba2k/engine/lifecycle.test.ts
          src/nba2k/engine/draft.test.ts
          src/nba2k/engine/transactions.test.ts
          src/nba2k/engine/fullGameSimulation.test.ts
