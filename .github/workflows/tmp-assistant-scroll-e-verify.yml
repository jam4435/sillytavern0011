name: Temporary assistant-scroll-E verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare TypeScript diagnostics against main
        shell: bash
        run: |
          set -uo pipefail
          pnpm exec tsc --noEmit > /tmp/head-tsc.log 2>&1 || true
          git fetch origin main:refs/remotes/origin/main
          git worktree add /tmp/assistant-scroll-e-base origin/main
          ln -s "$PWD/node_modules" /tmp/assistant-scroll-e-base/node_modules
          (
            cd /tmp/assistant-scroll-e-base
            ./node_modules/.bin/tsc --noEmit > /tmp/base-tsc.log 2>&1 || true
          )

          cat > /tmp/changed-ts-files.txt <<'EOF'
          src/武侠/App.tsx
          src/武侠/components/GameContent.test.tsx
          src/武侠/components/GameContent.tsx
          src/武侠/hooks/useMessageHandler.test.tsx
          src/武侠/hooks/useMessageHandler.ts
          src/武侠/utils/messageActions.test.ts
          src/武侠/utils/messageActions.ts
          EOF

          python - <<'PY'
          import re
          from pathlib import Path

          changed = set(Path('/tmp/changed-ts-files.txt').read_text(encoding='utf-8').splitlines())
          pattern = re.compile(r'^(.*)\((\d+),(\d+)\): error (TS\d+): (.*)$')

          def diagnostics(path):
              result = set()
              for raw in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  match = pattern.match(raw)
                  if not match:
                      continue
                  filename, _line, _col, code, message = match.groups()
                  filename = filename.replace('\\', '/')
                  if filename in changed:
                      result.add((filename, code, message))
              return result

          base = diagnostics('/tmp/base-tsc.log')
          head = diagnostics('/tmp/head-tsc.log')
          added = sorted(head - base)

          print(f'Changed TS/TSX files: {len(changed)}')
          print(f'Baseline diagnostics in changed files: {len(base)}')
          print(f'Head diagnostics in changed files: {len(head)}')
          if added:
              print('New TypeScript diagnostics introduced by this PR:')
              for item in added:
                  print(' :: '.join(item))
              raise SystemExit(1)
          print('No new TypeScript diagnostics in changed TS/TSX files.')
          PY
      - name: Run E targeted tests
        run: >-
          pnpm exec vitest run
          --configLoader native
          --pool threads
          --reporter minimal
          src/武侠/components/GameContent.test.tsx
          src/武侠/hooks/useMessageHandler.test.tsx
          src/武侠/utils/messageActions.test.ts
