name: Temporary event-fix verification

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:safe -- src/事件脚本/era-event-checker.test.ts src/武侠/utils/variableReader.test.ts src/武侠/hooks/useCommandQueue.test.tsx src/武侠/components/panels/EventsPanel.test.tsx
