name: Temporary merged-regression verification

on:
  push:
    branches:
      - fix/merged-regressions-20260920

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused regression tests
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter minimal
          src/武侠/utils/gameInitializer.test.ts
          src/武侠/components/NewGameSetup.test.tsx
          src/武侠/components/panels/FactionPanel.test.tsx
          src/事件脚本/era-main.test.ts
      - name: Source build
        run: pnpm build:src:fast
