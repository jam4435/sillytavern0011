name: _oneoff-wuxia-batch3-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_oneoff-wuxia-batch3-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original technique name in narrative only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('世界书/金庸群侠传1/世界书/神雕第三十六回07-何师我暗算击败耶律齐.yaml')
          text = path.read_text(encoding='utf-8')
          old = '，狂风迅雷功灭火，'
          new = '，大风袖灭火，'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one narrative occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -n '大风袖\|狂风迅雷功' '世界书/金庸群侠传1/世界书/神雕第三十六回07-何师我暗算击败耶律齐.yaml'
      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/_oneoff-wuxia-batch3-cleanup.yml
          git add '世界书/金庸群侠传1/世界书/神雕第三十六回07-何师我暗算击败耶律齐.yaml' .github/workflows/_oneoff-wuxia-batch3-cleanup.yml
          git commit -m 'fix(wuxia): keep original Huo Du narrative wording'
          git push origin HEAD:main
