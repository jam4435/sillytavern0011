name: wuxia-era-history-tests

on:
  push:
    branches: [main]
    paths:
      - 'src/ERA变量框架/**'
      - 'src/事件脚本/era-event-operations.js'
      - 'src/事件脚本/era-notifications.js'
      - 'src/事件脚本/era-notifications.test.ts'
      - 'src/武侠/hooks/useEventNotifications.ts'
      - 'src/武侠/hooks/useEventNotifications.test.tsx'
      - 'src/shared/wuxiaEventNotifications.ts'
      - 'src/事件脚本/era-main.js'
      - 'src/事件脚本/era-main.test.ts'
      - 'src/事件脚本/era-event-admission.test.ts'
      - 'src/事件脚本/era-write-helper.js'
      - 'src/事件脚本/era-write-helper.test.ts'
      - 'src/shared/turnEventSettlement*'
      - 'src/武侠/hooks/useMessageHandler*'
      - 'src/事件脚本/era-utils.js'
      - 'src/事件脚本/era-logging.test.ts'
      - 'src/事件脚本/era-lifecycle.test.ts'
      - 'src/武侠/utils/extraVariableUpdateManager.ts'
      - 'src/武侠/utils/extraVariableUpdateManager.test.ts'
      - 'src/武侠/utils/activeEventFollowups.ts'
      - 'src/武侠/utils/activeFollowupPrompt.test.ts'
      - 'src/武侠/prompts/变量指导.txt'
      - 'src/武侠/utils/saveLoadManager*'
      - 'src/武侠/utils/historyBranchStatus*'
      - 'src/武侠/components/SaveLoadPanel*'
      - 'src/武侠/utils/variableReader.ts'
      - 'src/武侠/utils/variableReader.test.ts'
      - 'src/武侠/utils/historyEventSnapshot.ts'
      - 'src/武侠/utils/historyMkSnapshot*'
      - 'src/武侠/utils/logger.ts'
      - 'src/武侠/utils/logger.test.ts'
      - 'src/武侠/hooks/useEventListeners.ts'
      - 'src/武侠/hooks/useEventListeners.test.tsx'
      - '.github/workflows/wuxia-era-history-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuxia-era-history-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - name: ERA MK and history checkout regression tests
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/ERA变量框架/core/crud/patcher.test.ts
          src/ERA变量框架/core/sync.test.ts
          src/ERA变量框架/events/merger.test.ts
          src/ERA变量框架/api/command.test.ts
          src/ERA变量框架/utils/log.test.ts
          src/事件脚本/era-logging.test.ts
          src/武侠/utils/saveLoadManager.test.ts
          src/武侠/utils/historyBranchStatus.test.ts
          src/武侠/utils/historyMkSnapshot.test.ts
          src/武侠/components/SaveLoadPanel.test.tsx
          src/武侠/utils/logger.test.ts
          src/武侠/utils/eraWriteWait.test.ts
          src/事件脚本/era-lifecycle.test.ts
          src/事件脚本/era-write-helper.test.ts
          src/shared/turnEventSettlement.test.ts
      - name: Event admission atomicity and UI projection regressions
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/事件脚本/era-event-admission.test.ts
          src/事件脚本/era-notifications.test.ts
          src/武侠/hooks/useEventNotifications.test.tsx
          src/武侠/hooks/useEventListeners.test.tsx
      - name: Variable-model ownership and future-location prompt regressions
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/武侠/utils/extraVariableUpdateManager.test.ts
          src/武侠/utils/activeFollowupPrompt.test.ts
          -t '模型擅自写入|后继地点提示文案'
      - name: Event admission scheduler regressions
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/事件脚本/era-main.test.ts -t '已有进行中事件|同一三级地点|回合事件结算|事件启动提交失败|切换聊天后|诊断：同一 messageId|本轮新建线索|迟到 MESSAGE_SENT'
      - name: Turn settlement event-runtime regressions
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/事件脚本/era-main.test.ts -t '回合事件结算'
      - name: Turn history seal ordering regression
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/武侠/hooks/useMessageHandler.test.tsx -t '事件结算尚未确认时不能封存历史|新 swipe 的事件尚未确认'
      - name: Martial art string migration regressions
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose
          src/武侠/utils/variableReader.test.ts -t autoUpdateMartialArts
      - name: Build
        run: pnpm build:src:fast
