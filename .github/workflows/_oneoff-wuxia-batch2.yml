name: oneoff-wuxia-batch2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_oneoff-wuxia-batch2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'wuxia batch2 staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch formal martial arts database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('src/武侠/data/_合并后功法.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          names = {item.get('功法名称') for item in data['功法']}
          additions = [
              {
                  '功法名称': '白蟒鞭法',
                  '类型': '鞭法',
                  '功法品阶': '上乘',
                  '功法描述': '《九阴真经》下卷所载的鞭法，梅超风、陈玄风偷得真经后曾修习此技，鞭势如蟒，招式阴狠凌厉。',
                  '修炼限制': {},
                  '战斗系数': {'属性列表': [
                      {'属性': '臂力', '系数': 0.5},
                      {'属性': '机敏', '系数': 0.4},
                  ]},
                  '特性': {},
                  '来源类型': '原著明示',
                  '来源说明': '《射雕英雄传》明确记载梅超风使用白蟒鞭法；白蟒鞭法为《九阴真经》下卷所载武学。',
              },
              {
                  '功法名称': '哀牢山三十六剑',
                  '类型': '剑法',
                  '功法品阶': '上乘',
                  '功法描述': '朱子柳所创剑法，上下前后左右各刺六剑，连刺六六三十六剑，攻势凌厉，是其代表性剑术。',
                  '修炼限制': {'机敏': 10, '洞察': 8},
                  '战斗系数': {'属性列表': [
                      {'属性': '机敏', '系数': 0.6},
                      {'属性': '洞察', '系数': 0.4},
                  ]},
                  '特性': {
                      '炉火纯青': '三十六剑势：连续变换六方剑路，连续攻击时伤害提升',
                      '出神入化': '六六无尽：三十六剑连环而出，显著提升破防与暴击',
                  },
                  '来源类型': '原著明示',
                  '来源说明': '《射雕英雄传》明确记载朱子柳所使哀牢山三十六剑，六六三十六剑，称为天下剑法中攻势凌厉第一。',
              },
          ]
          for item in additions:
              if item['功法名称'] not in names:
                  data['功法'].append(item)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify focused regression
        run: pnpm vitest run tools/audit-wuxia-character-martial-arts.batch2.test.mjs
      - name: Commit database patch and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/武侠/data/_合并后功法.json
          git rm .github/workflows/_oneoff-wuxia-batch2.yml
          git commit -m 'fix(wuxia): register two verified missing martial arts'
          git push
