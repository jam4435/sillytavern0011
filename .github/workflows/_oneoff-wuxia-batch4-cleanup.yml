name: _oneoff-wuxia-batch4-cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize canonical martial-art keys
        run: |
          python - <<'PY'
          from pathlib import Path
          mappings = {
              '玉女心经口诀': '玉女心经', '全真入门拳法': '全真掌法', '丐帮心法': '叫花行气诀',
              '九阴真经(逆)': '九阴假经', '水上飘轻功': '铁掌水上飘', '叫化棒法': '打狗棒法',
              '一阳指基础': '段氏基础指法', '玉女心经内功': '玉女心经', '玉女心经外功': '玉女心经',
              '北冥真气': '北冥神功',
          }
          root = Path('世界书/金庸群侠传1/世界书')
          changed = []
          for path in root.rglob('*.yaml'):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              out = []
              for line in lines:
                  for old, new in mappings.items():
                      line = line.replace(f'"{old}":', f'"{new}":').replace(f"'{old}':", f"'{new}':")
                      line = line.replace(f'  {old}:', f'  {new}:').replace(f'    {old}:', f'    {new}:').replace(f'      {old}:', f'      {new}:').replace(f'        {old}:', f'        {new}:').replace(f'          {old}:', f'          {new}:')
                  out.append(line)
              text = ''.join(out)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('changed files:', len(changed)); [print(x) for x in changed]
          PY
      - name: Verify regression
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile=false
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose tools/audit-wuxia-character-martial-arts.batch4.test.mjs
      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '世界书/金庸群侠传1/世界书' tools/audit-wuxia-character-martial-arts.batch4.test.mjs .github/workflows/_oneoff-wuxia-batch4-cleanup.yml
          git commit -m 'fix(wuxia): normalize batch4 NPC martial-art aliases'
          git rm .github/workflows/_oneoff-wuxia-batch4-cleanup.yml
          git commit -m 'chore(wuxia): remove batch4 one-off workflow'
          git push
