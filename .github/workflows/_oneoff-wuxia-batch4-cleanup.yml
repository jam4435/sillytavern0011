name: _oneoff-wuxia-batch4-cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize canonical martial-art keys
        run: |
          python - <<'PY'
          from pathlib import Path
          mappings = {
              '玉女心经口诀': '玉女心经',
              '全真入门拳法': '全真掌法',
              '丐帮心法': '叫花行气诀',
              '九阴真经(逆)': '九阴假经',
              '水上飘轻功': '铁掌水上飘',
              '叫化棒法': '打狗棒法',
              '一阳指基础': '段氏基础指法',
              '玉女心经内功': '玉女心经',
              '玉女心经外功': '玉女心经',
              '北冥真气': '北冥神功',
          }
          root = Path('世界书/金庸群侠传1/世界书')
          changed = []
          for path in root.rglob('*.yaml'):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              in_martial = False
              section_indent = -1
              dirty = False
              for line in lines:
                  stripped = line.strip()
                  indent = len(line) - len(line.lstrip(' '))
                  if stripped == '功法:':
                      in_martial = True
                      section_indent = indent
                      out.append(line)
                      continue
                  if in_martial and stripped and indent <= section_indent:
                      in_martial = False
                  if in_martial:
                      for old, new in mappings.items():
                          prefix = line[:len(line)-len(line.lstrip(' '))]
                          for quote in ('"', "'"):
                              old_key = f'{prefix}{quote}{old}{quote}:'
                              new_key = f'{prefix}{quote}{new}{quote}:'
                              if old_key in line:
                                  line = line.replace(old_key, new_key)
                                  dirty = True
                          old_key = f'{prefix}{old}:'
                          new_key = f'{prefix}{new}:'
                          if old_key in line:
                              line = line.replace(old_key, new_key)
                              dirty = True
                  out.append(line)
              if dirty:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(path))
          print('changed files:', len(changed))
          for item in changed: print(item)
          PY
      - name: Verify regression
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile=false
          pnpm exec vitest run --configLoader native --pool threads --reporter verbose tools/audit-wuxia-character-martial-arts.batch4.test.mjs
      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '世界书/金庸群侠传1/世界书' tools/audit-wuxia-character-martial-arts.batch4.test.mjs .github/workflows/_oneoff-wuxia-batch4-cleanup.yml
          git commit -m 'fix(wuxia): normalize batch4 NPC martial-art aliases'
          git rm .github/workflows/_oneoff-wuxia-batch4-cleanup.yml
          git commit -m 'chore(wuxia): remove batch4 one-off workflow'
          git push
