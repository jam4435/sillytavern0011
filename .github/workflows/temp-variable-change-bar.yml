name: Temporary variable change bar verification

on:
  push:
    branches:
      - fix/variable-change-bar-logic-20260920

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused variable tracking tests
        run: >
          pnpm exec vitest run --configLoader native --pool threads --reporter minimal
          src/武侠/utils/variableChanges.test.ts
          src/武侠/hooks/useVariableChangeTracker.test.tsx
          src/武侠/hooks/useEventListeners.test.tsx
          src/武侠/components/VariableChangeBar.test.tsx
          src/武侠/utils/wuxiaAutomation.test.ts
          src/武侠/components/LatestReplyEditorModal.test.tsx
      - name: Source build
        run: pnpm build:src:fast
