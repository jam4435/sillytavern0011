name: regenerate-shendiao-event-assets

on:
  push:
    branches:
      - fix/shendiao-chapter-07-night-timeline-20261101
    paths:
      - '世界书/金庸群侠传1/世界书/**'
      - 'scripts/generate-wuxia-event-assets.mjs'
      - '.github/workflows/regenerate-shendiao-event-assets.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-shendiao-event-assets
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Regenerate runtime event assets
        run: pnpm generate:events
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/事件脚本/generated/event-data src/武侠/data/事件信息汇总.json src/武侠/data/后续事件地点.generated.json src/武侠/data/事件展示元数据.generated.json
          if git diff --cached --quiet; then
            echo "Generated event assets already up to date."
          else
            git commit -m "chore: regenerate wuxia event assets after timeline shift"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
