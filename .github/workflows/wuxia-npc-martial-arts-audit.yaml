name: wuxia-npc-martial-arts-audit

on:
  push:
    branches: [main]
    paths:
      - 'src/武侠/data/_合并后功法.json'
      - '世界书/金庸群侠传1/世界书/**'
      - 'scripts/audit-wuxia-character-martial-arts.mjs'
      - 'scripts/lib/wuxia-character-martial-arts.mjs'
      - 'tools/audit-wuxia-character-martial-arts.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch2.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch3.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch4.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch5.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch6.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch7.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch8.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch9.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch10.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch11.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch12.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch13.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch14.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch15.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch16.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch17.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch18.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch19.test.mjs'
      - 'tools/audit-wuxia-character-martial-arts.batch20.test.mjs'
      - '.github/workflows/wuxia-npc-martial-arts-audit.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      # Batch 3 canonical alias audit; the source worldbook remains the final truth.
      - name: NPC martial arts regression tests
        run: pnpm exec vitest run --configLoader native --pool threads --reporter verbose tools/audit-wuxia-character-martial-arts.test.mjs tools/audit-wuxia-character-martial-arts.batch2.test.mjs tools/audit-wuxia-character-martial-arts.batch3.test.mjs tools/audit-wuxia-character-martial-arts.batch4.test.mjs tools/audit-wuxia-character-martial-arts.batch5.test.mjs tools/audit-wuxia-character-martial-arts.batch6.test.mjs tools/audit-wuxia-character-martial-arts.batch7.test.mjs tools/audit-wuxia-character-martial-arts.batch8.test.mjs tools/audit-wuxia-character-martial-arts.batch9.test.mjs tools/audit-wuxia-character-martial-arts.batch10.test.mjs tools/audit-wuxia-character-martial-arts.batch11.test.mjs tools/audit-wuxia-character-martial-arts.batch12.test.mjs tools/audit-wuxia-character-martial-arts.batch13.test.mjs tools/audit-wuxia-character-martial-arts.batch14.test.mjs tools/audit-wuxia-character-martial-arts.batch15.test.mjs tools/audit-wuxia-character-martial-arts.batch16.test.mjs tools/audit-wuxia-character-martial-arts.batch17.test.mjs tools/audit-wuxia-character-martial-arts.batch18.test.mjs tools/audit-wuxia-character-martial-arts.batch19.test.mjs tools/audit-wuxia-character-martial-arts.batch20.test.mjs
      - name: Replay deterministic worldbook events
        run: node scripts/audit-wuxia-character-martial-arts.mjs --output-dir "$RUNNER_TEMP/wuxia-npc-martial-arts-audit"
      - name: Print refreshed audit statistics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.RUNNER_TEMP, 'wuxia-npc-martial-arts-audit', 'NPC功法四类专项审计.json');
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify(report.统计, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: wuxia-npc-martial-arts-audit
          path: ${{ runner.temp }}/wuxia-npc-martial-arts-audit/
          retention-days: 14
