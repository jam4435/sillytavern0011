name: wuxia-npc-martial-arts-audit

on:
  push:
    branches: [main]
    paths:
      - 'src/武侠/data/_合并后功法.json'
      - '世界书/金庸群侠传1/世界书/**'
      - 'scripts/audit-wuxia-character-martial-arts.mjs'
      - 'scripts/lib/wuxia-character-martial-arts.mjs'
      - 'tools/audit-wuxia-character-martial-arts.test.mjs'
      - 'tools/generate-wuxia-event-assets.test.mjs'
      - 'src/事件脚本/era-event-source-integrity.test.ts'
      - 'package.json'
      - '.github/workflows/wuxia-npc-martial-arts-audit.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      # Routine checks: algorithm invariants and event refs only, not per-NPC historical wording.
      - name: NPC algorithm and event integrity checks
        run: >-
          pnpm exec vitest run --configLoader native --pool threads --reporter=default
          tools/audit-wuxia-character-martial-arts.test.mjs
          tools/generate-wuxia-event-assets.test.mjs
          src/事件脚本/era-event-source-integrity.test.ts
      - name: Historical NPC martial art assertions (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true # Older per-NPC assertions may disagree with reviewed source data.
        run: pnpm test:wuxia:legacy-audit
      - name: Replay deterministic worldbook events
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/audit-wuxia-character-martial-arts.mjs --output-dir "$RUNNER_TEMP/wuxia-npc-martial-arts-audit"
      - name: Print refreshed audit statistics
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const file = path.join(process.env.RUNNER_TEMP, 'wuxia-npc-martial-arts-audit', 'NPC功法四类专项审计.json');
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(JSON.stringify(report.统计, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: wuxia-npc-martial-arts-audit
          path: ${{ runner.temp }}/wuxia-npc-martial-arts-audit/
          retention-days: 14
