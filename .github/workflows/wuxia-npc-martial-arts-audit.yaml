name: wuxia-npc-martial-arts-audit

on:
  push:
    branches: [main]
    paths:
      - 'src/武侠/data/_合并后功法.json'
      - '世界书/金庸群侠传1/世界书/**'
      - 'scripts/audit-wuxia-character-martial-arts.mjs'
      - 'scripts/lib/wuxia-character-martial-arts.mjs'
      - 'tools/audit-wuxia-character-martial-arts.test.mjs'
      - '.github/workflows/wuxia-npc-martial-arts-audit.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install
      - name: NPC martial arts regression tests
        run: pnpm exec vitest run --configLoader native --pool threads --reporter verbose tools/audit-wuxia-character-martial-arts.test.mjs
      - name: Replay deterministic worldbook events
        run: node scripts/audit-wuxia-character-martial-arts.mjs --output-dir "$RUNNER_TEMP/wuxia-npc-martial-arts-audit"
