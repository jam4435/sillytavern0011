  "事件引子": "少林古刹前剑拔弩张，立于广场左侧的蒙面老者凝视萧峰，山风猎猎间胸膛剧烈起伏。",
  "事件详情": "面对少林广场上如临大敌的各派豪杰，立于左侧的黑衣老者久久凝视着昂藏巍峨的萧峰，胸膛剧烈起伏，忽然仰天爆发出一阵凄厉苍凉的长笑，笑声中夹杂着三十年刻骨铭心的悲愤，震得少室山漫山古刹嗡嗡作响。在群雄惊愕的目光注视下，老者右手猛然发力，一把扯下遮面的黑巾甩落于地。黑巾飘落处，露出一张与萧峰生得八九分相似的粗豪脸庞，浓眉阔口，宛如同一块生铁铸就，唯独两鬓如霜，面颊上刻满了风刀霜剑雕凿的深刻皱纹。萧峰见状如遭焦雷轰顶，挺拔的身躯禁不住剧烈颤抖，失声喃喃自语。萧远山眼中泪光滚落，跨步上前沉声唤道：“孩儿，三十年了！”这一声呼唤彻底击溃了契丹战神的铁石心肠，萧峰再无迟疑，轰然双膝跪倒在青石地上，膝行上前一把抱住生父的腰肢，将头颅深埋在父亲怀中放声痛哭。萧远山亦双臂如铁钳般紧紧搂住爱子，泪洒衣襟。三十载骨肉分离的凄苦与冤屈在少林寺前化作撼天动地的恸哭，令在场的少林高僧与天下豪侠尽皆心神剧震、怆然失色。",
