  "事件引子": "太湖深处碧波荡漾，扁舟在前穿引密布芦荡，引着乌篷船向掩映在垂柳中的水榭行去。",
  "事件详情": "达成同行之约后，阿碧手持竹篙轻轻一点，脚下轻巧的扁舟便如飞燕般在密布的荷花荡中穿行引路，鸠摩智所乘的乌篷船则在后方紧紧相随。在阿碧的熟练操舟下，两艘小船连续穿过了数个隐秘的水岔，绕过了重重如迷宫般茂密的芦苇荡，水路尽头豁然开朗，一座依水而建的秀丽庄院赫然映入眼帘。只见该处粉墙黛瓦、垂柳拂波，门楣之上高悬着一块题有“听香水榭”四个秀气金字的匾额。阿碧招呼二人弃舟登岸，引着鸠摩智与段誉缓步迈入水榭之中。水榭内陈设极其典雅古朴，四壁挂满了名家字画，案头端放着古雅瑶琴与精致茶具，处处透着江南世家的雅致气韵。段誉与鸠摩智跟随阿碧步入堂中落座，顺利完成了从太湖水路到慕容氏外围别庄“听香水榭”的登岸落脚，为接下来的正面交涉提供了安定典雅的室内场景。",
  "事件概要": "阿碧手撑竹篙引路，引领载着鸠摩智与段誉的乌篷船绕行迷宫般的茂密芦苇荡，穿过隐秘水岔抵达依水而建的听香水榭。众人弃舟登岸入榭，段誉与鸠摩智在典雅堂中安然落座，顺利完成自太湖水路至慕容氏别庄的转场。",
