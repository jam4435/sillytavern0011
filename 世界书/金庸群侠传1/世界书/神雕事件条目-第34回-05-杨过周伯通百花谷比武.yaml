  "事件详情": "杨过携郭襄北行百余里来到百花谷，神雕驮着郭襄一路飞奔。谷中美景令郭襄拍手大喜。杨过朗声呼唤老顽童，松树中钻出周伯通——十余年未见竟返老还童，须眉半黑半白比前更显年轻。周伯通伸手来抓杨过人皮面具，杨过侧头让过，二人各显深湛武功。周伯通将郭襄高举半空打圈子后轻轻放下，神雕怒展翅扫去被周伯通双掌接住，双方都暗自佩服。杨过提出若比武输了周伯通便去见瑛姑，周伯通双手乱摇说对不起他二人没脸相见，杨过使激将法也无效，最终只得动手比武。周伯通以空明拳法攻来，杨过展开海潮中苦练的掌法还击——掌力激荡花瓣纷下枝干断折。酣斗良久周伯通使出双手互搏之术化身为二左右夹击，杨过单掌顿处劣势。郭襄叫嚷不公平，周伯通自缚右臂单手应战。杨过忽叫出大伏魔拳法之名，随即使出独创的黯然销魂掌——心惊肉跳以胸肌伤人，杞人忧天掌力圆转如穹庐，无中生有全身齐攻十余招同时发出，拖泥带水右袖轻灵左掌重滞暗合五行。周伯通竭尽全力化解叹服不已。杨过收狂傲之气甘拜下风欲走，周伯通却不依不饶非要学全十七路掌法，甚至跪下磕头要拜杨过为师。郭襄劝周伯通说出心事，他终于讲述当年随王重阳赴大理与刘贵妃（瑛姑）的孽缘，以及多年来愧疚不敢相见的缘由。杨过转述一灯之言——瑛姑曾与周伯通生有一子被裘千仞所伤。周伯通如五雷轰顶，一时悲一时喜，大起怜惜歉仄之情。杨过被其真情打动，将黯然销魂掌一十七路从头至尾演给他看，并讲述因思念小龙女而创此掌的缘由。郭襄感动落泪，柔声祝愿杨过终能与夫人重逢。三人一雕在林中倚树而睡，次日同返黑龙潭。",
