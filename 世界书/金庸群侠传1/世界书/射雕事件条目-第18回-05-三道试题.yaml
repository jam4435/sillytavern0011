  "事件引子": "为平息争端，黄药师决定出题，以三场比试定下女儿婚嫁之事。",
  "事件详情": "为公平决定女儿婚事，黄药师设下三道试题。第一题比试武艺招式，郭靖与欧阳锋对拆，洪七公对阵欧阳克，郭靖在最后关头凭蒙古摔跤技艺侥幸取胜。第二题考较音律，黄药师吹奏《碧海潮生曲》，郭靖不明乐理，却误打误撞地以扰乱节拍的方式与箫声相抗，凭借双手互搏之术和强大的内功根基，最终与欧阳克战成平手。第三题比试记诵，黄药师拿出亡妻手录的《九阴真经》残卷让二人背诵。郭靖因早已将周伯通所授的完整版经文背得滚瓜烂熟，竟将经文一字不差地背出，远超欧阳克。黄药师震惊之下，认定是亡妻显灵，选中了郭靖，当场许婚。正当郭靖叩拜岳父之时，欧阳克却突然出声阻止。",
