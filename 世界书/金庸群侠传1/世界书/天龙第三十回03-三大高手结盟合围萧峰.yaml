  "事件引子": "少林古刹阶前杀气凝霜，群雄刀剑出鞘封死下山通路，殿前广场寒意逼人。",
  "事件详情": "萧峰凌空救妹的神威震慑全场，却也彻底激化了少室山上的杀机。姑苏慕容复为了收买中原武林人心、争夺武林盟主以图光复大燕，当即拔剑出列，高声斥责萧峰乃契丹异族叛贼；惊魂未定的星宿老怪丁春秋为挽回颜面，以及为夺回阿紫并报私仇的丐帮帮主庄聚贤（游坦之），亦怀着各自的野心算计与其迅速形成围杀同盟。慕容复手中三尺青锋寒芒吞吐，施展家传剑法封住左侧；丁春秋摇动鹅毛羽扇，碧绿磷火在袖间毒掌处阴冷翻腾，卡住右翼；庄聚贤则催动体内极寒真气，双掌白雾蒸腾、将脚下青砖冻裂，堵截中路。三大高手呈品字形阵位步步紧逼，气机如铁铸般死死锁住萧峰周身要害。萧峰面对这等前所未有的围攻大阵，毫无退缩之意，长笑一声甩开战袍，冷冷睥睨三人。此时四方武林群雄亦在少林阶前严阵以待、彻底封死下山通路。三大绝顶高手的剑气、剧毒与寒劲交织成天罗地网，使孤身立于核心的萧峰陷入了退无可退的生死绝境之中。",
