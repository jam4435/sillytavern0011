  "事件引子": "皇宫正殿内韶乐齐鸣，金炉龙涎香烟袅袅，文武百官整肃朝班，册封大典庄严启幕。",
  "事件详情": "送别王语嫣重归江南故里之后，段誉彻底放下了困扰多年的虚妄心魔，转而全心全意珍惜眼前与自己历经生死考验、患难与共的身旁人。为给予长期默默相伴、情深意重的红颜知己以明正的名分与归宿，段誉在大理皇宫正殿隆重举行后宫册封大典。在韶乐齐鸣与文武百官的肃穆朝贺之下，段誉身着九龙明黄冕服端坐御榻，当堂宣读皇室册封诏书。礼部尚书恭敬呈上金册与印玺，段誉亲手将象征后宫正位的贵妃金宝与九凤宝冠赐予昔日同生共死、性烈如火的木婉清，又将贤妃金印与翡翠如意授予天真纯善、痴心相随的钟灵。木婉清与钟灵盛装受封，眼含热泪双双下拜谢恩，内廷侍从与宿卫齐声高呼千岁。段誉走下御阶以至诚之心亲手扶起二女，抚慰深爱自己的两位佳人。自此，后宫之中再无争宠猜忌与芥蒂，唯余温情脉脉与相濡以沫。金册印玺礼毕，大理内廷位阶肃穆安宁，后宫呈现出一派和睦融洽的太平景象，为段誉专心励精图治提供了最稳固温暖的内助。",
  "事件概要": "段誉勘破昔日执念后御极正殿举行册封大典，颁诏晋封木婉清为贵妃、钟灵为贤妃，亲授金宝金印与凤冠如意。两女盛装拜恩受封，段誉走下御阶至诚相扶。自此大理后宫位阶安宁融洽，再无纷扰芥蒂，为段誉专心励精图治奠定了稳固内助。",
