  "事件引子": "荒漠深谷中火把密布，金铁交鸣伴着浓烈杀气，数百左道豪强设坛歃血，人影憧憧。",
  "事件详情": "虚竹遵从师尊无崖子的临终嘱托，左手中指佩戴着象征逍遥派掌门尊位与无上权力的七宝指环，怀揣绘有神秘绝美宫装女子的绢帛画像，体内运转着师尊灌顶传授的七十年纯阳北冥真气，辞别中原一路向西跋涉寻访。穿过茫茫甘凉戈壁，行至西域荒漠万仙岭一处乱石嶙峋、怪木丛生的险要深谷时，虚竹忽闻金铁交鸣之声，放眼望去只见谷内火把密布、人影幢幢，整座山谷被浓烈森然的血腥与杀气所笼罩。三十六洞洞主与七十二岛岛主等数百名盘踞各方的旁门左道豪强在此集结，正在举行声势浩大的“万仙大会”。领军巨擘包括凶悍狠辣的乌老大、神色阴鸷的安洞主，以及武林成名名宿不平道人、“剑神”卓不凡等顶尖高手。众枭雄手按兵刃设坛歃血，神情狂躁而惶恐，咬牙切齿密议着关于天山缥缈峰灵鹫宫的虚实变故。初涉西域险地的虚竹目睹这等庞大邪派阵仗，心生强烈戒备，本欲悄然绕道避祸，又恐错失师尊遗命线索，遂施展轻功飘落于数十丈外的巨石阴影深处，敛气屏息潜伏观望。",
  "事件概要": "虚竹遵师遗命携信物西行寻访，途经万仙岭深谷，惊见乌老大、安洞主及卓不凡、不平道人等数百旁门豪强设坛歃血举行万仙大会。虚竹见谷中杀气森然且密议灵鹫宫虚实，恐涉师门因由，遂隐匿于巨石阴影深处屏息潜伏观望。",
