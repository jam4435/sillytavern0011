  "事件详情": "郭靖与杨过在蒙古万军中被围激斗大半个时辰，日光微偏之际情势已万分危急。忽地蒙古军马纷纷散开，桃花岛弃徒冯默风左手撑铁拐、右手舞大铁锤冲杀进来，原来他被蒙古人征入军中打造兵器，暗中已刺杀了一名千夫长和百夫长，此刻望见郭靖杨过被围，当即杀入解救。铁锤风声呼呼当者立毙，登时杀出一条血路。金轮法王转动金轮同时接过杨过剑招与冯默风铁锤，潇湘子则专攻郭靖。法王金轮缺口被君子剑削出，杨过右臂又被轮口划伤鲜血迸流，力气愈来愈弱。冯默风拼死救援却被法王掌力所制。潇湘子趁机挥杆棒点向郭靖头顶欲施放毒砂，杨过危急中左手抓住杆棒头右手长剑刺出，法王有意借杨过之手逐开潇湘子，挥掌逼开冯默风便向郭靖背上抓去。潇湘子只得撒手放棒保命。冯默风锤拐齐施砸向法王背心，被法王回轮震得虎口齐裂。冯默风虎吼一声抛去锤拐，双手自法王背后牢牢抱住他身子，两人翻倒在地。法王大怒挥掌连击，打得冯默风筋折骨断内脏重伤，然其双手始终不放，十指深陷法王胸口肌肉。杨过挥动潇湘子的哭丧棒无意中触动机括喷出蟾蜍毒砂，毒倒十余名蒙古兵将。蒙古兵将见他棒上黑烟一出即有人死伤，齐声惊呼妖法纷纷躲避。杨过撮唇作哨召来黄马拥郭靖上马背，自己手足酸软无力上马，黄马甚有灵性不肯发足。危急中郭靖清醒过来俯身将杨过提上马背，黄马纵蹄疾驰。法王掷出金轮欲削断红马马足，杨过回剑挡护。汗血宝马越奔越快终于甩开金轮。身后黄马肚腹中箭跪倒在地眼睛望着主人恋恋不舍而死，杨过心中一酸不禁掉下泪来。红马追风逐电将追兵远远抛在后面，杨过抱住郭靖探其鼻息知暂时无碍，终于支持不住昏昏沉沉伏在马背上。",
