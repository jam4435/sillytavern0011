  "事件详情": "第三日一行人抵达秦汴之间的交通要地龙驹寨。晚饭后耶律晋到杨过室中请教武学，高帽一顶顶送来将杨过奉承得通体舒泰。正说着，一名侍从匆匆来报说京里老大人送家书到，耶律晋正要叫信使进来，门帷掀处一人笑着走进——竟是他的父亲、蒙古国大丞相耶律楚材本人。耶律楚材年约五十来岁，相貌清雅，威严之中带着三分慈和，杨过一见之下心中不禁生了敬重之意。随后门外又走进一男一女——次子耶律齐约二十三岁相貌英挺气度沉稳，三女耶律燕年纪与杨过相仿容貌秀丽。耶律楚材正要谈私事，示意侍从退下，杨过知趣自行退出。耶律楚材告知耶律晋：大汗窝阔台已死，其子贵由继位三年也短命而死，如今皇后垂帘听政。耶律楚材因直言进谏得罪皇后，借宣抚河南之名举家离京避祸。当晚杨过在房中用功时忽察觉屋顶有人窥探，扯陆无双向西边一望，果见两间屋外的屋顶上伏着一个黑衣人影。那黑衣人倏地飞奔至耶律父子窗外，踢开窗格执刀跃进叫道：\"耶律楚材，今日我跟你同归于尽罢。\"声音却是女子。耶律晋提板凳抵挡被砍去四腿遭飞腿踢翻。耶律燕右掌劈女刺客脸颊左手以空手夺白刃抢她刀子连拆七八招——终究没有兵刃被逼得东躲西闪。耶律齐斜身侧进左手始终插在腰里，右手一伸一缩也不移步随手应付那少女的单刀——招数精妙到位拿捏之准更是不凡。杨过只瞧得暗暗惊诧，心道此人好生了得，似乎是全真派的武功却又颇有不同——他哪里知道这便是老顽童周伯通传下的空明拳。",
