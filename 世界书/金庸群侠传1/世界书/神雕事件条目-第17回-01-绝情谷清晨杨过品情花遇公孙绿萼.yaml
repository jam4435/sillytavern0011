  "事件详情": "次晨杨过醒来走出石屋，在晨光中看清绝情谷全貌——草木青翠欲滴，繁花似锦，仙鹤三二、白鹿成群，松鼠小兔见人不惊，实是罕见美景。信步转过两个弯，遇见昨日那绿衫少女正在道旁摘花。她招呼杨过用早餐，从树上摘下两朵花递过来。杨过心中嘀咕花也能吃，却见少女将花瓣一瓣瓣送入口中，便学样吃了几瓣。入口香甜如蜜，更带微醺酒气，心神俱畅，但嚼几下后却有一股苦涩味道。少女告知此花名为情花，世上并不多见。杨过去摘花时手指被花朵背后的小刺刺伤，不料伤口虽微细，痛楚却厉害之极，宛如胸口被人用大铁锤猛击。少女说明：被情花小刺刺伤后十二个时辰内不能动相思之念，否则苦楚难当。原来情花刺上有毒，平时无害，但人一动情欲之念血中便生出特殊物事，遇上刺毒立即痛不可当。杨过将信将疑，却从此知道了绝情谷中这种奇异之花的特性。",
  "事件概要": "杨过在绝情谷初识情花与公孙绿萼，这段相遇也埋下日后情毒与恩义两重因果。",
