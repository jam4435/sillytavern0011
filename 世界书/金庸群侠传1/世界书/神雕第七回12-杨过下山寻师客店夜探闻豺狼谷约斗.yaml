  "事件详情": "杨过心意既决精神大振，将小龙女与自己的衣服用物胡乱包了一包负在背，上大踏步出山而去。一到有人家处便打听有没见到白衣美貌女子，大半天中接连问了十几个乡民都摇头说没瞧见。杨过焦急起来再次询问出言不免欠缺礼貌。一个老者故意胡扯骗他指着东边小路说昨晚见到仙女般的美人向东而去。杨过急忙揖谢顺小路急赶下去，奔了一盏茶时分眼前出现岔路不知向哪条走。他寻思姑姑不喜热闹多半走荒僻路便踏上左首小路，岂料这条路越走越宽转到一条大路。一日一晚没半点水米下肚腹中饿得咕咕直响，眼见天色渐晚前面房屋鳞次栉比是个市镇便走进一家客店。扒了几口饭胸中难过喉头噎住食不下咽，心想虽然天黑还是得去找寻姑姑错过了今晚只怕今后永难相见。便叫店伴问有没见到穿白衫子的美貌姑娘从此经过。店伴吞吞吐吐说姑娘确也有穿白衫子的可早过去大半天了，又道这娘儿可不是好惹的。杨过又惊又喜知是寻到了姑姑踪迹忙问详情。那店伴先问杨过知不知那姑娘会武，随即说不但动武还伤人呢——指着桌上几条刀剑砍起的痕迹得意洋洋说那姑娘一刀将两个道爷的耳朵也削了下来。杨过笑问什么道爷，那店伴突然脸色大变头一缩转身便走。杨过料知有异端起饭碗放眼瞧去只见两个二十六七岁道人脸颊上都包了绷带走进店来。杨过身上穿的是小龙女缝制的粗布衣衫本就简朴一日一夜急赶更满身尘土便和寻常乡下少年无异，两个道士一眼也没瞧他自行低声说话。杨过故意唏哩呼噜吃得甚大声却自全神倾听。只听浓眉道人姬清虚说皮师弟今晚韩陈两位准能到么，另一个大嘴道人皮清玄粗声说这两位都是丐帮中铁铮铮的汉子与申师叔有过命的交情申师叔出面相邀他们决不能不到。杨过心想重阳宫中牛鼻子成千认不得自己却都不认得他不能跟他们朝相。听姬清虚说说不定路远了今晚赶不到，皮清玄说谅她一个娘们能有多大。杨过听了二人寥寥几句对话料想只消跟住这两个道人便能见着师父心中欢欣无限。晚间杨过在隔壁房间里静悄悄守到中夜，只听院子中登登两声轻响有人从墙外跃进，接着隔房窗子推开。先前进来的姬清虚皮清玄向韩陈两位英雄行礼。杨过听他们对话得知那申师叔约了小龙女明儿正午在西南四十里的豺狼谷相会比武决胜。韩陈二人说接到申师叔的帖子马不停蹄赶来。杨过心道他们联手来欺我姑姑却又怕教里旁人知道鬼鬼祟祟做贼心虚。韩陈二人越墙而出姬皮二道送出墙去，杨过盘算翌日跟随他们即可找到小龙女。",
