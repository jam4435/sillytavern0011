  "事件引子": "石室内幽光静谧，白玉雕像宛若谪仙，足前旧蒲团经连番叩首破裂绽开，内里隐现斑驳绢光。",
  "事件详情": "段誉跪在白玉雕像前虔诚磕头叩首之际，目光无意间触及玉像足前摆放的旧蒲团。因连番重重跪拜磕碰，蒲团表面破损开裂，内里竟隐隐露出一卷色泽斑驳的古旧绸绢。段誉心中微动，伸手将那卷绸绢自破损处小心取出并徐徐展开，卷首赫然映入眼帘的便是八个苍劲有力的大字——“磕首千遍，供我驱策”。段誉展卷细阅，发现整幅绸绢之中详细绘录记载了道家逍遥派的两大无上绝学：吸人内力化为己用的《北冥神功》以及变幻莫测、踏水无痕的《凌波微步》精妙修炼图谱。段誉虽对武学向来无甚野心，但念及神仙姐姐的遗训与当前性命之危，便将这份珍贵无比的武学卷轴小心翼翼贴身妥善收藏。随后，段誉念及钟灵性命与自身七日之限，不敢再多作耽搁，毅然辞别玉像走出石洞，依循路径穿过无量山后山密道重见天日，脚不停歇地全速奔赴万劫谷求取解药。",
  "事件概要": "段誉于玉像前虔诚叩拜，叩裂旧蒲团而意外起获暗藏的道家绝学卷轴，展阅得见《北冥神功》与《凌波微步》图谱。段誉遵遗训将秘笈妥善贴身收藏，辞别玉像经密道逃出生天，马不停蹄奔赴万劫谷求药救助钟灵。",
