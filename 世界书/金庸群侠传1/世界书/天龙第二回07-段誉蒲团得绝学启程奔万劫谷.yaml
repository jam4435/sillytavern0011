  "事件引子": "石室内幽光静谧，白玉雕像宛若谪仙，足前旧蒲团经连番叩首破裂绽开，内里隐现斑驳绢光。",
  "事件详情": "段誉跪在白玉雕像前虔诚磕足一千个响头，足前旧蒲团因连番叩击破裂开裂，自破损处起获一卷古旧绸包。绸包外白绸写有“自当供我驱策、杀尽逍遥派弟子”等严厉遗训。段誉战战兢兢徐徐展开内藏帛卷，卷首《北冥神功》赫然绘有一具横卧裸女画像，一丝不挂、娇媚嫣然，容貌竟与白玉雕像一般无二。段誉登时面红耳赤、心旌摇曳，自惊亵渎神仙姐姐而急忙掩卷，只得自我解嘲乃遵命修习，方敢微阖双目细观裸像上标画的手太阴肺经等绿线穴道与汲人内力法门。帛卷展至尽处，源源皆是三十六幅神态各异的裸身行气图，卷末则绘满以《易经》六十四卦方位行进的《凌波微步》足印。段誉虽无心学武杀人，但为遵神仙姐姐遗嘱并谋避难保身，遂将这份惊世骇俗的武学卷轴贴身妥善珍藏。念及钟灵七日断肠散之厄，段誉不敢再耽搁，穿过琅嬛福地后山密道脱出石洞，星夜兼程全速奔赴万劫谷求援。",
  "事件概要": "段誉叩裂蒲团起获逍遥派秘籍，展卷惊见三十六幅与玉像一般无二的娇媚裸身行气图，含羞敬畏下览毕《北冥神功》与《凌波微步》。段誉遵遗训妥善珍藏卷轴，依后山密道逃出生天，全速赶奔万劫谷求药解救钟灵。",
