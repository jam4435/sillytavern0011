  "事件详情": "赵志敬接任掌教后，命嫡传弟子守在身旁，恭请蒙古贵官入殿宣旨。贵官正要宣读敕封圣旨——李志常、王志坦等突然从道袍下拔出长剑，刷刷几声寒光闪动，两柄剑尖已指住赵志敬背心。李志常朗声喝道：'全真教以忠义创教决不投降蒙古。赵志敬背祖灭宗天人共弃不能再任掌教！'四名大弟子各挺长剑将蒙古贵官和潇湘子围住。李志常义正词严对贵官说大宋子民岂能受蒙古封号，群道大声喝彩。那贵官白刃当前毫无惧色冷笑威胁——潇湘子却猛地长臂伸出左抓右抓，随手将王志坦宋德方长剑夺过。赵志敬跃起接剑刷的一声向王志坦小腹刺去——眼见大限难逃时尹志平袍袖挥出卷住剑刃救下王志坦。李志常率七名大弟子列成天罡北斗阵法将潇湘子围住，潇湘子武功虽强也被阵法虚实变幻弄得眼花缭乱。蒙古贵官吹响号角求援——两名道人上前夺下号角但终究迟了一步，号角声已然传出。尹志平即刻分派各处防守——片刻间便安排得井井有条。但门外突然墙头一声唿哨——尹克西率武士从东边、尼摩星从西边、马光佐从正面跳入重阳宫。原来忽必烈久攻襄阳不克退兵后已派人收罗中原豪杰以图后举，派金轮法王率领大批武林好手伏在终南山周围，若全真教违抗诏命便以武力压服。全真教一日之中两易掌教重阳宫乱成一团，外守卫道人全撤了回来，尹克西等来到宫墙外竟无人发觉。群道赤手空拳挤成一团四下要害全落人手——斗不多时尹志平、李志常、王志坦、宋德方、祁志诚等一一失手或被点穴。众道被逼在大殿一隅无法反抗，赵志敬在蒙古贵官命下跪下听旨——磕头谢恩大呼万岁",
