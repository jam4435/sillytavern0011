  "事件引子": "重阳宫外忽然传来喝骂喧哗和兵刃撞击之声——墙头一声唿哨跳进数十个人来。东边是珠光宝气的尹克西，西边是断腿撑拐的尼摩星，正面是铁塔般的马光佐，所率领的都是蒙汉西域武士中的好手。大殿上全真教道众赤手空拳挤成一团，眼见一败涂地。",
