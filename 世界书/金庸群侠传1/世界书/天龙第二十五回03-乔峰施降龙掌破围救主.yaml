  "事件引子": "雪原猎场杀声震天，数百叛军死士刀矛森列，重重围困落马倒地的契丹国主。",
  "事件详情": "乔峰在林缘目睹契丹皇帝落难垂死，心中念及自身本是契丹萧氏血脉，同胞骨肉之情油然而生，绝不忍见本族君王在眼前惨遭逆贼弑杀，当机立断大喝一声，策马如离弦之箭般径直杀入重围。冲入敌阵后，乔峰运起雄浑无匹的九成内力，悍然施展“降龙十八掌”。只见他双掌翻飞，掌力激荡如怒潮狂涌，刚猛无俦的掌风卷起漫天冰雪，如狂风扫落叶般席卷四方。冲上前来的数十名叛军死士尚未近身，便被磅礴掌力正面轰中，纷纷筋断骨折、狂喷鲜血倒飞出数丈开外。乔峰趁势飞身跃起，凌空一掌击落一名叛军骑兵，顺势夺下一匹健硕战马，落回地面一把将倒地重伤的耶律洪基拉起护在战马之后。面对随后疯狂扑上的数百名叛军死士，乔峰渊渟岳峙，单掌如神龙盘旋翻腾，以一人之躯化作铜墙铁壁。乔峰掌劲到处所向披靡，叛军死士死伤枕藉、鬼哭狼嚎，数百人的合围之势被乔峰硬生生撕裂击溃，辽帝耶律洪基转危为安，被乔峰牢牢护在身后。",
  "事件概要": "乔峰目睹契丹国主遇弑濒危，念及同族之情愤然杀入重围。他运起九成内力施展降龙十八掌，掌风挟冰雪横扫敌骑、震碎包围，顺势夺得战马将重伤的耶律洪基护在身后，以一己之力击溃合围，使辽帝绝处逢生。",
