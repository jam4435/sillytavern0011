  "事件引子": "少林大殿前青砖染尘、杀机四溢，慕容复抖开森寒剑花，直逼段誉面门而来。",
  "事件详情": "三兄弟分头迎敌，大理世子段誉为替长兄分忧，主动挺身迎战姑苏慕容复。慕容复自恃名家绝学，眼中杀机毕露，掌中三尺长剑化作漫天森寒剑花，招招直奔段誉咽喉与前胸刺来。段誉心无旁骛，足踏神妙莫测的“凌波微步”，身形若浮光掠影，衣袂翻飞间随心所欲避开凌厉剑锋；同时他丹田内沛然真气汹涌奔流，十指轮番点出大理段氏至高绝学“六脉神剑”。商阳剑灵动巧妙，关冲剑古朴浑厚，无形剑气如狂风暴雨般破空激射，发出嗤嗤锐响，将坚硬青砖切出道道焦痕。慕容复企图施展“斗转星移”化解剑气，却惊觉无形剑力沛莫能御，登时剑法大乱、险象环生。战至紧要关头，段誉心怀仁善不愿取其性命，拇指一翘，催动至刚至勇的“少商剑”对准其发顶斜斜射出。雄浑剑气如无形雷霆掠过，精准轰中慕容复头顶的紫金王冠，将其一击震得粉碎四溅！慕容复长发披散狼狈不堪，宝剑铿然脱手，面如死灰地瘫软在地，当众颜面尽失彻底惨败。",
  "事件概要": "段誉为解长兄之危挺身迎战慕容复，脚踏凌波微步避其锋芒，十指轮番激射六脉神剑，浑厚无形剑气彻底压制其斗转星移。段誉心存仁善不愿杀戮，引少商剑震碎慕容复发顶王冠。慕容复宝剑脱手披发瘫地，当众颜面扫地彻底惨败。",
