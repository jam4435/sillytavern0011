  "事件引子": "无量山后山林间四处黄烟弥漫，周遭草木尽皆枯焦，神农帮毒雾大阵杀机暗伏。",
  "事件详情": "段誉与钟灵行至无量山后山森林，眼前只见四处黄烟弥漫、周遭草木尽皆枯黄，二人深知此乃神农帮布下的凶险毒雾大阵。段誉本着调解干戈、化解仇怨之意，全然不顾自身安危与阵中剧毒凶险，主动扯开嗓子在林间高声呼喊，言明要求见神农帮帮主司空玄。呼喊声惊动了潜伏在林间的神农帮戒备人员，眨眼间便有数名神农帮帮众自黄烟掩映中冷面现身。众帮众打量段誉，见其举止温文、手无缚鸡之力，不过是一介文弱书生，不禁面露讥讽，口中发出阵阵轻蔑冷笑。段誉面对逼近的敌人并未退缩反抗，而是坦然相对。神农帮众人并未当场下杀手，而是选择仗着人多势众，直接上前将毫无武功根基的段誉与伴随身侧的钟灵一并拿获并严密看管。二人未作殊死搏斗，直接被这伙帮众当场擒扣，身不由己地押解穿过黄烟毒阵，一路押往神农帮的核心驻扎营地之中。",
  "事件概要": "段誉欲解纷争，携钟灵闯入无量山后山黄烟枯木的毒雾大阵，高声求见神农帮主司空玄。暗伏林中的神农帮帮众闻声现身，见段誉仅是文弱书生，嗤笑间仗势将毫无防备的二人一举擒扣，径直押往后山的神农帮核心营地。",
