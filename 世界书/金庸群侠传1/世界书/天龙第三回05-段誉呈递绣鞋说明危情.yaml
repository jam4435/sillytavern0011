  "事件引子": "后院草地劲风呼啸，黑色软鞭挟着凌厉杀意破空抽来，生死悬于一线。",
  "事件详情": "面对迎面挥来的致命长鞭，段誉急忙连连摆手高呼住手，慌乱中大声喊出钟灵身陷重围、已被神农帮强行扣为人质的危急境况，表明自己是受钟灵重托特来万劫谷求取解药救人。黑衣女郎闻言心头剧震，原本凌厉挥出的软鞭在半空中倏地收回，她神色焦灼地厉声追问证据。段誉不敢有丝毫怠慢，迅速探入怀中取出钟灵亲手交予的那双葱绿绣花鞋，双手毕恭毕敬地递呈上去。黑衣女郎接过绣鞋细致审视辨认，眼中的凌厉杀意瞬间转为对同门师妹的深切关忧，确认这确是钟灵的贴身信物无误，随即厉声痛斥神农帮胆敢冒犯万劫谷。段誉趁机将神农帮帮众中闪电貂剧毒、司空玄逼迫自己吞服七日断肠散并限期七日拿药换人的人质原委全盘托出，恳切请求女郎速速引见谷主钟先生以求取解药。至此，信物绣花鞋完成验看流转，彻底化解了眼前的误杀危机。",
  "事件概要": "危急关头段誉疾呼钟灵受困，并呈上葱绿绣花鞋为凭。黑衣女郎闻讯敛鞭辨验信物，确认钟灵遭神农帮扣押后杀意顿消，转为惊怒忧急。段誉趁势详陈中剧毒及七日换人之约，恳请引见谷主，终化解误杀之险并达成初步互信。",
