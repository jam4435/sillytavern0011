  "事件引子": "幽暗潮湿的枯井泥泞中，异派真气激荡轰鸣，坚石碎屑混着污泥漫天迸溅。",
  "事件详情": "幽暗窒息的枯井泥潭之中，吐蕃国师鸠摩智因贪多务得，强行将少林七十二绝技与小无相功、易筋经内劲混杂逆练，终致体内真气彻底失控反噬。鸠摩智双目赤红如血，面部肌肉极度扭曲抽搐，多股暴虐霸道的异派真气在奇经八脉中如脱缰野马般疯狂横冲直撞，带来经脉寸断般的焚心剧痛。神智尽失的大轮明王在狭窄湿滑的井底发狂嘶吼、翻滚挣扎，双掌毫无章法地狂劈乱舞，“火焰刀”的赤热残劲与刚猛霸道的掌风四散激荡，将井壁坚石轰得碎屑纷飞、浑浊泥浆漫天暴溅。蜷缩在角落泥淖中的段誉急忙张开双臂将王语嫣护在身后，两人在狂乱气浪中避无可避。就在此时，狂暴至极的鸠摩智误将段誉当作宣泄爆体痛苦的仇敌，合身猛扑而上，枯瘦如铁的鹰爪五指死死锁住段誉颈项要穴，狂暴真气疯狂倾泻而出；段誉窒息受制，生死一线间本能抬手扣住其手腕诸穴以命相搏。鸠摩智陷入经脉濒临爆裂的极度癫狂重伤绝境，狂暴气劲封死退路，直接触发了两人气机相接的内力化解危局。",
  "事件概要": "鸠摩智因强练多派绝技致内息彻底失控，剧痛癫狂之下在狭窄井底狂暴发难。段誉舍身护住身后的王语嫣，却遭神智全失的狂僧合身猛扑死死锁喉。窒息绝境中，段誉本能扣住其手腕诸穴以命相搏，两股内劲顿时激荡相锁。",
