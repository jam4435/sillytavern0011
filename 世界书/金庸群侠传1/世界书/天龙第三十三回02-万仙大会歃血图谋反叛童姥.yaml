  "事件引子": "深谷祭坛前火光熊熊，数百洞主岛主杀气腾腾，群魔聚集共议破除生死符大计。",
  "事件详情": "万仙大会祭坛前火光摇曳、群魔汹涌，数百名洞主岛主齐聚的核心动机唯有一事——彻底推翻天山缥缈峰灵鹫宫的血腥残暴统治。原来三十六洞与七十二岛的豪强首领，数十年来皆被灵鹫宫至高主宰“天山童姥”以阴寒歹毒的独门暗器“生死符”残酷掌控。生死符一旦发作便奇痒剧痛钻心入髓，令人求生不得、求死不能，群豪每年唯有卑躬屈膝向灵鹫宫进贡重宝，方能乞得少许暂缓剧痛的解药，受尽非人折磨与无尽屈辱。安洞主当众扯开衣襟，露出胸口溃烂发黑的符印创口，声泪俱下痛陈惨状；乌老大猛然拔出长刀劈碎血酒坛，振臂厉呼童姥因神功反噬正逢三十年一度的返老还童期，如今内力功力尽失、形同废人幼童。“剑神”卓不凡与不平道人亦拔剑扬拂尘高声附和，煽动众人趁此天赐良机攻破灵鹫宫以夺取终极解药。在绝密情报与自由的强烈诱惑下，原本心存畏惧的群魔彻底抛弃退路，当场歃血为盟，正式结成生死攻守同盟，誓师大举杀上缥缈峰。",
