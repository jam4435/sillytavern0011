  "事件引子": "万籁俱寂，远处忽有轻柔歌声一字字逼近陆家庄；庄中众人严阵以待，却仍看不清踏歌来客会从何处出手。",
  "事件详情": "万籁俱寂中远处飘来轻柔歌声：'问世间，情是何物，直教生死相许？'歌声每近一字来人便近许多，未歇之时大门已砰然飞开。杏黄道袍的美貌道姑赤练仙子李莫愁缓步而入，拂尘挥处男仆阿根头颅碎裂而亡，两名婢女也瞬间毙命。陆立鼎夫妇与武三娘挥刀剑分从左右攻上，李莫愁一掠上了屋顶。她见陆立鼎出刀踢腿的架子宛然便是当年意中人陆展元的模样，心中酸楚情意缠绵，出招竟不如何凌厉。柯镇恶赶到加入战团，伏魔杖法固守门户。李莫愁暗赞这盲目跛足的老者接得住自己十余招，又忌惮郭靖黄蓉夫妇，对他手下容情。激斗间李莫愁突然回身一掌击中陆二娘小腹，又挥拂尘打在陆立鼎天灵盖上，两人顿时重伤倒地。她入庄搜寻程英陆无双不见踪影，放火烧庄，又连伤武三娘与柯镇恶——震断武三娘长剑、剑尖割断其头发，又伸手在武三娘脸上摸了一把；手掌按上柯镇恶胸口笑问'赤练神掌拍到你胸口啦'却终不下杀手。李莫愁格格娇笑，几个起落飘然而去。陆家庄烈焰冲天，陆氏夫妇气息奄奄，武三娘软瘫在地，柯镇恶胸闷难言。远处传来武三通的呼声：'娘子，你没事么？'",
  "事件概要": "李莫愁夜袭陆家庄并大开杀戒，陆立鼎等人被逼仓皇出逃，陆家庄自此覆灭。",
