  "事件引子": "拉开石门欲现丑闻，爱女现身哄堂大笑。",
  "事件详情": "正午时分已至，万劫谷中群雄云集，各派武林名宿皆在石室门前翘首以待。谷主钟万仇自以为阴谋得逞，满面得意洋洋之色，大摇大摆地率领满堂江湖豪客来到石室门前，企图当众揭开大理段氏的“乱伦丑闻”，让段正淳与段氏一脉在天下豪杰面前身败名裂。钟万仇清了清嗓子，运足内力向全场群雄大声宣布：“各位英雄请看，大理世子段誉正与其亲生妹子在此石室中苟合！”言毕，他狂笑着一把猛力拉开厚重的玄铁石门，招呼群雄探头向室内观瞧。满堂豪杰伸颈望去，只见石室之内，段誉虽衣冠不整、面带疲惫地盘坐运功，但其身旁安然坐着的女子，根本不是木婉清，而赫然是钟万仇平日视若掌上明珠的亲生女儿钟灵！钟灵被开门声惊醒，揉着惺忪睡眼走出石室，当着天下豪杰的面娇嗔埋怨道：“爹爹，你把女儿关在这黑屋子里作甚？”这突如其来的惊天反转令在场群雄面面相觑，随即全场爆发出一阵震天动地的哄堂大笑。钟万仇苦心设计的毒计反将自己亲女推上风口浪尖，搬起石头砸了自己的脚，一时羞愤交加、气急攻心，当场仰天喷出一大口鲜血，整个人瘫软倒地不省人事。",
  "事件概要": "起因：正午时分群雄云集门前，钟万仇得意洋洋宣布段氏乱伦丑闻并猛力拉开石门。发展：群雄探头见室内安然端坐者乃钟灵，钟灵揉眼走出娇嗔埋怨引发全场哄堂大笑。结果：钟万仇毒计反害亲女羞愤交加，气急攻心当场仰天狂喷鲜血瘫厥倒地。",
