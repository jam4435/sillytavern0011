  "事件引子": "大殿内怒威未消，偏殿帷幔重重，暗香浮动间辽帝近侍正低声传召神情恍惚的阿紫。",
  "事件详情": "大辽皇帝耶律洪基在金殿受拒后龙颜震怒，但他深知萧峰一身武功冠绝天下，在军中又极具威望，若强行在殿前发难必难将其制伏，反生大乱，遂在暗中定下一条阴险至极的毒计。耶律洪基敏锐地抓住了阿紫对萧峰盲目偏执、渴望长相厮守的爱恋心理，特意派遣贴身近侍秘密召见阿紫。近侍奉皇命将一杯暗藏无色无味慢性剧毒“圣水神药”的毒酒交到阿紫手中，巧言令色地对其谎称此乃灵验非凡的“长相守神仙水”，只要设法让萧峰悄悄饮下，便能使他彻底回心转意，从此抛却一切世俗军政纷争，永生永世陪伴在阿紫身侧不离不弃。阿紫心智单纯偏激且被执念蒙蔽，丝毫没有察觉皇帝的险恶用心与致命陷阱，毫无防备地将毒酒视作定情灵药收入囊中。至此，致命的剧毒完成了向阿紫手中的暗中流转，针对萧峰的隐秘阴谋彻底布局完毕。",
  "事件概要": "耶律洪基因萧峰抗旨而动杀机，忌惮其神勇遂生毒计。辽帝派近侍秘密召见阿紫，利用其对萧峰的痴狂执念，假托赠予能让萧峰回心转意、永不分离的“神仙水”，将暗藏慢性剧毒之酒赐予阿紫。阿紫受蒙蔽欣然领受，致命毒物遂落入其手。",
