  "事件引子": "静心殿内银烛摇曳冷光幽幽，白玉雕像绝美而立，二人相对屏息、气氛沉凝如冰。",
  "事件详情": "凝视着烛光下完美无瑕的绝美玉雕，段誉在巨大的心神震颤之中如梦初醒，缓缓踉跄后退三步，多年来盘踞于心头的浓重迷雾在此刻彻底烟消云散。他的视线在冰冷无言的白玉雕像与身旁焦虑憔悴的王语嫣之间反复审视，终于在电光石火间迎来大彻大悟：昔年在无量玉洞琅嬛福地中，自己对蒲团顶礼膜拜、磕下一千个响头所疯狂爱恋的，本质上只是这尊由人力精巧雕琢、不食人间烟火的无情白玉幻象；及至后来在曼陀山庄初遇相貌酷似玉像的王语嫣，自己便不由分说地将对虚幻“神仙姐姐”的全部崇拜、痴狂与病态执念，生硬强加在了活生生的王语嫣一人身上。多年来所谓的赴汤蹈火、舍生忘死与卑微追随，不过是一场对着虚妄影子自我感动的狂热迷执，自己从未真正懂得、理解和平视过王语嫣这个真实的凡俗女子。随着这一重最深层的心障被彻底粉碎击溃，段誉胸中那场持续数年的“心魔痴恋”如冰雪遇沸汤般瓦解冰消。他长长吐出一口浊气，原本满是痴狂的眼眸重归澄明清澈与通达超然，灵魂获得前所未有的彻底释怀与真正解脱。",
  "事件概要": "段誉在烛下审视神仙姐姐玉像与憔悴的王语嫣，如梦初醒般察觉自己多年痴恋的仅是无情玉雕幻象，强加于王语嫣身上的执念骤然瓦解，破除深重魔障重归澄明超然。",
