  "事件引子": "凭栏望月共数星霜，虚竹与银川公主依偎峰顶感念三生情缘。",
  "事件详情": "密室传功圆满大成之后，丐帮少年掌门携信物拜别下山，虚竹终于彻底完成了结义大哥萧峰生前的千斤重托。虚竹与银川公主李清露携手并肩，缓步登上天山缥缈峰的最高绝顶。绝顶之上天风浩荡、云海翻卷，极目远眺但见群山巍峨、天地苍茫一片。伫立于寒风之中，虚竹遥望中原与雁门关方向，心潮剧烈翻涌，昔日少室山前三兄弟不惧强敌、并肩浴血结拜的万丈豪情如在眼前，而大哥萧峰在雁门关为换取天下苍生和平而慷慨殉难的悲壮绝唱更令其痛彻心扉、唏嘘不已。李清露察觉虚竹心中的感伤与追思，轻步走近，伸出纤手温柔地握住虚竹的手掌，轻声予以体贴宽慰。虚竹转过身来，与心意相通的妻子深情相视，胸中的悲郁与波澜渐渐化为释然与宁静。二人深知红尘俗世的纷争与功名利禄终归虚妄，遂决意彻底放下凡俗羁绊，从此长久隐居在云海深处的天山灵鹫宫中。夫妻二人修真养性、逍遥长生，共同谱写了一段荡气回肠且超凡脱俗的逍遥仙缘。",
  "事件概要": "虚竹与梦姑携手立于缥缈峰顶（起因）；凭吊雁门前尘旧梦与冰窖奇缘（发展）；两心相印共度白头（结果）。",
