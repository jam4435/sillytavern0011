  "事件引子": "西夏皇宫冰窖内寒气彻骨，玄冰凝霜，幽暗深处透着强敌环伺的凛冽杀机。",
  "事件详情": "西夏皇宫幽暗寒冽的冰窖深处，天山童姥盘膝端坐于万载玄冰之上，为防范强敌李秋水追杀并早日重返灵鹫宫，急需借助午时三刻的至阳之气冲关复功。虚竹满怀慈悲与无奈，奉上自皇宫御苑中捕获的活鹿。童姥右爪疾如闪电，刹那间撕裂鹿颈，伏身暴饮滚烫腥甜的活鹿热血。面对虚竹闭目合十、连诵往生咒的不忍之态，童姥厉声喝骂其迂腐蠢笨，随即掷下干瘪鹿尸，双手翻飞结出“八荒六合唯我独尊功”的纯阳印诀。她体内雄浑真气如怒涛奔涌，头顶三尺升腾起白蒙蒙的护体水汽。借由滚滚精血顺经脉流转周天，童姥咬牙硬抗骨髓深处的撕裂剧痛，使得耗损的功力以每日恢复一年的骇人速度急剧攀升。神功催动之下，她原本退化如八九岁幼女的身形迅速发生惊人蜕变：骨节劈啪作响，四肢抽条拔高，肌肤蜕去枯死表皮而变得晶莹如玉，短短数日间便长成十五六岁身段婀娜的妙龄少女模样，唯有眉宇间煞气与尊威愈发浓烈，鹿血生机彻底转化为周身磅礴罡气。",
