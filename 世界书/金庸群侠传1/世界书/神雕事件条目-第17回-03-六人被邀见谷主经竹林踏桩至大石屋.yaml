  "事件详情": "杨过回到石屋，尚未进门便听马光佐大嚷清水青菜难果腹，又说那些又苦又甜的花瓣吃了是谋财害命。尹克西笑劝马光佐把宝贝收起，说谷主不怀好意。杨过进屋见桌上堆了几盘情花花瓣，人人吃得愁眉苦脸，想起金轮法王这大和尚也受情花之累，不禁暗暗好笑。随即门外脚步声响，进来一个绿衫人拱手躬身，说谷主有请六位贵客相见。法王、尼摩星等人均是一派宗师，不论到何处主人总是亲自远迎，如今来到深山幽谷之中主人却如此无礼，各人都是心头有气。六人随绿衫人向山后走去，行出里许忽见迎面绿油油一大片竹林，北方极少见。七人在绿竹篁中穿过，闻到阵阵花香，烦俗尽消。穿过竹林后一阵清香涌至，眼前无边无际全是水仙花——地下是浅水塘深不逾尺种满水仙。水塘中每隔四五尺便是一个木桩，引路的绿衫人身形微晃纵跃踏桩而过。六人依样而为，只有马光佐身躯笨重轻功又差，踏倒几根木桩后索性涉水而过。青石板路尽处，遥见山阴有座极大石屋。",
  "事件概要": "六人被引入石屋见谷主，绝情谷的规矩与神秘主人开始正式压到众人面前。",
