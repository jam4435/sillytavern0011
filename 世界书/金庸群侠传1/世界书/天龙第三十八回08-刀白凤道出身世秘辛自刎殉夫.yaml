  "事件引子": "花厅内血腥弥漫，段正淳横尸血泊，刀白凤抚尸恸哭，满堂杀伐之气骤然凝滞。",
  "事件详情": "段正淳之正妃刀白凤亲眼目睹夫君拔剑自刎殉情，悲痛欲绝，泪如泉涌。眼见昔日恩爱情仇尽皆化作满堂惨烈尸骸，刀白凤自知大势已去，万念俱灰之下亦不愿独自苟活于世受辱。在临死之前，刀白凤含泪面向在场的段延庆与众人，毅然揭开了深埋心底二十余年的惊天秘辛：当年在天龙寺外菩提树下，与她一夜欢好的肮脏残疾乞丐正是段延庆，段誉根本不是段正淳所生，而是段延庆的亲生骨肉！这一石破天惊的身世真相如晴天霹雳般震撼了全场，让段延庆数十年积压的怨毒与复仇执念瞬间彻底瓦解崩溃。刀白凤在吐露身世秘辛之后再无挂碍，神情凄楚而决绝，当场拔出随身佩带的短剑引颈自刎，追随夫君段正淳殉情而去。段正淳夫妇双双惨烈毙命，令曼陀山庄局势陷入前所未有的剧烈震荡与极度混乱之中。",
