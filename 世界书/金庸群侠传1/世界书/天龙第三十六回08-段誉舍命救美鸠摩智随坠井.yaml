  "事件引子": "荒原深夜死寂无声，枯井深处骤然响起凄厉惊恐的少女惨叫，撕裂了沉沉夜幕。",
  "事件详情": "王语嫣下坠时的凄厉惨叫声划破夜空，正在附近带伤寻找的段誉闻声大惊失色。段誉甚至来不及细想枯井到底有多深、井底有何凶险，出于对王语嫣舍生忘死的深情与护持之心，毫不犹豫地施展轻功，纵身向着漆黑阴森的枯井深处飞扑跃下，誓要以肉身护住心上人的周全。与此同时，一直在暗中窥伺觊觎的吐蕃国师鸠摩智亦现身于附近，他误以为枯井之中藏有绝世罕见的武学秘籍与神功图谱，贪念大炽之下不甘落后，施展身法紧随其后纵身跃入井中，企图抢夺机缘。三人接连坠入冰冷刺骨、漆黑不见五指的枯井底部。这一突发变故使得大理世子、姑苏佳人与吐蕃国师同时困于逼仄深井之内，重伤未愈与贪念交织，彼此立场错综复杂。一场奇绝玄妙、惊心动魄的枯井奇缘，就在这冰冷黑暗的深井底部悄然拉开了序幕。",
  "事件概要": "闻得王语嫣坠井呼号，段誉不顾伤痛舍命扑入深井相护；暗中窥伺的鸠摩智误认井下藏有武学秘籍，贪念驱使下亦纵身随坠。三人相继跌入阴寒逼仄的枯井底部，因缘际会同陷死地。",
