  "事件引子": "一人一骑踏碎秋霜，乔峰携阿紫深入长白山密林求参。",
  "事件详情": "强忍着撕心裂肺的哀思收敛心神后，乔峰低头望向瘫软在血泊旁、面容泛黑且气息极度微弱的阿紫。阿紫此前被星宿派毒掌所伤，体内剧毒与阴寒内劲交织反噬，周身经脉寸寸受损，已然气若游丝、命悬一线。乔峰看着这张与阿朱容貌隐隐有几分相似的面孔，耳畔再次回响起阿朱临终前握着自己的手泣血托孤的叮咛与嘱托。阿紫虽行事乖张狠毒，但终究是阿朱留在人世间唯一的同胞妹妹，更是阿朱生命的血脉延续。乔峰历来顶天立地、一诺重于泰山，为了恪守对挚爱许下的临终诺言，哪怕前路布满刀山火海，他也誓要倾尽全力保住阿紫的性命。乔峰当机立断不再沉溺于悔恨，快步上前运起精纯浑厚的降龙真气注入阿紫背心大穴护住其脆弱心脉，随即解下自己宽大的厚重鹿皮外袍将重伤昏迷的阿紫严密包裹，稳稳背负在宽阔坚实的脊背之上，顺手提起桌旁尚存的行囊水囊。乔峰毅然决然迈开大步跨过门槛，在呼啸凛冽的夜风中迎着苍茫夜色一路向北飞驰，正式踏上了前往关外极北苦寒之地寻药求医的漫漫流亡长路。",
  "事件概要": "乔峰抱阿紫跨上骏马离开中原是非之地（起因）；一路长途跋涉翻山越岭赶赴极北冰寒荒原（发展）；进入长白山崇山峻岭寻觅老参续命（结果）。",
