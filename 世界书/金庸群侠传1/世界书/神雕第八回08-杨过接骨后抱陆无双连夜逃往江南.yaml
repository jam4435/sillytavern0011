  "事件详情": "李莫愁师徒当真走了。杨过轻轻将陆无双平放草地，点她麻软穴后解她衣衫接骨。解开外衣后露出月白内衣和杏黄色肚兜，杨过情窦初开闻到处女体香一颗心怦怦而跳。他解开肚兜看到乳酪般的胸脯竟不敢触摸，被陆无双怒骂才伸手摸到两处断骨仔细对准，用四根树枝分前后绑牢固定。陆无双睁开眼见月光下杨过双颊绯红正偷瞧她脸色，与他目光一碰他急忙转头。陆无双此时看出杨过实非常人，但起始就对他轻视嘲骂现下纵然蒙他相救也不肯改颜尊重。她求杨过送她去江南，杨过心道要寻姑姑。陆无双脸色一沉说你快走让我死在这儿。杨过见她眉含秋霜目蕴怒色依稀便是小龙女生气模样不由得难以拒却，叹了口气俯身将她抱起。他脚下迅捷上身稳然不动全没震痛陆无双伤处，轻功竟不在李莫愁之下。不久东方渐白，陆无双见他虽面上肮脏却是容貌清秀双目灵动有神，不由心中一动。来到小市镇杨过找饭店要了饭菜，陆无双嫌他满身牛粪叫他坐远些。正吃饭间门外来了四个丐帮化子唱莲花落讨饭，实是来寻陆无双问弯刀之事。杨过趁给陆无双抹汤时左手扬出四根竹筷分射四丐臂弯打碎他们的碗。四丐不知底细惊疑而退。杨过买了驴子让陆无双骑行，陆无双知丐帮徒众在前路守候便决定走小路经竹林关南下。刚出市集一个农家小孩跑来说陆姑娘有件物事给你，递上一束油菜花内夹一信笺上写尊师转眼即至即速躲藏切切。二人正惊疑间吹打声响迎面来了一乘迎亲花轿。杨过心念一动问道你想不想做新娘子。",
