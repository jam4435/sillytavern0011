  "事件引子": "寒风呼啸掠过隐蔽雪谷，倒卧残雪的辽帝面色惨白，数支箭创不断渗出幽蓝毒血。",
  "事件详情": "击溃叛军残部后，辽帝耶律洪基毒伤发作、面色惨白。乔峰为保其性命，立即背负重伤的辽帝转移至隐蔽安全的雪谷深处，暂避敌军探子。乔峰将耶律洪基扶坐于地，伸手稳准迅捷地拔出其身中数支幽蓝淬毒箭矢，随即双掌抵住辽帝背心大穴，倾注精纯无比的内力为其逼毒疗伤，平复体内翻江倒海的毒气与郁血。耶律洪基缓过气来，惊魂初定，见乔峰不仅有万夫不当的盖世神功，眉宇间更透出契丹男儿特有的雄健豪迈之气，心中激赏万分，遂出言探询恩人来历。乔峰坦诚告知自己原在中原长大，实为契丹萧氏遗脉。耶律洪基闻讯大喜过望，感叹这是长生天赐予契丹的绝世英雄与皇室救星。为表推心置腹与永不相负之意，耶律洪基当场拔刀斩马祭天，在苍茫雪原之上立下重誓，要与乔峰义结金兰。二人于雪野歃血为盟，正式结为生死与共的异姓兄弟，耶律洪基年长居长兄之位，乔峰为义弟，辽帝的毒伤在纯阳内力救治下转危为安，双方定下平叛复位的大计。",
