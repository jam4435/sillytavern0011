事件名称: 奇遇事件-神雕-山洪巨浪炼重剑
事件地点: 大宋/襄阳城外/独孤剑冢荒谷
触发条件:
  全部:
  - 变量: 角色数据.神雕.好感
    大于等于: 80
  - 变量: user数据.境界.大境界
    等于: 二流
  - 变量: user数据.武功.玄铁剑法.掌握程度
    存在: true
事件持续时间:
  时: 4
事件引子: 荒山连降数日暴雨，万斤山洪自断崖轰鸣倾泻，神雕仰天长鸣，将你推向激流中心……
事件概要: 玩家手持玄铁重剑在齐胸山洪巨浪中逆流挥劈，借千钧水势顿悟举重若轻的发力玄机，玄铁剑法精进至略有小成。
事件详情: 深山暴雨如注，怒涛裹挟断木巨石狂泻而下。神雕鸣叫督促，振翅将手提玄铁重剑的玩家推入汹涌山洪的漩涡深处。水流如万马奔腾扑面而来，玩家沉腰下马，提剑在激流中逆水横斩直刺。神雕在崖上振翅呼应，浪涛一次次击中剑身与胸膛。玩家顺应水流推拉阻力，内力收发自如，终于领悟重剑在狂涛中借力打力的‘举重若轻’精微窍门。
参与人物:
- 玩家
- 神雕
insert: {}
update:
  user数据:
    修为: '+3000'
    武功:
      玄铁剑法:
        掌握程度: 略有小成
delete: {}
