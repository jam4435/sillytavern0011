  "事件引子": "数千铁骑直插关山，天下群豪护卫乔峰疾驰抵雁门关前。",
  "事件详情": "救出萧峰之后，联军深知大辽国都乃虎狼之地，辽军精锐随时可能四面围堵，必须争分夺秒撤离险境。大理三公、四护卫、灵鹫宫诸部与少林丐帮豪侠紧紧拥簇在重伤的萧峰周围，段誉与虚竹更是左右护持。群雄同心协力、杀伐果决，一路挥舞兵刃撕开皇宫残兵的拦截，浴血奋战冲破南京城门，夺路杀出大辽京师。脱离南京城后，联军数万人马不敢有丝毫懈怠，携带着萧峰一路向南星夜兼程、疾驰狂奔。途中虽有各路辽军游骑探哨尾随骚扰，但在天下英雄联军严密的防御与凌厉的反击下尽被击溃。群雄风餐露宿、昼夜不息，全速撤向宋辽边界的关键关隘——雁门关。然而当疲惫不堪的联军终于赶到雁门关峡谷前时，却发现前方厚重的关隘大门紧闭，大军只能滞留在悬崖峭壁林立的峡谷之下，退路暂被阻隔。",
