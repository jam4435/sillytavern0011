  "事件引子": "晨雾弥漫的杏子林中，数百名丐帮弟子手持钢刀长杖列阵肃立，杀气凛冽，静候帮主入林。",
  "事件详情": "次日清晨，杏子林中晨雾未散，数百名丐帮弟子手持钢刀长杖列阵而立，杀气腾腾。乔峰孤身步入林中，全冠清自恃有人多势众与长老撑腰，率先按捺不住，越众而出厉声质问帮主专断。面对挑衅，乔峰面沉似水，浓眉微挑，冷峻喝问其幕后主使。全冠清心虚之下抢先发难，腰间精钢长剑铮然出鞘，化作一道森寒银光直刺乔峰咽喉。乔峰身形巍然不动，待剑尖欺至胸前三寸，猛然长啸一声，体内沛然莫御的九成降龙内力轰然爆发！排山倒海般的掌风呼啸横扫，护在全冠清身侧的数名舵主弟子被狂暴气劲震得筋骨剧痛、兵刃脱手齐齐倒飞跌出。乔峰掌势变幻若神，右臂如蛟龙探爪自剑影中穿透而出，五指精准如铁箍般死死扣住全冠清手腕脉门。全冠清妄图运劲挣扎，乔峰内劲一吐，强横真气瞬间透穴而入，震散其护体真元并封死其周身气脉。全冠清佩剑当啷坠地，面如金纸瘫倒在地沦为阶下囚，全场叛众目睹帮主神威，尽皆胆寒失色，不由自主地收起兵刃向后溃退。",
  "事件概要": "乔峰孤身步入杏林，八袋舵主全冠清仗势挑衅并拔剑突袭咽喉。乔峰九成降龙内力爆发震飞合围帮众，电光石火间扣住全冠清脉门并封死其周身气脉，生擒首恶，当场震慑全帮叛逆。",
