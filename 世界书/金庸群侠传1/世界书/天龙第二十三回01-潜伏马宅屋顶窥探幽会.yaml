  "事件引子": "夜伏屋顶窥探密室，乔峰暗察康敏与奸夫阴谋。",
  "事件详情": "为了彻查当年雁门关血案的幕后元凶以及阿朱替死青石桥的千古奇冤，乔峰强忍满腔悲怆，携重伤初愈的阿紫悄然潜回洛阳城马大元故宅。夜幕沉沉，细雨初歇，二人施展绝顶轻功如飞絮般无声掠上正房屋脊。乔峰伏低身形，指尖微吐纯阳真气，悄无声息地揭开两片青黑厚瓦，俯身向下窥视。昏黄如豆的油灯下，马夫人康敏身披半敞的雪白孝服，娇躯半倚在软榻之上，丐帮执法长老白世镜则垂手立于紫檀案旁，额间冷汗如注。白世镜因背弃结义兄长马大元而神情惶惑不安，双拳攥得指节发白；康敏却眉眼含春、神态自若，娇声细语中透着刺骨的阴狠。她步步进逼，冷笑斥责白世镜胆小怯弱，以两人昔日的私通苟且之事相要挟，声色俱厉地逼迫白世镜必须在丐帮大会上联手全冠清，设下毒计彻底除掉心腹大患乔峰。白世镜在江湖清誉、兄弟道义与妖妇淫威间痛苦挣扎，终究在康敏的威逼利诱下颓然低头，咬牙应承。屋顶之上，乔峰双目如电，与身旁屏气凝神的阿紫冷眼旁观，暗运内力稳固瓦垄，未惊动下方的奸夫淫妇，将这场见不得光的密谋幽会全盘纳于监视之中，精准锁定了揭开冤案的核心人证。",
