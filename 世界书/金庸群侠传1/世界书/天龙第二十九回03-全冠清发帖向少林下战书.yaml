  "事件引子": "君山总舵大厅内墨香混着阴寒之气，血红战笺铺展案头，杀机暗涌。",
  "事件详情": "成功扶植庄聚贤登临帮主宝座后，全冠清的权势野心极度膨胀，企图借助这位傀儡帮主的绝世神功彻底吞并禅宗祖庭少林派，进而实现由丐帮一统中原武林的狂妄霸业。丐帮总舵议事大厅内，全冠清亲自研墨铺展血红色的挑衅战笺，在信帖中极尽狂妄之能事，大肆贬低少林七十二绝技已沦为花拳绣腿，正式宣称丐帮定于少室山大雄宝殿前与少林寺一决雌雄，争夺天下唯一的武林盟主至尊之位。庄聚贤如僵尸般面无表情伫立一旁，依全冠清授意运转冰蚕阴劲，挥指如刀在信笺末端硬生生烙印下一道深凹且泛着森森寒霜的掌印作为战约凭证。全冠清狞笑着招来数十名精悍快马信使，厉声吩咐他们分头出发，将拜山血帖以雷霆之势送往少林寺玄慈方丈案头，并抄送大江南北各大武林门派。少林寺接获战帖后阖寺震动，玄慈方丈批复开山迎敌，天下各派亦群情鼎沸。这道战帖彻底撕碎了江湖维持数十年的平静，各方豪强纷起响应，少室山一场决定武林气运归属的巅峰血战正式拉开帷幕。",
  "事件概要": "全冠清野心膨胀，欲借傀儡帮主庄聚贤之威吞并少林、一统武林。他在丐帮总舵手书挑衅战帖，令庄聚贤烙下极寒掌印为据，遣信使广发天下并送达少林。玄慈方丈阅帖后批复开山迎敌，少室山巅峰对决之势骤成。",
