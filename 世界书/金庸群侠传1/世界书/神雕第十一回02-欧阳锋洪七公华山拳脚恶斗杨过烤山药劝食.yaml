  "事件详情": "五丑退走后，欧阳锋翻身正立斜眼望着洪七公，依稀相识，喝道：'你武功很好啊，你叫什么名字？'洪七公知他十余年前发疯之后始终未曾痊愈，便说自己叫欧阳锋、反问他叫什么名字。欧阳锋心头一震，觉得'欧阳锋'三字好熟，却实在想不起自己名字。洪七公笑道：'你名叫臭蛤蟆。'欧阳锋虽神智混沌，但与洪七公数十年的死仇深印于脑，自然而然见到他就生气，大吼一声扑将上来。洪七公不敢怠慢，出手就是降龙十八掌。两人襟带朔风、足踏寒冰，在这宽仅尺许的窄道上各逞平生绝技倾力以搏——一边是万丈深渊，稍有差失便是粉身碎骨之祸。二人年事已高，武学修为却俱臻炉火纯青之境，招数精奥深得醇厚稳实之妙诣，只拆得十余招便都心下钦佩。杨过见地势险恶，但见二人虽在凌厉攻击之下总能化险为夷，便潜心细看奇妙武功。堪堪拆到千余招，二人都感气喘心跳手脚迟缓。杨过叫道：'两位肚子饿了，来饱吃一顿再比如何？'洪七公听到'吃'字立即退后连叫'妙极'。杨过提来五丑留下的冻鸡冻肉，洪七公抢过冻鸡大口咬落吃得格格直响。杨过递冻肉给欧阳锋柔声说：'爸爸，你就是欧阳锋。这位洪老前辈是好人，你别跟他打架了。'欧阳锋却指着洪七公说：'他是欧阳锋，欧阳锋是坏人。'洪七公大笑说不错欧阳锋该死。杨过服侍欧阳锋吃了些食物后向洪七公求情别跟患病的义父为难，洪七公连连点头。不料欧阳锋突然跃起叫道不比拳脚比兵器，折树枝为棍棒向洪七公击落。洪七公也拾起树枝使出打狗棒法外的种种精妙棒法。二人从拳脚到兵刃直斗到傍晚，兀自难分胜败。杨过见满山冰雪极是滑溜，在山野间挖山药烤得喷香。洪七公闻到香气叫道要吃东西奔到杨过身旁抓起山药便吃，欧阳锋举杖劈下时洪七公抛去山药叫道'吃罢'，欧阳锋一呆顺手接过便吃，浑忘了适才的恶斗。当晚三人就在岩洞中睡觉。",
