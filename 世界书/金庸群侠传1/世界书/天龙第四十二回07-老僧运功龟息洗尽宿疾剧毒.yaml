  "事件详情": "少林寺后山幽静草地之上，微风拂动草木，四下寂静无声。扫地老僧将萧远山与慕容博并排平放于草地之间，其先前出手击杀两人的慈悲深意终于彻底显露——唯有通过假死闭气之法，方能彻底洗髓伐毛、化解体内经络深处的宿疾。老僧神情肃穆安详，双手互按在萧远山与慕容博头顶百会穴之上，沛然运起少林无上佛门神功。醇厚纯净的佛门真气如春风化雨般源源不断灌入二人顶门，以玄妙莫测的假死龟息之法洗涤二人体内积攒了三十年的凶煞戾气与经脉剧毒。在无上佛门神功的反复冲刷与滋养下，二人受损郁结的经脉逐渐舒张平复，体内剧毒与戾气尽数消解，冰冷的体温亦渐渐回暖。片刻之后，萧远山与慕容博双双眼睫微颤，悠悠从假死状态中苏醒转来。二人只觉体内三十年的陈年顽疾尽数消融，周身经脉清爽通透，内息变得前所未有的纯正清纯。",
