  "事件引子": "雷电交加狂风呼啸，乔峰狂怒发掌击中易容阿朱胸膛。",
  "事件详情": "夜色如墨，狂风呼啸，暴雨倾盆而下，雷电交加撕裂苍穹。在小镜湖青石桥头，狂风卷着暴雨肆虐，湖面波涛翻腾，四野一片肃杀。乔峰身着一袭粗布长袍，宛如铁铸铜浇的巍峨山岳般孤身傲立于桥头的狂风暴雨之中。三十年前雁门关外惨遭屠戮的父母血仇，化作滔天煞气在乔峰胸中激荡汹涌，他双目如炬凝视着前方长道，在此严阵以待，誓要在此地手刃依约前来领受死期的大理镇南王段正淳。时至三更时分，漆黑天幕中猛然划过一道惨白刺目的惊雷电光，瞬间照亮了青石桥尽头缓步走来的一道身影。只见那人身披蓑衣，头戴竹斗笠，颌下长须飘飘，头顶隐现紫金冠带，其行止身姿与面容轮廓在风雨雷电交加的幽暗视线中，俨然正是大理镇南王段正淳。乔峰见大仇人当真孤身赴约受死，积压多年的父母深仇与万丈怒火瞬间彻底引爆，周身杀气勃发，桥头决战之局一触即发。",
