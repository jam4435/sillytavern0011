  "事件详情": "少室山少林寺外残阳如血，中原群雄散尽，古刹前一片凄清。玄慈自受杖刑圆寂、叶二娘殉情自戕，虚竹身世大白却骤失双亲，悲恸难抑，但他谨记父母临终前教其立身从善的嘱托，决意收敛心神承担起灵鹫宫尊主重任。虚竹强忍泪水向少林山门三叩首，转身步至山下阵前。九天九部侍女及附属部众黑压压肃立待命，余婆与符敏仪率众躬身抱拳：“请尊主示下！”段誉见虚竹面带戚容，快步上前扶住其臂膀温言道：“二哥莫忧，小弟愿率大理随从伴兄西行。”虚竹心中感念，合十还礼。面对前路茫茫，虚竹毅然斩断徘徊，接过符敏仪双手呈上的七宝灵鹫令符与随身佩剑，翻身上马下达拔营号令。灵鹫宫九部众刀剑归鞘、严整结阵护卫两侧，段誉引大理铁骑随行相顾，车马辎重齐备，浩浩荡荡踏上远离中原、迢迢西赴天山缥缈峰之路，确立了虚竹统领缥缈峰的全新格局。",
