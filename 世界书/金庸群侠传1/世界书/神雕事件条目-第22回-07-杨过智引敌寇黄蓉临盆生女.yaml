  "事件详情": "杨过与法王缠斗之际见小龙女正力战潇湘子尼摩星二人，又见达尔巴霍都围攻朱子柳。法王连声叫阵要激郭靖出来见始终不应，于是纵火烧屋连点了四五处火头才回屋顶。杨过心急如焚——郭靖受伤沉重黄蓉临盆在即大火一起两人必受火困。他向潇湘子急刺两剑后跃下屋顶冒烟突火来寻郭靖夫妇。黄蓉坐在郭靖床边窗中浓烟冲入却神色自若见杨过进来只微微一笑。杨过心念一转低声道'我去引开敌人你快扶郭伯伯去安稳所在暂避'说着伸手揭下郭靖头顶帽子越窗而出。黄蓉正要扶郭靖换地方腹中一阵剧痛——连日惊动胎息竟催得孩子提前出生了。杨过跃出窗口跃向一名灰衣小兵身后点其穴道将郭靖帽子往他头上一罩负在背上提剑跃上屋顶。法王见杨过负着郭靖向西北急逃当即撇下郭芙发脚追去，潇湘子尼摩星达尔巴霍都朱子柳也随后赶去。杨过背着假郭靖在屋顶奔驰一阵又跃下在小巷中东钻西躲大兜圈子与法王捉起迷藏。达尔巴截住杨过被杨过闪过，法王银轮掷出掠过假郭靖肩头划了一道口子。杨过冲出巷头潇湘子拦在巷口尼摩星站在墙头。杨过心想拖延已久郭靖黄蓉定已脱险，反手抓起背上小兵往尼摩星手中一送叫道'郭靖给你'。尼摩星惊喜交集抱住，潇湘子和达尔巴前来争夺三人分别拉住小兵手足用力拉扯——三人全是力大异常将小兵拉成了三截。帽子落下三人看清原来不是郭靖登时呆在当地做声不得。杨过早就趁机脱身不知去向。法王见三人呆住骂道'呆鸟'又去追赶杨过。黄蓉在屋中产下婴儿郭襄——婴儿哇哇啼哭之声传出。郭芙喜道'妈妈生了弟弟啦'一跃下地。小龙女好奇心起跟着进屋去瞧黄蓉的孩儿。",
