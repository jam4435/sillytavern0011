  "事件引子": "张灯结彩喜迎世子归，显贵王府温情迎佳人。",
  "事件详情": "大理镇南王府中张灯结彩，处处洋溢着喜气洋洋的欢庆氛围。离家出走多日的世子段誉终于平安折返，王妃刀白凤见独子安然无恙，顿时喜极而泣，镇南王段正淳眼见儿子归来，心中亦是欣慰不已。木婉清一袭江湖装束，跟随段誉一同踏入镇南王府。她放眼望去，但见王府重门叠户、富贵森严，段正淳渊渟岳峙、威严庄重，刀白凤华服盛装、雍容华贵。木婉清自幼生长于幽谷僻静之地，初入这等显贵深府，面对威仪具足的王爷与王妃，心中不由自主地泛起阵阵拘谨与戒备。然而段正淳与刀白凤爱屋及乌，不仅未有丝毫轻慢，反而对她礼遇有加，奉为上宾亲自迎纳。段誉在旁殷勤引见，细心关照，使木婉清感受到王府上下真切的接纳与温情，心下的紧张与拘束遂慢慢平复消解，坦然留宿于府中，促成了段誉携佳人归家团聚的圆满开局。",
  "事件概要": "起因：世子段誉离家多日平安归府，王府张灯结彩，段正淳欣慰且刀白凤喜极而泣。发展：木婉清初入显贵深府心生拘谨戒备，王爷王妃礼遇有加且段誉在旁殷勤引见关照。结果：木婉清感受温情戒备平复坦然留宿，促成段誉携佳人归家团聚的圆满开局。",
