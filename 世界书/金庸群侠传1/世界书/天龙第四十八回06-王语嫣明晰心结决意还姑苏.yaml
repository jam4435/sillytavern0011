  "事件引子": "一代圣僧著述立说，鸠摩智散尽武功重修佛经名扬雪域西陲。",
  "事件详情": "伫立在玉雕像与摇曳烛光之旁的王语嫣本就聪慧绝顶、心思玲珑，她立刻敏锐地察觉到了段誉神情与周身气场的巨大剧变。王语嫣侧过身迎向段誉的目光，清晰地看到段誉望向自己时，往昔那股近乎盲目盲从的痴狂与卑微炽热已然荡然无存，取而代之的是一种清澈见底的平静、坦荡与大彻大悟。冰雪聪明的王语嫣瞬间洞悉：段誉已然看透了玉像与自己的替身纠葛，二人之间维系多年的虚幻情愫在此刻彻底破裂。面对这份已然变质的缘分，王语嫣并未哭闹怨尤，心中反而如释重负般浮现出远在中原、神智癫狂且受尽孩童嬉笑欺凌的表哥慕容复，以及在侧苦苦支撑相伴的侍女阿碧。经历繁华过眼与大理深宫的虚幻，王语嫣毅然作出决断：她绝不愿留在异乡深宫中充当他人的幻影替身，决意重返故里江南姑苏，回到落魄疯癫的表哥身旁，与阿碧一同长相厮守，用余生悉心照料残生的表哥以偿还青梅竹马的情意。王语嫣整肃衣襟，神色沉静而坚定地向段誉敛衽万福，当面陈明辞别之意与东归姑苏的决绝心愿。",
  "事件概要": "鸠摩智归国后闭门译经（起因）；将毕生武学执念化为佛学著述（发展）；成为一代吐蕃得道高僧（结果）。",
