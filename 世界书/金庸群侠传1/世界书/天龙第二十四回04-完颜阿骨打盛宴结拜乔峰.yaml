  "事件引子": "篝火熊熊烈酒如泉，女真全族杀牛宰羊欢庆神勇勇士。",
  "事件详情": "雪原虎尸旁，惊魂甫定的女真猎人们纷纷抛下手中骨矛，跪伏于雪地对乔峰顶礼膜拜。部落年轻首领完颜阿骨打亲睹乔峰掌毙双虎的盖世神威，心中震骇佩服之至，热情拉住乔峰臂膀，诚挚邀请其移步女真大营。营地中央燃起数堆熊熊篝火，族人们宰杀肥美牛羊，架在火上炙烤得油脂滋滋作响。阿骨打双手捧起盛满醇烈烧酒的大号牛角海碗，躬身敬奉给乔峰，高声赞叹：“壮士神勇，真乃天降雄鹰！”乔峰豪情顿起，接过大碗仰头一饮而尽，两人随即在篝火旁大口嚼肉、大碗饮酒，言谈间意气相投。席间阿骨打一时兴起与乔峰徒手角力，双手刚触及乔峰衣袖便被其如渊海般的内力震得气血翻涌，彻底为之折服。阿骨打心潮澎湃，毅然拔出腰间锋利的短刀划破掌心，郑重提议跨越族裔界限结为生死兄弟。乔峰为阿骨打的坦荡血性所打动，亦拔出佩刀划指沥血入酒碗。二人八拜叩首、共饮血酒，并交换贴身佩刀以为信物。乔峰自此成为阿骨打生死相托的义兄，在女真部落中赢得了至高无上的崇敬地位。",
