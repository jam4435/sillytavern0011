  "事件详情": "黄蓉正要从杨过房中走出时听到屋顶喀的一声轻响，左掌一挥灭了烛火。杨过惊觉有警立时振奋要起身御敌，小龙女抽出君子剑挡在他身前。屋顶上金轮法王弟子霍都王子朗声笑道'小可前来下书，岂难道南朝礼节是暗中接见宾客么'。黄蓉伶牙俐齿回道'南朝礼节因人而施，于光天化日之时接待光明正大之贵客，于烛灭星沉之夜会晤鬼鬼祟祟之恶客'。霍都语塞跃下庭中递上金轮法王的战书。黄蓉挥出竹棒倏地点向霍都面门，霍都后跃时棒端粘劲已将书信取走。黄蓉因分娩在即不愿见外客始终不露面。霍都锐气已挫正欲离去，黄蓉顺手拿起茶壶向外一抖，一壶热茶自壶嘴如一条线射出击中霍都颈中胸口。霍都只道中了厉害毒水惊魂未定，黄蓉竹棒施展打狗棒法'绊'字诀一棒快似一棒，霍都脚下如陷泥沼绊倒爬起又是一交摔倒，黑暗中摔得鼻青目肿。武氏兄弟闻声赶到，黄蓉命他们将小贼擒下。霍都情急智生假装摔得甚重躺地不起，武氏兄弟扑下时被他铁骨折扇点了穴道推出挡住黄蓉竹棒，飞身上了墙头。黄蓉笑道'你身上既中毒水旁人岂能再伸手触你'，霍都心胆俱裂。黄蓉随意编了个'子午见骨茶'的毒名，说得只要肌肤中一滴便全身溃烂见骨子不过午午不过子还有六个时辰可活。霍都素知黄蓉智计无双武功又强，其父黄药师精于药理，调制这等毒药自是易如反掌。他再也顾不得身份骨气跃下墙头一躬到地求恕罪。黄蓉弹出一颗九花玉露丸说是解药，霍都急忙服下只觉一股清香直透丹田全身舒泰。他气焰全消缓缓倒退至墙边翻墙急速出城。黄蓉解开武氏兄弟穴道，想起霍都那句'好脓包的徒弟'虽以计挫敌心中殊无得意之情，牵得腹中隐隐作痛当下坐在椅上调息半晌。",
