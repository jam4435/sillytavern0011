  "事件详情": "法王与尼摩星恶斗方酣之际山后冲出一彪蒙古骑兵。旗影下一人驻马观斗后催马上前叫道'罢手罢手'——那人科头黄袍手持铁弓正是忽必烈。尼摩星双掌齐推巨岩滚下山坡停手罢斗。忽必烈翻身下马左手携法王右手携尼摩星笑说'原来两位在这儿切磋武功真令小王大开眼界'——轻轻一言揭过二人真斗。他见小龙女美貌心下暗惊人间竟有如此女子，问杨过这姑娘是谁——杨过坦然道'这位龙姑娘是小人的授业师父也是小人的妻子'。忽必烈笑道'果然是郎才女貌天生佳偶妙极妙极'举碗为二人庆贺。小龙女听蒙古王爷称自己与杨过乃是良配心花怒放——'那些汉人都说我和过儿成不得亲这位蒙古王爷却连说妙极瞧来还是蒙古人见识高呢'。忽必烈说起襄阳战事皱眉道'襄阳守将吕文德本是庸才小王所忌者郭靖一人耳'。杨过心中一凛站起身来——'这姓郭的与小人有杀父大仇小人请命去刺死了他'。忽必烈大喜——但说屡遣勇士行刺均遭失手或擒或死无一得还。欲请众位英雄一齐混入襄阳并力下手——'只消杀了此人襄阳唾手可下'。法王潇湘子等一齐站起叉手应命。忽必烈又许诺——'不论是哪一位刺杀郭靖同去的几位俱有大功但出手刺杀之人小王当奏明大汗封赏公侯世爵授以大蒙古国第一勇士之号'。潇湘子尼摩星等人虽对公侯世爵不怎么放在心上但若得称大蒙古国第一勇士名扬天下实乃平生之愿——人人振奋连金轮法王也是眼发异光。杨过凄然一笑缓缓摇了摇头——小龙女深情无限望着他心中却道'要他什么公侯世爵什么天下第一勇士我只盼你好好的活着'。众人上马跟在忽必烈之后疾趋南驰往襄阳而来。",
