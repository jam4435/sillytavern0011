  "事件引子": "密林古道间杀气森然，远处官道骤起惊雷般的铁骑轰鸣与破空号角。",
  "事件详情": "在南海鳄神受制求饶、四大恶人攻势受挫的紧要关头，远方官道上骤然传来急促如雷的马蹄奔腾声与响彻云霄的军阵号角之声。原来是大理国保定帝段正明与镇南王段正淳得知消息后，亲自统率三千铁骑大军兼程杀至驰援。段延庆见大理皇室精锐倾巢而出、铁骑排山倒海而至，深知以数人之力绝难抗衡千军万马，当机立断放弃强攻。他从腹中冷哼发出一阵阴寒彻骨的金属之音，撂下狠话称今日暂且寄下段氏众人的人头，待到了万劫谷中，定要教大理段氏彻底身败名裂。言罢，段延庆手中精钢双杖顿地，率领叶二娘、云中鹤及受创的岳老三施展轻功疾速掠入密林，全员遁退至万劫谷中设伏以待。保定帝与段正淳领兵赶到战阵前，见段誉不仅安然脱险甚至奇迹般收服了南海鳄神，欣慰惊喜之余，亦从战况中察觉四大恶人已盘踞万劫谷的严峻局面，一场关乎大理国运存亡与段氏家族清誉的凶险风暴就此在万劫谷中正式拉开序幕。",
