  "事件引子": "曼陀山庄庄内死寂肃杀，包不同双目喷火怒视方才屈膝认贼的慕容复，空气森冷如铁。",
  "事件详情": "慕容复跪拜认贼作父的屈辱丑态，被其身旁忠心耿耿的家臣包不同等在场众人尽收眼底。包不同向来性格刚烈耿直、对大燕慕容氏忠心不二，眼见少主为了虚无缥缈的权位竟彻底丧尽廉耻与人格，顿时气血翻涌、痛心疾首。包不同按捺不住满腔悲愤，当众厉声痛斥慕容复，怒骂其下跪认贼是不忠不孝不仁不义，甘愿沦为天下走狗、奴颜婢膝，令姑苏慕容数百年英名扫地以尽。其言辞如刀，字字句句直戳慕容复痛处。慕容复被当众揭穿痛处，恼羞成怒之下凶性彻底大发。为了向段延庆交纳投名状以表忠心，同时杀人灭口掩盖自己认贼作父的丑行，慕容复面露狰狞，趁包不同毫无防备之际自其背后悍然暴起，汇聚毕生内力狠辣无情地击出一掌，重重击碎了包不同的背心大穴。包不同护体真气瞬间崩溃，口喷鲜血，圆睁双目倒地气绝身亡。",
  "事件概要": "包不同痛心慕容复屈膝认贼作父，当众厉声斥其不忠不孝、辱没大燕英名。慕容复被戳中痛处恼羞成怒，为向段延庆纳投名状并灭口遮丑，自背后猝施辣手一掌震碎包不同背心大穴，致其当场气绝毙命。",
