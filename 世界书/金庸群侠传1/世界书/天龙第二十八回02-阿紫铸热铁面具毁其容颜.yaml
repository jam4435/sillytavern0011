  "事件引子": "极北冰蚕至寒至毒，雪白奇蚕破木而入咬中游坦之。",
  "事件详情": "阿紫自幼生长于星宿邪派，心肠狠辣至极，丝毫未曾将游坦之的痴情相待放在心上。她不仅每日将游坦之当做牛马般呼喝役使，更将其视作修炼邪功与试炼百毒的活人肉靶。为了彻底抹去游坦之的原本身份并杜绝其逃跑的可能，阿紫特意寻来市井铁匠，命其打造了一具沉重厚实的精钢铁面具。阿紫命人将这具铁面具置于熊熊炉火中烧得通体通红如炭，随后在游坦之撕心裂肺的哀求与惨嚎声中，残忍地将滚烫赤红的铁面具硬生生扣在游坦之的头颅之上，并以铁汁焊死闭合！滚烫的生铁瞬间将游坦之面部的皮肉皮焦肉烂、骨肉相连，其俊朗容貌在极度焦灼中尽数毁损。游坦之痛不欲生、昏死数次，醒来后头颅被死死禁锢于冰冷丑陋的铁罩之中，彻底沦为面目全非、见不得天日的残废奴隶“铁丑”。",
