  "事件引子": "采莲小曲清脆悦耳，绿衣少女俏立扁舟水上相逢。",
  "事件详情": "乌篷小船缓缓驶入太湖深处的盛开荷塘，四下荷叶连天，荷花吐蕊，水面弥漫着沁人心脾的清香。正行之间，前方案头忽有清脆悦耳的歌声隐隐传来，那歌声纯用吴侬软语低吟浅唱，婉转动听，宛若黄莺出谷一般，令人闻之心神荡漾。斜倚舱中的段誉听得如痴如醉，忍不住探出头去循声张望，只见一叶轻巧扁舟自层叠的荷花丛中穿梭而出。那扁舟船头俏立着一名年约十五六岁的绿衣少女，手中握着一支竹篙，身形婀娜多姿，眉目娇美如画。少女见到迎面驶来的乌篷船，随即停下手中竹篙，俏脸含笑，笑语盈盈地以吴语轻唱采莲情歌，唱道“荷花开，莲蓬结，采得莲蓬送情郎”。这一幕柔美动人的水乡相逢，瞬间打破了水路的岑寂，不仅令身陷险境的段誉心旷神怡，也引得闭目运功的鸠摩智从定境中睁开双目，促成了双方在太湖水面的初次正面相遇。",
  "事件概要": "起因：乌篷船驶入太湖深处盛开荷塘，前方案头隐隐传来清脆悦耳的吴侬软语采莲歌声。发展：段誉循声张望见一叶扁舟自荷丛穿梭而出，十五六岁绿衣少女阿碧俏立船头轻唱情歌。结果：水乡相逢令段誉心旷神怡，亦引得鸠摩智睁开双目，促成双方太湖初遇。",
