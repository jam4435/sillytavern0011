  "事件引子": "太湖深处碧波荡漾，荷叶田田，一叶小舟从荷荡深处缓缓划来，吴侬软语的采莲歌声随风传来。",
  "事件详情": "湖面绿波上飘来一叶小舟，一个绿衫少女手执双桨，缓缓划水而来，口中唱着吴语采莲小曲。歌声娇柔欢悦，令段誉心魂俱醉。崔百泉和过彦之虽大敌当前，也不禁转头向她瞧了两眼。鸠摩智却视若不见，仍在询问参合庄的路径。少女听见说话声，划着小舟缓缓靠近，水乡清歌打破了湖岸间紧张凝滞的气氛。",
  "事件概要": "鸠摩智与段誉在太湖岸边遇到崔百泉、过彦之，正交涉参合庄方向时，一叶小舟自荷荡中划来。绿衫少女手执双桨，唱着采莲小曲，段誉循声望去，初次见到这名慕容氏侍女。",
