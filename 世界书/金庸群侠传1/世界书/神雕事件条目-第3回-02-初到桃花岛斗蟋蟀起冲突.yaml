  "事件引子": "船只终于抵达桃花岛，郭芙突然多了三个年纪相若的小伙伴，欢喜之极。杨过服了解药后余毒去净，四个孩子连日捕捉蟋蟀相斗为戏，不料这一日却因一只小小的黑蟋蟀闹出了大事。",
