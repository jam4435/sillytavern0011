  "事件详情": "桃花岛上，杨过服了黄蓉的解药后身上余毒去净。他和郭芙初见面时略有嫌隙，但小孩性儿过了几日也就忘了。这一日杨过从屋里出来去捉蟋蟀，绕过清啸亭，见郭芙和武氏兄弟正在翻石拨草捕捉蟋蟀。武修文翻开石块捉到一只方头健腿、巨颚粗腰的雄骏大蟋蟀，号称'无敌大将军'。杨过不服，挑出最凶猛的一只来斗，却连出三蟀尽数败下阵来。忽听草丛中传来古怪的蟋蟀鸣叫，武敦儒拨开草丛惊见一条毒蛇昂首吐舌。杨过拾石砸死毒蛇，发现蛇旁有一只黑黝黝相貌奇丑的小蟋蟀——正是一只与毒蛇共居的'蛇蟀'。郭芙讥嘲'小黑鬼'激怒了杨过，他将黑蟀放入盆中与大蟋蟀相斗。说也奇怪，黑蟀竟在半空中咬死大蟋蟀。郭芙见心爱之物战死，向杨过讨要黑蟀，杨过不肯指她骂'小黑鬼'，郭芙小嘴一撇将黑蟀倒在地上右脚踹死。杨过又惊又怒，气血上涌，反手一掌重重打了郭芙一记耳光。武修文大骂着向杨过胸口一拳打去，武敦儒伸脚将杨过钩倒，武修文骑在身上，兄弟俩牢牢按住四个拳头猛往他身上招呼。郭芙在旁摸着热辣辣的脸颊，竟叫道：'用力打，打他！'",
  "事件概要": "杨过初到桃花岛便与郭芙、武氏兄弟结怨，岛上同门关系自开局便难以和睦。",
