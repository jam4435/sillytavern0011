  "事件引子": "执法长老受胁服毒，白世镜反手制服全冠清。",
  "事件详情": "白世镜与全冠清在残破内室中拼死搏杀、打得两败俱伤招式散乱之际，紧闭的雕花木窗猛然被狂暴的劲风撞成漫天碎屑，一道漆黑如墨的身影如幽冥鬼魅般自夜幕中暴掠而入。来人通体笼罩在宽大黑袍之中，面蒙黑巾，周身激荡着排山倒海般令人窒息的恐怖威压。白世镜只觉头顶罡风狂卷、恶寒彻骨，惊骇之下尚未来得及回掌格挡，黑衣神秘人已然闪电般欺至身前。没有任何冗余招式，黑衣人右掌携摧枯拉朽之势自天而降，一记刚猛霸道至极的重掌结结实实轰击在白世镜的顶门百会穴上。只听得一声令人头皮发麻的骨骼崩碎爆响，白世镜天灵盖瞬间化作齑粉，七窍之中乌黑鲜血狂喷而出，甚至连半声惨叫都未能发出，魁梧的身躯便如烂泥般轰然瘫倒在地当场气绝。一旁持刀的全冠清目睹执法长老瞬间惨遭秒杀，吓得魂飞魄散、面无人色，手中染血匕首当啷坠地，再也顾不得抢夺罪证，连滚带爬地破门狂奔遁入沉沉夜色。神秘黑衣人一击毙命后毫不恋战，大袖一卷，身形微晃便如青烟般自破损的窗洞飘然掠出，消失在夜雨之中，只留下横尸血泊的白世镜与瑟瑟发抖的康敏。",
