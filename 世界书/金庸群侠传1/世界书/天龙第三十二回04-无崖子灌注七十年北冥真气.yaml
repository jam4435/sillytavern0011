  "事件引子": "幽暗石室内悬绳微晃，老者面容肃穆闭目运劲，倒悬的虚竹头顶真气狂涌激荡。",
  "事件详情": "彻底化去虚竹体内的微薄少林内力之后，无崖子神色肃穆，正式施展北冥神功中的逆转度气无上神通。他调动自身苦修了整整七十余年的毕生功力与精纯无比的“北冥真气”，双掌紧扣虚竹头顶的百会要穴，如江河决堤般源源不绝地向虚竹体内疯狂灌注。刹那间，虚竹只觉头顶如被烈火与惊涛同时灌注，丹田内真气激荡轰鸣如万马奔腾，浩瀚无匹的逍遥派至纯真气顺着四肢百骸呼啸奔涌，迅速冲刷并拓宽其周身所有的闭塞经脉。虚竹在这股天地造化般的庞大内力洗礼下脱胎换骨，体内原本空虚的经脉瞬间被磅礴无尽的北冥神功完全填满。伴随着七十年内力的全部转移，虚竹由一个武功平平的少林小沙弥，在极短时间内一跃成为拥有绝世内力的一流高手；而无崖子则倾尽了毕生生机，全身真气耗尽，原本红润光洁的容颜在顷刻间变得面如死灰、枯槁衰老。",
