  "事件引子": "漆黑夜幕下惊雷撕裂苍穹，倾盆暴雨狂暴冲刷着满是血水泥浆的青石桥面。",
  "事件详情": "乔峰一掌重创大仇人之后，唯恐对方未死，当即快步踏过泥水横流的青石桥面，欲要上前查验倒地之人的生死。便在此刻，漆黑苍穹之上猛然撕裂开一道惨白刺眼的惊雷巨电，强烈的电光瞬间将整座青石桥照得亮如白昼。在惨白电光的照耀下，倒卧在血泊与泥泞之中的人斗笠早已脱落，脸颊上涂抹的易容油彩被狂暴的雨水和口中涌出的滚滚鲜血彻底冲刷融化。呈现在乔峰眼前的，根本不是段正淳的中年王爷面容，而是一张苍白凄美、泪眼盈盈的少女脸庞——竟是他发誓相伴一生、生死相许的心爱之人阿朱。这猝不及防的残酷真相如五雷轰顶般在乔峰脑中炸裂，乔峰整个人如遭雷击，理智与心智彻底崩溃发狂。他撕心裂肺地痛哭着扑倒在冰冷刺骨的泥污血水之中，颤抖着将气若游丝的阿朱紧紧搂入怀中，发出绝望凄厉的痛哭悲嚎，反复追问质问为何中掌的竟会是阿朱。",
