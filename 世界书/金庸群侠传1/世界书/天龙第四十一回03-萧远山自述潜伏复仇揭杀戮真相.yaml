  "事件引子": "三十年恨血泪斑斑，萧远山当众痛陈潜伏少林暗杀仇人真相。",
  "事件详情": "父子相认后，萧远山扶起萧峰，霍然转身逼视少林群僧与天下豪杰，眼中喷薄出森然杀气。他踏前三步，声音如铜钟激荡，当众揭开三十年前雁门关绝壁跳崖后的骇人隐秘：当年他怀抱亡妻跳下万丈深渊，幸得绝壁古树悬挂保全残躯，自此隐姓埋名，暗中潜伏进少林寺藏经阁三十载，夜夜翻阅偷学少林七十二绝技以积蓄复仇力量。言及此处，萧远山面露快意与狠厉，厉声宣布近来震惊江湖的连环血案皆系他一人所为——潜入乔家村震毙养育萧峰的乔三槐夫妇，夜闯菩提院击碎授业恩师玄苦大师的胸骨，乃至在聚贤庄外与卫辉城中先后掌毙赵钱孙、谭公谭婆以及单正全家。他步步紧逼喝道：“当年带头大哥杀我爱妻、夺我幼子，凡是隐瞒元凶的知情者，皆该碎尸万段！”此言一出，全场武林名宿骇然失色，少林僧众齐诵佛号悲愤难抑。萧峰听闻恩师与养父母竟丧于生父之手，面色惨白、心如刀绞，三十年笼罩在聚贤庄与少林寺头顶的冤狱谜团终以最残酷的方式水落石出。",
  "事件概要": "萧远山朗声宣告乔三槐、玄苦、赵钱孙皆为自己所杀（起因）；痛陈雁门关家破人亡之恨（发展）；全场群雄大骇（结果）。",
