  "事件详情": "风雪如泣，冰崖上一片死寂。虚竹目睹两位长辈凄然长逝，心中大起悲悯，而其体内吸收自童姥与李秋水的两股浩瀚真气正与无崖子传授的七十年功力剧烈碰撞奔涌。虚竹急忙盘膝坐于冰岩之上，运起逍遥派高深心法引导真气周天运转，不多时便将三大绝顶宗师合计二百余年的磅礴内力彻底熔铸贯通、融为一体，武功修为一举登峰造极、震古烁今。调息完毕后，虚竹怀着尊师重道之意，运起雄浑无匹的劈空掌力，在坚硬如铁的万丈冰川深处生生开凿出一座幽深的玄冰墓穴。虚竹双手合十诵念往生咒，小心翼翼地将天山童姥与李秋水的遗体并排安放于冰穴之中郑重合葬，并以巨冰封口，令这对纠缠相杀近百年的同门师姐妹在此同眠永寂。料理完二位师长身后事，虚竹抚摸着手上象征最高权柄的逍遥派掌门七宝指环，毅然担起门派重托，正式遵奉童姥遗命接任天山缥缈峰灵鹫宫宫主之位，以超凡入圣的绝世修为成为天山圣地的至高统领。",
