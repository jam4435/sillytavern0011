  "事件详情": "段誉身处曼陀山庄繁茂的花树之下，蓦然得见容颜绝俗的王语嫣，其风姿神韵宛若画中走出的神仙姐姐，顿令段誉心驰神往、神魂颠倒，僵立当场不能自已。王语嫣乃是姑苏慕容复的表妹，自幼在山庄“琅嬛玉洞”中博览群书，将普天之下各门各派的武学典籍与招式秘笈尽数熟读于心，对诸般武功的来龙去脉与破绽了如指掌、如数家珍，然而她自身却未曾习练过半点武功与内力。王语嫣察觉到段誉举止痴傻，那一双眼睛更是毫无顾忌、目不转睛地直视着自己，心中不由得升起几分少女的娇羞与不悦，气氛一度陷入尴尬。侍立一旁的阿朱与阿碧见状冰雪聪明，唯恐怠慢了客人又惹恼了表小姐，连忙主动上前打圆场，出言向王语嫣郑重引荐，言明段誉乃是一路仗义相助的尊贵客人。在阿朱与阿碧委婉周全的斡旋说辞下，王语嫣的嗔怪之意随之消解，初次相见的尴尬僵局得以顺利化解，段誉亦由此正式结识了这位通晓天下武学的神仙姐姐。",
