  "事件引子": "退隐宿老领衔名宿临场，高举密信遗令接管杏林法度。",
  "事件详情": "乔峰身上法刀创口血流未止，杏子林外骤然传来急促狂乱的蹄声与破空呼啸。丐帮退隐多年的八十七岁九袋宿老徐长老，因接获涉及帮门命脉的绝密信件，亲自领衔中原武林各派泰斗踏入林中。随行者阵容浩大，天台山高僧智光大师双手合十缓步前行，太行山谭公、谭婆并肩而立，追魂杖赵钱孙则身形诡异地紧随其后。徐长老面色凝重如铁，手中枯木鸠杖重重顿地，对负伤染血的乔峰视若无睹，当众厉声喝止帮众行礼，展现出异乎寻常的冷峻态度。乔峰强运内力压制肩胸剧痛，抱拳躬身向诸位武林前辈施礼相询；徐长老却从怀中郑重取出加盖火漆的汪帮主遗令密件，高举示众，沉声宣告丐帮大难临头，即刻由元老会接管全场法度。智光大师长叹合十，谭公谭婆亦神色戒备地分立两侧封锁林道。外派顶尖名宿的突然介入与强硬弹压，使得刚刚平息的内讧瞬间升级为席卷武林的公审风暴，信函交由徐长老掌控，乔峰彻底陷入孤立无援的重重疑云之中。",
  "事件概要": "起因：乔峰刀伤流血之际八十七岁徐长老领衔智光、谭公谭婆、赵钱孙等外派名宿突降杏林。发展：徐长老神色冷峻喝止帮众行礼，高举加盖火漆的汪帮主遗令密件宣布元老会接管法度。结果：外派顶尖名宿强硬介入将内讧升级为公审风暴，乔峰陷入孤立无援重重疑云。",
