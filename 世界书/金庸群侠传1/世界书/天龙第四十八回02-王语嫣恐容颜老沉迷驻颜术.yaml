  "事件引子": "登极称帝恩封诸女，段誉册立木婉清钟灵为妃万民称颂。",
  "事件详情": "王语嫣随段誉入驻大理皇宫后，虽享后宫极高尊荣，然而平静的日子里其心底却掀起惊涛骇浪。她因常年目睹大理无量玉洞中那尊“神仙姐姐”玉雕像的倾世绝颜，深知段誉昔日对其倾心源于玉像容貌，心底悄然滋生出极度强烈的容貌焦虑与失宠危机。寝殿之内，王语嫣每日对镜自照，素手颤抖着抚摸眼角微末的细纹，深恐韶华易逝、红颜白发而被无情抛弃。在强烈心魔的噬咬下，她彻底舍弃了往昔熟读的天下武学典籍与琴棋书画，反倒神思恍惚地暗中遣派贴身侍从，四处重金网罗江湖方士的秘录与各类驻颜奇方。段誉入殿探望并轻握其手温言劝慰道：“语嫣容貌倾城，何须为虚妄年岁自扰？”王语嫣却如惊弓之鸟般执拗反驳，当面捧出《神农长生经》等残卷与段誉激烈争辩长生之术，甚至在案几上亲手研磨调配水银、朱砂与各色怪异药石敷面服食。王语嫣日夜沉溺于青春永驻的虚妄异术中不可自拔，不惜耗损自身气血，致使其面色苍白虚浮、神情日益消瘦焦虑。寝宫内终日弥漫着刺鼻药气，这一走火入魔般的异常举止令内廷上下忧心忡忡，后宫悄然蒙上一层阴郁沉重的灰暗阴霾。",
