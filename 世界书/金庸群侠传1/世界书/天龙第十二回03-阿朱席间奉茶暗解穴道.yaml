  "事件详情": "酒席宴间，化装成老仆的阿朱穿梭于桌旁侍奉茶水菜肴，暗中伺机而动。为了削弱对手并制造混乱，阿朱先行在奉上的茶水中暗中动了手脚，布下隐秘后手。随后，她借着向段誉端盘奉茶、躬身布菜的绝佳近身机会，掩人耳目地垂下衣袖，运起独门轻灵手法，以极快且隐蔽的指力悄然拂过段誉周身被封的穴道要害。阿朱出手轻描淡写，动作丝毫不露风声，使近在咫尺的鸠摩智亦未生疑。段誉只觉数股温和劲力透穴而入，原本凝滞阻塞的经脉骤然贯通，体内真气如江河奔涌般畅行无阻，原本僵硬受制的手足四肢在瞬间彻底恢复了自如活动的能力。段誉心中惊喜交集，对眼前这位看似衰朽老仆、实为二八少女的机智胆识与神妙手法佩服得五体投地。至此，段誉身上的行动桎梏被完全解除，重新掌握了武功与行动主动权，为接下来的合力逃脱奠定了决定性基础。",
