  "事件引子": "脉门受制内力倒灌，凶神恶煞跪地认师。",
  "事件详情": "段誉在凶险的夹攻下游刃有余地游走闪避，见岳老三攻势大开大合，遂脚踏神妙步法如鬼魅般倏然绕至南海鳄神身后。段誉顺势伸出右手，一把精准扣住了岳老三的手腕脉门要穴。刹那间，段誉体内修习的《北冥神功》真气受激运转，岳老三只觉腕间如被深渊吸扯，自身苦修数十年的一身深厚内力竟如决堤山洪般狂泻而出，不受控制地疯狂倒灌入段誉体内。南海鳄神惊骇欲绝，周身经脉酸软麻木、力道全失，再也握不住那柄凶沉的鳄尾剪，双膝一软“扑通”一声重重跪倒在段誉脚下。岳老三亡魂皆冒，在力竭绝望之中连声磕头大喊“师父饶命”，当场悔罪服软，诚惶诚恐地甘愿拜段誉为师以求活命。四大恶人势如破竹的围杀阵势因此骤然受挫，为首的段延庆见段誉年纪轻轻竟身怀这等能凭空吸人内力的霸道邪功，眼神中寒芒闪动，原本胜券在握的心境也不禁暗自生凛。",
