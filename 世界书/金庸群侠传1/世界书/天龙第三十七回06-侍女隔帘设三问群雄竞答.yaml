  "事件引子": "三问平生幽香暗渡，西夏银川公主侍女出题考问各路求婚英豪。",
  "事件详情": "西夏皇宫偏殿内烛影摇曳、香烟袅袅，深处重重垂挂着一层薄如蝉翼的明珠纱帘。西夏银川公主李清露端坐帘后暗影中，为从数百名求婚者中寻觅昔日冰洞旧人，特遣贴身侍女手持宫灯款步走出。侍女立于玉阶之上，神情肃穆地向阶下环列的慕容复、宗赞王子、段誉、虚竹等各路青年才俊当众宣示三道古怪考题：一问平生在何处最感逍遥快乐，二问生平最心爱之人容貌若何，三问这心爱之人闺名唤作什么。群雄闻言各怀机心逐一作答：慕容复急于攀附西夏借兵复国，冠冕堂皇答道平生最乐在将来光复大燕，所爱之人容貌绝美却不知闺名，言语满是权谋做作；吐蕃宗赞王子粗俗狂妄，大声道最乐在王宫打猎饮酒，最爱之人便是帘后公主；段誉则坦荡赤诚，直言最快乐在黑暗冰冷的枯井底，最心爱之人便是王语嫣姑娘，闺名即是语嫣。众才俊或虚伪或狂妄，回答皆未能触及帘后公主心弦，大殿内气氛逐渐紧张凝滞，静候最终裁决。",
