  "事件详情": "众人步出帐外只见周伯通远远站在西首旷地上，四名一式的绿袍人——三个中年男子各戴高冠，一名少女腰间一根绿色绸带随风飘舞——分站南西北北四个方位成弧形将他围住。北首男子说周伯通踢翻丹炉折断灵芝撕毁道书焚烧剑房须去面见主人亲自交代。周伯通嬉皮笑脸说是一个老野人路过无意中闯的祸。那男子伸手指东方说'他来了'——周伯通回头不见有人，四人突然拉开一张绿色大渔网兜头将他罩落。这四人手法熟练无比古怪万分——饶是周伯通武功出神入化给渔网一罩登时手足无措，大呼小叫唤爹喊娘被四人提着渔网东绕西转绑了个结结实实。一个男子将他负在肩头余下三人持剑相护向东飞奔。杨过挂念周伯通安危提气追去。法王等均觉如此怪事岂能不看个究竟——当即别过忽必烈随后赶去。众人奔行数里见四人扛周伯通上船溯溪上行，沿岸追赶一里许见溪中有艘小舟当即入舟溯溪追去。溪流曲折转了弯忽然不见了前舟影踪——尼摩星跃上高崖眺望发现绿衫人小舟划入了西首一条极窄溪水之中入口被大树丛遮住若非登高俯视根本不知深谷中别有洞天。",
  "事件概要": "绿衫弟子以渔网擒走周伯通，绝情谷势力正式浮出水面并牵出新的去向。",
