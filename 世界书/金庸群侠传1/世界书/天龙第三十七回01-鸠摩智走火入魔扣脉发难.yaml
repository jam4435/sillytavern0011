  "事件引子": "幽暗深陷的枯井中泥泞没胫、寒气彻骨，骤然响起野兽濒死般的凄厉咆哮。",
  "事件详情": "黑漆冰冷、污泥没胫的西夏枯井深处，吐蕃国师大轮明王鸠摩智因平生贪求武功天下第一，强行兼修少林七十二绝技、逍遥派小无相功以及少林《易筋经》，体内数股截然相反的至阳至阴霸道真气彻底失衡冲撞，陷入经脉逆乱的走火入魔绝境。鸠摩智周身穴道如万蚁噬咬、烈火灼烧，剧痛之下神智彻底沦入魔障，双目赤红如血，口中发出犹如凶兽濒死般的凄厉咆哮。在逼仄幽暗的井底烂泥中，他狂性大发，挥舞双掌使出狂乱无章的凶狠杀招，四处扑击乱抓。段誉唯恐王语嫣受创，死死将她护在身后，在湿滑泥泞中左支右绌、狼狈翻滚闪避，后背险些被凌厉罡风撕裂。生死一线之际，彻底失控的鸠摩智猛然欺身暴起，右爪如铁箍般咔嚓一声狠厉扣住了段誉的右手腕脉。鸠摩智意欲吐劲震断段誉心脉，却因脉门死死相锁，瞬间沟通了二人体内气血经络，令双方在冰冷泥沼中僵持锁死，直接引动了后续不可逆转的内力狂吸剧变。",
