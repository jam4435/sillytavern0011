  "事件引子": "铁面加身受尽凌辱，游坦之沦为阿紫练毒掌玩物。",
  "事件详情": "见数名同道惨死掌下，头戴焊死铁面具的游坦之退无可退。丁春秋步步进逼，眼中贪芒毕露，右手羽扇连抖，自袖中抓出一把碧磷毒粉猛力掷出，化作三团熊熊燃烧的幽绿阴火直扑游坦之面门，口中厉喝：“交出经书，留你全尸！”生死悬于一线之际，游坦之惊怒交加，决意殊死一搏。他运转依《易筋经》梵文图谱吸纳的千年冰蚕奇毒，丹田内至阴至寒的极寒真气如狂潮般爆发，毫无花巧地奋起双掌向前猛力推击。呼啸声中，磅礴无匹的霜白寒流自他掌心席卷而出，大厅青砖地面瞬间蔓延起寸许厚的森白冰霜！极寒冰蚕气劲与漫天幽绿毒火在半空中轰然对撞，炽热剧毒与至寒罡风激烈绞杀，发出尖锐刺耳的嗤嗤气爆轰鸣。狂暴的气浪如飓风般扩散，将周遭十余张厚木八仙桌震得凌空崩碎瓦解。丁春秋未料对方内力如此诡异雄浑，被反震而来的彻骨寒劲逼得胡须泛白、身形微晃；游坦之铁面亦覆满白霜，双方在毒火与严霜交织中形成凶险的内力对峙。",
