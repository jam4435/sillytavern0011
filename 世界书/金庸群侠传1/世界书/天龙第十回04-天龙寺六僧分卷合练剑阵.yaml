  "事件引子": "拆分经卷各修一脉，剃度保定帝结成神剑阵。",
  "事件详情": "枯荣禅师深知鸠摩智身为吐蕃国师，武学修为早已臻至化境，此番携势而来绝非善类，天龙寺单凭一人之力绝难与抗。为免镇派绝学遭番邦强取豪夺，枯荣禅师当机立断作出惊人决断：六脉神剑向来因内力要求极高而极少有人能尽修六脉，如今强敌将至，不如将《六脉神剑经》全书拆分为六卷图谱，由六大高手各习其中一脉，合力组成六脉神剑阵御敌。枯荣禅师当即为保定帝段正明剃度赐予法名“本尘”，将其正式纳入天龙寺出家僧众之列。随后，由本因、本观、本相、本参四位高僧与本尘（保定帝）各执一卷专修一脉剑法，枯荣禅师自己则独修剩下的一脉。六位绝顶高手在牟尼堂内依谱默运内力，争分夺秒调动真气演练剑招配合，迅速结成进退呼应、威力倍增的六脉神剑合击剑阵，严阵以待即将踏入堂中的大轮明王。",
  "事件概要": "起因：枯荣禅师深知鸠摩智武功化境，单凭一人绝难与抗，决断拆分图谱合练剑阵。发展：枯荣为保定帝剃度赐法名本尘入僧众，本因等四僧与本尘、枯荣六人各执一卷专修一脉。结果：六僧争分夺秒调动真气演练剑招配合，迅速结成六脉神剑合击阵严阵以待。",
