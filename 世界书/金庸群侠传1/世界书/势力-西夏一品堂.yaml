名称：西夏一品堂
类型：行伍 / 官办讲武机构
核心地域：西夏/灵州/一品堂行营
【稳定定位】西夏官办讲武与特务机构，重金招揽各路高手，统一训练只提供军中行气、短打、军刀、抓捕和潜踪等实战底盘，高阶绝学主要来自具体客卿个人师承。
【组织与接触】总管、亲信武士与外聘客卿不是同一师门层级；加入一品堂不等于自动获得四大恶人、慕容复或其他客卿的独门绝学，高阶学习必须有明确军功、师承或剧情依据。
【江湖认知】外界普遍把一品堂视为西夏招揽江湖高手、执行军务与刺探任务的机构，但具体成员、密令与行动目标并非公开情报。
【动态事实规则】总管、客卿名单、任务目标、政治隶属与对外行动，以当前变量、世界事件、游戏时间和实际剧情为准。
