  "事件引子": "石壁前剑光凛冽直逼咽喉，王语嫣凄呼乍起，慕容复横剑自裁命在旦夕。",
  "事件详情": "眼见慕容复横剑抹向脖颈、鲜血已染红衣领，王语嫣吓得容颜失色凄厉悲呼。一旁的段誉见心上人肝胆俱裂，救人之念压倒一切，不假思索间急运体内深厚无比的北冥真气。千钧一发之际，段誉右手食指疾伸，大理段氏“六脉神剑”之“商阳剑”脱手激射而出！一道无形无质、尖锐破空的凌厉剑气若惊雷贯空，快如闪电般自数丈外精准击中慕容复手中宝剑的剑脊。只听“当”的一声清脆金铁暴鸣，无形剑气蕴含的沛然巨力震得慕容复右臂发麻、五指脱力，手中精钢佩剑脱手冲天飞起，打着盘旋重重斜插在丈许外的青石地面之上，剑身嗡嗡震颤不休。这雷霆一击的剧烈震荡如当头棒喝，硬生生切断了幻境煞气的侵蚀，将慕容复从万军伏诛、帝业成空的自刎心魔中强行震醒。慕容复周身大汗淋漓、胸口剧烈起伏，猛然回神望着插在地上的长剑，方知自己方才竟在棋局幻象中险些自戕毙命。慕容复颈部留下一道寸许血痕，长剑脱手落地，在群雄惊诧与窃窃私语的注视下，他自知当众大失颜面、颜面扫地，羞愧恼怒得满面通红，连道谢之言都未及说出口，便神情狼狈地退回四大家臣身后调息平复紊乱内息。",
  "事件概要": "眼见慕容复遭心魔侵蚀横剑自刎，段誉为安王语嫣之心，急运北冥真气催发商阳剑气凌空击飞其佩剑，断其幻象心魔；慕容复颈受轻伤神智复清，自知当众大失颜面，羞愧狼狈退归家臣身后调息。",
