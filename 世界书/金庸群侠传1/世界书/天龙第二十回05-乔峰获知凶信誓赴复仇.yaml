  "事件引子": "信阳城外残庙深幽，阿朱洗净油彩褪去伪装，急切向乔峰道出带头大哥的身份真相。",
  "事件详情": "阿朱自马府内室脱身而出，施展轻功疾驰至城外荒郊破庙与乔峰会合。阿朱洗净面上油彩、褪去长老破袍，迫不及待地将康敏亲口指认“带头大哥实乃大理镇南王段正淳”之语一五一十转述给乔峰。乔峰闻听此言如遭五雷轰顶，胸中积压已久的杀父弑母血仇轰然爆发。他怒发冲冠，双目赤红，狂暴的降龙真气自周身窍穴喷薄而出，狂怒之下一掌击在身侧青石供桌上，轰然巨响中厚重石案立时化为漫天碎砾。乔峰在殿内来回疾步，沉声分析道段正淳位极人臣、风流自负且精通一阳指绝学，声望地位确实完全契合号令中原群豪的带头大哥身份，因而在狂怒中对康敏的构陷谎言深信不疑。乔峰拔出随身佩刀，霍然削断衣袍一角掷于地面，对天立下重誓，纵然段氏有六脉神剑护体，亦必亲赴小镜湖将段正淳碎尸万段以告慰双亲在天之灵。阿朱在旁递上缰绳与佩刀，眼见情郎杀气贯虹，复仇之火彻底锁死在生父段正淳身上，无法挽回的悲剧杀局由此正式拉开序幕。",
  "事件概要": "阿朱自马府脱身后至城外破庙与乔峰会合，告知康敏指认带头大哥实为大理镇南王段正淳。乔峰惊怒交加，分析其身份绝技皆极契合，对此深信不疑；悲愤之下劈碎石案、割袍立誓，决意亲赴小镜湖格杀段正淳以报血仇，复仇悲剧自此铸成。",
