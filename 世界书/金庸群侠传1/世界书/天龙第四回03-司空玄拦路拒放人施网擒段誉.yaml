  "事件引子": "林间毒雾初散，前路怪石嶙峋处长笑突起，神农帮帮主率众持械横截去路。",
  "事件详情": "木婉清击退偷袭帮众穿过毒雾之际，忽听得一声长笑，神农帮帮主司空玄手持药锄率众现身横拦去路，冷笑讥讽木婉清单枪匹马闯阵送死。木婉清面罩寒霜，严词喝令司空玄速速释放钟灵师妹，否则必教神农帮鸡犬不留；司空玄狂妄大笑，声称自己奉天山灵鹫宫法旨行事，决不容人撒野，悍然下令围攻擒拿。两名神农帮高手随即合身扑上，一人挥舞沉重开山斧，一人疾刺阴狠分水刺，招式狠辣凌厉，木婉清展动软鞭以一敌二，双方激烈搏杀难解难分。便在战局焦灼之际，两名神农帮帮众悄然自侧翼包抄，猛然张开一张浸透麻药的坚韧大网，兜头向段誉与黑玫瑰当头罩落。段誉身无武功全然不及防备，瞬间连人带马被药网死死困缚，黑马受惊人立长嘶。司空玄借药网突袭得手将段誉生擒控制，彻底打破战局平衡，使木婉清陷入腹背受敌的严重危机之中。",
