  "事件引子": "乔峰阿朱绝壁定立塞上牛羊盟约，携手并肩共赴追凶征程。",
  "事件详情": "阿朱这番生死相随、不离不弃的真情倾诉，彻底唤醒了乔峰胸中沉寂的盖世豪情。在这举世皆敌、千夫所指的关头，能得阿朱如此赤诚相待，乔峰满腔悲愤尽数化为无畏勇气。他虎目含泪，双臂用力收紧将阿朱紧紧拥入怀中，豪气干云地朗声宣誓：得阿朱此言相伴，自己纵然面对天下群雄的刀枪剑戟、与全天下人为敌，又有何可惧！乔峰郑重立誓，从今往后两人同生共死、福祸相依，永生永世不再分离。二人在这座见证了血仇与身世之谜的雁门关绝壁之下，以天地山川为凭，正式立下了托付一生的终身盟约。彼此心意相通之后，乔峰不再消沉绝望，阿朱亦找到了毕生归宿。二人当下收拾心绪、携手并肩离开雁门关绝壁，共同踏上了前路未卜的江湖征程，誓要合力追查出当年雁门关血案的幕后元凶“带头大哥”，并彻查杀害丐帮副帮主马大元的真正凶手，以血洗冤屈。",
  "事件概要": "起因：阿朱生死相随倾诉唤醒乔峰盖世豪情，乔峰虎目含泪紧拥阿朱立誓同生共死永不分离。发展：二人在见证血仇的雁门关绝壁下以天地山川为凭，正式立下托付一生的终身盟约（塞上牛羊之约）。结果：彼此心意相通重燃斗志，二人携手并肩离开绝壁踏上征程，誓合力追查带头大哥与杀马真凶洗雪冤屈。",
