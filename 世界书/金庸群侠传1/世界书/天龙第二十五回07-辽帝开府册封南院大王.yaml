  "事件引子": "析津府大殿内编钟齐鸣、旌旗猎猎，文武百官垂手肃立，殿中金炉沉香氤氲。",
  "事件详情": "彻底平定皇太叔耶律重元的叛乱后，辽国政局恢复安定。辽帝耶律洪基感念乔峰救驾平乱的擎天之功与结义深情，龙颜大悦，决定在辽国都城南京（析津府）举行规格空前的盛大封赏庆典，以犒赏这位救国英雄。析津府内钟鼓齐鸣、百官朝拜，场面极尽威严奢华。在满朝文武与皇族贵戚的见证下，耶律洪基当众降旨，正式册封义弟乔峰为大辽国“南院大王”，并格外加封“楚王”爵位。内侍官手捧金光璀璨的楚王金印、玉册与王府印信，当庭郑重授予乔峰，并在南京城内赐建气派非凡的南院大王府。乔峰立于大殿之上接受百官朝贺，自辞别中原以来历经身世巨变、饱受宋人武林唾骂排挤，如今在契丹故土却凭借一身肝胆与绝世武功一飞冲天，获授至高权柄，统领大辽南境全境军政大权。册封大典圆满落成，金印宝册归于乔峰，乔峰正式完成了从丐帮弃徒到执掌数十万雄兵、位极人臣的大辽南院大王的身份蜕变，开启了统领大辽南境的新篇章。",
  "事件概要": "平定皇太叔叛乱后，辽帝耶律洪基在南京析津府大殿举行盛大庆典，感念结义之情与救驾殊勋，当众下诏册封乔峰为南院大王并加封楚王，赐楚王金印、玉册及王府。乔峰登殿拜领印信并受百官朝贺，自此统领辽国南境军政大权。",
