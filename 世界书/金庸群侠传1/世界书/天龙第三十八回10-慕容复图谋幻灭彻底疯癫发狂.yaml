  "事件详情": "曼陀山庄内残部溃败殆尽，尸横遍地，血气弥漫。慕容复历经西夏招亲落选、弑杀忠仆包不同、家臣恩断义绝、逼宫惨祸彻底失控，再到惨败于段誉与虚竹之手，其毕生追求的大燕复国宏愿在接二连三的毁灭性打击下彻底化作泡影。大理皇权篡夺无望，复兴霸业沦为千古笑柄，数代祖先的复国重压与残酷现实的惨烈崩塌在他脑海中剧烈冲突激荡。慕容复披头散发、神情呆滞，眼神由惊恐怨毒渐渐转为痴狂涣散，口中喃喃胡语自称大燕皇帝，竟沉迷于自己身披龙袍、君临天下的虚妄幻境之中不可自拔。巨大的精神刺激彻底摧毁了慕容复的心智与神魂，昔日名震天下的姑苏南慕容终究承受不住现实的残酷灭顶之灾，神志全失、彻底疯癫发狂，为这场执拗一生的复国痴梦画上了荒诞凄凉的终局。",
