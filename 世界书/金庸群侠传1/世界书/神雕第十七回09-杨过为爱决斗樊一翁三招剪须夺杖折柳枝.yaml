  "事件详情": "公孙止赶杨过走，杨过热泪盈眶向小龙女哀求。公孙止见他激得小龙女吐血早已恼怒异常，低沉着嗓子赶人。杨过双目凝视小龙女不理谷主，一再哀求。公孙止醋意大作，暗向樊一翁做眼色摆手令他猛下杀手毙了杨过。樊一翁本只想将杨过逐出谷去，见师父竟下杀人之令大出意料，两次望向师父确认后拾起钢杖喝问。杨过将满腔热血缓缓压落，决意拼命杀出重围救护小龙女。公孙绿萼鼓足勇气站出来劝杨过离开——语气温柔充满关怀之意，但被杨过以'拔下矮子胡子送你玩'的玩笑反引得不敢再接嘴。樊一翁挥长须攻来，杨过取出大剪刀以预先想好对付李莫愁拂尘的招法应对，着着进迫大占上风。斗到数十招杨过终于发现破绽：樊一翁胡子左甩脑袋必先向右，于是定下击首剪须之计，三招之内喀的一声将樊一翁留了半生的大胡子剪去两尺有余。樊一翁又惊又怒抢过钢杖横扫，杨过以大剪刀一格——钢杖将剪刀打得弯了过去不成模样。杨过抛下废剪刀，使出古墓派轻功破长大兵刃的绝技踏住杖头，以打狗棒法绝招'獒口夺杖'空手夺下钢杖——手法之奇连金轮法王也暗暗赞叹。樊一翁满脸涨成紫酱色仍不服输，杨过又将钢杖交还。他目光转到院中两株大柳树，向小龙女望了一眼说'你要姓柳我就用柳枝作兵器罢'，纵身入庭折了一根长约四尺的柳枝——长短粗细便与打狗棒相似。小龙女看杨过在眼前一言一动无不令她心动意荡，内心如千百把钢刀绞剜。",
