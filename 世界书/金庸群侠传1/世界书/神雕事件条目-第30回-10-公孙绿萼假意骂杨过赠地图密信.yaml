  "事件详情": "杨过拒绝娶公孙绿萼后携小龙女走向厅门——决心自行救天竺僧和朱子柳。公孙绿萼突然奔出大叫'杨过你这般无情无义算我瞎了眼睛'——口中虽骂脸上神色却柔和温雅同时连使眼色。杨过一见早知别有缘故也大声喝道'我怎么了谅你这区区绝情谷也难不了人'——眉目之间不敢丝毫有异因裘千尺看得明白。绿萼继续骂道'我恨不得将你一劈两半剖出你的心来瞧瞧'——口一张噗的一声吐出一枚枣核向杨过迎面飞去。杨过伸手接住冷笑道'快快给我回去我便不来伤你谅你这点雕虫小技能难为得我了'。绿萼使个眼色命他快走，忽地双手掩面叫道'妈他……他欺负人'奔回大厅——她一番相思尽成虚空意中人已与旁人结成良缘这份伤心却是半点不假。裘千尺见她泪流满面喝道'萼儿这成什么样了那小子性命指日难保'。绿萼伏在母亲膝头呜咽不止。这一番做作厅上众人都被瞒过——只有黄蓉暗暗好笑心道她假意恼恨杨过好叫母亲不防便可俟机盗药。杨过接了枣核快步便行，见四下无人提手看掌中枣核却是个橄榄核儿中心隐隐有条细缝。手指微一用力榄核破为两半中间是空的藏着一张薄纸。小龙女笑道'这姑娘的话中藏着哑谜儿什么一劈两半剖出心来瞧瞧原来是这个意思'。两人低首同看纸上写道'半枚丹药母亲收藏极密务当设法盗出相赠天竺僧及朱前辈囚于火浣室中'——字旁绘着一张地图通路盘旋曲折终点写着'火浣室'三字。杨过大喜道'咱们快去正好此时无人阻拦'。",
