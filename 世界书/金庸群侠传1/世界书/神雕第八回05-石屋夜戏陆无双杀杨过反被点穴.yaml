  "事件详情": "陆无双吃完烤肉回石屋睡下。睡到中夜悄悄起来走到屋外，见火堆已熄杨过一动不动伏在地上。她蹑手蹑足走到他身后手起刀落往他背心砍去，猛觉虎口剧痛单刀脱手——砍中的竟是藏在衣服下的大石。陆无双大惊转身逃开，回望杨过仍伏地不动。她疑心大起走近提起衣服才发现下面根本无人。她循鼾声寻去，发现杨过竟睡在她方才所躺的桌上。陆无双盛怒之下纵身而上挺刀尖向他背心插落。这一刀锋入肉手上绝无异感，却听杨过说梦话谁在我背上搔痒别闹我怕痒，原来刀尖刺在了他垫在背心的黄獐肉上。陆无双惊得脸都白了，连刺两次失误对杨过憎恨之心更加强烈，咬牙低声道臭傻蛋瞧我这次要不要了你的小命，闪身扑上举刀猛砍。杨过翻身闪避，这一刀砍在桌上深入木里。陆无双正待拔刀，杨过两条泥腿倏地伸出——左腿恰好搁在她臂弯曲池穴，右腿搁在肩头肩井穴——她登时动弹不得。杨过梦中翻身右脚尖又碰中她巨骨穴，陆无双立时全身酸麻连嘴也张不开了。她就这么给杨过当作搁腿架子，气得几欲晕去，心中赌咒明日定要斩他十七八刀。杨过眯眼瞧她发怒神色越看越觉与小龙女相似，竟痴痴不舍移开目光。",
