  "事件详情": "郭襄平日和鲁有脚极为交好，常拉他到郊外荒僻处喝酒，一老一少举杯对酌引为乐事。羊太傅庙也是二人常到之处。听说老朋友竟在庙中被害心中悲痛，当即打了一葫芦酒提了一只菜篮来到庙中。其时将近子夜，郭襄放下两副杯筷斟满酒，对着对面酒杯说道鲁老伯来享一杯浊酒，将酒泼在地下自己一饮而尽，想到忘年之交永逝不禁悲从中来垂泪。郭芙寻了来说母亲催她回去，姊妹拌嘴斗口——郭芙说推举帮主这等大事与郭襄生日相比'笑掉了人家牙齿'，郭襄却说至少有一位大英雄记得她的生日答应要来。郭襄负气奔出庙门突见黑影一闪——尼摩星拄着双拐拦住去路，要将她姊妹俘获以扰乱郭靖心神。郭芙拔剑使出越女剑法迎战却不是对手，郭襄赤手扑上护姊。尼摩星双杖齐出点中郭襄左肩、郭芙胸口，郭芙幸有软猬甲护身。千钧一发之际郭襄身后有柔声说道'别怕用暗器打他'——腕上一对金丝芙蓉镯忽地离手飞出撞在尼摩星铁杖之上，尼摩星双杖脱手身子跌倒。郭襄拔下青玉簪打出，身后微风托着玉簪向前，尼摩星双手齐格却挡不住，玉簪穿过双掌钉入脑门神庭穴，当场毙命。耶律齐赶到见尼摩星双掌掌心贯穿一孔青玉簪钉在脑门上，发簪者本领之高不可思议。郭襄心中猜想是杨过暗中相助，却不敢确认，被郭芙问时只说是鲁老伯鬼魂护佑。",
