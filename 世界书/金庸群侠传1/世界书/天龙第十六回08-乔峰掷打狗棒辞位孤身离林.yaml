  "事件引子": "乔峰重掷打狗棒辞去帮主，悲啸阔步离林誓查身世元凶。",
  "事件详情": "面对千夫所指的千钧重压与不白之冤，乔峰仰天发出凄凉至极的悲笑。在看透人情冷暖与昔日恩怨后，他不再做无谓的争辩，毅然做出了与过去彻底决裂的决断。乔峰神色决绝地伸手解下腰间那根象征丐帮历代帮主至高权位的“打狗棒”，运劲重重掷在冰冷的地面之上。伴随着清脆的撞击声，乔峰向全场群豪朗声宣告：乔峰今日正式辞去丐帮帮主之位，自此与丐帮再无瓜葛！他目光如电扫视群雄，立下铿锵誓言，待自己查明杀害马大元副帮主的真正元凶与雁门关惨案的全部内情之后，定会再向天下英雄领教。言毕，乔峰仰天发出一声惊天动地的悲壮长啸，在群雄惊骇、畏惧与复杂的目光注视下，将打狗棒遗留林中，大步流星跨出杏子林，孤身一人毅然踏上了追寻自身真实命运与血仇真相的凄风苦雨之路。",
  "事件概要": "起因：面对千夫所指的千钧重压与不白之冤，乔峰仰天悲笑看透恩怨，决意与过去彻底决裂不再辩白。发展：乔峰解下象征至高权位的打狗棒重重掷地，当众宣告辞去帮主之位自此与丐帮两断，并誓言查明真凶。结果：乔峰仰天长啸在群雄复杂目光中将打狗棒遗留林中大步离去，孤身踏上追寻身世血仇之路。",
