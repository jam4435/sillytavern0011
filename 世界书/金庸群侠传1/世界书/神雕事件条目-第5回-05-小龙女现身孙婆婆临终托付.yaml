  "事件详情": "正闹得不可开交，忽听身后冷冷的声音说欺侮幼儿老妇算得什么英雄。郝大通回头只见一个极美的白衣少女站在大殿门口，目光寒意逼人。重阳宫钟声一起后十余里内外群道密布守得严密异常，但这少女陡然进来事先竟无一人示警。杨过抬起头来凄然叫龙姑姑这恶道士把婆婆打死了。原来小龙女一直跟在后面——从孙婆婆带杨过离墓进观出手她都看得清清楚楚，料想郝大通不致狠下杀手是以始终没有露面，哪知形格势禁孙婆婆终受重伤，她待要相救已自不及。小龙女俯身察看孙婆婆伤势。孙婆婆叹了口气说自己一生从没求过她什么事，求她也不答允。小龙女秀眉微蹙问现下想求什么。孙婆婆指着杨过强运最后一口气求她照料杨过一生一世别让他吃旁人半点亏。小龙女踌躇片刻，孙婆婆厉声说出将她从小抚养长大的恩情——吃饭洗澡睡觉拉尿全是自己一手干的，小龙女上齿咬下唇终于答允。孙婆婆丑脸上现出一丝微笑眼睛望着杨过似有话说却说不出来。杨过弯腰将耳朵与她口唇碰在一起，孙婆婆低声道你龙姑姑无依无靠你也……一口气再也提不上来满口鲜血喷出溅得杨过半边脸上与胸口衣襟都是斑斑血点，就此闭目而死。杨过大叫婆婆伤心难忍伏在她身上号啕大哭。",
