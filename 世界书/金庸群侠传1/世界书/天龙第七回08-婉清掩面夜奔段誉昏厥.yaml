  "事件引子": "正厅内短剑当啷落地，烛影摇曳下满室死寂，兄妹身世真相如平地惊雷般撕裂喜宴。",
  "事件详情": "短剑被夺落地之后，木婉清万念俱灰、悲愤欲绝，再也无法面对眼前荒谬残酷的至亲之变，当即掩面痛哭狂奔，不顾阻拦径直冲出镇南王府大门，孤身一人迅速消失在茫茫夜色之中。段誉眼见心爱之人决然夜奔，心如刀绞，情急之下拔足便欲冲出府门追赶相救。然而段正淳唯恐儿子再遭不测或深陷伦理惨祸，急步上前伸出双臂死死将段誉拉住，寸步不移地阻断其去路。段誉在短时间内承受了由大喜至大悲的巨大冲击，眼睁睁看着心上人化为亲妹并绝望遁入长夜，整个人陷入无以复加的极致悲痛与心神崩溃之中。在急火攻心与气血翻涌之下，段誉猛然仰天喷出一大口鲜血，身躯晃动，当场彻底昏死过去。木婉清孤身夜奔不知所踪，段誉重伤昏厥，大理镇南王府的喜庆之夜最终在一片凄凉与惨烈中落幕。",
  "事件概要": "短剑落地后，木婉清难承至亲变故之痛，掩面狂奔遁入茫茫夜色。段誉痛彻心扉欲夺门追赶，遭段正淳死死阻拦。段誉在至喜至悲的伦理剧变冲击下急火攻心，狂喷鲜血当场昏厥。喜宴终在凄凉与悲绝中收场。",
