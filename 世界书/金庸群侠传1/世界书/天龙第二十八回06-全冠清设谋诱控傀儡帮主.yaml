  "事件详情": "游坦之背负失明阿紫逃亡流落期间，丐帮九袋长老全冠清凭借敏锐的眼线与心机探知了铁丑的行踪。全冠清暗中细致窥探，震惊地发现这位头戴可怖铁面具的怪人竟身怀不可思议的绝世极寒内力，同时更敏锐洞悉了铁丑对阿紫极度病态痴恋、而其本性却懦弱愚昧极易操控的致命弱点。为了实现自身染指丐帮最高权柄、称霸天下武林的狂妄野心，全冠清当即暗中设下一条毒辣阴谋。全冠清主动现身接近游坦之，凭借其巧舌如簧的口才极尽欺瞒诱骗之能事，向游坦之许下重诺，谎称丐帮势力遍布天下，只要铁丑愿意加入丐帮并听从调遣，丐帮定能搜罗天下名医神药治愈阿紫的失明双眼。救阿紫心切的游坦之不疑有他，当即沦陷于全冠清的精心圈套之中，任由全冠清将其引入丐帮权力核心，沦为全冠清图谋武林盟主大位的傀儡帮主棋子。",
