  "事件引子": "寒风呼啸掠过雁门关外的荒野绝壁，宋民散尽，四野重归苍凉死寂。",
  "事件详情": "在获救的大宋难民千恩万谢地互相扶持离去之后，喧嚣散尽的雁门关下再度陷入无边的死寂与苍凉。凛冽刺骨的北风呼啸而过，乔峰独自一人在当年父母殉难的绝壁前悄然肃立了良久。经过关前这一场血火冲突与心灵剧震，乔峰在漫长的静默与沉思中，终于强行压下心头的悲凉、迷茫与剧痛，重新收拾起激荡的情怀。乔峰心智极度坚定，他深知沉溺于胡汉身份的撕裂与痛苦无济于事，要解开这一切悲剧的根源，唯有彻底查清三十年前雁门关血案的全部始末。乔峰当即下定决心，毅然放弃在大辽南院的安逸荣华，决意孤身重返中原武林，去向少林寺玄慈方丈当面探寻当年旧事，向丐帮执掌刑罚的白世镜追问蛛丝马迹，誓要将当年假传音讯、挑起雁门关血案的“带头大哥”之终极谜团彻底查个水落石出。乔峰理顺思绪，收拾行装，带着不破真相誓不罢休的决绝信念，毅然踏上了重返中原江湖的凶险征途。",
  "事件概要": "难民散尽后，乔峰独对绝壁肃立沉思，强压胡汉身份撕裂的剧痛，收拾起激荡情怀。为彻底查明三十年前雁门关惨案始末与带头大哥真容，他毅然舍弃大辽富贵荣华，孤身收拾行装重返中原武林。",
