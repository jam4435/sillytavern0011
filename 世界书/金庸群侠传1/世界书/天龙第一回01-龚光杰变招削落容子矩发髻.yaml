  "事件引子": "剑湖宫大厅内剑光森列，东宗西宗门人列坐两旁，场中双剑破空交击，局势剑拔弩张。",
  "事件详情": "大理无量山剑湖宫的大厅之中，无量剑东宗与西宗正依例举行五年一度的比剑较量，场中数十名弟子雁翅排开、刀剑森列，气氛紧绷凝重。东宗掌门左子穆端坐太师椅上手捻长须、嘴角含笑，西宗掌门辛双清则面如严霜、目光如电，二人皆在暗中观察门下弟子的胜负走势。大厅中央，东宗弟子龚光杰与西宗弟子容子矩正各展精妙剑法展开生死缠斗，长剑青光闪动，破空呼啸之声不绝于耳。斗到分际，龚光杰眼神一凛，蓦地使出一招“顺水推舟”，手中长剑青光暴涨，剑尖挟着劲风斜刺容子矩下盘要害；容子矩身手敏捷，向后跃开避过凌厉一击，旋即横剑封格下路。然而龚光杰招式陡然变幻，剑锋借力化为“巧抹双鬓”，贴着容子矩耳际贴面疾划而过。容子矩变招不及，只觉耳畔冷风骤起，头顶半截发髻已被凌厉剑气齐整削落，青丝飘落于地。西宗弟子见状尽皆骇然失色，东宗弟子则齐声欢呼喝彩，龚光杰持剑傲立，一举在比剑较量中确立东宗的绝对优势。",
