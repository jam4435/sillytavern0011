  "事件详情": "杨龙二人在玉蜂掩护下逃到藏经阁。杨过察看地形，见阁后有深达数十丈的溪涧——虽深却并不甚宽。他取出随身长绳一端缚在阁柱上，纵身跃过涧去将另一端缚在对面大树，施展轻功从绳上走回。楼下追兵喧哗渐近，杨过急中生智——打开樟木书箱倒出满箱书籍，取架上油布铺入箱内，以绳索将箱子送到对涧，又回来抱起小龙女越过深涧。小龙女见杨过实现了自己回古墓的心愿，心中喜悦。杨过找到山洞中的郭襄——小家伙吃了多日豹乳竟比常儿壮健，沉睡正酣双颊红红。小龙女伸手将郭襄抱入怀中，杨过抗着木箱继续前行。途经瓜地摘了六七个南瓜充饥，来到溪边。杨过低头吻了吻小龙女面颊，用油布密密包好木箱，将箱子放入溪水深吸一口气拉着箱子潜入。仗着当年在荒谷山洪中练就的水中功夫，不到一炷香时分便钻出水面，到了通向古墓的地下隧道。小龙女望着熟悉的居室，低声道'咱们终于回家啦'——再也支持不住合上了双目。",
