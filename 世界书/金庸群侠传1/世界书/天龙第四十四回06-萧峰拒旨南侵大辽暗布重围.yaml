  "事件引子": "密旨调集契丹雄师，辽帝调集五京数十万铁骑南侵雁门关。",
  "事件详情": "大辽南京析津府皇宫内，杀气腾腾。辽道宗耶律洪基雄图大展，欲趁宋室虚弱大举伐宋，在崇政殿召见南院大王萧峰。耶律洪基将调兵遣将的金花帅印重重按在御案上，厉声喝道：“御弟，朕命你统领三军二十万铁骑挥师南下，直取汴梁！”萧峰慨然挺立，抱拳断然抗旨：“陛下！臣在中原生息三十载，百姓对我恩重如山。一旦刀兵四起，宋辽两邦必生灵涂炭，萧峰万死不敢奉诏挂帅！”耶律洪基勃然变色，拍案怒斥其忘本背主，兄弟之情荡然无存。耶律洪基深忌萧峰降龙十八掌神威，殿前未敢轻举妄动，冷笑挥退萧峰。萧峰毅然退殿返回行辕，决意舍弃王爵亦不出兵。耶律洪基随即密召御营统领与枢密使，收缴统兵虎符，密令御林亲军与数万契丹控弦精锐连夜潜伏调遣，在萧峰行辕周围及城中九道要隘暗布重重铁桶合围，强弓药箭日夜锁死府邸出入口，将南院大王行辕严密封锁成插翅难飞的绝境死局。",
