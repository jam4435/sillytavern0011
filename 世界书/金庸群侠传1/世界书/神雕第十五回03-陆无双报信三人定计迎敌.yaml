  "事件详情": "箫声中忽听得远处脚步声响有人疾奔而来，程英放下玉箫走到门口叫道：'表妹！'来者正是陆无双。她气喘吁吁地道：'表姊，那女魔头查到了我的踪迹，正一路寻来，咱们快走！'杨过听话声正是陆无双心下一喜，但随即听说李莫愁即将追到暗暗吃惊。陆无双冲进门来满脸喜容叫道：'傻蛋，傻蛋！你怎么寻到了这里？这次可轮到你受伤啦。'她讲述经过：那日酒楼一战后被程英带回此处养伤，伤好后气闷不过出去闲逛，偷听到丐帮化子谈论大胜关英雄大会便去瞧热闹，哪知会已经散了。赶回时在镇外茶馆见到李莫愁的花驴和金铃，总算命不该绝没迎面撞上。三人说起当年李莫愁下毒手害死陆无双父母之事，才知三人幼时曾在嘉兴相会，程英和陆无双都还去过杨过所住的破窑，心头不由得均平添温馨之意。杨过提议溜之大吉，程英点头。陆无双提出分头逃走引开追兵，表姊妹俩你一言我一语互推对方陪伴杨过逃走。杨过听了甚是感动，心想两位姑娘义气干云危急之际甘心冒险来救自己。他朗声道三人结伴同行与魔头拚一死战。程英沉吟道与其途中激战不如以逸待劳，她会得奇门遁甲之术可布阵迎敌。表姊妹俩拿了铁铲锄头掘土搬石忙了一个多时辰，程英满头大汗心中暗自难过：所布土阵与黄蓉的乱石阵实在相差太远。陆无双从怀中取出《五毒秘传》抄本给杨过要他记熟后烧毁，又从怀里取出一块绣红花的半边锦帕低声道若落入李莫愁手中便拿出锦帕来。杨过不明何意愕然不接，陆无双放入他怀中低声道：'可别让我表姊知道。'陆无双走后程英双颊晕红走近榻边，也从怀中取出一块同样的半边锦帕递给杨过，低声道：'若是给她冲进屋来你就拿这块帕子给她罢。'目光与她相接灯下但见她泪眼盈盈又羞又喜。程英也说了同样的话：'千万别让我表妹知道。'杨过将两块半边锦帕拼在一起，原来同是从一块锦帕撕开的——那是李莫愁当年赠给陆展元的定情信物。他望着这块破帕知道中间定有深意，何以二女各自给自己半块？何以都要交给李莫愁？何以又不欲对方知晓？他呆呆出神百思不解。远处鸡声又起，程英箫声幽幽咽咽吹起一曲'流波'，杨过低吟相和。陆无双坐在土堆之后听着箫歌相和，心中暗暗许愿只要杨过平安无恙，就算他与表姊结成鸳侣自己也是死而无憾。",
