  "事件引子": "纯阳指力破空激射，熟铜长棍洞穿见血。",
  "事件详情": "段延庆立誓以段誉人头祭旗，话音刚落便悍然率先出手。他面容僵冷如铁，手中拄着的精钢细杖微微抬起，杖端刹那间激射出一道凌厉无匹的纯阳指力，破空激荡直取段誉要害。护卫褚万里见状大惊，毫不迟疑地挺身横跨护在前方，双手运足内力抡起沉重的熟铜棍奋力封挡。只听得“当”的一声裂金碎石般的巨响回荡林间，段延庆射出的强悍纯阳指力竟硬生生将精坚的熟铜棍洞穿出一个透亮小孔。狂暴雄浑的穿透力震荡而至，褚万里掌中虎口当场迸裂见血，整个人被沛然巨力震得连退数步方才勉强拿稳脚步。南海鳄神岳老三与云中鹤见护卫防线受挫，齐齐发出得意狞笑，各展凶残身手狂扑上来。古笃诚、傅思归与朱丹臣连忙协同负伤的褚万里挥动兵刃死守迎击，与四大恶人正面短兵相接混战在一处。刀光剑影剧烈交错之中，王府四大护卫被死死牵制拖入苦战，严密的护卫阵型瞬间被撕裂，段誉顿失护卫屏障直面凶险。",
  "事件概要": "起因：段延庆钢杖激射纯阳指力直取段誉，褚万里挺身横跨抡熟铜棍奋力封挡。发展：强悍指力硬生生洞穿熟铜棍并震裂褚万里虎口，四大护卫陷入死守苦战。结果：护卫防线被恶人撕裂拖入苦战，段誉顿失护卫屏障直面凶险。",
