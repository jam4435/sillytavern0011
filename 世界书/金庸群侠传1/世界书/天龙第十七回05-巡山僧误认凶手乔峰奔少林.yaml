  "事件引子": "农舍内血腥弥漫，乔峰伏尸痛哭未歇，门外忽传来巡山僧人凌厉的破空急掠声。",
  "事件详情": "乔峰伏在乔三槐夫妇的血泊尸身前悲恸啼哭，双手与胸前衣衫尽被至亲鲜血染红。就在此时，少林寺数名巡山武僧循着凄厉悲啸与血腥之气飞速赶至农舍查探。巡山武僧推门闯入屋内，赫然目睹二老胸膛塌陷惨死于地，而满身血污的乔峰正双目赤红俯在尸身之上。众僧见状大惊失色，先入为主地认定契丹后裔乔峰正是弑杀养父母的大逆不道凶顽，当即悲愤厉喝：“恶徒乔峰，竟敢残害生身父母，罪不容诛！”众僧不由分说，各挺镔铁禅杖与降魔戒刀结阵围攻，带起呼啸劲风当头劈下。乔峰急忙起身悲声分辩：“二老乃我至亲，乔某岂会弑亲！”然而众僧怒火中烧全不采信，攻势愈发凌厉迅猛。乔峰百口莫辩，虽蒙奇冤却感念少林抚育授业之恩，决意绝不重手伤害同门僧众；更因忧心恩师玄苦大师亦遭歹人毒手，毅然放弃纠缠。乔峰运起柔劲施展空手入白刃格开三柄禅杖，借反震之势撞破后窗突围而出；巡山僧人阻截落空，当即吹响尖锐警哨向少林全寺报警传讯，乔峰则怀着焦灼如焚的心情如流星赶月般直奔少林寺山门。",
  "事件概要": "巡山武僧循声闯入农舍，见二老惨死且乔峰满身血污，误认其弑亲大逆不道而挥杖围攻。乔峰百口莫辩，感念少林抚育之恩不愿伤及同门，又恐恩师玄苦遭奸人毒手，遂施展空手入白刃震开兵刃破窗突围，迎着全寺警哨向少林寺疾驰而去。",
