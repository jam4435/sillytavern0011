  "事件引子": "太行隐舍三宿老遭震断经脉灭口，群豪合围栽赃乔峰揽朱突围。",
  "事件详情": "智光大师圆寂断线后，乔峰与阿朱绝不言弃，兼程飞骑奔赴太行山幽谷隐舍，欲向当年参战的赵钱孙及谭公、谭婆探寻雁门关旧秘。两人方掠入竹篱小院，刺鼻血气便扑面而来。乔峰心头骤沉，飞身撞门而入，只见屋内桌椅碎裂、狼藉一片：赵钱孙胸膛凹陷仰面倒地，谭公与谭婆亦双双咽喉碎裂横卧血泊，周身尚存微温。乔峰疾步抢上前去，并指搭脉、细细翻验骨骼创口，惊觉三人皆是被极高明刚猛的内家掌力瞬间震断经脉猝然暴毙，凶手手法狠绝且未留半分门派痕迹，显然系神秘黑衣人先一步施展毒手杀人灭口。就在乔峰拉起阿朱欲循血迹追索凶徒之际，门外骤然金刃破空，循声赶至的太行各路武林群豪将小舍团团围困。众人目睹乔峰双手染血立于尸侧，认定其为了掩盖契丹身份而凶残除灭人证，当即拔剑厉声讨伐。乔峰百口莫辩，不愿妄造杀孽，只得揽住阿朱震退围攻跃顶突围。此役知情宿老全数惨死，武林公敌的黑锅被彻底焊死在乔峰身上，中原群雄同仇敌徾的围杀天网随之彻底合拢。",
  "事件概要": "起因：乔峰阿朱奔赴太行山幽谷隐舍探寻旧秘，方入竹篱小院刺鼻血气扑面而来。发展：推门见赵钱孙胸膛凹陷、谭公谭婆咽喉碎裂皆遭刚猛掌力震碎经脉暴毙灭口尚存微温。结果：太行群豪闻声围困小舍目睹乔峰染血认定其灭口，乔峰百口莫辩揽阿朱震退围攻跃顶突围沦为天下公敌。",
