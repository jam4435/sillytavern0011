  "事件详情": "段誉身负大理国祚传承之重，在中原历经少室山武林浩劫与雁门关惨烈风波之后，遵奉伯父保定帝段正明禅位之遗诏，携同王语嫣、木婉清、钟灵等一众眷属车仗返抵大理皇城。为了抚平战乱动荡、承继大理段氏正统，段誉在金銮殿盛大举行登基大典，正式即位为大理国宣仁皇帝。初登九五之尊，段誉并未沉溺于深宫荣华与天子权柄，而是怀揣仁爱宽厚之心躬亲理政。早朝之上，面对守旧重臣请求增派徭役赋税以实府库的奏疏，段誉端坐龙椅、手按朱批御笔，并未怯场退缩，而是温言据理力争，当堂严词驳回苛政，更明确降旨推行“轻徭薄赋、与民休息、大赦境内”的仁政。随后，段誉传下密令，委派巴天石、朱丹臣等心腹重臣分掌禁卫枢要，严明律法整肃朝纲。段誉毅然舍弃往昔江湖浪子的随性洒脱，日夜在勤政殿披阅公文奏章，并将木婉清与钟灵妥善安顿于后宫偏殿，使内廷秩序井然祥和。随着传国玉玺盖印的大赦诏书颁行全国，大理百官各尽其才，边陲烽烟平息，国力由弱转强、日渐繁盛，大理王朝的统治根基得以牢固奠定，正式拉开了一代仁君治世的序幕。",
