  "事件引子": "大厅外断魂腐骨的药香随风漫入，殿内无量剑门人惶恐骚动，灭门危机已迫在眉睫。",
  "事件详情": "眼见神农帮剧毒烟雾封山且外围弟子伤亡殆尽，无量山剑湖宫已陷入存亡绝续的万分危局之中。面对神农帮主司空玄奉灵鹫宫之令强势来袭的灭门大祸，向来明争暗斗、势同水火的东宗掌门左子穆与西宗掌门辛双清在惊怒之余迅速达成了默契。二人深知若继续纠缠五年一度的比剑胜负与大厅内的私怨私斗，无量剑派今日必将在此道统断绝，于是当机立断宣布暂罢门户私怨，将东西二宗数十名弟子的仇恨与力量彻底拧成一股。左子穆收敛起原本的得意神色，辛双清亦按下长剑，二人迅速喝令惊惶失措的在场门人重整阵脚、严阵以待，统一步调共同迎击外敌。两位掌门随即拔剑当先，带领两宗全部主力精锐离开大殿直奔山道设防，将门派的一切力量完全投入到抵御神农帮凶残入侵的正面生死之战中。",
  "事件概要": "神农帮剧毒封山、外围死伤殆尽的噩耗传来，原本水火不容的东宗掌门左子穆与西宗掌门辛双清在灭派危机前摒弃前嫌，当机立断暂结私怨。二人整肃慌乱的门人，合两宗之力统一步调，各率精锐长剑出鞘直奔山道设防，共抗强敌。",
