  "事件引子": "一日相认一日双亡，虚竹抱双亲尸身痛哭天地同悲。",
  "事件详情": "目睹玄慈震断心脉气绝倒下，叶二娘发出一声凄厉至极的啼哭，整个人疯了般扑倒在玄慈遗体之上。二十四载的相思煎熬与苦寻，未曾想骨肉重逢之日竟是与夫君永诀之时。叶二娘抚摸着玄慈尚有余温的面颊，万念俱灰，眼中疯狂之色尽褪，唯余无限温柔与死志。她转过头，泪眼婆娑地深深看了虚竹最后一眼，凄声呜咽道：“好孩子，娘苦了你二十四年，可你爹爹一个人在黄泉路上太苦，娘得去陪他！”言罢，她右手快如闪电般自腰间皮鞘中拔出一柄薄如柳叶的精钢短刀。虚竹惊骇欲绝，急呼“娘亲”并纵身伸手抓向刀背，殿旁数名少林高僧亦飞身施救。然而叶二娘死意决绝，反手横刃，内力催动下刀锋化作一道雪白匹练，狠绝地割裂自身咽喉。动脉断裂，一股猩红鲜血激喷而出，染红了玄慈胸前的灰白僧袍。精钢短刀当啷坠地，叶二娘软软倒在玄慈怀中，合目气绝。四大恶人中作恶多端的‘无恶不作’，终以血刃割喉自殉，同玄慈交叠瞑目于少林大殿之上。",
