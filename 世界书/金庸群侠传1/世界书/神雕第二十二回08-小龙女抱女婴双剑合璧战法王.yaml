  "事件详情": "金轮法王奔回郭靖住所附近见杨过躲着不出来，便假装兵器撞击之声大叫'好郭靖原来你在此处'、'郭靖快快投降罢'想骗杨过现身。杨过识破他的诡计暗笑'臭贼秃险些上了你的鬼当'。法王又大声叫道'杨过这次你总死了罢'想引郭靖冲出来救人。小龙女听到杨过遭逢危难情切关心冲出来挺剑向法王扑去。杨过仗剑上前与小龙女相对一笑使出'玉女素心剑法'将法王裹在剑光之中。法王暗暗叫苦被二人双剑合璧困住。他自上次铩羽后潜心钻研出一套'五轮大转'来对付这剑法，当下探手怀中呛啷啷一阵响亮空中飞起金银铜铁铅五只轮子。杨过与小龙女登感眼花缭乱先守紧门户不敢即攻。法王五轮运转如飞却攻不进二人剑光织成的光网之中。正自气馁时小龙女怀中突然'哇哇'两声发出婴儿啼哭——她听到杨过遇险时匆忙冲出顺手将黄蓉刚产下的女婴抱在怀中。这一来不但法王大吃一惊连杨过也诧异无比三人手下招数均自缓了。小龙女左手轻拍说'小宝宝莫哭你瞧我打退老和尚'哪知婴儿越哭越是厉害。杨过低问'郭伯母的？'小龙女点头。法王虽想不透小龙女怀抱婴儿作甚但想她多了累赘剑法威力势必大减当下催动金轮猛向小龙女攻击。杨过连出数剑接过攻势。婴儿哭叫声中法王攻势渐猛，小龙女想将婴儿交给杨过好专心使剑。二人心意合一霎时间双剑锋芒陡长，小龙女左手将婴儿送过来杨过正要伸手去接倏地黑影闪动铁轮斜飞砸向婴儿。小龙女怕婴儿受伤手掌翻起以金丝手套抓住铁轮——正是四两拨千斤的妙用。杨过接过婴儿，小龙女举起铁轮砸向法王来一个即以其人之道还治其人之身。法王又惊又愧五轮失其一'五轮大转'登时破了。杨过左手抱了孩子小龙女左手持铁轮与杨过双剑齐攻。岂知数招之下与杨过的剑法格格不入竟尔难以合璧——原来'玉女素心剑法'妙诣纯在使剑者两情欢悦心中全无渣滓，此时双剑之中多了一个铁轮就如一对情侣之间插进了第三者波折横生。杨过心念一动已明白小龙女用意——要他骑汗血宝马抱婴儿去绝情谷以郭靖幼女换绝情丹。但他此时对郭靖赤心为国之心钦佩已极实不愿为自己而使他女儿遭遇凶险。心意忽变之下二人手上剑法更难相互呼应。法王乘势肘锤击中杨过左肩。杨过半身一麻抱着的婴儿脱手落下径往地下摔落。三人在屋顶恶斗婴儿若摔下去哪里还有性命？法王右手一挥金轮飞出刚好托在婴儿襁褓之下——他想携走郭靖之女为质逼郭靖降服。金轮离地五尺平平飞去将婴儿托在轮上。三人齐从屋顶纵落要去抢那轮子。杨过右足在地下一点一个打滚要垫身金轮之下将轮和人一并抱住。突见一只手臂从旁伸过抓住金轮连着婴儿抱了过去——那人随即转身便奔。小龙女叫道'是我师姊'。杨过见那人身披淡黄道袍右手执着拂尘正是李莫愁的背影。",
