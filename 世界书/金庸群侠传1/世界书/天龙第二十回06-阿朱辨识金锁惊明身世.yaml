  "事件引子": "幽暗客栈内室烛火摇曳，窗外夜色苍茫，依稀传来乔峰整肃行装的沉厚声息。",
  "事件详情": "乔峰杀气腾腾整肃行装誓赴小镜湖复仇，而在客栈内室灯下的阿朱，内心却掀起了毁天灭地的惊涛骇浪。阿朱独坐幽灯之前，回想起康敏提及段正淳昔年情事的诗句细节，心中疑窦丛生，遂颤抖着解开衣襟，取出自幼贴身珍藏的唯一血脉信物——一枚赤金长命锁与半方陈旧锦帕。在跳荡的烛光映照下，阿朱并指拂去锁面尘垢，金锁正面赫然镌刻着“天上星，亮晶晶，永灿灿，莫忘情”十二字小篆，背面则烙着一个清晰夺目的“段”字，与锦帕上的阮姓刺绣相互印证，分毫不差。阿朱如遭晴天霹雳，脑海一片空白，浑身冰凉颤栗，金锁失手跌落在木桌上发出清脆哀鸣。她骇然查明了残酷至极的身世真相：自己苦寻多年的生身父母，正是大理镇南王段正淳与情妇阮星竹！看着窗外月下挥刀练招、誓杀仇敌的至爱乔峰，阿朱泪如雨下、肝肠寸断。一边是生死相随的挚爱，一边是血浓于水的生父，这枚染着骨血的金锁瞬间将她推向情义难全的绝望深渊。",
  "事件概要": "阿朱独坐客栈灯下，疑窦丛生间取出贴身赤金长命锁与锦帕，拂尘惊见小篆诗句与“段”字落款，赫然印证生身父母正是段正淳与阮星竹。目睹挚爱乔峰誓杀仇敌，阿朱陷入生父与爱侣情义难全的绝望痛苦之中。",
