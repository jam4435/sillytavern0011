  "事件引子": "幽暗内室弥漫浓重血腥与甜腻蜜香，八角菱花铜镜泛着寒光，凄厉哀鸣回荡不息。",
  "事件详情": "康敏自幼性情偏狭扭曲，平生最引以为狂傲资本的便是那副足以倾国倾城、颠倒众生男儿的绝世美貌，在她心中容颜之珍贵远胜过自己的性命与尊严。此刻在阿紫残忍掰开其眼皮的逼迫下，康敏不得不颤抖着睁开充血红肿的泪眼，目光直直撞上了那面八角菱花铜镜的冰冷镜面。刹那之间，铜镜中清晰映出了一张血肉模糊、千疮百孔、脓血混着泥污肆意流淌，且有无数黑色毒蚁在皮肉烂洞中穿梭啃噬的狰狞怪物面孔，哪里还寻得到半分往昔白皙滑腻、娇艳动人的倾城容颜。这一幕极度可怖惊悚的凄惨画面犹如九天神雷当头劈落，在瞬间以摧枯拉朽之势彻底碾碎了康敏毕生的骄傲与最后一丝精神防线。在难以言喻的无尽绝望、羞耻与极致惊骇的猛烈冲击下，康敏喉咙深处爆出一阵破风箱般的凄厉尖啸，一口极度郁结的怨毒急火猛冲心脉，胸中黑血狂喷而出，整个人四肢剧烈抽搐了几下后瞳孔骤然涣散，竟硬生生被镜中自己的恐怖鬼相活活吓断了心脉，身躯一挺当场暴毙栽倒在梳妆台前。随着康敏的骤然横死，雁门关带头大哥的最后线索彻底在马宅断绝。",
  "事件概要": "阿紫强掰开康敏眼皮逼其直视铜镜，康敏骤见镜中血肉模糊、毒蚁穿行啃噬的狰狞怪物鬼相，毕生赖以狂傲的倾城容颜彻底粉碎。极致羞骇与绝望冲击之下，康敏郁怒攻心口喷黑血，心脉骤断当场气绝暴毙，雁门关带头大哥的线索随之彻底断绝。",
