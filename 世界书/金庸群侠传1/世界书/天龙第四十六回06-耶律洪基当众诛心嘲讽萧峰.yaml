  "事件详情": "大辽数十万铁骑奉命缓缓后撤之际，脱离性命之危的耶律洪基在重重卫队护卫下勒马止步。身为威加海内的大辽至尊，在两军阵前受俘并被迫折箭立誓的奇耻大辱让他怨毒滔天。耶律洪基策马回身，马鞭直指傲立风中的萧峰，当着天下群雄与万千将士的面放声冷笑，言辞极尽刻毒诛心：“萧大王，你今日好威风！你生擒朕躬逼退大军，为大宋立下了不世奇功，赵家天子不知该如何重重封赏于你！但你给朕听着，你身上流的是大辽契丹萧氏的骨血，今日你为了汉人逼迫君王、背叛母国，乃是不忠不义的大辽罪人！你百年之后，有何面目去黄泉之下见大辽列祖列宗？又有何面目去见辽东父老乡亲？你算什么顶天立地的契丹男儿！”字字句句如烧红的钢针狠狠刺入萧峰心窍。萧峰如遭雷击，雄伟的身躯剧烈震颤，脸色由白转青，喉头涌上一口逆血。他虽保全两国万民，却背负了背叛故土君王的不赦骂名，天地虽大却无半寸立足之地，忠义难全的巨大痛苦将其彻底推入万劫不复的心灵深渊。",
