  "事件详情": "二老重伤休养数日方略见回复生气。杨过将他们扶进山洞分卧两侧自己在中间隔开。这日洪七公忽然叫道：'臭蛤蟆，你服了我么？'欧阳锋道：'服什么？我还有许多武功尚未使出，尽数施展定要打得你一败涂地。'洪七公大笑说正巧自己也有好多武功未用，提起丐帮打狗棒法。欧阳锋一凛心想打狗棒法似乎厉害得紧，嘴上却说：'打狗棒法有什么了不起？'洪七公颇为后悔日前未使棒法——觉得他神智不清自己本已占了不少便宜再以镇帮之宝对付未免胜之不武，到头来竟两败俱伤。灵机一动向杨过招手俯耳说明自己是丐帮前任帮主，要传杨过打狗棒法招式——只学架式不知运劲诀窍，摆几个姿式让欧阳锋看。杨过推托怕帮洪七公赢义父，洪七公窥破心意高声激将欧阳锋。欧阳锋大叫：'孩儿快摆出来我瞧！'杨过无奈走到洪七公身旁，取过树枝学了第一招'棒打双犬'便照式演出。欧阳锋见棒招神奇想了良久，将一式杖法说给杨过。洪七公微微一笑又说了一招。两人如此大费唇舌比武，比到傍晚也不过拆了十来招杨过已累得满身大汗。如此比了三天，三十六路棒法方始说完。棒法精微变化奥妙无穷，越到后来欧阳锋思索的时刻越长，但他所回击的招数也尽是攻守兼备威力凌厉的佳作，洪七公看了也不禁叹服。",
