  "事件引子": "真情告白消解疑云，整肃车马踏上归途。",
  "事件详情": "追兵尽退之后，在屋内目睹一切的木婉清缓步走出农舍，骤然得知同生共死的段郎竟是大理国皇位继承人，心中震惊翻涌且产生身世差距的自卑与忐忑；段誉察觉到木婉清的心绪变化，决心表明矢志不渝的真心。木婉清凝望着眼前的青衫书生，惊诧万分地颤声问道：“段郎，你……你竟是大理国的皇族世子？”段誉毫不犹豫地上前一步，伸出双手温柔而坚定地握住木婉清微凉的玉手，神色无比诚挚恳切地直视其双眼承诺道：“婉妹，无论我是书生还是世子，我对你的心意永世不移。”听闻这番发自肺腑的真情告白，木婉清心中的疑虑与不安瞬间烟消云散，眼眸中泪光莹然闪动，二人在这劫后余生的农舍前紧紧依偎相拥在一起。二人情意历经磨难愈加深厚坚定，随后褚万里与古笃诚整肃车马，忠心耿耿地护送段誉与木婉清启程踏上返回大理镇南王府的归途，本回故事就此落下圆满帷幕。",
  "事件概要": "起因：木婉清走出农舍惊悉段郎为皇族世子，因身世差距产生自卑忐忑与疑虑。发展：段誉上前坚定握住其玉手，诚挚许诺无论书生还是世子皆心意永世不移。结果：二人释怀相拥情意愈坚，二将整肃车马护送二人踏上返回镇南王府的归途。",
