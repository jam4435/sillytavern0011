  "事件引子": "大厅内比剑方歇，青袍少年狂言未绝，森寒剑气骤然暴起，满堂宾客尽皆屏息侧目。",
  "事件详情": "刚在同门比剑中削发夺魁的东宗弟子龚光杰本已自得满满，此刻见段誉这名毫无武功的狂妄书生不仅暗中嗤笑，还在此大言不惭，顿觉无量剑派的百年威严与自身武艺受到了莫大羞辱，瞬间心头火起、杀机大盛。龚光杰面露狰狞之色，持剑大步流星跨向前去，森寒锋利的剑尖猛然逼至段誉面门三寸之处，厉声暴喝斥责其为狂妄书生，竟敢胆大包天嘲弄无量剑法，怒吼着要段誉纳命来偿。话音未落，龚光杰体内内力运转，毫无留情地挺起长剑，挟着一股凌厉破风的杀意直刺段誉胸膛要害。段誉身为文弱儒生，平生从未习练过拳脚剑法，更无任何临敌闪避之能，眼见雪亮的剑尖带着死亡寒意扑面袭来，惊骇绝伦之下已然避无可避，只得绝望地紧闭双眼立在原地闭目待毙。剑尖眼看就要洞穿段誉胸膛，大厅内的流血惨剧已然一触即发。",
  "事件概要": "龚光杰因段誉嗤笑无量剑法而恼羞成怒，自觉颜面扫地且师门威严受辱，盛怒之下拔剑逼近喝问。见段誉仍不知畏惧，龚光杰杀机骤起，运劲挺剑挟凌厉风声直刺其胸膛要害。段誉全无半点武功，骇极之下避无可避，唯有绝望闭目待毙，大厅杀戮一触即发。",
