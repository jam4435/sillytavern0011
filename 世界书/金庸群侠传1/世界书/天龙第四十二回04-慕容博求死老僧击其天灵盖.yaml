  "事件详情": "在体内致命隐疾发作与神僧佛法的浩瀚震慑之下，慕容博深知自己当年挑起雁门关惨案罪孽深重，且身患绝症早已时日无多。但他一生执念于大燕复国大业，企图以自身的性命为筹码，当众提出愿以自身一死来换取大燕复国。然而扫地老僧闻言却只是慈悲长叹一声，宣了一声“冤冤相报何时了，阿弥陀佛”。话音未落，老僧看似轻描淡写地抬起一掌，掌势看似缓慢柔和毫无杀气，实则快逾闪电，正正击中慕容博的天灵盖！这看似轻飘飘的一掌落下，慕容博甚至未能做出任何抵挡与闪避，整个人浑身剧烈一震，顶门受击之下体内气息瞬间断绝，双眼翻白，当场颓然倒地气绝身亡！一心筹谋复国的绝顶枭雄慕容博猝然毙命，这一惊天变故发生得快如电光石火，令一旁的萧峰与慕容复惊骇欲绝，藏经阁内的局势瞬间从博弈交锋陷入了极度的死寂与惊恐之中。",
