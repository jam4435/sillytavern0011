名称：逍遥派
类型：宗门
核心地域：西域/天山/灵鹫宫
【稳定定位】传承极少而层次极高，武学以空灵变化、深厚内功和奇门杂学著称；门中不同支系可各有居所、弟子与个人恩怨，不能把所有支系视为日常统一行动的大门派。
【组织与接触】核心传承高度依赖个人师承与机缘，普通江湖人往往只知传闻；灵鹫宫、擂鼓山等关联场所也不等同于任何人可以自由出入。
【江湖认知】真正了解逍遥派全貌者很少，外界常通过无崖子、天山童姥、李秋水等人物片段认识该派。知道这些名字不代表知道北冥、折梅手等具体修炼法门。
【动态事实规则】掌门归属、支系关系、人物生死、灵鹫宫控制权和门内恩怨，以当前变量、世界事件、游戏时间和实际剧情为准。
