<势力信息>
名称：逍遥派
类型：宗门 / 隐世传承
核心地域：无固定公开总坛；擂鼓山、无量玉洞等只在相应剧情中出现
【稳定定位】逍遥派是传承极少而层次极高的隐世师门，以北冥、小无相、凌波及无崖子、李秋水一系高阶武学为核心。灵鹫宫现作为独立正式势力处理，不能再把九天九部、三十六洞七十二岛等组织结构写成逍遥派日常门人体系。
【组织与接触】逍遥派更依赖个人师承、掌门信物与特殊机缘，不存在普通江湖人随意投帖便可进入的大型山门。苏星河、函谷门人与其他支线也不等于共享全部核心传承。
【江湖认知】真正了解逍遥派全貌者很少，外界通常只通过无崖子、李秋水、苏星河等人物片段接触该派。知道人物名字不代表知道北冥神功、小无相功或凌波微步的修炼法门。
【动态事实规则】掌门归属、人物生死、支线关系与传承去向，以当前变量、世界事件、游戏时间和实际剧情为准。
</势力信息>
