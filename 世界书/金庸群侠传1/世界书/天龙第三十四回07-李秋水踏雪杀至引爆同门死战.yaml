  "事件引子": "西夏皇宫地底冰窖寒气森森，万斤玄冰凝滞幽暗，唯有九十日苦修将满的真气激荡回响。",
  "事件详情": "西夏冰窖深处寒气森森，天山童姥九十日苦修即将功德圆满，体内功力已迅猛恢复至八九成，正当全力冲刺大关之际，冰窖入口骤起剧烈轰鸣。厚重的玄冰石门被一股排山倒海的雄浑掌力轰然震碎，碎冰如暴雨般四散激射。漫天冰雾之中，一道白衣胜雪、身姿婀娜的倩影足踏“凌波微步”飘然而至，幽香袭人，正是追踪踪迹而至的西夏皇妃李秋水。李秋水隔空冷笑出声：“好师姐，叫小妹找得好苦！”童姥目睹宿敌现身，眼中杀机暴涨，厉声尖啸间拔地而起，双掌化作漫天凌厉绝伦的“天山折梅手”残影，裹挟万钧罡气直逼李秋水周身死穴。李秋水面色一寒，挥袖运起逍遥派绝技“白虹掌力”，真气曲直如意变幻莫测，自刁钻角度迂回轰向童姥后心。二人瞬间贴身激战，掌影交错、指风如刃，雄浑无匹的护体真气激烈碰撞，引爆阵阵雷鸣般的狂暴气浪，震得整个地底冰窖剧烈晃动、万斤玄冰轰然塌落。百年情仇积怨在这一刻彻底爆发，同门绝顶强敌毫不留情，招招直取性命，一场不死不休的巅峰死战轰然引爆。",
  "事件概要": "天山童姥九十日苦修将满之际，宿敌李秋水突施神掌震碎玄冰石门杀入。童姥含恨施展天山折梅手悍然迎敌，李秋水以白虹掌力曲直迂回截杀。两大绝顶强者百年宿怨彻底爆发，凌厉罡气崩碎万斤玄冰，在地底深处展开不死不休的生死搏杀。",
