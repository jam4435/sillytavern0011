  "事件引子": "听香水榭外湖水澹澹，一叶扁舟荡开水波，载着各怀心事的四人滑入苍茫芦苇深处。",
  "事件详情": "茶毕席散，鸠摩智一心急于践行当年诺言，前往慕容博墓前焚化经书祭奠，遂厉声催促众人即刻启程动身。阿朱与阿碧不动声色，顺从地在前引路，诱使鸠摩智与已恢复行动自如的段誉一同登上一艘狭长快船。开船之后，二女凭借对姑苏水路的极度熟稔，驾驭扁舟穿梭于太湖深处纵横交错、宛若迷阵的茂密芦苇丛中。鸠摩智身居船上，虽急切催促，却因不识江南复杂水系而只能任由二女掌舵引航。二女并未将船驶向参合庄坟茔，而是暗中调整航向，将小舟一路诱驶至太湖深处一座名为“曼陀山庄”的隐秘岛屿附近水域。该庄园乃是姑苏慕容复之表妹王语嫣与其母王夫人深居之所，庄内广植各类珍奇茶花，防卫森严，更有严禁任何外姓男子踏入庄内半步的严酷规矩。阿朱与阿碧借此特定水域地形，成功将鸠摩智引入易于脱身的水上绝境，完成了逃亡计划的关键位置转移。",
