  "事件引子": "杏林中杀机骤浓，四长老兵刃齐出，寒芒飞掠间按九宫八卦方位将乔峰团团围困。",
  "事件详情": "全冠清见巧言狡辩被乔峰当场喝斥，唯恐夜长梦多，当即厉声挑唆四大长老立刻动手兵变。宋长老、奚长老、陈孤雁、吴长风受其煽动与蛊惑，为求逼宫夺权，再无顾忌，齐齐亮出随身兵刃。刹那间，长枪、钢杖、单刀等利刃出鞘，寒芒闪烁夺目。四大长老脚踏九宫八卦方位飞速穿插跑动，运转丐帮传承的“打狗阵法”，将乔峰团团围困在阵法中央。四人配合默契无间，借阵法流转之势齐声呼喝，宋长老挺枪直刺、奚长老挥杖横扫、陈孤雁与吴长风各舞兵刃封锁退路，兵刃挟着呼呼风声，自前后左右四个方向同时向乔峰周身要害发动了狂风暴雨般的猛烈围攻。面对四大长老以本门大阵痛下杀手的险境，乔峰临危不乱，沉稳伫立于风暴中心，坦然迎战昔日袍泽。打狗阵法杀机毕露，刀光杖影织成天罗地网将乔峰彻底笼罩，现场剑拔弩张的争执彻底演化为你死我活的白刃搏杀。",
