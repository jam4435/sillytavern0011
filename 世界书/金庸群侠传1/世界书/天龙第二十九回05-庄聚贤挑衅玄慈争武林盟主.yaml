  "事件引子": "大雄宝殿前群雄屏息凝神，少林与丐帮阵列森然相对，阶前弥漫着一触即发的肃杀寒气。",
  "事件详情": "少林寺大雄宝殿前群雄屏息凝神，肃杀之气笼罩全场。在全冠清的连番耳语催促与煽动下，丐帮帮主庄聚贤按捺不住暴虐戾气，昂首阔步自丐帮阵列中悍然迈步而出。庄聚贤脸上紧扣着冰冷狰狞的生铁面具，眼孔中透出森森幽光，当着天下数千英雄豪杰的面，抬起右手指着高阶之上的玄慈方丈，厉声发难咆哮：“天下皆称少林乃武林泰斗，如今依我看早已名不副实！今日我丐帮便要与玄慈方丈领教高下，胜者号令天下正派、尊为武林盟主！”言罢，他猛然一振灰袍长袖，体内至阴至寒的冰蚕真气呼啸奔涌而出，身前丈余坚硬的青石砖地面被掌风生生震裂，碎石激射之际瞬间覆上一层白茫茫的厚重冻霜。少林戒律院玄寂当即怒目圆睁，踏前厉声斥责其目无尊长、狂悖无道。玄慈方丈却神色从容安详，缓缓抬手止住身后众僧，迈步走下石阶合十应道：“阿弥陀佛，庄帮主既执意求教，老衲便领教施主高招。”二人内力在空中无形碰撞激荡，气浪逼得近前群豪连连后退，少林与丐帮两大泰斗门派的正面生死决斗就此拉开序幕。",
  "事件概要": "全冠清暗中挑唆庄聚贤出列发难，狂言少林名不副实并以冰蚕毒劲震裂石阶，公然争夺武林盟主之位。玄寂厉斥其狂悖无道，玄慈方丈神色从容下阶迎战，少林与丐帮两大名门泰斗就此拉开正面决斗序幕。",
