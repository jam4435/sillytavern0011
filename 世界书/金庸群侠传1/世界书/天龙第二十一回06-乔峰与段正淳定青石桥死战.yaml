  "事件详情": "眼见段正淳在席间亲口坦白承认当年“罪孽深重、悔之晚矣”，乔峰胸中积压已久的滔天仇恨被彻底引爆。他认定眼前的段正淳正是害死生身父母、导致自己身世凄凉的元凶巨恶，当下再也无法抑制满腔杀机。乔峰面色铁青，当场向段正淳严厉立约：定于今夜三更时分，在小镜湖畔的青石桥上，二人各凭平生武学决一死战，以命相搏，彻底了结三十年前雁门关外的血海深仇。段正淳虽然对乔峰口中三十年前的“血海深仇”具体何指感到不明就里、满腹疑窦，但眼见对方杀意决绝如铁、毫无转圜余地，且自己内心深处对当年的情债亦怀着深重的负罪与愧疚。身为大理段氏的镇南王与名震天下的武林豪侠，段正淳自有一身傲骨与担当，绝不愿临阵退缩示弱，当即慨然挺胸应战，接下了这场生死决斗的战约。席间的谢恩气氛荡然无存，双方正式定下三更青石桥的死斗之约，一场惨烈至极的血战不可避免地逼近。",
