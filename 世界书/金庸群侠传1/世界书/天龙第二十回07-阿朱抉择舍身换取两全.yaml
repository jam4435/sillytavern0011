  "事件引子": "暮夜里小镜湖畔黑云翻墨，青石桥头凄风怒号，生死复仇之约如悬顶利刃。",
  "事件详情": "风雨欲来的小镜湖畔，面对翌日乔峰与段正淳的生死决战，阿朱独伫青石桥头，陷入了生不如死的剧痛煎熬。阿朱在凄风苦雨中默默盘算：若放任乔峰斩杀段正淳，生父必血溅当场，但大理段氏威震西南，六脉神剑与一阳指名动天下，大理举国高手势必誓死围剿乔峰，乔峰终生将陷入无休止的杀戮与险境；若出言拦阻乔峰复仇，乔峰背负三十载的杀父母血海深仇将永无昭雪之期，余生必在无尽愧疚与抑郁中痛苦沉沦。在万般绝望与两行清泪中，深情而坚韧的阿朱终于做出了泣血抉择——唯有以己之躯代父受死，方能解开这道必死之局。阿朱折回房内，凝视着沉睡中的至爱乔峰，含泪将贴身锦帕轻塞入其枕畔，随后决绝地取出颜料与胶泥，在铜镜前将自己化装成大理镇南王段正淳的模样。阿朱系紧衣带、披上蓑衣，毅然迈步踏入雷电交加的暴雨狂澜之中，以血肉之躯去迎向乔峰无坚不摧的降龙神掌，誓以生命换取父爱与情义的两全解脱。",
  "事件概要": "面对乔峰与段正淳的死决，阿朱深知生父血仇与挚爱安危两难全，决意代父受死以解死局。她折返房中将锦帕留于熟睡的乔峰枕畔，旋即施展绝顶易容术化为段正淳模样，披蓑冒雨奔赴青石桥头，甘受降龙神掌舍身求全。",
