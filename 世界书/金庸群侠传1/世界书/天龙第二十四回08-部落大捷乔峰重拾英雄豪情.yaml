  "事件引子": "营寨硝烟渐渐散去，残雪染血的栅栏旁欢呼震天，女真猎人们纷纷相拥而泣。",
  "事件详情": "雪原战阵上的硝烟渐渐散去，数百名契丹降兵悉数被收缴兵刃、押入营栅，被解救的女真族人从血泊与废墟中走出，营地爆发出了响彻云霄的欢呼与战歌。右臂裹着白布的完颜阿骨打快步上前，双目饱含热泪与无限敬意，双手将缴获自辽军主帅的镶金佩刀与纯白汗血战马金缰恭敬呈献给乔峰，率全营猎人深深下拜，高呼其为女真真正的庇护天神。乔峰朗声大笑，伸出双手稳稳托起阿骨打的臂膀，接过那柄象征大捷的金刀佩于腰间，随手拍开一坛烈酒拍泥痛饮，与劫后余生的族人们同饮庆功。此前在中原武林，乔峰屡遭猜忌、构陷与背弃，受尽“契丹恶徒”的千夫所指，内心常怀悲凉落寞；而在此刻的长白雪原之上，面对女真族人赤诚质朴的崇敬与生死相托的兄弟情义，乔峰胸中积压已久的愤懑与阴霾如烈日融雪般彻底烟消云散。他傲立于茫茫苍穹与万里林海之间，任由刺骨寒风吹拂衣袍，体内热血再度沸腾激荡，在这极北塞外彻底重拾了睥睨天下的顶天立地盖世英雄豪情。",
  "事件概要": "女真部落扫荡残敌取得大捷，阿骨打携缴获的金刀与战马率众叩谢救族恩公。乔峰受赠金刀并痛饮烈酒，感怀于塞外部落生死与共的质朴赤忱，在中原蒙受的冤屈阴霾一扫而空，重铸傲立天地的盖世英雄气概。",
