  "事件引子": "幽暗石室内粗绳轻晃，长须老者袖袍微拂，昏暗虚空中陡然卷起沛然莫御的吸摄风声。",
  "事件详情": "问明虚竹底细之后，无崖子不再迟疑，当即决意扫清虚竹体内原有的杂芜武学，以便传授逍遥派至高神功。无崖子不由分说，长袖微动运转起本门独步天下的“化功”与“北冥神功”。虚竹尚未反应过来，只觉一股沛然莫御的磅礴吸力凭空涌现，整个人不由自主地被凌空倒悬吸摄至无崖子身前。无崖子双掌按住虚竹周身要穴，以内家至高玄功强行倒悬相吸。虚竹只觉丹田与奇经八脉剧烈震荡，原本自幼在少林寺苦苦修习积攒多年的微薄少林派内力，在北冥神功霸道绝伦的吸化之下被瞬间抽离、硬生生尽数化去化散。虚竹惊骇欲绝、大惊失色，只当自己武功被废性命难保，拼命挣扎却动弹不得。在无崖子迅疾绝伦的化功手段下，虚竹周身经脉瞬间变得空空如也，少林内力被彻底洗刷殆尽，沦为一片纯净空明的内力容器，为承纳绝顶神功彻底扫清了阻碍。",
