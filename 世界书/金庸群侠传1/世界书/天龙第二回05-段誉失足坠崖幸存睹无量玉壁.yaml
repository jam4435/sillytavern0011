  "事件引子": "夜幕低垂，无量后山寒风呼啸、山径险绝，失足坠崖的惊呼声被万丈深谷瞬间吞没。",
  "事件详情": "段誉身中七日断肠剧毒，心中时刻挂念着钟灵的安危，在荒芜苍茫的深山中拼命奔行。直至天色完全黑透，四周山道愈发崎岖陡峭、险象环生。段誉本是一介柔弱书生，脚力虚浮加之黑夜难辨路径，在慌乱摸索中脚下一滑，瞬间失足跌出陡峭山径，径直向着万丈悬崖与无底深谷疾速坠落。千钧一发之际，悬崖绝壁之间层层缠绕的古藤与斜刺生出的枝桠阻缓了下坠之势，段誉侥幸被挂在一株坚韧的古松之上，奇迹般躲过粉身碎骨之灾、大难不死。惊魂稍定后，段誉手脚并用，顺着悬崖上垂落的粗壮藤蔓小心翼翼滑降至谷底平地。放眼望去，谷底竟横卧着一片清澈如镜、波澜不惊的幽静湖泊；明媚月光倾泻而下，映照在湖泊对岸平整光滑的绝壁上，宛如一面莹润剔透的巨大白玉璧。更令人称奇的是，玉璧之上竟隐隐倒映出两道手持长剑、翩然起舞的仙人飘逸身影，赫然便是名震江湖武林的“无量玉壁”奇景。",
  "事件概要": "段誉身中剧毒夜奔寻路，失足跌落万丈绝壁，侥幸受古松古藤阻隔大难不死。他攀援下至谷底湖畔，月光下一面巨大平整的玉璧绝壁赫然耸立，壁上更倒映出两道持剑起舞的仙人虚影，目睹了名震江湖的无量玉璧奇观。",
