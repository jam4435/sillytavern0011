  "事件引子": "号角连天重返中原，虚竹率灵鹫九部万仙群豪浩荡奔赴少林寺。",
  "事件详情": "虚竹接掌灵鹫宫大位不久，灵鹫宫九天九部侍女与受生死符酷刑控制的三十六洞洞主、七十二岛岛主等万仙群魔闻讯齐聚缥缈峰大殿。群豪因长期遭受生死符求生不得、求死不能的非人折磨，神情惶恐狂躁，怀揣试探与疑虑逼近大殿。虚竹端坐主位，亮出掌中象征至高尊位的逍遥派掌门七宝指环，并温言宣告将依佛门慈悲为众人拔除生死符。群豪见状又惊又喜，纷纷拜倒在地哀求救命。虚竹毫不迟疑，当即走下殿阶，运起精妙绝伦的天山六阳掌，以雄厚无匹的内力在指尖转化水火阴阳之气，依次点按乌老大、安洞主等群雄身上的各大要穴。虚竹以内力精准化解逼出深植于他们经脉脏腑中的阴寒生死符冰劲。伴随着一缕缕白雾从群豪头顶升腾，折磨众人数十年的奇毒剧痛彻底消散无踪。重获新生的万仙群魔惊喜交加、痛哭流涕，对虚竹的浩荡恩德佩服得五体投地，齐声跪拜高呼宫主万岁。九天九部侍女亦心悦诚服，虚竹在灵鹫宫及天山群雄中的领袖威望由此坚如磐石。",
  "事件概要": "虚竹得知少室山武林大会即将召开（起因）；率领九天九部与三十六洞万仙浩荡东行重返中原（发展）；少林英雄大会风云际会（结果）。",
