  "事件引子": "藏经阁内残帚横陈，扫地老僧目光深邃，凝视着剑拔弩张的萧远山与慕容博。",
  "事件详情": "藏经阁内，扫地老僧在阐明佛法化解戾气之理后，目光平静而深邃地投向萧远山与慕容博二人。老僧言辞如炬，当面一语道破二人三十年来潜伏在少林藏经阁内强行兼练多门绝技、导致体内早已积聚下致命隐疾的惊天秘密。萧远山与慕容博闻听此言，心神剧震，面上虽强自镇定，暗中却各自暗提丹田真气，沿周天经脉飞速流转以验虚实。岂料真气甫一运转行至关隘，二人胸口与丹田处猛然传来一阵剧烈难当的撕裂刺痛，真气逆冲乱撞，痛彻骨髓，令二人身形微晃、呼吸受阻，险些难以自持。二人三十年来苦练绝技所积攒的凶煞戾气，此刻在老僧点拨下彻底发作显形。面对体内这般无法逆转的致命内伤绝症，萧远山与慕容博面色惨白、骇然失色，彻底认清了自身早已病入膏肓的严酷现实，原本不可一世的腾腾杀气顿时被无尽的惊恐与动摇所取代，阁内原本剑拔弩张的死斗局势由此产生剧烈转折。",
  "事件概要": "扫地老僧当面道破萧远山与慕容博强练少林绝技已积下致命隐疾。二人暗提真气自验，关隘处剧痛攻心、经脉逆乱，彻底证实内伤已深入脏腑、无药可救。二人骇然失色，原本不可一世的滔天杀气化作惊恐，阁内生死搏杀之势骤生逆转。",
