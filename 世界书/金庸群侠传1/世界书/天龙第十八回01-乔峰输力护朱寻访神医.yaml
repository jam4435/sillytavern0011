  "事件引子": "乔峰昼夜输力护阿朱残喘，探知薛神医之名誓赴求医。",
  "事件详情": "阿朱身受重创、五脏破损严重，性命危在旦夕，寻常医道与凡俗药石根本无力回天。乔峰为保住阿朱性命，带着重伤垂死的她一路风尘仆仆地昼夜奔波，沿途不敢有丝毫停歇。在颠簸求医途中，乔峰心急如焚，唯有不惜损耗自身真元，调动极其雄厚霸道的内力，日夜源源不断地渡入阿朱体内，护住其衰微的心脉五脏，强行替其续命延息。然而阿朱受创极深，仅凭内力支撑终非长久之计，若无当世绝顶医道圣手施救，阿朱随时可能香消玉殒。危急关头，乔峰探知天下唯有一人拥有起死回生之能，那便是江湖上人称“阎王敌”的薛慕华神医。为了给阿朱争取那一线渺茫的生机，乔峰毅然决然将全部希望寄托于薛慕华身上，哪怕前路布满刀山火海，也下定决心必须尽快赶赴薛神医所在之处求取医治。此番奔波最终令阿朱在雄浑内力的护持下勉强维持住了微弱的生机残喘，乔峰亦彻底明确了直寻薛慕华施救的行止方向。",
  "事件概要": "起因：阿朱五脏破损严重性命危在旦夕，寻常医道凡俗药石根本无力回天。发展：乔峰不惜损耗真元日夜源源不断将浑厚内力渡入阿朱体内强行续命，沿途昼夜奔波不敢停歇。结果：乔峰探知唯阎王敌薛慕华有起死回生之能，下定决心直奔薛神医所在之处求取医治。",
