  "事件引子": "夜色深沉，谷底火把攒动、呼喝声震荡绝壁，神农帮追兵已攀附岩壁合围而来。",
  "事件详情": "面对自崖底攀附而上、火把攒动的神农帮追兵，段誉俯下身来将伤重体虚的木婉清稳稳背负在背上。木婉清伸出双手紧紧环抱住段誉的脖颈，一缕幽香扑鼻而来。段誉深吸一口气，敛气凝神，当即在狭窄崖台边缘全力展动新近习成的“凌波微步”。只见段誉足尖在嶙峋陡峭的绝壁险岩上连连轻盈点踏，真气周流之下，其身形宛如一片不受力道的轻羽，在绝壁与弥漫的云雾之间穿梭自如。神农帮帮众在下方乱箭齐发、火把挥舞，冷箭呼啸射来，段誉却依循玄妙的易经卦象步法随心转折腾挪，将迎面而来的冷箭与火光尽数避开。他借力悬崖凸起石壁纵跃如飞，如履平地般自绝壁上方凌空飘然飞渡。原本凶险万分的万丈深渊与重重追兵，眨眼之间便被他神乎其技的身法远远甩在身后。段誉背负木婉清绝尘而去，不仅彻底摆脱了神农帮的搜捕杀局，更携手冲破了困守绝壁的死地，双双安然脱险。",
  "事件概要": "神农帮众夜攀绝壁合围石台并施乱箭，段誉在危局中俯身背负伤重的木婉清，全力展动新学的凌波微步。他足踏易经卦象轻盈点石凌空飞渡，从容避开攒射冷箭与熊熊火光，背负佳人跃过万丈深渊，彻底摆脱追杀安然脱险。",
