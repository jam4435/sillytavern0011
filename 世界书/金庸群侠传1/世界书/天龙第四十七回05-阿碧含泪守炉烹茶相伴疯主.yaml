  "事件引子": "痴心侍女不离不弃，阿碧含泪分发糖果长伴疯癫公子左右。",
  "事件详情": "在土丘背风的荒草树丛下，昔日燕子坞听香水榭中抚琴曼歌的灵秀侍女阿碧，正孤单清冷地守候在旁。此刻她早已褪去昔日江南罗裙丝履，换作一身洗得发白的粗布麻衣，乌发仅束一支简陋木簪，面容消瘦而凄楚。她屈膝半跪在一座泥砌的小风炉前，手执一把破旧蒲扇轻轻扇动炭火，小心地往炉膛内添着枯枝落叶，温煮着一壶苦涩粗茶与几块杂粮面饼。听闻坡上慕容复癫狂嘶哑的封官圣旨与村童们的嬉笑起哄，阿碧心如刀绞，明眸中泪光盈盈，滚烫的泪水顺着苍白脸颊扑簌滑落，滴入炉火溅起缕缕青烟。昔日邓百川、公冶乾、包不同、风波恶等慕容家臣早已死的死、散的散，天下尽皆耻笑慕容世家的狂妄下场，唯有阿碧矢志不渝、痴心不改。她用洗得粗糙的手掌揩去泪痕，端起盛满热茶的豁口土碗，强颜欢笑地轻声唤道：“公子爷，歇歇吧，吃些茶点再坐朝……”以一世韶华与无尽柔情，甘愿在这荒郊野地默默守候着这具疯癫的躯壳。",
  "事件概要": "阿碧绿衣憔悴买糖发给村童（起因）；含泪向段誉等行礼微笑道“公子心中欢喜便好”（发展）；誓死长伴慕容复余生（结果）。",
