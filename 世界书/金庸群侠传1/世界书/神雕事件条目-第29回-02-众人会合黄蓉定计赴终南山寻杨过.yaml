  "事件详情": "公孙止败退后众人会合。黄蓉见耶律齐武功了得，少年子弟中除杨过之外罕有其匹，询问其师承门派。耶律齐因师父嘱咐不便透露，黄蓉心念一动突然哈哈大笑——已猜到他师父是老顽童周伯通。武三通讲述了赴绝情谷求取解药的经过：他与朱子柳随天竺僧出襄阳后，因担心二子相斗便离队寻子，父子三人好容易寻到绝情谷口，天竺僧和朱子柳却已被裘千尺派弟子以渔网阵擒住。他们救援不成反险些陷在谷内，只得退出想回襄阳求救，途中偏偏又遇上公孙止。黄蓉听后将杨过断臂、夺得郭襄等情简略说了。武三通大惊，想到杨过不幸断肢全是受了自己两子的牵累，突然指着武氏兄弟大骂起来。黄蓉忙劝住，说道眼前有两件大事：第一是找到杨过好好赔不是，第二是上绝情谷救朱子柳和天竺僧并替杨过求取解药。她指着汗血宝马说让马原路而回当可找到杨过。黄蓉又巧妙说服耶律兄妹和完颜萍同行，并让武三通答允暂且不找李莫愁报仇。武三通虽然对李莫愁有杀妻大恨，但被黄蓉以「君子报仇十年未晚」相劝，终于应允。黄蓉纵声招呼李莫愁，让汗血宝马领路向终南山而去。一行人朝行晚宿，六个青年男女闲谈说笑越来越融洽，武氏兄弟因各人情有别钟不再争风，手足亲情反而亲密起来。",
