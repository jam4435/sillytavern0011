  "事件详情": "回到王府内堂后，镇南王段正淳关切独子安危，便当面细致询问段誉离家出走以来的诸般曲折经历。段誉恭敬侍立于父亲面前，收敛心神，将离开大理后的江湖遭遇如实呈报：他从初至无量山剑湖宫旁观无量剑派两派比剑讲起，详述了神农帮突施发难、扣押钟灵作为人质的变故；继而讲到自己孤身前往万劫谷借马求援，如何在半途结识木婉清，并与其携手逃亡、悬崖遇险、共历生死的一系列惊心动魄之事，言辞恳切，条理清晰。然而在叙述过程中，段誉心中早有计较，出于对神秘玉像的虔诚与珍视，极有分寸地隐去了无量山石洞内遇见“神仙姐姐”玉像、以及私下参悟《北冥神功》卷轴的关键奇遇，未向父亲透露分毫。这番陈述既让段正淳全面掌握了段誉在外涉险的因果原委，又使神功与玉像之秘继续被段誉独自守藏。",
