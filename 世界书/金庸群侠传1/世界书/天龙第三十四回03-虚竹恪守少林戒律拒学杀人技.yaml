  "事件引子": "玄冰窖内寒气森森，冰壁映出两道僵持的身影，童姥厉声喝令传授杀招，四周空气凝结成霜。",
  "事件详情": "玄冰窖内寒风刺骨，虚竹面对童姥逼迫其修习生死符打穴杀人之术，内心陷入剧烈煎熬与抵触，一心只想恪守佛门清规。当童姥厉声喝令其以九阳真气催动冰魄射向冰壁人形要穴时，虚竹断然收回内劲，双手合十连连后退。虚竹神色坚决地抗辩道：“小僧自幼在少林剃度，佛门以慈悲救世为本，生死符令人求生不得、求死不能，乃荼毒苍生的恶毒手段，小僧纵然万劫不复，也绝不学这等害人之技！”童姥闻言雷霆震怒，拂袖间反手一记清脆耳光狠狠抽在虚竹脸上，厉声嘲讽其愚昧顽固、不知死活，直斥少林戒律不过是欺世盗名的枷锁。虚竹被打得身形踉跄、嘴角溢出鲜血，却依旧咬紧牙关扑通跪倒在冰面上，闭目默诵《金刚经》，宁可承受体肤之痛也坚拒演练折梅手攻杀实招与生死符阴劲。一番激烈的言语与意志博弈之下，虚竹面颊红肿却执拗未改，二人传功彻底陷入僵局，童姥眼见硬逼无效，冷笑间暗暗生出以破戒之计瓦解其佛心坚垒的阴狠算计。",
  "事件概要": "童姥逼迫虚竹修习生死符打穴杀人之术，命其催动真气射击冰壁要穴。虚竹恪守佛门清规宁死不从，直言生死符伤天害理。童姥雷霆震怒怒掴其耳光，虚竹虽嘴角溢血仍跪地默诵经文坚拒修习。童姥见硬逼无果，暗生迫其破戒以瓦解佛心之计。",
