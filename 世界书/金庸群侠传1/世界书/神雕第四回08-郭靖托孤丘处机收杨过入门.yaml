  "事件详情": "丘郭二人转身东回，路上郭靖又求丘处机收杨过入门。丘处机叹道：'你杨铁心叔父是豪杰之士岂能无后？杨康落得如此下场我也有不是之处。你放心我必尽心竭力教养这小孩儿成人。'郭靖大喜就在山路上跪下拜谢。二人回到重阳宫前天色已明，众道正在收拾后院烬余清理瓦石。丘处机召集众道士为郭靖引见，指着主持北斗大阵的长须道人说这是王师弟的大弟子赵志敬，第三代弟子中武功以他练得最纯，就由他点拨过儿的功夫。郭靖与此人交过手知他武功确是不错心中甚喜，当命杨过向赵志敬行了拜师之礼，自己又向赵志敬郑重道谢。郭靖在终南山盘桓数日，对杨过谆谆告诫叮嘱要好好用功听师父的话，这才与众人别过回桃花岛而去。杨过看着郭靖离去的背影，心中又一种被遗弃的凄凉——认定郭靖夫妇不愿收他为徒便胡乱交给旁人传艺。",
