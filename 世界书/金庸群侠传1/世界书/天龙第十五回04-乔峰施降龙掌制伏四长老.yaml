  "事件引子": "杏林中杀气弥漫，四大长老结成打狗大阵兵刃森寒，步步进逼将乔峰困在阵眼核心。",
  "事件详情": "身陷打狗阵重围的乔峰毫无惧意，胸中豪气干云，为平息内乱且保全同门性命，毅然运起盖世绝学“降龙十八掌”正面破阵。乔峰周身真气奔涌，掌风呼啸如雷鸣霹雳，雄浑无匹的劲力震荡全场。只见他沉身拧腰，右手推出一式“亢龙有悔”，劲力刚柔并济，如怒涛般顺着枪身反震而去，宋长老双臂剧震长枪荡开；乔峰借势回身，左掌顺势击出一招“见龙在田”，浑厚掌力呼啸席卷，奚长老只觉泰山压顶，连人带杖被逼得踉跄倒退；紧接着乔峰长啸一声，双掌悍然齐出，掌势激荡带起动地龙吟之声，雄浑掌力正面轰向陈孤雁与吴长风。二人只觉内力如排山倒海般压来，虎口剧痛间兵刃脱手跌落，胸中气血剧烈翻涌难以自持。乔峰神功通玄、收发自如，在电光石火间举手投足便破去打狗大阵，将四大长老尽数制伏在地，却慈悲为怀未伤及任何一人的性命，以绝对武力彻底终结了这场武力围攻。",
