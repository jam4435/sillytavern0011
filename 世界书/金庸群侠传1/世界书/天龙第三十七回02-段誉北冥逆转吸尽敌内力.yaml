  "事件详情": "段誉右腕脉门遭走火入魔的鸠摩智如钢箍般死死扣住，外来暴虐内劲骤然侵入体内的极度危局下，段誉体内潜伏的《北冥神功》受此生死剧震刺激，护体气机自发产生强烈感应，瞬间犹如巨鲸吞海、天池倒泻般狂暴逆向运转起来。鸠摩智苦修数十载、融汇少林七十二绝技与小无相功的震古烁今浑厚真气，在北冥神功霸道绝伦的吞噬牵引下，化作狂涛怒浪，顺着交接的手太阴肺经不可遏止地倾泻涌入段誉周身百骸。体内积蓄一生的磅礴内力急速流失，撕心裂肺的空虚与脏腑抽搐令鸠摩智神智骤然清醒，眼中布满极度的恐惧与绝望。他凄厉惨嚎，双足在井底冰冷污泥中拼命扑腾蹬踹，左掌疯狂拍打泥泞试图借力震脱手腕自保。然而北冥吸力犹如强力胶漆牢不可破，将二人身躯如焊接般死死锁扣。段誉亦无法主动敛气收功，只能任由经脉承受气海翻涌膨胀的剧痛。真气狂澜持续倾注，直至鸠摩智一身雄浑霸道之内力被彻底抽吸得干干净净、涓滴不剩，狂暴倒灌方休，段誉由此尽纳明王毕生真元。",
