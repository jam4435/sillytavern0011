  "事件详情": "公孙谷主见周伯通双手分斗杨过与潇湘子，宛然一人化身为二，自己虽习阴阳双刃功夫却不及他。又见潇湘子双爪如铁出招狠辣，杨过风仪闲雅姿形端丽，感叹天下能人辈出，朗声请三位住手。杨过与潇湘子同时向后跃开，周伯通拉下人皮面具连剪刀向杨过掷去，叫道'玩得够了，我去也'双足一登疾往梁上窜去。公孙绿萼叫道这便是那老头儿。樊一翁见周伯通横骑梁上哈哈大笑，怒极之下纵身抱柱猿猴般爬上梁去。周伯通大喜伸手相接，樊一翁戳其大陵穴却被闭穴化解，反被在手上拍了一记。樊一翁以长须甩击，周伯通左足撑开身子荡开攀住横梁如打秋千般摇晃。潇湘子激尼摩星和马光佐齐上，二人纵身跃上横梁去抓周伯通双脚，被左一脚右一脚踢开。潇湘子双膝不弯全身僵直前伸双爪扑向周伯通小腹，周伯通身子忽缩如狸奴换手攀梁。尹克西取出一条镶满珠玉宝石的金丝软鞭向周伯通小腿缠去。杨过戴上人皮面具学着潇湘子怪啸一声，拾起钢杖借力跃至与周伯通齐头，大叫'老顽童看剪'大剪刀往他白胡子上剪去。周伯通大喜侧头避过，笑道'小兄弟你这法儿有趣得紧'。金轮法王见厅上乱成一团，取出银轮铜轮向周伯通袭去，双轮在空中当当急响声势惊人。",
