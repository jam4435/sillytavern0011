【江湖认知】江湖中人可能听说“东邪”与桃花岛，但普通人不应自动知道岛内机关、秘传口诀或成员私事。典型关联人物包括黄药师、黄蓉、梅超风、陈玄风等，具体生死与关系状态服从当前时间线。
【动态事实规则】岛主、门人去留、岛内开放程度、人物关系与江湖立场，以当前变量、世界事件、游戏时间和实际剧情为准。
