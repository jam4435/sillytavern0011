  "事件引子": "番僧问路参合庄，绿衣侍婢阿碧热情应允引航前行。",
  "事件详情": "在荷花荡中与绿衣少女相遇后，鸠摩智立即睁开双眼，合十宣了一声佛号，沉声向船头的绿衣少女探问姑苏慕容氏参合庄的具体水路方位。那绿衣少女眨了眨灵动的大眼睛，笑盈盈地告知鸠摩智，参合庄地处太湖深水深处，水道错综复杂，外人若擅自闯入定会迷失方向；紧接着她主动表明身份，透露自己乃是慕容公子的贴身婢女阿碧，此刻正巧要乘船返回庄中。阿碧热情提议，若大师不嫌弃，大可跟随她的小船一同前往参合庄。面对这名自报家门且看似毫无防备的慕容氏婢女，鸠摩智并未察觉异样，当下点头称善，欣然接受了她的带路提议。这番简短的言语试探与交涉，消除了鸠摩智对水路不熟的障碍，阿碧随即轻点竹篙在前引路，乌篷船紧随其后，二人由茫然寻路转为正式在慕容氏婢女引导下深入太湖腹地。",
  "事件概要": "起因：相遇后鸠摩智合十宣佛号向绿衣少女探问姑苏慕容氏参合庄的水路方位。发展：少女表明自己乃慕容公子贴身婢女阿碧，称参合庄水路复杂外人易迷失，主动提议引路。结果：鸠摩智点头称善欣然应允，阿碧轻点竹篙在前引路，引领乌篷船深入太湖腹地。",
