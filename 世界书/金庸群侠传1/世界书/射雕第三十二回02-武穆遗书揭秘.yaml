  "事件详情": "穆念慈走后，郭靖和黄蓉乘上铁掌帮伪装的渡船。在船上，黄蓉翻阅穆念慈赠送的册子，发现这竟是铁掌帮第十三代帮主上官剑南的手记。手记揭示了一段尘封的往事：上官剑南本是忠义之士，为继承岳飞遗志，率众夜入皇宫盗出《武穆遗书》。为防遗书失传，他绘制了一幅藏宝图，秘密标注了“武穆遗书，在铁掌山，中指峰上，第二指节”的线索，并将图留在宫中，以便有缘人按图索骥。然而，铁掌帮后遭官兵围剿，上官剑南战死，忠义的铁掌帮也沦为奸邪之辈。郭靖黄蓉至此才明白，曲灵风当年从皇宫盗出的画作，正是寻找《武穆遗书》的关键线索，而他们此前在铁掌峰上找到的正是这部兵法。",
  "事件概要": "上官剑南手记说清武穆遗书来历，郭靖黄蓉确认铁掌峰所得正是岳家兵书，并解开皇宫旧画线索。",
