  "事件引子": "大厅中杀气森然，数十道含怒目光齐聚屋梁，气氛剑拔弩张。",
  "事件详情": "面对大厅中无量剑东宗与西宗数十道饱含杀意的愤怒目光，身在梁上的段誉自知适才失笑有违礼数，为平息众怒并化解当场尴尬，决定主动现身解释。他整肃神色，自高高的房梁上纵身跃落至大厅地面，站稳脚跟后不慌不忙地拂平淡青色长衫的褶皱，郑重整理好衣冠，随即向着主座上的左子穆、辛双清以及在场群豪深施一礼，躬身作揖致歉。段誉神态从容坦然，自报家门称在下段誉，路过贵宝地偶见两位仁兄比剑交锋，见其招式神妙莫测，一时心生感触才情不自禁失声发笑，言辞极为谦和诚恳，恳请各位武林英雄海涵包容这等无心之失。段誉本是一介手无缚鸡之力的文弱书生，意图以圣贤知书达礼之道化解江湖纷争，然而他这种闲雅淡泊的文人姿态与将比剑视为性命攸关的无量剑门规截然对立，非但未能消弭众人心头的怒火，反而让场中自觉受到羞辱的剑派弟子更感被轻视。",
  "事件概要": "段誉自知失笑有违礼数，纵身跃下房梁整肃衣冠，向左子穆、辛双清及在场群豪躬身作揖，自报家门诚恳致歉，欲以知书达礼之道化解尴尬。然而他闲雅淡泊的书生作派与剑拔弩张的门规冲突，反令自觉受辱的无量剑弟子愈发怒不可遏。",
