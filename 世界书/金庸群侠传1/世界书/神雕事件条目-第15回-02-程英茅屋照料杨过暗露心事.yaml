  "事件详情": "杨过一阵清醒一阵迷糊，只觉口腔中一阵清馨透入胸间伤处，说不出的舒服受用。缓缓睁开眼来，发现自己已睡在一张榻上，身上盖了薄被动弹不得。转头只见窗边一个青衫少女左手按纸右手握笔正自写字，背影苗条细腰一搦甚是娇美。再看四周，是间茅屋斗室，板床木凳俱皆简陋却一尘不染清幽绝俗，床边竹几上并列着一张瑶琴一管玉箫。他认出这少女正是在长安道上示警、后来联手相救陆无双之人。那少女柔声说算不上救他性命只是恰好路过，又提起陆无双已伤口平复。杨过问她姓名，她不肯说，只劝他安心养伤。她说话温柔体贴，三分慈和中带着三分敬重，与她相处一切全是宁静平和。次日杨过伤势好了些，那少女给他缝补破烂长衫，又捧出一匹青布依着原样裁剪新衣，对待杨过不但像长姊视弟，直是母亲一般慈爱温柔。午后她又在桌边写字，写一张出一会神随手撕去，始终似乎写得不合意。杨过极想瞧瞧她写些什么却总是不肯。杨过灵机一动说要吃粽子，当晚那少女果然裹了甜咸两种粽子给他作点心，杨过一面吃一面喝采。那少女叹道：'你真聪明，终于猜出了我的身世。'原来江南粽子天下驰名，杨过偏要吃粽子，她便知杨过猜到了。杨过快吃完时暗藏一块粽子，待她收拾碗筷出去，用布线粘回她撕破的碎纸，一看之下不由得一怔——纸上写的全是'既见君子，云胡不喜'八个字。那是《诗经》之句，意为'既然见到了这男子，怎么我还会不快活'。杨过心中怦怦乱跳，接连粘回十多张碎纸片，颠来倒去就只这八个字，细想其中深意不由得痴了。当夜那少女在窗外吹起玉箫，翻来覆去吹奏《淇奥》头五句：'瞻彼淇奥，绿竹猗猗，有匪君子，如切如磋，如琢如磨'，或高或低忽徐忽疾，颇具缠绵之意。杨过听了良久不禁低声吟和，箫声忽绝，杨过暗悔唐突。次日清晨杨过戴上她所赠的人皮面具，那少女见了淡淡一笑，这天一直没再跟他说话。到得晚间杨过求她再吹一曲，她微一沉吟取箫幽幽吹了一曲'迎仙客'——曲调雍容揖让，竟在箫声中也带了面具不肯透露心曲。",
