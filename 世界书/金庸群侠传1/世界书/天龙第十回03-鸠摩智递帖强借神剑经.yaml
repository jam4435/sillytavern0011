  "事件引子": "番邦国师递拜帖强借神剑经，牟尼堂中肃杀气顿起。",
  "事件详情": "正当天龙寺众僧商榷救治段誉的关键时刻，寺外突然传来通报，吐蕃国师大轮明王鸠摩智遣人送来拜帖。拜帖言辞虽极具佛门客套与文辞修养，但内中意图却令在场高僧尽皆变色。鸠摩智在帖中指明欲向天龙寺强借镇寺之宝《六脉神剑经》，声称当年曾与姑苏慕容博先生有旧约，此番借阅是为了亲赴慕容博墓前将经书焚化祭奠，以全昔日交谊。然而牟尼堂内众人皆是当世高僧与明眼之人，深知六脉神剑乃大理段氏立足武林的无上瑰宝，鸠摩智假借祭奠故友之名，实则是包藏祸心、企图强夺番邦未有的绝世武学。面对这位威震吐蕃、武功深不可测的大轮明王突如其来的威逼挑衅，天龙寺上下顿感危机四伏。枯荣禅师与保定帝等人心知绝不可让镇寺至宝流落敌邦，但强敌压境已不可避免，牟尼堂中顿时被外敌来袭的肃杀之气所笼罩。",
  "事件概要": "起因：寺外通报吐蕃国师鸠摩智送来拜帖，帖中意图令牟尼堂高僧尽皆变色。发展：鸠摩智假借祭奠慕容博之名欲强借《六脉神剑经》，实则包藏祸心强夺绝世武学。结果：天龙寺上下顿感强敌压境危机四伏，牟尼堂中被外敌来袭的肃杀之气所笼罩。",
