  "事件引子": "雁门关下朔风呼啸，辽军退意虽生，诛心质问却余音不绝，天地间杀气未散，唯余苍凉死寂。",
  "事件详情": "在耶律洪基字字诛心的质问与家国两难容的煎熬之下，萧峰万念俱灰。他深知自己既违背了对契丹母国的君臣之义，又难融于大宋武林，唯有以死明志、舍生取义，方能全忠全信并洗刷叛国污名。萧峰面容浮现出一抹苍凉而决绝的惨笑，双手自怀中缓缓掏出方才作为停战盟誓的那两截断箭。段誉、虚竹与阿紫察觉异样，骇然失色惊呼“大哥不可”，双双展动身形飞扑阻拦。然而萧峰去意已决，周身护体罡气轰然一震，将扑上前的段誉、虚竹稍稍阻隔半步。电光石火之间，萧峰双手紧握锋利无比的狼牙断箭残刃，运起毕生降龙神力，毫不犹豫地将两截断箭狠狠刺入自己的胸膛心脉！噗嗤一声闷响，断箭锋刃直没入胸，滚烫殷红的英雄热血如泉狂涌，瞬间染透了脚下的雁门关焦土。萧峰双目神光渐渐涣散，嘴角噙着解脱的释然，心脉经络尽断，雄伟的身躯在呼啸朔风中轰然倒地，一代顶天立地的绝世悲剧英雄就此壮烈陨落。",
  "事件概要": "耶律洪基字字诛心令萧峰深陷忠义两难之境，万念俱灰下决心以死全忠明志。萧峰以内力震退疾扑阻拦的段誉、虚竹与阿紫，毅然将停战盟誓的两截狼牙断箭狠狠插中心脉，血洒雁门长空，一代绝世英雄就此悲壮陨落。",
