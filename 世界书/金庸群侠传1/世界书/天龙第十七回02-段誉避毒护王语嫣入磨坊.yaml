  "事件引子": "段誉避毒负王语嫣施微步突围，藏入农家磨坊避难。",
  "事件详情": "悲酥清风毒雾笼罩整座杏子林，群雄尽皆瘫软就擒，唯独段誉因早年在无量山吞食万毒之王“莽牯朱蛤”而炼就百毒不侵之体，烈性毒烟对他毫无作用。眼见身旁王语嫣泪流满面、娇躯脱力滑倒在泥泞草丛中，段誉护花心切，决意不顾自身安危也要救其脱离魔爪。趁着云中鹤与岳老三正指挥西夏武士四下围捕捆绑丐帮弟子的混乱空隙，段誉急中生智，俯身轻唤一声“王姑娘得罪了”，毅然将虚弱无力的王语嫣背负在背。王语嫣气若游丝地低语“段公子快放我下来”，段誉温言坚决道“小生纵死也必护姑娘周全”。他暗提真气将凌波微步施展到极致，足踏洛神步法，身形在林木阴影中如飞絮飘掠，险之又险地避开四处梭巡的西夏武士。段誉深知敌众我寡，绝不能顺着官道奔逃，遂毅然折向荒僻草丛与泥泞荒野，借着江南密林掩去行踪。两人仓皇奔逃数里，终于寻得一座荒废的农家磨坊；段誉将浑身脱力、衣衫微湿的王语嫣抱入磨坊内的干草堆上妥善安置，闩紧厚重残破的木门在内警惕戒备，暂时在这座僻静磨坊中获得了宝贵的喘息时机。",
  "事件概要": "起因：杏林群雄中毒就擒唯段誉因食莽牯朱蛤百毒不侵，见王语嫣脱力倒地决意舍命相救。发展：段誉趁混乱背负王语嫣施凌波微步避开西夏追兵，折向荒野密林奔逃数里。结果：两人寻得荒废农家磨坊，段誉将王语嫣抱入干草堆安置并闩门戒备获得喘息时机。",
