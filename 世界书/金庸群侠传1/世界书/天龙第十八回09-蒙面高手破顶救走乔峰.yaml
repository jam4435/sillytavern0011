  "事件引子": "聚贤庄大厅内外杀声震天，群豪刀剑泛着森然寒光合围逼近，重伤力竭的乔峰命悬一线。",
  "事件详情": "便在聚贤庄数百群豪一拥而上、挥舞兵刃欲将力竭重伤的乔峰当场乱刃分尸的千钧一发之际，大厅上方忽然传来一声震耳欲聋的巨响，厚重的屋顶轰然破裂、瓦木四溅，一名身披黑袍、面蒙黑巾的神秘绝顶高手如天降神兵般破顶而入。这名蒙面人展现出高深莫测的骇人神功，甫一落地便霍然挥动长袖，雄浑沛然的气劲如狂涛般激荡而出，瞬间将冲在最前方的数名门派掌门硬生生震得气血翻涌、踉跄倒退。趁着全场被强行逼退的刹那间隙，神秘蒙面人探出一只手臂，稳稳提携起已无力动弹的乔峰，随即施展出神入化的“凌空虚渡”绝顶轻功，身形拔地而起，化作一道黑色惊鸿直冲夜空。大厅内数百名中原豪杰惊骇欲绝地目睹这一幕，皆被其神威所慑，竟无一人能够上前阻拦。蒙面人就这样携着乔峰飞身跃出聚贤庄的高墙大院，瞬息之间便彻底消失在茫茫无际的漆黑夜色之中，惨绝人寰的聚贤庄大战随之戛然而止。",
  "事件概要": "群豪欲乱刃分尸的危急关头，一名黑袍蒙面绝顶高手破顶而入，振袖激荡雄浑沛然气劲震退数名门派掌门。蒙面人趁势提携重伤力竭的乔峰施展凌空虚渡绝技拔地而起，跃出高墙大院遁入茫茫夜色，聚贤庄惨烈血战戛然而止。",
