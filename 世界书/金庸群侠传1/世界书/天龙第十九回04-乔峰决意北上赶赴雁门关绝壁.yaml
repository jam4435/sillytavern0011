  "事件引子": "古道关山苍茫险峻，雁门关下朔风呼啸、阴翳蔽日，荒草乱石间隐现当年惨烈厮杀遗迹。",
  "事件详情": "得知阿朱脱险无虞之后，乔峰心头最沉重的谜团便是自己扑朔迷离的契丹身世与父母之死。杏子林惊变与聚贤庄血战使他身败名裂、沦为天下公敌，乔峰为了探明自己当年在雁门关外襁褓中被夺、生身父母惨遭伏击残杀的血腥真相，毅然决意北上雁门关。他要亲临当年的绝壁险地，实地查验生父临死前在石壁上刻下的契丹文血书。乔峰不避关山阻隔与风霜劳顿，一路兼程疾行、风餐露宿，避开各路关卡与耳目，以极快身法日夜北进。沿途关隘苍茫，他胸中激荡着无尽的悲愤与探寻真相的执念。历经数日长途奔波，乔峰终于赶赴北陲雁门关绝壁之下。抬眼望去，但见关山高耸崔嵬、险峻异常，四周古木森森、阴翳蔽日，荒草与断石之间依稀可辨当年那场惨绝人寰的惊天血战遗迹。乔峰身临父母饮恨泣血之地，心潮汹涌澎湃，正式驻足于绝壁之下展开现场寻觅与勘验。",
  "事件概要": "探知阿朱脱险后，乔峰为探明身世谜团与生父血仇，毅然决意北上雁门关。他避开各路关卡眼目，兼程疾行长途奔波，终抵北陲雁门关外绝壁险地；面对古木荒草间依稀尚存的当年血战遗迹，乔峰心潮悲愤汹涌，正式驻足壁下寻勘血书线索。",
