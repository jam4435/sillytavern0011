  "事件引子": "林间毒雾升腾、丝竹喧天，星宿派群徒合围截杀，丁春秋摇扇现身杀机毕露。",
  "事件详情": "未过多久，阿紫因携带星宿派镇派至宝“神木王鼎”而遭到同门师兄弟的大肆围追堵截。在激烈的争夺厮杀中，星宿派掌门丁春秋亲自出手，施展独门剧毒手段暗算阿紫，用歹毒至极的腐骨毒药生生将阿紫的双眼彻底毒瞎！昔日骄横跋扈的阿紫瞬间沦为双目失明、武功尽失的落魄废人，陷入无尽的恐慌与绝望之中。身怀盖世神功的游坦之目睹心爱之人遭此惨祸，不仅没有丝毫嫌弃与报复之意，反而痴心更甚、痛彻心扉。游坦之不顾自身安危挺身相救，将双目失明、哭闹不休的阿紫稳稳背负在自己宽阔的脊背上，毅然决然地带着她踏上逃亡江湖的风霜长路。在漫漫逃亡途中，游坦之甘愿为阿紫做牛做马、任其肆意打骂驱使，甚至在心底暗暗发下重誓，只要能治愈阿紫的双眼，哪怕将自己的亲生眼珠挖出献给阿紫也绝不迟疑。",
