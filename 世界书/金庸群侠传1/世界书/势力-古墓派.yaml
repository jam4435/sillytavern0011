名称：古墓派
类型：宗门
核心地域：大宋/终南山/活死人墓
【稳定定位】古墓幽居一脉，武学重清静内功、轻灵身法、精微剑掌与双人配合，传承封闭，规模远小于常见名门大派。
【组织与接触】古墓并非公开收徒或广纳香火之地，外人接近、入墓、拜师或接触核心传承都需要明确剧情因缘；不能因身处终南山就自动获得古墓内部信息。
【江湖认知】多数江湖人只知道其隐秘、清冷和与终南山武林渊源，普通百姓更可能只听过传闻。典型关联人物包括林朝英、小龙女、李莫愁等；具体人物状态服从当前时间线。
【动态事实规则】掌门、门人去留、古墓开放程度、与全真教的现实关系及人物生死，以当前变量、世界事件、游戏时间和实际剧情为准。
