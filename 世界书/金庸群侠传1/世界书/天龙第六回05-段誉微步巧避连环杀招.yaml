  "事件引子": "废农舍外狂风骤起，森冷扇影撕裂虚空，呼啸劲力将青衫少年周身要害尽数封死。",
  "事件详情": "一击落空令风波恶好胜之心大起，他誓要撕破段誉的防御，而段誉虽无还手克敌之力，却只能将全身生机寄托于精妙莫测的凌波微步之上。风波恶身形步法陡然剧变，折扇开合翻飞如电，扇骨锋芒吞吐不定，接连施展出一连串狂风骤雨般的连环点刺杀招，每一式皆狠辣刁钻地笼罩向段誉周身大穴要害。段誉置身于漫天呼啸凌厉的狂暴扇影之中，在生死重压之下对凌波微步的步法易理领悟越发透彻，脚下踏着六十四卦方位愈走愈熟、行云流水。但见青衫身影若隐若现、飘逸出尘宛如谪仙临世，任凭风波恶扇招如何迅疾如雷、变幻无常，段誉始终游刃有余地在狭小缝隙间穿梭游走。风波恶全力狂攻数十招之多，不仅未能伤及段誉分毫，甚至连他的青衫衣角都不曾沾到半点。木婉清倚在农舍门内凝神观望，见段誉身法如此超凡脱俗，看得目眩神迷、芳心赞叹不已；战局陷入风波恶久攻不克、段誉自保无虞的奇特僵持状态。",
