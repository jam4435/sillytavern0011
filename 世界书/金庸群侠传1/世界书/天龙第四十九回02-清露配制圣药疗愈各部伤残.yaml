  "事件引子": "灵鹫宫大殿内外药香弥漫，伤残群豪面带戚容忐忑聚集，九天九部侍女捧药穿梭其间。",
  "事件详情": "此前少室山大战与西夏风波平息后，隶属于灵鹫宫旗下的三十六洞洞主、七十二岛岛主等诸多门人部众大多身负重创，受暗伤与经络残损之苦。银川公主李清露聪慧贤淑，深知若要安定人心，必先解救群豪疾苦，遂主动协助虚竹统领九天九部诸女，共同操持药石事务。李清露从西夏皇室带来秘传灵药，并命人开启灵鹫宫药库取来珍稀的天山灵芝圣药，亲自核验药性并督导侍女们精心研磨熬炼。面对大批伤痕累累、心中忐忑不安的洞岛伤员，李清露指派九天九部侍女有序发放药汤与膏散，并针对伤势沉重者指导以内力催化药力。药物敷上伤口、服入腹中，清香四溢，迅速拔除伤处残存的淤毒与寒热杂气。原本伤势反复、痛楚难当的各派门人惊喜地察觉内息重新畅通，断损的筋骨血脉亦在灵药滋养下迅速复原。李清露倾囊施药的仁善之举消弭了众人的疑惧，此前大战所遗留的重创被彻底拔除治愈，三十六洞与七十二岛群豪全员恢复康健。",
  "事件概要": "见洞岛部众受创残损且心存疑惧，李清露以西夏灵药合天山雪芝配制圣药，督导九天侍女施汤敷膏，并指点以真气拔除淤毒。众门人断损筋骨重续、暗伤尽除，不仅尽复康健，更感佩灵鹫宽仁而疑窦冰释。",
