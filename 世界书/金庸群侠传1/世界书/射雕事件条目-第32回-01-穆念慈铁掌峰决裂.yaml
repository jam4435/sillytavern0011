  "事件详情": "郭靖黄蓉在沅江边偶遇已换上道装的穆念慈。穆念慈神情凄苦，向二人讲述了她在铁掌峰的遭遇。原来她跟随杨康至君山，杨康谎称丐帮内乱，带她前往铁掌峰。在山上，杨康先是拒绝了裘千丈用迷药的卑劣建议，赢回了穆念慈的信任，两人在未拜天地的情况下发生了关系。然而，当晚穆念慈便偷听到杨康与裘千仞密谋勾结金国、卖国求荣的奸计。杨康更兴奋地向她描绘自己成为太子、她成为皇后的未来。穆念慈彻底心碎，愤而打了杨康一记耳光后逃离铁掌峰，心如死灰，大病一场后被一道观收留，从此换上道装，决意返回牛家村。讲述完一切后，她将从裘千丈身上搜得的一本册子交给郭靖，便独自离去。",
