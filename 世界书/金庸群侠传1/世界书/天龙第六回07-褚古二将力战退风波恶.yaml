  "事件详情": "褚万里与古笃诚救主心切，落地后毫不迟疑立刻向包围农舍的强敌悍然发难；风波恶与探子则面临大理顶级高手的凌厉反扑。褚万里手中熟铜长棍猛然横扫而出，棍势势大力沉、劲风呼啸刚猛雄浑，直取风波恶将他从段誉身前强行截下，二人兵刃相交、当当作响斗在一处；与此同时，古笃诚挥舞双斧舞动如狂暴旋风，斧刃寒光闪烁、势不可当，以雷霆万钧之势硬生生将外围聚拢围困农舍的洞岛探子尽数逼退击散。风波恶原本就未能攻破段誉的凌波微步，此刻对上武艺高强的大理王府护卫更是难以占得上风，自知久战之下绝无胜算。风波恶当下审时度势，冷哼一声道：“大理段氏名不虚传，今日暂且别过，后会有期！”说罢虚晃一招逼开褚万里，果断率领麾下众探子飞身跃上马背，勒转马头仓皇向远处疾驰撤退，农舍的围困与杀机就此彻底化解。",
