  "事件引子": "乱石嶙峋的陡坡尽头浓雾翻涌，身后羽箭如飞蝗破空，黑马嘶鸣着被逼至绝壁边缘。",
  "事件详情": "木婉清救出段誉骑马突围后，司空玄率领神农帮众在后紧追不舍，弓弩齐张射出如飞蝗般的密集羽箭。黑玫瑰虽脚力神骏，但在乱石嶙峋的山崖陡坡上奔行严重受限，终被追兵一路逼赶至万丈绝壁“断魂崖”边。前路是云雾封锁的万丈深渊，身后是杀气腾腾、步步逼近的追兵。司空玄率众完成合围，面带得色冷笑讥讽二人无路可逃。面对绝境，木婉清神色凝重，低声询问段誉是否惧怕葬身于此。毫无武功的段誉坦然从容，微笑答称“死生有命，富贵在天”，更坦言能与木姑娘这般绝色佳人同生共死虽死无憾。木婉清娇躯微震，眼波流转中泛起深深动容，凄然笑骂段誉死到临头仍油嘴滑舌，却当面吐露对其赤诚性情的倾慕之意。眼见追兵逼至眼前，木婉清眼中决绝之色一闪而过，毅然紧紧握住段誉的手，二人在此生死关头缔结互许生死的同心誓约，决意跳崖拒降。",
  "事件概要": "司空玄率帮众将段木二人合围逼入万丈绝壁断魂崖。前路是幽深云海，身后是强弓劲弩，面对穷途末路，段誉坦然置生死于度外并甘愿相伴，木婉清深受触动当面倾心，二人紧握双手立下同生共死之誓，毅然决意跳崖拒降。",
