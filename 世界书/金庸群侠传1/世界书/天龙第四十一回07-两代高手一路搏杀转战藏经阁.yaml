  "事件引子": "飞檐走壁杀入佛阁，四位绝顶高手一路恶战冲入少林藏经阁。",
  "事件详情": "少林广场上尘土漫天，慕容博眼见慕容复在萧远山的狂攻下左支右绌、险象环生，深知萧峰掌力威猛天下第一，若在空旷平地硬拼久战必落下风。他心思电转，蓦地虚晃一指逼退萧峰，随即提气纵身，展开绝顶轻功如灰鹤般拔地而起，直向少林寺后山禁地飞遁，慕容复亦紧随其后施展身法逃遁。萧峰父子复仇心切，岂肯容仇敌脱逃？萧远山厉吼“休走”，与萧峰并肩踏碎青石腾空直追。四道绝顶身影穿房过脊，一路激战不休，劈空掌风与无形指力沿途将达摩院的红墙、罗汉堂的琉璃屋瓦与数株百年苍松尽数震得粉碎。眨眼之间，慕容博破窗撞入少林武学圣地藏经阁，萧氏父子破门而入紧咬不放。狭窄幽暗的经阁之内，四人再度短兵相接，狂暴激荡的内力将层层沉香木书架掀翻，无数佛门古籍与秘籍手抄残卷在暴烈气浪中如雪片般漫天碎裂飞舞。退路尽绝，幽闭绝地中的四位当世宗师杀红了双眼，生死存亡的惨烈决战在此一触即发。",
