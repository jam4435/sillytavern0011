  "事件详情": "杨过游目四顾但见浓荫匝地花光浮动心中喜悦无限，只道姑姑这里好看么，小龙女点头微笑。二人想起过去数天的情景真恍同隔世。四下寂无人声原来这山洞在终南山脚一处极为荒僻的所在，当晚二人就在树荫下草地上睡了。次晨醒来小龙女说要先养好伤再练好玉女心经。不到半月小龙女内伤已然痊愈。两人在一株大松树下搭了两间小茅屋以蔽风雨，茅屋上扯满紫藤。杨过在自己屋前种了些玫瑰茉莉之类香花，小龙女却爱淡雅屋前便一任自然唯有野草。师徒俩日间睡眠晚上用功。数月过去先是小龙女练成，再过月余杨过也功行圆满了。二人反复试演全无窒碍，杨过又提出世之议。小龙女但觉如此安稳过活世上更无别事能及得上，但想他留恋红尘终是难以长羁他在荒山之中，便提起郭靖黄蓉武功令杨过筹思对策。杨过想起郭靖相待自己一片真情心下感激甘愿为他退让一步。小龙女又提议若不练成王重阳遗下的功夫遇上了武功高强之人终究抵敌不过。杨过知她雅不欲离开这清静所在不忍拂逆其意，便答应起练九阴真经。就因这一席话两人在山谷中又多住了一年有余。杨龙二人重经秘道潜入墓中将重阳遗刻诵读数日记忆无误这才出来修习。年余之间师徒俩内功外功俱皆精进。但墓中重阳遗刻只是对付玉女心经的法门仅为九阴真经的一小部分，是以二人所学比之郭靖黄蓉毕竟尚远为不如，但此却非二人所知了。这一日练武已毕两人均觉大有进境，杨过跳上跳下十分开心小龙女却愀然不乐——她知重阳遗刻上的功夫已然学会，料想杨过不愿下山却无借口相留是以烦恼。",
