  "事件引子": "藏经阁内弥漫着浓重的死寂与血腥，两位老者颓然仆地绝气，四壁书架在劲气余波中微颤。",
  "事件详情": "目睹至亲双双气绝倒地，萧峰与慕容复悲痛欲绝，心中的宿怨敌意瞬间被巨大的丧父之痛吞没，两人发狂般扑向各自父亲冰冷的尸身痛哭。就在二人扑至尸身旁的刹那，原本受创吐血的扫地老僧却身形微动，双手如电探出，一手提起萧远山尸身，另一手提起慕容博尸身。老僧双臂各负一人，神态从容安详，当即施展出超凡脱俗的“缩地成寸”绝顶神通。老僧身法快如鬼魅，宛若一缕青烟般轻飘飘掠出藏经阁窗棂，其绝世轻功让天下无双的萧峰与慕容复根本无从阻拦与追及。瞬息之间，老僧已负二人身躯掠过少林寺的重重殿宇屋脊，足不点地般飘然落在了少林寺后山一片清幽宁静的开阔草地之上。老僧将两具尸身平稳安置于芳草之上，彻底摆脱了阁内的纠缠纷扰，为后续施展佛门神功创造了清幽绝佳的环境。",
  "事件概要": "目睹至亲断气，萧峰与慕容复悲痛欲绝扑尸痛哭。受创的老僧忽现缩地成寸神通，双臂各提一具尸身破窗遁走，瞬息掠过重重殿宇飞落后山草地安置，摆脱阁内纠缠。",
