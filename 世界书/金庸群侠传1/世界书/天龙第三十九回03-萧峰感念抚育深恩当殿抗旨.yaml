  "事件引子": "析津府金殿内沉香缭绕，辽帝南征圣旨方落，君臣百官肃穆屏息，杀伐之气笼罩龙墀。",
  "事件详情": "在大辽南京皇宫大殿之上，面对耶律洪基威逼南征的圣旨，南院大王萧峰心中波澜万丈。萧峰虽身为契丹子孙，但自幼生长于中原土地，深受大宋汉人父母抚养之情、恩师教导之德与各方师友知遇之恩，对故土怀有至深至诚的故土深情；他更深知两国一旦开战，中原与辽国必将生灵涂炭、白骨蔽野、万姓流离。一身傲骨的萧峰断然选择坚守心中的道义良知，宁死不肯同流合污。他毫无畏惧地昂首挺胸，当殿抗旨不尊，斩钉截铁地向耶律洪基严正表态，声称自己虽为契丹子孙，亦受大宋二十载抚育之恩，自己宁受千刀万剐之刑，也万万不会领兵攻打大宋残杀无辜苍生。萧峰字字铿锵、掷地有声的当殿拒绝让整座大殿陷入死寂，耶律洪基龙颜震怒却因萧峰武功盖世未敢当场发作。萧峰断然抗旨拒帅的抉择，彻底断绝了耶律洪基命其领兵的企图，也令君臣兄弟之情彻底破裂。",
  "事件概要": "面对辽帝耶律洪基逼命领兵南征伐宋之旨，萧峰感念中原父母师友二十载抚育厚恩，不忍涂炭无辜生灵，毅然昂首当殿抗旨拒受帅印，誓死不从。耶律洪基震怒交加却忌其神勇未敢当场发作，大辽君臣兄弟之情彻底破裂。",
