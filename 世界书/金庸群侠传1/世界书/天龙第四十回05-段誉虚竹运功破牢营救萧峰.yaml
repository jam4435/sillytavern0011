  "事件引子": "幽暗潮湿的地牢深处水滴淅沥，刺鼻血腥伴随刺骨寒意扑面而来，沉重铁链隐隐作响。",
  "事件详情": "天下英雄联军顺着甬道杀入阴冷昏暗的南京地牢最深处，终于见到了受囚的萧峰。此时的萧峰虽历经严刑拷打、浑身上下遍体鳞伤，但身躯傲立、铁骨铮铮，依旧不失一代豪侠的英雄气概。段誉与虚竹眼见结义长兄受此酷刑折磨，心中痛惜悲愤万分，当即各展旷世绝学上前施救。段誉深吸一口真气，将体内磅礴无俦的内力尽数催动至指尖，六脉神剑剑气嗤然迸发、光华耀目，精准斩向束缚在萧峰手脚上的玄铁重锁。只听得金铁交鸣之声不绝于耳，火星飞溅中，寻常神兵利器难以伤其分毫的玄铁锁链被段誉雄厚的无形剑气生生切断！与此同时，虚竹运起深不可测的北冥神功，双掌猛然按在玄铁铸造的死牢栅栏之上，排山倒海般的真气狂涌而出，咔嚓连声巨响过处，玄铁大牢被强绝内力震得四分五裂、轰然崩塌！兄弟二人合力之下，终于将重伤的萧峰从绝牢中成功解救出来。",
  "事件概要": "群雄攻入南京地牢最深处，得见受尽酷刑却傲然挺立的萧峰。段誉催动六脉神剑以无形剑气斩断玄铁锁链，虚竹施展北冥真气震塌囚室栅栏，结义兄弟同心协力破牢，终将重伤的萧峰救出绝境。",
