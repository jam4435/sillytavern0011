  "事件详情": "众人搓树皮打长索，程英自请下深洞探查。长索放至百余丈方始着地，程英仔细查看后确认下面只有公孙止夫妇粉身碎骨的遗骸并无小龙女。陆无双忽然提醒还有一处没去瞧过——断肠崖。杨过心头一震发足奔去，到得崖前俯视深谷灰雾茫茫哪有人影。他逐一回想小龙女说过的言语，抬头望见对面山崖之下竟有一朵红花——正是昨日他亲手插在小龙女鬓边的龙女花。杨过拾起花朵发现花下有纸包，内包一束断肠草。他猛见崖壁上用剑尖刻着两行字——大的写'十六年后在此重会夫妻情深勿失信约'，小的写'小龙女嘱夫君杨郎珍重万千务求相聚'。杨过痴望着字句心慌意乱，她身中剧毒怎能活十六年？程英上石梁柔声劝慰，带杨过将对崖留字说与黄蓉听。黄蓉默默沉思后突然两眼发亮，编造出南海神尼的故事——佛门中大圣每隔十六年便来中土一行，定是将小龙女收作徒儿带到南海以大神通驱除剧毒。杨过从未听过此名将信将疑，一灯被黄蓉抢话只'嗯'了一声。黄蓉说得天花乱坠——三十二年前爹爹见过她一面、十六年前又履中土。杨过见花草在手字迹在石千真万确，又确认字迹中小龙女的'杨'字右边'日'字下总是少写一画绝非假冒，终于信了这十六年之约。他求生意念复又大旺，决定服断肠草一试。",
