事件名称: 奇遇事件-天龙-雪海搏熊挖参王
事件地点: 金国/长白山/深山密林
触发条件:
  全部:
  - 变量: user数据.初始属性.臂力
    大于等于: 14
  - 变量: user数据.初始属性.根骨
    大于等于: 14
  - 变量: user数据.境界.大境界
    等于: 二流
事件持续时间:
  时: 5
事件引子: 塞北大雪封山，长白山千丈林海老坑深处，一株系着古旧红绳的七叶野生万年老山参正静卧雪地……
事件概要: 玩家在暴雪绝地击退狂暴雪熊守护兽，以鹿骨签掘出万年老山参王，获回天续命神药。
事件详情: 关外风雪肆虐，林海雪原深达数尺。玩家攀上万丈悬崖背风处的老坑，寻得一株生有七叶、灵气四溢的野生老参。忽有一头人立而起、重逾千斤的雪原暴熊狂吼扑杀守护。玩家运起二流高手雄浑内劲拔刀力战，拳掌劈刺将其击退。随后小心翼翼以鹿骨签剔开冻土，起出一条须根完整、宛若人形的万年老山参王。
参与人物:
- 玩家
insert:
  user数据:
    包裹:
      万年老山参王:
        类型: 药品
        品阶: 绝品
        功效类型: 回复
        物品描述: 塞北极寒灵地孕育千百年的地宝参王，伤重濒死之际煎汤服下可瞬间回天续命、满血重生。
        属性修正:
          气血: 100
          内力: 75
        数量: 1
update:
  user数据:
    修为: '+2800'
delete: {}
后续事件: {}
