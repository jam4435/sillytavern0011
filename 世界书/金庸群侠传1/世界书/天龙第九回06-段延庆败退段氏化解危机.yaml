  "事件详情": "石门洞开之后，钟万仇吐血瘫倒，万劫谷中的闹剧瞬间反转。隐藏在暗中企图借乱伦丑闻彻底毁掉大理段氏声誉的四大恶人之首段延庆，眼见精心筹谋的恶毒陷阱被大理段氏彻底化解，心中大势已去。段延庆眼看大理保定帝段正明与镇南王段正淳等高手环伺在侧，全场江湖群豪亦在肆意嘲笑钟万仇之愚蠢，深知强留已毫无意义且难讨便宜，遂在暗处发出一声冰冷刺骨的冷哼，施展轻功飘然而去，未敢再与大理高手正面缠斗交锋。保定帝段正明与镇南王段正淳见局势底定，当即率领三公四护卫上前，迅速接应护送石室中的段誉、钟灵以及地道中获救的木婉清脱离险境，并妥善平息现场纷扰。受邀前来的各路武林名宿亲眼见证了事情真相与大理段氏的坦荡，一场精心设计的乱伦构陷沦为万劫谷的笑柄，群雄尽皆尽兴散去。大理段氏的皇室清誉得以完好保全，段誉与木婉清化险为夷，笼罩在万劫谷上空的灭顶之灾就此彻底烟消云散。",
