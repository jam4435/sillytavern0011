  "事件详情": "歃血盟誓方毕，万仙大会现场杀气与喧嚣达到顶点。乌老大为了彻底破除群魔心底对天山童姥积压数十年的深入骨髓的恐惧，并借血祭立威振奋大军攻打天山的士气，当众做出了极为残暴的惊人之举。他面带狰狞冷笑大步踏入场地中央，在数百名洞主岛主的注视下，粗暴地从一只肮脏沉重的麻袋中拖出一名被粗麻绳五花大绑的幼小女童。只见那女童年约八九岁，身形娇小单薄如风中残烛，衣衫褴褛、蓬头垢面，口中塞着布团无法作声，显得无助羸弱。乌老大高举手中寒光流转的精钢长刀，声色俱厉地向群豪宣布，此女童乃是他日前冒死潜入缥缈峰后山侥幸生擒的灵鹫宫贴身哑女，身份特殊。四周群魔听闻是灵鹫宫之人，顿时群情激愤，纷纷挥舞各式奇门兵刃厉声叫嚣血祭立威。乌老大冷哼一声，一把扯掉女童口中布条，反手死死按住其发髻按在冰冷石案上，右手长刀裹挟着刺耳破空风声霍然斩落，女童命悬一线。",
