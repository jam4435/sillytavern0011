  "事件引子": "院中禅杖破空厉啸不绝，重重黄袍僧影结阵严合，杀伐沉肃的气劲直逼得人窒息。",
  "事件详情": "面对养父母与授业恩师接连死于非命的惨酷绝境，天下更将弑亲灭祖的滔天罪名扣在自己头上，乔峰悲愤交加几欲发狂；但在少林罗汉大阵的重重绞杀之下，他深知唯有突围求生方能查明真凶、洗雪奇冤。乔峰仰天发出一声震天长啸，体内雄浑霸道的降龙真气狂涌而出。面对四面八方呼啸砸落的沉重禅杖，他运起“见龙在田”双掌顺势一圈一引，以排山倒海般的精纯内力硬生生将当面四名少林高僧震退数步，在铁桶般的罗汉大阵中悍然撕开一道缺口。玄难首座见状飞身以大金刚拳凌空截击，乔峰身形在半空不可思议地倒折翻滚，以精妙轻功避实就虚，脱出杀阵合围。跃出重围后，乔峰明知全寺僧众倾巢出动搜捕，但为了查明真相并洗刷污名，他毅然放弃逃下少室山，选择反其道而行之，借茫茫夜色潜入少林重地菩提院隐蔽。乔峰成功冲破少林罗汉大阵的死地合围，少林众僧合击落空；乔峰施展绝顶轻功神不知鬼不觉潜入寂静幽暗的菩提院佛殿深处，伏于高大佛像与梁柱阴影中暂避追兵锋芒。",
  "事件概要": "面对少林罗汉大阵的合围绞杀，身负弑师血冤的乔峰愤而突围，运起降龙真气撕开阵脚，凌空避过玄难的大金刚拳截击脱出杀阵。为探寻弑亲真凶并洗刷污名，乔峰反其道而行，借夜色潜入少林重地菩提院殿中隐匿，静待时机。",
