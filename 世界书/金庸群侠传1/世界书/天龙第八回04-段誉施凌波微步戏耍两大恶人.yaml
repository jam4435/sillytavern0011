  "事件引子": "密林古道间兵刃交击声大作，恶风骤起处，云中鹤化作一道青影挟着厉啸直扑向段誉。",
  "事件详情": "四护卫被恶人死死缠住后，轻功绝顶的云中鹤窥得空隙，身形如离弦飞鸟般掠地而起，挟着森森恶风直扑手无寸铁的段誉。生死关头，段誉急中生智，本能地按照易经卦象踏开脚步，施展出家传神妙莫测的“凌波微步”。只见他在林间刀光剑影中身形飘忽若仙、闪烁不定，云中鹤连连施展绝杀狠招全力飞扑，却次次抓在虚处尽皆落空，急得他暴跳如雷、厉声怪叫。一旁缠斗的南海鳄神岳老三见段誉身法如此精妙通神，顿时大感兴趣，猛地挥舞着巨大的鳄尾剪合围封堵上来。段誉面对两大凶徒的左右夹攻临危不乱，步履越发飘逸灵动，宛若游鱼穿梭于湍急水流之中，自如游走于凶险的剪影爪风之间。岳老三在一旁看得眼花缭乱、啧啧称奇，不由得兴奋地纵声大叫，盛赞这年轻书生后脑勺生有反骨、身法又这般神妙通玄，正好适合抓来做自己的顶门大弟子。段誉借凌波微步在凶险战局中毫发无损地周旋，将两大恶人戏耍得团团乱转。",
