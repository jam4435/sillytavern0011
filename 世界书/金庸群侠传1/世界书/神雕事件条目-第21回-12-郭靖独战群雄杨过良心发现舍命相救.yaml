  "事件详情": "郭靖出帐便遭八名蒙古摔角好手围攻——他以正宗蒙古摔角术加上乘武功一举将八人摔出丈余。忽必烈调遣的千军万马将郭杨二人团团围困。法王、潇湘子、尼摩星、尹克西四人抢出拦住去路——郭靖一上手便将尹克西震得喷血受伤盘膝退出。随后施展降龙十八掌独战法王、潇湘子与尼摩星三大高手——掌法从至刚中生出至柔妙用越斗越是挥洒自如。杨过见马光佐莽撞冲入必遭大祸，假装用剑逼退实则在救他性命。潇湘子使出毒砂棒喷出黑烟——郭靖内力深厚竟能强抗剧毒。激战中郭靖见杨过有险——他不救自己先护杨过以'神龙摆尾'震开潇湘子杆棒。但在此时尼摩星铁蛇刺入郭靖左胁数寸。郭靖身受重伤喷出一口鲜血——仍是顾念杨过让他快去抢马。杨过眼见郭靖拼命救护自己，胸口热血上涌再顾不得旧恶——心想郭伯伯义薄云天我若不以一命报他一命真是枉在人世了。当即从他背上跃下将君子剑舞成一团剑花护住郭靖——势如疯虎招招拚命。法王与潇湘子惊问'杨过你干什么'。杨过双目通红不答——只道'郭伯伯是我害了你，今日我和你死在一起'。最终郭靖支持不住坐倒在地。杨过俯身将郭靖负在背上向外猛冲——左臂被法王金轮划破一道长长口子仍在舍命突围。",
