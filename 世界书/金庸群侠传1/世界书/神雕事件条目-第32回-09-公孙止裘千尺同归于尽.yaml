  "事件详情": "众人听到东北角山顶上有人纵声怪笑有若枭鸣，杨过冲口而出是裘千尺。众人向山顶奔去，行到离山顶约里许处看清裘千尺独自坐在山巅太师椅中仰天狂笑状若疯狂。黄蓉疑心有诡计让大家别走近。忽见对面山石后转出一人蓝衫方巾正是公孙止。他脱下长袍运劲挥动劲透衫尾长袍挺得笔直，大声狞笑着向裘千尺奔去。裘千尺连发枣核钉，公孙止长袍连挥一一荡开。忽地里他长声大叫身子猛然不见缩入了地中——裘千尺哈哈大笑。笑声只发出两响，地底下忽然飞出一件长袍裹住裘千尺的坐椅将她连人带椅拖进地底，裘千尺笑声变为尖叫夹着公孙止惊惶恐怖的呼声从地底传上。好一阵不绝，蓦地里一片寂静无声无息。众人面面相觑不明其理，只有杨过懂得其中缘故不禁暗叹报应二字。原来裘千尺命婢女将自己抬到这山巅孔穴之上，用树枝枯草掩没穴口，故意发笑引来公孙止踏入陷阱。公孙止垂死还想挣扎挥长袍拉住裘千尺坐椅，结果两人一起摔落百余丈深穴，一对生死冤家化成一团肉泥你身中有我我身中有你再也分拆不开。杨过说出原委众人尽皆叹息。程英耶律齐兄妹等掘坑将四名被杀的婢女葬了。眼见绝情谷中火势正烈已无可安居之处，众人于一日之间见了不少人死亡，均盼尽早离去。",
