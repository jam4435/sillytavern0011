  "事件详情": "中午时分杨过三人在武关酒楼入座。片刻后门帷掀处李莫愁师徒押着陆无双进来。杨过戴人皮面具埋头扒饭暗中窥探。又过一阵耶律齐耶律燕兄妹也上楼来。李莫愁因五毒秘传落入丐帮之手愁闷难当，见街角站着两个丐帮五袋弟子便招手召唤。两丐上楼来被李莫愁以神不知鬼不觉的快捷手法在手背各抹了三道朱砂般指印——正是五毒神掌。李莫愁柔声威胁丐帮若不还书便取一千条叫化命作抵。两丐奔下楼时李莫愁倏地抢到楼梯中路砰砰两掌将二丐击回，跟着喀喇喀喇两声折断两人手臂。耶律齐兄妹再也忍不住霍然站起。杨过在桌上用力一拍走到耶律齐跟前说一起出手救人——他知迟早要与李莫愁动手，难得有耶律齐这样的好手岂可不拉他落水。杨过在洪凌波身边一掠而过摘剑鞘吻其脸颊叫'好香'，随即揭下面具叫'师伯师姊杨过参见'。李莫愁出言辱及小龙女说'乱伦犯上与师父做了禽兽般的苟且之事'，杨过胸口热血上涌挺剑鞘猛攻——用重阳遗刻中克制玉女剑法的精奇剑招着着抢先。耶律齐自报全真派门下拔剑相助。二人双战李莫愁——耶律齐使全真剑法端凝厚重劲功式力无不恰到好处，杨过则纵前跃后扰乱对方心神。耶律燕完颜萍青衣少女也上前助战却均被逼退。众人从酒楼斗到街心又自大街斗到荒郊。危急间空中几声唳鸣——两头大雕扑下啄击李莫愁。东南方一匹红马急驰而至，马上骑着一个颜若春花的红衣少女正是郭芙。武敦儒武修文兄弟随后赶到各抽长剑攻上——他二人一见杀死母亲的大仇人便红目赤面恶狠狠拼命。郭芙也拔剑上前三人剑法配合紧密此退彼进。李莫愁见敌人越战越多怕惹出郭靖夫妇，长笑声中向西北方遁去。郭芙提剑追去却愈离愈远。",
