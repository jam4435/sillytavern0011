  "事件引子": "夜幕荒谷群魔乱舞，虚竹背负哑女童避入万仙大会密林。",
  "事件详情": "毕生神功传尽之后，油尽灯枯的无崖子已然虚弱到了极点，容颜迅速干瘪衰朽，生命之火即将熄灭。趁着弥留之际的一丝清明，无崖子从自己手指上小心取下一枚雕琢着古朴花纹、象征逍遥派最高权威的“七宝指环”，庄重地戴在虚竹的手指之上，正式立下门规，立虚竹为逍遥派第三代掌门人。随后，无崖子又颤抖着从怀中取出一幅泛黄的精美女子画像郑重交予虚竹手中。无崖子气若游丝却字字沉重地向新掌门交代后事与重任：命虚竹即刻启程前往天山缥缈峰灵鹫宫接掌逍遥派大权，并在江湖中寻找画中之人（师妹李秋水）修习上乘武学，誓要将当年欺师灭祖、将自己残害残废的叛徒丁春秋彻底诛杀以清理门户。虚竹双手接过画像与指环，含泪应承重托；交代完毕后，无崖子心中夙愿已了，嘴角含着一抹欣慰的笑意，双手垂落溘然长逝。",
  "事件概要": "虚竹行经深山荒谷突遇三十六洞七十二岛万仙大会（起因）；见群邪点起巨烛密谋反叛天山（发展）；暗中隐蔽观察（结果）。",
