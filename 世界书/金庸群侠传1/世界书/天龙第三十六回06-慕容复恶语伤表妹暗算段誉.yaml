  "事件引子": "斜阳残照荒郊逆旅，风卷黄沙掠过空地，四下萧索寂静，杀机暗伏。",
  "事件详情": "在荒野客栈外的空地上，慕容复为了彻底断绝王语嫣的念想，当众对王语嫣横加斥责、恶语相向，言辞极其冰冷刻薄，将多年兄妹情分践踏殆尽。王语嫣闻听表哥如此绝情言论，如遭晴天霹雳，顿时心碎神伤、悲痛欲绝，泪流满面地瘫软在侧。段誉见心仪之人受此奇耻大辱与无情折磨，胸中义愤填膺，按捺不住怒火挺身而出，厉声斥责慕容复寡情薄义、枉为君子。慕容复本就因复国大计屡屡受挫而心胸狭隘，见段誉横加干涉并戳中痛处，眼中杀机骤起。趁段誉全神贯注关切王语嫣、毫无防备之际，慕容复骤施辣手，暗中运起狠辣掌力对其暴起突袭。段誉措手不及之下胸口中掌，登时被击得气血翻涌、负伤倒退。这场言语与武力的剧烈冲突，令慕容复与段誉、王语嫣之间的关系彻底决裂，也让事态滑向了更为凶险失控的深渊。",
  "事件概要": "慕容复为断绝痴念当众以刻薄恶语斥责王语嫣，致其心碎瘫软；段誉义愤填膺挺身怒斥其薄幸，反遭慕容复趁隙运狠辣掌力暴起暗算击伤胸口，三人彻底决裂。",
