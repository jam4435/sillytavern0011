  "事件详情": "杨过与小龙女离开大火烧山的重阳宫一带，径自向山后草木不生的乱石堆中走去。两人走了半个时辰离重阳宫已远，回头遥望大火烧得半边天都红了。北风越刮越紧冻得郭襄小脸苹果般红。小龙女说要找吃的——孩子又冷又饿只怕支持不住。杨过自嘲真傻抢这孩子来徒然多个累赘，小龙女俯头亲亲郭襄的脸说这小妹妹多可爱。杨过笑说「人家的孩子有什么稀罕除非咱俩自己生一个」——这句话触动小龙女心底深处的母性，她脸上一红心想若真能给杨过生一个孩儿该是多大的福气。天空飘飘扬扬下起雪来越下越大。小龙女挂念武三通、郭芙他们不知会不会遇上蒙古兵，又挂念师姊李莫愁到哪里去了——杨过说师姊不甘自己独个儿可怜要弄得天下人人都如她一般伤心难过。说话之间天色更加暗了。转过山腰忽见两株大松树之间盖着两间小小木屋屋顶上已积了寸许厚白雪。杨过推开板门见屋中无人桌凳积满灰尘显是久无人居的猎人小屋。他生了一堆柴火又拿弓箭出去射了一只獐子回来剥皮开腔用雪擦洗后在火上烤了起来。外边雪愈下愈大屋内火光熊熊和暖如春。小龙女咬些熟獐肉嚼得烂了喂在郭襄口里。杨过将獐子肉在火上翻来翻去笑吟吟地望着她二人——松火轻爆烤肉流香，荒山木屋之中别有一番温馨天地。",
