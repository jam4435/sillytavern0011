  "事件引子": "割袍断义恩断义绝，邓百川公冶乾抱包不同尸身痛别而去。",
  "事件详情": "忠仆包不同的尸身横陈当场，鲜血染红地面，双目圆睁死不瞑目。同为慕容氏忠心耿耿的家臣风波恶与公冶乾亲眼目睹同袍兄弟惨遭少主卑鄙暗算残杀，心胆俱裂，只觉万念俱灰、寒彻骨髓。二人扑倒在包不同遗体前痛哭流涕，难以置信昔日誓死效忠的公子爷竟会变得如此灭绝人性。面对二人的悲愤质问与满腔控诉，慕容复神色阴鸷冷酷，毫无丝毫愧悔之意。风波恶与公冶乾彻底看清了慕容复自私残暴、丧心病狂的真面目，深知昔日的主仆恩义已彻底荡然无存。悲愤交加之下，二人当着慕容复与段延庆的面，运起内劲将随身佩戴的兵刃当场折断，狠狠掷于尘土之中，字字泣血宣告与慕容复恩断义绝，誓不再侍奉姑苏慕容氏。二人抱起包不同遗体与残破兵刃愤然决绝离去，慕容复亲手斩断君臣纽带，众叛亲离，彻底沦为孤家寡人。",
