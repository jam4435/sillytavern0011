  "事件引子": "白雾弥漫腥臭至，含丸避毒鞭荡雾。",
  "事件详情": "木婉清与段誉策马驰至无量山后山树林，举目但见四周白雾茫茫，空气中弥漫着刺鼻难闻的腥臭之气。段誉机警认出异状，急忙高声向木婉清示警，道出此乃神农帮帮主司空玄所布下的阴毒毒烟阵法。木婉清神色从容，迅速从怀中掏出一枚红色避毒药丸递予段誉，叮嘱其含在口中以克百毒。段誉遵嘱依言含服，顿时只觉满口清凉甘冽，先前因吸入微量毒气而产生的恶心眩晕之感瞬间荡然无存。随后木婉清纵马径直冲入浓重毒阵之中，手中软鞭狂舞如风，以内劲激荡的风压将扑面而来的滚滚毒雾硬生生驱散荡开。潜伏在迷雾中企图借毒烟掩护偷袭的神农帮帮众相继现身突袭，木婉清鞭法出神入化、凌厉无匹，鞭影漫卷笼罩四方，所过之处惨叫哀号连连，数名偷袭的帮众接连被长鞭抽中落败倒地。段誉凭借红丸护体不受毒雾侵蚀，木婉清以鞭法力压伏兵并撕开毒阵通路，二人乘马继续向深处挺进。",
  "事件概要": "起因：驰至后山树林白雾弥漫腥臭刺鼻，段誉示警此乃司空玄所布阴毒毒烟阵。发展：木婉清递红丸予段誉含服避毒，纵马挥鞭以内劲风压硬生生荡开滚滚毒雾。结果：木婉清漫卷长鞭连续抽倒偷袭伏兵撕开通路，二人乘马继续向深处挺进。",
