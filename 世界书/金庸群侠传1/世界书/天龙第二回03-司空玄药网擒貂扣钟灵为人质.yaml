  "事件引子": "营地中惨呼迭起，腥风窜动，暴起的白影回旋撕咬，逼得神农帮众人抱头退避。",
  "事件详情": "营地内毒貂暴起伤人，局势危急，但神农帮帮主司空玄终究是久历风浪的老江湖，狠厉心性非常人能及。面对体内剧毒发作的钻心剧痛，司空玄咬牙强忍，双目死死盯住四处扑咬的闪电貂，敏锐捕捉到那灵兽连咬数人后面力道见竭、回窜空中的转折瞬间。司空玄当机立断，猛然单手挥动药锄带起劲风，自怀中迅速甩出一张特制的坚韧药网，漫天洒开，凌空精准地将去势已衰的闪电貂当头罩住，死死困在网中。钟灵眼见自己最依赖的通灵灵兽当场被生擒，顿时大惊失色，心中焦急万分，不顾自身安危奋力扑上前去意图强行夺回闪电貂。然而在场的神农帮高手虽负中毒之痛，却已然回过神来，数人迅速结成包围之势，合力出手围攻压制。钟灵寡不敌众，招架不及之下被众高手当场制伏。神农帮帮众迅速夺取控制权，将钟灵严密羁押反扣为人质，使场中局势彻底倒向神农帮一方。",
  "事件概要": "面对毒貂暴起连伤数人，司空玄强忍剧痛瞅准灵貂力竭回窜之机，抖出特制药网凌空将其生擒。钟灵急切抢夺，却寡不敌众遭神农帮高手合力制伏反扣为人质，场中局势彻底落入神农帮掌控。",
