  "事件详情": "烟雨楼前大雾弥漫，能见度极低。完颜洪烈与欧阳锋趁机布下毒计，一面调集官兵万箭齐发，一面放出蛇阵围困众人。蛇群与箭雨来势汹汹，加之大雾锁路，群雄顿时陷入绝境。生平最怕毒蛇的周伯通率先跃上烟雨楼顶躲避。危急关头，嘉兴本地人柯镇恶接过黄蓉递来的打狗棒，凭借对地形的熟悉，在黑暗与浓雾中辨明方向，带领众人循着竹林小径突围。虽然途中遭遇官兵伏击，但在丘处机、王处一等人的奋力冲杀下，众人最终有惊无险地逃出重围。一场大雨将浓雾冲散，危机暂时解除。",
