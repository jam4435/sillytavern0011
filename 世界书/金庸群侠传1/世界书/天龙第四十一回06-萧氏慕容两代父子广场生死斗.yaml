  "事件引子": "少室山广场宿怨如炽，秋风卷过寺旗，四下杀气凝滞直逼殿宇穹顶。",
  "事件详情": "血海深仇引爆千钧杀机，萧峰暴喝一声率先发难，双掌划弧推出降龙十八掌之“亢龙有悔”，雄浑无匹的刚猛掌力化作低沉龙吟，如惊涛骇浪般直拍慕容博面门。慕容博不敢撄其锋芒，足尖滑步斜掠，右手食指连弹，家传绝技“参合指”化作数道凌厉无匹的破空无形指劲，嗤嗤作响迎向排山倒海的掌风。与此同时，萧远山厉啸着合身扑向慕容复，少林般若掌挟着三十年沉淀的伏魔罡气呼啸击出，每一掌均势沉力拔。慕容复咬紧牙关，全力运转“斗转星移”借力打力之术，佩剑化作漫天银芒试图卸去刚猛掌力，然而双雄内力悬殊，剑锋触及掌风的瞬间嗡嗡剧颤，震得慕容复虎口开裂、气血翻涌。四位当世绝顶高手在少林寺广场上捉对厮杀，掌影翻飞，剑气纵横，狂暴的真气余波将广场四周数根合抱粗的寺旗巨柱连根震断，碎石泥尘冲天而起。两代父子生死相搏，招招直取要害，慕容复渐渐不支嘴角溢血，慕容博见状招式一变，急催内力护住儿子，场中杀戮陷入白热化的死斗。",
