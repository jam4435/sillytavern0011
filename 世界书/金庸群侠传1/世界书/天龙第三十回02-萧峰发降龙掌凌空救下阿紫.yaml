  "事件引子": "少林大雄宝殿前广场上杀机凝滞，数千豪杰环伺，丁春秋正扣住阿紫腕脉凶狠挟持。",
  "事件详情": "萧峰勒马停步后目光如电扫向四周，一眼瞥见双目失明的阿紫正被星宿老怪丁春秋死死扣住腕脉挟持在阵前。萧峰念及阿朱临终前的托孤重誓，护妹心切，胸中雷霆之怒骤然爆发，二话不说便自马背上拔地而起！身在半空数丈高处，萧峰提聚十成沛然内力，双臂一振，隔空朝着丁春秋连环轰出至刚至猛的“降龙十八掌”。三道雄浑狂暴的金色掌力前后相叠，裹挟着裂石穿云的惊天龙吟，化作排山倒海的狂飙当头压落。丁春秋骤觉罡风扑面、呼吸窒息，自知若是强行硬接必落得筋断骨折，骇然之下怪叫一声，仓促将手中的阿紫奋力抛向高空，自己则足尖点地施展轻功向后狼狈暴退数丈避其锋芒。萧峰身形在半空中精妙一折，展动绝世轻功如大鹏展翅般轻巧兜住落下的阿紫，卸去下坠巨力后飘然稳落于地。他迅速解开阿紫被制穴道，随即将受惊的阿紫稳妥移交给纵身赶来的大理世子段誉严密看护。这一招凌空夺人的盖世神技令丁春秋气血翻腾，更震慑得全场数千豪杰尽皆骇然失色。",
