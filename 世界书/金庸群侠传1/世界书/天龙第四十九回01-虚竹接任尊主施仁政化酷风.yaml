  "事件详情": "天山缥缈峰灵鹫宫中云海翻腾、仙乐飘飘。虚竹正式接任灵鹫宫尊主之位，并与西夏银川公主李清露结为连理，完成大婚盛典。然而灵鹫宫历经天山童姥昔年严酷暴虐的长期统治，整座宫殿自上而下皆笼罩在森严可怖的阴影之中，侍女部众个个噤若寒蝉。虚竹心怀慈悲，不愿再见生灵受压迫之苦，决心彻底移风易俗。大殿之上，九天九部诸女依照昔日旧例战战兢兢垂首跪拜，神态惶恐不安。虚竹见状当即快步上前，温言抚慰，亲自将领头侍女扶起，李清露亦仪态端方地从旁柔声宽慰。虚竹当众向全宫庄重宣告，自今日起悉数废除过往动辄施加肉刑与酷责的严苛律令，凡事皆改行仁和宽厚之法。九天九部部众听闻此言无不心神震动，原先积压已久的畏惧防备之意彻底瓦解，纷纷躬身拜谢尊主大德。虚竹以仁义化解暴虐执念，灵鹫宫上下秩序井然且满怀生机，旧日森寒苛政荡然无存，全宫风貌由内而外焕然一新。",
