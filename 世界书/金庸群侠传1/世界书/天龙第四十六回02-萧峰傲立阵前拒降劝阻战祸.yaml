  "事件引子": "大义当先立于两军，乔峰独步走向辽军帅帐苦劝辽帝罢兵。",
  "事件详情": "面对辽帝的威逼利诱与数十万虎狼之师的逼人气势，萧峰一心为免宋辽两国生灵涂炭，昂首挺立于两军阵前数十步处。他身躯伟岸如崇山峻岭，周身纯阳内力激荡流转，青色布袍在朔风中猎猎作响。萧峰双目如电直视高坐战马的耶律洪基，运起雄浑真力吐气开声，朗声喝道：“陛下！萧峰虽是契丹儿郎，但自幼受大宋汉民衣食养育之恩。今日萧峰纵然万劫不复，也绝不领兵南下屠戮苍生！战端一开，必定白骨蔽野、千里焦土，大辽将士与大宋百姓尽皆骨肉离散。陛下何忍为一人功业，让两国万民填于沟壑？还望陛下以社稷为念，即刻班师罢兵！”声音裹挟至纯内劲，如九天沉雷滚滚回荡于雁门关下，直震得辽军前排战马人立惊嘶，三军将士面面相觑。萧峰的大义抉择斩钉截铁，当众断然拒绝受领帅印金印，令耶律洪基在全军面前颜面扫地，彻底粉碎了以势压人、招降止战的可能，两军言语博弈全面破裂，肃杀之气瞬间升腾至顶点。",
