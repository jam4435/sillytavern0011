  "事件引子": "万仞冰崖之上狂风呼啸、飞雪漫天，同门宿敌狭路相逢，百载积怨在此化作冲天杀意。",
  "事件详情": "天山缥缈峰万丈绝顶，风雪狂啸，积怨近百年的天山童姥与李秋水立于万仞冰崖之上，誓要在此做个彻底了断。天山童姥身形虽如女童，眼中却杀机暴涨，厉声尖啸“贱婢纳命来”，催动恢复的八九成功力悍然出手，右手化作“天山六阳掌”之“阳关三叠”，炽烈雄浑的纯阳劲气翻江倒海般倾泻而下；李秋水白纱覆面、身形飘逸如鬼魅，冷笑嘲讽童姥容颜尽毁，运起“小无相功”游走闪避，反手劈出威震天下的“白虹掌力”，两股浑厚掌劲在半空曲折变向，如白虹贯日般绕过冰棱刁钻直刺童姥背心。二人各展逍遥派绝顶武学，在狭窄湿滑的冰岩上腾挪互拆数百招，虚实相生，险象环生。激战中童姥虽断一足却攻势更见凌厉，招招直逼李秋水咽喉，李秋水亦被激起凶性，索性撤回防守全攻而上。二人狂暴无匹的内力撞击激起震耳欲聋的惊雷巨响，余劲横扫四野，直震得周围悬崖上的万年坚冰寸寸崩碎、雪崩滚滚塌落。剧烈震荡下，李秋水面纱被罡风撕裂，童姥亦嘴角溢血，双方真气激荡翻涌，彻底陷入了玉石俱焚的凶险死局。",
  "事件概要": "天山童姥与李秋水于万仞冰崖狭路相逢，百年宿怨瞬间爆发。童姥催动六阳掌纯阳刚劲正面碾压，李秋水展小无相功御使曲折白虹掌力回旋暗袭。二人各倾毕生绝学互拆数百招，狂暴掌力震裂绝壁玄冰引发雪崩，双双身负内伤陷入玉石俱焚的凶险僵局。",
