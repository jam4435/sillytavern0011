  "事件详情": "小龙女独自外出后杨过在墓中胡思乱想一阵，出大厅沿走廊向西走去不料迷了路——越走越快东碰西撞黑暗中但觉处处都是歧路岔道，竟走进了与墓道相通的地底隧道。杨过害怕至极心想若姑姑找不到自己只道逃了出去定会伤心得很。枯坐了一个多时辰后隐隐听到过儿的叫声却越去越远，情急狂喊之际突觉耳朵被人提起——小龙女在黑暗中行走如在太阳下一般转弯抹角迅速异常。杨过获救后说怕姑姑以为自己逃走难过。小龙女出去原来是捉了一只布袋里面装着三只麻雀——要用麻雀教杨过练武。小龙女将杨过关进一间矮小的石室命他把三只麻雀都捉来且不许弄伤羽毛脚爪。杨过满屋扑抓累得满头大汗连羽毛也碰不到一根。小龙女这才教他窜高扑低、挥抓拿捏的法门，任他在小室中自行琢磨练习。首日一只也捉不到，第五日才捉到一只——小龙女殊无嘉许冷冷说一只有什么用要连捉三只。接连两日又是一只也捉不到了。小龙女用饭粒饱饱喂了麻雀放出墓去另行捉了三只。到第八日杨过终于一口气将三只麻雀抓住。小龙女说今天该上重阳宫去啦便带杨过出了墓门。杨过已有七日不见日光乍见之下眼睛几乎睁不开来。两人来到重阳宫前小龙女朗声叫赵志敬快出来，宫中涌出数十名道士怒目而视。",
