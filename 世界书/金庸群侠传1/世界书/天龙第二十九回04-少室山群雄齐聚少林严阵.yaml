  "事件引子": "少室山千寻广场上长风浩荡、旌旗蔽日，数千武林群豪按刀肃立，山门前杀伐之气弥漫。",
  "事件详情": "少室山大雄宝殿前的千寻青石广场之上，长风浩荡，旌旗蔽日。来自中原各大正道名门、大理段氏皇室高手、姑苏慕容氏门徒以及西夏一品堂武士等数千名武林群豪闻风而至，分列广场四周层层肃立，各怀机心暗中窥伺。面对丐帮大张旗鼓的登门逼宫，少林派阖寺数百僧众严阵以待。玄慈方丈身披大红袈裟，面容沉凝安详，率领达摩院首座玄难、戒律院首座玄寂等数十位白眉高僧稳立于大殿高阶之上。数百名身着缁衣的精悍武僧在大殿台阶下列成森严合围的罗汉大阵，众僧齐声高宣佛号，手中沉重的金刚戒刀与齐眉水火棍齐刷刷重重顿向地面青砖，刹那间金铁交鸣之声宛如滚雷般回荡在山谷之间，雄浑纯正的佛门禅功内力激荡起层层刚猛气浪，硬生生将广场四周喧嚣的人声压制下去。玄慈方丈单手托九环锡杖合十默立，以千年古刹深不可测的底蕴展现出泰山崩于前而色不变的宗师威仪。双方剑拔弩张、冷眼相峙，冰冷的兵刃寒光在日光映照下连绵如海，一场席卷武林乾坤的大决战已然箭在弦上。",
  "事件概要": "少室山大雄宝殿前群雄云集，中原各大名门、大理段氏、慕容门徒与西夏武士各怀异心暗中窥伺。面对丐帮大举压境逼宫，玄慈率玄难、玄寂等少林高僧与数百武僧布下森严罗汉大阵，刀棍齐顿高宣佛号震慑全场，力保千年古刹威仪，大战一触即发。",
