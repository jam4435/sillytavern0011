  "事件引子": "少室山大雄宝殿前狂风猎猎，三场巅峰恶战尘埃落定，残石断刃间杀气渐敛，群雄屏息凝视。",
  "事件详情": "随着段誉以六脉神剑击碎慕容复王冠、虚竹以生死符生擒丁春秋、萧峰以降龙神掌震断游坦之双腿，少室山前的三场巅峰恶战尽数落下帷幕。三大强敌一疯、一残、一被擒，先前不可一世的嚣张气焰荡然无存。大雄宝殿前，萧峰、虚竹、段誉三位结义兄弟重新汇聚，并肩傲立于白玉台阶之上，长袍在山风中猎猎作响，周身散发出气吞山河的磅礴威势。萧峰虎目如电环视广场，沉声喝问：“还有哪位英雄愿上前赐教契丹萧某？”洪亮话音挟带深厚内力滚滚回荡于少室诸峰之间，震得在场数千武林人士心头狂跳。面对三兄弟展现出的震古烁今的通天武功与舍生忘死的金兰义气，原本刀枪森列、誓杀萧峰的中原各大门派掌门、长老与江湖豪杰无不骇然失色、肃然起敬。在少林方丈玄慈合十长叹声中，各路高手再无一人敢拔刀进逼，纷纷垂下兵器、躬身向后退避三舍。笼罩在少林古刹上空的惨烈杀局瞬间冰消瓦解，三兄弟力挫强敌一战功成，其盖世神威与侠义威名自此彻彻底底轰动天下武林。",
  "事件概要": "少林三场巅峰恶战方毕，三大强敌非残即擒。萧峰、虚竹、段誉三兄弟并肩傲立白玉阶前，萧峰沉声喝问群雄，神威震慑全场。中原各大门派骇然失色肃然起敬，在玄慈方丈叹息声中纷纷垂刃后退，古刹惨烈杀局冰消瓦解，三侠威名自此名震天下。",
