  "事件引子": "崇圣寺内梵香缭绕，晨钟肃穆悠远，三宝佛殿前青阶如洗、落叶绝尘。",
  "事件详情": "后宫安定祥和与朝纲清明稳固之后，段誉以宣仁皇帝之尊励精图治，开启了大理国长达四十载风调雨顺的辉煌治世。在位期间，段誉始终推行仁恕宽厚之政，虚心纳谏、轻徭薄赋，与宋辽及吐蕃等邻邦和睦修好，使大理国泰民安、商贸繁荣，终成名垂青史的一代仁君典范。岁月荏苒光阴似箭，及至暮年之际，段誉看透了世间权柄荣枯与红尘聚散无常，毅然决定遵从大理段氏历代先皇之古训，主动避位退隐、禅让皇权。在大理崇圣寺（天龙寺）三宝佛殿前，段誉神色从容地解下九龙黄袍与天通九旒冠，将传国玉玺庄重交付给太子段正兴。面对寺中一众严相高僧，段誉合十躬身，平静跪于蒲团之上。方丈高僧手持戒刀为其主持剃度，削去三千烦恼青丝，并赐佛门法名“了思”，寓意“彻底了却前尘万般相思纠葛，洞彻缘起性空之真谛”。段誉换上一袭粗布青灰缁衣，自此在古刹青灯下长伴晨钟暮鼓、参禅研读贝叶经卷，心境彻底复归空明澄澈，最终得享高寿善终，圆满走完了波澜壮阔又复归纯净的一生。",
  "事件概要": "段誉在位四十载励精图治、福泽万民，及至暮年看透红尘权枯，遵祖训主动避位退隐。他在天龙寺殿前从容解下衮冕，将传国玉玺禅让太子段正兴，随后落发剃度法名“了思”，身披青灰缁衣长伴青灯，心境彻悟澄明。",
