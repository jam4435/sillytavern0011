  "事件引子": "曼陀山庄大厅内剑拔弩张，段氏众人受制于地，慕容复按剑逼位，满堂死寂中弥漫着森然杀机。",
  "事件详情": "曼陀山庄大厅之内杀机森然，慕容复急于逼迫段正淳写下禅让大理皇位与保举自己的诏书，以达成借势复国的野心。然而段正淳虽身陷重围、受制于人，却坚守大理段氏皇室气节，宁死不肯向奸佞屈从妥协。慕容复见段正淳态度决绝、毫无妥协之意，彻底陷入丧心病狂的疯魔状态，悍然拔出腰间利剑，妄图以残杀段正淳一生挚爱之人来彻底击垮其心理防线。段正淳目眦欲裂、厉声怒斥，慕容复却面露狰狞冷笑，挥动长剑对毫无还手之力的弱女子痛下杀手。长剑寒光闪烁间，慕容复当着段正淳的面，手段极其狠辣残暴地将阮星竹、甘宝宝、秦红棉以及王夫人李青萝四人逐一割喉斩杀。四位红颜知己凄声惨呼，相继含恨倒卧在殷红血泊之中，鲜血汩汩流淌，染红了整座大厅地面，曼陀山庄彻底化作惨绝人寰的血腥地狱。",
  "事件概要": "慕容复急于借势复燕，以性命相挟逼迫段正淳写下禅位诏书，段正淳坚守皇室气节宁死不从。陷入疯魔的慕容复悍然拔剑，当面将阮星竹、甘宝宝、秦红棉与李青萝四人逐一残忍割喉斩杀。四女含恨倒卧血泊，大厅化作惨绝人寰的人间炼狱。",
