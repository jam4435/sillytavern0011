  "事件详情": "柯镇恶曾来找过杨过不见踪影甚是焦急，二次来寻时杨过已回。正待问他去了哪里，忽听屋顶风声飒然有人纵越而过——郭靖黄蓉采药归来。郭靖向柯镇恶禀告适才见一个身法又快又怪的人影极似欧阳锋。郭靖挂念杨过拿烛台到床边察看，见他脸色红润呼吸调匀睡得正沉（其实是假睡偷听），不禁大喜。杨过隐约听到义父名叫'欧阳锋'心中暗喜。深夜郭靖夫妇睡到中夜忽听屋顶喀的一声响，接着隔壁房中柯镇恶大声呼喝破窗跃出。郭靖黄蓉急跃起到窗边，只见屋顶上柯镇恶正空手和欧阳锋恶斗，柯镇恶被掌力逼下屋顶，郭靖飞身抢上轻轻接住。郭靖跃上屋顶时黄蓉已与欧阳锋斗得甚是激烈，她双掌飞舞十余招中欧阳锋竟占不到半点便宜。郭靖叫道'欧阳先生，别来无恙啊'，欧阳锋一脸茫然问'你叫我什么？'黄蓉看出他疯病未愈，叫道'你叫做赵钱孙李、周吴陈王！'欧阳锋更加迷糊。柯镇恶取铁杖上来再斗，一杖砸出被欧阳锋内力反激脱手，人也摔入天井。郭靖当即左腿微屈右掌画圈平推——正是降龙十八掌中的'亢龙有悔'，这是他日夕勤练十余年苦功已臻炉火纯青之境的绝招。欧阳锋蹲身双掌平推使出蛤蟆功，三掌相交两人身子一震。郭靖掌力如波涛汹涌猛扑，欧阳锋咯咯大叫身子摇晃。二人十余年后再交手，郭靖已能与欧阳锋并驾齐驱。激斗间屋顶椽子断折，二人一齐落下压在一个熟睡客人身上，郭靖不忍伤及无辜不敢用力，欧阳锋却不理旁人死活乘机压制。黄蓉见丈夫渐落败势，叫道'喂，张三李四，胡涂王八，看招'一掌往欧阳锋肩头拍去。欧阳锋一怔之下疾抓黄蓉肩头五指如钩，却正好抓中她内穿的软猬甲尖刺，指尖剧痛忙不迭松手。郭靖掌力又至，砰的一声两人同时急退——降龙十八掌与蛤蟆功的巨力各打在对方肩头，两人破墙而出半边屋顶塌下。二人各自喷出鲜血，欧阳锋一声狂笑扬长而去，瞬息无踪。郭靖被掌力逼住气说不出话，调匀呼吸后暂无大碍。黄蓉护在丈夫身旁，见客店乱作一团，知不可再居，与柯镇恶携小向北而去。走了一阵黄蓉忽想起杨过，但挂念丈夫受伤重，心想旁的事只好慢慢再说。",
