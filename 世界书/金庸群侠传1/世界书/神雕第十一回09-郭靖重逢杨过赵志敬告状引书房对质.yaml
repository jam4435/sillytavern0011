  "事件详情": "赵志敬在人丛中见到杨过，霎时间脸色大变怒道：'杨过！是杨过！这……这小……也来了！'郭靖听到'杨过'两字忙转头瞧去——二人别离数年杨过人已长大，但他听了赵志敬呼声登时便认出了，心下又惊又喜快步抢过去抓住他手欢然道：'过儿你也来啦？我只怕荒废了你功课没邀你来。你师父带了你来真是再好也没有了。'赵志敬生怕郭靖听了杨过一面之词先入为主，当下脸色铁青抬头望天说：'贫道何德何能哪敢做杨爷的师父？'郭靖大吃一惊忙问赵师兄何出此言。郭靖端详杨过但见他目肿鼻青脸上丝丝血痕衣服破烂泥污满身，显是吃了不少苦头，心中难受一把将他搂在怀里。杨过立时全身暗运内功护住要害——然而郭靖乃是对他爱怜哪有丝毫相害之意。黄蓉见到杨过也是一怔，只淡淡的道：'好啊你也来啦。'杨过从郭靖怀抱中挣脱说道：'我身上脏莫弄污了你老人家衣服。'两句话甚是冷淡语气中颇含讥刺。酒宴之上，三巡酒罢黄蓉站起来朗声说道：'明日是英雄大宴的正日，尚有好几路的英雄好汉此刻尚未到来。今晚请各位放怀畅饮不醉不休，咱们明日再说正事。'众英雄轰然称是。酒宴上肉如山积酒似溪流，群豪或猜枚斗饮或说故叙旧。酒饭已罢众庄丁接待诸路好汉分房安息。赵志敬悄声向郝大通禀告后站起身来向郭靖一拱手：'郭大侠贫道有负重托，实在惭愧得很，今日是负荆请罪来啦。'郭靖急忙回礼说要借一步到书房中说话。杨过见郭靖向他招手就过去跟在他身后。",
