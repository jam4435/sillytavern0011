  "事件详情": "武三通发现李莫愁正向公孙止方向赶去时大声呼喝。忽听山后苍老声音哈哈大笑，周伯通掮着大木箱转出。黄蓉叫他驱蜂赶道姑，周伯通揭开箱盖双手挥动，一群玉蜂飞出直冲李莫愁。蒙古大军火焚终南山时周伯通掮了小龙女养驯的玉蜂装了不少而来，经多日钻研已领会指挥蜂群的若干法门。公孙止见蜂群吃了一惊缩身躲开，李莫愁见玉蜂嗡嗡飞近前无去路只得沿山路退来。武氏父子、程英、陆无双等各执兵刃迎上。小龙女悠悠睁眼见玉蜂便似回到终南故居，低啸呼喝几下玉蜂立时绕着李莫愁团团打转。小龙女问她今日总该后悔了罢，李莫愁脸如死灰问绝情丹，小龙女凄然一笑说已投入谷底深渊。李莫愁一颗心如铅之重——万万想不到那枚冰魄银针杀了天竺僧到头来竟是害了自己。武三通逼问陆展元何沅君尸首下落，李莫愁全身一颤说都烧成灰了一个散在华山一个倒入东海叫他二人永生永世不得聚首。陆无双和武氏兄弟要报仇，李莫愁淡然道一生杀人不计其数终不过一条性命而已，震断长剑负手背后不作抵御。恰在此时东边黑烟红焰冲天，绝情庄起火了。朱子柳上前以一阳指手法点她三处穴道令其无法再逃。李莫愁被押至天竺僧丧生之处，情花毒发作剧痛难忍。她遍身受情花之刺真气涣散，遥遥望见杨过和小龙女并肩而来，眼睛一花竟看到是意中人陆展元和妻子何沅君。她一生倨傲从不示弱，此刻却熬不住叫痛。突然双臂一振猛向武敦儒剑尖撞去，武敦儒缩剑相避，李莫愁撞空后从山坡滚下跌入烈火之中。她站直身子动也不动，火焰将她全身裹住，火中传出凄厉歌声'问世间情是何物直教生死相许'，唱到声若游丝悄然而绝。",
