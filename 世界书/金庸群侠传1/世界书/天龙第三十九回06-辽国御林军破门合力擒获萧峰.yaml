  "事件详情": "在萧峰服毒功散、瘫软无力的同一瞬间，早已奉耶律洪基密旨埋伏在南院大王府四周的数千辽国精锐御林军闻讯而动，悍然发起合围强袭。御林军兵士如潮水般破门砸窗而入，铁甲铿锵，刀枪林立，瞬间将整座王府内堂围得水泄不通。面对四面八方齐齐刺来的森寒兵刃与重重铁网，萧峰虽有吞吐山河之盖世气魄，奈何体内剧毒肆虐横行、周身经脉剧痛麻痹无力，任凭如何提气也无法凝聚起半分真气抗敌。精锐御林军一拥而上，以精钢绳索、沉重铁链与重重刀枪死死架住萧峰周身各大要害，群起发力将这位威震天下的南院大王牢牢制伏在冰冷的地面之上。眨眼之间，昔日所向披靡的绝顶英雄沦为了毫无还手之力的阶下之囚，辽国御林军顺利完成了对萧峰的重重围捕与生擒，彻底剥夺了其人身自由并将王府完全接管。",
