  "事件引子": "南院王府中雕梁画栋、清冷肃穆，府门外快马昂首长嘶，风掠林梢尽显萧瑟。",
  "事件详情": "乔峰此时已官拜大辽南院大王，身居显位，坐拥无极富贵与泼天权柄。然而乔峰生性豪迈豁达、淡泊名利，对王府中的锦衣玉食与显赫权位毫无半分眷恋与贪图，其内心深处始终横亘着当年雁门关惨案的血海深仇与生母被害的未解之谜，查明真相的执念日夜煎熬着他的心神。为了追寻当年的身世谜团与杀母真凶，乔峰毅然放下南院大王的所有尊荣与差事，不带大队亲兵与仪仗随从，只备了一骑快马，换上一身利落便服，轻装简从启程。他翻身上马，扬鞭策马自大辽南院一路疾驰南下，穿行于北方苍茫的原野古道之上，迎着凛冽风霜日夜兼程，直奔大宋与大辽交界的雁门关而去。在这场关乎身世与血仇的抉择中，乔峰毫无顾忌地舍弃了荣华富贵，展现出决绝的追凶意志。经过连日风尘仆仆的奔波，乔峰终于策马抵达了险峻荒凉的雁门关绝壁之下，完成了自辽南重返故地的长途跋涉，正式拉开了凭吊旧地与探查血案真相的序幕。",
  "事件概要": "乔峰虽贵为南院大王，却难抑探寻身世谜团与杀母仇人的执念，毅然舍弃王府荣华富贵与权柄差事，换上便服单骑启程。他迎着朔风日夜兼程疾驰南下，穿行于苍茫古道，历经长途跋涉终抵雁门关绝壁之下，决意彻底查明当年血案真相。",
