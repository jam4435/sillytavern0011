事件名称: 奇遇事件-射雕-试剑峰顶听潮生
事件地点: 海外/桃花岛/试剑峰
触发条件:
  全部:
  - 变量: user数据.初始属性.悟性
    大于等于: 14
  - 变量: user数据.初始属性.洞察
    大于等于: 13
事件持续时间:
  时: 4
事件引子: 月圆之夜，桃花岛试剑峰上海风呼啸，石林间回荡着若有若无、牵动心魔的碧海潮生乐律残响……
事件概要: 玩家在试剑峰顶抗衡碧海潮生曲乐律余韵，以深厚定力磨砺神识，悟得音律破魔心法残卷。
事件详情: 皓月当空，试剑峰顶石缝激荡海风，发出犹如洞箫呜咽之声，正是黄药师昔日吹奏《碧海潮生曲》在石窟留下的共鸣余响。乐声忽如巨浪排空、忽如妖魅诱惑，引动体内气血翻涌。玩家盘坐抚剑，紧守灵台一寸清明，以内息与天地声律相抗。数个时辰后潮平声息，神识大为凝练通透。
参与人物:
- 玩家
insert:
  user数据:
    包裹:
      碧海潮生残谱:
        类型: 杂物
        品阶: 绝品
        物品描述: 桃花岛石刻记录的奇门音律残谱，研读可增强对幻术、迷魂及音波武功的心境抗性。
        数量: 1
update:
  user数据:
    修为: '+2400'
