  "事件引子": "夜色笼罩死寂荒野，残月如钩，一口干涸幽深的废弃枯井森然矗立在乱石枯草之间。",
  "事件详情": "夜幕笼罩荒野，四野一片死寂。遭受表哥绝情痛斥与抛弃的王语嫣万念俱灰，失魂落魄地游荡在荒野深处，神情恍惚已无生念。慕容复在暗中紧随其后，眼见王语嫣痴情纠缠不休，生怕她尾随至西夏皇宫破坏自己应聘驸马的大局。为绝后患并彻底抹去这一羁绊，慕容复眼中掠过一丝狠厉与决绝，悄然潜行至荒野中一座废弃已久的深邃干枯枯井旁。趁王语嫣毫无防备、神志恍惚之际，慕容复狠心运力猛然出手，将王语嫣一把推入了漆黑不见底的枯井深渊之中。王语嫣只觉身躯骤然悬空下坠，凄厉惊恐的惨呼声划破了寂静的黑夜，回荡在空旷荒野之上。慕容复伫立井口，眼见表妹坠入黑暗深处，心中毫无悔意，只觉复国路上的重大障碍已被彻底清除。这一冷酷狠毒的举动不仅将王语嫣推向了生死未卜的绝境，更在荒原上掀起了一场致命危机。",
  "事件概要": "遭受抛弃的王语嫣万念俱灰、游荡荒野。慕容复深恐其纠缠破坏争选西夏驸马的大计，尾随至废井旁，趁其恍惚无备狠施掌力将表妹推入万丈深渊，绝情灭口以图复燕霸业。",
