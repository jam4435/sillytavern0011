  "事件引子": "你听说牛家村的一家野店里，东邪黄药师亲自为一对男女主婚。",
  "后续事件": {},
  "事件详情": "黄药师在荒村野店中，见陆冠英与程瑶迦情投意合，但程瑶迦因害羞和礼教束缚不肯明言。黄药师素来不喜繁文缛节，一番软硬兼施的“逼问”后，便当场做主，让二人拜天地成亲。他令陆冠英寻来红烛酒菜，让这对新人在破屋柴铺中直接洞房花烛。黄药师自己则横卧在门口板凳上，为二人守夜。整个过程虽显仓促强硬，却也成就了一段姻缘。藏在邻室的郭靖、黄蓉以及躲在柴草中的欧阳克都目睹了这一切。",
  "事件概要": "黄药师强行为陆冠英、程瑶迦主婚，这对恋人当场结为夫妻。",
