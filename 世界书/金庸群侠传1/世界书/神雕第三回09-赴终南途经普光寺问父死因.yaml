  "事件详情": "郭靖一清早带备银两与杨过乘船离岛，在浙江海边上岸买了两匹马一路向北。杨过从未骑过马但内功略有根柢数日便已控辔自如。不一日二人渡过黄河来到陕西。郭靖少年时曾在蒙古军中做过大将，只怕遇到蒙古旧部招惹麻烦，将良马换了两匹极瘦极丑的驴子，身穿破旧衣衫打扮得和乡下庄汉相似，杨过也穿上粗布大褂。这一天到了樊川已是终南山所在，沿途岗峦回绕松柏森映宛然有江南景色。杨过叹道这地方有点像桃花岛，郭靖听他说'咱们桃花岛'不禁怃然。杨过却说'我这一辈子永远不回桃花岛啦'，郭靖不意他小小年纪竟说出这等决绝的话来。两人到了冈顶普光寺将驴子拴在庙外松树上进庙讨斋饭。庙中僧人见郭靖打扮鄙朴神色冷淡只拿两份素面几个馒头给二人吃。郭靖坐在松下石凳上转头忽见松后石碑露出'长春'二字，拂草看时碑上刻的却是丘处机所题一首诗，辞意悲天悯人感叹生灵涂炭。郭靖见了此诗想起十余年前蒙古大漠中种种情事抚碑不语。杨过问碑上写着什么，郭靖解释后称赞丘真人武功卓绝爱护万民的心肠更教人钦佩，又说杨过父亲是丘祖师当年得意弟子，丘祖师瞧在父子情分上定会好好待他。杨过突然问：'我爹爹是怎么死的？是谁害死他的？'郭靖脸色大变想起嘉兴铁枪庙中之事身子微颤黯然不答。杨过又想起母亲每当自己问起父亲死因总是神色特异避不作答，这时忍不住大声道：'我爹爹是你跟郭伯母害死的，是不是？'郭靖大怒顺手在石碑上重重拍落厉声道：'谁教你这般胡说？'他盛怒之下这一击拍得石碑不住摇晃。杨过见郭靖动怒忙低头认错说以后不敢胡说。郭靖对他本甚爱怜听他认错气就消了，正要安慰几句，忽听身后有人'咦'的一声似乎甚是惊诧——原来是两个中年道士看到了郭靖适才在碑上的一击。",
