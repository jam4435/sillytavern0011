  "事件引子": "神龙摆尾威震四野，乔峰发劈空掌力击毙残暴契丹骑兵。",
  "事件详情": "乔峰身处山石之后，体内虽流淌着契丹人的血脉，但他自幼生长于中原大宋，深受汉人父母与师友的悉心抚育与侠义教化，生平最为痛恨仗势欺人、恃强凌弱以及残害无辜苍生的暴行。眼见大辽契丹骑兵如此泯灭人性地血腥屠戮手无寸铁的宋民，乔峰目眦欲裂，心中正义之火与悲愤之情轰然爆发，怒不可遏。在契丹同胞血脉与人间大义之间，乔峰毫不犹豫地选择了除暴安良。他长啸一声，拔地而起，身形如离弦之箭般自山石后怒纵而出，宛若猛虎下山一般以雷霆万钧之势悍然冲入密集的辽兵骑阵之中。乔峰将毕生绝顶神功催动至极致，双掌狂吐浑厚无匹的雄浑内力，掌力破空之处龙吟之声震天动地、响彻四野！刚猛无俦的磅礴掌风瞬间化作排山倒海的气浪，正面撞击之下，数十名横行霸道的辽兵甚至来不及挥刀抵挡，便连人带刀被凌空震飞数丈，重重跌落在地筋断骨折；其余战马亦被骇人龙吟惊得嘶鸣乱窜、阵型大乱，辽军凶残的冲杀大阵瞬间被乔峰以一己之力彻底冲垮瓦解。",
  "事件概要": "乔峰暴起如雷霆降世（起因）；施降龙十八掌连毙四名凶暴契丹兵卒（发展）；夺下战马驱散余众（结果）。",
