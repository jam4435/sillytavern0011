  "事件详情": "大辽南京城郊御林中军大帐内，甲光照日、杀气森严。辽帝耶律洪基亲自移驾营垒督军，誓要压服萧峰统领三军出征。耶律洪基端坐虎皮帅椅，拔出腰间镶金弯刀狠狠劈断令旗，对帐下枢密谋臣与心腹将领下达严令：“严密监控南院大王府，凡有与其私通音讯或意图哗变之将领，格杀勿论！”众谋士献上攻心之计，密谋利用萧峰重情重义且顾念阿紫安危的软肋，准备在御赐酒宴中暗施迷毒毒药，强夺其功力后再以铁笼锁拿逼其就范。耶律洪基眼中杀意毕露，当即收回南院军符，全权交由御林军亲信统领。萧峰在行辕内虽察觉亲随被换、旧部被隔绝，却依旧傲骨挺立、闭门不从。此时南京城内外刁斗夜鸣、铁骑巡弋，各部兵马风声鹤唳。耶律洪基以雷霆手段完成对军权的绝对掌控，毒药囚车与重兵杀局全面就绪，一张以生死逼迫萧峰统兵南侵的险恶巨网彻底在析津府收紧。",
