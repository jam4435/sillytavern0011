  "事件引子": "偏殿重重明珠锦帷低垂，异香缭绕，四方豪杰屏息凝神，静候帘内垂询以择快婿。",
  "事件详情": "西夏皇宫招亲盛典之中，群雄逐鹿，气氛庄重而热烈。银川公主李清露端坐于重重帷幕深处遴选乘龙快婿，虚竹与姑苏慕容复皆在场中参选。虚竹心地淳朴，本无贪恋世俗荣华与权位之念，心心念念唯有昔日冰窖中患难相依的“梦姑”；而慕容复则满怀大燕光复之宏图，急欲借助西夏军政强援以成就复国霸业。银川公主垂询诸般私密问题，虚竹直抒胸臆、据实以告，言语对答之间与公主昔日冰窖之忆严丝合缝，梦郎梦姑终得在文武百官面前当场相认。西夏内廷随即隆重宣旨，正式择定虚竹为西夏驸马。慕容复纵然风度翩翩、机关算尽，却彻底在选婿角逐中遭黜落选。眼见虚竹一步登天得享无上尊荣，慕容复数载苦心谋划顷刻化为泡影，胸中嫉恨与怨毒如狂潮翻涌，复国执念彻底走向偏执与极端。最终，虚竹与李清露喜结良缘，西夏举国欢庆；慕容复惨淡败北，大业成空，愤然离场，为其随后彻底堕入魔道埋下了伏笔。",
  "事件概要": "西夏皇宫选婿大典上，银川公主隔帘设问探询群豪。虚竹恪守诚实据实以告，言及黑暗冰窖与梦姑往事，与帘内公主昔日记忆严丝合缝，二人当殿相认结为连理。慕容复机关算尽却惨遭黜落，数载借兵复国宏图顷刻落空，羞愤妒恨之下拂袖离场。",
