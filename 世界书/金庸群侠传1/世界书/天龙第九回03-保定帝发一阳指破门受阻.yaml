  "事件详情": "得悉段誉与木婉清被俘受困的消息后，大理保定帝段正明与镇南王段正淳心急如焚，亲自率领大理三公、四护卫等一众皇室绝顶高手飞速赶赴万劫谷展开营救。众人抵达石室前，眼见厚重的石门紧闭，内里情况不明。保定帝段正明救人心切，当即凝神运功，暴喝一声施展出大理段氏家传绝学“一阳指”。只见其指力破空，浑厚刚猛的纯阳指力如利箭般直贯石门！然而这间石室乃是万劫谷精心以玄铁混杂坚硬花岗岩特制筑就，通体浑厚无缝、坚不可摧，保定帝雄浑的一阳指力击在门上仅激起阵阵火星，石门依旧巍然不动，大理诸高手倾尽全力一时竟无法破门而入。见段氏高手破门受阻，谷主钟万仇立于谷中得意狂笑，极尽叫嚣讥讽之能事。与此同时，受钟万仇邀约前来看热闹的各路江湖豪杰、武林名宿已陆续齐聚万劫谷外，人声鼎沸。随着天色推移，正午时分已然迫近。保定帝等人强攻未果受阻门外，无法直接破室救人，大理皇室的百年清誉与世子性命危在旦夕，局势陷入极度僵持与绝境。",
