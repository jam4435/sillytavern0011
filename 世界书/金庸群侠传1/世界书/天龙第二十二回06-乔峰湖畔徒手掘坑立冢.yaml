  "事件引子": "风雨初歇的小镜湖畔一片死寂，晨光惨淡，唯见泥泞中万念俱灰的汉子抱尸僵立。",
  "事件详情": "破晓时分，肆虐了整整一夜的暴风骤雨终于渐渐止息，小镜湖畔雨歇云散，四野一片萧索死寂。乔峰双目赤红如血，整个人面容憔悴、神情木然如死灰，从万念俱灰的绝望中强行撑起沉重的身躯，决心亲手将惨死的阿朱妥善安葬入土。在小镜湖畔湿润的泥土旁，乔峰没有寻找任何铁锹锄头等挖掘工具，而是重重跪倒在湖畔泥地之上，凭借一双血肉手掌硬生生在坚硬的泥土石块中向下刨挖。粗糙冰冷的砂石刺破了他的十指皮肤，泥水混杂着鲜血染红了指缝，乔峰却仿佛失去了所有肉体痛觉，任凭十指鲜血淋漓，机械而执着地一寸寸挖出一座巨大的深坑墓穴。待墓穴挖成之后，乔峰强忍满腔悲痛小心翼翼地将阿朱安放在深坑之中，捧起黄土亲手掩埋封土，并在坟冢前亲手立起了一方石碑，以十指滴血的代价为心爱的阿朱筑起了永恒的长眠之所。",
  "事件概要": "暴雨初歇，痛失至爱的乔峰强抑满腔绝望，在小镜湖畔重重下跪。他不假铁铲工具，凭借一双血肉手掌硬生生在砂石坚土中刨挖深坑，任由十指磨损滴血；挖成后将阿朱遗体轻放安葬并立石为碑，以血泪为至爱筑就长眠之所。",
