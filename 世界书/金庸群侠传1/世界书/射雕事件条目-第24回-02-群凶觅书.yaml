  "事件详情": "黄昏时分，完颜洪烈、欧阳锋、杨康一行人为躲避官兵追捕，来到了偏僻的牛家村，恰好也进入了郭靖黄蓉藏身的曲三酒馆。彭连虎等人恭贺完颜洪烈获得《武穆遗书》，在密室中的郭靖闻言大惊，心神激荡险些走火入魔，幸得黄蓉及时安抚。欧阳锋提议共赏宝书，杨康上前打开石盒，却发现盒内空空如也。完颜洪烈大失所望，怀疑石盒有夹层并将其摔碎，但仍一无所获。众人议论纷纷，最终欧阳锋决定当晚再次入宫搜寻，他与彭连虎等人先行离去，留下完颜洪烈、杨康和养伤的欧阳克在酒馆歇息。",
  "事件概要": "完颜洪烈一行发现石匣为空后再度搜书，郭靖黄蓉的藏身之地也随之更加危险。",
