  "事件引子": "小镜湖上狂风呼啸、暴雨滂沱，阵阵沉闷惊雷滚过天际，青石桥上一片死寂与凄冷。",
  "事件详情": "小镜湖上空狂风呼啸，暴雨滂沱，阵阵沉闷的雷声不断在天地间轰鸣回荡。青石桥上，一代盖世英雄乔峰紧紧抱着阿朱逐渐变得冰冷僵硬的娇躯，双膝重重跪倒在泥泞血水之中，仰面向天发出撕心裂肺、肝肠寸断的凄厉长嚎。亲手击毙一生至爱的残酷现实化作万丈深渊般的绝望，乔峰在桥头哭得神魂俱碎、血泪横流，悲痛过度之下数次气绝昏死倒在泥水之中。然而每当他从窒息与剧痛中再次醒转，迎面而来的依旧只有无情的倾盆暴雨与怀中永远停止呼吸的冰冷爱人。在这凄风苦雨的漫漫长夜里，乔峰寸步不离地守在青石桥头，用自己宽阔的身躯紧紧护住怀中的阿朱，任凭无情暴雨疯狂冲刷着两人身上的血迹与泪痕。他在无尽的悔恨、绝望与自我谴责中痛哭流涕，整整哀嚎哭泣了一整夜，心力交瘁地熬过了最为黑暗绝望的人间长夜。",
  "事件概要": "乔峰跪倒在青石桥头的泥泞血水中，紧抱阿朱逐渐冰冷的遗体仰天悲嚎。亲手击毙至爱的剧痛令他神魂俱碎、数度昏厥，却仍以身躯为挚爱遮挡倾盆暴雨。在无尽的痛悔与绝望中，他于凄风苦雨中寸步不离守灵长泣，心力交瘁地熬过漫漫长夜。",
