  "事件引子": "四大长老叩首伏罪，武林各派宿老携关键密信证物齐临杏林。",
  "事件详情": "乔峰自插四刀、以血赎罪的滔天义举，令在场数百名丐帮弟子无不心灵巨震、热泪盈眶。方才拔刃相向的四大长老更是羞愧难当、无地自容，内心的悔恨与敬佩彻底摧毁了反叛意图。宋长老、奚长老、陈孤雁与吴长风纷纷弃兵跪倒在地，痛哭流涕地向乔峰叩头请罪，嘶声悲呼帮主仁义盖世、自身猪狗不如，甘愿领受千刀万剐之刑以赎罪愆；而挑起叛乱的全冠清见阴谋瓦解、大势已去，顿时面如死灰瘫立当场。正当林中内乱初定之际，突发变故陡生，林外忽起一阵急促杂乱的马蹄声响。此前失联的执法长老白世镜、传功长老吕章，携同副帮主遗孀马夫人康敏，以及少林派玄慈方丈代表、泰山派名宿谭公谭婆、赵钱孙、智光大师等一众武林宿老联袂而至。众人手持关键密信与证物神色严峻地踏入杏子林，叛乱虽平，但一场关乎乔峰身世之谜的更大惊天风暴已轰然降临。",
  "事件概要": "起因：乔峰自刺四刀赎罪义举震动全场，四大长老弃兵跪地叩头请罪，全冠清面如死灰。发展：林外马蹄急响白世镜吕章康敏徐长老及智光谭公谭婆赵钱孙等武林名宿携证物临林。结果：内乱虽定但关乎乔峰身世之谜的惊天风暴已轰然降临。",
