  "事件详情": "白天杨过蛤蟆功暴露、投海自尽被救后，当晚郭靖把杨过叫进房来。郭靖开口道：'过儿，过去的事大家也不提了。你对师祖爷爷无礼，不能再在我的门下，以后你只叫我郭伯伯便是。你郭伯伯不善教诲只怕反耽误了你。过几天我送你去终南山重阳宫，求全真教长春子丘真人收你入门。全真派武功是武学正宗，你好好在重阳宫中用功，修心养性，盼你日后做个正人君子。'这番话看似责备实则充满对杨过前途的关切与期望。郭靖自幼受全真教马钰、丘处机等恩惠，深知全真派武功是玄门正宗，希望杨过能在重阳宫中得到最好的教养。杨过听罢只应了一声'是，郭伯伯'，当即改了称呼不再认郭靖作师父。但他心中究竟是何想法——是感激郭靖的苦心，还是怨恨被逐出师门，抑或是庆幸终于可以离开桃花岛这个处处受人白眼的地方——旁人不得而知。这一晚的决定就此改变了杨过的人生轨迹，将他从东海孤岛推向了终南群山。",
