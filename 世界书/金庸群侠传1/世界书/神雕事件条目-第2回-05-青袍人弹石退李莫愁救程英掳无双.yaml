  "事件详情": "李莫愁纵身去看那两颗小石子，心想发石之人武功深不可测，先避一避再说。她转身拍掌欲先毙了程陆二女，刚要碰到程英后心，一瞥间见她颈中系着红花绿叶锦帕——正是当年自己精心绣就、赠给意中人陆展元之物，不禁一呆，倏地收回掌力。往日的柔情蜜意涌上心头，心想'他虽与那姓何的小贱人成亲，心下始终没忘了我，这块帕儿也一直好好放着'，一时心意难决。她决定先毙陆无双再说，拂尘击向陆无双后心，却见她颈中也系着半块锦帕，咦了一声心道定有一块是假的。拂尘改击为卷裹住陆无双拉转。破空之声又至，一粒小石子直飞李莫愁后心，她回过拂尘钢柄挥出打中石子，虎口剧痛掌心发热全身剧震——小小一颗石子竟有如许劲力。她再不敢逗留，随手提起陆无双展开轻功，如疾风掠地般转瞬无踪。程英追出大叫表妹，正奔之际忽见李莫愁从对岸过桥奔回，已无陆无双踪影。李莫愁拂尘挥下要取程英性命，突然尘尾被什么拉住甩不出去，身不由主腾空向后跃起丈许。转身一看，程英身旁站着一个身材高瘦的青袍怪人，脸上毫无神色似活人似僵尸。那人对程英道'娃儿，这女人好生凶恶，你去打她'，竟抓住程英背心往李莫愁投去。李莫愁伸出左手相接时臂弯陡然酸软，被程英一头撞在胸口，清清脆脆挨了一记耳光——这可是她毕生从未受过的奇耻大辱。李莫愁狂怒挥拂尘，又被那人弹石击中拂尘柄。她料知今日讨不了好，射出十余枚冰魄银针逼开青袍人，又偷射一枚银针击向程英肩头，自己头也不回地奔过小桥穿入桑林。青袍人上前抱起程英，见她肩头插着银针，脸色一变，抱她快步向西而去。",
