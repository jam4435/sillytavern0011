  "事件详情": "虚竹率领梅兰竹菊四剑行至西去途中的驿道半途，官道之上尘土扬起，迎面赫然遇见了结义三弟、大理世子段誉，以及同行的王语嫣、阿碧等一行人。久别重逢之下，虚竹与段誉皆是惊喜交加，二人快步上前互致问候，回叙自少室山分别以来的种种际遇，兄弟二人义气深重，相见甚欢。段誉见义兄如今统领灵鹫宫且身旁侍女护卫严整，由衷为兄长感到高兴；虚竹得知段誉也是一路西行，便力邀众人合兵一处、携手并进。王语嫣神情淡漠、若有所思，阿碧则在旁温言相随，众人当即合为一路，共同朝着西夏国都兴庆府进发。队伍在行进途中互通消息，虚竹得知了各路人马赴西夏的动向，段誉也得以与义兄同行互为照应。这一场半途偶遇不仅令结义兄弟情谊更加深厚，也使得原本分散的中原与大理各方势力在西行路上达成了同路前行的格局，为接下来的风云变故埋下了伏笔。",
