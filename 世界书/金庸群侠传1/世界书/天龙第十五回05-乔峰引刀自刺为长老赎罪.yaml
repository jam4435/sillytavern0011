  "事件引子": "杏林中叛乱方息，数百帮众屏息肃立，四柄森然法刀寒光凛冽，林间死寂杀伐之气弥漫。",
  "事件详情": "制伏叛乱后，乔峰按捺住满腔悲愤，遵照丐帮铁律处置叛乱元凶。按照帮规，阴谋反叛帮主者本应遭受严酷的法刀贯体之刑，然而乔峰念及四大长老昔日为丐帮出生入死立下的汗马功劳，宅心仁厚不忍依律诛杀同袍，决意自残躯体代受酷刑。乔峰取来帮中刑刀，当着数百名弟子的面手持利刃，神色庄穆悲壮地当众高声历数四人的赫赫战功：宋长老破契丹之勇、奚长老守太原之功、陈长老刺西夏之烈、吴长老断后路之险。乔峰每念及一条功绩，便决然拔出一柄锋利法刀，毫不犹豫地反手狠狠刺向自己的躯体。伴随着皮肉撕裂之声，四柄冰冷的法刀接连贯入他的左肩与右臂，殷红的鲜血瞬间喷涌而出，将整件青布衣袍尽数浸染成血红色。四柄法刀森然深插在乔峰身上，他以自身流血重伤的极高代价，当众为宋、奚、陈、吴四大长老洗脱赎清了犯上反叛的滔天死罪，铁骨忠魂彰显无遗。",
  "事件概要": "平息叛乱后，乔峰面对犯上作乱的四大长老，不忍同门受法刀诛杀之刑，决意自残躯体代受帮规酷刑。他当众历数宋、奚、陈、吴四位长老昔日为丐帮立下的赫赫战功，每念一人便拔刀深刺己身，接连贯体四刀，以重伤鲜血洗脱四人死罪，令群丐震动拜服。",
