  "事件引子": "万劫谷外密林幽暗沉寂，四野忽起龙吟般的刺耳啸音，震落漫山黄叶，杀机陡现。",
  "事件详情": "段誉与褚万里、古笃诚、傅思归、朱丹臣一行五人策马扬鞭，沿山林大道兼程赶赴万劫谷。行至半途密林深处，前方幽林之中骤然爆出一阵极为诡异刺耳的啸声，那声浪如虎啸龙吟般激荡四野，震得整座群山轰然回响，漫山林木落叶簌簌纷飞。精通江湖掌故的朱丹臣闻声面色剧变，急声向众人示警，道出此乃天下四大恶人之首“恶贯满盈”段延庆独步武林的腹语神音。话音未落，前方林道上便缓缓踏出数道杀意凛然的身影，正是威震江湖的四大恶人齐聚：为首的段延庆双腿残疾、手拄一对精钢细杖，面上肌肉僵硬如铁；其身侧紧随着“无恶不作”叶二娘、“凶神恶煞”南海鳄神岳老三与“穷凶极恶”云中鹤。四大恶人杀气腾腾地堵死前路，南海鳄神手持一柄巨大凶悍的鳄尾剪，瞪起铜铃大眼厉声叫嚣，痛骂大理段氏狗贼撞上门来。四大护卫见状齐齐拔出兵刃结成阵势，将段誉紧紧护在中心，朱丹臣抱拳沉声质问对方为何拦路。段延庆双唇不动，腹中发出阴森如铁的冰冷音调，直指段正淳篡夺其大理皇位，誓要先斩段誉祭旗以夺回江山，双方杀局一触即发。",
  "事件概要": "段誉一行奔赴万劫谷途经密林，四大恶人循声现身拦阻前路。朱丹臣辨明段延庆腹语神音急示警，四护卫拔刃结阵护定世子。段延庆以腹语厉斥段正淳篡夺大理皇位，誓斩段誉祭旗夺国，双方剑拔弩张，恶战一触即发。",
