  "事件引子": "昏暗潮湿的幽深石室内，粗绳悬空微晃，悬吊的老者凝眸审视近前的破局小僧。",
  "事件详情": "悬挂于绳索之上的无崖子凝神打量眼前的破局之人，原本满怀期盼的神情在看清虚竹样貌后瞬间凝固。只见眼前的青年和尚生得相貌丑陋，浓眉大眼，鼻孔朝天，全无逍遥派历代传人俊美潇洒、文雅风流的超尘风貌。无崖子不由得长叹一声，神色间流露出难以掩饰的极度失望与落寞，感叹天意弄人。然而三十年苦候已至极限，大限将至的无崖子深知别无选择，只得无奈认命。无崖子收敛心神，沉声询问虚竹的师承来历与门派出身。虚竹恭敬合十，神态憨厚质朴，老老实实如实禀告自己乃是禅宗祖庭少林寺中一名地位微不足道、辈分极低的“虚”字辈普通小僧。听闻这相貌丑陋的青年竟是少林低辈弟子，无崖子心中更添几分苍凉，但为了传承门派绝学以图清理门户，无崖子做出了不计门第容貌、强纳为徒的决断，为接下来的霸道传功埋下伏笔。",
  "事件概要": "无崖子凝视破局而来的虚竹，见其容貌丑陋木讷、全无本门潇洒风度，深感天意弄人、大失所望；然而三十年苦候已至大限，询知其仅为少林微末弟子后，只得无奈认命，决意破格纳其为徒以托付门户大仇。",
