  "事件引子": "石室外叩拜声未歇，后山忽传来刺耳丝竹与狂妄狞笑，恶徒汹汹杀至，杀机骤起。",
  "事件详情": "就在苏星河率领门人叩拜新掌门之际，石洞外忽然传来刺耳的鼓噪与阴森的狂笑，星宿派掌门星宿老怪丁春秋率领数十名门徒气势汹汹地杀入后山。丁春秋见洞内声息全无、无崖子已死，凶相毕露，当场厉声喝令交出逍遥派掌门信物七宝指环。为了护卫新掌门虚竹以及捍卫师门尊严，苏星河怒斥叛徒，挺身而出奋勇迎战丁春秋。师兄弟二人在乱石丛中展开激烈搏杀，苏星河各展平生绝艺全力抢攻，然而丁春秋手段极其残忍狡诈，在交手中施展出阴毒绝伦的“化功大法”与漫天毒砂。激战数十回合后，苏星河终因功力不济且防备不及，被丁春秋狠辣的毒掌正面击中要害，剧毒瞬间攻心，经脉尽毁。苏星河倒地吐血、痛苦不堪，在丁春秋的狂笑声中伤重不治当场身亡。星宿老怪杀害同门师兄，使得现场陷入极度的血腥与混乱之中。",
