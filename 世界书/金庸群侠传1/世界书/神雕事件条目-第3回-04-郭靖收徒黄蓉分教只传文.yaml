  "事件详情": "郭靖将四个孩子叫到大厅，请出柯镇恶，令四个孩子向江南六怪灵位磕头。柯镇恶大喜恭喜。郭靖命杨过与武氏兄弟先向柯镇恶磕头，再对他夫妇行拜师之礼。郭芙笑嘻嘻问自己是否也要拜，黄蓉让她自然要拜。郭靖正色训诫四人自今而后须得相亲相爱、有福共享有难同当，若再争闹打架定不轻饶，说时向杨过看了一眼。杨过心想：'你自然偏袒女儿，以后我不去惹她就是。'柯镇恶接着宣说门规，无非不得恃强欺人、不得滥伤无辜之类。郭靖正要亲授口诀，黄蓉见杨过低头出神，脸上有股说不出的怪异之色依稀是杨康当年的模样，不禁心中生憎，寻思莫养虎为患，心生计较主动说：'过儿让我来教。'柯镇恶拍手笑称正好比试谁徒儿教得好，郭靖也喜妻子比自己聪明百倍。郭芙怕父亲严峻要跟母亲学，黄蓉却不允。黄蓉定下规矩：郭靖不能教杨过，自己也不能教武氏兄弟和郭芙，四个孩子之间不得互相传授以免错乱功夫。杨过厌憎郭芙与武氏兄弟，得以不与他们同场学艺正合心意。黄蓉领他走进书房，从书架上拿下一本书来，说先教他二师父妙手书生朱聪的功夫，摊开书本朗声读道：'子曰：学而时习之，不亦说乎？'原来那是一部《论语》。杨过心中奇怪不敢多问，只得跟着诵读识字。",
