  "事件详情": "杨过与小龙女正在槐树下情致缠绵，左首高处传来金轮法王的嘲笑声。法王、尹克西、潇湘子、尼摩星、马光佐五人并肩站在十余丈外山冈之上。杨过想起在绝情谷中法王数次为难自己险些丧身于他言语之下，目中露出怒火。马光佐叫道'杨兄弟龙姑娘咱们一起走罢'——杨过只盼与小龙女多过一刻好一刻，答道'马大哥请先行一步'。金轮法王哈哈大笑说'那又何必要你费心他们爱在这荒山野地耽上一十八天啊'。马光佐勃然大怒一把抓住法王衣襟骂他歹毒。法王右手虚拳左手倏出托背——马光佐庞大的身躯立时飞起往山坡上摔下。马光佐皮粗肉厚虽未受重伤但额角青肿。潇湘子与尼摩星一直对法王蒙古第一国师的封号气忿不服——二人交换眼色想联手出击。马光佐哼哼唧唧走到法王背后猛起一拳正中后脑——法王全神贯注在杨过等身上竟被击中眼前金星乱冒。法王回肘撞飞马光佐扛起他奔逃。杨过小龙女与众人猛追——法王扛着近三百斤巨人仍奔行如飞。杨过小龙女渐逼渐近法王倏地停住倒举马光佐脑袋对准岩石作势要撞。杨过绕到身后挡住去路——'你若伤他性命咱们自是一拥而上'。法王哈哈一笑抛下马光佐取出银轮铜轮双轮一碰嗡嗡之声传出山谷傲然道'哪一位先上'。尼摩星自负天竺武学独步天下抓起三百来斤巨岩砸向法王——使出'释迦掷象功'岩石在空中急速旋转去势愈猛。法王对这庞然大物不敢硬接只得跃开。二人翻翻滚滚斗得山谷鸣响。",
