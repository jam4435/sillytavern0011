  "事件详情": "杨过与周伯通攀谈——周伯通说郭靖是他拜把兄弟，因郭靖从小爱跟蒙古人一起所以见蒙古包就钻进来找。杨过说郭靖夫妇去了襄阳——周伯通叹道迟到了几日他们已散了。杨过为坚其信说出郭芙相貌更像黄蓉——周伯通哈哈大笑道'那就好啦一个女孩儿若是浓眉大眼黑黑的脸蛋像我郭兄弟一般那自然是美不了'。杨过又自称与黄药师是莫逆之交，周伯通一怔问杨过师父是谁，杨过调皮说本事大得紧说出来只怕吓坏了他。周伯通右手一扬空盘以全真指力疾飞过去——杨过伸出左手食指在盘底一顶盘子滴溜溜转动。周伯通连叫几声'好'，问他是否认得马钰丘处机——杨过说'这两个牛鼻子我怎不认识'，又骂郝大通混蛋得很终有一日要让他吃点苦头。周伯通大感投契悄声说要躲在一旁偷看杨过捉郝大通浸粪缸。此时子聪和尚走进帐来与忽必烈耳语——他是忽必烈的谋士。子聪连敬周伯通两杯酒，周伯通一饮而尽。待要敬第三杯时周伯通忽然大叫肚子痛要拉屎，蹲下身来竟要在王帐中解裤拉屎。杨过向子聪瞧了一眼已然明白——原来酒中下了毒。他正想提醒周伯通，周伯通却恍然大悟：'原来是毒酒喝得太少这才肚子痛了。和尚快快再斟三杯毒酒来越毒越好！'大踏步走到桌边左手提着裤子右手取过毒酒壶咕噜噜直灌入肚喝了个涓滴不存——口中说'肚子里毒物太多老顽童可不变成了老毒物吗须得以毒攻毒才是'。突然口一张一股酒浆向子聪激射过去——法王拉起桌子一挡酒箭射上桌面溅得嗤嗤作响。周伯通大笑走到帐门口忽地童心大起拉住营帐支柱使劲晃了几下，那柱子喀的一声断了——一座牛皮大帐登时塌落将忽必烈金轮法王杨过等一齐盖罩在内。周伯通大喜纵身帐上来回奔驰将帐内各人都踏到了。法王在帐内挥掌拍出正击在他脚底心——周伯通一个筋斗翻了下来大叫'有趣有趣'扬长而去。",
