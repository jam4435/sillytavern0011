  "事件引子": "残阳如血，秋风瑟瑟，少室山门古道旁黄叶萧索，中原群雄与少林僧众肃立相望。",
  "事件详情": "少室山藏经阁外残阳如血，秋风瑟瑟。生父萧远山受扫地神僧点化皈依空门，宿敌慕容博亦出家受戒，带头大哥玄慈杖刑身死，纠缠萧峰半生的雁门关惨案与血海深仇至此尽数消解。萧峰孤身伫立在山门古道旁，抚摸着腰间空荡的行囊与布满裂痕的断剑残鞘，胸中不仅无大仇得报的快意，唯余无尽苍凉。少林诸僧合十诵佛相送，中原群雄虽惊骇于其盖世神功，投来的目光中却依然充满对契丹异族的警惕与排斥。萧峰心如明镜，深知中原武林与大宋朝廷决难容纳契丹子民，故土虽亲却已无自身容身之所。经过再三抉择，萧峰长叹一声，毅然斩断对中原故土的留恋，决意返回生身之邦大辽。他翻身跃上一匹神骏黑马，勒住缰绳回首向少林寺与中原苍茫群山抱拳朗声道：“青山不改，绿水长流，萧某去也！”说罢扬鞭催马，黑马奋蹄长嘶，迎着向北的漫天风尘绝尘而去，正式踏上归辽的迢迢征程。",
  "事件概要": "雁门关血仇与旧日恩怨尽数消解，萧峰伫立山门，深知中原武林决难真正容纳契丹异族，故土已无容身之所，遂长叹斩断留恋。在群雄与诸僧注视下，他翻身上马抱拳作别，扬鞭催马绝尘北去，踏上归辽征程。",
