  "事件引子": "燕云铁骑破空而至，乔峰率十八飞骑如天神降临少林大会。",
  "事件详情": "少室山大雄宝殿前残阳如血，各派高手的厮杀方才平息，玄慈方丈率少林群僧合十肃立，丐帮与大理群雄犹自惊魂未定。正当众人以为战局已定时，屋脊两侧陡然炸响两道撕裂长空的尖锐破空之声。只见两道黑袍蒙面身影宛如两头扑食苍鹰，自重檐庑殿顶俯冲而下，足尖仅在悬空的铜钟与蟠龙立柱上轻点借力，身形飘忽若鬼魅。萧峰见状瞳孔骤缩，沉腰扎马暗催丹田内劲护体，段誉与虚竹亦各自踏奇门步法护持两侧，少林罗汉堂众僧更是齐声呼喝、横棍结成铁桶金刚阵。两名黑衣老者刹那间并肩落于广场正中，浑厚无匹的护体罡气随之轰然外涌，落脚处坚硬的青石地板应声寸寸龟裂，激荡的气浪硬生生将前排持棍的六名少林武僧震得倒退三步、胸口烦闷欲呕。两名神秘人不置一词，渊渟岳峙地傲立全场焦点，目光冷冽地扫过玄慈、萧峰与慕容复等人，原本稍见平息的少林广场瞬间陷入冰封般的极度死寂，各派豪强纷纷按剑凝神，一场更为凶险的滔天杀局骤然降临。",
