  "事件引子": "废农舍内伤者甫得安歇，屋外骤然蹄声如雷、烟尘滚滚，杀气破空直逼破屋。",
  "事件详情": "段誉与木婉清尚在废弃农舍屋内调息安歇，原本宁静的气氛被突如其来的急促马蹄声打破。姑苏慕容氏家臣风波恶奉命缉拿大理段氏与万劫谷之人，协同多名灵鹫宫三十六洞、七十二岛的精锐探子追踪至此。门外骤然间蹄声震天、烟尘漫天飞扬，数名身着劲装的凶悍骑士快马疾驰而至，片刻之间便将整座孤立的农舍四面包围得水泄不通。为首的青年男子正是风波恶，只见他身着华贵锦袍，手握一柄折扇，面容神态倨傲狂妄，浑身上下透着嗜武好斗的煞气；跟随在他左右的各路洞岛探子亦是手持利刃、杀气腾腾。风波恶勒马立于屋外，运起内力朝着破屋朗声厉喝：“屋中男女听着，大理段氏与万劫谷在此，速速出来受缚，随我等回姑苏领罪！”声浪滚滚直灌屋内。强敌从天而降且指名道姓索拿二人，使得农舍内的安宁瞬间被彻底粉碎，木婉清与段誉陷入重兵围堵、插翅难逃的危急险境之中。",
  "事件概要": "段誉与木婉清于废农舍调息未久，姑苏慕容氏家臣风波恶率洞岛精锐追踪而至，策马将破屋合围。风波恶以内力扬声厉喝，勒令屋内二人就擒随其回姑苏领罪。强敌骤降且指名索拿，使刚脱险境的段、木二人再度深陷重重包围的死局。",
