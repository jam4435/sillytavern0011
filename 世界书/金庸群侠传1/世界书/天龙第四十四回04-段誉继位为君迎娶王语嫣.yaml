  "事件引子": "太和殿内韶乐齐鸣，金炉瑞烟缭绕，文武百官与高僧肃穆拱立，大理登基迎后盛典开启。",
  "事件详情": "大理国皇宫太和殿内韶乐齐鸣、金炉瑞烟缭绕。段誉经少室山变故后安返大理，承继大统即位为大理国君，并依礼迎娶心系已久的绝代佳人王语嫣。大殿两侧文武百官与高僧道众庄严肃立。段誉身着九章衮服、头戴九旒冕冠，温润英挺；王语嫣头戴璀璨凤冠，身披织金霞帔，容颜绝美。段誉缓步走下丹墀，双手托起王语嫣佩戴翡翠玉镯的素手，深情款款道：“语嫣，历经千山万水，今日终得与你结为连理，共护大理苍生。”王语嫣双颊生晕，敛衽低眉柔声道：“愿随陛下同舟共济。”在天龙寺本因方丈等神僧的梵呗祝祷下，二人行三拜九叩大礼，饮尽合卺玉杯中的御酒。段誉当众取过御案上象征母仪天下的金交龙钮皇后金宝，郑重交到王语嫣手中。王语嫣肃然下拜受印，大婚典礼告成。殿外九十九响礼炮齐鸣，大理王城万民伏地高呼万岁，举国同庆，段誉君临大理并与王语嫣结为帝后正果。",
  "事件概要": "段誉历经变故后安返大理即位登基，并依礼大婚迎娶心仪已久的王语嫣。在天龙寺本因方丈等高僧的梵呗祝祷与百官朝贺中，二人行三拜九叩大礼、饮尽合卺御酒，段誉郑重授交皇后金宝。殿外礼炮齐鸣万民伏迎，段誉正式君临大理，帝后同心共护社稷。",
