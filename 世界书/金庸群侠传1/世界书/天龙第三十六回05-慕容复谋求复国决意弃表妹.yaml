  "事件引子": "荒原官道上黄沙漫漫，西行队伍缓缓前行，车马旁三人各怀心事，暗流涌动。",
  "事件详情": "在西行队伍缓缓前行的漫长路途上，众人之间暗流涌动。段誉对王语嫣一往情深，一路上嘘寒问暖、体贴入微，时刻竭尽所能关怀照料王语嫣的饮食起居，然而王语嫣心中眼中唯有自己朝思暮想的表哥慕容复，对段誉的真挚深情视若无睹、漠不关心。与此同时，姑苏慕容复内心却被巨大的野心与焦虑所吞噬。他一心汲汲于光复大燕帝业，深知单凭姑苏慕容氏残存的江湖势力根本无法与中原王朝抗衡，唯有夺得西夏驸马的大位，才能借助西夏一国的倾国精锐军力作为争夺天下的资本。在冷酷的帝王大业权衡之下，慕容复认为表妹王语嫣的儿女私情已然成为自己求娶西夏公主的最大障碍与累赘。经过激烈的权谋算计，慕容复彻底泯灭了青梅竹马的昔日情义，暗中决意斩断情丝，不惜彻底抛弃王语嫣，以此扫清自己争夺西夏乘龙快婿之位的一切羁绊。",
  "事件概要": "西行途中段誉对王语嫣体贴备至，王语嫣却满心只有表哥。慕容复为借西夏重兵光复大燕，深感儿女私情已成争夺驸马的绊脚石，权衡之下泯灭青梅竹马情义，暗中决意彻底抛弃王语嫣。",
