  "事件引子": "战船密布刀枪如林，江湖群豪渡湖合围兴师问罪。",
  "事件详情": "曼陀山庄外的开阔湖面上骤然间战鼓如雷、金鼓齐鸣，肃杀之气瞬间笼罩水域。数十艘吃水极深的战船乘风破浪疾驰而来，黑压压地将整座曼陀山庄团团包围。来者汇聚了大批江洋巨盗与江湖各路豪强，为首之人不仅有江南三十六寨的总瓢把子司马林，更有青城派掌门余沧海座下门人、伏牛派顶尖高手以及太湖诸岛各路岛主头领，数十名掌门与帮主齐聚于此，声势极为浩大。群豪在船头擂鼓呐喊、厉声叫嚣逼近，其动机源于近期江湖流传的血案流言，盛传姑苏慕容氏凭借“以彼之道，还施彼身”的独门绝技，残忍杀害了伏牛派掌门柯百岁等多位武林名宿。群豪一致认定此等暴行乃慕容复所为，此番各派联袂结盟渡湖而来，誓要登岸杀入参合庄兴师问罪，逼迫慕容氏血债血偿。水面上战船密布、刀枪如林，滔天杀意直扑山庄，将原本幽静的曼陀山庄彻底推入了四面受敌的险境之中。",
  "事件概要": "起因：曼陀山庄外湖面战鼓齐鸣，江洋巨盗与江湖群豪乘数十艘战船将山庄团团包围。发展：司马林率青城派、伏牛派等高手因慕容氏以彼之道杀害名宿流言前来问罪讨血债。结果：群豪擂鼓呐喊刀枪如林逼近，幽静山庄瞬间陷入四面受敌险境。",
