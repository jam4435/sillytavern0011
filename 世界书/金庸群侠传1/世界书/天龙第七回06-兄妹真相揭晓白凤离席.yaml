  "事件引子": "酒盏碎裂声余音未绝，暖阁家宴骤凝冰霜，认亲惊语如平地惊雷撕裂满堂喜气。",
  "事件详情": "身世真相大白之后，王府厅内瞬间陷入巨大的悲痛与混乱之中。段誉犹如遭遇五雷轰顶，刹那间面色惨白如纸，身形踉跄着连连后退，失魂落魄地嘶喊反驳，断然无法接受深爱的婉妹竟是自己同父异母的亲妹妹。木婉清更是如坠万丈冰窖，心神剧烈崩溃，尖声娇呼斥责段正淳信口胡言，坚称自己与段郎早已在患难中拜过天地、立下同生共死的毒誓，绝无可能是至亲兄妹。面对这一幕伦理惨剧，王妃刀白凤多年积压的怨恨彻底爆发。她霍然拂袖而起，满面冰霜地对着段正淳厉声冷笑，当众讥刺段正淳当年在江湖中四处留情造下的风流孽债，今日终于报应在亲生儿女头上，实乃天道好还。言罢，刀白凤满怀愤恨与决绝拂袖离席而去，将这场原本谈婚论嫁的喜庆家宴彻底撕裂为无法挽回的绝望残局。",
  "事件概要": "段正淳当众道破木婉清身世，喜宴顿成伦理惨局。段誉如遭雷击连连后退，与心神崩溃的木婉清皆难接受至爱沦为至亲兄妹的残酷真相。王妃刀白凤积怨爆发，厉声讥刺段正淳风流孽债终遭天道报应，决绝拂袖离席，厅内陷入无尽悲愤与绝望。",
