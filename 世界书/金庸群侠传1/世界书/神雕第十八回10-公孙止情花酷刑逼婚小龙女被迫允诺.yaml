  "事件详情": "公孙止昂首前行走进一间小小石室命弟子割几捆情花来。十多名绿衫弟子拿着一丛丛情花走进石室——手上臂上垫了牛皮以防被刺。公孙止右手一挥令将情花都堆在杨过身上。霎时之间杨过全身犹似为千万只黄蜂同时蜇咬四肢百骸剧痛难当。小龙女又怜惜又愤怒要抢上去移开情花，公孙止伸臂挡住。公孙止将众弟子遣出带上室门，说道是祸是福全在小龙女一念之间。杨过在情花小刺围刺之下苦不堪言只是不愿小龙女为自己难过咬紧牙关始终默不出声。小龙女望着他痛楚的神情怜惜之念大起，就在此时手指上情花之毒发作又是一阵剧痛。公孙止道此人遍身为情花所伤每过一个时辰疼痛便增一分三十六日后全身剧痛而死，在十二个时辰之内他有秘制妙药可给医治一天之后却是神仙难救。说着缓步走向室门——'十二个时辰之内你如回心转意只须呼叫一声我便拿解药来救他性命'。小龙女见杨过全身发颤咬唇出血双目黯然无光，一咬牙说道'公孙先生我允你成亲便了。你快放了他取药解救'。公孙止心中又喜又妒——知道自此之后这女子对自己只有怨憎决无半分情意，却坚持今晚洞房花烛后明日一早才取药救人。小龙女与杨过惨然相对半晌无言。杨过缓缓道'姑姑过儿承你倾心相爱虽在九泉亦是心怀安畅。你将我一掌打死了罢'。小龙女提手潜运内劲想先打死他随即自尽——但见他神采飞扬俊俏郎君胸口一酸臂上劲力消失。她突然扑在杨过身上——情花的千针万刺同时刺入她体内——说道'过儿你我同受苦楚'。公孙止惊呼'那又何苦如此'。小龙女向杨过深深望了一眼缓缓转过身去迈步出室再不回头。",
