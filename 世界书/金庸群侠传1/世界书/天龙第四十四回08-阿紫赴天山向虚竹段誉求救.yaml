  "事件引子": "缥缈峰灵鹫宫大殿内檀香袅袅，虚竹与段誉正闲坐对弈论武，神态安详。",
  "事件详情": "天山缥缈峰灵鹫宫大殿之内，檀香袅袅。虚竹与暂居于此的结义兄弟段誉正自对弈论武。大殿石门突然被猛力撞开，阿紫披头散发、鞋袜磨穿且浑身沾满血污风尘，跌跌撞撞扑倒在锦毯之上。阿紫为救心上人萧峰，冒死逃出辽国天罗地网，星夜兼程横跨万里荒漠赶至天山。阿紫双膝跪地扯住虚竹与段誉衣襟，声泪俱下凄厉呼救：“两位哥哥快救救我姐夫！辽帝老儿设下毒计大军合围，要逼姐夫领兵伐宋，姐夫宁死不从，已被困在南京行辕危在旦夕！”虚竹闻言震骇，手中玉石棋子失手碎裂；段誉勃然变色，周身内力激荡而起，慨然道：“大哥有难，小弟纵万死亦当相赴！”二人当机立断，决意起倾国倾宫之力奔赴大辽营救长兄。阿紫自怀中掏出染血的南院王府信物令牌呈上，虚竹高举灵鹫尊主令箭召集九天九部及洞岛数千豪杰，段誉亦发信符急调大理护卫精锐，三兄弟生死宿命再度交汇，一场震动天下的营救大计全面展开。",
