  "事件详情": "猛听得砰嘭一声震天价大响，玉虚洞前数十块大石崩在一旁，丘处机、刘处玄等全真五子从洞中缓步而出。尹志平、李志常等大喜齐叫师父迎了上去。达尔巴和霍都大吃一惊，各挺兵刃向前抢上。丘处机等五人向旁一让，突然十掌齐出按在两人背心，一捺一送将两人抛出丈许之外。原来全真五子在玉虚洞中闭关静修，钻研拆解'玉女心经'之法，殚精竭虑日夜苦思，总觉小龙女和杨过所显示的武功每一招每一式都恰好是全真派武学的克星。后来丘处机从天罡北斗阵法中悟出一理——合五人之力以劲力补招数之不足。一个多月之中终于创出了一招'七星聚会'。虽说是七星聚会却也不必定须七人联手，六人五人以至四人三人也均可并力施展。当法王率众堵洞之时这招正好练到要紧当口万万分心不得。直到五人练到五力归一融合无间这才破洞而出——只可惜过于迫促还只练到三四成火候。五子转过身来只瞧了片刻便面面相觑面色惨然——均想要胜过小龙女的剑法那是终身无望了。他们在洞中所想所练都以先前所见小龙女和杨过的武功为依归，岂知眼前所显示的神奇剑招要想瞧个明白都有所不能，什么破解抵挡真是从何说起。五个老道垂头丧气心下惭愧，自觉一代不如一代不能承继先师功业，大敌当前全真教真是立足无地了。",
