  "事件引子": "神木聚毒百虫噬体，阿紫以游坦之为活鼎炼制剧毒邪功。",
  "事件详情": "聚贤庄一场血战惨败之后，少庄主游坦之不仅家破人亡、父母双亡，更沦落为无依无靠的落魄孤儿。他孤身一人流落江湖底层，衣衫褴褛、食不果腹，饱尝了世间各路武林中人的白眼鄙夷与肆意欺凌，内心极度自卑懦弱。这日游坦之流浪至无锡城外荒野，机缘巧合之下偶遇了逃离星宿派的少女阿紫。阿紫容颜娇美无双，一颦一笑皆令游坦之神魂颠倒、心旌动摇。游坦之瞬间被阿紫绝美的容貌深深迷惑，哪怕明知对方性情乖张残忍，仍甘愿抛弃所有尊严与退路，如同扑火飞蛾般寸步不离地紧紧追随在阿紫身侧。阿紫见游坦之性格懦弱可欺且对自己唯命是从，遂心安理得地将其收留身边充当仆役，游坦之从此深陷于对阿紫畸形病态的盲目痴恋泥潭之中难以自拔，开启了自身悲剧宿命的黑暗篇章。",
  "事件概要": "阿紫在荒庙捕获各色毒虫咬噬游坦之（起因）；游坦之痛苦翻滚却甘之如饴（发展）；毒素不断汇入体内（结果）。",
