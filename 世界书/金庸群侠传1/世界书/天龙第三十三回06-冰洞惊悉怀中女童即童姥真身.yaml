  "事件详情": "虚竹背负着女童在天山险峰与绝壁冰川间狂奔数个时辰，凭借深厚内力终于寻得一处幽深僻静、倒挂着万年冰锥的隐秘天然冰洞藏身，彻底摆脱了万仙群魔的疯狂追杀。进入冰洞安顿下来后，虚竹小心翼翼地将女童放置在平整冰石之上，气喘吁吁地合十行礼，正欲运起内力为她推拿舒筋、检查周身伤势。不料那看似仅有八九岁、衣衫褴褛的小女童却忽然傲然站起身来，周身瞬间散发出一股令人窒息的武林至尊威压。女童双目之中激射出摄人心魄的森寒冷光，冷笑着以极其沧桑老迈的口吻厉声喝斥道：“无知蠢小僧，若非姥姥在背后出言指点，你方才早已成了卓不凡的剑下亡魂！”在虚竹惊疑莫名的交谈逼问下，女童傲然吐露惊天真相：原来她根本不是什么灵鹫宫哑女，正是威震西域、令三十六洞七十二岛闻风丧胆的灵鹫宫至高主人——现年九十六岁高龄的“天山童姥”。虚竹闻言骇然失色，万万未料到自己舍命救下的竟是绝代魔尊。",
