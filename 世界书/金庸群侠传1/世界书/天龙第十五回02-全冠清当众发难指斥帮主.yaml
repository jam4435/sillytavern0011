  "事件引子": "诛心构陷颠倒黑白，雷霆怒斥拆穿挑拨同门之奸谋。",
  "事件详情": "在全场陷入死寂僵持之际，全冠清心怀颠覆帮主之位、挑起内乱的险恶图谋，神色阴冷地自丐帮人群中大步迈出，率先撕破脸皮公开发难。全冠清言辞极尽尖刻锋利，当着数百名帮众的面昂首陈词，先是指控乔峰私通外敌，暗中包庇杀害马副帮主的重大嫌疑者姑苏慕容氏；随后更话锋一转，用诛心之论隐晦影射马大元副帮主的横死与乔峰脱不了干系，甚至公然扣上暗中谋反篡位的滔天罪名，意图彻底动摇乔峰在帮中的威信与正统地位。面对这等无中生有、颠倒黑白的污蔑之词，乔峰勃然大怒，虎目圆睁，凛然正气沛然而出。他当即踏前一步，以雷霆万钧之势厉声斥责全冠清居心叵测、妖言惑众，当场拆穿其包藏祸心挑拨同门的奸谋。全冠清此番构陷与乔峰的当面怒斥，彻底将林中暗流引爆为正面的冲突，丐帮内部的君臣上下名分荡然无存，帮众情绪被煽动得躁动不安，林中气氛紧绷到了极点。",
  "事件概要": "起因：死寂僵持之际全冠清怀颠覆帮主之险恶图谋大步迈出，公开发难指控乔峰私通慕容氏。发展：全冠清更诛心影射马大元之死与乔峰有关并扣上谋反罪名，乔峰虎目圆睁雷霆怒斥其妖言惑众。结果：正邪交锋彻底引爆林中暗流，内部名分荡然无存气氛紧绷至极。",
