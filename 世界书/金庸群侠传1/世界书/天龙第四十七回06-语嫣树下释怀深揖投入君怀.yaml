  "事件引子": "回眸长叹前尘皆空，王语嫣驻足回望痴狂表哥转身依恋段誉。",
  "事件详情": "林荫枯木之下，王语嫣凝望着土丘上疯癫受拜的慕容复，又望见炉旁含泪相守的阿碧，娇躯微颤，泪水如断线珍珠般滑落。回首昔年在曼陀山庄与燕子坞苦读天下武学典籍、对表哥倾心追随却屡遭冷落抛弃的往事，再看如今慕容复的荒唐落魄与阿碧的生死相随，她心头剧震，终于彻底勘破了深种多年的执念与幻妄。段誉立于她身侧，既无胜者的傲色，亦无狭隘的嫉妒，唯有满眼的心疼与怜惜，默默解下身上的锦袍轻柔披在她微颤的肩头。王语嫣拭去面颊泪痕，蓦然回身面对段誉，庄重敛衽，恭恭敬敬地向他深深躬身长揖到底，颤声说道：“段郎，语嫣往昔蒙昧执迷，多蒙你不离不弃、以命相护，此生此世，我心唯属于你。”行礼已毕，王语嫣毅然决然地迈步上前，主动投身步入段誉宽厚温暖的怀抱之中。段誉动情地将她紧紧拥入怀中，二人紧紧相贴、两心无间，昔日纠缠的宿命心结与三角宿怨，在此刻尽皆冰释消融。",
