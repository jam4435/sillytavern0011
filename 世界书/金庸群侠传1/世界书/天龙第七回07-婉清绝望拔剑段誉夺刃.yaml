  "事件详情": "刀白凤愤然离席后，段正淳掩面痛哭流涕，悔恨交加地将当年与秦红棉相识相恋、最终却因大理皇室门户之见被迫分道扬镳的尘封往事尽数道出，并指明木婉清手臂上的红痣正是当年骨血相承的独门印记。木婉清听完这一字一句的铁证，最后一丝侥幸彻底破灭，顿时万念俱灰、痛不欲生。她自知违背伦常誓言已无退路，此生再无可能与段誉结发为夫妻，悲愤之下霍然拔出腰间锋利的随身短剑，反手便朝自己雪白的颈项抹去，意欲自刎殉情以求解脱。一旁的段誉见状吓得魂飞魄散，不顾自身安危急忙合身扑上，伸手死死抓住木婉清的手腕与剑刃拼死争夺。两人在万分危急的拉扯推搡之间，短剑脱手滑落，“当啷”一声脆响砸落在地。木婉清虽被段誉强行夺下兵刃未能殒命，但二人心防已彻底被残酷的现实击得粉碎。",
  "事件概要": "起因：段正淳痛陈当年与秦红棉往事及红痣铁证，木婉清侥幸破灭万念俱灰。发展：木婉清悲愤拔出短剑欲自刎殉情，段誉魂飞魄散合身扑上死死夺刃。结果：拉扯中短剑滑落砸地，段誉强行夺下兵刃救下木婉清，二人心防粉碎。",
