  "事件引子": "大雄宝殿内戒棍森列、香烟缭绕，群雄屏息凝神，静候方丈开堂宣示三十年武林隐秘。",
  "事件详情": "藏经阁宿世恩怨暂歇，天下各派豪杰随少林僧众移步至大雄宝殿前。法堂阶下人头攒动，玄慈方丈身披袈裟、端坐正中法椅，戒律院达摩院众僧各执戒棍分列两厢，法度森严。群雄低声议论，急欲探究三十年武林隐秘。正当玄慈合十垂目、欲开堂宣谕之际，殿外忽起急促破风之声。值守武僧厉声喝阻，手中熟铜棍呼啸合围，来人却全然不顾自身安危，如疯虎般合身硬撞。只听得“砰砰”两声闷响，两名武僧受巨力反震踉跄退开，一道青黑身影跌撞冲入殿中，正是四大恶人之二的叶二娘。她披头散发，面上泪痕与血渍交错，怀中死死攥着一件残破的婴孩旧襁褓，双眼布满血丝，在殿内众僧脸上疯狂梭巡，厉声尖啸逼问当年抢走婴儿的蒙面黑衣人所在。面对突如其来的闯殿之举，玄慈拨动念珠的枯指骤然一僵，殿内群雄纷纷按剑拔刀、严阵以待。叶二娘踉跄摔扑在冰冷石阶上，怀中婴儿旧物‘长命百岁’银锁滑落，在空旷大殿中砸出刺耳脆响。少林戒律威严瞬间被撕裂，一桩尘封二十四载的佛门孽案在大殿中心正式揭开序幕。",
  "事件概要": "群雄齐聚大雄宝殿，静候玄慈开堂宣谕以决武林公案。未料叶二娘癫狂闯殿、合身撞开值守武僧，怀抱残破襁褓厉声逼问夺子元凶，长命百岁银锁随之震落阶前。佛门戒律威严骤然被破，一桩尘封二十四载的孽案随之揭开帷幕。",
