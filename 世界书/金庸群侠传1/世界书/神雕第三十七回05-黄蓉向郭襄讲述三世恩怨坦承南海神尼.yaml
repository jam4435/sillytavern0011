  "事件详情": "郭襄转身要走时黄蓉已追上她，携手柔声相问。回府后黄蓉陪女儿到她房里并肩坐在床边，从头讲起郭杨两家三世恩怨：从郭啸天与杨铁心牛家村结义、指腹为婚说起，讲到杨康认贼作父卖国求荣死于非命、杨过幼时寄居桃花岛、郭芙斩断杨过手臂、杨过与小龙女在绝情谷分手等情。郭襄听得惊心动魄，怎料想得到大哥哥与自己家里竟有这深的渊源——他那只手臂竟是为姊姊斩断、小龙女离去也因姊姊误发毒针。黄蓉坦言初时以为杨过要借郭襄复仇，如今知他不会。但心中挂念一事：当初在绝情谷为安抚杨过，捏造了'南海神尼'之说——世上压根儿没这个人也没大智岛。十六年信约全凭这个谎言支撑。黄蓉担心小龙女因深爱杨过已自行了断——'珍重千万务求相聚'正是为了让杨过平安渡过十六年。劝郭襄若小龙女真的已死千万不要再见杨过——他发起狂来什么事都做得出。又讲述穆念慈对杨康一往情深终致伤心而死之事作为警示。郭襄眼皮软垂沉沉入梦——黄蓉为她盖好被子自行回房安睡。",
  "事件概要": "郭襄尽知郭杨两家旧怨与南海神尼谎言，杨过与小龙女失约的真相也不再被遮掩。",
