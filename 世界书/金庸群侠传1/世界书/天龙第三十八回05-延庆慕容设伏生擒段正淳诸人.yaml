  "事件引子": "太湖曼陀山庄花木掩映，段正淳携众女漫步庄中，四周花木暗处却杀机暗伏、隐布天罗地网。",
  "事件详情": "慕容复与段延庆彻底结盟后，为迅速夺取大理皇位与军政实权，二人紧密谋划，设下极为阴毒狠辣的陷阱与埋伏。他们将突袭目标锁定在大理镇南王段正淳及其身边的诸位红颜知己身上。段延庆与慕容复调集残存恶人势力暗中潜伏，趁段正淳携众位女子游历曼陀山庄、戒备松懈之机暴起发难。段正淳虽怀有一阳指上乘武功，但在段延庆精纯段氏武学与慕容复早有预谋的合力围攻及毒计暗算之下寡不敌众，招式渐落下风、处处受制。其身旁的阮星竹、甘宝宝、秦红棉以及曼陀山庄主人李青萝（王夫人）等一众弱女子亦纷纷被制服擒拿。段延庆与慕容复施展狠辣手法，将段正淳及诸位女眷尽数封住周身大穴，严加看押在曼陀山庄大厅之内，以此逼迫段正淳让出大理皇位并写下退位禅让诏书，曼陀山庄顿时化作杀机四伏的逼宫魔窟。",
  "事件概要": "慕容复与段延庆结盟后设伏曼陀山庄，趁段正淳携阮星竹、甘宝宝、秦红棉、李青萝游历防备松懈之际暴起发难。段正淳在二人夹攻暗算下力竭受制，众女亦相继被擒。二人以重手法封住段正淳及诸女大穴，严押大厅，逼迫段正淳交出皇位禅让诏书。",
