  "事件引子": "神掌余劲激荡四野，百年坚固青石长桥轰然碎裂坍塌。",
  "事件详情": "小镜湖青石桥上暴风骤雨愈演愈烈，狂暴的雨水倾泻在湿滑的桥面上。乔峰见大仇人如约而至，积压心头的怒火彻底爆发，怒发冲冠地朝着风雨中的来人厉声大喝，声称三十年前雁门关的血债今日当由自己亲手讨还。面对乔峰雷霆般的滔天杀气与怒喝，立于风雨之中的“段正淳”既未拔剑相向，亦未摆出任何防守抵御的架势，只是在风雨中凄然惨笑，低声回应称段某自知罪孽深重，今日甘愿领受乔帮主一掌以谢当年之罪。被复仇烈焰吞噬心智的乔峰，此时根本未能细细辨识对方嗓音与娇弱体态中的微弱异样，狂怒之中运转体内丹田磅礴真气，悍然催动十成威力的降龙十八掌，双掌齐出向前排山倒海般猛推而出。一道威猛绝伦、至刚至阳的磅礴掌力如九天神雷般轰然炸裂，狠狠贯入“段正淳”的前胸。“段正淳”身中刚猛神掌，娇躯剧烈震颤，护体真气瞬间崩溃，整个人如断线风筝般倒飞数丈，重重砸在泥泞不堪的青石桥面上，口中鲜血狂喷不止，当场遭受致命重创陷入濒死绝境。",
