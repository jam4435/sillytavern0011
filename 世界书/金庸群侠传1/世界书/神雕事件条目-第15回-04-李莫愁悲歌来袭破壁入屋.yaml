  "事件详情": "东方渐现黎明，陆无双猛抬头突见土堆外站着一个身穿黄衫的道姑——正是师父李莫愁到了。她心头大震拔剑站起，李莫愁却站着一动不动只是侧耳倾听。原来她听到程英箫声与杨过歌声相和，想起了少年时与爱侣陆展元共奏乐曲的情景，这曲'流波'便是当年常相吹奏的。二十年前音韵依旧却已是'风月无情人暗换'，李莫愁蓦地里伤痛难禁忍不住纵声大哭。这一哭大出陆无双意料之外，她平素只见师父严峻凶杀，哪有半点柔软心肠？但听她哭得愁尽惨极回肠百转。李莫愁心念一动突然纵声而歌，音调凄婉唱道：'问世间，情是何物，直教生死相许？'箫歌声本来充满愉乐之情，李莫愁此歌却词意悲切声调哀怨。程英心神微乱被歌声带走，慌忙转调却内力浅薄吹奏不出高亢之音相抗，便奔进室内放下玉箫抚动瑶琴。杨过也放喉高唱以助其势。李莫愁歌声越转凄苦，程英琴弦越提越高——铮的一声第一根'徵弦'忽然断了，接着第二根'羽弦'又自崩断。李莫愁长歌带哭第三根'宫弦'再绝。但她忌惮茅屋外土阵暗藏五行生克变化，灵机一动突然绕到左侧高歌声中双掌起处推破土壁攻了进来。陆无双大惊提剑跟进。程英料知动手也是徒然送命，当下把心一横调弦转律弹起一曲'桃夭'——华美灿烂喜气盎然。她心中暗思：'我一生孤苦，今日得在杨大哥身边而死却也不枉了。'目光斜向杨过瞧去，杨过对她微微一笑，程英心中愉乐甜美琴声更是洋洋洒洒。李莫愁脸上愁苦之色渐消，问陆无双五毒秘传下落。杨过将书扔还给她，又从怀中取出两片半边锦帕铺在床头几上。李莫愁脸色大变拂尘一挥将两块帕子卷了过去怔怔拿在手中。程英和陆无双互视一眼脸上晕红，料不到对方竟将帕子给了杨过而他却当面取了出来。茅屋中本来一团肃杀之气霎时间尽化为浓情蜜意，程英的'桃夭'之曲更是弹得缠绵欢悦。突然之间李莫愁将两片锦帕扯成四截双手急扯往空抛出如梨花乱落，喝道：'往事已矣夫复何言！'程英一惊琴弦又断一根。李莫愁厉声断喝中第五根'角弦'应声而断。琴上只剩两根弦，程英拨弦弹了两声虽不成调却仍是'桃夭'的韵律。李莫愁举起拂尘要往陆无双头顶击下，杨过笑道：'我三人今日同时而死，快快活活远胜于你孤苦寂寞的活在世间。'他左手挽住程英右手挽住陆无双将二女拉近靠在自己身上。程英温柔一笑，陆无双笑道：'是啊好傻蛋你说的一点儿不错。'三人四手相握。李莫愁心想这小子的话倒不错，但脸上带寒霜低声唱起悲歌要教三人临死伤心断肠。杨过内力较深凝神不动脸上犹带微笑，陆无双心肠刚硬不易激动，程英却已忍不住掉下泪来。李莫愁的歌声越唱越低声似游丝，只待三人同时掉泪便拂尘挥处一齐震死。",
