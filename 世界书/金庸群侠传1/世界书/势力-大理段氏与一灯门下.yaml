名称：大理段氏与一灯门下
类型：世家 / 皇族武学支系
核心地域：大理/点苍山/天龙寺
【稳定定位】大理段氏皇族、天龙寺高僧与一灯门下彼此有深厚渊源，但不是“所有人共享全部传承”的单一门派。其长期武学形象以一阳指等精纯指力和佛门修持为核心。
【组织与接触】皇族身份、寺院戒律、私人师承是不同渠道；外人认识段氏人物，不等于有资格进入天龙寺核心区域或获授家传、寺传武学。
【江湖认知】江湖中普遍知道大理段氏与南帝一脉名声，但普通人通常不清楚皇室秘闻和传承细节。典型关联人物包括一灯大师、段氏皇族与一灯弟子等，当前职务和生死服从时间线。
【动态事实规则】国主、寺内主持、弟子去留、人物关系与大理政局，以当前变量、世界事件、游戏时间和实际剧情为准。
