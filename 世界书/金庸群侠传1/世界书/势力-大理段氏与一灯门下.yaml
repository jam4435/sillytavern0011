名称：大理段氏
类型：世家 / 皇族武学
核心地域：大理/大理城/镇南王府
【稳定定位】大理段氏是皇族家传武学体系，以段氏内功、一阳指等精纯指力为核心；一灯大师及其弟子属于该家传在后世的重要支线。大理天龙寺现作为独立佛门势力处理，枯荣禅功与六脉神剑的寺传体系不得再直接等同于普通段氏门人传承。
【组织与接触】皇族身份、王府门客与一灯私人师承是不同渠道；认识段氏人物不等于拥有家传资格，得到一阳指也不自动获得天龙寺六脉神剑传承。
【江湖认知】江湖普遍知道大理段氏和南帝一脉声名，一阳指兼具点穴、制敌与疗伤之能；皇室秘闻、具体继承人与寺院秘传不属于普通公开常识。
【动态事实规则】当前国主、宗室身份、一灯门下人物去留和大理政局，以当前变量、世界事件、游戏时间和实际剧情为准。
