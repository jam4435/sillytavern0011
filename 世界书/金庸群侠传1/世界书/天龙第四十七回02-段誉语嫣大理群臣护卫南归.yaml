  "事件引子": "风流云散兄弟话别，段誉虚竹率天下群雄各踏归程。",
  "事件详情": "雁门关风波平息后，新承大统的大理宣仁帝段誉携王语嫣踏上返回西南大理的漫漫归途。段誉身着素色龙袍，仍沉浸在义兄萧峰陨落与自身身世剧变的锥心悲痛中；王语嫣历经江湖流离与诸多变故，亦心绪萧索、渴望远离红尘杀戮。华丽庄重的龙辇车驾内，段誉轻握语嫣微凉的玉手，温言宽慰道：“此去南疆山水宁静，再无江湖险恶，我必护你一世安康。”语嫣抬眸凝视段誉至诚关切的目光，低声应允，眉间郁结渐次消散。辇车之外，善阐侯高升泰、司空巴天石、大司马范骅率领精锐铁骑与仪仗宿卫分列前后，玄甲佩刀、戒备森严。随行斥候不时飞马回报关隘虚实，侍卫严密递交行军令旗与通关文牒，谨防沿途盗匪及图谋不轨之徒生事。段誉在车中展读大理呈递的抚民奏折，决意罢免苛税、休养生息，以仁爱治国。整支大理皇室队伍穿州过府、餐风宿露，沿途各省驿站恭谨接应，浩荡车驾平稳南渡长江，护送帝后二人安然向江南与大理方向行进。",
