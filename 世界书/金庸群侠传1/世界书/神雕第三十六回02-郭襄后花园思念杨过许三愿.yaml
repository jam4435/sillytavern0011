  "事件详情": "大校场上数千英雄都在想着丐帮帮主之位花落谁家，但在郭府后花园中，小郭襄却一心只想着另一件事。她坐在芍药亭中臂倚栏干，眼见红日渐渐西斜，心中反复思量：杨过曾亲口答应今日来见她一面，怎地到这时还不来？她拈着剩下的一枚金针轻轻对花影自语，既相信杨过是当世大侠最重言诺，又怕自己在他眼中只不过是个异想天开的小女孩，他说的话虽对爹爹定会信守，对自己却未必当真。想到此处不由得晕生双颊，拈着金针的手指微微发颤。与此同时大校场上的黄蓉正在反复推想：羊太傅庙中救郭襄杀尼摩星的高人究竟是谁？洪七公已故、郭靖不是、周伯通不会如此细密、一灯更无此闲情，难道竟是父亲黄药师？她叫来郭芙盘问，终于得知郭襄当日外出是为去寻神雕侠杨过。黄蓉心中一凛暗叫是过儿。仔细推算后背上陡生凉意——小龙女和杨过相约十六年后重会，今年正是第十六年。她推想杨过若苦候十六年不得相见定会深恨郭家满门，十六年的怨毒积下来绝非一剑杀了郭芙便能罢休。她想到杨过要诱骗郭襄让她倾心相从然后折磨得她求生不能求死不得，连日积在心头的疑窦尽数而解。黄蓉匆匆赶回府中，从假山石后绕到芍药亭边，伏在假山石后偷听女儿的心事。郭襄对着天空诉说三个心愿——第一个盼父母率领群雄杀退蒙古兵保襄阳百姓太平，第二个盼爹娘身子安泰百年长寿事事如意称心，第三个盼神雕大侠杨过和他夫人小龙女早日团聚平安喜乐。黄蓉听到前两个心愿眼眶微湿疼爱之情油然而增，第三个心愿却万万料想不及——女儿竟已知道小龙女之事，还暗中为杨过和妻子祷祝。她转念一想更觉杨过用心深沉：越是说不忘旧情越显深情可敬，襄儿越会对他倾心。",
