  "事件引子": "掌力破浪惊退邪祟，乔峰怒斥三十六洞妖邪妖人。",
  "事件详情": "隐坐暗处的乔峰目睹丁春秋连毙数人、以剧毒邪术欺凌后辈，胸中凛然正气与豪迈血性喷薄爆发。乔峰怒目圆睁，抬手掀飞竹斗笠，昂藏挺立如巍峨天神，舌绽春雷厉声暴喝：“星宿老怪，休得在中原武林逞凶作恶！”声浪滚滚如雷，震得客栈瓦砾簌簌抖落。话音未落，乔峰拔地凌空而起，丹田内纯阳内劲狂涌运转，施展出名震天下的“降龙十八掌”。只见他半空中双臂盘旋、右掌借下坠之势悍然拍出一式“亢龙有悔”，掌风裹挟苍茫龙吟，化作摧枯拉朽的雄浑气浪泰山压顶般狂轰而下！丁春秋骇然变色，慌乱中再难变招施毒，只得强提十成化功内力拼死举双掌迎击。两股天下绝顶内劲凌空轰然激撞，爆发震耳欲聋的金石巨响！乔峰至刚至纯的阳刚掌力瞬间轰碎阴邪护体气罩，丁春秋如遭重锤轰击，脏腑剧震、仰天狂喷鲜血倒退数丈，后背狠狠撞裂承重梁柱。其手中那柄象征身份的晶莹羽扇亦被刚猛掌风碾作漫天齑粉，老怪面如白纸、受创极深。",
