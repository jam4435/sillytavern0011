  "事件详情": "僵持之际，完颜洪烈派出黄河四鬼上山强攻。郭靖挺身而出，以一敌四。他先以越女剑法刺伤大师兄沈青刚，随后在打斗中夺过二师兄吴青烈的长枪，并活用南山刀法破枪之术，使其兵刃脱手。接着，他用呼延枪法对战使双斧的钱青健，并用巧计断其兵刃，将其踢飞。最后，在四人围攻之下，郭靖虽腿部中鞭受伤，却临危不乱，卧地使出韩宝驹所传的金龙鞭法，顽强防守。整场战斗，郭靖将六位师父所授的剑、刀、枪、鞭法及空手搏击之术融会贯通，在生死实战中得到了极大的锻炼和提升，直至六怪赶到解围。此战不仅展现了他惊人的武学天赋和实战能力，也赢得了战场上所有人的尊重。",
  "事件概要": "郭靖经此恶战融会诸师所学，实战能力与战场名声都因此明显跃升。",
