名称：少林派
类型：宗门
核心地域：大宋/少室山/少林寺
【稳定定位】禅武合一的大型佛门宗派，门规、戒律、僧职与武学传承层级明确；少林武学门类广，但“天下武功出少林”不意味着所有僧人都会七十二绝技。
【组织与接触】寺院有公开礼佛区域、僧众生活区域与传承核心区域之别；外人入寺、拜师、查阅秘籍或接触高阶武学都需要身份与剧情依据。
【江湖认知】江湖中普遍知道少林是武林重镇，普通百姓也大多听过少林寺名号，但不应自动知道藏经、戒律院、高手身份或秘传细节。典型关联人物包括玄慈、玄苦、扫地僧等。
【动态事实规则】方丈、首座、僧众生死、寺内派系、与其他势力的现实关系，以当前变量、世界事件、游戏时间和实际剧情为准。
