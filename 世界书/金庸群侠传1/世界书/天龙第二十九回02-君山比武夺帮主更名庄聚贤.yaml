  "事件详情": "岳阳君山轩辕台前，千百名丐帮帮众与各路分舵好手列阵肃立，旌旗在烈风中猎猎作响。全冠清依计在台上高声挑起帮主之位的争端，头戴冰冷狰狞生铁面具的游坦之奉命昂然登台夺位。宋、吴两位九袋长老怒斥其来历不明乃妖邪之辈，当即拔出单刀与八棱钢杖，呼啸着合力夹攻而来。游坦之身形如磐石般纹丝不动，体内《易筋经》真气轰然流转，反手催动“冰蚕神掌”向前悍然推出。刹那间狂暴无匹的极寒阴劲化作肉眼可见的惨白风暴，宋、吴两位长老的兵刃尚在半空便被极寒真气凝结出一层厚重坚冰，至阴寒毒顺着兵刃直透二人奇经八脉。两人齐声惨哼倒飞数丈，重重砸在石台上，大口喷出夹杂冰碴的紫黑冻血，浑身经脉冻结动弹不得。全场帮众见此惊世骇俗的魔功无不骇然失色、噤若寒蝉。全冠清见火候已到，立刻在台下振臂高呼，煽动全帮拥戴强者。为了彻底斩断昔日聚贤庄惨案的过往并隐匿真实身份，游坦之当众自立化名为“庄聚贤”，并顺理成章接过了象征帮主权威的竹节打狗棒。四大长老重伤溃败，丐帮至高大权就此落入全冠清操控的傀儡手中。",
