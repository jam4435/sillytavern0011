名称：全真教
类型：宗门
核心地域：大宋/终南山/重阳宫
【稳定定位】玄门正宗，以吐纳筑基、剑掌并修、道学修持和多人阵法见长。门规、师承与辈分明确，核心传承不会因“知道全真教”而自动对外公开。
【组织与接触】外人通常只能接触公开宫观、普通弟子与公开事务；进入核心区域、拜师或接触高阶传承需要符合剧情中的身份与许可。全真门人并非共享全部秘密，也不必对任何同门消息全知。
【江湖认知】江湖中普遍知道全真教是终南山道门大派；普通百姓更可能只知道重阳宫和道士名声。典型关联人物包括马钰、丘处机、王处一、周伯通等，这些关联不表示人物当前一定在世、在位或在场。
【动态事实规则】当前掌教、人物生死、门内矛盾、对外盟敌与驻地控制权，以当前变量、世界事件、游戏时间和实际剧情为准。
