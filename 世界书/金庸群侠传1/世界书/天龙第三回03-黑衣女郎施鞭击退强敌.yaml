  "事件引子": "长鞭如蛇震飞单刀，强敌溃逃锁定书生。",
  "事件详情": "段誉突如其来的高声喊话瞬间打破了后院胶着的战局。围攻的四名汉子闻声大惊，其中一名持刀汉子分神转头怒斥段誉，喝骂其为多管闲事的酸书生。这稍纵即逝的破绽立刻被黑衣女郎敏锐捕捉，她娇叱一声骤然发难，手中软鞭如灵蛇吐信般疾探而出，极为精准地卷住了该汉子手中的单刀。女郎顺势发劲一带，强劲的内力顿时将那柄单刀震脱脱手、飞向半空。未等敌手反应，女郎手腕再度灵动一抖，鞭稍若毒蛇反噬般呼啸破空，重重抽打在身旁另一名持斧汉子的肩头。伴随着一声凄厉惨叫，中鞭汉子重伤翻倒在地。余下两名汉子见己方阵脚大乱且同伴负伤，心生怯意不敢恋战，互相使了个眼色后虚晃一招，慌忙搀扶起倒地的伤者夺路而逃，转瞬便逃得无影无踪。黑衣女郎借此一举击溃合围，她轻勒缰绳使神骏的黑马昂首长嘶，随即调转马头，将冰冷戒备的目光锁定在段誉身上。",
