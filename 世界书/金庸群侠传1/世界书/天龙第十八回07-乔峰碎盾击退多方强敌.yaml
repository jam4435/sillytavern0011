  "事件引子": "聚贤庄大厅内血气弥漫、杀声震天，游氏双雄携精钢百炼盾合围而至，各路宿老趁势夹击。",
  "事件详情": "在大厅混战的白热化阶段，聚贤庄庄主游氏双雄（游骥、游驹）眼见同道死伤，当即双双挥舞成名兵刃精钢百炼盾，借着精熟的合击招法，携万钧之势从左右两侧朝乔峰狠辣夹击而来；与此同时，江湖成名宿老赵钱孙以及谭公、谭婆等高手亦看准破绽，各展凌厉杀招联手从侧翼展开围攻。面对这等险恶的前后夹击，乔峰身形不退反进，体内神功运转至极致，迎着呼啸合拢的厚重钢盾悍然轰出一记威猛无俦的绝命重掌。只听得半空中爆发出轰然巨响，坚硬无比的精钢百炼盾竟被乔峰的雄浑掌力硬生生震得四分五裂、化作碎铁！游氏双雄眼见家传重宝碎裂、平生威名毁于一旦，极度的羞愤与绝望之下当场拔刃自刎身亡。乔峰掌力余威四震，紧接着又将联手扑来的赵钱孙、谭公与谭婆等人震得倒飞数丈、当场口喷鲜血受创败退。此番交锋不仅直接导致游氏双雄自尽毙命、百炼盾毁，亦重创了数名围攻的主力高手。",
  "事件概要": "面对游氏双雄双盾合璧夹击与赵钱孙、谭公谭婆侧翼袭杀，乔峰提运极致神功悍然轰出雄浑重掌，硬生生震碎家传精钢百炼盾。游氏双雄极度羞愤绝望之下拔刃自刎，侧翼夹攻的群雄亦被余劲震得吐血倒飞受创败退。",
