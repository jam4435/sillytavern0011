  "事件引子": "主殿前石阶之下兵戈林立，群豪伤愈肃穆齐列，天山极顶罡风呼啸，四野回荡着庄严立誓之声。",
  "事件详情": "三十六洞与七十二岛门人的伤势彻底痊愈之后，原本亦正亦邪、桀骜难驯的万仙群魔齐聚于缥缈峰灵鹫宫主殿之前。这批昔年饱受生死符酷刑折磨与天山童姥严厉逼迫的草莽豪杰，如今不仅彻底解除了生死符之苦，更蒙虚竹与李清露夫妇赐予珍贵圣药拔除重伤，人人心中满怀感激涕零之情。大殿阶前，乌老大等一众洞主岛主率领门下数千弟子齐齐跪倒在地，高举兵刃指天立誓，声震九霄，庄严宣誓对虚竹夫妇誓死效忠、永不背叛。虚竹站在殿前石阶上，双手合十温厚回礼，恳切规劝群豪自此洗心革面、恪守侠义之道；李清露亦端立在侧，从容宽慰众人。群豪听闻教诲无不凛然奉命，齐声呼应。以往因恐惧而生出的反叛仇怨在仁德感召下化为坚如磐石的忠诚，灵鹫宫不仅消除了内乱分崩的隐患，更将三十六洞、七十二岛庞大势力彻底凝为一体。自此，天山灵鹫宫在西域武林中威名大震，成为声威显赫、庇佑一方安宁的江湖圣地。",
  "事件概要": "三十六洞与七十二岛群豪沉疴尽愈，感念拔除生死符及赠药救命之恩，由乌老大率众齐跪殿前指天立誓誓死效忠。虚竹与李清露阶前温厚抚勉、劝导众人弃恶从善恪守侠道，彻底化解仇怨收归各部人心。",
