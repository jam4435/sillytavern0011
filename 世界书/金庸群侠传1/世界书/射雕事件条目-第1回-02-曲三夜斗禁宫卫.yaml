  "事件详情": "郭杨二人深夜在村西树林狩猎，无意中撞见一桩惊人的夜斗。他们发现村头酒店的跛子曲三，竟是一位身怀绝顶轻功的高手。三名武官装束的人追杀曲三，反被他用拐杖和铁八卦暗器接连击杀。曲三早已察觉郭杨二人的存在，并在事后坦然现身。他不仅道破了两人的身世来历——郭啸天是梁山好汉郭盛之后，杨铁心是名将杨再兴之后，还透露自己是因潜入皇宫盗宝而被追杀。曲三将从皇宫盗来的金壶、金杯赠予二人，并言及所盗之物中还有道君皇帝的字画。这番经历让郭杨二人对平日里深藏不露的跛子曲三敬畏不已，也对江湖的复杂和奇人异士有了更深刻的认识。",
  "事件概要": "曲三显露江湖身份并赠出宫中宝物，郭杨二人由此知晓自身门第来历，也开始敬畏江湖世界。",
