  "事件引子": "洛阳马宅深宵阒寂，瓦垄间寒意侵肌，屋内隐隐传来颤声长叹与娇媚低语。",
  "事件详情": "伏在屋顶瓦垄间的乔峰屏息凝神，运起醇厚内力倾听屋内密谈，白世镜与康敏的对话愈发令人毛骨悚然。白世镜不堪内心负罪感的酷烈煎熬，重重长叹一声，瘫坐在椅中，颤声招认了自己当年如何被康敏美色所惑，暗中在烈酒中下入十香迷魂散麻翻副帮主马大元，随后再由自己亲自施展锁喉功狠下杀手、将其残忍勒毙灭口的全部弑兄罪行。然而软榻上的康敏闻言非但毫无悔恨之意，反倒掩口娇笑不止，神态极为得意猖狂。她洋洋自得地向白世镜炫耀起自己的连环毒计：从如何巧妙利用乔峰契丹身世的隐秘信件，到如何亲手伪造带头大哥的假字条与汪剑通遗令，步步为营诱导乔峰误将大理镇南王段正淳当成杀母仇敌，从而借乔峰之手除掉负心汉段正淳。屋顶上的乔峰听到此处如遭五雷轰顶，脑海中轰然炸响，浑身血液几乎瞬间凝固。他双拳捏得咔咔作响，指甲深深掐入掌心皮肉，这才痛彻心扉地惊觉，自己与至爱阿朱从头至尾都被这毒妇肆意玩弄于股掌之上，竟在青石桥暴雨之夜亲手打死了替父受过的阿朱。马大元惨死与段正淳被诬陷的真相彻底大白闭环，乔峰胸中翻江倒海，滔天杀意与撕心裂肺的剧痛同时狂涌。",
  "事件概要": "白世镜不堪煎熬招认受色诱勒毙马大元之罪，康敏更猖狂炫耀伪造信令借刀杀段正淳的毒计。屋顶窃听的乔峰如遭雷击，惊觉中计致使自己亲手打死替父受过的至爱阿朱，悲愤绝伦、杀意狂涌，马案沉冤自此彻底大白。",
