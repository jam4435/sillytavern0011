  "事件引子": "后山险径曲折幽暗，沉重石门轰然推开，显露出空旷阴凉、微光透照的神秘石室。",
  "事件详情": "苏星河在珍珑棋局解开后，依约引领破局的少林僧人虚竹走向后山幽僻险峻的秘境。两人穿过曲折昏暗的山道，来到一处隐秘的石洞前。苏星河神色恭敬而凝重，伸手推开沉重闭锁的石门，示意虚竹独自入内觐见。虚竹怀着忐忑不安的心情迈入昏暗空旷的石室，借着微弱的光线抬眼望去，只见石室正中央竟用粗重的绳索悬吊着一名身形枯槁却气度非凡的老者。那老者虽然白发苍苍、长须拂胸，年纪已近百岁高龄，但面容却如冠玉般白皙俊朗，眉目间神采飞扬、风度闲雅超俗，正是隐世多年的逍遥派掌门人无崖子。三十年前，无崖子惨遭孽徒丁春秋暗算推落万丈绝壁摔断双腿，三十年来只得隐居在这幽暗石洞内苟延残喘，苦候大弟子苏星河设珍珑棋局寻觅关门传人。虚竹合十躬身向这位悬空老者行礼，二人正式相面，开启了门派宿命传承的会面。",
  "事件概要": "苏星河依诺引领破局的虚竹穿行山道，推开闭锁石门示意其独自入内。虚竹忐忑步入幽暗石室，得见以粗绳悬空三十载、形容枯槁却面如冠玉的逍遥派掌门无崖子。虚竹合十躬身行礼，二人相面开启传承序幕。",
