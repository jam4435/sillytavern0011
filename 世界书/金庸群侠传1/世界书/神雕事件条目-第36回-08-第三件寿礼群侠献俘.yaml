  "事件引子": "你听说何师我正得意洋洋要邀人再斗，忽听得校场四周五百头猛兽齐声怒吼如山崩地裂——校场入口处火光骤亮，八位当世武林名宿高举火炬而来，神雕侠的第三件礼物终于到了。",
