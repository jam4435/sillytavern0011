  "事件详情": "何师我站到台口抱拳邀人再斗，'台'字刚出口猛听得史伯威啊的一声大叫——围在大校场四周的五百头猛兽忽地站起齐声吼叫，单是一头雄狮或猛虎纵声而吼已有难当之威，何况五百头猛兽合声长啸？这声音当真如山崩地裂一般，但见大校场上沙尘翻腾黄雾冲天，群雄身前的酒杯菜碗被巨声震得互相碰撞叮叮不绝。群兽吼叫声中西山一窟鬼和史氏兄弟十五人同时跃到台边抽出兵刃团团将高台四面围住。忽见校场入口处火光明亮，八个人高举火炬朗声说道神雕侠祝贺郭二姑娘芳辰奉上第三件礼物。八人说毕便即足不点地般进场而来转眼间到郭襄身前，人人露了一手上乘轻功。中间四人各伸一手合抓着一只大布袋。八人躬身向郭襄行礼自报姓名——群雄一听无不骇然：当先一个老和尚竟是五台山佛光寺方丈昙华大师素与少林寺方丈天鸣禅师齐名，其余赵老爵爷、聋哑头陀、昆仑派掌门青灵子等无一不是武林中久享盛名的前辈名宿。郭襄却不知这些人有多大名头，起身还礼笑靥如花说道有劳各位伯伯叔叔了那是甚么好玩的物事。提着布袋的四人手臂同时向后拉扯喀喇一声响布袋裂成四块——袋中滚出一个光头和尚来。",
  "事件概要": "群侠将达尔巴押至校场献作第三件寿礼，霍都旧案与打狗棒下落被当众翻出的契机已经形成。",
