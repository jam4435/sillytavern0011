  "事件引子": "幽暗内室红烛摇曳，软榻幽香浮动，榻上美妇媚态毕露，试探之声低回阴鸷。",
  "事件详情": "面对暗夜造访的“白世镜”，心如蛇蝎的康敏丝毫未察觉眼前之人乃是阿朱假扮。当年洛阳百花会中，乔峰对她绝色容貌的不屑一顾，如毒刺般深扎心底，令她由爱生恨、近乎癫狂。她不仅毒杀亲夫马大元、借汪帮主遗书揭露乔峰契丹血统，此刻更欲借刀杀人。只见康敏眼波流转，纤指轻抚鬓角，带着凄艳的媚笑斜倚锦榻，将身子凑近“白世镜”，吐气如兰却字字如刀。她故作神秘与委屈，压低嗓音断言当年号令群雄血洗雁门关、地位尊崇无比的“带头大哥”，正是大理国镇南王段正淳。为使假局天衣无缝，康敏绘声绘色地编造段正淳当年与汪剑通往来密信、指挥若定的虚假细节，甚至冷笑着从妆匣中取出当年段正淳留下的旧信物掷于案前，言之凿凿地宣称段正淳伪善暴虐。阿朱屏息听闻，惊骇得指甲深深掐入掌心。康敏这一番颠倒黑白的恶毒栽赃，既欲借乔峰神勇诛杀抛弃自己的负心情郎，又欲引大理段氏倾国之力剿杀乔峰，一石二鸟的致命罗网就此严密铺就。",
  "事件概要": "康敏因昔日洛阳百花会之怨记恨乔峰，竟将前来刺探的阿朱误认作白世镜，借机向其构陷昔日旧情人段正淳为雁门关带头大哥，更掷出旧信物佐证。阿朱闻言惊骇万分，一场欲借乔峰诛杀段正淳并引大理段氏倾国之力剿杀乔峰的借刀杀人毒计就此织就。",
