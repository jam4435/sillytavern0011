  "事件引子": "菩提院佛殿内帷幔重叠、青灯掩映，殿外搜捕声喧嚣，巨幅铜镜后隐约传出一丝微弱呻吟。",
  "事件详情": "乔峰潜入少林寺后山菩提院佛殿之中屏息凝神，警惕戒备着殿外纷乱的火把与喧嚣搜捕人声。为了不被寺内巡查高僧察觉，他借殿内一面巨大铜镜与厚重帷幔掩藏身形。屏息隐蔽之际，乔峰忽闻铜镜背面传来细微游丝般的痛苦呻吟。他心中一惊，闪身转至镜后探查，赫然撞见一名身穿灰色缁衣的少林小僧蜷缩在阴影血泊中。乔峰伸手扣住其脉门，入手温软纤细，定睛细看才惊觉对方竟是易容假扮僧人的慕容氏俏婢阿朱。此时阿朱面如金纸、双唇青紫，嘴角血沫不断溢出。阿朱费力睁眼认出乔峰，惨然苦笑道：“乔大爷……阿朱偷了这经书……却中了玄难大师一记大金刚拳……”说着从怀中摸出一卷丝绢包裹的少林至宝《易筋经》神功秘籍。乔峰探知阿朱被大金刚拳至刚至猛的拳劲正面重创，周身经脉尽数震断、五脏俱损，已陷入濒死绝境；面对为盗经垂死的故人阿朱，乔峰侠义与怜惜之情油然而生，决意不顾个人生死也要保她性命。阿朱伤重濒危命悬一线，盗得的至高秘籍《易筋经》滑落移交至身侧；乔峰当即双掌按住阿朱背心大穴，源源不断输送深厚内力护住其心脉仅存的一线生机。",
  "事件概要": "乔峰避入菩提院佛殿隐蔽，在巨幅铜镜后惊见假扮小僧、重伤濒死的阿朱。阿朱道出盗取《易筋经》遭玄难大金刚拳重创的经过，将薄绢秘籍滑落相托。眼见故人命悬一线，乔峰慨然不顾自身安危，双掌按其背心全力输送纯阳内力护住一线生机。",
