  "事件引子": "枯井底深情相许，王语嫣认清慕容复真容执手许终身。",
  "事件详情": "鸠摩智离去后，冰冷幽暗、泥水没膝的枯井深处重归死寂，只剩下满身污泥的段誉与王语嫣二人相依独处。经历方才生死悬于一线的剧烈冲击，王语嫣心神巨震，神情凄楚迷茫。她回想起此前在枯井边，表哥慕容复为了争当西夏驸马、图谋复国霸业，竟对自己痛下杀手推入深井，而段誉却毫不犹豫纵身跃下舍命相救，更在鸠摩智发狂时用血肉之躯死死护住自己。这一冷一热的强烈对比，彻底粉碎了她自幼对表哥的盲目痴情与崇拜幻梦。王语嫣凝视着眼前狼狈不堪却满眼关切赤诚的段誉，泪水如断线珍珠般滚滚滑落，哽咽颤声道：“段公子，我表哥待我如此薄情狠毒，你……你为何却待我这般好？”段誉急忙笨拙地替她擦拭泪水，真诚剖白愿为她粉身碎骨。多年痛苦执念瞬间冰消瓦解，王语嫣毅然决然斩断旧情，主动扑入段誉怀中依偎相许。段誉惊喜交集，紧紧搂住心爱姑娘，二人在污泥中定下白首之约，两情相悦终成眷属。",
