  "事件引子": "雁门关外狼藉满地，残敌溃散逃尽，劫后余生的宋民自绝望惊惶中缓缓回神。",
  "事件详情": "随着凶恶残暴的辽兵溃散奔逃，雁门关前的血腥厮杀终于归于平息。劫后余生的数百名大宋汉人边民满身血污泥泞，从极度的恐惧与绝望之中渐渐清醒过来。众人深知若非眼前这位身形魁伟、神威凛凛的壮士孤身犯险挺身相救，所有人都早已沦为契丹骑兵弯刀下的冤魂。大难不死的宋人百姓热泪盈眶，老弱妇孺纷纷抛下残破的包袱行囊，怀着无以复加的感激与崇敬之情，齐刷刷跪倒在染血的黄土地上。无数难民朝着乔峰连连叩头谢恩，额头撞击泥土之声此起彼伏。百姓们激动万分，纷纷放声高呼，盛赞乔峰是救苦救难的“青天大老爷”，更是顶天立地、庇护同胞的“汉家大英雄”。一声声发自肺腑的赞颂与欢呼回荡在雁门关前的苍茫群山之间，数百名被救百姓将乔峰视作至高无上的族群守护神与汉家脊梁，场面感人至深却又充满了命运的讽刺，形成了宋民集体叩谢汉家英雄的震撼场面。",
  "事件概要": "辽兵溃退，关道血腥厮杀初歇。劫后余生的数百宋民自极度恐慌中苏醒，感念救命大恩，老弱妇孺纷纷抛下包裹跪倒泥泞之中，朝着乔峰连连磕头，齐声泣拜高呼其为庇护同胞的汉家大英雄。",
