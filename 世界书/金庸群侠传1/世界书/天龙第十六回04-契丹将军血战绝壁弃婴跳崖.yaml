  "事件引子": "契丹将军绝壁格杀十七高手，刻血书抛幼子跳崖殉情。",
  "事件详情": "目睹至爱妻子惨死在雁门关下，契丹贵族将军悲痛欲绝、怒发冲冠，瞬间爆发出神勇无敌的惊人战力。在狭窄险峻的绝壁险道上，该将军赤手空拳或夺刃搏杀，以一人之力力战带头大哥、汪剑通、智光等二十一名中原顶尖武林高手。其招式凌厉狂暴、威不可当，二十一名高手合力围攻亦难撄其锋芒，混战之中竟被该将军当场击毙格杀十七人，余者皆带伤败退，死伤惨烈至极。血战平息后，将军万念俱灰，以指力在冰冷石壁上愤然刻下绝笔血书。在万丈深渊边缘，该将军不忍断绝骨肉血脉，在纵身一跃的生死刹那，奋力将尚在襁褓中的初生幼子抛回崖顶安全之处；随即，他紧紧抱住亡妻冰冷的尸身，义无反顾地跃入深不见底的万丈悬崖自尽殉情。十七名中原豪杰殒命关下，将军坠崖殉难，唯余无辜的契丹幼子在雁门关绝壁顶端啼哭。",
  "事件概要": "起因：契丹将军目睹爱妻惨死悲痛欲绝爆发神勇战力，赤手空拳与带头大哥等二十一名高手绝壁死斗。发展：将军以一人之力格杀中原高手十七人，血战平息后万念俱灰在石壁上刻下血书。结果：将军于万丈深渊边缘奋力将襁褓幼子抛回崖顶，抱亡妻尸身纵身跳崖殉情唯余弃婴啼哭。",
