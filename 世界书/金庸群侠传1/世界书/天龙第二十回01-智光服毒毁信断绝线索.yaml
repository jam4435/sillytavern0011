  "事件引子": "智光服毒自绝指力毁信末署名，线索断绝乔峰手握残笺。",
  "事件详情": "乔峰与阿朱为追查雁门关伏击惨案的首恶“带头大哥”，一路风尘仆仆赶赴卫辉禅院。二人怀揣一线希望疾步推开紧闭的禅房木门，迎面只见檀香幽微，智光大师正端坐于蒲团之上，面泛死灰，嘴角已然溢出一缕黑血。乔峰见状大惊失色，抢步上前双膝跪地，双掌骤然发力抵住大师后背灵台穴，浩瀚浑厚的纯阳内力源源不断灌入，焦急疾呼：“大师何苦服毒自绝？当年带头之人究竟是谁，还请明示！”然而智光大师早已抱定舍身殉道之心，惨然一笑，体内逆运残存真气抗拒乔峰的救治，断断续续合十道：“冤冤相报，何时能了……老衲绝不能让你陷武林于浩劫。”在生机断绝的最后关头，智光大师猛然凝起丹田残存的少林指力，枯瘦的食指决绝地按向案头泛黄的陈年书信末尾，指力过处，生生将“带头大哥”的亲笔署名挫磨成齑粉飞灰。伴随最后一缕气息咽下，智光大师垂首端坐圆寂。乔峰收掌颓然，掌中只余半截字迹残缺、无从辨认的破损信笺，不仅未能救下高僧，唯一的活口线索亦彻底化为泡影，两人悲痛之余深陷仇怨难解的死局。",
  "事件概要": "起因：乔峰阿朱赶赴卫辉禅院追查带头大哥，推门见智光大师端坐蒲团面泛死灰嘴角溢出黑血。发展：乔峰灌入纯阳内力施救，智光抱舍身殉道之心逆运真气抗拒，生机断绝前运指力将信末署名挫成齑粉。结果：智光大师垂首端坐圆寂，掌中仅余残缺破损信笺线索中断，乔峰阿朱深陷死局。",
