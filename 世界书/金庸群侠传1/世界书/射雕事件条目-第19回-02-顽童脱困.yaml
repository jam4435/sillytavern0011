  "事件详情": "欧阳锋在临别之际，故意言语相激，声称熟习《九阴真经》的周伯通武功已在众人之上。黄药师心高气傲，按捺不住，终吐露已将周伯通囚禁于桃花岛十五年的事实。为证所言非虚，他带领众人前往周伯通所居山洞。不料周伯通早已脱困，并在洞内外布下连环陷阱。黄药师一时不察，先是踩入粪坑，随后又被洞顶吊下的瓦罐淋了一头臭尿，狼狈不堪。欧阳锋亦未能幸免。周伯通在洞壁留下刻字，嘲讽黄药师。黄药师察觉尿有微温，判断周伯通离去不久，立刻率众追赶。周伯通因在郭靖走后顿悟，心中块垒尽去，本欲飘然离岛，但又念及郭靖安危，决定带其一同离开。他在无意中发现自己竟已在不自觉间练成了《九阴真经》上的武功，大惊失色，为遵守师兄遗训，遂将自己双手缚住，决心不再与人动武。",
