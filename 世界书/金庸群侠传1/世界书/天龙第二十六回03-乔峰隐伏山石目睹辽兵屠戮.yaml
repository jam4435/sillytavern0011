  "事件引子": "荒岗夜宿忽闻惨呼，乔峰目睹契丹游骑残杀越界汉民。",
  "事件详情": "正当乔峰沉浸在绝壁抚痕的深沉哀痛与感怀之中时，关口要道方向骤然传来一阵凄厉刺耳的惨呼呼救之声与凶残杂乱的军士呼喝，瞬间打破了关隘的死寂。乔峰警觉骤起，当即收敛悲容，施展轻功闪身隐蔽在关前厚重的巨岩山石之后，凝神向关隘下方望去。只见大批凶悍残暴的大辽契丹骑兵正纵马肆虐，手挥雪亮钢刀，在关口大肆围追、劫掠并残酷屠杀数百名毫无抵抗能力的大宋汉人边民。那些宋人百姓衣衫褴褛，老弱妇孺哭喊震天，在泥泞黄土上绝望地奔逃挣扎；而这群辽兵非但毫无怜悯，反而纵声狂笑，策马在人群中横冲直撞、挥刀肆意劈砍，刀锋过处肢体横飞，滚烫的鲜血瞬间染红了关前大片的荒芜黄土。乔峰在暗处目睹同胞百姓横遭屠戮、尸横遍野的惨烈景象，心头如同重锤轰击。大宋难民死伤惨重、危在旦夕，辽兵残暴嗜杀的行径让关前化作一片人间炼狱，这突如其来的血腥惨案彻底点燃了乔峰胸中的滔天怒火。",
  "事件概要": "乔峰夜宿乱石岗忽闻啼哭厮杀（起因）；见数名契丹骑兵肆意砍杀逃难汉民（发展）；心头震怒决意出手惩恶（结果）。",
