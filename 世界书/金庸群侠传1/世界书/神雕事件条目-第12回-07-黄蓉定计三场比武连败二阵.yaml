  "事件详情": "鲁有脚见黄蓉身子不适，自告奋勇出战霍都。陆家庄家丁空出比武场地。霍都扇子挥动一阵劲风袭面，风中竟带幽香——鲁有脚侧风避开。霍都折扇化为点穴笔点向胁下，鲁有脚以打狗棒法缠字诀一绊一挑，巧夺先机击中霍都脚胫——群雄喝彩'打中狗儿啦'。霍都面红过耳，左手挥掌全力应付。鲁有脚棒法毕竟未学全，十余招后破绽渐露——虽使'斜打狗背'击中霍都左颊，却使得过重失了轻妙之致，被霍都抓住竹棒。霍都随即一掌正中鲁有脚胸口，又横扫一腿踢断其脚骨——鲁有脚喷血摔下。霍都双手横持打狗棒洋洋得意正要折断，黄蓉以'獒口夺杖'手法一闪之间轻轻巧巧夺回。霍都虽败却说不算，又言明比武三场定盟主。武氏兄弟不等号令双剑齐出斗霍都，却数招间便被他断剑击败。霍都见二人摆出降龙十八掌和一阳指的架子不敢轻视，客气请退。武氏兄弟含羞退下，郭芙挺身要三人齐上被郭靖喝止。霍都手握折扇说要正经较量三场，郭靖答应。黄蓉忽道有了必胜之策——引用孙膑赛马之计：'今以君之下驷与彼上驷，取君上驷与彼中驷，取君中驷与彼下驷'。郭靖登时领悟。",
