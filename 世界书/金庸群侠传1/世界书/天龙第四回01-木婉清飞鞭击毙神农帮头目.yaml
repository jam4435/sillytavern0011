  "事件引子": "黑衣横刀阻山道，飞鞭断刃毙首领。",
  "事件详情": "木婉清与段誉共乘快如闪电的黑玫瑰马，沿险峻狭窄的无量山道向后山风驰电掣般疾驰，两侧皆是万丈深渊。行进一个多时辰后，前方山道上突现数名神农帮黑衣大汉横刀拦路，首领厉声喝阻，声称神农帮在此办事并扬言擅闯者死。木婉清性格冷傲狠辣，救人心切之下杀意顿生。她冷笑一声，足尖在马镫上轻灵一点，身形如黑燕般凌空拔地而起，手中软鞭霍然抽出，破空激起尖锐厉啸。拦路头目横刀硬架格挡，只听铮的一声脆响，其手中单刀被长鞭强横内力当场绞成两截。木婉清手腕顺势微抖，鞭稍宛若毒龙探爪，迅疾无伦地精准点中该头目咽喉。头目闷哼一声登时毙命倒地，残存帮众见首领一招被杀，吓得魂飞魄散、四散溃逃。木婉清轻盈落回马背，娇叱策马穿过阻碍继续前冲。此役木婉清以飞鞭断刀杀敌立威，神农帮头目身死、单刀损毁，溃兵四散，二人坐骑未受延阻，顺利突破第一道山道封锁。",
  "事件概要": "起因：二人共乘黑玫瑰疾驰无量山道，前方突现数名神农帮大汉横刀拦路扬言擅闯者死。发展：木婉清凌空飞掠运鞭将头目单刀绞成两截，顺势精准点中其咽喉致其毙命。结果：残兵魂飞魄散四散溃逃，木婉清策马穿过阻碍，顺利突破首道封锁。",
