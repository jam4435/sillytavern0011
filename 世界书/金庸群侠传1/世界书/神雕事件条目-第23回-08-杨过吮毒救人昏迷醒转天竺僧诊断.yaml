  "事件引子": "荒谷中，武氏兄弟中了冰魄银针，呼吸低沉、昏迷不醒。武三通情急之下俯身欲替儿子吮出毒血，杨过却忽然伸手将他点住……",
  "事件详情": "杨过拔去武氏兄弟身上银针后见二人呼吸低沉昏迷不醒，黯然摇头表示无法解毒。武三通父子情深心如刀绞，突然扑到武修文身上伸嘴往他伤口吮吸。杨过大惊点中其大椎穴将他定住，心念一动：'再过五日情花剧毒便发，在这世上多活五日少活五日实在没甚分别。'于是伸嘴轮流给武修文武敦儒吮吸毒质——苦味渐转咸味头脑却越觉晕眩，眼前一黑登时晕倒在地。此后良久没有知觉，也不知过了多少时候才睁开眼来，只见武三通满脸喜色跪倒磕头感激不尽，又见一个颜面黝黑高鼻深目白发鬈曲的老者——正是武三通的天竺国师叔。杨过这才知自己未死，身处襄阳旧居之中，已是第七日。武三通告知是朱子柳受小龙女之托送汗血宝马到荒谷才发现四人倒地将他们救回。杨过心头一喜以为天竺神僧给自己服了灵丹妙药，但想到小龙女不知何在心头一荡胸口如被大铁锤猛击——半枚绝情丹药性已过情花剧毒发作剧痛难当满头大汗。天竺僧按脉细问后大感惊异——情花乃上古异卉佛典所言早已绝种，中土竟尚有留存。他闭目良久后推断：杨过为二武吮吸冰魄银针之毒本应立时毙命却至今健在，而情花之毒到期也未致命——莫非以毒攻毒两般剧毒相侵相克反得善果？天竺僧说要亲赴绝情谷验看情花之毒性方能配制解药，临行叮嘱杨过在此之前务须不动丝毫情思绮念，否则疼痛一次比一次厉害，伤了真元便无法相救。朱子柳与武三通争相要护送天竺僧同去绝情谷求取解药。",
  "事件概要": "杨过舍身吮毒救活武氏兄弟，情花毒因以毒攻毒暂缓，天竺僧也因此南下绝情谷寻解方。",
