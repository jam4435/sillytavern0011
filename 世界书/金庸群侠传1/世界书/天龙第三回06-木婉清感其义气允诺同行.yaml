  "事件引子": "后院草地上残敌退散，微风轻拂黑马鬃毛，黑衣女郎手握软鞭，冷眼审视着青衫书生。",
  "事件详情": "听闻段誉求见谷主的请求，黑衣女郎沉吟片刻后断然拒绝。她冷峻告知段誉，其父性情极其暴烈，生平痛恨所有段姓之人，段誉若贸然踏入内堂，尚未开口便会惨遭掌毙，因此营救钟灵之事由她一人承担，命段誉休要插手。段誉闻言大义凛然，正色直言钟灵完全是为解救自己才不幸受困，自己身为男儿断无贪生怕死、袖手旁观的道理，纵然落得粉身碎骨的下场，也立誓定要亲自将解药送回换取钟姑娘平安。女郎闻言深深注视着段誉，见其目光赤诚坚毅，眼中不由自主掠过一丝异色，冰冷刚硬的态度随之明显放缓。女郎赞许这名文弱书生颇讲江湖义气，首度自揭身份表明自己名叫木婉清，乃是钟灵的同门师姐。木婉清感念段誉的赤子之心，最终改变了独自行动的初衷，松口允诺让段誉跟随自己一同奔赴神农帮救人，双方正式结成营救同盟。",
  "事件概要": "黑衣女郎告诫段誉谷主痛恨段姓之人，勒令其退避由自己独力救人。段誉大义凛然，誓言粉身碎骨亦不弃钟灵。女郎感佩其赤诚义气，态度转温，首度自揭身份为钟灵师姐木婉清，并破例允诺携段誉同赴神农帮营救，二人结为营救同盟。",
