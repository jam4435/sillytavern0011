  "事件引子": "水榭内刀兵渐止，各派高手受挫退至门廊，惊怒相视间满堂皆是忌惮之气。",
  "事件详情": "面对王语嫣如神明般的招式点拨与风波恶、公冶乾二人愈战愈勇的凌厉攻势，攻入水榭的各路掌门帮主与武林高手屡屡受挫，深感慕容氏底蕴深不可测、高深莫测。群豪眼见久攻不下且折损颜面，心知今日在这小小的水榭之中绝难讨得半点便宜，继续缠斗只会暴露出更多门派破绽自取其辱，权衡利弊之下只得恨恨地暂罢干戈、收兵罢战。为首群豪为挽回颜面，当场厉声向慕容氏立下战约，相约数日之后在无锡杏子林召开的丐帮大会上当着天下英雄的面再行对质、决一胜负。说罢，群豪怀着愤恨与忌惮之心悻悻退出水榭，率领大批门人属下纷纷撤回湖面战船，扬帆离去。原本杀机四伏、一触即发的曼陀山庄灭顶危机，最终在这场听香水榭的指点群豪之戏中彻底消弭于无形，山庄重归平静。",
  "事件概要": "面对王语嫣精妙指点与风波恶、公冶乾的猛攻，久攻不下的各路高手深感难讨便宜，恐再缠斗尽露破绽自取其辱。为挽回颜面，群豪当场立下数日后无锡杏子林丐帮大会之约再决胜负，随即悻悻撤回战船扬帆而去，曼陀山庄危局彻底消弭。",
