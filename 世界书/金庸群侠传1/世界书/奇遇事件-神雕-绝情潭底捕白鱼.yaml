事件名称: 奇遇事件-神雕-绝情潭底捕白鱼
事件地点: 大宋/绝情谷/断肠崖
触发条件:
  全部:
  - 变量: user数据.初始属性.机敏
    大于等于: 14
  - 变量: user数据.初始属性.根骨
    大于等于: 12
事件持续时间:
  时: 4
事件引子: 断肠崖下深渊云雾缭绕，谷底极寒潜潭深处，隐约游动着通体透明如玉的冷泉异鱼……
事件概要: 玩家探入断肠崖渊底寒潭，捕食灵泉白鱼并采集野生玉蜂浆，阴阳调和，化解体内暗毒。
事件详情: 玩家系长索滑入绝情谷断肠崖万丈深渊，穿过极寒刺骨的潜水洞窟，发现一处四季如春的隐秘幽谷。谷中潜潭清澈见底，游动着数尾寸许长、通体透明无鳞的冷泉白鱼。生食入口清冽甘甜，如甘霖灌顶，体内的燥热火毒瞬间消散。花丛间更有灵性玉蜂结巢，玩家小心采收纯正野生玉蜂浆，得大补益元圣品。
参与人物:
- 玩家
insert:
  user数据:
    包裹:
      极品玉蜂浆:
        类型: 药品
        品阶: 极品
        功效类型: 回复
        物品描述: 绝情谷深渊玉蜂所酿之蜜浆，香气幽雅，服之可生肌拔毒，恢复大额气血。
        属性修正:
          气血: 80
          内力: 50
        数量: 2
      寒潭白鱼干:
        类型: 药品
        品阶: 珍品
        功效类型: 永久增幅
        物品描述: 极寒冷泉中生长的通体透明异鱼，食之可清心明目、调和阴阳。
        属性修正:
          内力: 10
        数量: 1
update:
  user数据:
    修为: '+1500'
