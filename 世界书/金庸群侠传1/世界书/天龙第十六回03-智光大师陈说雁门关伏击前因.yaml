  "事件引子": "杏林中落叶萧萧，群丐喧哗骚动未息，智光大师合十缓步出列，悲悯佛号回荡林间。",
  "事件详情": "面对乔峰的激愤质问与全场弟子的骚动，天台山智光大师面露悲悯之色，合十缓步出列，宣了一声沉痛的佛号。为了向在场群雄阐明乔峰身世背后的血泪渊源，智光大师当众揭开了一段尘封整整三十年的雁门关惨案。三十年前，中原武林一位德高望重的“带头大哥”接到紧急密报，声称大批契丹武士意图潜入少林寺盗取镇寺武学典籍。带头大哥深感事态严重，当即联络汪剑通、智光大师、赵钱孙等二十一名中原绝顶高手，星夜兼程赶赴雁门关绝壁险道设伏截击。然而事态突生惨痛变故，众人埋伏截杀的目标根本不是盗经奸细，而是一位携妻子与初生幼子回娘家省亲的契丹贵族将军。中原群豪在未查明实情之下不由分说合力发动围攻，竟在关下当场将该将军的无辜爱妻残忍杀死。智光大师沉痛的讲述将昔日因误信密报而滥杀无辜的罪孽公之于众，令杏子林群豪骇然失色。",
  "事件概要": "面对乔峰激愤质问与群丐骚动，智光大师出列揭开三十年前雁门关惨案：昔年带头大哥误信契丹武士盗经密报，率二十一名中原高手设伏，却滥杀无辜、将携妻省亲的契丹贵族之妻残忍击毙。惊天血案公之于众，杏林群豪骇然失色。",
