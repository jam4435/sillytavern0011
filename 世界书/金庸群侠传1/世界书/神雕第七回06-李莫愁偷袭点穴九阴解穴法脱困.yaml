  "事件详情": "不知过了多久杨过腰间中枢穴被人点了一指，一惊而醒但后颈已被擒拿手抓住动弹不得，侧头见李莫愁师徒笑吟吟站在身旁，小龙女也被点中穴道。原来二人殊无江湖经验喜悦之余竟忘安上棺底石板，被李莫愁发现地下石室偷袭成功。李莫愁冷笑道这地下石室竟有如此舒服所在，要小龙女用心推详出墓道路。小龙女虽知出路却不肯说。李莫愁看出端倪——小龙女说话语气神情分明知道出路，大喜之下称带出去就不再为难。小龙女冷冷道你们自己进来便自己想法子出去。李莫愁素知师妹倔强，于是在二人颈下天突穴和股腹之间五枢穴上各点一指使上古墓派秘传点穴手法，料二人不久便周身麻痒难当非吐露秘密不可。小龙女闭眼不理会，杨过悄悄说千万别说出墓秘密，李莫愁若不知道始终不会杀我们。小龙女暗赞有理，睁眼见室顶地图怕被师姊发现眼光决不敢瞧向地图。就在这危急关头，她目光落在另一角落突然看到'解穴秘诀'四个小字如电光闪入眼中——原来室顶九阴真经中载有自通穴道之法。她将秘诀与闭气秘诀默念一遍俯嘴在杨过耳边轻轻教了。二人依秘诀默运玄功片刻间已将穴道解开。李莫愁立时察觉有异纵身过来。小龙女跃起反手出掌在她肩头轻轻一拍正是玉女心经上乘武功，李莫愁万料不到她竟能自解穴道大惊后跃。小龙女忽然问师姊想不想出去。李莫愁先是大喜随即愤恚异常——自负武功才智罕逢匹敌竟被小师妹玩弄于掌股之上。杨过趁机离间说只能带一人出去，小龙女随即附议只能带一个。杨过故意笑说让洪师姊出去李莫愁年纪大了活够啦。李莫愁恼怒却不作声。小龙女轻轻一笑携杨过手走出石室，李莫愁与洪凌波抢在后面两人同时挤在门口，李莫愁扳住洪凌波肩头逼其让路，师徒之间已生嫌隙。",
