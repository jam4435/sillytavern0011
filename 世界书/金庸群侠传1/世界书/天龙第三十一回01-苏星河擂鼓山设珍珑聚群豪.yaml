  "事件引子": "擂鼓山幽谷古松森森，三面绝壁如削，三丈见方的石壁上黑白棋子如龙蛇相搏。",
  "事件详情": "河南擂鼓山幽谷古松森森，三面绝壁如削。聪辩先生苏星河遵恩师无崖子三十年严命，广发英雄帖设下名震江湖的珍珑棋局，意在从天下英豪中遴选福慧双修的关门弟子，以承衣钵并清算星宿老怪丁春秋之血仇。三丈见方的平整石壁上刻满棋路，黑白两色石子深嵌石槽，纵横十九道中隐泛杀伐之气。苏星河一袭布袍盘坐棋枰前，大理段誉、姑苏慕容复率四大家臣、吐蕃国师鸠摩智、四大恶人之首段延庆，以及少林玄难率虚竹等僧众齐集谷中。苏星河拂袖指向绝壁，朗声道：“先师三年心血成此残局，数十载无一人能解，诸位请了！”群雄环顾石壁，但见黑白交错如龙蛇相搏，黑子如乌云压境，白子若残甲孤军，石隙间隐透剑拔弩张之势。群雄神态各异、暗潮涌动，慕容复欲借破局扬名收揽人心，鸠摩智冷笑盘算逍遥绝学，段延庆眼现戾色，段誉心系王语嫣安危而随行护持，众人虽蠢蠢欲动却皆被壁间凌厉杀机所慑，一时无人敢轻动。四方豪杰就位，英雄帖之聚达成，石壁珍珑宛如吞噬心智的深潭静待挑战，擂鼓山谷肃杀凝重，一场汇聚天下棋道与武道隐秘的死局博弈轰然拉开帷幕。",
  "事件概要": "聪辩先生苏星河遵师命布下名震江湖的珍珑棋局，广发英雄帖遴选衣钵传人以雪师门大仇。大理段誉、姑苏慕容复、吐蕃国师鸠摩智、四大恶人段延庆及少林玄难等各方豪强齐聚幽谷。面对壁间杀机暗涌的残局，群雄各怀心思却皆被其凌厉杀意所慑，死局博弈就此拉开序幕。",
