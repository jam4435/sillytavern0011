  "事件引子": "杏林间薄雾未散、杀气森森，满地落叶随风轻卷，素白身影携着压抑呜咽缓步逼近。",
  "事件详情": "杏子林中风声鹤唳，马夫人康敏身着一袭如雪缟素，头戴白花，面容凄楚绝美地自林外缓步走入。康敏为坐实乔峰杀害副帮主马大元之罪名，刚至场中便盈盈下跪，面对各派名宿与丐帮帮众抽泣呜咽、痛陈冤屈。她声泪俱下地指控，丈夫马大元死于自身成名绝技“锁喉擒拿手”，喉骨尽碎，凶手必定是武功通玄且知晓帮内机密之人。乔峰满怀悲愤上前拱手安慰，誓言定为副帮主报仇雪恨；康敏却凄然冷笑，猛地抬手直指乔峰，字字诛心地质问其是否敢对天立誓。康敏当众披露，马大元生前曾对她吐露汪老帮主留下一封关乎帮脉生死的大密信，马大元正是因恪守忠义不肯依附乔峰的阴谋，才在密室中遭灭口横死。康敏言罢，自素色衣袖中取出马大元临终前紧握的一方染血青布帕与藏有钥匙的漆黑蜡丸，亲手呈递给徐长老。这番指控与证物交接，如同一柄无形利刃刺向乔峰，全场丐帮弟子哗然变色，怀疑的目光齐刷刷聚焦于乔峰身上，令其百口莫辩。",
  "事件概要": "马夫人康敏身着缟素现身杏林，泣诉马大元遭本门绝技锁喉擒拿手残害，直指凶手深悉帮内隐秘。乔峰誓言缉凶却遭其诛心逼问，康敏当众指控马大元因拒从乔峰之谋而遭灭口，并向徐长老呈递遗书钥匙与血帕证物，引得全场丐帮帮众哗然质疑乔峰。",
