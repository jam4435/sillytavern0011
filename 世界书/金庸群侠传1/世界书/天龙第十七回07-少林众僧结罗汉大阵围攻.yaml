  "事件引子": "少林众僧结罗汉大阵合围，乔峰恪守底线只守不攻硬抗绞杀。",
  "事件详情": "随侍小僧凄厉尖锐的呼喊声瞬间震破千年古刹的宁静，少林寺内警钟疯狂轰鸣。玄慈方丈闻讯面色剧变，当即率领达摩院首座玄难、戒律院首座玄寂及数十名武功精湛的高僧手持降魔杵与镔铁禅杖飞奔赶至，将禅房小院层层围得水泄不通。少林众僧眼见玄苦大师合十气绝，又闻山下巡山僧飞报乔三槐夫妇惨死凶讯，群情激愤、怒不可遏，皆认定乔峰乃泯灭人性的嗜杀狂魔。玄难大师厉声宣号，达摩院数十名武僧各持重器迅速移形换位，结成威名赫赫的少林罗汉大阵。禅杖挥舞破空生风，杖影重重如泰山压顶般向场中收拢碾压，罡气激荡得庭院地砖寸寸崩碎。乔峰立于阵中昂然高呼：“玄苦师父非我所害，诸位高僧且听我一言！”然而众僧在滔天怒火中充耳不闻，禅杖带起呼啸狂风齐齐轰下。面对数十名顶尖高僧的致命绞杀，乔峰深知一旦被擒必死无疑，但他强忍滔天冤屈，恪守绝不残杀少林僧众的底线，只以守势化解凌厉杀招。罗汉大阵气劲激荡、攻势如惊涛骇浪层层压迫；乔峰以傲世功力硬接数记重击，庭院内尘土飞扬、杀机四伏，双方陷入惊心动魄的死战。",
  "事件概要": "起因：随侍小僧呼喊惊动古刹警钟轰鸣，玄慈方丈率玄难、玄寂及数十名高僧赶至将小院围得水泄不通。发展：众僧认定乔峰残害父母与恩师，玄难指挥达摩院武僧结少林罗汉大阵挥动禅杖罡气如泰山压顶。结果：乔峰昂然高呼分辩只守不攻硬接数记重击，庭院地砖崩碎尘土飞扬双方陷入死战。",
