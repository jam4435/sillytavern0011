  "事件引子": "长啸破空神骏飞驰，怒喝如雷喝破世子真身。",
  "事件详情": "段誉与风波恶仍在农舍前缠斗难解，段誉终究没有武功底子，局势依然紧绷凶险。就在这千钧一发之际，远方搜寻世子下落的大理镇南王府高手循迹策马赶至驰援。山谷远方骤然传来一阵清越高亢、雄浑悠扬的长啸之声，宛若九天龙吟回荡山川，滚滚声浪瞬间震慑全场。众人转头望去，只见两匹神骏白马如飞电般疾驰冲入战圈，马背上端坐着两名身披大理皇室锦绣长袍的大理镇南王府四大护卫——褚万里手执沉重冰冷的熟铜长棍，古笃诚手按锋芒毕露的开山双斧。二人尚未勒定马匹便已借势凌空飞身下马，落地如生根，当场运足内力厉声暴喝：“何方狂徒，胆敢对大理镇南王世子无礼！”这声怒喝犹如晴天霹雳，令在场众人心神剧震。风波恶与在场的一众三十六洞、七十二岛探子闻言大惊失色，万没想到眼前这名不会武功的书生，竟是大理国皇位继承人、镇南王段正淳的独生爱子段誉；强援骤至使得场上攻守形势彻底逆转。",
  "事件概要": "起因：段风二人在农舍前缠斗僵持，王府护卫循迹策马赶至发出清越高亢长啸。发展：褚万里执熟铜棍、古笃诚按开山斧飞身下马，厉声喝斥狂徒胆敢冒犯世子。结果：二将喝破段誉镇南王世子之尊崇身份，强援骤至令场上攻守形势彻底逆转。",
