  "事件引子": "水榭厅内酒席初设、茶香初溢，席间表面看似平静却暗流涌动。",
  "事件详情": "午间时分，水榭厅内正备酒席，阿朱为执行搭救段誉的谋划，借故抽身离开众人的视线。她精通天下无双的易容与变声绝技，隐至偏处后迅速施展神技，在极短时间内化装成一名白发苍苍、老态龙钟的管家老仆。待再度步入厅堂时，阿朱身形佝偻、步履蹒跚，举手投足间尽显衰朽迟暮之态，全无二八少女的半分痕迹。她端着茶具颤巍巍行至客前，刻意压抑本音，换作干涩沙哑的老者声线，谦卑地向主位上的鸠摩智躬身行礼奉茶。阿朱的言谈举止与神情动作惟妙惟肖、浑然天成，无论眼神步态还是奉茶手势，皆与久历沧桑的深宅老仆别无二致。鸠摩智虽为功力通玄、阅历极丰的武学大宗师，警觉性极高，但在近在咫尺的言语周旋与奉茶侍奉中，竟也未能看破这层出神入化的伪装。阿朱由此顺利瞒过番僧耳目，以老仆身份大模大样地侍立席间，为后续近身施救铺平了道路。",
  "事件概要": "阿朱为搭救段誉借故抽身，以天下无双的易容变声绝技化装为老态龙钟的衰朽老仆。她步履蹒跚重返水榭厅堂奉茶周旋，神态声线惟妙惟肖，竟瞒过警觉通玄的吐蕃国师鸠摩智，顺利侍立席旁为近身施救奠定良机。",
