  "事件详情": "群道见孙婆婆死去无不恻然，郝大通更是大悔上前向尸首行礼。小龙女在一旁一语不发待他说完才皱眉道：怎么你不自刎相谢竟要我动手么？小龙女要郝大通自刎了结便饶满观道士性命，群道哗然斥责她不知天高地厚。小龙女恍若不闻缓缓从怀中取出一团冰绡般的物事——原来是一双白绡手套，戴上后左手轻扬甩出一条白色绸带直扑郝大通门面，绸带末端系着金色圆球玎玎有声。郝大通闪身避开，哪知绸带能在空中转弯，金球疾颤分点他脸上迎香、承泣、人中三个穴道。郝大通大惊使铁板桥后仰又搬移三尺才险险避过。群道无不骇异。四名道人挺剑刺去，小龙女双手白绸带如水蛇般蜿蜒而出玎玎四响点中腕上灵道穴四柄长剑落地。郝大通起了敌忾之心接过长剑与小龙女拆解数十招竟占不到丝毫便宜。他焦躁下剑法变慢劲力变大，再拆数招金球与剑锋相撞反激弹向小龙女面门，郝大通乘势剑刃指向她手腕——不料小龙女右手疾翻抓住剑刃喀的一响长剑从中断为两截。郝大通脸色苍白大败之下提起断剑往颈中抹去。铮的一响一枚铜钱从墙外飞入击落断剑——丘处机手持长剑跃了进来。小龙女左掌又抓住丘处机长剑，二人手劲对手劲喀喇一响长剑又断。小龙女也被震得手臂酸麻胸口隐隐作痛，自知玉女心经未成不是对手，将断剑掷地左手挟孙婆婆尸身右手抱杨过施展绝世轻功从墙头飞了出去。丘处机郝大通等人相顾骇然。",
