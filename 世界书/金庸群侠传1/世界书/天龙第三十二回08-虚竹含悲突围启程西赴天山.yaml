  "事件引子": "佛门慈悲破空救生，虚竹凌空发掌夺下哑女童飞身突围。",
  "事件详情": "目睹大师兄苏星河惨遭丁春秋毒手横死当场，虚竹心中悲愤交加。丁春秋杀气腾腾，指挥星宿派门徒四面合围，企图强行抢夺虚竹手上的七宝指环并将其灭口。值此危急存亡之秋，函谷八友等同门弟子拼死上前阻截掩护，用身躯挡住星宿派的毒火与暗器，为新掌门杀出一条生路。身负七十年北冥真气的虚竹虽然招式未纯，但内力磅礴无匹，在众弟子的舍命护卫之下，虚竹含悲展动身形，奋力逼退数名围堵的星宿恶徒，成功突破了丁春秋的重重包围网。脱离险境之后，虚竹深知自身肩负着逍遥派掌门传承与清理门户的血海深仇，绝不可在此刻白白牺牲。他将七宝指环与师尊遗留的神秘画像紧贴胸口妥善藏好，谨遵无崖子的临终遗命，迎着大漠长风毅然踏上了前往极西之地天山缥缈峰灵鹫宫的西行长路。",
