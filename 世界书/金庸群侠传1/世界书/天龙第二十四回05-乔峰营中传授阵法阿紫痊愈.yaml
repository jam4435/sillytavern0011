  "事件引子": "晨雾笼罩长白山营地，校场雪地上划满攻守阵图，呼喝操练声与帐内药香幽幽交织。",
  "事件详情": "在女真大营定居的数月里，乔峰见女真勇士虽然单兵悍勇却缺乏章法，为报答部落收留与赠药之情，每日清晨亲赴营中校场传授武艺。乔峰手持白蜡木杆，在雪地上画出八卦方圆与进退阵形，亲自示范中原精妙的攻守合击之术，高声指点猎人们如何以盾牌锁矛、以合围之势抵御骑兵冲锋。阿骨打与数百猎人手持长矛骨盾反复操练，战阵呼喝震天，原本散乱的捕猎小队蜕变为纪律严密的虎狼之师。为表感激，女真长老们将部落世代珍藏的数株极品千年雪参以及御寒的厚实紫貂皮袍，源源不断地送入乔峰帐中。乔峰将老参熬成浓稠药汁，每日按时扶起阿紫，以自身精纯内家真气助其化开药力，持续冲刷阿紫下身已闭塞数月的足少阳、足厥阴诸经。在浑厚真气的一再冲击下，阿紫丹田内残留的阴寒剧毒被彻底拔除蒸发，经脉淤阻尽数贯通。一日清晨，阿紫双腿重新焕发生机，竟能赤足踏地、轻盈跃起，原本濒死瘫痪的重伤彻底霍然而愈。",
  "事件概要": "乔峰感念女真部落收留之恩，每日在校场传授八卦合击阵法，助勇士结阵御敌。女真长老感激赠予极品雪参，乔峰日夜耗损真气为阿紫行气化药、疏通淤阻经脉。在纯阳内力数月冲刷下，阿紫丹田阴毒彻底拔除，双腿重焕生机霍然而愈。",
