  "事件引子": "晨光微曦中小镜湖畔新冢孤凄，残雨未歇，青石桥边血迹斑驳，母女二人仓皇疾奔而至。",
  "事件详情": "乔峰刚刚在小镜湖畔为阿朱立好墓碑、完成安葬，阿紫与生母阮星竹便闻讯匆匆奔赴小镜湖畔。母女二人骤然目睹青石桥边的惨烈痕迹、横死在地的阿朱以及新建的凄凉坟茔，顿时震惊悲恸难当。年幼的阿紫亲眼看到自己的亲姐姐惨死在乔峰掌下，在望向眼前这位浑身浴血、神情如魔神般可怖的盖世豪侠时，心中既不可抑制地充满了极度的畏惧与胆怯，又在恐惧的深处悄然滋生出一种异样而极端的爱恋与依赖之情。乔峰望着眼前年幼失怙、孤苦伶仃的阿紫，心中骤然忆起阿朱临终前对妹妹的百般牵挂与托付。面对阿朱在世间遗留的唯一亲妹妹，乔峰强压下心头撕裂般的剧痛，当场向阮星竹郑重许下承诺，誓言今后必定一力承担起照料与抚养年幼孤苦阿紫的全部重任，自此将阿朱的临终遗愿承接在身，永不背弃。",
  "事件概要": "阮星竹与阿紫闻讯赶至小镜湖畔，惊见阿朱惨死新冢，悲恸难当。阿紫目睹乔峰魔神般的威势，恐惧之余暗生依恋。乔峰忆及阿朱临终重托，强忍彻骨剧痛，当面向阮星竹郑重立誓，一力承担照料抚养阿紫之责，誓不背弃阿朱遗愿。",
