  "事件引子": "火把明灭暗夜密谋，分发令符歃血为盟逼宫谋夺权。",
  "事件详情": "杏子林夜黑风高，密林深处火把明灭不定。大智分舵舵主全冠清为夺取帮中大权并掩盖不可告人的图谋，暗中串联宋、奚、陈、吴四大长老及数百分舵精锐弟子秘密聚首，欲行废立帮主乔峰之险招。全冠清按剑立于青石之上，面容阴鸷，字字如刀挑动众人情绪：“乔峰行事专断独行，其身世更暗藏滔天大祸，若任由其统领，丐帮数百年忠义基业必将毁于胡虏之手！”陈长老性烈如火，手中九节生铁杖重重顿地，震得枯叶翻飞，厉声追问真凭实据；全冠清早有周密筹谋，当场自怀中取出伪造的调令信笺与截获的密报，言之凿凿、步步紧逼。四大长老虽曾与乔峰并肩作战，但受身世疑云与帮门安危之大义蛊惑，终究动摇了心智，毅然选择摒弃旧情，加入叛乱阵营。众人随即挥刀斩鸡沥血，在铜盆前歃血立誓，全冠清将四枚用于调度各分舵人马的玄铁竹节令符分别交到四位长老手中，约定于次日清晨扣押传讯弟子、全面封锁杏林，一场意图逼宫夺权的喋血阴谋彻底就绪。",
  "事件概要": "起因：杏子林夜黑风高全冠清为夺权掩盖图谋，串联宋奚陈吴四大长老及分舵精锐欲废立乔峰。发展：全冠清以身世大祸为由出示伪造调令与密报，动摇四大长老心智使其入阵歃血立誓。结果：全冠清分发四枚玄铁竹节令符约定次晨封锁杏林，逼宫夺权阴谋彻底就绪。",
