  "事件详情": "慕容复在西夏招亲彻底落选之后，深感单凭姑苏慕容氏残存之力绝难实现光复大燕之宏愿，复国欲念炽烈攻心之下，决意破罐子破摔，与四大恶人之首“恶贯满盈”段延庆暗中接洽勾结。段延庆一心夺取大理国皇位，二人各怀鬼胎、一拍即合。为了换取段延庆与四大恶人势力的全力相助，慕容复彻底抛弃大燕皇室之尊严与历代祖宗清誉，在密会之中当众推金山倒玉柱，双膝重重跪倒在段延庆铁杖之下，口称“义父”，甘愿沦为大理段氏之干儿子，立下重誓要借助大理国政权与精锐军力起兵复国。段延庆见名满天下的姑苏慕容公子竟如此卑躬屈膝、甘充义子爪牙，大为快意与满意，当场应允结为父子同盟。至此，慕容复彻底抛弃武林世家道义与正道名节，与邪道恶徒达成政治盟约，确立了借大理夺权的阴毒计划，为其日后掀起滔天血雨腥风铺平了道路。",
