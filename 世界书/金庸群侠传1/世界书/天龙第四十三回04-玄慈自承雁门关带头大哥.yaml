  "事件引子": "一人担下三十年罪，玄慈当众宣称愿受少林重刑以谢天下。",
  "事件详情": "淫戒之罪方定，萧远山蓦地发出一阵凄厉狂笑，扯下脸上黑巾，指着玄慈厉声喝问：“玄慈！三十年前雁门关外伏击我夫妇、害死数十条人命的‘带头大哥’，今日你可敢当着天下群雄认下？！”萧峰闻言双拳紧握，周身骨节噼啪作响，狂暴真气在掌间吞吐。少林众高僧欲上前阻拦，玄慈却挥袖示意众人退下，神色平静坦然。他面对大殿内外数千双惊怒交加的眼睛，坦然应道：“善哉，三十载冤孽，老衲岂敢再作隐瞒。”玄慈当众详述当年如何听信姑苏慕容博伪造的辽兵偷袭少林之谎言，盲目纠集二十一名中原豪杰在雁门关隘设伏，酿成萧氏骨肉分离、无数无辜者喋血的惨案。他深吸一口气，运足内力宣告：“老衲便是雁门关惨案的罪魁祸首‘带头大哥’，累及诸位义士死伤殆尽，罪该万死！”此语一出，满堂群雄倒吸凉气，三十年来引发无数血雨腥风与灭门血案的武林第一疑案终于彻底大白于天下。玄慈毫无保留地将一切罪愆尽揽己身，昔日武林领袖之尊在真相大白中轰然瓦解。",
