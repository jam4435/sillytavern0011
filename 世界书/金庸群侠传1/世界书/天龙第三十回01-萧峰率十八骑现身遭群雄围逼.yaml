  "事件详情": "少室山大雄宝殿前的宽阔石坪上，少林高僧、丐帮诸舵以及各路武林门派数千人正剑拔弩张地争夺盟主之位。忽听得山道上传来轰鸣如雷的马蹄声，萧峰为探寻阿紫安危与身世宿怨，身披大辽南院大王锦绣紫袍，率领燕云十八名重甲精骑狂飙而至。群雄骤见这位名震武林却身负契丹血脉的盖世高手现身，场中顿时爆发出震天哗然。少林方丈玄慈合十凝目，丐帮长老全冠清则厉声高呼“契丹狗贼胆敢犯境”。数十派高手怀揣仇怨与戒备，纷纷抽刀拔剑，四面刀枪如林、寒光霍霍，瞬间组成数重严密的包围圈，直指中央。燕云十八骑面不改色，整齐划一地弯刀出鞘，战马喷吐白沫扬蹄嘶鸣。面对千夫所指的肃杀绝境，萧峰勒马收缰，横枪傲然端坐于鞍桥之上，目光如电环视全场，豪气干云地沉声喝道：“萧某今日光明磊落而来，何惧天下英雄！”磅礴内力震得众人耳膜发馈。群雄慑于其赫赫威势，虽将萧峰一行围得水泄不通，却无一人敢率先冒进，整座少林古刹杀气弥漫，惊天大战一触即发。",
