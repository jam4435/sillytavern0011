  "事件引子": "药锄击肩吐鲜血，袖发毒箭破坚网。",
  "事件详情": "段誉与黑玫瑰猝不及防被药网罩住，黑马受惊暴躁人立。木婉清见段誉受制救人心切，鞭法攻势不免出现疏漏破绽。司空玄伺机发难，挥动沉重药锄狠狠扫中木婉清右肩，震得她身形剧烈晃动，嘴角溢出一缕鲜血。面对伤痛与危局，木婉清银牙紧咬，手腕骤扬施展绝技，三枚喂毒短箭自袖中呼啸射出直取司空玄面门。司空玄大惊之下挥锄格挡，当当两声磕飞前两箭，第三支毒箭却擦着面颊掠过划出一道血痕。伤口顷刻奇痒难当，司空玄骇然惊呼“毒箭”狼狈退避。木婉清抢得喘息良机娇叱变招，手中软鞭如利刃般划破浸药大网，奋力将段誉一把扯出解困。随即木婉清忍痛翻身跃上马背，猛拉缰绳催动黑马凌空腾跃掠过众人头顶，载着段誉向后山绝壁方向疾驰突围。此番交锋司空玄面颊挂彩中毒受挫，木婉清破网夺回段誉，二人成功杀出血路遁向山崖。",
  "事件概要": "起因：木婉清右肩遭司空玄药锄击中吐血，情急之下甩袖射出三枚剧毒短箭。发展：司空玄面颊被毒箭划伤奇痒难退避，木婉清展鞭破网一把拉出段誉解困。结果：司空玄中毒受挫，木婉清忍痛跃马腾空飞掠突围，载段誉遁向山崖绝壁。",
