  "事件引子": "朔风呼啸，辽军玄甲铁骑席卷塞外，数十面赤龙金鼓震天擂动，万丈绝壁下杀机四伏。",
  "事件详情": "雁门关绝壁下朔风呼啸，辽宋边境杀气冲霄。辽帝耶律洪基亲率数十万精锐重甲铁骑席卷而至，自恃兵力占绝对优势，意图彻底剿灭萧峰、段誉、虚竹与中原群雄联军，并迫使萧峰重归大辽统兵南侵。耶律洪基端坐于御用高头乌骓战马之上，金盔映日，手中雕金马鞭凌空虚指，厉声喝道：“萧峰！你身为契丹贵胄、南院大王，若肯迷途知返领兵充任先锋踏平雁门，朕许你世袭罔替、裂土封王；若敢执迷不悟，休怪数十万铁骑将你等碾为肉泥！”话音未落，辽军阵前数十面赤龙金鼓擂动如雷，前排玄铁盾牌重重砸地，三军齐声呐喊，重骑兵自两翼疾驰包抄，瞬间将群雄死死压制于万丈绝壁之下。群雄退无可退，纷纷拔剑按刀、屏息凝神，萧峰则昂首跨步排众而出，决意以孤身之躯直面万马千军。辽帝亲卫随即扬起先锋令箭与金册大印于阵前示威，数十万铁骑刀出鞘、弓上弦，在雁门关外结成滴水不漏的铁桶死局，两军对峙陷入剑拔弩张的极危边缘。",
  "事件概要": "耶律洪基率数十万辽军铁骑兵临雁门，将萧峰、段誉、虚竹及群雄逼至绝壁死角，阵前示以金印令箭，威逼利诱萧峰领军南侵。群雄拔刀屏息以待，萧峰毅然排众而出直面万马千军，两军对峙陷入剑拔弩张之势。",
