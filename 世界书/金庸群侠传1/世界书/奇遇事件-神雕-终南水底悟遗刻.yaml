事件名称: 奇遇事件-神雕-终南水底悟遗刻
事件地点: 大宋/终南山/活死人墓外
触发条件:
  全部:
  - 变量: user数据.初始属性.机敏
    大于等于: 13
  - 变量: user数据.初始属性.悟性
    大于等于: 14
事件持续时间:
  时: 4
事件引子: 终南后山碧潭深邃幽冷，水下暗流涌动，隐隐露出一条通往古墓深处的废弃水道……
事件概要: 玩家潜入深潭水底暗道进入古墓废弃石室，参详石顶王重阳所刻九阴真经闭气解穴真诀，获益匪浅。
事件详情: 玩家在终南山后山偶遇一处冰冷刺骨的幽潭，运起闭气法潜入潭底，在水草怪石间寻得一处狭窄潜水孔道。憋气穿行数丈后破水而出，进入一处干燥封尘的古墓石室。室内寒玉床余温尚存，仰首仰望，石顶之上赫然刻满了当年重阳真人手书的破玉女心经要诀，附有《九阴真经》易筋锻骨、解穴与闭气诀残篇。玩家凝神默诵，将真经总纲微言大义尽数记于心间。
参与人物:
- 玩家
