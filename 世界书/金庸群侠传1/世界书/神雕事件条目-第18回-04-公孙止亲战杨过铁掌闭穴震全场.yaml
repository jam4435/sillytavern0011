  "事件详情": "公孙止绕着杨过缓缓走了一圈双手向前平举三次双掌合拍铮铮然如金铁相击。右臂突伸一把抓住渔网边缘拉扯力道大得异乎寻常，杨过五指剧痛只得松手。杨过不容他抢到先手绸索一振金铃分击对方肩头巨骨与颈中天鼎两穴。公孙止对金铃击穴绝不理睬，右臂一长倏向他臂上抓来。叮叮两声双穴齐中他却恍若不觉，手抓变掌拍向杨过左乳。杨过大惊急闪——曾听欧阳锋洪七公等谈论过闭穴功夫但眼前此人对点穴全无反应就似身上不生穴道一般心中存了三分怯意。顷刻间已拆十余招，公孙止左掌轻飘飘当胸按来似柔实刚依稀便是完颜萍的铁掌路子。他以身子前纵之劲发掌——以身发掌威猛迅捷兼而有之。杨过闪避不及只得左掌硬接，啪的一响被震退三步，公孙止身子微微一晃。公孙止大占上风其实胁口已感隐痛，心下大讶：'我这一招铁掌已使上十成功力这小子竟然接得下。'双掌连拍铮铮作响说道'姓杨的本谷主掌下留情你明白了么'。杨过哈哈一笑反唇相讥说他是'轻不得重不得无可奈何之至手足无措之极'——道破公孙止心中死结。公孙止恨不得一招就打死他却偏偏收拾不了这少年。",
  "事件概要": "公孙止亲自下场仍难速胜，绝情谷主的闭穴与掌法虽惊众人，却未能压服杨过。",
