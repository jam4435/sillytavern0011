  "事件引子": "废农舍外群敌环伺、杀机四伏，焦黄面皮的汉子冷笑振臂，铁骨折扇霍然作响。",
  "事件详情": "段誉抱拳以礼相询，然而风波恶生性狂傲好斗，根本不将眼前这个文质彬彬的书生放在眼里，决意以雷霆手段将其一击制服或当场击杀。风波恶上上下下打量了段誉一番，嘴角泛起极度蔑视的冷笑：“黄口小儿，凭你也配问我等名号？识相的纳命来！”话音未落，风波恶右手折扇啪的一声霍然展开，足尖点地，身形快如惊雷掣电般欺身而上。他手中折扇借着劲疾内力，如钢锥利刃般直奔段誉前胸致命要害急点而去，招式狠辣迅猛无比。段誉全不通晓武林临敌打斗与拳脚拆招之法，生死一线之间全凭本能反应，脚下下意识施展起新近领悟的“凌波微步”，身形微晃间踩向易经中的“离卦”方位。只见段誉青衫随风飘摆，姿态看似如弱柳迎风，却以毫厘之差精妙绝伦地避开了风波恶志在必得的杀招。风波恶凌厉的一击全然落空，扇风穿透虚空，惊得他脱口发出一声“咦”的诧异之声，原本骄狂的心中顿时大感震惊，对眼前书生的神妙身法收起轻视之心。",
  "事件概要": "风波恶骄狂蔑视段誉，暴起挥动铁骨折扇疾点其胸前要害。生死俄顷之间，全无对敌经验的段誉本能踏动凌波微步，循离卦玄位侧身避开致命杀招；折扇击空劲力透虚，风波恶骇异失声，始收轻敌之心。",
