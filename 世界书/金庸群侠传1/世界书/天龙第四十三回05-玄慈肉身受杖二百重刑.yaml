  "事件引子": "大殿内执法僧铁杖森然伫立，玄慈坦然解衣跌坐青石，满堂群雄屏息凝视。",
  "事件详情": "认下双重罪业后，玄慈神色决然，面向戒律院首座肃容道：“国有国法，寺有寺规。老衲破戒犯僧律、妄造杀业，请依寺规施以重刑，以正少林清规！”戒律院首座含泪宣判杖责二百。四名身形魁梧的执法僧手持数十斤重的粗大铁木刑杖大步出列。玄慈坦然褪去上衣，盘膝垂目端坐于大殿冰冷青石上，主动散去丹田内的护体纯阳真气，纯以血肉残躯受刑。刑杖挟着凌厉破空风声重重砸落，只听得沉闷的“砰！砰！”击打声响彻法堂。初时数十杖下去，玄慈脊背皮肉撕裂、紫涨充血；行至百杖，衣衫碎屑与血沫横飞，鲜血顺着脊梁汩汩流淌，将地面青石染得触目惊心。玄慈面色惨白如纸，唇角溢血，身形虽因剧痛剧烈颤抖，却咬紧牙关始终不发一声痛呼，亦不调动半丝内力御伤。叶二娘与虚竹撕心裂肺地哭喊着欲上前阻拦，却被执法僧以长棍死死架住。二百重杖实打实地行刑完毕，刑杖前端已被鲜血浸透，玄慈脊背血肉模糊、重伤濒死，以最惨烈的皮肉之苦全了佛门戒律的森严威仪。",
  "事件概要": "玄慈主动依律请罚，散去护体真气纯以肉身硬受戒律院二百重刑。行刑铁杖击碎皮肉、血染青石，叶二娘与虚竹号哭扑救遭僧棍阻隔。玄慈咬牙受尽酷刑濒死，以残躯恪守少林戒律威仪。",
