  "事件引子": "竹舍前波光粼粼、幽篁掩映，两道森寒恶煞之气骤然破空而至，肃杀之意顿锁湖畔。",
  "事件详情": "正当乔峰与阿朱隐于暗处观察之际，四大恶人中的首恶“恶贯满盈”段延庆与排位第四的“穷凶极恶”云中鹤突然循迹追踪而至。段延庆一心夺取大理国皇位，视段正淳为心腹大患，企图趁其远离大理皇室、隐居偏远竹舍之机施展刺杀。面对强敌突袭，段正淳当即神色凝重，率领身旁的随从拔出兵刃迎上前去奋力抵御。段延庆残躯凌空，两根精钢细杖舞动如风，杖端不断吞吐激射出刚猛凌厉的一阳指力，破空之声尖锐刺耳，招招直取段正淳要害。段正淳虽拼尽全力施展段氏家传武学极力拆解，但在段延庆狠辣霸道的连环猛攻之下，渐渐感到真力不支、险象环生。与此同时，身法如鬼魅的云中鹤见段正淳被段延庆死死压制、随从亦被冲散，眼中凶光大盛，趁机如苍鹰搏兔般纵身扑向一旁观战的阿紫，欲行不轨之事。段正淳护女心切却分身乏术，阿紫惊呼遇险，整个小镜湖舍前瞬间陷入万分危急的死局。",
