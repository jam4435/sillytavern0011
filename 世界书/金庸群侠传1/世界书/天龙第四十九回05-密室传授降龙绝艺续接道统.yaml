  "事件引子": "幽深石室青灯摇曳，四壁寂然清寒，石门沉重闭合，唯闻沉稳吐纳与风声隐隐。",
  "事件详情": "缥缈峰灵鹫宫幽深静谧的石室内，青灯摇曳，四壁寂然。虚竹为全始全终践行与结义大哥萧峰的生死重托，带着丐帮新任少年掌门步入密室之中，闭门传功。虚竹手持绿玉打狗棒，将丐帮历代帮主口耳相传、从不落于文字的‘打狗棒法’心法口诀一句句悉心传授，并亲自持棒演练棒法的诸般精微招式与变化法度。紧接着，虚竹气沉丹田，运起雄浑醇厚的内力，将此前与萧峰共同化繁为简、去芜存菁提炼而成的完整‘降龙十八掌’精要招式逐一演练示范。掌风呼啸回荡于密室之内，刚柔并济、气吞山河。少年英雄神情极其肃穆专注，屏息凝神领会每一处吐纳关窍，并手持打狗棒依法演练招式步伐。每遇气血凝滞或运劲不顺之处，虚竹皆温言点拨并以自身内力轻扶引导，助其彻底豁然贯通。少年英雄在虚竹倾囊传授下不负众望，将两大绝学的心法与掌法尽数领悟掌握。至此，丐帮镇帮神功免除了失传浩劫，薪火相传得以代代延续，再度奠定了名震后世江湖的坚实根基。",
  "事件概要": "虚竹为践行萧峰遗托，携丐帮新任少年掌门入灵鹫宫密室闭门传功。虚竹手持绿玉杖倾囊相授打狗棒法精微法度，复运雄浑内力演练化简后的降龙十八掌；少年悟性过人尽数领悟，丐帮两大绝学得以薪火相传，绝学道统终免失传之虞。",
