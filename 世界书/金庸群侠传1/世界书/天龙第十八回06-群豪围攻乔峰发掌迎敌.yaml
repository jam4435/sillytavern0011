  "事件引子": "群豪刀光剑影疯狂合围，乔峰施太祖长拳降龙掌风摧枯拉朽迎敌。",
  "事件详情": "绝交酒饮尽摔碎之后，聚贤庄大厅内酝酿已久的浓烈杀气瞬间彻底引爆，一场震古烁今的惨烈血战正式爆发。在大厅各派掌门与首领的呼喝带动下，数百名成名武林高手各展看家绝学，持刀握剑从四面八方如狂潮般疯狂合围，向孤身立于大厅中央的乔峰猛扑而上。面对漫天袭来的刀光剑影与凌厉攻势，乔峰毫无惧色，体内真气狂涌，神威大发。他沉腰立步，当场施展出大巧若拙的太祖长拳以及至刚至阳的降龙十八掌等盖世武学。但见乔峰双掌翻飞激荡，击出的掌风沉雄霸道、呼啸如雷，每一掌劈出都蕴含着排山倒海般的磅礴巨力。群雄原本自恃人多势众企图速战速决，却未料到乔峰战力如此骇人，刚猛无匹的掌风所过之处摧枯拉朽、势不可当。乔峰以绝顶神功硬生生正面迎击数百高手的合力围扑，在狂风暴雨般的兵刃阵势中撕开一条血路，彻底拉开了这场惊世骇俗的聚贤庄大混战。",
  "事件概要": "起因：绝交酒饮尽摔碎杀气引爆，数百名成名高手持刀握剑如狂潮般从四面八方疯狂合围猛扑乔峰。发展：乔峰神威大发沉腰立步，施展太祖长拳与降龙十八掌，双掌翻飞掌风沉雄霸道呼啸如雷。结果：刚猛无匹掌风摧枯拉朽势不可当，乔峰正面迎击数百高手在狂风暴雨兵刃中撕开血路拉开大混战。",
