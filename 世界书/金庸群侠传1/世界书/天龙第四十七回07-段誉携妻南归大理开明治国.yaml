  "事件详情": "段誉携手王语嫣重登大理明黄銮驾，在三公九卿与森严铁骑的严密护卫拱卫下，决然告别中原与姑苏是非之地，浩浩荡荡西南还朝。抵临大理都城龙首城后，段誉正式御极亲政，王语嫣册封为大理皇后。段誉深感萧峰以死止战之仁德与慕容复霸图成空之虚妄，在大殿之上当着文武百官的面，亲手朱批下发开明诏令：免除南疆三年赋税徭役、开仓赈济贫民、与大宋及西夏互通互市，立誓永不轻启战端。高升泰等开国重臣齐声拜服领旨，满朝文武欢呼推行仁政。后宫之内，王语嫣卸下昔日江湖烦扰，与段誉共同翻阅典籍、研理农桑教化，夫妻二人相濡以沫、举案齐眉。在大理君臣的励精图治下，南诏大地风调雨顺、边陲止戈，各族百姓安居乐业、共享太平。通往苍山洱海的驿道两侧，十八学士与抓破美人脸等珍品茶花竞相绽放、烂漫如锦，段誉与王语嫣在漫天茶香中安享数十载清平岁月，广施仁政、福泽万民。",
