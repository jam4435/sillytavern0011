  "事件详情": "杨过被武氏兄弟按在地上痛打，郭芙在旁叫'用力打'。他咬牙强忍，双手在地下乱抓，突然摸到适才砸死的毒蛇，当即抓起挥舞。武氏兄弟见死蛇齐声惊呼，杨过趁机翻身一拳打得武敦儒鼻流鲜血，发足逃向试剑峰。武氏兄弟大怒追赶，郭芙也叫唤跟上。杨过奔到断崖前无路可走，回身喝道：'你们再上来一步，我就跳下去啦！'武修文却叫：'跳就跳，谁还怕了你不成？'杨过气血上冲正要踊身下跃，瞥见身旁有块大石搁得不牢稳，伸手搬开下面石块，跃到大石后用力推去。大石带着无数泥沙滚落，武氏兄弟吓得脸色变色急忙闪避，两人站立不住搂作一团翻滚六七丈，幸被大树挡住。黄蓉远远听得响声奔出，见泥沙飞扬女儿吓得哭不出声、武氏兄弟满头鲜血。郭芙在母亲怀中哭着将过错尽推在杨过身上，自己踏死蟋蟀和武氏兄弟打人之事全瞒过不说。郭靖寻遍山峰不见杨过，划小艇环岛巡绕直到天黑仍不见踪影。原来杨过缩身在岩石缝隙中不敢应声，挨着饥饿直到天黑才走出石缝。他望着精舍透出的灯光，想像六人围坐吃饭的情景，却又想到他们必在背后责骂自己，不禁气愤难当。他在山崖海风中思潮起伏，只觉世间人人对他冷眼相待。次日一早他悄悄下山捉青蛙充饥，耳听郭靖呼唤却以为是要捉他出去打。当晚在山洞中睡去，梦见欧阳锋教他练武，一觉醒来摸到头顶撞起疙瘩，回想梦中武功却一点也想不起。夜半时分听到郭靖海上长啸呼唤，终不由自主奔下峰去投入郭靖怀中。郭靖语音哽咽只道'快回去吃饭'。回到屋中对过去之事绝口不提。",
