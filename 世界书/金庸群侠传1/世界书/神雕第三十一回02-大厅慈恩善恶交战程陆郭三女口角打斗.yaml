  "事件详情": "大厅中裘千尺出言激兄报仇语气越来越严厉。一灯大师一言不发任凭慈恩自决。慈恩脑海中恩仇起伏善恶交争——望妹子、望师父、又望黄蓉，一个是同胞手足，一个是传法恩师，另一个却是杀兄之仇，心中这场火拼比生平任何一场恶战都更激烈。陆无双见杨过久出未归，扯程英衣袖悄步出厅。郭芙跟出以跛足之事讥讽陆无双，陆无双大怒也以断剑之事反唇相讥。郭芙拔耶律齐长剑攻去，陆无双拔柳叶刀回挡。郭芙武功虽在陆无双之上但口舌之争却远不及陆无双机灵，陆无双伶牙俐齿转弯抹角骂郭芙非郭靖黄蓉亲生之女。耶律齐劝郭芙多说话只有多出丑反被陆无双故意曲解令郭芙更加恼怒。郭芙盛怒之下运剑如风招招攻陆无双下盘存心要刺她右腿。程英见表妹不住倒退裙上已划破血痕，当即纵身上前双手一拦。郭芙剑刺程英当胸，程英伸出三指搭住剑刃平面使出弹指神通功夫轻轻一推将长剑荡开。郭芙又惊又怒挺剑欲刺，程英看准剑路劲蓄中指——铮的一声轻响将长剑弹落于地，左足踏剑玉箫指点郭芙腰间穴道一气呵成。耶律齐要夺玉箫时程英手臂回缩挽陆无双便走连跃三步已在数丈之外。郭芙见耶律齐称赞程英武功不禁醋意大发，耶律齐劝解后方才转嗔为喜。忽听得大厅中吼声连连铁器碰撞不绝，郭芙挂念母亲急忙奔回大厅。",
