  "事件引子": "回廊飞奔至后院，蒙面女郎遭围战。",
  "事件详情": "段誉在空寂的瓦房中寻人无果，忽听得后院方向传来女子清脆的娇叱之声，其中更夹杂着极为刺耳的兵刃破空锐响。段誉心头一震，循着声响穿过曲折回廊飞奔至后院草地，赫然目睹一场凶险的兵刃激斗。场中一名身穿黑裙、面蒙黑纱的神秘女郎，正跨骑在一匹神骏非凡的黑马背上，手舞一柄长软鞭激战四方。女郎仅露出一双如秋水般明亮的双眸，鞭招迅捷辛辣，漫天鞭影呼呼生风。围攻她的四名凶悍汉子分别手持单刀与短斧，武功配合颇为娴熟默契，层层进退将女郎连人带马死死困在垓心。段誉在草坪一侧看得心惊肉跳，见那女郎虽然鞭法精妙，但终究寡不敌众，招式间渐渐流露出难以支撑的疲态，情势岌岌可危。段誉秉持仁善悲悯之心，眼见流血惨剧将生，再也按捺不住，当即挺身而出高声大喊，呼吁双方住手罢斗，莫要因舞刀弄枪伤了和气，此举瞬间引得激斗双方侧目。",
  "事件概要": "起因：段誉循娇叱与兵刃破空声穿过回廊飞奔至后院，目睹一场凶险激斗。发展：蒙面黑衣女郎骑黑马舞软鞭力战四名持刀斧汉子，渐露疲态情势危急。结果：段誉不忍惨剧发生，挺身而出高声呼吁双方罢斗，引得激斗双方侧目。",
