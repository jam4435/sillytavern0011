  "事件引子": "四更残月如钩，沉寂深宅的绣帘内烛火如豆，素衣女子正对镜慢理云鬓。",
  "事件详情": "面对知情人证接连惨遭灭口、天下群豪群起栽赃的凶险绝局，乔峰陷入绝境愁眉不展。阿朱感念其深情大义，决意以身犯险替他分忧。阿朱取出随身携带的易容箱匣，精调特制油彩，以胶泥垫高额骨肩背，黏贴上霜白长髯，换上一袭染有九只布袋的破旧宽袍，将自身神态举止乃至眼神步履，化装得与丐帮执法长老白世镜分毫不差。借着四更浓重夜色，阿朱如灵猫般翻过朱红高墙，悄无声息潜入马大元宅邸深处的雕花内室。幽暗闺阁内烛火如豆，马大元遗孀康敏正对镜卸妆，阿朱立于暗处屏息凝神，蓦地运起内力，模仿出白世镜特有的苍老沉郁嗓音冷冷低语：“夫人深夜独坐，可是在等老夫？”康敏闻声娇躯微颤，回首瞥见白世镜负手而立的身影，非但不见惊慌，反倒眼波横流、敛衣轻笑，毫无防备地将身子斜倚在软榻之上。阿朱强压胸中怦怦心跳与反胃之感，跨前一步沉声逼问马大元生前留存的雁门关秘信详情。至此，阿朱借假身份成功瞒过毒妇法眼，正式将暗夜套话的心理险局推向生死交锋的核心。",
  "事件概要": "为替乔峰排忧查明带头大哥真相，阿朱精妙化装成丐帮执法长老白世镜，借浓重夜色潜入信阳马宅内室。面对对镜卸妆的康敏，阿朱模仿白世镜声线出言试探，康敏未识破破绽且极尽媚态相迎。阿朱强压反胃沉声逼问雁门关密信隐情，顺利拉开套取仇家绝密的交锋帷幕。",
