  "事件引子": "大辽北境林莽间积雪皑皑，深处忽传来阵阵苍凉号角与骏马踏雪的奔腾轰鸣。",
  "事件详情": "在女真部落度过严寒冬春之后，阿紫在悉心调养下伤势已然痊愈，乔峰为了探寻身世及寻找契丹族人的根脉，决定携阿紫离开部落，向着辽国腹地踏雪进发。完颜阿骨打率部众依依惜别，赠予车马辎重。乔峰与阿紫顶风冒雪，一路向北前行数日，行至大辽北界的一片草原森林之中。林间积雪皑皑，乔峰勒住缰绳，忽听得林莽深处传来阵阵号角与骏马奔腾之声。放眼望去，前方雪原边缘旌旗招展、甲胄森然，大批精锐的契丹皇室近卫军正排开阵势，簇拥着中央一辆华贵金顶猎车与数名显赫贵胄。乔峰与阿紫隐于林木暗处凝神观瞧，见队伍中为首之人头戴貂冠、身着华丽刺绣明黄龙袍，气度威严非凡，正弯弓引箭追射猎物，身旁的随从侍卫严密护卫，正是大辽国当朝皇帝耶律洪基在此大举围猎。乔峰初入大辽国境，目睹本族皇帝出猎气象，心中思潮起伏，勒马驻足静观其变。此时四周林莽雪野看似宁静，却已隐隐透出一股不同寻常的杀伐肃杀之气，乔峰与阿紫停驻在林缘暗中观察，未曾料到一场惊天刺杀已迫在眉睫。",
  "事件概要": "阿紫伤愈后，乔峰辞别完颜阿骨打携妹入辽寻根。二人行至北境雪原，隐于林缘目睹大辽皇帝耶律洪基率皇室禁卫大举围猎、引弓逐兽的威严盛景；乔峰初见本族君王气象心潮起伏，亦敏锐察觉四周林莽正暗伏异样杀伐之气。",
