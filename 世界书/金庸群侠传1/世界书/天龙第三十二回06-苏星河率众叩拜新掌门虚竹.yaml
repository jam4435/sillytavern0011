  "事件详情": "虚竹目睹师尊离世，悲痛万分地跪地叩拜行礼，随后强忍哀伤收拾心神，手持画像、佩戴着七宝指环迈步走出石洞。守候在洞外的苏星河及“函谷八友”等弟子见虚竹安然步出，目光瞬间落在了虚竹手指上那枚散发着奇异光芒的七宝指环之上。苏星河见信物如见掌门先师，深知师尊已然将毕生神功与掌门大位尽数托付给了眼前这名少林小僧。苏星河神色大变，满怀敬畏与悲喜，当即整理衣冠率领身后的函谷八友全体弟子齐刷刷跪倒在虚竹面前。众人神情肃穆庄严，毕恭毕敬地向新掌门虚竹行三跪九叩的大礼，高呼参拜掌门师叔，正式承认了虚竹在逍遥派内的至高领袖地位。虚竹虽感不知所措，但七宝指环的归属与八友的臣服叩拜，标志着逍遥派门派权力的平稳交接，虚竹正式确立了新任掌门的尊崇身份。",
