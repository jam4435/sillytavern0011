  "事件详情": "杨过从宜城酒楼奔出后放开脚步狂奔——数日间不食不睡如一股疾风卷掠而过。心力交瘁之际到了大江之滨纵身跃上商船，在舟中白日醉酒月夜长啸不知时日之过。船抵江阴时听到'嘉兴'二字猛地想起父亲当年在王铁枪庙中惨死——'竟连骸骨也四散无存了？'当即舍舟上陆。时值隆冬天降大雪——杨过身披蓑衣头戴斗笠踏雪南行第三日到了嘉兴。深夜冒雪来到破败的王铁枪庙，见神像毁破蛛网灰尘悄立殿上倍增苦悲。在庙后发现杨康之墓——碑上刻着'不肖弟子杨康之墓不才业师丘处机书碑'。杨过大怒——丘处机忒也无情人已死了何必立碑彰过。正欲拍碑时听到西北方雪地传来奇怪脚步声——沙通天侯通海彭连虎灵智上人四人以铁链相连撑拐杖而来。四人被周伯通擒住监禁终南山重阳宫三十余年——十六年前蒙古武士火焚重阳宫时趁乱逃出隐居江南荒僻乡村。因柯镇恶路过被截住——柯镇恶许以九花玉露丸换取宽限回嘉兴报信。柯镇恶依约前来昂然而立凛然说道'柯镇恶守约而来特来领死'。四人欲击毙柯镇恶时杨过纵出——一瞬之间提柯镇恶以神像替换自己位置。抓住柯镇恶质问为何背后毁谤先父。柯镇恶毫不动摇——将杨康认贼作父卖国求荣害死江南五怪、终在铁枪庙掌击黄蓉自取其死的往事原原本本说了。沙通天彭连虎证实当年经过。杨过抱头在地悲愤难言——想不到生身之父竟如此奸恶。良久后杨过向沙通天令他们动手履行与柯镇恶的生死之约——四人不敢动手诺诺而退。杨过救了柯镇恶性命又顾全他面子。柯镇恶告知郭襄已被蒙古军擒获。杨过托柯镇恶为父亲重立墓碑——'先父杨府君康之墓不肖子杨过谨立'。柯镇恶一怔随即会意：'你之不肖远胜于旁人之肖了。'",
  "事件概要": "杨过知悉杨康卖国害友之过并为父重立墓碑，也得知郭襄已被蒙古军擒去。",
