  "事件引子": "殿内檀香幽微，众俊彦竞答方歇，侍女忽执名册遥遥指向偏隅静立的丑僧。",
  "事件详情": "在殿内众青年才俊竞答告一段落后，侍女手持名册指向了站在角落、相貌丑陋憨厚的虚竹。虚竹本无意争夺驸马权贵，只是陪同段誉而来，骤然被点名受问，顿时面红耳赤、局促难安。面对侍女抛出的三道私密考题，虚竹谨守出家人“不打妄语”之戒律，只得双手合十，结结巴巴却极其坦诚地当众答道：自己平生最快乐之处，乃是在一处伸手不见五指的极乐冰洞之中；生平最心爱之人，自己因身处暗室从未见过其容颜，不知她是美是丑；至于那心爱之人的闺名更是全然不知，平日相处时只唤她为“梦姑”，而她则唤自己为“梦郎”。这番纯朴至极的真言一出，幽暗珠帘后蓦地传出一声颤抖失声的女子娇呼，紧接着是白玉茶盏失手坠地摔得粉碎的清脆声响！银川公主李清露在帘后泪如泉涌，当即命侍女当众宣布招纳虚竹为西夏驸马。地上一地碎玉茶屑，昔日冰洞中相许相念的梦郎与梦姑，终于在皇宫大殿前拨云见日、欣喜重逢。",
