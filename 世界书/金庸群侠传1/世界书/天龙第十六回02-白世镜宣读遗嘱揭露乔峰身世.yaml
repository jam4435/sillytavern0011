  "事件引子": "遗嘱当众宣读确认契丹身世，乔峰惊怒反驳陷入信任危机。",
  "事件详情": "执法长老白世镜手捧汪帮主的绝密遗书，脸色沉重至极。他缓缓拆开火漆信封，在杏子林全场群豪的屏息注视下，提气朗声宣读遗书内容。信中字句铿锵却如惊雷落地：原来现任丐帮帮主乔峰竟是契丹异族后裔，根本不是中原汉人族类！汪剑通在信中阐明，自己当年深知乔峰的身世根源，时刻忧心其日后会背叛大宋、为害中原武林，故而在弥留之际立下绝密遗嘱——倘若乔峰将来胆敢怀有反叛大宋或为大辽效力之图谋，丐帮上下无论何人，皆当同心协力、合力共诛之！这番遗言宣读完毕，全场数百名丐帮弟子与中原英雄尽皆目瞪口呆，震撼难言。乔峰如遭五雷轰顶，高大身躯剧烈颤抖，神情惊怒交加，当场厉声怒吼反驳，坚称自己生于大宋、长于大宋，乃是堂堂正正的大宋男儿，绝无可能是契丹胡虏。汪帮主绝笔遗命由此大白于天下，林中群豪与乔峰瞬间陷入剧烈的信任危机之中。",
  "事件概要": "起因：白世镜手捧绝密遗书拆开火漆，在全场屏息注视下提气朗声宣读遗嘱内容。发展：遗书中明确指出乔峰乃契丹异族后裔且汪帮主立嘱若其叛宋则丐帮上下共诛之，群豪闻言目瞪口呆。结果：乔峰如遭雷击身躯剧颤并厉声怒吼反驳坚称大宋男儿，群豪与乔峰瞬间陷入剧烈信任危机。",
