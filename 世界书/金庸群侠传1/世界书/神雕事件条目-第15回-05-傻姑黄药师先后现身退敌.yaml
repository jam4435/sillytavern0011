  "事件详情": "正当李莫愁歌声凄婉惨厉之极的当口，突听茅屋外一人哈哈大笑拍手踏歌而来，唱的是天真烂漫的儿歌：'摇摇摇，摇到外婆桥，外婆叫我好宝宝，糖一包，果一包，吃了还要拿一包。'歌声中充满欢乐，李莫愁的悲切之音登时受扰。来人是个蓬头乱服的中年女子，双眼圆睁嘻嘻傻笑，手中拿着一柄烧火用的火叉——正是傻姑。程英大喜叫道：'师姊，这人要害我，你快帮我。'傻姑浑浑噩噩向来不知愁苦烦恼，李莫愁的悲音给她乱七八糟的儿歌一冲反而连杨过等也制不住了。李莫愁大怒挥拂尘迎头击去。傻姑火叉平胸刺出，这一叉破空之声甚是劲急，李莫愁不禁大惊急忙绕步向左。傻姑不理敌招如何挺叉直刺，李莫愁拂尘倒转卷住叉头运劲急甩火叉竟不摇动，转眼间已刺到她双乳之间，总算百忙中一个'倒转七星步'从墙壁破洞中反身跃出避开了这势若雷霆的一击。李莫愁又跃进茅屋纵身从半空击落，傻姑以不变应万变仍是挺叉平刺——三手攻击每一手都暗藏九般变化十二着后招竟被她一叉平刺尽数消解。她哪知傻姑的叉法来来去去只有三招，只道对方武功深不可测心下大怯。李莫愁转身要从墙壁缺口中跃出，却见破口旁已坐着一人——青袍长须，正是桃花岛主黄药师。他凭几而坐矮几上放着程英的瑶琴。李莫愁对战时眼观六路耳听八方，但黄药师进屋取琴坐地她竟全没察觉。黄药师在琴上弹了一响纵声唱道：'问世间，情是何物，直教生死相许？'唱的居然就是李莫愁那一曲。琴上只剩一根'羽弦'，他却在这一根弦上弹出宫商角徵羽诸般音律，琴韵悲切更远胜于她的歌声。黄药师琴歌相和忽而欢乐忽而愤怒瞬息数变，引她忽喜忽悲忽怒忽愁，眼见这一曲唱完李莫愁非发狂不可。便在此时傻姑一转头突然见到杨过，烛光之下看来宛然是他父亲杨康。傻姑最怕鬼魂，急跳而起指着他道：'杨……杨兄弟，你别害我……你不是我害死的……'黄药师不提防她旁里横加扰乱，铮的一声最后一根琴弦竟也断了。傻姑躲到师祖身后大叫：'鬼……鬼……爷爷，是杨兄弟的鬼魂。'李莫愁得此空隙急忙挥拂尘打熄烛火从破壁中钻了出去。黄药师未能制其死命终于给她逃脱，自顾身份已不能出屋追击。黑暗中傻姑更是害怕叫得更加响了：'是恶鬼，爷爷，打鬼，打鬼！'黄药师喝住傻姑，程英打火点亮蜡烛拜倒在地向师父见礼，将杨过与陆无双的来历简略说了。",
