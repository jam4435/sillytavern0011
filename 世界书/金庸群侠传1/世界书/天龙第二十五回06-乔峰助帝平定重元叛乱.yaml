  "事件详情": "结义之后，大辽局势依然凶险异常，皇太叔耶律重元在后方倚仗叛军大营，企图继续发动全面叛乱篡夺大辽皇位。耶律洪基与乔峰商定必须以雷霆手段迅速掌控军权，以绝后患。耶律洪基持天子信符，在乔峰的严密护卫与协助下，秘密联络并调集忠于皇室的各路兵马与部落勤王大军。乔峰临危不乱，亲随辽帝坐镇军中调度，以其威震敌胆的声威与高超武艺稳定军心，指挥皇室铁骑向耶律重元的叛军主力发起反击。皇室大军在乔峰与辽帝的统领下军威大振、势如破竹，叛军阵线在勤王大军的铁蹄冲杀与乔峰的强力弹压下节节溃败。面对忠义之师的雷霆攻势，耶律重元部署的叛乱势力土崩瓦解，叛首耶律重元篡位阴谋彻底破产。在乔峰的倾力协助下，皇室大军彻底肃清并平定了耶律重元的反叛势力，大辽江山重归一统，辽帝耶律洪基彻底扫除内患、重掌辽国至高皇权，大获全胜班师回朝。",
  "事件概要": "耶律洪基持天子信符调集勤王大军发起反攻。乔峰亲随辽帝坐镇军中弹压防线，以盖世威名与绝顶武功稳定军心，统领皇室精锐铁骑冲阵破敌。叛军阵线在雷霆攻势下溃败瓦解，耶律重元篡位之谋破产，皇室大军彻底肃清叛逆，辽帝重掌大辽至高皇权。",
