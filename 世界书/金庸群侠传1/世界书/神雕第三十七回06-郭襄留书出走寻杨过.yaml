  "事件详情": "傍晚时分武氏兄弟派快马回报南阳大军粮草被一焚而尽火药爆炸炸死不少蒙古兵将，襄阳满城狂喜'神雕大侠'四字挂人口说个不停。当晚郭靖夫妇应吕文德之邀赴署中商议军情直至深夜方回。郭襄听了母亲讲述往事睡去后恶梦连连——一会儿见杨过挥剑自杀将另一条手臂也斩断了，一会儿又见他自千丈高崖跃下跌得血肉模糊。满身冷汗醒来后坐在床上细细思量：大哥哥给了自己三枚金针眼下还剩一枚，正好持此相求要他千万不能自尽——他是豪侠之士言出必践。于是留了一封短简写道'女儿去劝杨大哥千万不要自寻短见劝得他听了之后女儿即归'，当即悄悄出城。次日清晨耶律齐郭芙郭破虏依例请安良久不见郭襄到来——黄蓉担心命丫鬟去瞧发现郭襄昨晚没回房安睡。黄蓉到女儿房中察看见随身衣物兵刃银两一件未带正在奇怪，忽见枕底露出白纸一角——抽出读后呆在当地做声不得。知道杨过除了小龙女之外谁的话也不听，但襄阳军情危急不能为儿女之私轻身涉足江湖。与郭靖商议后写了四通恳切书信分交八名得力丐帮弟子分四路出去寻找郭襄。",
