  "事件详情": "杨过与黄药师离了襄阳展开轻功向南疾趋，卯末辰初已到宜城。两人上酒楼点酒菜共叙契阔。黄药师说起程英陆无双十余年来隐居嘉兴以傻姑为伴。杨过说道十多年来到处探访黄药师所在——想请问一件事。正要回答时楼梯脚步声响上来三人：潇湘子、尹克西和一个面目黝黑的黑脸汉子。潇湘子尹克西见到杨过愕然止步便欲下楼。杨过轩眉笑道'故人久违何以匆匆便去'。黑脸汉子不知厉害伸出大手抓向杨过肩头——杨过反手打了他个耳光，接着拍拍连响潇湘子左右双颊也均中掌。黄药师暗惊这一掌打得好快。杨过要借三武士引黄药师展示南海神尼武功——展开黯然销魂掌法将三人裹在掌风之中身不由主如陷洪涛巨浪。黄药师以落英神剑掌回掌推动三人你来我往。黄药师的弹指神通与杨过黯然销魂掌斗了个旗鼓相当。杨过顺势问起南海神尼——黄药师奇道那是谁啊从没听过此人的名头。杨过脸色大变站起身颤声追问——黄药师说莫非是近年新出道异人老夫孤陋寡闻未闻其名。杨过呆立不动一颗心似欲从胸腔中跳出——'郭伯母说得明明白白说龙儿蒙南海神尼所救原来尽是骗人的鬼话都是骗我的'。仰天一声长啸震动屋瓦双目中珠泪滚滚而下。向黄药师一揖到地哽咽道歉后长袖扬起转身下楼——喀喇喀喇楼梯踏级尽数踹坏。黄药师茫然不解喃喃自语。",
