  "事件引子": "杏林中静得落针可闻，徐长老肃穆托起火漆密函，数道凝重目光齐齐聚焦其上。",
  "事件详情": "杏林之中万籁俱寂，徐长老神色凝重地托起汪帮主生前留下的绝密信函，与智光大师、谭公当众核验完好无损的火漆印鉴，随后撕开信封。智光大师宣了一声佛号，面带悲悯与愧疚，缓缓揭开三十年前雁门关外那场惨绝人寰的伏击血案：中原武林二十一位高手受奸人误导，在乱石谷截杀无辜契丹武士夫妇，那一战血肉横飞，契丹勇士以绝顶神功连毙十余名中原豪杰后抱妻跳崖，唯独留下一名襁褓中的男婴，而那男婴正是由少林与汪帮主收养长大的乔峰。智光大师言辞确凿，指出契丹萧氏族人自幼便在胸膛刺有狼头图腾。乔峰闻言如遭五雷轰顶，气血翻涌间退后数步，为证清白猛然伸手扯碎前襟青袍，只见其宽阔胸膛上赫然盘踞着一头凶悍狰狞的青黑狼头刺青！铁证当前，徐长老当众高声宣读汪帮主遗书：“若乔峰有亲辽反汉之意，全帮共诛之！”密信在长老间传阅坐实，乔峰三十年凝聚的汉家英雄信仰瞬间崩塌，由受人敬仰的丐帮之主沦为遭群雄唾弃的异族胡虏，陷入身世与命运的绝境深渊。",
  "事件概要": "徐长老与智光大师、谭公当众验拆汪剑通遗函，智光揭示三十年前雁门关惨案及契丹遗孤隐秘。乔峰撕衣自证却赫然显露胸前狼头刺青，徐长老继而宣读严防其叛汉必诛的遗书，契丹异族铁证如山，乔峰身世信仰彻底崩塌。",
