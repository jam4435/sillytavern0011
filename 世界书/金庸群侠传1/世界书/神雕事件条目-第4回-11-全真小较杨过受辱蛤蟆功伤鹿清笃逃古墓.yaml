  "事件详情": "这天腊月望日是全真教小校之期，王处一门下由大弟子赵志敬主持。杨过入门最迟位居末座，眼见不少与自己年纪相若的小道士武艺精熟各有专长并无羡慕之心却生怀恨之意。赵志敬有意使他出丑，叫杨过出来与之前比武得胜的小道士比试。杨过说不会丝毫武艺，赵志敬怒道传了大半年功夫怎说不会？当场考杨过口诀——杨过滚瓜烂熟背出'修真活计有何凭'等句一字不差。赵志敬便命他用这些口诀下场过招。众道只道杨过临试怯场，好心的出言鼓励幸灾乐祸的嘲讽讪笑。杨过把心一横纵跃入场双臂舞动直上直下乱打。小道士斜身出足一招风扫落叶将他扫倒跌得鼻血长流。杨过翻身爬起低头猛扑抱住对方左腿，被一拳击中肩头。他愈败愈狠一头撞正对方右腿将小道士压倒在地抡拳狠打。小道士借势跃起反手将他摔了一交。杨过势若疯虎越战越勇——他在终南山上受了大半年怨气此时尽情发泄。小道士武功远胜于他却哪有这般旺盛斗志？被追得在场中绕圈奔逃。杨过在后疾追乱骂臭道士。旁观众道上百人中十有八九是道士听他这么骂法又好气又好笑。正没做理会处，胖大道人鹿清笃窜出一把抓住杨过后领提起啪啪啪三记耳光打得他半边面颊登肿。杨过本已打豁了心更知与鹿清笃有仇料无幸理。鹿清笃一阵狞笑又要打落，崔志方看出杨过出手之际竟似不会半点本门功夫又知赵志敬心地狭隘，恐防打伤人便喝住了鹿清笃。崔志方柔声问杨过怎不好好习武，杨过恨恨说'他根本没教我半点武功'。崔志方假意发怒随手在杨过肩头一推——但觉他肩头微侧内力自生竟把推力卸开一小半，心头疑云大起：他小小年纪入门不过半年怎能有此功力？杨过以为崔志方也要出手，低头向他小腹撞去。崔志方让开命鹿清笃与杨过上招。鹿清笃巴不得有这句话，左掌虚拍右掌虎门手正中杨过胸口，右拳再击面门左拳打中小腹，掌缘猛斩正中项颈——一下比一下重。崔志方已知杨过确是不会武功喝止。鹿清笃问杨过服不服，杨过骂'贼道士终有一日要杀了你'。鹿清笃大怒两拳连击在杨过鼻梁之上。杨过被殴得昏天黑地摇摇晃晃就要跌倒，不知怎地忽然间一股热气从丹田直冲上来——危急拼命之际蛤蟆功内力骤然迸发——双腿一弯口中阁的一声叫喝手掌推出正中鹿清笃小腹。鹿清笃一个胖大身躯平平飞出腾的一响跌在丈许之外直挺挺躺在地下再也不动。旁观众道见鹿清笃以大欺小毒打杨过本有不平之意，哪知奇变陡生人人惊愕。杨过知闯下大祸撒腿便奔。赵志敬立传号令命众人分头追拿。杨过慌不择路专拣树多林密处钻去，偷钻过灌木丛甩开众道。奔到全身酸软实在跑不动坐在石上喘气。忽听身后嘿嘿冷笑，回头便见赵志敬长须垂胸横眉怒目站在身后。杨过拾起石子用力掷去，狂奔至一道深沟前更不思索便纵身跃下滚进树丛。赵志敬绕道寻来已不见杨过踪迹，越行树林越密蔽不见日光。看到地下一块石碑上刻着'外人止步'四字——正是重阳祖师昔年所居活死人墓禁地。赵志敬高叫杨过不出来就活活打死。突然林中嗡嗡异声灰色晃动——一群白色蜂子从树叶间飞出扑来。赵志敬双袖飞舞护住全身，蜂群分为二前后夹攻，终有两蜂钻进空隙在他右颊上各蜇一针。片刻间麻痒难当似乎五脏六腑也在发痒，赵志敬立足不定倒在林边草坡上滚来滚去大声呼叫。蜂群在他身畔盘旋一阵便飞回林中。",
  "事件概要": "杨过受尽羞辱后以蛤蟆功伤鹿清笃并逃入古墓，全真门下之路至此断绝。",
