  "事件引子": "旌旗蔽日万骑围帐，皇太叔重元率十万叛军弑君谋反。",
  "事件详情": "辽帝耶律洪基正沉浸于围猎之乐，皇室近卫军亦放松了戒备。殊不知大辽皇太叔耶律重元与其子楚王耶律涅鲁古早已密谋篡位造反，暗中在此布下了天罗地网，欲将当朝皇帝一举诛杀于荒野林莽之中。伴随着一声凄厉呼啸，四周茂密深雪与草丛间骤然杀出数百名黑衣叛军死士。伏兵手持特制强弓硬弩与幽蓝淬毒兵刃，四面八方发动悍然行刺。一时间箭如雨下，毒矢破空呼啸，皇室近卫军猝不及防，在毒箭连环齐射之下纷纷中箭落马、死伤殆尽，护卫阵型瞬间土崩瓦解。耶律洪基惊怒交加，拔刀御敌，但死士攻势狠辣疯狂。乱箭之中，辽帝坐骑惨嘶一声被数支强弩射倒在地，耶律洪基翻滚落马，周身亦中数支淬毒利箭，龙袍染血，剧痛之下力不能支。数十名手持涂毒钢刀的叛军死士迅速踏雪合围，面露狰狞逼近。辽帝身边的近卫死伤殆尽，耶律洪基身负重伤倒伏雪地，被数十名叛军死士重重包围，命悬一线，大辽皇权瞬间陷入倾覆死局。",
