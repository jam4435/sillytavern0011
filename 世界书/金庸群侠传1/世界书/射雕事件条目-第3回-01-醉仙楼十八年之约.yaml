  "事件引子": "法华寺内的误会刚刚澄清，江南七怪却不甘心就此落败，柯镇恶正要向丘处机再争高下。",
  "后续事件": {
    "事件名": "第5回-04-弯弓射雕",
    "描述": "江南七怪远赴大漠，开始寻找郭啸天的后人。"
  },
  "事件详情": "在法华寺，丘处机与江南七怪因一场误会大打出手，两败俱伤。待误会澄清后，双方都对自己的鲁莽感到懊悔。然而，心高气傲的江南七怪不甘心就此落败，柯镇恶提出要与丘处机再决高下。丘处机心念一动，提出了一个别开生面的“赌赛”：各自寻访郭啸天和杨铁心的遗腹子，并收为徒弟，用心传授武艺。待十八年后，让两个孩子在嘉兴醉仙楼比武，以定胜负。此赌约不仅比拼武功，更是对恒心、毅力和智谋的考验。江南七怪被丘处机的豪言壮语所激励，尤其是他那句'岂知今日一见，嘿嘿！这叫作浪得虚名，见面不如闻名！'更是激起了他们的好胜之心。最终，柯镇恶代表众人应下赌约。双方约定，十八年后的三月廿四，在醉仙楼相会，让天下英雄见证这场旷世豪赌。",
  "事件概要": "以郭杨遗孤比武定胜负的十八年赌约正式成立，丘处机与江南七怪自此各负一条人生长约。",
