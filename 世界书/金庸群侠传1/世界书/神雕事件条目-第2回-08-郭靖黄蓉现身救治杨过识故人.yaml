  "事件详情": "欧阳锋正说要带杨过走时，空中忽然几声雕唳，双雕飞掠而过。欧阳锋向双雕呆望，突然脸色大变叫道'我不要见他们'，一步跨出已在丈许之外，连跨十来步便在桑树林后消失了。杨过随后追去，绕过柳树时双雕从身后扑过向前飞落，柳树林后转出一男一女——男的浓眉大眼胸宽腰挺三十来岁，女的约莫二十六七容貌秀丽双目灵活。此二人正是郭靖黄蓉夫妇。原来这日两人在茶馆打听黄药师消息时，忽见陆家庄方向烈焰冲天赶去查探，只见庄子已成火窟、几具焦尸面目难辨。黄蓉断言是仇家放火非寻常火烛。二人绕庄巡视见到墙上几个血手印，郭靖脱口而出'赤练仙子'。在池塘旁见到两枚冰魄银针，黄蓉取树枝夹起用手帕包裹放入衣囊。继续搜寻时遇上了杨过——郭靖见他左手全成黑色，惊问'你也中了这毒？'黄蓉抢过查看，忙捋高其衣袖取小刀割破手腕推挤毒血，却见血呈鲜红之色大感奇怪（她不知杨过已将毒血逼向指尖）。黄蓉取出一颗九花玉露丸让杨过嚼碎吞下，一股清凉直透丹田。她又取两粒药丸喂双雕各服一丸医治爪伤。郭靖见少年眉目间甚似一个故人，心念微动却一时想不起是谁。",
