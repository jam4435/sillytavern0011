  "事件引子": "风雪连天极北荒原，乔峰运神功采山参为阿紫续命。",
  "事件详情": "乔峰背负着经脉尽断、周身瘫痪且高烧昏迷的阿紫，顶着漫天狂风暴雪，艰难踏入千里冰封的长白山极北荒原。为保住阿紫悬于一线的微弱生机，乔峰当务之急需在这绝地搭建安身疗伤之所。他沉腰发力，运起刚猛掌力如利刃般接连劈断数十株坚硬古松，再以浑厚掌风卷起积雪冻土封堵风隙，以枯枝干草为顶，在背风岩壁下迅速筑成一座御寒草庐。听闻阿紫咽喉中发出痛苦微弱的呻吟，乔峰低声宽慰：“阿紫莫怕，姐夫定救你。”随即便迎着呼啸冰风，徒手攀上陡峭冰封的万丈悬崖，在冻岩雪窝中仔细刨掘，终于采得数支生机饱满的野山参。回到草庐内，乔峰先将老山参切片捣汁喂入阿紫口中吊住心脉，紧接着毅然盘膝坐于其身后，双掌稳稳按住阿紫背心大椎穴，抱元守一，倾尽自身磅礴精纯的真气为其推宫过血。在滚滚真气的引导与逼迫下，阿紫周身郁结的剧毒被强行化解，嘴角溢出一缕紫黑污血，微弱的呼吸与脉搏终于平稳复苏。至此，乔峰在极寒雪山中成功筑起立足之所，阿紫的恶化伤势得以彻底稳固。",
  "事件概要": "乔峰携瘫痪阿紫在长白山深山伐木筑屋（起因）；每日攀绝壁挖老参煎汤喂服（发展）；阿紫内伤大有起色（结果）。",
