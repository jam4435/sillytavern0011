  "事件引子": "杏林间丐帮争执未休，忽有急促马蹄与怪笑撕破林涛，上风处微风悄然倒卷。",
  "事件详情": "乔峰悲愤辞别杏子林后，群雄与丐帮长老正为帮主废立与契丹疑云争执不下，西夏一品堂大队精锐在赫连铁树统领下，伙同“四大恶人”中的云中鹤与岳老三突袭而至，欲将中原豪杰一网打尽。西夏武士未及正面交锋，便暗中将无色无臭的绝毒“悲酥清风”置于微风上风处释放。毒烟随风在林间悄然弥漫，徐长老、全冠清正欲拔刀整队迎敌，忽觉双目刺痛、泪水如泉涌出，周身真气如冰雪消融般顷刻溃散，筋骨酸软倒地。岳老三怪笑连连，挥动手中鳄尾剪狂暴扑入，云中鹤展开轻功穿梭点穴；宋长老与奚长老咬牙运劲试图拔刀抵御，却觉手足酸软如绵，兵刃接连当啷坠地。王语嫣虽通晓天下武学，连声高呼指点破绽，奈何毒力发作亦软倒在地。群雄明知中计却闭气不及，内力尽失之下完全丧失反抗余地，只能坐视西夏武士肆意欺凌封穴。最终丐帮数百名精锐弟子及长老尽数瘫软受制，王语嫣、阿朱、阿碧等一众女眷悉数被俘；西夏武士用坚韧牛皮索将动弹不得的群雄尽数反剪捆绑串联，浩浩荡荡押往天宁寺严密监禁，杏子林中唯余满地狼藉的残破刀剑与帮旗。",
  "事件概要": "赫连铁树率西夏一品堂武士突袭杏子林，暗施奇毒“悲酥清风”。丐帮群雄与在场女眷猝不及防，内力尽失、周身酸软瘫倒。岳老三与云中鹤趁乱扑杀点穴，众人无力抵御尽数受制被擒，随后被西夏军士以牛皮索反剪串联，悉数押往天宁寺囚禁。",
