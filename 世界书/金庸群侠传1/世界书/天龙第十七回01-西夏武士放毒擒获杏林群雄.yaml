  "事件引子": "杏林间丐帮争执未休，忽有急促马蹄与怪笑撕破林涛，上风处微风悄然倒卷。",
  "事件详情": "乔峰悲愤辞别杏子林后，西夏一品堂在赫连铁树统领下突袭，暗中释放悲酥清风。毒烟弥漫，群丐与在场女眷纷纷泪流不止、筋骨酸软。宋、奚二长老欲拔刀抵御，却失力倒地；受制的全冠清亦无力脱身。岳老三与云中鹤率西夏武士趁乱擒人，丐帮长老、弟子及阿朱、阿碧等人被绑，押往天宁寺。王语嫣中毒倒在草丛，尚未被押走；段誉因百毒不侵，正趁乱设法救她。",
  "事件概要": "赫连铁树率西夏一品堂武士突袭杏子林，暗施奇毒“悲酥清风”。丐帮群雄与在场女眷猝不及防，内力尽失、周身酸软瘫倒。岳老三与云中鹤趁乱扑杀点穴，群丐及阿朱、阿碧等人无力抵御被擒，随后被西夏军士押往天宁寺；王语嫣虽中毒倒地，尚未被押走。",
