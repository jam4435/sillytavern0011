  "事件详情": "杨过昏迷中忽觉有人在他胸口推拿，慢慢醒转睁开眼来，只见黑影闪动，有东西从窗中窜了出去。他勉力站起到窗口张望，只见屋檐上倒立着一人头下脚上身子摇摇摆摆——正是日间要他叫爸爸的那个怪人欧阳锋。杨过惊喜交集叫了声'是你'，欧阳锋道'怎么不叫爸爸？'杨过叫了声'爸爸'，心中却想'你是我儿子，老子变大为小，叫你爸爸便了'。欧阳锋叫他上屋顶，杨过中毒后身子虚弱手指没攀到屋檐便掉了下去，欧阳锋伸手抓住他背心将他轻轻放在屋顶。正待说话听得西边房里有人吹灭烛火，知道被人发现，当下抱起杨过疾奔而去。待得柯镇恶跃上屋时，四下里早已无声无息。欧阳锋抱杨过奔到镇外的荒地放他下来，叫他用所教法门再逼些毒气出来。杨过依法而行，约莫一盏茶时分手指上滴出几点黑血，胸臆间大为舒畅。欧阳锋抚摸他头叹道'你这孩儿甚是聪明，一教便会，比我当年亲生的儿子还要伶俐'，想到亡故的儿子欧阳克眼中不禁湿润。杨过自幼失去双亲处处遭人白眼，欧阳锋与他素不相识却对他这等好法，心中极是感动，纵身一跃抱住他脖子连叫两声'爸爸'——他终于拿欧阳锋当真当他是亲父了，在这两声'爸爸'之中满腔孺慕尽情发泄。欧阳锋大叫大笑，当即蹲低身子施展蛤蟆功，双手推出轰的一声巨响面前半堵土墙应手而倒灰泥弥漫。杨过瞧得目瞪口呆问道'那是甚么功夫？'欧阳锋道'这叫做蛤蟆功，只要你肯下苦功，自然学得会'，随即将修习蛤蟆功的入门心法传授了杨过。这蛤蟆功是天下武学绝顶功夫，变化精微奥妙无穷，当年欧阳锋连亲生儿子欧阳克亦未传授，此刻却因心绪激动神智迷糊不分轻重地教了这新收的义子。杨过武功没有根底，虽记住了口诀却领会不得其中精义，瞎缠歪扯强作解人，惹得欧阳锋恼将起来要打他耳光，月光下见他面貌俊美甚是可爱，尤胜当年欧阳克少年之时，这一掌便打不下去了。杨过不愿回郭靖身边愿跟着他，欧阳锋道'我的脑子有些不大对头，只怕带累了你。我把一件事想通了咱爷儿俩再厮守一起永不分离'。杨过哽咽道'那你早些来接我'。欧阳锋允诺暗中护着他，当下抱杨过送回客店。",
