  "事件引子": "灵鹫宫大殿外终年风雪漫卷，殿内铜炉沉香静燃，青石长阶肃穆森然。",
  "事件详情": "萧峰当年在雁门关前自尽殉难之前，深恐丐帮镇帮绝技‘降龙十八掌’与‘打狗棒法’自此湮灭无闻，曾预先将两大神功倾囊传授给结义二弟虚竹，并殷切托付其在日后代为挑选品行出众的丐帮后辈传人。数年之后，丐帮新任掌门少年英雄脱颖而出，为承续本帮不世绝学，特意手捧丐帮信物打狗棒与仅存的降龙十八掌图谱残卷，远涉万里风雪冰川，历经艰难险阻登上天山缥缈峰拜谒虚竹。少年掌门风尘仆仆抵达灵鹫宫大殿，双手高高举起翠绿的打狗棒与残缺图谱，神态庄重肃穆地向虚竹躬身大拜，恳切诉说本帮道统危殆之境况与求教之诚意。虚竹见这位少年英雄英气勃发、双目澄澈而满怀正义之气，心中不由得大为欣慰，深感大哥萧峰托付之信赖得以落实。虚竹当即快步走下石阶，亲手将少年扶起，并小心接纳了递交而来的信物。虚竹当场承诺必不负结义大哥生前重托，决意引其入宫倾囊相授，由此正式开启了丐帮绝学传承的序幕。",
