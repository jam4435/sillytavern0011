  "事件引子": "小镜湖畔细雨霏霏，青翠竹林笼罩烟雨，竹舍清幽静谧，内里暗伏江湖祸端。",
  "事件详情": "小镜湖畔细雨霏霏，成片青翠的竹林笼罩在朦胧烟雨之中，景色清幽宜人。大理镇南王段正淳与昔日情妇阮星竹在此处结草筑舍、避世隐居，二人所生的幼女阿紫亦伴随身旁承欢膝下，共享难得的骨肉温情。然而，看似宁静祥和的隐居生活之下却暗藏动荡与祸患。阿紫自幼流落江湖，生性极为刁蛮任性、顽劣异常，此前曾拜入星宿派掌门丁春秋门下修习武艺。阿紫生性胆大妄为，因觊觎本门重宝，竟暗中盗取了星宿派的镇派至宝“神木王鼎”，随后背弃师门一路潜逃流窜，最终辗转寻觅至小镜湖父母的隐居之所安身避祸。段正淳与阮星竹乍见骨肉团聚，满心皆是失而复得的欣喜与怜爱，全然不知这名刁蛮幼女已将引动江湖纷争的邪派至宝带入竹舍。阿紫自此携鼎潜匿于父母膝下，神木王鼎就此隐匿于小镜湖舍中，为这片幽静居所埋下了危机四伏的祸根。",
  "事件概要": "阿紫盗取星宿派至宝神木王鼎背叛师门，一路潜匿流窜至小镜湖竹舍，寻得隐居在此的生身父母段正淳与阮星竹。段氏夫妇乍逢幼女归来欣喜怜爱，阿紫顺势承欢膝下避祸，并将邪派重宝暗藏于舍中，为幽居埋下杀机。",
