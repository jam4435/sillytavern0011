  "事件引子": "菩提院外撞门之声震天动地，戒律院僧众呼喝合围，怀中少女气息已微弱如丝。",
  "事件详情": "目睹阿朱身受少林达摩院玄难大师大金刚拳的致命重创、经脉尽断且濒临气绝的惨状，乔峰胸中侠烈之气与救人之念激荡难平。他深知阿朱伤势极重，若得不到当世绝顶神医救治，转瞬之间便将香消玉殒。乔峰毅然将自身蒙受的不白之冤与生死安危抛诸脑后，小心翼翼将重伤奄奄一息的阿朱抱入怀中，单手持续催动醇厚刚猛的真气源源不绝注入其心脉，稳住她涣散的气息。听闻殿外戒律院僧众撞门呼喝，乔峰怀抱娇躯长身而起，飞脚踢碎殿侧雕花木窗破殿而出。面对迎面围堵而来的数十名手持戒刀禅杖的少林武僧，乔峰单掌挥舞如惊雷破空，掌风呼啸排山倒海，在不伤僧人性命的前提下将合围之众震得东倒西歪、难近其身。乔峰本可孤身凭轻功从容遁走，但怀抱濒死阿朱使得突围凶险百倍，他却毫不犹豫地以肉身护住怀中少女，迎着漫天呼啸的兵刃毅然杀出一条血路。乔峰以绝世武功强行杀穿少林寺重重防御，成功抱阿朱冲破山门遁入苍茫夜色；阿朱靠深厚真气暂保一口残喘，两人由此义无反顾地踏上了奔赴聚贤庄寻找神医薛慕华求医续命的漫漫险途。",
  "事件概要": "乔峰见阿朱经脉尽断危在旦夕，不顾自身冤屈与安危，以雄浑真气护住其心脉破窗突围。面对少林武僧漫天刀杖围堵，他单手御敌奋勇冲杀，终以绝顶武功杀出一条血路突围少林，踏上奔赴聚贤庄求医续命的险途。",
