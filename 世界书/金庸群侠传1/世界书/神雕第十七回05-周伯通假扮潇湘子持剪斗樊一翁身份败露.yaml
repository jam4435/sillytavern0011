  "事件详情": "潇湘子突然怪声怪气地说谷主祖宗一定喝过杨贵妃的洗脚水，大厅上人人变色。樊一翁走到厅心叫阵，假潇湘子连人带椅跃过桌子坐在厅心。樊一翁自报姓名叫樊一翁，令童子扛来一根长一丈一尺的龙头钢杖。假潇湘子则从长袍底下取出一柄极大的剪刀，说是'狗毛剪'专用来剪樊一翁的长胡子。杨过猛然惊觉囊中大剪刀已被偷走。二人交手，假潇湘子闪电般一剪剪断了樊一翁三茎胡子，张口一吹将茶碗震落，武功诡异莫测。樊一翁怒火大炽挥钢杖猛攻，假潇湘子身不离椅，右手剪刀忽张忽合招呼对方胡子，左手擒拿手乘隙夺杖。二人翻翻滚滚斗了数十合，假潇湘子全不将对手放在眼里。公孙止瞧出对方存心戏弄，叫樊一翁退下。假潇湘子身子离椅飞起扑向钢杖，大剪刀夹住樊一翁长须。樊一翁脑袋微晃胡须倒卷反卷住剪刀。正在纠缠之际，突然门口灰影晃动又一条人影抢进双掌齐出攻向假潇湘子背后——来人竟也是潇湘子。原来昨夜周伯通偷了杨过的人皮面具和大剪刀，又换了潇湘子的衣服假扮成他前来胡闹。真潇湘子穴道自解后赶来，二人砰砰嘭嘭斗在一起。杨过凝神看明持剪刀那人的武功，大叫'周伯通还我的面具剪刀'跃到厅心夺剪。",
