名称：丐帮
类型：帮会
核心地域：大宋/洞庭湖/君山
【稳定定位】成员遍布各地，以分舵、人脉、消息与帮规维系，兼具市井网络和武林大帮性质；忠义、互助与实际办事能力是其长期形象。
【组织与接触】普通帮众、分舵与核心长老掌握的信息层级不同，不能因为遇到一名乞丐就默认其知道总舵秘密、帮主行踪或顶级武学。
【江湖认知】江湖中普遍知道丐帮势力广、耳目多，但具体消息仍需传播时间与身份渠道。典型关联人物包括洪七公、黄蓉、鲁有脚等，具体职务和生死服从当前时间线。
【动态事实规则】帮主、长老、分舵控制、内部派系、与朝廷或其他门派的关系，以当前变量、世界事件、游戏时间和实际剧情为准。
