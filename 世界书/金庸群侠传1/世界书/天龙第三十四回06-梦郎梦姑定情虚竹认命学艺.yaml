  "事件引子": "幽影潜入玄冰破裂，李秋水寻至冰窖二老残躯爆发终极死战。",
  "事件详情": "晨曦微露的冰窖之内，云雨初歇，虚竹自迷乱沉沦中猛然惊醒，面对破戒既成事实，顿时如坠无间地狱。他翻身跌下冰床，赤足跪在坚冰之上涕泪横流，不住叩首向佛祖哀告请罪，内心充满了破戒的自责与绝望。然而连随后数夜，童姥皆如期将少女掠入被中。在幽暗冰冷的被衾里，女子温存似水、柔情万种，二人虽皆不知对方名姓来历，虚竹却深情唤其为“梦姑”，少女亦娇羞唤虚竹为“梦郎”，数夕缱绻之间已然情根深种、难舍难分，私定下白首之约。天山童姥现身抚掌狂笑，厉声喝破虚竹已非佛门清净僧侣，佛规戒律已尽数化为飞灰。虚竹自知杀生、破荤、犯色三戒皆破，天下虽大却再无颜面重归少林寺山门，绝望挣扎后心境彻底蜕变，不得不认命顺从命运摆布。他收敛悲容，恭敬跪倒于童姥身前改口求教，全心全意研习逍遥派的天山折梅手、六阳掌及各类上乘武学。在童姥悉心指点下，虚竹不再排斥体内神功，招式威力一日千里。",
  "事件概要": "李秋水察知冰窖动静破门而入（起因）；与童姥爆发同门九十年宿怨之终极绝杀（发展）；掌力相交死死黏住互吸真气（结果）。",
