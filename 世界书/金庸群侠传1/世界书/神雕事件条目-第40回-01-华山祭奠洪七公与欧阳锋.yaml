  "事件详情": "襄阳大捷次日清晨，郭靖一行生怕襄阳军民大举相送，一早便悄悄出了北门，径往华山而去。周伯通、陆无双、武氏兄弟、泗水渔隐等伤势未愈，众人骑在马上缓缓而行，每日只行数十里即止。不一日来到华山，受伤众人在道上缓行养伤，这时也已大都痊可。一行人上得山来，杨过指引洪七公与欧阳锋埋骨之处。黄蓉早在山下买了鸡肉蔬菜，于是生火埋灶，作了几道洪七公生前最喜欢的菜肴，供奉祭奠。群雄一一叩拜。欧阳锋的坟墓便在洪七公的墓旁。郭靖与欧阳锋仇深似海，想到他杀害恩师朱聪、韩宝驹等五侠的狠毒，虽事隔数十年，仍是恨恨不已。只有杨过思念旧情，和小龙女两人在墓前跪拜。周伯通上前一揖，说了一番别出心裁的祭文，人人听着都觉好笑。众人取过碗筷酒菜，便要在墓前饮食。",
  "事件概要": "群雄在华山正式祭奠洪七公与欧阳锋，两代恩怨至此归于墓前一祭。",
