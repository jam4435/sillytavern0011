  "事件引子": "风流云散天地肃穆，群雄感佩玄慈大节拜别少室山。",
  "事件详情": "大雄宝殿之内血腥弥漫，虚竹在短短一个时辰内经历了身世大白与双亲暴毙的人间至痛。他跪倒在血泊之中，左手死死揽住玄慈冰硬的遗体，右手拼命按住叶二娘鲜血狂涌的颈间伤口，泪如雨下，状若疯魔。虚竹急运体内逍遥派深厚精纯的北冥真气，疯狂灌入父母经脉之中妄图起死回生。然而双亲心脉已碎、咽喉断绝，雄浑真气如泥牛入海毫无回音。面对两具冰冷交叠的至亲尸身，虚竹万念俱灰，仰天发出撕心裂肺的绝望哀嚎：“爹！娘！小僧才刚知道你们是谁，为何要弃我而去啊！”极度的悲恸与暴冲的内力在体内激荡反噬，虚竹气血逆行攻心，面色由惨白转为紫金，蓦地仰天喷出一大口殷红鲜血。他眼前骤然漆黑，身躯晃了晃，脱力栽倒在父母的血衣遗体之上昏死过去。段誉与灵鹫宫梅兰竹菊诸女惊呼抢上，急忙点穴护住其心脉并抬下救治。满堂群雄与少林众僧见此惨状无不扼腕叹息，三十年牵动武林风云的恩怨情仇，终在这场白发人送黑发人、骨肉同归于尽的血色残局中惨烈落幕。",
