  "事件引子": "削冰为棺合葬深渊，虚竹念诵佛经安葬童姥与李秋水遗体。",
  "事件详情": "漫长而狂暴的内力抽吸终于随着最后一丝真气的枯竭而渐渐止歇，北冥神功的吸力骤然消散，三人身躯随之颓然分落。天山童姥与李秋水体内的通天神功被彻底抽空，维持了数十年的肉身生机瞬间如大厦倾颓。在冰天雪地的极度严寒之下，失去了绝顶内力护体驻颜的二人，遭遇了极其残酷骇人的岁月反噬。只见李秋水原本如少女般光洁紧致的玉肌雪肤，在短短数息之内迅速脱水干瘪，布满了纵横交错的苍老沟壑；天山童姥那满头如瀑青丝亦在风雪中以肉眼可见的速度寸寸转白，瞬间化作一蓬蓬枯槁苍茫的白霜。昔日容颜绝世、身形婀娜的两位天之骄女，在呼吸之间骨骼软缩、身躯佝偻，彻底沦为风烛残年、牙齿脱落的龙钟老妪。两人颤抖着抬起干枯如柴的手掌，抚摸着彼此枯萎褶皱的面皮，喉间发出绝望而凄凉的呜咽微喘。真气尽失与肉身极速衰朽让她们彻底丧失了站立的力气，双双瘫倒在冰冷的雪泊之中，气若游丝，生命之火已然微弱到了熄灭的悬崖边缘。",
