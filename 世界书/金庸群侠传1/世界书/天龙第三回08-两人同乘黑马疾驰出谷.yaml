  "事件引子": "谷口山风猎猎，黑玫瑰人立长嘶野性未消，微冷幽香四溢，共乘突围之势一触即发。",
  "事件详情": "段誉无奈移至马旁，木婉清俯身探臂，一把揪住段誉的后领，凭借精湛内力将他轻巧提上马背并安置在自己身前。那匹神骏的黑马野性未消，极不习惯旁人骑乘，受激之下猛然扬蹄昂首人立长嘶。段誉毫无骑术根基，顿时吓得面如土色、重心失衡，整个人不由自主地向后倒去，结结实实撞入了木婉清的怀抱之中。瞬息之间，一股如兰似麝、幽冷清冽的少女体香扑鼻而来，沁入心脾，令惊魂未定的段誉心神荡漾。木婉清随即娇叱一声，双腿猛力夹紧马腹，通灵黑马化作一道黑色电光如离弦之箭般飞奔而出。马疾如狂风骤雨，冷香幽微缠绕，段誉只听得耳畔狂风猎猎呼啸，两侧翠竹树木如浮光掠影般急速倒退。二人同乘一骑在瞬息之间便风驰电掣般冲出了万劫谷的重重关卡，直奔神农帮设伏扣押钟灵的凶险之地疾驰而去，为后续营救拉开帷幕。",
  "事件概要": "段誉近前被木婉清探臂轻巧提上马鞍。黑马暴烈昂首长嘶，段誉失衡倒撞入木婉清温软怀中，冷香扑鼻心神荡漾。木婉清娇叱催马，黑玫瑰如黑色闪电冲破谷口，二人共乘一骑风驰电掣直奔神农帮营地。",
