  "事件引子": "绝壁前数十万大军鸦雀无声，萧峰单手按住被俘的辽帝肩头，凛然立于两军阵前。",
  "事件详情": "见结义二弟、三弟生擒辽帝归来，萧峰阔步上前单手扣住耶律洪基肩头，内力吞吐隐而不发。萧峰虽手握敌国君主生死，却毫无弑君邀功或挟私报复之念，唯愿以一己之力平息干戈、保全宋辽万民。萧峰目光炯炯直视耶律洪基，神情肃穆地厉声喝道：“陛下，萧峰若要取你性命易如反掌！但万千生灵何辜？今日只要陛下当着宋辽数十万将士与天下神明当面立下重誓——终陛下有生之年，大辽兵马决不得越过宋辽边境一步！萧峰即刻放陛下归阵，绝不伤你一根毫毛！”耶律洪基受制于萧峰浑厚掌力之下，性命悬于一线，在身死国危的绝对逼迫下终于屈服。他满面屈辱悲愤，自亲随箭筒中拔出一支雕翎重箭，运力双手猛拧，“咔嚓”一声将铁箭当众折为两段，厉声发誓终生永不犯宋，并当场向数十万将士传达全线撤军圣旨。萧峰随即依诺撤掌放人，并将那两截象征和平盟约的断箭紧紧握于手中。数十万辽军铁骑依旨如潮水般后撤数十里，一场旷世浩劫就此消弭于无形。",
  "事件概要": "萧峰扣住受俘的耶律洪基，并无弑君报复之意，只厉声逼其立誓终生不犯大宋以保全两朝苍生。耶律洪基性命受制于人，满腔屈辱下当众折断雕翎重箭立誓罢兵，传旨大军后撤数十里。萧峰依诺撤掌放人并收下断箭，一场旷世兵燹就此消弭。",
