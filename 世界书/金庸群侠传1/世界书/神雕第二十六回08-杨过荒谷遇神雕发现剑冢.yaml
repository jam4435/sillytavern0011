  "事件详情": "杨过伏在马背之上昏昏沉沉，只求不给郭靖找到不遇上蒙古大军。有意无意之间渐渐行近前一晚与武氏兄弟相斗的那个荒谷。黄昏时分在草丛中倒头便睡，次晨睁眼坐起忽见离身不到一尺处两条蜈蚣僵死在地——原来他创伤处流血甚多而血中含有剧毒竟把两条毒虫毒死了。忽听得山峰顶上咕咕咕叫了三声，只见那神雕昂首挺胸独立峰巅形貌狰狞奇丑却自有一股凛凛之威。杨过大喜宛如见了故人一般。神雕从山巅直冲下来见他少了一条手臂目不转睛望着他。杨过苦笑道'雕兄我身遭大难特来投奔于你'。神雕转身便走杨过牵马跟随。神雕伸翅拍马腹杨过知它会意——既到这雕兄谷中也不必再出去了。如此边行边歇到了一个多时辰又来到剑魔独孤求败埋骨处的石洞。杨过见了石坟不禁大是感慨——这位前辈纵横当时并世无敌到头来在这荒谷中寂然而终。如此过了多日伤口渐渐愈合，这一日见洞后峭壁中部约二十余丈处生着一块大石上刻'剑冢'两个大字。杨过心想独孤求败能以利器挖小洞攀上绝壁自己也要试试。紧一紧腰带提气窜高以左足踏入小洞逐个攀上一口气窜上了平台。见大石上'剑冢'两字旁刻有两行小字——'剑魔独孤求败既无敌于天下乃埋剑于斯。呜呼！群雄束手长剑空利不亦悲夫！'神雕伸爪抓住峭壁洞穴也纵跃上了平台。它双爪起落搬开冢上石块露出并列着的三柄长剑和一块长条石片。第一柄剑长约四尺青光闪闪刻有'凌厉刚猛无坚不摧弱冠前以之与河朔群雄争锋'。石片下刻'紫薇软剑三十岁前所用误伤义士不祥乃弃之深谷'。第二柄剑黑黝黝沉重之极——三尺多长一把剑重量竟不下七八十斤，石刻为'重剑无锋大巧不工四十岁前恃之横行天下'。第三柄是腐朽木剑——石刻'四十岁后不滞于物草木竹石均可为剑自此精修渐进于无剑胜有剑之境'。神雕衔起重剑放在杨过手里跟着左翅势挟劲风向他当头扑击。杨过换重剑气运丹田力贯左臂缓缓挺剑刺出——与神雕左翅一碰只觉一股极沉猛的大力压得无法透气，眼前一黑登时晕了过去。醒转时神雕衔着一枚深紫色圆球喂入他口中——原来是禽兽蛇胆。汁液腥极苦极难吃无比但吞入腹中后略行运气但觉呼吸顺畅精神大旺尤胜平时。连那七八十斤的重剑也似乎轻了几分。杨过立时明白——剑魔独孤求败昔日便以神雕为对手练剑这沼泽深谷正是他的练剑之所，而蛇胆更有强筋健骨之奇效。",
