  "事件详情": "众人忙于互相引见时将情花丛中的李莫愁师徒忘了。忽听洪凌波一声大叫——李莫愁将她高高举起掷出摔在情花丛中，跟着飞身跃出左脚在洪凌波胸口一点跃高，双脚甩起右手抓住洪凌波又向外掷了数丈再落在她身上。她欲借力三次跃出情花丛——纵身又要跃起时洪凌波突然大叫一声跃起抱住她左腿。李莫愁身子一沉右脚飞出砰的一声踢中洪凌波胸口——脏腑震裂立时毙命，但洪凌波双手牢牢抱住左腿不放。两人一齐摔下跌落时离情花丛边缘已不过两尺——然而终于相差这两尺，千万根毒刺一齐刺进李莫愁体内。这一变故惨凄可怖人人惊心动魄。陆无双感念师姊平素恩情伤痛难禁放声大哭。杨过想起当日戏弄洪凌波的情景也不禁黯然。李莫愁俯身扳开洪凌波双手见她双眼未闭满脸怨毒。黄蓉叫道'李姊姊请你过来我有句话跟你说'——告知她只须以长剑掘土用外衫包两个土包掷在花丛中便可安然脱困。李莫愁悔恨无已——惶急之际没想到此计既害了世上唯一的亲人自己也摆脱不了祸殃。黄蓉叹道'你早就中了痴情之毒胡作非为害人害己'。武修文仗剑喝道'李莫愁你今日恶贯满盈'——武氏父子、耶律齐、耶律燕、完颜萍、郭芙、程英、陆无双分从两侧围上。陆无双道'你狠心杀我全家今日只要你一人抵命算是便宜了你'。李莫愁向小龙女求情——'小师妹你便丝毫不念师门之情么'。杨过朗声道'你背师杀徒还提什么师门之情'。众人兵刃齐出要将她就地正法。李莫愁左手一扬叫道'看暗器'趁众人凝神之际纵身跃入情花丛中——她突然想到反正已遍体中刺再刺几下也不过如此。这一着连黄蓉杨过也没料及——对穿花丛直入林中去了。",
