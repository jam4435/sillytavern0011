  "事件详情": "黄蓉快步回入树林，一瞥棘藤圈中不由得如入冰窖——郭襄已影踪不见。她定了定神攀上最高一株树四下眺望，襄阳城郊地势平坦一眼望去足足十余里，竟没见到丝毫可疑事物。细寻棘藤圈附近足迹，一条条棘藤绝无碰动搬移之迹。她猛地想起：这九宫八卦阵法世上只有桃花岛弟子识得，但数月前曾将阵法大要说给杨过知晓，此人聪明无比举一反三破解并不甚难。一想到杨过脑中一晕——芙儿断他一臂他与我郭家结下深仇，襄儿落入他手中这条小命算完了。与此同时，那天晚间杨过在窗外见黄蓉点了郭靖穴道放走女儿后便远远跟随。黄李出林相斗时他跃上高树扯了三条长藤并在一起，一端缚在树上另一端左手拉住，自空纵入棘圈双足挟住郭襄腰间，身子一荡便已出圈——轻功了得竟连软泥上也无足印。回到市镇见郭芙牵着小红马东张西望，杨过双足一点从丈外跃上红马。郭芙拔剑来攻却被他挥动空袖裹住长剑甩出，剑身撞在墙角弯如曲尺。杨过左手抢过马缰双腿一夹小红马向前急冲绝尘而去。他抱了郭襄骑汗血宝马向北疾驰，不多时便掠过襄阳奔行了数十里。行出二百里后沿途渐有人烟，一路上向农家讨羊乳牛乳喂郭襄。不数日间已到了终南山下，纵马上山觅路来到古墓之前。他在古墓旁找了个山洞将郭襄放在洞内，拔些荆棘柴草堆在洞口，便绕过古墓向后走去。",
