  "事件详情": "义父义子各叙别来之情。欧阳锋神智半清半迷，过去之事早说不清楚。杨过提到这些年来一直在跟小龙女练武，欧阳锋大声说她武功又不及我何必跟她练让我来教你。杨过不好意思说师父待我很好。欧阳锋妒忌起来道她好我就不好么，杨过笑道你也好这世界上就只你两个待我好。欧阳锋抓住他手掌嘻嘻傻笑一阵，说他的武功倒练得不错就可惜不会世上最上乘的两大奇功。杨过问是什么，欧阳锋哈哈大笑说第一是蛤蟆功第二是九阴真经，便将口诀背诵起来。杨过微笑道你从前教过我的，欧阳锋搔搔头皮让他练来看看。杨过自入古墓后从未练过那怪异功夫此时以上乘内功一加运用登时使得花团锦簇。欧阳锋笑道好看就是不对劲中看不中用，便滔滔不绝将诀窍尽数传授——说一段蛤蟆功又说一段颠倒错乱的九阴真经。杨过但觉他每句话中都似妙义无穷既繁复又古怪一时领会不尽。欧阳锋说了一阵瞥眼忽见小龙女坐在一旁，叫啊哟不好莫要给你的女娃娃师父偷听去，走到小龙女跟前叫她走得远远地。小龙女冷冷说我爱走就走去不爱走就不走。欧阳锋大怒却因杨过劝阻缩回手，说好好那我们就走得远远地。不料忽尔长臂在她背心穴道上点了一指，小龙女全不设防待惊觉上身已转动不灵，欧阳锋又伸指在她腰里点了一下笑道小丫头莫心焦待我传完功夫就来放你。杨过正在潜心默记义父所传功诀不知小龙女被袭之事。欧阳锋牵他走到远处继续教功。小龙女麻软在地又好笑又好气，潜运九阴神功自解穴道不料越冲越酸麻——原来欧阳锋手法刚与九阴真经逆转而行求脱反固，只得合眼睡去。过了良久眼上微觉有物触碰，她黑夜视物如同白昼此时竟不见一物，原来双眼被人用布蒙住了，随觉有人张臂抱住了自己。这人相抱之时初时极为胆怯后来渐渐放肆渐渐大胆。小龙女惊骇无已欲张口呼救苦于口舌难动，但觉那人以口相就亲吻自己脸颊。她初时只道是欧阳锋忽施强暴，但面庞相触之际觉他脸上光滑决非欧阳锋满脸虬髯——心中一荡惊惧渐去情欲暗生，心想原来杨过这孩子却来戏我。只觉他双手越来越不规矩缓缓替自己宽衣解带，小龙女无法动弹只得任其所为。天亮时分欧阳锋已将两大奇功要旨说完，杨过发现义父传授的九阴真经与自己从重阳遗刻所学大不相同。欧阳锋听他照着说着一行忽觉内力舒发意境大不相同，不由心中混乱喃喃自语怎么到底是我错还是你的女娃娃师父错。杨过见他两眼发直神不守舍怕疯病又要发作，忽听得数丈外树后忽喇一声人影闪过花丛中隐约有杏黄道袍一角。此处人迹罕至怎会有外人到此，杨过急步赶去一把抓住那人肩头扳将过来，原来是全真教尹志平。只见他衣冠不整脸上一阵红一阵白满脸慌张说不出话来。杨过想他那日自断手指立誓为人倒是不坏便放松了手温言道既然没事你就走罢，尹志平回头瞧了几眼慌慌张张急步去了。杨过回到茅屋前见小龙女卧在地上眼上蒙着青布，解开青布见小龙女眼中神色极是异样晕生双颊娇羞无限。",
