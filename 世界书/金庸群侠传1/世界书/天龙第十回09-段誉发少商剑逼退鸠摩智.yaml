  "事件引子": "牟尼堂内焦灰未散，鸠摩智狂怒之下刀劲暴涨，炽热的火焰刀直扑陷入险境的保定帝。",
  "事件详情": "六幅经卷图谱化为飞灰令鸠摩智怒不可遏，狂怒之下出手更加狠辣无情，火焰刀劲狂涌四溢，直逼因运功对抗而陷入险境的保定帝。坐于一旁的段誉眼见伯父保定帝命悬一线、危在旦夕，救人心切之下顾不得自身安危，心念电转间下意识地抬起右手，依着方才默记的剑经图谱凌空一点。刹那间，段誉体内浑厚无匹的蓄积真气如江河决堤般自大拇指经络奔涌而出，少商剑无形剑气破空激射，声势仿若怒涛排壑、雷霆万钧。那道宏大凌厉的无形剑气正面狠狠撞在鸠摩智劈来的火焰刀气之上，只听得一声巨响，强横的剑气竟硬生生将内力深厚的鸠摩智震退了整整三步。段誉在情急之下毫无招式经验的无意识一击，展现出了震撼全场的绝世神威，不仅瞬间化解了保定帝的燃眉之急，也让在场所有人大为震惊。",
  "事件概要": "鸠摩智因图谱被毁狂怒出招，火焰刀狠辣直逼保定帝。危急关头，段誉救伯父心切，下意识依法运劲自右手大拇指凌空一指，体内积蓄的磅礴真气化作少商剑气如怒涛激射，轰然震退鸠摩智三步，以未谙武艺之身化解危局，震惊全场。",
