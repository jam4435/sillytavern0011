  "事件引子": "巨熊咆哮雪雾翻滚，乔峰空手击毙恶熊救女真酋长。",
  "事件详情": "乔峰独自在长白山古木参天的雪岭深处寻觅灵参打猎，忽听闻前方林莽中传来凄厉至极的人声惨呼与震天动地的暴戾虎啸。乔峰心神一紧，施展绝顶轻功踏雪无痕疾驰而至。只见林间空地已被鲜血染红，十余名手持简陋骨叉短刀的女真猎人横七竖八倒在血泊中，两只斑斓巨大的东北猛虎正张开血盆大口，分别咬碎两名猎人的臂膀，作势扑杀残存的幸存者。千钧一发之际，乔峰暴喝一声：“休伤人命！”宛若平地惊雷。他身形拔地而起，毫不犹豫飞身迎向正凌空扑来的第一只猛虎，右臂一沉，悍然轰出一记至刚至烈的“亢龙有悔”。伴随着龙吟般的狂暴掌风，这一掌结结实实拍在巨虎坚硬的脑门之上，只听咔嚓一声闷响，虎头当场碎裂毙命。另一头猛虎见状狂怒甩尾扑来，乔峰足尖点地侧身避开森森利爪，顺势反手一记重拳灌注浑厚内力轰中其后颈脊骨，巨虎惨嚎倒地抽搐而亡。眨眼之间，两头凶残猛兽暴毙当场，乔峰赤手空拳扭转乾坤，将瘫倒在雪地中惊魂未定、身负轻重伤的女真猎人们彻底从绝境中救出。",
  "事件概要": "乔峰雪山捕猎偶遇女真勇士被巨熊扑击受困（起因）；乔峰神威暴发双掌毙熊救下完颜阿骨打（发展）；阿骨打惊为天人盛情邀归部落（结果）。",
