  "事件详情": "少林寺藏经阁之内，气氛压抑紧绷至极。萧远山与萧峰父子同仇敌忾，誓要洗雪三十年前雁门关惨案的血海深仇；慕容博与慕容复父子则心系大燕复国大业与家族存亡，寸步不让。双方各自凝聚毕生功力，杀气腾腾，剑拔弩张，一场惊天地泣鬼神的绝顶死战一触即发。便在杀机四伏的千钧一发之际，一名身着粗布僧袍的扫地老僧手持一把破旧扫帚，神态安详闲适，口中轻诵佛号，缓步走入四人对峙的中心。老僧对眼前四位当世绝顶高手外放的凌厉真气视若等闲，当着四人之面，神情从容自若地道出少林七十二绝技与佛法慈悲相辅相成的至理。老僧温言阐述：少林七十二绝技每一项皆蕴含无上威力与深重戾气，唯有以相应之佛法慈悲方能加以化解。若是不明佛理而强行兼练多门绝技，体内戾气便会层层郁结，久而久之必成难医难救的内伤绝症。老僧这番话语如黄钟大吕，震动四人耳鼓，当场暂遏了阁内一触即发的血腥杀机。",
