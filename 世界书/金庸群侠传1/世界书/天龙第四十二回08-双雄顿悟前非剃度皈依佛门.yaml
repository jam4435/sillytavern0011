  "事件详情": "历经这场从生到死、又由死转生的龟息与轮回洗礼，萧远山与慕容博恍如大梦初醒，心境发生了彻底的蜕变与升华。二人缓缓自草地上站起身来，彼此四目相对，数十年来纠缠不休的家国血仇、杀妻之恨与复国狂念，在死亡边缘真正走过一遭之后，皆化作了虚妄的过眼云烟。萧远山与慕容博相视一笑，彻底消解了心中的滔天仇怨与复国魔障。大彻大悟的当世两大绝顶高手神情虔诚肃穆，双双跪倒在扫地神僧脚下，恭敬叩首恳求剃度出家、皈依三宝。老僧面带慈悲微笑欣然受礼，当场为萧远山与慕容博摩顶受戒、剃度落发，赐予法名“圆融”，正式引渡二人皈依佛门清净之地。一代神僧以通天彻地的无上神功与广大慈悲，彻底化解了两代人的滔天世仇与武林浩劫，少林古刹与天下武林自此重归祥和安宁。",
