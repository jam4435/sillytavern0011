  "事件引子": "雁门关下朔风怒号，万丈绝壁前险关紧闭，远方漫天烟尘中滚滚铁骑奔腾而至。",
  "事件详情": "大辽皇帝耶律洪基闻听死牢被劫、萧峰脱逃且皇宫遭破的急报，登时勃然暴怒。为捍卫大辽国威并铲除后患，耶律洪基亲率数十万全副武装的重装铁骑大军倾巢出动，一路杀气腾腾南下追击。辽军铁骑旌旗遮天蔽日，千万马蹄踏动山川大地，携排山倒海之势风驰电掣般杀至雁门关前，迅速以扇形大阵将天下英雄联军死死围困在峡谷绝壁之下。此时此刻，联军前方乃是万丈悬崖与紧紧闭锁的雁门险关，后方则是望不到边际的数十万辽国虎狼大军。狂风呼啸，战马嘶鸣，刀枪剑戟泛着冷冽寒芒，天下群雄身处前无通路、后有强敌的绝境之中，再度陷入了十死无生的绝命重围。整个雁门关峡谷杀气弥漫、压抑至极，一场关乎天下命运与英雄气节的轰烈绝唱，即将在悬崖绝壁之前轰然奏响。",
  "事件概要": "耶律洪基震怒于南京死牢被劫，亲率数十万辽国铁骑南下追击，以漫山铁甲合围雁门关外峡谷。面对前有绝壁闭关、后有数十万虎狼追兵的绝境，群雄退路断绝，重伤的萧峰与各路豪杰陷入十死无生的绝命死局。",
