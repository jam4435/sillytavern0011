  "事件引子": "蒙面人密洞推宫过血救乔峰，石台留金创药飘然遁去。",
  "事件详情": "聚贤庄惨烈血战之后，乔峰身负数十处严重刀伤，失血过多而陷入重度昏迷。危急时刻，神秘的蒙面黑衣人出于相救之意，避开天下群雄的追踪，将垂死的乔峰一路带至一处地势险峻、草木掩映的深山隐秘洞穴之中。入洞之后，黑衣人将乔峰平稳放置于地，神色凝重地运起自身极为纯正精深的玄门内力，双掌按于乔峰周身要穴，为其推宫过血。随着雄浑温热的真气源源不绝地渡入奇经八脉，乔峰体内郁结停滞的重重淤血被强行化解冲散，原本微弱游离的呼吸与脉搏逐渐复苏平稳。黑衣人在整个救治施法过程中举止严密，自始至终未曾揭开面巾，更不曾吐露半句言语。察觉到乔峰内息已然接续、脱离了性命之危后，黑衣人并未等待乔峰苏醒探问，而是迅速做出了抽身离去的选择。临行之际，他在乔峰身旁的石台上留下了用于调治外伤的上等金创药，随即施展轻功飘然遁入洞外深山，没有留下一丝身份真容的线索，使得昏迷中的乔峰得保性命却不知恩人底细。",
  "事件概要": "起因：聚贤庄大战后乔峰身负数十处重创昏迷，蒙面黑衣人避开群雄追踪将其带至深山隐秘洞穴。发展：黑衣人运纯正精深玄门内力双掌按要穴推宫过血化解淤血，乔峰呼吸脉搏逐渐复苏平稳。结果：黑衣人见乔峰脱离险境在石台留下上等金创药后飘然遁入深山，乔峰得保性命。",
