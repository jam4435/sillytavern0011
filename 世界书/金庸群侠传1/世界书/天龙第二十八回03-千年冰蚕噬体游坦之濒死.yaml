  "事件详情": "头戴精钢铁面具沦为“铁丑”的游坦之，继续遭受着阿紫变本加厉的残酷折磨。阿紫为了修炼星宿派至高毒功化功大法，每日纵容并驱使各种剧毒无比的毒虫、毒蛇啃咬撕噬游坦之的躯体，令其周身伤痕累累、毒疮遍布。一日，阿紫在荒野山林中机缘巧合捕获到了天下至毒至寒的罕世异宝——“千年冰蚕”。阿紫大喜过望，当即将这只通体晶莹剔透却蕴含毁灭极寒的冰蚕放在游坦之身上，命其狠狠咬噬游坦之的皮肉以吸取至阴寒毒。千年冰蚕入体狂噬，游坦之周身血液经脉瞬间被霸道绝伦的冰蚕寒毒冻结，整个人由内而外凝结出一层厚厚的白霜，体内脏腑如堕万年冰窟，生机迅速流逝涣散。游坦之四肢僵硬冰冷、气息奄奄，生命之火已然微弱到了熄灭的边缘，彻底陷入了十死无生的濒死绝境。",
