  "事件引子": "石壁棋盘空槽初辟生机，幽谷群豪屏息屏气，青袍怪客目光如炬，灰衣小僧惶然欲退。",
  "事件详情": "段延庆从濒死心魔中回过神来，惊魂甫定之下深知若无虚竹那荒诞一掷，自己早已爆脉横尸当场。感念救命大恩，又见棋局生机勃发、报复丁春秋之机已现，段延庆当机立断，决意暗助虚竹彻底攻破珍珑。虚竹面对苏星河的催促手足无措，连连摆手欲退回少林阵中。正在此时，一段细若游丝却浑厚无比的声音直接自虚竹耳畔响起：“小和尚休退，我授你棋谱！抓白子，下在‘去位九五路’！”虚竹一惊，回首只见段延庆腹语催动、目光如炬。虚竹依言拈起白子拍在石壁之上。苏星河见状神色大动，急挥黑子反扑。段延庆再度施展独门“传音入密”绝技，将黑子破绽连珠炮般传入虚竹耳中：“上平三六路，截断黑龙大龙！”“下平八八路，聚气成杀！”虚竹浑浑噩噩间唯命是从，子子精准如神针刺穴。数十招交锋电光石火，段延庆借虚竹之手将毕生国手棋艺尽数施展，白子如天兵下界势如破竹，直插黑棋中腹死穴，任凭苏星河如何殚精竭虑变招，黑子已然首尾难顾、溃不成军。最后数枚白子封盘落定，石壁上黑子全线崩溃彻底气绝，盘桓江湖数十载、困毙无数英豪的珍珑棋局终告彻底告破，虚竹在段延庆暗助下缔造武林奇迹，满场高手无不骇然失色。",
  "事件概要": "虚竹自填死路反辟生机，段延庆感念救命大恩，暗中施展传音入密绝技指点虚竹落子。虚竹遵言连出杀招直插黑棋死穴，任凭苏星河殚精竭虑亦难挽颓势，黑棋最终全线气绝溃散，困顿天下豪杰数十载的珍珑棋局终告彻底告破。",
