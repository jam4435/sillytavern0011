  "事件详情": "黄蓉扶住晕倒的杨过，郭靖为他推拿几下，但见他双目紧闭、牙齿咬破舌头满嘴鲜血却始终不醒。郭靖又惊又喜道'他……他原来是杨康兄弟的孩子'。原来黄蓉见这少年容貌与杨康实在相像，想起当年王处一在中都客店中相试穆念慈武功师承，伸手按她后颈——穆念慈不向前跌反而后仰，这正是洪七公独门的运气练功法门。杨过若是穆念慈之子，所练武功也必是这一路。一试之下果然揭穿真相。当下郭靖抱了杨过与柯镇恶、黄蓉、郭芙携同双雕回到客店。黄蓉写下药方叫店小二去配，只是她用的药都是偏门，嘉兴虽是通都大邑一时也配不齐全。郭靖见杨过始终昏迷不醒甚是忧虑。黄蓉知道丈夫自杨康死后常自耿耿于怀，今日陡然遇上他的子嗣自是欢喜无限，偏生又中了剧毒不知生死。她出言安慰，说'咱们自己出去采药'，郭靖心知只要稍有治愈之望她必出言安慰，见她神色之间亦甚郑重，心下更是惴惴不安。夫妻俩嘱咐郭芙不得乱走，双双出去找寻药草。杨过昏昏沉沉睡着直到天黑仍是不醒。柯镇恶进来看了他几次束手无策——他毒蒺藜的毒性与冰魄银针全然不同不能混用解药，又怕郭芙溜出，不住哄她睡觉。",
  "事件概要": "郭靖将杨过带回客店救治，并确认他是杨康之子，杨家遗孤的去向终于有了依托。",
