  "事件引子": "药锄凌空劈面斩下，白貂破空连环扑咬。",
  "事件详情": "段誉与钟灵被押至神农帮营地之内，主位上的帮主司空玄面容枯槁憔悴，手中紧握一柄沉重药锄，神情间尽显阴鸷狠戾之色。司空玄误以为段誉乃是无量剑派派来求和的说客，当即怒极反笑，冷声厉喝道：“无量剑派派一个乳臭未干的书生来求和，当真欺我神农帮无人！”话音未落，司空玄杀意骤起，悍然挥动手中锋利药锄，直逼毫无防备的段誉面门斩去，意图将其当场斩杀以立威。眼见段誉命悬一线，身旁的钟灵在情急万分之下当机立断，再次自怀中放出通灵异兽闪电貂。那闪电貂通体雪白、动作快若闪电，破空而出瞬间化作一道白影，凌空跃上司空玄的咽喉与肩头要害，更借着迅疾身法连环扑咬在场的数名神农帮高手。司空玄与一众帮众猝不及防纷纷被咬中，伤口瞬间传来钻心剧痛，皮肉间更有浓黑毒气迅速弥漫开来。众人见状惊骇万分，攻势顿时受阻，场面陷入极度混乱与惊恐之中。",
  "事件概要": "起因：司空玄误认段誉为无量剑求和说客，怒极挥动锋利药锄直斩段誉面门立威。发展：危急万分之际钟灵放出白色闪电貂，化作白影凌空扑咬司空玄咽喉与众帮众。结果：司空玄与帮众猝不及防被咬中剧毒，伤口钻心剧痛泛起黑气，场面陷入混乱。",
