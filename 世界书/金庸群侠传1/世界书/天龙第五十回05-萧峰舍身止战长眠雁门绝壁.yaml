  "事件引子": "数月前雁门关外的断箭止战早成往事，秋风再次吹过绝壁，戍卒与江湖过客回忆萧峰的牺牲。",
  "事件详情": "深秋的雁门关外，辽军铁骑早已依耶律洪基的断箭盟誓北撤，宋辽边境重归安宁。守关军士与途经侠客驻足崖口，望向沙石间尚隐约可辨的旧战迹，低声追述同年六月萧峰在两军阵前为阻止南侵迫辽帝立誓，因忠义难两全而以断箭自戕的壮举。阿紫在悲痛之中追随坠崖，段誉与虚竹及诸位武林豪杰早在当日含悲辞别，各归本土。此刻只有后来人的追思与祭酒，没有萧峰、阿紫、辽帝或两位义弟再度到场，也没有新的自尽、逼誓、交战或人物状态变更。秋风吹尽旧日尘沙，侠义舍生的故事仍在关山间传诵。",
  "事件概要": "秋日雁门关隘，戍卒与行旅追忆1205年六月萧峰折箭止战、阿紫随后殉情的旧事，遥祭侠魂。昔日死难不再重新发生，亦不召回已故人物或辽帝重演交战。",
