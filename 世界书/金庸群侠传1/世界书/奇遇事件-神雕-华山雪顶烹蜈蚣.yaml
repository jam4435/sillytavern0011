事件名称: 奇遇事件-神雕-华山雪顶烹蜈蚣
事件地点: 大宋/华山/华山绝顶
触发条件:
  全部:
  - 变量: user数据.初始属性.根骨
    大于等于: 11
  - 变量: user数据.包裹.陈年烈酒
    存在: true
事件持续时间:
  时: 3
事件引子: 华山绝顶风雪漫天，九指神丐洪七公正架起特制油锅，在雪地里烹炸鲜红异种大蜈蚣……
事件概要: 玩家在华山雪峰与洪七公对饮烈酒、共享炸蜈蚣美味，得七公外功借力打力散手点拨。
事件详情: 华山绝顶大雪封山，在一处避风雪窟前，衣衫褴褛的洪七公正从雪堆里扒出数十条冻僵的七寸大红蜈蚣，去头去尾丢入滚沸油锅，炸得焦黄酥脆、香气扑鼻。玩家取出随身陈年烈酒奉上，与七公并肩席雪而坐痛饮豪嚼。蜈蚣入腹化作一团暖流直透丹田，寒意尽驱。七公大为快慰，折木为杖，当场指点了一套外家借力卸力、以巧化刚的散手发力法门。
参与人物:
- 玩家
- 洪七公
