  "事件引子": "塞外关隘风沙漫卷，雁门关前旌旗如云，四方豪杰云集肃杀之气直冲霄汉。",
  "事件详情": "萧峰蒙难的消息传至各地，大理国皇帝段誉与灵鹫宫宫主虚竹得知义兄被困，义愤填膺，誓要赴汤蹈火救出长兄。段誉毅然调动大理倾国精锐，亲率大理三公与四护卫等皇室高手浩荡北上；西夏驸马虚竹则统领缥缈峰灵鹫宫九天九部麾下，并号召三十六洞、七十二岛数万名万仙精锐日夜兼程杀至中原。与此同时，中原少林派高僧、丐帮全体门人弟子、五岳剑派精锐以及中原各路绿林豪客数万人群起响应，纷至沓来。各方势力在北上关口前正式会盟，结成了一支前所未有的“天下英雄联军”。众人同仇敌徾、杀气冲霄，不分门派尊卑与地域藩篱，一心只为解救舍身取义的萧峰。联军旌旗猎猎，以雷霆万钧之势浩浩荡荡跨过长城关隘，直逼大辽国都南京（析津府）。这支集结了当世顶尖战力与数万精锐的联军，彻底形成了直捣辽国腹地的远征大势。",
  "事件概要": "段誉亲率大理国高手，与虚竹统领的灵鹫宫及洞岛万仙部众在雁门关前会合，连同少林、丐帮及五岳各路中原豪杰正式歃血会盟，结成声势浩大的天下英雄联军，携雷霆万钧之势跨关出塞，直逼大辽国都南京。",
