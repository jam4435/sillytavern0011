  "事件引子": "大雄宝殿前朔风呼啸，群雄屏息凝神，肃杀之气笼罩着整座青石广场。",
  "事件详情": "慕容博的真实面目昭然若揭，三十年前酿成雁门关惨剧的万恶之源终于大白于天下。萧远山双目赤红，咬牙切齿地当众喝破慕容博当年的毒计：正是慕容博为挑起宋辽两国交兵、以便趁乱复兴大燕，居心叵测地向少林玄慈方丈假传密信，谎称契丹武士要血洗少林盗取藏经，这才引得中原二十一位武林高手在雁门关设伏截杀。玄慈方丈闻言闭目垂泪，双手合十长叹：“善哉，善哉！老衲当年轻信慕容施主之言，误杀无辜，罪孽深重！”面对玄慈的自责与全场群雄的怒视，慕容博却仰天狂笑，毫无愧悔之色，反斥成大事者不拘小节。得悉生母惨死崖底、生父跳崖残生、自己沦为孤儿且蒙冤半生的根源全系眼前之人所为，萧峰胸中怒焰滔天，周身降龙真气疯狂鼓荡，青袍无风自鼓；萧远山更是拔出随身兵刃，杀气贯顶。慕容复则拔出佩剑护在慕容博身侧，仇人相见分外眼红，萧氏与慕容氏两代人的血海深仇至此激化至万劫不复的绝境。",
  "事件概要": "萧远山当众揭露慕容博假传契丹夺经密信、挑起雁门关惨案的复燕毒计。玄慈方丈垂泪认错悔恨误杀无辜，慕容博狂笑反唇相讥毫无悔意。得悉身世浩劫根源，萧峰父子怒发冲冠拔刃相向，慕容复按剑护父，两代世仇彻底爆发。",
