事件名称: 奇遇事件-射雕-铁掌绝顶淬掌功
事件地点: 大宋/潭州/铁掌山
触发条件:
  全部:
  - 变量: user数据.初始属性.臂力
    大于等于: 14
  - 变量: user数据.初始属性.根骨
    大于等于: 13
事件持续时间:
  时: 4
事件引子: 铁掌峰形如五指，中指主峰绝顶骨殖石窟内药香扑鼻，石壁上刻满刚猛凌厉的铁掌发劲口诀……
事件概要: 玩家潜入铁掌帮禁地石窟，以封存古药酒淬炼双手筋骨，参悟铁掌功发力奥义。
事件详情: 玩家趁夜避开巡逻帮众，攀上险恶的中指峰顶，进入历代铁掌帮主埋骨石窟。石案之上供有一坛封泥完好的秘制淬手药酒，石壁更绘满猛击铁砂、化柔为刚的掌法运气图谱。玩家遵照古法，以药酒反复揉搓浸润双掌。药力渗入皮膜筋骨，十指隐现金铁光泽，击石成碎，掌力大增。
参与人物:
- 玩家
insert:
  user数据:
    包裹:
      铁掌淬手药酒:
        类型: 药品
        品阶: 珍品
        功效类型: 永久增幅
        物品描述: 铁掌帮历代秘传淬手药酒，以数十味金石烈药浸泡，服敷可大幅坚韧筋骨双掌。
        属性修正:
          臂力: 10
          根骨: 5
        数量: 1
    武功:
      铁掌功:
        掌握程度: 初窥门径
update:
  user数据:
    修为: '+1800'
delete: {}
后续事件: {}
