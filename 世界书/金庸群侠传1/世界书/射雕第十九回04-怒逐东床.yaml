  "事件详情": "黄药师送周伯通离岛，欧阳锋提议让周伯通乘坐自己的船。周伯通不喜，偏要坐港口一艘新造的华丽花船。黄药师多番阻止，称此船不祥，但周伯通耍赖撒泼，坚持要坐。洪七公不忍，决意陪同。黄药师心中本就因郭靖之事有气，此时周伯通又开玩笑，谎称郭靖早就知晓《九阴真经》并图谋天下无敌。黄药师盛怒之下信以为真，认定郭靖狡诈，当场翻脸，厉声宣布断绝关系，并将郭靖逐出桃花岛，甚至迁怒于哑仆，一掌将其打入大海。他命令郭靖也登上那艘不祥的花船，随后拉着悲痛的黄蓉决绝离去。洪七公欲追去解释，却已不见黄药师踪影，只好无奈返回。郭靖、洪七公、周伯通三人只得一同登上了那艘处处透着诡异的花船。",
  "事件概要": "黄药师误信郭靖觊觎真经，当场逐走郭靖并拆散黄蓉，两人的婚事由此跌入谷底。",
