  "事件引子": "清晨雪原的宁静骤被奔雷般的马蹄声粉碎，烈火与狼烟自被撕裂的兽皮营栅间腾空而起。",
  "事件详情": "宁静的雪原清晨被雷鸣般的马蹄声骤然打破，数百名身披精钢锁子重甲的大辽契丹精锐骑兵呼啸而至，以合围之势突袭女真营地。辽军骑兵为抢夺营中的人参皮毛、牛羊牲畜并屠戮生口，依仗战马的狂暴冲击力肆意冲撞撕裂营栅。漫天淬火利箭破空射来，刹那间将数十座兽皮营帐点燃成熊熊火海，凄厉的妇孺哭喊响彻山谷。首领完颜阿骨打见家园遭袭、族人喋血，怒发冲冠，当即手握一柄沉重的双刃开山大斧，怒吼着率领残存猎人死战抵抗。阿骨打纵身跃起，大斧凌空斩断两名冲前辽兵的马腿，顺势横劈将落马骑兵斩杀。然而辽军兵力占绝对优势，且人人身着重铠、兵刃精良，辽将挥刀指挥重骑分列冲锋、轮番攒射，女真简陋的骨箭石矛根本无法击穿重铠。随着多名勇士中箭倒地、血染雪原，阿骨打右臂亦被辽军马刀划出一道深可见骨的血口。辽军铁骑迅速变换阵型合围包抄，将阿骨打及数十名负伤猎人重重围困在营地中央的死角，女真部族陷入灭顶边缘。",
  "事件概要": "辽军重甲铁骑突袭并纵火焚烧女真营地，大肆屠掠。完颜阿骨打率残部奋勇抵抗，挥巨斧连毙敌骑，奈何辽军重铠坚兵、人数占优且轮番围射。女真猎人死伤惨重，阿骨打右臂负伤见骨，率残部被铁骑死死围困在营地死角，面临灭顶之灾。",
