  "事件引子": "镇南王府内寝檀香幽微，窗外细雨初歇，榻前药香未散，气氛沉郁肃穆。",
  "事件详情": "段誉在镇南王府中整整昏迷了两日方才悠悠苏醒。醒转之后，他整日神思恍惚、茶饭不思，脑海中尽是木婉清的身影与音容笑貌，深陷于命运无常捉弄、彼此情深缘浅的彻骨悲痛之中，心绪如堕冰窟。镇南王段正淳与王妃刀白凤见状忧心如焚，轮番前往榻前探视宽慰，劝他放下心中执念。然而段誉心如死灰，挣扎着向父亲表明心迹，坚决要求即刻启程前往万劫谷。他执意要兑现此前答应钟灵的承诺，将她从谷中解救脱险，同时也要当面向万劫谷主钟万仇彻底说明关于木婉清的诸般身世变故。段正淳深知当年旧债皆因自己而起，内心自知理亏且满怀愧疚，见儿子态度决绝且重情重义，遂决定全力护其周全。段正淳当即严令调派王府四大得力护卫褚万里、古笃诚、傅思归、朱丹臣贴身随行戒备，并亲自提笔修就密信一封交予段誉随身收执，命他持此信前去求见钟万仇。段誉携信收整心绪，与四位护卫一行五人跨马扬鞭，自王府出发疾驰奔赴万劫谷。",
  "事件概要": "段誉昏迷两日后苏醒，因与木婉清的骨肉异变心如死灰，执意赴万劫谷营救钟灵并说明身世。段正淳深感愧疚，遂派褚万里、古笃诚、傅思归、朱丹臣四大护卫随行护卫，并手书密信交予段誉呈交钟万仇。段誉携信收整心绪，同四护卫策马离府疾驰赴谷。",
