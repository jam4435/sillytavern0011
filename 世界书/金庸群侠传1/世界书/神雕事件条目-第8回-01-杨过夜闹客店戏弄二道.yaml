  "事件详情": "杨过轻轻推开窗门闪身进入姬皮二道房中。炕上放有两个包裹，一个内藏二十余两银子，他心想正好用作盘缠便揣入怀中。另一个包裹四尺来长包着两柄长剑，他分别拔出以重手法将两剑尽皆折断重行还归鞘中包好。正要离去时转念一想，竟在二道被窝中拉了一大泡尿。随即闪身回房掩上房门，两个道人全无知觉。不久二道解衣上炕，皮清玄大叫被窝湿漉漉臭不可闻，二人发现银子失窃大声叫嚷店家开黑店。那店伴平日最爱与人斗口，此刻理直气壮说得唾沫横飞，驳得二道哑口无言。二道欲待动手却忌惮教规终南山脚下不敢胡来，只得忍气吞声关门而睡，次日天没亮便悄悄溜走。杨过次日清晨起来吃面，问及二道去向，店伴得意洋洋说二道已溜走。杨过暗暗好笑，给了房饭钱问明去豺狼谷的路径迈步便行。",
  "事件概要": "杨过夜里戏弄姬皮二道并夺得盘缠，二道狼狈遁走，他也得以继续独自赶路。",
