  "事件引子": "大殿内雅乐渐息，四方使臣与江湖豪客各怀心思鱼贯退场，殿外阴云低回。",
  "事件详情": "随着西夏皇宫招亲大典在赐婚盟好中落下帷幕，各国使节与江湖豪客怀揣各异心绪陆续散去，天下地缘格局却在平静表象下掀起了滔天巨浪。西夏王朝借助此次皇室联姻，与天山灵鹫宫、大理国深度捆绑缔结坚实盟约，彻底打破了大宋、大辽、西夏与大理四方原本微妙脆弱的均势平衡。慕容复夺取西夏驸马以图借兵复国的野心彻底破灭，在众叛亲离与巨大打击下，其心智愈发走向阴暗癫狂，暗中收拢残部并投靠恶贯满盈的段延庆，谋划更为极端的叛逆之举；与此同时，辽国南侵野心昭然若揭，宋辽边关烽烟频传，各方细作密探在风云激荡的边境上飞骑传书、交接军机密信。虚竹与段誉各自携美归位并背负起宗门家国重任，却也将身处大辽南院大王之位、忠义两难的结拜大哥萧峰进一步推向命运的风口浪尖。西夏招亲的风云变幻，为天下正邪冲突与四国争霸埋下深远伏笔，全书终局雁门关悲壮决战的宏大阴云由此悄然笼罩中原大地。",
  "事件概要": "西夏招亲大典在赐婚盟好中落幕，西夏与灵鹫宫、大理结好缔盟，打破天下四方均势。慕容复复国之谋彻底落空，心智愈趋癫狂，暗谋极端叛逆之举；边关谍报频传，天下纷争四起，辽国阴云渐重，四国争霸终局之势已悄然显露。",
