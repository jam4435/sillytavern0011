  "事件引子": "幽暗泥泞的枯井深处寒意刺骨，井口上方忽地传来凌乱急促的脚步声与焦灼呼喊。",
  "事件详情": "段誉与王语嫣在枯井定下终身盟约后，身陷数丈之深的滑腻泥坑无法自行脱困，正在商议如何脱险之际，井口上方忽然传来了急促的脚步声与呼唤声。逍遥派掌门、灵鹫宫尊主虚竹因担忧结拜三弟段誉的安危，亲自率领灵鹫宫梅兰竹菊四剑及九天九部部众一路循迹搜寻至此。虚竹伏在井口向下探视，惊喜高呼：“三弟！你可无恙？”井底段誉闻声大喜，扬声回应报平安。虚竹当机立断，吩咐侍女取来灵鹫宫特制的坚韧长绳垂入幽深井底。段誉细心地先将绳索牢牢系在王语嫣腰间，虚竹以内力与众女合力将王语嫣安稳拽上井沿，随后再次垂绳将段誉拉出泥潭。脱险出井后，众人在井旁引清冽泉水洗去满身污泥秽渍，换上干净素雅的新衣，整肃仪容。段誉与虚竹互道别后情由，决定结伴一同前往西夏皇宫赴银川公主的招婿盛会。众人行至皇宫主殿广场，只见慕容复、吐蕃宗赞王子等数百名青年才俊早已云集列队，正式拉开了选婿角逐的序幕。",
