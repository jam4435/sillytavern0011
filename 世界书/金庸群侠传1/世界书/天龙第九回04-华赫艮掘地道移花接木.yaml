  "事件引子": "神不知鬼不觉暗掘地道，换巢鸾凤移花接木。",
  "事件详情": "石门正面强攻受挫，眼见正午时分将至，正面解救已无可能，大理皇室群雄陷入万分焦灼。在此千钧一发之际，随行的大理重臣华赫艮与巴天石等人临危不乱、心生妙计。华赫艮早年精通伏地听声辨位与掘地盗墓之绝技，他当机立断，暗中带领手下高手悄然绕至石室后方数百丈外的隐蔽树林中开工。华赫艮凭借敏锐的地听之术探明石室方位，率众神不知鬼不觉地在地下飞速掘进，硬生生自地底开辟出一条贯通石室下方的秘密地道。地道终于在石室地面破土而出，司空巴天石身手敏捷，率先潜入昏暗的石室之中。巴天石进入室内，只见段誉与木婉清皆已受和合散药力折磨得神智恍惚、气息奄奄。巴天石当机立断，迅速抱起神志不清的木婉清将其送入地道转移脱险；与此同时，大理众人将钟万仇心爱的亲生女儿钟灵悄悄自地道送入石室之中，替代木婉清留在段誉身旁，上演了一出天衣无缝的“换巢鸾凤”绝妙奇计。木婉清被成功救出地道妥善安置，石室内的人质被神不知鬼不觉地掉换为钟灵，石室机关恢复原状，大理君臣布下反制陷阱静候正午到来。",
  "事件概要": "起因：华赫艮凭地听之术于后方密林开工，率众自地底飞速掘进贯通石室地道。发展：巴天石潜入石室抱起神志不清的木婉清送入地道，将钟灵悄然换入石室。结果：换巢鸾凤奇计天衣无缝，木婉清获救脱险，大理君臣布下反制陷阱静候正午。",
