  "事件引子": "白影如电直噬手腕，剧毒发作黑气弥漫。",
  "事件详情": "就在龚光杰的长剑即将刺穿段誉胸膛的千钧一发之际，仍端坐于房梁之上的少女钟灵柳眉倒竖，娇叱一声“放肆”，随即玉手猛然一扬，掌中蓄势待发的闪电貂通体化作一道迅捷无伦的雪白流光，如雷霆般自半空俯冲扑下，精准无误地直噬龚光杰执剑的手腕。龚光杰只觉手腕处猛然一麻，整条手臂劲力尽失，长剑当啷一声脱手坠落在地。他惊骇定睛看去，手腕皮肉上已赫然多了两个殷红细小的牙印，伤口周围瞬间泛起一层触目惊心的浓重黑气，毒素迅速蔓延。得手后的闪电貂轻巧折返，梁上的钟灵抚貂拍手娇笑，扬言龚光杰已中闪电貂绝顶剧毒，若无她的独门解药，三个时辰之内必定全身皮肉溃烂而亡。龚光杰中毒倒退，东宗与西宗弟子见同门被异兽暗算重创，群情激愤，数名剑手纷纷拔剑出鞘将段誉与钟灵团团围住，剑湖宫内剑拔弩张的大混战一触即发。",
  "事件概要": "起因：千钧一发之际梁上少女钟灵娇叱出手，玉手扬起纵出雪白闪电貂俯冲扑咬。发展：闪电貂精准咬中龚光杰手腕致其长剑坠地，伤口迅速泛起触目惊心的浓重黑气。结果：钟灵扬言无解药必烂肉而死，群雄拔剑合围段钟二人，大混战一触即发。",
