  "事件详情": "杨过请得周伯通与瑛姑团聚、令慈恩安心而死、又取得灵狐，连做三件好事，心中十分高兴，与郭襄、神雕一同回到万兽山庄。史氏兄弟见杨过连得两头灵狐，喜不自胜，当即割狐腿取血。史叔刚服后自行运功疗伤。是晚万兽山庄大排筵席，公推杨过上座。席上陈列尽是猩唇、狼腿、熊掌、鹿胎等诸般珍异兽肉，数十味之多，旁人一生未尝一味的，此晚尽得品尝。席旁一只大盘盛满山珍供神雕享用。史氏兄弟与西山一窟鬼对杨过不再说感恩戴德之言，各人心中明白，自己性命乃杨过所赐，日后不论有何差遣万死不辞。席上各人高谈阔论，说的都是江湖奇闻轶事。郭襄自和杨过相见以来一直兴高采烈，此时却默默无言。杨过偶尔望她一眼，见她脸上微带困色，只道小姑娘连日奔波劳碌不免疲倦，哪想到郭襄因和杨过分手在即、良会无多，因而悄悄发愁。",
