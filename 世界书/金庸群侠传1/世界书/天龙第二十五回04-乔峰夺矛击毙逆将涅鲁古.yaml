  "事件引子": "铁矛贯日飞虹贯空，乔峰凌空掷矛刺死叛军先锋楚王。",
  "事件详情": "叛军首领楚王耶律涅鲁古眼见行刺即将大功告成，却被半路杀出的乔峰以一人之力击溃大阵，顿时恼羞成怒、杀心大起。他自恃武勇且座驾凶猛，决意亲手将这名强敌刺死，以夺取弑君首功。耶律涅鲁古双腿猛夹马腹，狂催坐骑，双手紧握一杆碗口粗细的精钢长矛，借着奔马之势化作一道寒芒，直奔乔峰心口狠辣刺来，矛尖撕裂空气发出刺耳尖啸。乔峰眼见长矛袭至，面无惧色，在矛尖堪堪触及衣襟的刹那间微一侧身，以极精妙的身法避过锋芒，同时右手探出如电，一把牢牢扣住了精钢长矛的矛杆。耶律涅鲁古只觉一股沛然莫御的巨力顺矛身传来，双手虎口瞬间撕裂剧痛，长矛脱手被乔峰硬生生夺去。未等耶律涅鲁古变招换式，乔峰顺势借力踏前一步，左掌雷霆轰出，正中耶律涅鲁古胸膛，掌力透背而过。耶律涅鲁古当场胸骨碎裂、气绝毙命，死尸翻滚跌落马下，精钢长矛易手落入乔峰手中。众叛军见主帅阵亡，顿时肝胆俱裂、军心大溃，余部死士纷纷丢盔弃甲向四野林莽狼狈逃窜，刺杀危机彻底化解。",
  "事件概要": "楚王涅鲁古指挥叛军强弩乱射（起因）；乔峰夺过三丈重铁矛灌注绝顶真气凌空掷出（发展）；铁矛贯穿涅鲁古胸膛将其钉死于马下（结果）。",
