  "事件引子": "冰崖顶端罡风呼啸、杀气森然，两大绝顶高手力竭之下一注孤掷，誓要将宿敌毙于掌下。",
  "事件详情": "冰崖之上杀气滔天，童姥与李秋水已斗至力竭神疲却毫不罢手，双双将残存的毕生真元尽数凝聚于双掌，誓要将宿敌毙于掌下。侍立一旁的虚竹眼见两位长辈面色惨白、招式却愈发狠绝毒辣，深知此招一出必有一方甚至双双殒命。虚竹秉持佛门慈悲为怀之心，脑中唯念救人，再难坐视不理，遂大声疾呼：“两位师伯师叔快快住手，同门何苦自相残杀！”呼喊声中，虚竹不顾漫天激荡的护体罡风与自身微薄修为，毅然决然施展轻功合身飞扑，强行切入两人招式交汇的风暴最中心。虚竹双手合十挺身立于冰岩，试图以肉身化解这场血海深仇。然而此时童姥与李秋水掌力吞吐已如离弦之箭、决堤狂澜，仓促间纵有心撤劲亦根本收手不及。只听得“砰、砰”两声沉闷至极的巨响，天山童姥炽热刚猛的天山六阳掌悍然轰在虚竹前胸，李秋水曲折阴柔的白虹掌力则毫无阻滞地狠狠印在虚竹后背。狂暴的掌劲瞬间撕裂虚竹胸背僧袍，庞大的毁灭力道透体而入，将虚竹死死夹在两大绝顶宗师的气劲漩涡之中。",
  "事件概要": "童姥与李秋水拼至油尽灯枯，双双凝聚残存真元决意同归于尽。侍立在侧的虚竹心怀慈悲，舍身飞扑至二人招式交汇之处挺身劝阻。二人出掌如决堤之水收势不及，六阳掌与白虹掌力结结实实轰在虚竹胸背，将其死死夹在毁灭气劲之中。",
