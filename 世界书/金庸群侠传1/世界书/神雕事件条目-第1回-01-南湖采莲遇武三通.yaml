  "事件详情": "南湖之上烟水蒙蒙，五个少女荡舟采莲，歌声婉转。其中两个九岁幼女是表姊妹程英和陆无双。湖边柳树下坐着一个蓬头垢面的怪客，颈挂婴儿围涎。陆无双顽皮，掷莲蓬打他，怪客竟连皮带衣吞吃。程英心善，细心剥去莲子苦心递上。怪客吃了清香莲肉，咧嘴一笑，挟起二女飞步奔至一处坟场。原来他乃大理武三通，因义女何沅君嫁了陆展元而十年疯癫。他误将程英认作何沅君，先厉声质问'何沅君呢'，复又自撞墓碑，头破血流。程英心生怜悯，为他包扎伤口，见他痛哭不禁落泪相拥。怪客忽又携二女至陆展元夫妇墓前，得知二人已死且何沅君也已亡故，发狂摧树击碑，徒手掘开何沅君坟墓。二女趁其全神挖坟，仓皇逃回陆家庄。",
  "事件概要": "程英、陆无双因武三通发狂掘墓逃回陆家庄，何沅君与陆展元已死之事被彻底揭开，旧怨由此引爆。",
