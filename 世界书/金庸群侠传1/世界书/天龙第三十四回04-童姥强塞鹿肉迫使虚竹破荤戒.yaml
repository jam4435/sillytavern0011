  "事件引子": "深夜幽暗的冰窖寒气逼人，油脂炙烤的浓郁肉香悄然弥漫在刺骨坚冰之间。",
  "事件详情": "深夜冰窖昏暗幽冷，天山童姥为彻底击碎虚竹顽固的僧侣执念，迫使其甘心顺从逍遥派，暗中施展狠辣手段设下破戒之局。童姥暗中以内力生火，将白日猎得的鲜鹿肉烤得油脂滋滋作响、肉香四溢。趁着虚竹因多日劳顿在冰角沉沉昏睡、毫无戒备之际，童姥身形如鬼魅般飘至其近前。她指风如电，刹那间凌空点中虚竹的“哑穴”与“膻中穴”，使其四肢僵硬难动、发不出半点声响。童姥冷笑一声，强行捏开其紧闭的牙关，将一块滚烫油腻的烤鹿肉硬塞入其口中，紧接着掌力隔空微吐，以内劲顺其食道直灌，迫使虚竹喉头滚动、咕咚一声将鹿肉硬生生吞入腹中。童姥随即拂袖解开其穴道。虚竹惊厥醒转，口鼻间尽是挥之不去的浓烈荤腥之气，刹那间如遭五雷轰顶，深知自己已破了佛门重戒。他面色惨白如纸，痛不欲生下疯狂以指抠喉剧烈干呕，扑倒在寒冰上泣血叩首、向西方佛祖悲声忏悔。童姥见状放声尖利狂笑，冰窖内回荡着得意嘲弄之声，虚竹的清规防线被硬生生撕开裂口。",
  "事件概要": "童姥为破除虚竹的佛门清规执念，暗中烤熟鹿肉，趁其沉睡制住哑穴与膻中穴，强行以内力灌塞滚烫鹿肉迫其吞下。虚竹穴道得解后察觉破了荤戒，五内俱焚下抠喉干呕泣血忏悔，童姥则狂笑嘲弄其迂腐，硬生生击穿其佛门戒律防线。",
