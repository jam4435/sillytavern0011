  "事件引子": "恭迎师叔步入秘阁，苏星河引虚竹踏入悬空木屋见掌门。",
  "事件详情": "少林随行小僧虚竹生性木讷愚钝却秉性至善，立于玄难身后目睹段延庆面目扭曲、举杖自戕，少林慈悲之心油然而生。他全不知晓珍珑凶险，亦不懂深奥弈理，脑中唯有一念：绝不能眼睁睁看着活人在眼前丧命，哪怕搅乱棋局受罚也要救人一命。千钧一发之际，虚竹心中默念佛号，猛地闭紧双眼，抢步上前抓起一枚白子盲目掷出！只听“啪”的一声脆响，白子不偏不倚落在了棋盘左下角黑白重围之中——这一着落子，竟然是围棋大忌中绝无仅有的“自填一气”。虚竹这一落子，硬生生将自家左下角纠缠相连的整整二十余枚白子气门彻底堵死，亲手将大片己方生力军送入黑子腹中尽数阵亡。千百年弈理从未有过此等自杀自灭之荒唐下法。众人见状先是一愣，继而满场哗然，鸠摩智抚掌哂笑，南海鳄神破口大骂，群雄哄堂大笑讥讽少林小僧愚不可及，玄难亦气得脸色发铁，厉声喝斥虚竹退下领罪。棋盘上二十余枚白子被当场扣除吃尽，棋枰上赫然空出一大块空旷石壁；而段延庆受此突如其来的巨变猛然一惊，铁杖停在额前寸许处，自残之势硬生生被打断，暴乱真气受阻，侥幸捡回一条性命。",
