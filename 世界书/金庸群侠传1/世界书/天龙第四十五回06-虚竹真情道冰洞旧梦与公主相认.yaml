  "事件详情": "西夏皇宫偏殿内，银川公主的招亲问答进入最终甄选阶段，内侍奉命向最后参选的天山灵鹫宫尊主虚竹发问。虚竹本无求聘驸马之意，心怀坦荡无求，面对“生平最快活之地”、“最爱之人容貌姓名”等三道直击心灵的考题，他合十躬身，以至诚纯朴的赤子之心当众如实答道：“小僧生平最快活之处，是在一处黑暗冰冷的冰窖之中；最爱之人不知其姓名容貌，只在梦中相会，小僧唤她‘梦姑’，她唤小僧为‘梦郎’；虽未见真容，却早已刻骨铭心。”此言一出，垂帘之后的银川公主李清露心神剧震、泪落罗裙，伴随一声清脆的白玉茶盏落地碎裂声，公主不顾宫规猛然掀帘而出，颤声唤出“梦郎”之名。虚竹闻听那魂牵梦萦的熟悉温软嗓音，猛然抬头相对，两人目光交汇瞬间确认了彼此身份，在众目睽睽之下紧紧执手相认相拥。虚竹以至诚质朴击穿了满殿权贵机巧的政治算计，两人历经千难万险终在西夏殿前实现旧梦重圆与生死相许的真情闭环。",
