  "事件引子": "闻听段姓煞气现，扬鞭直取书生命。",
  "事件详情": "击退来敌之后，黑衣女郎骑在神骏的黑马之上，居高临下冷冷审视着一袭书生打扮的段誉。女郎语气森寒，厉声质问他是何方来客，竟敢公然擅闯万劫谷，难道未曾看见谷口那块杀气腾腾的“杀无赦”石碑。段誉浑然不知潜藏的凶险，当即恪守礼节躬身作揖，坦荡自报家门为“大理段誉”，并诚恳说明自己此行是为求见谷主钟前辈与钟夫人，有极其重要之事当面禀告。不料黑衣女郎闻听“段”姓之后凤目煞气顿显，冷笑指出其父对段姓之人怀有刻骨仇恨，早有严令凡姓段者擅入此谷皆必死无葬身之地。女郎认定段誉乃是自投罗网，厉喝一声“纳命来罢”，随即悍然扬起刚刚击退强敌的黑色长鞭，不由分说便要施展辣手将段誉当场击毙。段誉手无缚鸡之力，面对猝然降临的夺命鞭影险象环生，双方冲突在电光石火间骤然升级为生死对决。",
  "事件概要": "起因：女郎居高临下质问擅闯者，段誉坦荡作揖自报“大理段誉”并说明求见来意。发展：女郎闻段姓煞气顿显，直言其父立有擅入者死严令，认定自投罗网厉喝出手。结果：黑色长鞭不由分说悍然挥出直取段誉性命，双方冲突骤然升级为生死危机。",
