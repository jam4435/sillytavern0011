  "事件引子": "聚贤庄外车辙深陷，大厅内杀气森然，数百豪杰拔刃出鞘之声铿锵刺耳，寒芒笼罩厅堂。",
  "事件详情": "乔峰心中无比清楚，如今洛阳聚贤庄聚集了数百名誓要诛杀自己的中原武林高手，那里早已是刀山火海般的龙潭虎穴，此番前往无异于踏入十死无生的绝境。然而为了挽救马车中重伤濒死的阿朱，争取那仅存的一线生机，乔峰毅然将自身生死置之度外。他亲自驾着一辆简陋的破旧马车，一路风尘直奔聚贤庄。抵达庄前，乔峰神色沉凝，毫无半分畏怯退缩之意，昂首挺胸、气度豪迈地径直推门闯入聚贤庄大厅。大厅内原本正在誓师商讨诛杀大计的数百名中原豪杰见乔峰竟敢单枪匹马悍然现身，无不大惊失色、骇然失语，原本喧嚣的大厅顿时陷入极度的震惊与骚动。面对突然降临的生死大敌，少林僧人、丐帮长老及各派掌门纷纷倒吸凉气，霍然站起并拔出随身的刀枪剑戟，兵刃出鞘之声此起彼伏，寒芒瞬间笼罩整座大厅，形成了数百豪杰刀剑齐举、与孤身一人的乔峰剑拔弩张正面峙立的对峙局面。",
  "事件概要": "为救重伤垂危的阿朱，乔峰将生死置之度外，亲自驱车直抵洛阳聚贤庄，昂然闯入誓师大厅。厅内商讨诛峰大计的数百名中原豪杰惊骇万状，少林僧人、丐帮长老及各派掌门纷纷拔刃而起，瞬间形成刀剑齐举、正面峙立的剑拔弩张之局。",
