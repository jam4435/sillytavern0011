  "事件引子": "荒冢纸冠千秋幻梦，慕容复称帝残丘阿碧终身相守不离不弃。",
  "事件详情": "江南常熟郊野荒坟枯草丛中，残阳斜照、寒鸦悲鸣。昔日名满天下的姑苏慕容复历经少室山惨败、西夏求亲落空与生父出家等多重打击，在复国大业化为泡影后心智彻底崩溃失常。此时慕容复身披褪色残破锦袍，头戴摇摇欲坠的简陋纸冠，端坐在黄土枯冢之上充当龙椅。数名乡野顽童贪图吃食，在坟前排成两列跪拜叩首，高呼“吾皇万岁”；慕容复面露得意狂喜，口中大喝“众爱卿平身”，连连伸手抓出竹篮中的残碎糖糕与油纸点心，煞有介事地向孩童们论功行赏、加官晋爵。忠仆阿碧身着一袭洗得发白的素布罗裙，提着竹篮侍立在侧，眼中含着无限凄酸与温柔热泪；每当慕容复手舞足蹈险些跌落时，阿碧便轻声软语耐心宽慰，小心翼翼地为他扶正纸冠、拂去衣袍尘土。面对残酷现实，慕容复彻底选择在疯癫幻象中寻求永恒慰藉，阿碧亦决意放弃韶华相伴残生。随着孩童们抢得糕点哄笑散去，荒丘上唯余慕容复自言自语的帝王呓语，横跨数代的大燕复国执念在此化作凄凉绝响。",
  "事件概要": "慕容复沉溺大燕皇帝狂梦终老荒冢（起因）；阿碧采莲换钱买糖侍奉其一世无怨无悔（发展）；红尘痴恋尽化一叹（结果）。",
