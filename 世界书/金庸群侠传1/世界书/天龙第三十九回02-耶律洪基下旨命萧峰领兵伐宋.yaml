  "事件引子": "天子密旨南下屠戮，辽帝强令南院大王乔峰统帅三军伐宋。",
  "事件详情": "在大辽国南京析津府皇宫内，大辽皇帝耶律洪基胸怀吞并中原的勃勃野心，意图倾举国之兵大举挥师南下，发动全面的侵宋战争，誓要踏平大宋江山、一统天下疆域。为此，耶律洪基在金殿之上紧急传召受封为南院大王的结义兄弟萧峰入宫觐见。金殿之上君臣对坐，耶律洪基开门见山地展现出不可动摇的侵略意志，正式对萧峰下达皇帝圣旨，命其挂帅出征，担任南征大元帅一职，统率大辽数十万精锐铁骑充当南下先锋，全力向大宋边境进发并荡平关隘城池。耶律洪基意在倚仗萧峰盖世无双的威猛武艺与在军中崇高无上的威望，将其作为攻破大宋中原城防的锋利刀刃。这道强令挂帅伐宋的圣旨直接摆在了萧峰面前，将萧峰推向了背叛契丹皇命与践踏故土恩义的尖锐冲突之中，宋辽边境一触即发的灭顶战祸也由此正式拉开序幕。",
