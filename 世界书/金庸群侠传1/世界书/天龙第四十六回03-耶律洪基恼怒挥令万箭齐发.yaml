  "事件引子": "帝王震怒强令诛戮，耶律洪基狂怒挥剑喝令三军万箭齐发。",
  "事件详情": "见萧峰不仅当众抗旨拒降，更言辞如刀直斥自己的侵略野心，辽帝耶律洪基顿觉帝王颜面荡然无存，胸中怒火如火山喷发，昔日结义之情与招抚之念荡然无存。他面容狰狞扭曲，反手拔出腰间镶宝天子佩剑，凌空狠狠劈断身侧传令军旗，向数十万重骑大军厉声咆哮：“逆贼萧峰大逆不道，背叛母国！全军听令，放箭！将这群贼寇尽数射杀，一个不留！”随着天子佩剑劈落，辽军阵前凄厉的金角号声骤然撕裂长空。三万名精锐强弩营与重甲神射手齐步踏前，机括铮鸣作响，数万柄强弓硬弩瞬间拉成满月。刹那间，遮天蔽日的狼牙铁箭与透甲钢锥化作漫天乌云，带着尖锐刺耳的破空呼啸，如狂风暴雨般倾泻向绝壁之下的群雄联军。面对这毁灭性的灭顶箭阵，群雄奋力挥舞刀剑兵刃在周身织起光网格挡，外围数名江湖豪杰刹那间中箭负伤、血染黄土。退无可退的万丈绝壁被箭雨打得碎石横飞，群雄联军瞬间陷入十死无生的绝杀炼狱。",
