事件名称: 奇遇事件-天龙-无量松林捕朱蛤
事件地点: 大理/云南/无量山
触发条件:
  全部:
  - 变量: user数据.初始属性.机敏
    大于等于: 14
  - 变量: user数据.初始属性.福缘
    大于等于: 11
事件持续时间:
  时: 3
事件引子: 夏日雨后松林中传来沉闷如老牛般的巨大鸣叫，枯叶堆中隐隐泛起一团刺目的血红火光……
事件概要: 玩家于烂松林中巧妙避开剧毒白雾捕获万毒之王莽牯朱蛤，并采得伴生朱蛤灵芝，得辟毒神效。
事件详情: 雷雨初歇，无量山松林深处传来声若洪钟的奇异吼叫。玩家拨开湿漉枯枝，见一只仅二寸长短、通体赤红如火、生有金眸的万毒之王莽牯朱蛤正喷吐极阳白烟。玩家以迅捷身法避开毒雾，以寒玉锦盒轻灵将其罩住捕获。在其栖息的老树根旁，更采得一株吸收其至阳之气而生的异种朱蛤灵芝。
参与人物:
- 玩家
insert:
  user数据:
    包裹:
      莽牯朱蛤伴生灵芝:
        类型: 药品
        品阶: 神品
        功效类型: 永久增幅
        物品描述: 吸收万毒之王至阳毒气而生的极品异草，服之气血内息大充，诸般凡俗毒虫剧毒不敢侵犯。
        属性修正:
          气血: 30
          内力: 30
        数量: 1
update:
  user数据:
    修为: '+2000'
delete: {}
后续事件: {}
