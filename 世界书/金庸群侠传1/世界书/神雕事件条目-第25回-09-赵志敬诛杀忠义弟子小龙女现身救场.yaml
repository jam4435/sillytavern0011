  "事件详情": "大殿上宋德方一走，蒙古贵官便对赵志敬说犯上作乱之辈人数不少掌教之位坐不安稳。赵志敬骑虎难下，按教规问叛教犯上者该当何罪。弟子鹿清笃答道当在三清神像之前自行了断。赵志敬一一审问被擒众道——二十四人均挺立不屈，其中王志坦等性子火爆的更是骂声不绝，只有三人害怕求饶被松绑。赵志敬命鹿清笃行刑，鹿清笃提起长剑将为人谨厚和善、全教上下个个和他交好的于道显一剑刺死。众道大声鼓噪，尹克西令数十名蒙古武士拦在众道之前。鹿清笃手起剑落又刺死两人，第四个便轮到尹志平。鹿清笃提剑正要向尹志平胸口刺落——忽听得一个女子声音冷冷道：'且慢，不许动手！'众人回头只见小龙女一身白衣站在门口，她说道：'你站开！这个人让我来杀。'与此同时，宋德方在后山玉虚洞前只见数十名蒙古武士正在搬运山石堵塞洞门——金轮法王高瘦的身影站在洞口督工，达尔巴和霍都在旁指挥。宋德方知五位师长性命危在旦夕，持剑从松树后窜出运剑如风向金轮法王背心刺去。剑尖离他背心不到一尺——猛地眼前金光一闪当的一声金轮回掠与剑刃一碰。宋德方虎口剧痛长剑脱手飞出，一震牵动真气哇的一口鲜血喷出，迷迷糊糊中听得大殿方向传来呐喊便昏晕过去。金轮法王催促众武士赶紧堵塞玉虚洞——以防丘处机等五人冲出。",
