    "大宋/终南山/重阳宫": "重阳宫三清殿中一片死寂。赵志敬冷冷问道：'按照本教教规，叛教犯上者该当何罪？'弟子鹿清笃答道：'当在三清神像之前自行了断。'赵志敬命鹿清笃提剑上前，将站在左首第一个的于道显一剑刺死。就在鹿清笃提剑正要刺向第四人尹志平时——一个白衣少女突然出现在殿门口，冷冷说道：'且慢，不许动手！'"
  },
