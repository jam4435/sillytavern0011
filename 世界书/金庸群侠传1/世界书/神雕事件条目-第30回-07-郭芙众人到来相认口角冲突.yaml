  "事件引子": {
    "大宋/绝情谷": "杨过刚救出程英陆无双，忽然背后一个女子声音冷笑道：'你这般背后骂人，难道便不卑鄙么？'众人回头，说话的是个美貌少女——正是郭芙。她手持剑柄怒容满面，身旁男男女女站着好几个人……"
  },
  "后续事件": {
    "事件名": "第30回-08-李莫愁杀洪凌波脱困众人围攻",
    "描述": "众人尚在口角之时，情花丛中忽然传来洪凌波的一声大叫——李莫愁正将徒弟高高举起"
  },
  "事件详情": "陆无双正骂斩断杨过手臂的恶贼时郭芙冷笑出声——'你这般背后骂人难道便不卑鄙么'。陆无双奇道又没骂她。郭芙刷的抽出半截长剑昂然道：'他的手臂便是我斩断的。我赔不是也赔过了，给爹爹妈妈也责罚过了，你们还在背后这般恶毒的骂我。'说着眼眶一红委屈无限。原来武三通、郭芙、耶律齐、武氏兄弟等在小溪中避火，待火势弱了缘溪水而下和黄蓉及完颜萍耶律燕相遇便到绝情谷来。一行人比杨过等早到半日，在谷前谷后遍寻天竺僧和朱子柳被困之处不获耽搁了时光。至于李莫愁师徒和程英姊妹进入绝情谷，却均是被周伯通童心大发而分别引来。当下黄蓉武三通等向一灯行礼各人互相引见。程英从未见过黄蓉但久闻师姊大名十分钦仰，上前磕头叫了声'师姊'。郭芙听母亲吩咐竟要对程英长辈称呼，那一声'师叔'叫得异常勉强。杨过和小龙女携手远远站着。杨过向小龙女臂弯中的郭襄瞧了一眼道'龙儿把这女孩儿还给她母亲罢'。小龙女举起郭襄在她颊上亲了亲走过去递给黄蓉——黄蓉称谢接过，这女孩儿自出娘胎后此刻方始安安稳稳抱在怀里。杨过对郭芙朗声说道'郭姑娘你妹子安好无恙我可没拿她去换救命解药'。郭芙怒道'我妈妈来了你自然不敢'。陆无双向郭襄看了一眼对程英道'这是你师姊的小女儿吗但愿她长大以后别耍横蛮刁恶才好'。郭芙大怒按剑喝道'你这跛脚……'被黄蓉喝止。",
