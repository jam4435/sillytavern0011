  "事件引子": "雁门关外乱石嶙峋、阴风怒号，陡峭绝壁间荒藤横生，四下尽是苍凉肃杀之意。",
  "事件详情": "置身于雁门关阴森险峻的绝壁之下，乔峰怀着对生身父母惨烈过往的无限哀思与求证之心，迫切要在峭壁间寻找出父当年临终前所刻的契丹文绝笔。乔峰运起轻功在陡峭嶙峋的石壁间上下攀爬寻觅，伸手拨开丛生的荆棘乱藤与厚重青苔，目光不放过任何一处石痕。经过良久的苦苦搜寻，他终于在深处乱藤掩映之下找到了那方关键的刻字绝壁。然而当他满怀希望凝神细看时，眼前的景象却令他震惊莫名：石壁上原本留存的契丹字迹，竟已被不知名的高手抢先一步破坏！对方依仗极其强悍深厚的内力与利刃，将生父遗留的血书字迹生生刮去削平，整片石壁被削磨得光滑如镜，半点字痕皆未残留。唯一的关键物证就此荡然无存，身世真相再度被残忍掩盖。乔峰神情惨痛，颤抖着双手抚摸着冰冷平滑的石壁，满腔悲苦与怒火如烈焰般喷涌而出，忍不住仰天发出凄厉悲怆的如雷长啸，群山为之震颤。",
  "事件概要": "乔峰在雁门关乱藤掩映的绝壁间苦苦寻觅生父遗留的契丹血书，却惊见刻字石壁早被未知高手以内力与利刃齐整削平、刮磨如镜。追查身世的关键物证彻底荡然无存，乔峰抚壁悲痛欲绝，满腔怒火无从发泄，怆然仰天发出如雷长啸。",
