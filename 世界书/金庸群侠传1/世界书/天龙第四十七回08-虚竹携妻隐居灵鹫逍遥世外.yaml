  "事件引子": "缥缈峰顶飞雪茫茫，灵鹫圣殿内青烟缭绕，阶下黑压压伏满各路洞主岛主，满堂屏息肃杀。",
  "事件详情": "雁门关兄弟诀别之后，身兼逍遥派掌门与灵鹫宫尊主的虚竹彻底看破红尘名利争斗，决意携西夏银川公主李清露（梦姑）远离武林是非，归隐天山缥缈峰。虚竹率领九天九部侍女及西夏随从穿越茫茫风雪重返灵鹫宫圣殿，阶下三十六洞洞主与七十二岛岛主战战兢兢伏地请罪。虚竹面容悲悯，双手合十运转逍遥派玄门纯阳真气，亲自施展精妙手法，将众人体内残存的生死符剧毒尽数拔除化解，并当众将封存各洞岛奴役名册与毒蛊解药的玄铁秘匣付之一炬，温言宣告从此免去所有朝贡苛制。乌老大等群豪叩头流血、感激涕零，真心归附灵鹫宫。李清露在旁含笑相伴，协助虚竹抚御九天九部，推行宽和仁善之规。自此天山各部封关谢客，虚竹与李清露在云雾缭绕的缥缈峰顶看朝霞暮雪、调琴论道，彻底遁离武林纷扰。一部写尽众生贪嗔痴怨与悲欢离合的宏大传奇，终在灵鹫仙境的飘渺云海中圆满落下了历史帷幕。",
  "事件概要": "虚竹携李清露重返灵鹫宫，面对伏地请罪的各洞岛群豪心怀悲悯，运纯阳真气尽化其生死符，当众焚毁奴役名册免除苛制。乌老大等群雄感激涕零真心归附。虚竹夫妇随后整肃宫规、封关谢客，在缥缈峰顶归隐修道，彻底远离武林纷扰。",
