  "事件引子": "王府正厅内华灯璀璨，珍馐罗列，段正淳夫妇设宴款待木婉清，席间笑语融融。",
  "事件详情": "当夜，镇南王府正厅华灯齐放，段正淳与刀白凤特意摆下丰盛晚宴，款待贵宾木婉清。酒席之上，段正淳夫妇暗中细致审视，见木婉清姿容绝色、倾国倾城，言谈举止间虽带着几分幽谷野性与泼辣，但眼角眉梢对段誉皆是一往情深的缱绻爱意；而段誉亦对木婉清关怀备至、夹菜照拂，二人情投意合。段正淳与刀白凤相视之下心生欢喜，对这位未来的王府儿媳感到极为满意。酒过三巡，段正淳面带笑意主动举杯相询，向木婉清询问其父母的高姓大名与仙乡何处，言明王府打算择选良辰吉日、备办重礼前往其家中正式登门求亲，以全两姓之好。木婉清见王爷诚意求亲，便放下防备坦诚相告：自己自幼随师父在偏僻幽谷中抚育长大，从未见过生身父母，师父道号“幽谷客”，在江湖上人称“秦红棉”。这一回答顿时令原本喜气洋洋的求亲宴席骤生波澜。",
  "事件概要": "段正淳夫妇设宴款待木婉清，见其与段誉情深意重，大为赞许并欣然举杯提亲，探问其父母仙乡以便登门行聘。木婉清坦言自幼随师父幽谷客长大、不知双亲，更道出师父名讳乃秦红棉，使得满堂喜庆骤化惊澜。",
