  "事件引子": "太湖湖心烟波浩渺，一叶狭长快船荡漾碧波，四下水声哗然，看似宁谧中暗伏杀机。",
  "事件详情": "快船行至太湖湖心开阔水域，阿朱与阿碧深知若在陆上正面对决绝非吐蕃国师敌手，当即依计发动奇袭。阿朱看准时机，迅疾弯腰猛力拔出船底预设的暗塞，冰冷的太湖之水瞬间汹涌喷涌灌入船舱。伴随着阿朱一声“船漏啦”的娇呼，二女毫不犹豫地双双纵身跃入碧波，犹如两条轻灵的美人鱼潜水疾游出数丈之远。与此同时，已恢复行动的段誉趁势发难，全力施展绝顶轻功“凌波微步”，足尖轻点水波，身形如风踏浪飞掠，紧随二女身后破水奔逃。鸠摩智惊觉受骗，勃然大怒，长啸声中纵身飞扑而出欲强抓段誉。然而快船急剧倾覆下沉，湖水湍急难觅立足点，鸠摩智纵有通玄内力，在水战身法上终难敌江南儿女的灵动机变。飞扑落空之下，鸠摩智只得被迫提气拔高，狼狈纵落在一旁耸立的孤立礁石之上，只能怒目圆睁、眼睁睁看着段誉与二女乘上预备的另一艘小艇破浪远去。",
