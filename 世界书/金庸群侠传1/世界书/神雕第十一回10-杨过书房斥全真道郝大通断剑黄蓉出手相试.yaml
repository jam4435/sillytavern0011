  "事件详情": "郭靖黄蓉引着郝大通、孙不二、尹志平、赵志敬四人走进书房，双方分宾主坐下，杨过跟着进来站立一旁。郭靖让他坐时摇头说'我不坐'——面对着武林中的六位高手他纵然大胆到这时也不自禁的惴惴不安。郭靖向来把杨过当作自己嫡亲子侄一般，心想也不必问什么是非曲直定然做小辈的不是，当下板起脸要杨过向两位师叔祖师父磕头请罪。赵志敬霍地站起冷笑道：'贫道怎敢妄居杨爷的师尊？郭大侠你别出言讥刺。'黄蓉料知杨过所犯之事定然重大异常，缓缓说道请赵师兄坐下细谈。杨过突然大声道：'他不是我师父！'此言一出满座皆惊。郭靖霍地立起颤声质问——拙于言辞不会骂人但脸色铁青已怒到极点。黄蓉低声劝道：'靖哥哥这孩子本性不好犯不着为他生气。'杨过把心横了：'除死无大事最多你们将我杀了。'于是朗声说道：'我本性原来不好可也没求你们传授武艺。你们都是武林中大有来头的人物何必使诡计损我一个没爹没娘的孩子？'说到'没爹没娘'四字自伤身世眼圈微红——但随即咬住下唇心道：'今日就是死了我也不流半滴眼泪。'随后痛述全真教虐待——赵志敬不传武功叫小道士打他，郝大通打死了爱护他的孙婆婆。郝大通被当众直斥不由得脸如死灰，伸出左手从赵志敬腰里拔出长剑倒转剑柄递向杨过：'不错我是杀错了人。你跟孙婆婆报仇罢我决不还手就是。'杨过冷冷戳穿他的大方。郝大通是武林前辈竟给这少年几句话刺得无言可对——手上运劲一抖拍的一声长剑断为两截，将断剑往地下一丢长叹一声说道：'罢了罢了！'大踏步走出书房头也不回。郭靖过了半晌问杨过这几年在干什么口气已和缓了许多。杨过说郭靖上终南山时将重阳宫数百个道士打得没还手之力——旁人不能欺郭靖却拿小小孩子出气，'这几年来我过的是暗无天日的日子'。郭靖只道杨过所言是实怜惜之心不禁大盛。黄蓉却鉴貌辨色心中起疑。突然间黄蓉手臂一长挥掌往杨过天灵盖直拍下去——这一掌是她家传的'落英神剑掌'，毫无先兆直拍脑门正中'百会穴'与额头'上星穴'两大要穴。杨过脑中念头急转——右手微微一动立即垂下：'郭伯母是试我功夫来着要是我架了她这一掌那就是自认撒谎。'竟甘冒生死大险垂手不动。黄蓉手掌拍到他头顶却不加劲——见他脸现惊惶之色既不伸手招架更不暗运内功护住要穴，显是丝毫不会武功的模样，当下微微一笑回身入座向郭靖低声道：'他确然没学到全真派的武功。'但随即心中暗叫'啊哟不对险些受了这小鬼之骗'——想起杨过在桃花岛以蛤蟆功震伤武敦儒武功已有了根基纵使没半点进境适才也定会招架。当下也不说破心想且瞧你如何捣鬼再作计较。",
