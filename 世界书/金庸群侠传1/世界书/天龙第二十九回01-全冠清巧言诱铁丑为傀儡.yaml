  "事件引子": "郊外密林幽暗阴森，落叶沙沙作响，双目失明的阿紫蜷缩一旁气息微弱。",
  "事件详情": "幽暗密林深处，全冠清为了借助铁头人游坦之通天彻地的武功夺取丐帮大权，面对面具罩头、神情木讷且一心只顾守护双目失明阿紫的游坦之，暗中布下诛心之计。全冠清缓步上前，伸手紧紧按住游坦之颤抖的双肩，眼神闪烁着狡黠与贪婪，语带蛊惑地压低声音道：“庄兄弟，阿姑娘双目失明受尽苦楚，要让她重见天日唯有一条明路！天下顶尖名医与少林私藏的灵丹圣药，寻常人万难求得。只要你肯出面助我荡平丐帮异己、登顶大位，丐帮数十万弟子纵然踏破天下山岳，也定会全力替你搜寻仙方救治阿姑娘！”游坦之闻言身躯剧震，伸手轻轻抚摸着阿紫冰凉的双颊，眼中原本的浑噩瞬间化作狂乱执念。全冠清趁热打铁，自怀中掏出一枚雕刻着狼首的铁骨调令硬塞入游坦之手中，更以阿紫未来的生死安危为筹码，循循善诱其在大会上以至寒掌力立威。游坦之早已心智沉沦、善恶不辨，为了挚爱能重见光明，他毫不犹豫地攥紧铁令，毅然决然立誓听凭全冠清全权驱使。全冠清阴谋得逞，暗自狂喜，两人就此结成狼狈为奸的夺权同盟，一代魔功传人游坦之彻底沦为其幕后操盘的嗜血傀儡。",
  "事件概要": "全冠清窥见游坦之极寒魔功并洞悉其软肋，以动员全帮搜寻灵丹神药医治阿紫眼伤为饵巧言蛊惑，将狼首铁骨令塞入其手中诱其争夺帮主之位。游坦之救人心切执念入魔，立誓听命驱使，沦为全冠清夺权弄权的幕后傀儡。",
