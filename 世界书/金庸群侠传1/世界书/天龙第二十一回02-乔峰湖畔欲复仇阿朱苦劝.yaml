  "事件详情": "乔峰与阿朱一路千里追踪，终于寻至细雨绵绵的小镜湖畔。乔峰一心欲查明当年雁门关惨案的真相，替惨死的生身父母报仇雪恨。当他隔着青翠竹林，赫然见到大理镇南王段正淳就在湖边舍前时，胸中压抑已久的滔天杀机瞬间大炽。乔峰目眦欲裂，浑身真气激荡，当即便欲施展绝顶武功冲上前去立施杀手，将段正淳当场击毙以雪深仇。侍立在旁的阿朱见乔峰神情激愤、杀意凛然，心中大惊失色，急忙伸手死死拉住乔峰的衣袖，柔声苦苦劝阻。阿朱极力劝说乔峰万万不可在未明真相前贸然动手，指出当年之事错综复杂，在尚未查清事实真相与明确对方身份之前，切莫草率定人生死，以免误伤无辜、铸成无法挽回的大错。阿朱恳切提议，由她先出面设法试探段正淳的虚实与底细。在阿朱入情入理的温言劝解下，乔峰终于克制住沸腾的怒火与杀念，答应暂缓直接动手，二人遂隐蔽于竹林暗处静观其变。",
