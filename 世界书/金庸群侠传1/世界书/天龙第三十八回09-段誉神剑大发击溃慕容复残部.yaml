  "事件详情": "曼陀山庄惊天剧变接踵而至，段延庆在惊悉段誉竟是自己亲生骨肉之后心神巨震，大仇得报与骨肉相认的复杂情绪交织，最终仰天狂笑绝尘而去，慕容复逼宫篡位之谋彻底瓦解失控。此时，段誉因亲睹父母及诸位长辈惨死当场，悲痛欲绝、五内俱焚，体内压抑的雄浑内力如怒海狂涛般彻底失控爆发。虚竹与段誉兄弟同心，合力暴起杀入曼陀山庄大厅之中。段誉悲愤交加之下，体内六脉神剑神威大发，十指连弹之间，少商剑、商阳剑、关冲剑等无形剑气破空呼啸激射，如疾风骤雨般纵横扫荡。慕容复及其残部在六脉神剑凌厉无匹的剑气与虚竹深厚内力的合力围剿下毫无招架之力，残存党羽被尽数击溃斩杀、死伤枕藉，慕容复一方全线溃败、狼狈不堪，彻底失去了所有抗衡与翻盘的资本与实力。",
