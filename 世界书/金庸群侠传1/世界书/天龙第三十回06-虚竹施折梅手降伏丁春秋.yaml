  "事件引子": "少林大雄宝殿前广场毒雾弥漫，各路群雄屏息凝视，虚竹踏步上前迎战凶威赫赫的丁春秋。",
  "事件详情": "少室山广场正中，虚竹为替逍遥派师门清理叛逆门户并相助结义兄长，全力迎战星宿老怪丁春秋。丁春秋满脸狞笑，挥舞鹅毛羽扇卷起漫天毒砂，右掌运起凶名赫赫的“化功大法”直印虚竹心口。虚竹体内蕴含无崖子所传的七十年纯阳北冥真气，真力如汪洋大海护住周身，丁春秋的化功邪力甫一接触便如泥牛入海，反被浑厚气劲震得掌臂剧麻、气血倒流。虚竹趁势施展天山童姥亲传的逍遥派绝学“天山折梅手”，指影翻飞若穿花拂柳，以精妙无双的借力打力之法，连环卸开丁春秋刺来的喂毒钢杖并拍飞其暗藏的碧磷毒针。丁春秋见邪功受制，仓皇间张口喷出毒雾企图做殊死一搏。虚竹神色一肃，掌心真气流转将掌中水汽瞬间化为数枚薄如蝉翼的寒冰之片，施展灵鹫宫镇派神技“生死符”反手拍出。晶莹冰片如疾电般精准没入丁春秋周身要穴，逢热即融渗入血脉。求生不得、求死不能的奇痒与剧痛骤然爆发，丁春秋凄厉哀嚎着抛下羽扇、满地翻滚抓挠皮肉，彻底被虚竹降伏制伏。",
  "事件概要": "虚竹为清理门派叛逆迎战丁春秋。丁春秋催动化功大法与毒物猛攻，虚竹凭无崖子七十年纯阳北冥真气尽化邪力，施天山折梅手卸除奇毒兵刃。丁春秋垂死反扑喷吐毒雾，虚竹凝水化冰打入生死符，剧痛奇痒骤发迫使丁春秋哀嚎翻滚，彻底受制伏诛。",
