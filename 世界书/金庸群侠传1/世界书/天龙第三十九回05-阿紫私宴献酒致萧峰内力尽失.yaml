  "事件引子": "一盏毒酒神功涣散，乔峰饮下阿紫所奉毒酒真气尽溃。",
  "事件详情": "当夜在南京南院大王府内，灯火昏暗，阿紫设下私宴款待萧峰。阿紫一心沉浸在与姐夫永不分离的甜蜜幻想之中，满怀期待地将盛有“长相守神仙水”的毒酒端至萧峰面前，柔声劝其开怀痛饮。萧峰素来对阿紫视若亲妹，加上平日行事光明磊落、坦荡无私，对阿紫端上来的酒水毫无戒心与防备，当即接过酒杯仰头将杯中剧毒一饮而尽。然而酒水入腹片刻，猛烈无比的慢性奇毒“圣水神药”骤然在萧峰体内狂暴发作。萧峰只觉周身奇经八脉传来剧烈难忍的剧痛与麻痹之感，原本雄浑磅礴的绝顶护体内力如同决堤江水般瞬间溃散殆尽，四肢百骸酸软无力，甚至连站立都难以维持。萧峰猝不及防之下身中至毒暗算，不仅当场失去了盖世神功与反抗能力，更在惊愕痛苦中陷入任人宰割的绝境，阿紫的盲目偏执瞬间酿成了无法挽回的惨烈恶果。",
  "事件概要": "阿紫将毒药调入烈酒奉给乔峰（起因）；乔峰毫无防备一饮而尽瞬间毒发周身酸软神功尽失（发展）；伏兵四起（结果）。",
