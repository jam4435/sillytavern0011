  "事件详情": "杨过与郭芙争执后，突然长啸一声右袖卷起一拂——五人猛觉一阵疾风掠过脸上犹似刀割，五枝火把一齐熄灭眼前漆黑一团。郭襄「啊啊」一声啼哭已被杨过抢走出了石室。众人无火折不敢久留急忙觅路潜回溪水。刚钻出水面眼前一片通红——溪左溪右树林均已着火，蒙古兵攻打重阳宫失利后放火烧山泄愤。此时正当隆冬草木枯槁满山已成火海。郭芙思母心切见溪左一个女子背影以为黄蓉奔了过去，近处才见是李莫愁——原来杨过盛怒下挥剑斩断上面石棺连下面棺盖竟也斩裂，李莫愁死里逃生掷出石枕跟着跃出。她在棺中虽不到一个时辰但这番注定闷毙的滋味实是人生最苦最惨，心中积满怨毒只想要害死世上每一个人。李莫愁脸露微笑柔声对郭芙说话，突然欺近点中她腰下穴道，大笑而去——凄厉的歌声「问世间情是何物」隔着烈焰传来。郭芙软瘫在地被浓烟呛得大声咳嗽，大火逼近武氏父子和耶律齐隔火相望却无法相救。便在此时一团旋风裹着灰影疾刮而来——正是杨过！他奔到郭芙身边挺剑刺去剑身从她腰下穿过，左臂向外挥出运起浑厚内力，郭芙便如腾云驾雾般飞上半空越过十余株烈焰冲天的大树扑通一声掉入溪水中。原来杨过带着小龙女郭襄出墓后见蒙古兵烧山，找了个草木稀少的石洞暂避。小龙女问他为何不救郭芙，杨过恨恨说她将咱们害成这样我不亲手杀她已算对得起她父母。小龙女叹道「咱们不幸那是命苦，让别人快快乐乐的不很好吗？」杨过心中终究不忍，除下身上浸得湿透的长袍裹在玄铁剑上催动内力急挥，剑上风势逼开大火救出郭芙。他回到小龙女身边时头发衣衫都已烧焦裤子着火腿上烧起无数大泡。小龙女抱着郭襄俏立劲风烈焰之间，倚着杨过脸上露出平安喜乐的神色。武氏父子、郭芙、耶律齐从溪水中隔火仰望，但见二人衣袂飘飘姿神端严宛如神仙中人，郭芙猛然间自惭形秽。武三通大叫问杨过去不去绝情谷救人，杨过一怔自言自语道「我还管得了这许多么」径自往山后走去。",
