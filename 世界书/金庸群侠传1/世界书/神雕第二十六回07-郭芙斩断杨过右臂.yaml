  "事件详情": "那日杨过与郭芙在襄阳郭府之中言语冲突以致动手。郭芙怒火难忍，抓起淑女剑往他头顶斩落。杨过中毒后尚未全愈四肢无力，眼见剑到情急之下只得举右臂挡在面前。郭芙狂怒之际使力极猛，那淑女剑又锋利无比，剑锋落处，杨过一条右臂登时无声无息的给卸了下来。这一剑斩落竟致如此，杨过固然惊怒交迸，郭芙却也吓得呆了，知道已闯下了无可弥补的大祸，但见杨过手臂断处血如泉涌不知如何是好。过了一会郭芙突然哇的一声哭了出来掩面夺门奔出。杨过一阵慌乱过后随即镇定——伸左手点了自己右肩'肩贞穴'的穴道，撕下被单紧紧缚住肩膀以止血流，再用金创药敷上伤口。寻思此处是不能再耽了得赶紧出城去。慢慢扶着墙壁走了几步只因流血过多眼前一黑几欲晕去。便在此时只听得郭靖大声说道'快，快，他怎么了？血止了没有？'语音中充满了焦急之情。杨过当时心中只一个念头——'我决不要再见郭伯伯，无论如何不要见他。'猛力吸一口气从房中冲了出去。他奔出府门牵过一匹马翻身便上驰至城门。守城的将士都曾见他在城头救援郭靖对他十分钦仰，见他驰马而来立即开了城门。此时蒙古军已退至离城百余里外。杨过不走大路纵马尽往荒僻之处行去。他身中情花剧毒但过期不死，或许如天竺神僧所言吸了冰魄银针的毒汁之后以毒攻毒反而延了性命。但剧毒未去迟早总要发作，此刻身受重伤若到终南山去找寻姑姑定然不能支持。想到一生孤苦除了在古墓中与小龙女相聚这段时日之外生平殊少欢愉，这时世上唯一的亲人已舍己而去复又给人断残肢体命当垂危，言念及此不禁流下泪来。",
