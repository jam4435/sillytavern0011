  "事件引子": "洛阳城外聚贤庄残垣冷清，血腥未散，暗中伏哨重重，一道魁梧身影收敛声息潜近庄外。",
  "事件详情": "乔峰伤愈破洞而出之后，心中最深沉的挂碍唯有阿朱的生死安危。当日聚贤庄内他为求薛神医医治阿朱而甘愿独斗群雄，如今自己侥幸脱险，不知阿朱究竟是否保住性命。为此，乔峰不顾自身仍处于天下武林联合追杀的极度凶险之中，毅然隐匿行迹潜回聚贤庄周边。他收敛浑身强悍气息，伏于暗处施展耳力四处打探虚实。经过一番周密探查，乔峰终于获知确切消息：薛神医医术通神入化，果然施展妙手将濒死的阿朱从鬼门关全力拉回，使其体内严重内伤彻底化解。然而令乔峰既喜且忧的突发情况是，阿朱伤势彻底痊愈之后，并未久留于聚贤庄中，而是已然独自收拾行装悄然离庄，江湖茫茫不知所踪。确认阿朱安然无恙且恢复康健，乔峰心头悬挂的万斤巨石终于落地；但因未能与阿朱当面相见且不知其去向，乔峰在如释重负之余，只得暂时压下寻人之思，选择转向追查父母血案与自身身世的真相。",
  "事件概要": "乔峰挂念阿朱生死，冒天下之大不韪潜回聚贤庄打探，暗中获悉薛神医已施妙手将其体内重伤彻底医愈，然阿朱痊愈后已独自离去、杳无音信。乔峰心头重担虽落，却憾于未能相见，只得暂捺寻人之念，决意转赴雁门关追查身世真相。",
