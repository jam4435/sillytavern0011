  "事件详情": "法华寺一战两败俱伤后，丘处机与江南七怪各自疗伤。双方冷静下来后，都意识到中了段天德的奸计，并为焦木和尚的惨死及这场毫无意义的血战感到懊悔。数日后，伤势稍愈的双方在醉仙楼再次会面，厘清了所有误会。为了弥补郭、杨两家的不幸，也为了给这场纷争作个了结，双方定下了一场长达十八年的赌约。约定由江南七怪去寻找郭啸天的妻子李萍及其后人，丘处机则去寻找杨铁心的妻子包惜弱及其后人。双方各自将寻到的孩子收为弟子，悉心传授武功。十八年后的今天，让两个孩子在此地比武论高下，以定双方当日的胜负。从此，丘处机与江南七怪分头行动，开启了日后郭靖、杨康截然不同的人生轨迹。",
  "事件概要": "丘处机与江南七怪解开误会并订下十八年赌约，从此分头寻找并教导郭杨后人。",
