  "事件引子": "僻静草堂内弥漫着浓烈血腥与刺鼻药香，染血白纱散落狼藉，案头锋刃银针泛着森森寒芒。",
  "事件详情": "僻静荒山草堂之中，药香混杂着浓烈血腥。阎王敌薛神医施展移目接脉秘术，替失明的阿紫缝合完毕。游坦之双腿早被震断，此番自愿忍受生挖眼珠的钻心之痛献出双目，瘫在榻下血水里虚弱喘息。随着薛神医剪开重重白纱，阿紫眼界骤然大放光明，她抚摸双眼欣喜若狂地娇笑跳起。游坦之听闻笑语，凭借残存双臂在碎石泥泞中艰难爬向阿紫，带血的手指试图触碰其裙角，颤声乞怜：“阿紫姑娘……你看见了吗？这是我的眼睛……”阿紫垂首看清眼前之人：游坦之面容被铁面毁损狰狞如鬼，眼眶只剩两个乌黑淌血的空洞，双腿瘫软如泥。阿紫毫无半分怜惜与感激，反觉恶寒彻骨，尖叫着运足内力飞起一脚狠狠踹在游坦之胸口，厉斥：“滚开！哪来的丑怪怪物，莫弄脏了本姑娘的衣裳！”游坦之重创之下肋骨断裂、狂喷鲜血倒飞数尺。薛神医递上的止血药膏被阿紫扬手打翻，阿紫整肃衣衫绝情拂袖而去，将双目尽盲、瘫痪残喘且身负内伤的游坦之弃于荒山冰冷泥泞中。",
  "事件概要": "薛神医施移目接脉秘术，将游坦之双眼缝予阿紫。阿紫解开眼纱重见光明，正狂喜娇笑间，见双目剜空、面容毁损如鬼且双腿残疾的游坦之爬来攀扯相认。阿紫心生恶寒嫌弃，运足内力飞起一脚踢断其肋骨，绝情拂袖而去，将重创残喘的游坦之弃于荒山泥泞血泊中。",
