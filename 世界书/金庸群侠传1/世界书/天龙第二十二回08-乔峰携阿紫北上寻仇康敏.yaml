  "事件引子": "单骑北上直指塞北，乔峰携重伤阿紫长途求医寻参续命。",
  "事件详情": "在小镜湖畔彻底安葬好挚爱阿朱之后，乔峰心若死灰、万念俱灰，满腔悲愤难平。然而在极度的悲痛与自责之中，乔峰的理智逐渐恢复清醒，彻底看清了导致这场人间至惨悲剧的根源——自己之所以会将段正淳错认作当年的带头大哥并酿成错杀阿朱的惨祸，全因有人居心叵测地提供虚假消息、蓄意撒谎构陷借刀杀人。乔峰胸中再度燃起滔天的复仇烈焰，暗暗立下重誓，誓要彻查当年雁门关血案的真相，将那名恶毒设局、害死阿朱的幕后黑手康敏彻底揪出，令其付出血的代价。乔峰不愿再多看一眼这片令人痛彻心扉的伤心之地，毅然决然收拾行装，带着年幼孤苦的阿紫离开小镜湖，纵马启程北上踏上寻仇之路，誓要亲自揭开康敏的蛇蝎阴谋，为无辜惨死的阿朱讨还公道，查明血仇的所有真相。",
  "事件概要": "为践阿朱遗言乔峰抱重伤阿紫跨马启程（起因）；一路昼夜不停输送真气维持阿紫一线生机（发展）；乔峰决意北上长白山老林寻找百年人参续命（结果）。",
