  "事件引子": "神农帮营地内药炉烟雾弥漫，中毒帮众哀嚎呻吟不绝，司空玄面带阴鸷冷眼俯视阶下俘虏。",
  "事件详情": "闪电貂与钟灵相继被擒后，神农帮众人身中貂毒急需解救。司空玄以此为筹码展开逼迫，取出一枚散发着刺鼻腥臭的独门毒药“七日断肠散”，强行逼迫手无缚鸡之力的段誉咽下。司空玄厉声定下七日死期，勒令段誉必须在七天之内翻山越岭赶赴万劫谷，向钟灵之父钟万仇讨取闪电貂的克制解药；若逾期未归，段誉自己必将受断肠散毒发导致肠穿肚烂而死，而被扣押在营地的钟灵亦会被神农帮残忍千刀万剐。身陷敌手的钟灵深知万劫谷凶险难辨、父母性情古怪，虽自身沦为人质却无比担忧段誉的安危。趁着帮众看管交接的间隙，钟灵暗中将自己贴身穿着的一双葱绿绣花鞋悄悄递交至段誉手中，叮嘱其以此作为面见父母、求取信任与解药的重要凭信。段誉腹中剧毒入体，但为挽救钟灵性命，毅然收好绣花鞋信物，强忍不适跌跌撞撞地冲出神农帮营地，孤身一人仓皇向深山老林狂奔而去。",
