  "事件引子": "治国以仁爱民如子，段誉执掌大理天南四十载四海升平海晏河清。",
  "事件详情": "天山缥缈峰灵鹫宫后山松林间，云雾缭绕、清泉流响。身兼逍遥派掌门与西夏驸马的虚竹，携爱妻李清露立于石阶之上，面对三十六洞七十二岛部众的叩拜挽留，二人淡泊名利，决意卸下权位归隐林泉。虚竹手抚结义兄长萧峰生前郑重托付的青竹打狗棒与降龙武籍，为免旷世绝学湮没，他与聪慧的李清露在山崖秘洞中潜心推演整理。李清露研墨铺帛、记录口诀，虚竹则沉肩坠肘、舒展身形，将原本精繁的降龙廿八掌删繁就简，精炼化为威力更醇厚的降龙十八掌；随后他旋身纵步，青竹棒点刺挑劈，将打狗棒法的变化精要逐一演练纯熟。待丐帮挑选的传人历尽艰险登峰求法时，虚竹于石坪上拆解招式、细致点拨其经脉内力运转，毫无保留地倾囊相授。传功完毕后，虚竹将打狗棒与修定掌谱郑重交还丐帮传人，并命灵鹫宫九天九部封存逍遥派石壁绝学。丐帮神功得以薪火相传重光中原，虚竹则与李清露相视一笑携手隐入飘渺群山，彻底完成了兄长托付与两派神功的传续闭环。",
  "事件概要": "段誉在位四十载爱民如子（起因）；大理国四境清平无刀兵之患（发展）；晚年禅位出家无量山得享高寿（结果）。",
