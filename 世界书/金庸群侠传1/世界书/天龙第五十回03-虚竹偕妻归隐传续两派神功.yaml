  "事件引子": "丐帮绝学已在此前由虚竹亲传新主，灵鹫宫诸事渐定，夫妻二人整装收心，萌生远离喧嚣之念。",
  "事件详情": "天山缥缈峰灵鹫宫后山松林间，清泉流响，风摇松枝。虚竹与妻李清露步入安静石室，收拾旧日药卷与武学手札，忆起结义兄长萧峰在少室山临别时以降龙廿八掌与他共同删繁为十八掌、并亲授打狗棒法的嘱托。丐帮继任帮主已于此前九月上山，虚竹遵诺悉心演示两门绝学，亲手交还信物及完整掌法口诀，薪火传承早已完成。如今夫妻二人再无负担，面对三十六洞七十二岛部众的挽留，婉辞尊荣，命九天九部妥善封存逍遥派石壁绝学，交代门人依仁恕之道治理天山；随后与李清露相携漫步云海松径，择幽静居处安度余年。不曾再次学习或重复传授丐帮两大武学。",
  "事件概要": "虚竹忆及萧峰生前与己将降龙廿八掌精简为十八掌、托付两大丐帮绝艺；既已于九月向丐帮新主传功完毕，他与李清露卸下尊荣，封存逍遥派石壁秘学，携手隐居天山。",
