  "事件引子": "少室山广场上杀气未散，另一名黑衣老者忽发森寒嗤笑，引得满场豪杰错愕侧目。",
  "事件详情": "就在全场豪杰为萧远山的复仇杀戮惊骇莫名之际，站在一侧始终冷眼旁观的另一名黑衣老者忽然发出一阵森寒刺骨的嗤笑。在天下英雄与少林高僧的错愕注视下，该老者神色自若地抬起枯瘦的右掌，慢条斯理地扯下遮面黑巾，随手掷于脚下。黑巾褪去，显出一张清瘦矍铄、双目神光如电的威严面庞。少林玄字辈高僧玄渡与玄生定睛望去，顿时如见鬼魅般倒退数步，颤声惊呼：“慕容老施主？你……你当年不是早已染疾西归？！”一旁的慕容复更是浑身剧颤，扑通跪倒在地，失声悲呼：“爹爹！”慕容博负手傲立，嘴角挂着睥睨众生的冷笑，坦然承认三十年前假死遁世乃金蝉脱壳之计。他这三十年来同样隐姓埋名潜伏于少林藏经阁中，不仅将七十二绝技抄录带回燕子坞参合庄，更在暗中窥伺列国烽烟、图谋光复大燕皇朝。慕容博的死而复生如同一记惊雷在大雄宝殿前炸开，假死面具彻底撕碎，姑苏慕容氏三十年的复国野心与阴谋诡计在天下英雄面前暴露无遗。",
