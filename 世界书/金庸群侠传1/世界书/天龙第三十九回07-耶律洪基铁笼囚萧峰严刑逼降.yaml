  "事件引子": "阴暗潮湿的深宫地牢内铁索森然，特制玄铁笼散发着刺骨寒意，炭火中烙铁烧得通红。",
  "事件详情": "耶律洪基生擒萧峰之后，为彻底打消萧峰脱困的可能并逼其挂帅出征，下令工匠连夜打造了一具沉重无比的特制“玄铁死牢铁笼”。辽军兵士将身中奇毒、武功尽失的萧峰粗暴地锁入这座坚不可摧的生铁死牢铁笼之中，将其秘密押入大辽南京皇宫地牢的最深处，并派遣大批心腹重兵日夜严密看管。在这阴暗潮湿、不见天日的深宫地牢里，耶律洪基传令狱卒对铁笼中的萧峰施加各种严酷无情的严刑拷打，鞭笞烙印轮番加身，誓要以肉体与精神的双重摧残击垮萧峰的铁骨意志，逼迫其低头屈服、出任大辽南征大元帅。萧峰虽遍体鳞伤、受尽酷刑折磨，却始终咬紧牙关、宁死不屈，绝不向侵宋野心妥协分毫。至此，萧峰被严密囚禁于玄铁牢笼深处，身心遭受极重创伤，宋辽战事逼迫态势也随之进一步升级。",
  "事件概要": "耶律洪基命工匠连夜赶制玄铁死牢铁笼，将身中剧毒、功力尽失的萧峰深锁于地牢之中，并派重兵日夜严加看守。为逼其低头挂帅伐宋，耶律洪基传令狱卒对铁笼中的萧峰施加鞭笞烙铁等百般酷刑。萧峰受尽摧残、皮开肉绽，却始终咬紧牙关誓死不从。",
