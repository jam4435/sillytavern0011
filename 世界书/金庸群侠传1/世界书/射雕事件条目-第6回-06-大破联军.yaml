  "事件详情": "江南六怪的到来彻底扭转了土山上的战局。与此同时，拖雷听从朱聪的建议，命令少量兵马在马尾绑上树枝，来回奔驰，制造出援军大至的假象。桑昆、札木合联军见状军心动摇。铁木真看准时机，命令全军向桑昆左翼薄弱处发起冲锋。哲别一箭射中桑昆，敌军主帅落马，阵脚大乱。铁木真率部成功突围，并与拖雷的部队汇合。随后，铁木真施展缓兵之计，假装重伤，释放都史并赠送厚礼，使王罕等人放松警惕。八日后，铁木真兵分三路，发动夜间奇袭，一举击溃毫无防备的联军。王罕、桑昆父子西逃后被杀，都史死于乱军。札木合兵败后被亲兵出卖，最终被铁木真赐予有尊严的死亡。此战过后，铁木真统一了蒙古各部，在斡难河源大会上被推举为“成吉思汗”。",
  "事件概要": "铁木真击溃王罕与札木合联军并统一蒙古，郭靖也因战功成为成吉思汗面前的功臣。",
