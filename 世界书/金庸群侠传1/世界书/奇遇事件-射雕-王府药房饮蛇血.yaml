事件名称: 奇遇事件-射雕-王府药房饮蛇血
事件地点: 金国/中都/赵王府
触发条件:
  全部:
  - 变量: user数据.初始属性.机敏
    大于等于: 13
  - 变量: user数据.初始属性.根骨
    大于等于: 12
事件持续时间:
  时: 3
事件引子: 赵王府幽深药房中药香浓郁，巨竹篓中潜藏着梁子翁饲养二十年的大红异种宝蛇……
事件概要: 玩家夜探王府斩杀异种朱砂宝蛇，痛饮蛇血洗髓伐毛，内息激增，得辟毒灵血体魄。
事件详情: 玩家潜入赵王府后院静谧药房，闻得浓郁参芪与异样腥味。后堂巨竹篓盖猛然震开，一条长丈余、通体朱红如血的怪蛇扑面袭来。玩家敏捷闪避，手起刃落精准斩断蛇颈。蛇血热如沸汤，玩家按耐腥烈俯身痛饮。滚烫蛇血入腹，如烈火般涤荡周身经脉与脏腑暗疾，内力沛然增长，百毒不侵。
参与人物:
- 玩家
