  "事件详情": "段天德挟持李萍一路北逃，躲避江南七怪的追捕。途中，段天德为求自保，屡次欲加害李萍，但均未得手。二人最终在金国中都燕京被金兵强征为夫役，押送使者前往蒙古。在茫茫大漠中，队伍遭遇部落混战，混乱中李萍与段天德失散。她独自逃命，最终在一处沙丘后因体力不支而晕厥。在冰天雪地中，李萍艰难地诞下一名男婴。她用牙齿咬断脐带，将孩子紧紧抱在怀中，并依丈夫遗言为他取名郭靖。母子二人在战场废墟中靠死马和干粮顽强求生，十余日后，李萍体力渐复，抱着郭靖开始了在大漠中相依为命的艰辛生活。她与当地牧民交换物资，畜养牲口，含辛茹苦地将郭靖抚养长大。",
