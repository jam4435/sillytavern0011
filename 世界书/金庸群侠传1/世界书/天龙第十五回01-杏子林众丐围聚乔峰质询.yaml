  "事件引子": "四大长老引众合围，马大元遗体横陈双方剑拔弩张对峙。",
  "事件详情": "无锡城外杏子林中古木参天、落英缤纷，丐帮宋长老、奚长老、陈孤雁、吴长风四大长老率领数百名帮众弟子突然齐聚，将整片杏林围得水泄不通，四周杀机暗伏，气氛凝重肃杀至极。乔峰与结义兄弟段誉并肩傲立于林中空地，面对同帮兄弟的反常合围，乔峰心中疑窦丛生，意欲探明事态真相以维系大局。他放眼望去，赫然发现副帮主马大元的遗体竟横陈于场中，而素来执掌帮规与武学的执法长老白世镜、传功长老吕章却不知所踪。乔峰按捺心头惊疑，身姿挺拔如松，气沉丹田向众人朗声喝问，直指四大长老聚众杏林的真实意图，并厉声追问白世镜与吕章两位关键长老身在何处。面对帮主威严的当面质询，四大长老心怀鬼胎，面色阵阵阴晴不定，既无人出列正面答话，亦无一人遵令退去。双方在马大元遗体旁形成剑拔弩张的僵持之势，数百帮众各持器械严阵以待，林内原本安宁的景致瞬间被冰冷的对峙杀意所笼罩，一场同门内讧的导火索已被彻底点燃。",
  "事件概要": "起因：杏子林中宋奚陈吴四大长老率数百帮众水泄不通合围，马大元遗体横陈场中。发展：乔峰与段誉并肩而立按捺惊疑，朗声喝问聚众意图并追查失踪之白世镜与吕章两位长老。结果：四大长老心怀鬼胎无人答话亦不遵令退去，双方僵持对峙剑拔弩张点燃内讧导火索。",
