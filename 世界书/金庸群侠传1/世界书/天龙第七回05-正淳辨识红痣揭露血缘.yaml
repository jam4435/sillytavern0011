  "事件引子": "王府正厅华筵正酣，“秦红棉”三字骤然出口，杯倾酒溅间满堂气氛骤冷。",
  "事件详情": "听到“秦红棉”三字，段正淳如遭重击，脸色煞白，手中酒杯“当啷”一声脱手砸在桌上，清冽酒水四处飞溅；一旁的刀白凤见状冷笑连连，面色瞬间覆满寒霜。段正淳声音颤抖，急迫地向木婉清求证其师父是否手持一对修罗刀、腰间暗插喂毒短箭，木婉清满腹狐疑地予以确认。段正淳心头巨震，神情陷入无尽的痛苦与悔恨之中，他长叹一声，猝然上前拉开木婉清的衣袖。只见木婉清如霜雪般的手臂之上，赫然印着一颗鲜艳欲滴的红痣！段正淳浑身剧烈颤抖，惨呼“冤孽！当真是天大的冤孽！”。木婉清受此冒犯惊怒交加，猛然抽回手臂厉声质问。段正淳却已老泪纵横，当众凄声吐露实情：木婉清绝非秦红棉的徒弟，而是秦红棉怀胎所生、也是他段正淳当年的亲生骨肉！此言一出如平地惊雷，刹那间令整座王府大厅陷入死一般的沉寂。",
  "事件概要": "段正淳闻听秦红棉之名神色大变，急向木婉清求证其师形貌，更失态上前掀其衣袖辨验红痣。确认红痣无误后，段正淳悲恸惨呼，当众坦白木婉清非秦红棉之徒，而是二人当年所生骨肉，惊天身世令满厅陷入死寂。",
