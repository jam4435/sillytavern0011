  "事件引子": "厅堂内外尸积如山、血流成河，四壁刀痕错落，刺鼻血腥伴随震天喊杀弥漫不散。",
  "事件详情": "这场惊心动魄的惨烈血战足足持续了数个时辰，聚贤庄大厅与庭院之内已然尸积如山、血流成河，场面惨绝人寰。面对中原武林群雄不知疲倦、前仆后继的车轮战疯狂围剿，乔峰虽凭绝顶武功击毙击伤无数强敌，但终究是以一人之力独抗数百高手。在漫长无休止的搏杀争斗中，乔峰终因招架不及，身上被四面八方刺来的刀剑划破、刺中了数十处伤口，殷红的鲜血不断喷涌而出，将整件战袍彻底浸染得通体血红。随着精血与体力的巨额消耗，乔峰原本磅礴雄浑的内力亦逐渐耗竭见底，招式动作不可避免地变得迟缓滞涩，再难维系先前开山裂石的护体罡气与狂暴掌风。群豪见乔峰强弩之末，顿时士气大振，纷纷呼喝着踏过血水与尸堆，从四面八方进一步缩紧包围圈。身负重伤且真力耗尽的乔峰彻底被困死在核心，陷入了十死无生的绝命重围之中。",
  "事件概要": "乔峰独力抗击中原群豪轮番车轮合围，虽毙伤敌手无数，终因寡不敌众而连中数十处刀剑创伤，鲜血浸透战袍。连番恶战使其浑厚真力彻底耗竭，掌风罡气渐散。群豪见其力屈势穷士气大振，趁势踏血聚拢包围圈，将伤重脱力的乔峰彻底困死在核心绝境。",
