  "事件引子": "段誉穴道受制，被鸠摩智交给随从带离牟尼堂。随从分路引开追兵后，鸠摩智亲自提着段誉北行，山路漫长，去向不明。",
  "事件详情": "鸠摩智将段誉抛给门外九名部属后，部属分乘十匹马分路而行，以扰乱保定帝等人的追兵。奔出十余里后，各路人马分道；鸠摩智随后跃下马背，取皮带缚住段誉腰间，亲自提着他从山坳间北行。前三个时辰尽在荒山野岭中穿行，傍晚将段誉系在树枝上，递给他几块干粮，并解开左手小臂穴道供他取食。此后数日，鸠摩智提着段誉不停北行；十余天后，行进方向改为东北，仍避开大路，地势渐平、山渐少水渐多，一日之中往往多次渡河。后来鸠摩智买下两匹马，与段誉分乘，段誉周身大穴始终未解。二十余日的押送旅途后，二人在江南一座小城客店歇宿。鸠摩智试图逼段誉默写六脉神剑经文，段誉据理拒绝，指出此举无异于自寻死路。",
  "事件概要": "鸠摩智挟持段誉离开天龙寺后先令随从分路迷惑追兵，随后亲自提着段誉一路北行。先穿行荒山野岭，十余天后改向东北并沿途渡河，后来买马继续赶路。二十余日后，二人抵达江南一带暂歇，鸠摩智逼段誉默写六脉神剑，段誉识破其意图并拒绝。",
