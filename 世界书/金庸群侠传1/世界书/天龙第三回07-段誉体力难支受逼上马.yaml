  "事件引子": "出谷狭道林木森森，前方黑马纵蹄扬尘，段誉徒步狂奔力竭难支。",
  "事件详情": "二人达成共识后随即启程，木婉清纵马在前飞驰，段誉则在马蹄扬起的尘土后徒步快跑跟随。黑马脚力极快、四蹄翻飞，段誉素来不习武艺且体魄文弱，仅仅拼尽全力奔跑了数里路程，便已累得气喘吁吁、大汗淋漓，双腿沉重如灌铅，渐渐被神骏的黑马甩在后方。木婉清察觉异状只得勒停黑马，回身蹙眉斥责段誉步履迟缓，若照此速度即便走到天黑也休想走出万劫谷，当下心生无奈，勉强开口让段誉上马共骑。不料段誉拘泥于儒家礼教，面露难色地以“男女授受不亲”为由连连推阻，唯恐男女同乘一骑有违礼法。木婉清见他在这等十万火急的救人关头依然满口繁文缛节，顿时勃然大怒，厉声痛骂其为迂腐酸儒，更严厉警告救人如救火，若再敢拖延推诿便要挥鞭将其活活抽死。段誉在木婉清的怒斥与鞭威逼迫下无可奈何，只得硬着头皮顺从妥协，乖乖挪步向马旁靠近。",
