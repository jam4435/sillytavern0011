  "事件引子": "深幽冰窖内寒气森森、滴水凝冰，三更寒夜的大内寝殿外唯闻风掠树梢之声。",
  "事件详情": "破除荤戒之后，天山童姥见虚竹仍口诵佛号不肯断念，决意施展最为绝伦狠辣之计，彻底摧毁其童子之身与佛门根基。三更时分，童姥施展逍遥派绝顶轻功，身如轻烟般潜入守备森严的西夏皇宫大内寝殿，以拂穴手法无声放倒内外侍卫，神不知鬼不觉地将深宫中的西夏银川公主掳掠回冰窖。童姥褪尽少女罗裳，趁着虚竹在极寒中蒙被酣睡之际，将这具温润如玉、散发幽兰体香的绝色胴体悄然塞入虚竹被衾之中，并暗运玄功渡入一丝令人情思迷乱的燥热真气。刺骨冰窟之中，沉睡的虚竹骤然触及一团滑腻温软、柔若无骨的温香软玉，怀中少女因冰冷而本能地紧紧依偎纠缠。虚竹在半梦半醒间心神俱震，体内年轻气血与凡俗本能如狂潮般彻底失控，理性防线在幽香温存下土崩瓦解。二人由惊惶化为沉沦，在冰窖被衾内抵死缠绵、颠鸾倒凤。一番云雨过后，虚竹二十余载精纯童子之身彻底告破，佛门最核心之“色戒”荡然无存，童姥在暗处冷笑见证其全盘沦陷。",
