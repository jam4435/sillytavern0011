  "事件详情": "黄蓉领杨过进书房后，一连数日只教他读书，始终不提武功。这一天读罢了书，杨过独自到山上闲走，想起欧阳锋思念甚殷，倒转身子学欧阳锋的样子旋转起来。转了一阵依照欧阳锋所授口诀逆行经脉，愈转愈是顺遂，一个翻身跃起双掌拍出，登觉遍体舒泰快美无比立时出了一身大汗。他可不知只这一番练功内力已有进展。欧阳锋的武功别创一格实是厉害之极的上乘功夫，杨过悟性奇高，虽然那日匆匆之际所学甚少，但如此练去内力也有所进益。自此之后他每日跟黄蓉诵读经书，早晨晚间有空便自行到僻静山边练功。他倒不是想从此练成一身惊人武艺，只是每练一次全身说不出的舒适，到后来已是不练不快。黄蓉教他读书不到三个月已将一部《论语》教完，杨过记诵极速对书中经义却往往不以为然，不住提出疑难。其实黄蓉教他读书也已早感烦厌，只是常想到此人聪明才智似不在自己下，若习了武功将来为祸不小，不如让他学文习圣贤之说，当下耐着性子教完《论语》再教《孟子》。几个月过去黄蓉始终不提武功，杨过也就不问。他越来越感孤寂，心知郭靖虽收他为徒武功是决计不肯传授的了，打定主意一有机会立即设法离岛。这日下午读了几段《孟子》辞出书房后在海边闲步，忽听桃树林外传来呼呼风响，绕到树后张望，原来郭靖正在林中教武氏兄弟一招擒拿手'托梁换柱'。杨过只看了一遍早就领会到精义所在，但武氏兄弟学来学去始终不得要领。杨过暗暗叹气心想郭伯伯若肯教我岂能如他们这般蠢笨。回到房中百无聊赖，又到海滩学着郭靖所授拳脚使将开来，使了几遍便感腻烦，心念一动：'我若去偷学武功，保管比武氏兄弟强得多。'但随即又想：'郭伯伯既不肯教我又何必偷学？最多给人打死了好希罕么？'想到此处又是骄傲又感凄苦，竟在浪涛声中迷迷糊糊睡着了。",
