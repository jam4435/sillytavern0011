  "事件引子": "杏林深处寒风萧瑟，白世镜捧出森寒法刀逼迫作乱者引颈，肃杀之气凝固全场。",
  "事件详情": "全冠清受制之后，四大长老眼见叛乱彻底败露，依丐帮严苛铁律，犯上作乱者当受法刀穿胸自裁之死罪。执法长老白世镜面容冷峻，手托木盘捧出四柄寒气森森的九环法刀，林中空气凝固至极。乔峰深念四位长老昔日随汪帮主出生入死、为丐帮立下汗马功劳，决意力挽狂澜保全同袍。他朗声历数宋长老血战西夏、陈长老手刃契丹巨寇等赫赫战功，言辞慷慨激昂。白世镜依律逼迫长老受刑，宋长老颤抖着伸手欲取刀引颈；乔峰猛然跨步上前，右手一抄将四柄精钢法刀尽数卷入掌中。在全帮弟子惊呼声中，乔峰毫不迟疑，反手执起第一柄法刀狠狠刺入自己左肩，刀刃透肉三寸、鲜血迸射！随即他咬紧牙关，接连将剩余三柄法刀迅疾刺入右肩与前胸要穴。四柄法刀尽皆深插于身，殷红鲜血瞬间染透青袍，乔峰虽重创失血、脸色惨白，身形却如山岳般岿然不倒。四大长老目睹帮主以身代罪，心神俱裂，痛哭流涕地扑通跪倒在血泊前拼命叩首悔过，誓死效忠，一场自相残杀的帮门浩劫终被乔峰的血肉之躯化解。",
  "事件概要": "全冠清受制后四大长老依律当受法刀穿胸之刑，乔峰念及旧情与功绩，毅然夺过四柄九环法刀，接连刺入自身肩胸要穴代赎长老死罪。血染青袍却屹立如山，四大长老心神剧震扑地痛哭叩首悔过，化解了丐帮同门自残之危。",
