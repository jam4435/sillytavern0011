  "事件引子": "有人在酷寒的深夜，看到数人以一种奇特的方式登上了绝无人迹的秃木峰。",
  "事件详情": "郭靖为见黄蓉，以蛮横态度逼迫鲁有脚想办法。鲁有脚传达黄蓉的“命令”，约郭靖于子时在秃木峰顶相会。郭靖不明其意但决心赴约。在丐帮三长老的帮助下，他们用冻羊腿在光滑的冰壁上搭成一道“羊梯”，成功登顶。郭靖与在此等候的黄蓉终于重逢，两人互诉衷肠，解开了在桃花岛的误会，重归于好。黄蓉也讲述了自己从欧阳锋手中逃脱，并一路暗中跟随、帮助郭靖的经历。两人在峰顶冰洞中彻夜长谈，情意更深。",
  "事件概要": "郭靖黄蓉在秃木峰重逢并说清桃花岛旧误，两人失而复得，关系重新牢固起来。",
