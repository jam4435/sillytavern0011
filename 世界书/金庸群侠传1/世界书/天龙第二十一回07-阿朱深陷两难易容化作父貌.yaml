  "事件引子": "昏黄斜阳掩映寂静农舍，厢房内铜镜幽冷，窗外隐隐传来暴雨将至的沉闷雷鸣。",
  "事件详情": "在离开竹舍的归途中，阿朱心碎欲绝、悲痛万分。她深知乔峰的降龙十八掌掌力天下无敌，生父段正淳绝非其敌手，今夜青石桥之战生父必死无疑；而段正淳若死于乔峰之手，大理段氏的诸多绝顶高手乃至整个大理皇室，随后必将倾巢而出、合力追杀乔峰为王爷复仇。一边是血脉相连的亲生父亲，一边是情深义重、生死相随的心爱之人，阿朱深陷于忠孝与情义的两难绝境之中。为了保全生父的性命，同时避免心爱的乔峰成为大理段氏倾力诛杀的目标，阿朱暗自做出了以命代父的凄绝抉择。回到房中后，阿朱泪如雨下，她强忍心中的绝望与悲楚，坐在铜镜前取出易容器具，施展出神入化、鬼斧神工的易容绝技。阿朱神情专注而决绝，一丝不苟地对镜涂抹修饰，不仅将自己的面容化装成大理镇南王段正淳的模样，甚至连身形体态也修饰得惟妙惟肖、难辨真伪。阿朱彻底化身成“段正淳”，做好了代替生父从容受死的万全准备。",
  "事件概要": "阿朱深知段正淳难敌降龙十八掌，更恐其死后大理段氏倾族追杀乔峰，在生父血脉与挚爱情义的两难绝境下决意舍身代死。她独坐房中含泪取出器具，施展易容绝技将面貌身形化作段正淳模样，做妥代父受死的决然准备。",
