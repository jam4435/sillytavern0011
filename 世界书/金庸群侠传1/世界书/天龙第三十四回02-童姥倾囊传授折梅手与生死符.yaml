  "事件详情": "阴冷冰窖之内寒雾缭绕，天山童姥深感李秋水逼近与三十六洞七十二岛群魔作乱的巨大危机，为求自保并延续宗门，决意将虚竹调教为绝顶战力。童姥身形如电，欺身扣住虚竹腕脉，厉声喝令其气沉丹田，手把手强行引导其体内无崖子所传的七十年北冥真气运转周天。她当场演示逍遥派至高武学“天山折梅手”与“天山六阳掌”，招式化繁为简、奇诡莫测，掌风带起阵阵凛冽呼啸。紧接着，童姥自冰壁上摄取雪水置于掌心，运转阴阳逆顺真气，刹那间将掌中水汽凝化为薄如蝉翼、晶莹剔透的极寒冰片，逼迫虚竹直视“生死符”的种符认穴与劲力催动法门。虚竹在童姥的厉声呵斥与招式推演逼迫下，不得不依言运转六阳掌力，在掌心反复练习化水成冰与逆运真气化解之术。经过数个时辰的高压传授，童姥将两大绝学掌法与生死符的施种、拔除秘诀倾囊相授。虚竹虽满心惶恐，却已将生死符运转脉络与折梅手精要尽数默记于心，体内浩瀚内力与上乘招式彻底连通闭环。",
