  "事件引子": "佛法无私重整戒律，玄慈依法严惩丐帮傀儡庄聚贤降叛逆。",
  "事件详情": "母子相认引得大雄宝殿内群情激愤，丐帮长老与各派豪杰纷纷按捺不住，指着叶二娘厉声逼问：“这小和尚的生父究竟是哪个少林贼秃？还不快快招来！”叶二娘紧咬牙关，将虚竹护在身后，宁死不吐半字。面对满堂汹涌的质询与唾骂，端坐法台正中的玄慈方丈缓缓合上双目，面容悲悯而释然。沉寂片刻后，他口中长宣一声佛号：“阿弥陀佛！”沛然纯阳内力如暮鼓晨钟激荡开来，瞬间将大殿内嘈杂的人声强行压制。在全寺僧众惊骇的目光中，玄慈毅然起身，亲手解下象征少林至高法统的锦斓袈裟，郑重递交到身旁戒律院首座手中。随后他缓步走下台阶，面向阶下数千武林英豪深深合十稽首，朗声说道：“既造如是因，当受如是果。虚竹的生父并非旁人，正是老衲玄慈。二十四年前老衲犯下根本淫戒，贻害无穷，今日当向天下谢罪。”言罢，玄慈躬身垂首。此言如平地炸雷，殿内群雄惊得瞠目结舌，少林众僧尽皆面如死灰，一代佛门领袖当众卸下法衣自承破戒，神圣威望刹那间荡然无存。",
