  "事件引子": "郭靖黄蓉深夜潜入铁掌山，隔窗撞见杨康正在劝诱穆念慈，行踪却已被人察觉。",
  "事件详情": "郭靖黄蓉深夜潜入铁掌山，在石屋窗外撞见正在劝诱穆念慈的杨康。二人行踪暴露，与赶来的真正铁掌帮主裘千仞动手。黄蓉因轻敌，被裘千仞的铁掌击中，身受重伤，气息奄奄。郭靖抱着黄蓉，在追击下慌不择路闯入了铁掌帮禁地——中指峰第二指节的帮主墓室。在洞中，他们又遇到了前来盗宝的裘千丈，经过一番对质，终于揭开了两人是孪生兄弟，一个武功盖世，一个只会吹牛的真相。郭靖在墓室内意外找到了真正的《武穆遗书》。此时，裘千仞在山下放火烧山，欲将三人困死。危急关头，郭靖唤来双雕，欲带黄蓉逃离。无耻的裘千丈企图抢夺白雕，反被雄雕啄下山崖，坠入深谷摔死。郭靖与黄蓉最终乘雕逃出生天。",
  "事件概要": "郭靖黄蓉夺得真正的《武穆遗书》并乘雕脱险，裘千丈坠崖身亡。",
