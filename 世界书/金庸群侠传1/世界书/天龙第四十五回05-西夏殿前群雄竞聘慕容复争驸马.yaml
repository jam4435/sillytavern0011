  "事件引子": "西夏大殿前旌旗蔽日、甲胄森严，四方豪杰与各国俊彦齐聚，竞相争夺驸马之位。",
  "事件详情": "西夏皇宫大殿前旌旗蔽日、甲胄森严，四方武林豪杰与各国宗室才俊齐聚一堂，各展所长争夺银川公主的驸马之位。吐蕃宗赞王子依仗强盛国势与凶悍武艺，言行跋扈狂傲，在殿前大放厥词、目中无人；姑苏慕容复为达成光复大燕王朝的毕生执念，更是不择手段、机关算尽。面对内侍代公主宣读的层层严苛遴选，慕容复整肃衣冠昂首出列，极尽展现王孙风雅与权谋韬略，试图以迎娶公主为跳板借取西夏铁骑雄兵。然而，当宫女在珠帘后代银川公主垂询“生平最快活之处”、“最心爱之人容貌与姓名”这三道直指本心的隐秘考题时，慕容复心无半点真情，唯以政客机心巧言令色，傲然答称“未来登基称帝君临天下方为最快活”、“平生唯念复国大业而无心爱之人”。这番充斥虚伪算计与冰冷野心的作答，令帘后考官与内侍大失所望，慕容复自以为得计的权谋策论在真情考核前彻底碰壁受挫、陷入尴尬僵局，为随后大典的反转落空埋下了无可挽回的失败伏笔。",
