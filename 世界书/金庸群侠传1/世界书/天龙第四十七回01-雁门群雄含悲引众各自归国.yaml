  "事件引子": "雁门关绝壁前朔风呼啸、尘沙漫卷，满地残箭染血，深渊回响着无尽的苍凉与悲痛。",
  "事件详情": "雁门关绝壁前朔风怒号、尘沙漫卷，萧峰折断两截断箭贯胸自戕殉难，以一己之躯消弭宋辽两国的滔天兵戈浩劫。在场的中原武林群豪、各派侠士与各路军阵兵将目睹义兄喋血陨落，人人痛彻心扉、含悲垂泪。虚竹与段誉扑跪在地撕心裂肺痛哭，未料阿紫惨然抱起萧峰遗体纵身跃入万丈深渊，游坦之亦随之坠崖，群雄惊呼抢救不及，唯余深谷绝壁阵阵回响。少林高僧玄渡大师垂泪合十长诵佛号，丐帮吴长风等一众长老捶胸掷刀，痛悔昔日对萧峰的猜忌逼迫与狭隘偏见。关上宋军守卒收起强弓硬弩，与关外群豪相顾默然，满腔杀伐戾气尽化为无尽哀思。面对辽帝耶律洪基勒马北退留下的折箭誓约与满地疮痍，各派首领彻底勘破仇杀虚妄，立誓恪守止战之盟。众人强忍悲痛在崖边仔细收拾散落的染血残箭、折断兵甲与浸血战袍，虚竹与段誉带头焚香酹酒，遥祭萧峰与阿紫英魂。最终，大理、少林、丐帮及天下豪杰互道珍重、含泪揖别，各自统领本部人马拔营启程，分头撤离雁门天险，肃杀要塞重归万籁俱寂。",
  "事件概要": "萧峰自戕殉国与阿紫坠崖后，宋辽干戈平息。虚竹、段誉与群雄强忍巨恸，收殓遗物、焚香酹酒遥祭英魂。吴长风等长老痛悔宿怨，少林玄渡合十默祷，众人恪守止战誓约，互道珍重后分头引众拔营启程，各自班师归国。",
