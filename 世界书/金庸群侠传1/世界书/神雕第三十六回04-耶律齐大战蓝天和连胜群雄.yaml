  "事件详情": "此时武敦儒、武修文兄弟已被人打下台来，朱子柳的侄儿、泗水渔隐的三个弟子、丐帮中多名八袋七袋弟子均已先后失手。耶律齐已连败三名好手，正施展周伯通所授的七十二路空明拳与一个四十余岁的贵州苗人蓝天和交手。蓝天和幼时堕入山崖得遇奇人学得一身刚猛险狠的外门武功，掌力中隐隐有风雷之声威风了得。耶律齐的拳法却是拳出无声脚去无影飘飘忽忽令对方难以捉摸，两人一刚一柔在台上斗得旗鼓相当。台下数百名好汉无不自愧不如。蓝天和久战不胜心下焦躁催动内劲不住增加掌力，又拆二十余招后瞅准破绽大喝一声一掌'九鬼摘星'打去。耶律齐右掌挥出双掌相交粘着不动变成各以内力相拼。过了片刻蓝天和忽然脸上变色踉跄退了两步拱手认输——原来耶律齐的空明拳内力似空非空似实非实，一股粘稠之力瞬息间便传到他丹田，令他小腹如积蓄了十多碗沸水挤逼着要向外爆炸。耶律齐手下留情收了内力，蓝天和感愧之余站到台口向群雄交代耶律大爷英雄仁义自己心悦诚服。此后耶律齐又连败七人，天色将黑再也无人上台较艺。台下凡是稍有见识之人再也不敢上台挑战——耶律齐是郭靖黄蓉之婿与丐帮大有渊源，又是全真派耆宿周伯通的弟子，与郭靖夫妇全真教有交情的好手都不再与争。梁长老走到台口朗声道耶律大爷文武双全我帮上下向来钦仰，若能为我帮之主自是人人悦服拥戴。台下丐帮帮众一齐站起大声欢呼。郭芙见丈夫艺压当场心中欢喜难以言宣，却一瞥眼间忽见神雕和大头鬼坐在妹子两侧不禁一怔——暗想杨过若来抢帮主齐哥能不能敌得过这独臂怪人。",
