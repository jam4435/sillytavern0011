  "事件引子": "紫衫少女毒弄群雄，阿紫以星宿派邪法封锁渡船。",
  "事件详情": "客栈内群豪正争论棋局虚实，门外暴雨狂风中骤然炸响凄厉怪异的法螺与震天铜锣之声。三十余名身披彩袍的星宿派门徒手持毒幡锦旗、蜂拥踹门而入，沿途挥动淬毒钢杖野蛮推搡旁人，厉声高喝：“星宿老仙法力无边，中原蝼蚁还不跪迎！”两名闪避不及的汉子当场被杖力扫中肩胛、骨碎吐血倒地。紧接着一顶八抬绿绸大轿横冲直撞闯入大厅，轿帘掀处，掌门丁春秋手摇一柄鹅毛白羽扇飘然落地。但见他鹤发童颜、银须垂胸，面噙温雅超脱的微笑，俨然一副仙风道骨的武学宗师派头。然而其目光如冰刃般扫过全场，杀机暗涌，原本高谈阔论的群豪瞬间噤若寒蝉、冷汗浸背。面对星宿门徒强占中堂的蛮横行径，在场各派好手皆慑于其残虐恶名，只得咬牙退避至逼仄墙角。星宿弟子迅速将正中三张八仙桌拼合铺陈锦缎，丁春秋端坐主位摇扇冷视，被伤者蜷缩呻吟，整座客栈彻底沦为星宿邪威笼罩下的恐怖修罗场。",
