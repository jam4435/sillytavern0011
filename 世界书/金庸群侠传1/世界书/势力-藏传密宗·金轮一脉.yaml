名称：藏传密宗·金轮一脉
类型：宗门 / 高手师承体系
核心地域：蒙古/和林/和林城
【稳定定位】雪域密宗武学在蒙古上层与江湖活动中形成的一支重要传承，重深厚内功、手印、重兵器与刚猛功力；高层个人传承色彩很强。
【组织与接触】不能把“密宗”视为所有雪域僧人的统一组织，也不能因为遇到蒙古军旅人物就默认其熟悉该脉秘法。核心武学需有明确师承。
【江湖认知】中原武林往往通过金轮法王等代表人物认识这一脉，对其内部教派差异未必清楚。典型关联人物包括金轮法王、达尔巴、霍都等。
【动态事实规则】师徒关系、与蒙古权力的现实联系、人物生死和活动范围，以当前变量、世界事件、游戏时间和实际剧情为准。
