  "事件引子": "缥缈峰巅云雾缭绕，总坛殿内传书飞至，西夏银川公主选婿的榜文打破了灵鹫宫的宁静。",
  "事件详情": "在缥缈峰灵鹫宫中，虚竹获悉了西夏国银川公主选婿的传书消息后，心绪翻江倒海，久久不能平静。他细细推想，西夏冰洞与西夏皇室有着千丝万缕的联系，自己苦苦寻觅、朝思暮想的“梦姑”，极有可能正深居于西夏皇宫大内之中。为了求证心中的执念并寻回挚爱，一向清心寡欲的虚竹毅然决定离开缥缈峰，亲赴西夏国都兴庆府一探究竟。灵鹫宫属下对尊主的安全极为挂念，俏丽忠诚的梅剑、兰剑、竹剑、菊剑四位近身侍女领命随行，贴身护卫左右。虚竹身着尊主锦袍，在四剑侍女的紧密簇拥与严密护持下步下天山。一行人快马加鞭，踏上了漫长而险峻的西行驿道。虚竹一路之上虽有四剑悉心照料饮食起居，但心中唯有对冰洞旧事的追忆与对相见的期盼。此次启程，不仅标志着灵鹫宫之主正式介入西夏局势，也让虚竹彻底踏入了一场关乎情缘与宿命的波澜征途。",
  "事件概要": "虚竹获悉西夏招婿传书，推想朝思暮想的“梦姑”极可能身在西夏皇宫，遂决意西行寻觅挚爱。梅兰竹菊四剑挂念尊主安危，领命贴身护卫。虚竹换上锦袍，在四剑簇拥下步下缥缈峰，策马踏上奔赴西夏的征途。",
