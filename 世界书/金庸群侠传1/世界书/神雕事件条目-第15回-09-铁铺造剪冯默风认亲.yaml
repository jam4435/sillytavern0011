  "事件详情": "迷糊之中杨过忽听陆无双在外拍门叫道：'傻蛋傻蛋！快起来看。'语声颇为惶急。杨过起床披衣开门出去，天色尚未大明，陆无双脸有惊惧之色指着柴扉——门板上印着四个殷红的血手印，显是李莫愁昨晚曾来查探得悉黄药师已去便宣示要杀四人。程英也闻声出来，三人商议一阵无甚妙策，想四人联手纵然不能取胜也足自保。呼叫傻姑时却无应声竟已不知去向，三人大惊分头寻找。程英在一堆乱石中发现傻姑躺在地下已是气若游丝——解开衣服察看背心上隐隐一个血色掌印，果然是中了李莫愁的五毒神掌。忙取出九花玉露丸给她服下，杨过依五毒秘传所载急运内劲为她推拿穴道。傻姑嘻嘻傻笑道：'恶女人，背后，打我。傻姑，反手，打她。'原来李莫愁虽偷袭得手小臂上却也给傻姑反手拍中险些连臂骨也打折了。三人救回傻姑相对愁坐——四人中损了一个好手明日更难抵敌。杨过顺手拿起丝线用剪刀剪断，傻姑在榻上突然大叫：'剪断，恶女人的扫帚！剪断扫帚！'杨过心念一动——那魔头的拂尘是柔韧之物宝刀利剑都伤它不得，若真有一柄大剪刀喀的一下剪断那就妙了。程英陆无双看了一会已明其意都是喜动颜色。程英道此去向北七八里有家打铁铺子，于是程陆二人在马背上垫了被褥扶傻姑横卧了同去铁匠铺。铁铺甚是简陋满地煤屑碎铁。杨过高声叫师傅，半晌边房出来一个老者——须发灰白约莫五十来岁，背脊佝偻双目被烟火熏得又红又细，左脚残废腋下撑一根拐杖。正说话间蒙古什长和汉人传译纵马而来征集铁匠限三日到县城拨归军中效力。冯铁匠叹道：'蒙古元帅征集铁匠自是打造兵器，想蒙古军中兵器向来足备，既要大事添造定是要南攻宋朝江山了。'三人听他出言不俗说得甚是有理。杨过将大剪刀式样说了，冯铁匠也不诧异点头拉扯风箱生炉熔炼镔铁。过了一个多时辰冯铁匠将两片铁条弯成大剪刀粗胚渐渐成形。忽听身后一人冷冷的道：'打造这把大剪刀，用来剪断我的拂尘么？'三人大惊回过头来，只见李莫愁轻挥拂尘站在门口。她拖过一张板凳坐下冷笑道：'我就坐在这里等你们剪刀打好再交手不迟。'又问黄药师何在，程英道：'你明知我师父不在此处还问什么。'李莫愁从怀里取出一张白纸写出十六字钉在柱上要留此为证，催冯铁匠快些打。冯铁匠眯着一双红眼瞧那白纸，突然左手伸出铁钳连针带纸一齐夹起投入熊熊炉火烧成灰烬。这一下众人都是惊诧之极，李莫愁大怒举拂尘要击却随即心想这老铁匠如此大胆难道竟非常人？缓缓坐下问阁下是谁。冯铁匠道：'我是个老铁匠。'李莫愁问为何烧纸，冯铁匠道：'纸上写得不对最好就别钉在我这铺子里。'他一面打铁一面说桃花岛主的弟子只要学得一艺便足以横行天下——先说大弟子陈玄风铜筋铁骨刀枪不入，被李莫愁讥刺'给一个小儿一刀刺死'；又说二弟子梅超风，被讽刺'先给江南七怪打瞎了眼珠再给西毒欧阳锋震碎心肺'；再说三弟子曲灵风，被讽'偷入皇宫偷盗宝物给御前侍卫打死了'。冯铁匠低下头来嗤嗤两声两滴水珠落在烧红的铁上化作两道水气而逝——那是他眼中落下的泪水。他铁锤举得更高落下时声音也更响了。再说四弟子陆乘风精擅奇门遁甲，被讽'归云庄给人一把火烧成白地'。冯铁匠抬起头来厉声道：'你这道姑胡说八道！'李莫愁冷笑让他问三个小娃娃便知端的。程英站起身来黯然说道：'我师门不幸人才凋零。晚辈入门日浅功夫低微不能为师父争一口气。你老人家可是与家师有旧么？'冯铁匠不答却向她上下打量大见怀疑。程英看到他残废的左脚心里蓦地一动——说师父空闲时常和晚辈谈论当年驱逐弟子离岛，陈梅二人自己作孽那也罢了，曲陆武冯四位却是无辜受累，尤其那姓冯的冯默风师哥年纪最小身世又甚可怜，师父思念及之常自耿耿于怀深自抱憾。冯铁匠长叹一声泪如雨下落在烧红的铁块上嗤嗤嗤的都化成白雾。李莫愁冷笑道：'冯默风恭喜你师兄妹相会啊。'这老铁匠正是黄药师的小弟子冯默风——当年被师父打折左腿逐出桃花岛，伤心之余远来襄汉之间打铁为生三十余年始终默默无闻。他听了程英之言百感交集悲从中来。",
