  "事件详情": "正在众人为难之际，忽听西边山坡传来阵阵猿啼。杨过那头神雕正赶着一头苍猿伸翅击打。那苍猿躯体甚大但畏惧神雕猛恶不敢与斗只是东逃西窜啾啾哀鸣。郭襄看得可怜奔过去叫雕大哥饶了这猿儿罢——神雕收翅凝立神情傲然。尹克西站起身来扶起潇湘子向苍猿招了招手，那苍猿奔到他身边竟似是他养驯了一般。两人夹着一猿脚步蹒跚慢慢走下山去。众人见了这等情景心下恻然生悯也没再想到去跟他二人为难。郭襄回头见张君宝头上伤口兀自汩汩流血，从怀中取出手帕替他包扎。张君宝好生感激欲待道谢却见郭襄眼中泪光莹莹心下大是奇怪不知她为什么伤心。却听杨过朗声说道：'今番良晤豪兴不浅他日江湖相逢再当杯酒言欢。咱们就此别过。'说着袍袖一拂携着小龙女之手与神雕并肩下山。其时明月在天清风吹叶树巅乌鸦啊啊而鸣，郭襄再也忍耐不住泪珠夺眶而出。秋风清秋月明落叶聚还散寒鸦栖复惊——相思相见知何日此时此夜难为情。全书至此终。",
