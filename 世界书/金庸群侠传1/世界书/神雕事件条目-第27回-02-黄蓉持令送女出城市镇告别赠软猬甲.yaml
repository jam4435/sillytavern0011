  "事件详情": "黄蓉回卧室取了桃花岛至宝软猬甲用包袱包好，挟在腋下快步出府，展开轻功顷刻间赶到南门。只见郭芙骑在小红马上正与城门守将大声吵闹，那守将口口声声叫着郭姑娘但坚持若无令牌黑夜开城便是杀头之罪。黄蓉上前出示安抚使吕文德的令牌，守将验过无误忙陪笑开城，还牵过自己坐骑供黄蓉使用。母女俩并骑出城南行，黄蓉舍不得就此与女儿分手，竟越送越远。襄阳以南赖此重镇屏隐未遭蒙古大军蹂躏，民居一如其旧。母女俩行出二十余里天色大明，已到了一个小市镇，赶早市的店铺已经开门。黄蓉与女儿同进饭铺叫了些熟牛肉面饼，却谁也无心食用。郭芙含泪答应母亲，心下好生后悔不该因一时之忿斩断杨过手臂以致骨肉分离。黄蓉将软猬甲交给女儿叫她晚间到了客店便穿在身上，又反复叮咛路上须得留心提防之事。眼见女儿眼眶红红楚楚可怜心中更是不忍，瞥见市镇西头糖食店前摆着一担鲜红肥大的苹果，便起身去买几个让女儿在路上吃。",
