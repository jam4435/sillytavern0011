  "事件引子": "朔风呜咽漫卷黄沙，绝壁乱石间热血未冷，凄厉绝望的哀号撕裂关山死寂。",
  "事件详情": "眼见挚爱的姐夫萧峰自戕倒在血泊之中，阿紫肝肠寸断、发出凄厉欲绝的悲号，整个人扑倒在萧峰冰冷的遗体上痛哭失声。在万念俱灰的绝望中，阿紫决意生死相随，并在赴死前彻底了断与游坦之的尘世羁绊。面对身旁苦苦哀求挽留的游坦之，阿紫面容凄厉冷笑，厉声喝道：“你给我的眼珠，我还给你，我阿紫不欠你分毫！”言毕，阿紫猛然抬手，双手十指如钩狠狠刺入自己的眼眶，生生将换给自己的双目硬生生挖出，血肉模糊地掷在游坦之脚下。满面鲜血流淌的阿紫全然不顾剧痛，在无尽黑暗中摸索着紧紧抱起萧峰带血的尸身，步履踉跄却无比决绝地冲向万丈悬崖边缘，毫不犹豫地纵身跃入云雾翻滚的千仞深渊之中殉情而亡。盲眼的游坦之绝望悲呼亦触石自尽。朔风呜咽，雁门关绝壁间沙尘漫天，在场的段誉、虚竹、中原群豪以及数十万辽军将士无不被这惊天地泣鬼神的壮烈惨剧深深震撼，全军万民尽皆伏地悲恸痛哭，悲鸣之声久久回荡在关山天地之间。",
