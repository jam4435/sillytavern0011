  "事件引子": "聚贤庄大厅内数十坛烈酒泥封尽去，浓冽酒气弥漫全场，百余只粗瓷大碗森然排开。",
  "事件详情": "彻底安顿好阿朱之后，乔峰昂然迈步来到聚贤庄大厅正中央，傲骨凛然地横刀立马而立。环视四周那些昔日里推杯换盏、出生入死的丐帮同袍与江湖故友，如今却为了师门大义与身世之见对自己横眉冷对、刀剑相加，乔峰胸中翻涌起无尽的苍凉与悲愤。为求大战之时双方再无顾忌，乔峰当即命庄丁搬来数十坛上好的烈酒与数百只粗瓷海碗，在大厅中排开，当众宣布立下“绝交酒”之誓。他豪气干云地向全场宣告：“今日乔峰与各位昔日朋友饮此绝交酒，喝过此酒，昔日情义一笔勾销！待会儿动起手来，生死各安天命，乔峰绝不手下留情！”说罢，乔峰率先斟满大碗，神情悲壮地与丐帮长老、少林高僧以及各派豪杰一一碰碗对饮。他仰头连饮数十碗浓烈烈酒，每饮罢一碗便将海碗狠狠掷于地面摔得粉碎，瓷片四溅之声惊心动魄。这番惊天地泣鬼神的绝交对饮，彻底斩断了乔峰与中原武林昔日的所有情义纽带，使得场内群雄同仇相向，生死恶战正式拉开序幕。",
  "事件概要": "安顿好阿朱后，乔峰步入大厅中央，命人排开烈酒海碗立下绝交酒之誓。面对横眉冷对的昔日同袍故友，他悲慨之下连饮数十碗烈酒，每饮尽必掷碎大碗，彻底斩断旧日所有恩义情分。满地碎瓷中前情尽绝，群雄同仇敌忾，生死恶战一触即发。",
