  "事件引子": "智光当众验看胸口狼头图腾，铁证如山坐实乔峰契丹血脉。",
  "事件详情": "智光大师陈述完雁门关惨案始末后，为了拿出无可辩驳的铁证以证实乔峰的真实身世，缓步走至神情恍惚的乔峰面前。在杏子林数百双惊愕目光的注视下，智光大师抬手轻轻揭开了乔峰胸前的衣襟。只见乔峰宽厚结实的胸膛之上，肌肤间赫然刺着一只犹如猛虎下山般栩栩如生的青色狼头刺青图腾。智光大师当众沉痛指认，此刺青图腾正是大辽国契丹萧氏皇族所世代独有的宗族血脉烙印，寻常汉人绝不可能拥有。铁证如山，身世彻底大白于天下！乔峰低头看着胸前狰狞的狼头印记，脑海中轰鸣炸响，三十年来深植于心的大宋汉家英雄信念与人生支柱在这一瞬间彻底坍塌崩溃。他只觉天地旋转、万念俱灰，浑身如坠万丈冰窟。青色狼头刺青的当众验明，彻底坐实了乔峰身为契丹萧氏异族后裔的无可辩驳之事实。",
  "事件概要": "起因：智光大师为拿出铁证证实乔峰身世，缓步走至神情恍惚的乔峰面前抬手揭开其胸前衣襟。发展：乔峰胸膛赫然展现栩栩如生的青色狼头刺青，智光沉痛指认此为大辽契丹萧氏皇族独有血脉烙印。结果：铁证如山下乔峰三十年汉家英雄信念彻底坍塌如坠冰窟，契丹萧氏后裔事实彻底坐实无可辩驳。",
