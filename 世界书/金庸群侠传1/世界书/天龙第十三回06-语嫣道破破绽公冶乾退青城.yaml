  "事件引子": "直捣黄龙拍死穴，一语道破镇派剑招破绽挫强敌。",
  "事件详情": "伏牛派高手刚被逼退，青城派的高手紧接着挺剑杀出，手中长剑激荡起凌厉风声，施展出蜀中名震江湖的“松风剑法”，剑招又快又密，如狂风扫落叶般狠辣刺向公冶乾的下盘要害。公冶乾见对方剑势绵密诡谲，下盘受袭正欲撤步回防，窗边的王语嫣却早已将青城派剑路算得一清二楚，当即再度朗声指点道：“公冶二哥，莫理下盘，直捣黄龙，攻其‘神封穴’，青城剑法破绽在右肋三分！”公冶乾对王语嫣的武学造诣佩服得五体投地，闻言毫不犹豫地放弃防守下盘，聚全身内力于双掌之间，迎着森然剑光直捣黄龙，铁掌如排山倒海般悍然拍向青城高手的右肋神封穴。青城派高手未料到自家镇派剑法的隐秘死穴竟被一介少女一语道破，变招不及之下发出凄厉惊呼，胸口结结实实中掌，整个人如同断线风筝般踉跄倒飞，重重摔倒在地爬不起身，公冶乾立时反败为胜。",
