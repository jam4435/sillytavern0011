  "事件引子": "大雄宝殿内戒备森严，群雄屏息凝神，行刑僧按棍肃立两侧，殿内气氛压抑如铁。",
  "事件详情": "萧远山在藏经阁抛出的身世线索直指少林，戒律院首座当即下令当堂查验虚竹身躯以正视听。虚竹面色煞白，双手连连摆动，口中急切分辩：“小僧自幼在寺中剃度，绝非恶人之子！”然而两名行刑僧不由分说跨步上前，反剪其臂，当众褪去虚竹身上的粗布僧袍与中单。众目睽睽之下，虚竹后背及两股之间赫然显露出九处呈梅花状排列的自幼灼烙香疤，痕迹焦深。叶二娘见状浑身剧震，发出撕心裂肺的悲鸣，踉跄扑倒在虚竹脚边。她颤抖着双手抚摸那些凹凸不平的疤痕，指尖因极度激动而泛白，旋即自怀中掏出珍藏二十四年的半截染血襁褓，比对之下，襁褓破损处的焦痕与虚竹背上戒疤严丝合缝。叶二娘再无半分疑虑，一把将木雕泥塑般的虚竹死死抱入怀中，热泪滚落打湿其裸背。虚竹脑中一片空白，浑身僵直，合十的双手无力垂落，僧衣委顿在地。群雄目睹这铁证如山的骨肉相认，大殿四周顿时爆发出一片惊叹与窃窃私语，虚竹二十四年来作为少林孤儿的清白身世在此刻彻底颠覆。",
  "事件概要": "少林戒律院当众褪去虚竹僧袍查验身躯，其背部九处梅花焦痕戒疤赫然显露。叶二娘见状悲鸣扑出，取出珍藏二十四年的残破襁褓严密比对，确认虚竹即为当年被盗亲子并相拥痛哭。群雄皆惊，虚竹二十余年的孤儿身世由此真相大白。",
