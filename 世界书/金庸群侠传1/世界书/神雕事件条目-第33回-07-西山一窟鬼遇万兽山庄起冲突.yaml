  "事件详情": "西山一窟鬼一行驰入一座黑沉大树林，忽听虎吼马惊，前方一人厉声喝问何人擅闯万兽山庄。当路站着一人旁蹲双虎——正是万兽山庄史氏兄弟。长须鬼拱手说是西山一窟鬼有事赶赴倒马坪回头谢罪。不料树林深处有人大剌剌说'谢罪不用了让他们绕过林子走路罢'。群鬼登时大怒，无常鬼更说不绕弯儿，一提马缰向史孟捷迎面冲去。史孟捷左手一扬身旁双虎扑上，无常鬼坐骑受惊被虎抓破肚子，无常鬼纵身下地摆出双龙伏渊势欲斗。史孟捷双手齐出各抓无常鬼一条枪杆——两人力道均大将枪杆崩断。长须鬼认出史孟捷是八手仙猴，又听说青甲狮王史叔刚有病在身，反而宽心订下明晚决斗之约欲先赶路。史孟捷却坚不让路，丧门鬼和笑脸鬼乘机绕到史孟捷身后放起火来——火头刚窜便失声惊叫狂奔而回，大叫'老虎老虎一百头两百头'。突然间一条小狗般的白兽从密林中钻出——身法如电周身雪白尾巴漆黑。史孟捷大叫'九尾灵狐出来啦'飞身追出声音惶急。猛听得一声高呼似虎啸狮吼，四下里百兽齐吼，千万头野兽从林中奔出。史氏五兄弟各率一群野兽分向五方急奔围成大圈追逐九尾灵狐。郭襄催马追出但马被群兽吓得跪倒在地，她跃马离鞍在兽群洪流中险被踏死。猛兽包围了西山一窟鬼，群鬼分站五个方位抽兵刃待敌，但见黑暗中到处闪烁着绿油油的兽眼。",
