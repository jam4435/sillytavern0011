  "事件详情": "英雄大宴正热闹间，群雄正讨论推举盟主——洪七公被公推为群雄盟主，'矮狮'雷猛提议再推一位副盟主，众人正推举郭靖、黄蓉、鲁有脚等人选。忽然郝大通、孙不二、赵志敬、尹志平四人去而复返报讯，称有强敌前来。随即号角击磬声响起，金轮法王率霍都、达尔巴及数十人闯入大厅。霍都介绍了师尊金轮法王的来历——西藏圣僧、蒙古第一护国大师。群雄愕然。霍都提出须推群雄盟主，雷猛说已推洪七公。霍都冷笑道'洪七公早就归位了'——此言一出群雄大哗，丐帮帮众尤其愤怒。霍都声称金轮法王武功德望远胜洪七公，应做武林盟主。黄蓉知道今日非动武不可，朗声提议由两家弟子代师父们较量。群雄大半知道郭靖武功惊人决无败理，纷纷喝彩。霍都当年在重阳宫被郭靖一招即败，又经彭长老暗中献策——指出打狗棒法非帮主不传、郭靖不会，于是以打狗棒法为名指名挑战黄蓉与鲁有脚。郭靖起身要以降龙十八掌迎战，霍都又讥其'艺兼众门显不出洪七公的真实本事'。黄蓉认出献策之人是已投靠蒙古的丐帮叛徒彭长老。",
