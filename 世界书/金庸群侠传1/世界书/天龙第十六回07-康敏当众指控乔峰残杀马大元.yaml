  "事件引子": "杏林间阴风惨惨，众豪杰神色各异凝视失魂落魄的乔峰，全场陷入死一般的沉寂。",
  "事件详情": "正当乔峰沉浸在身世崩溃的巨大悲痛与茫然中时，马夫人康敏敏锐抓住时机再度当众发难。她擦干泪痕，神情怨毒而凄厉，指着失魂落魄的乔峰厉声控诉。康敏向全场丐帮弟子与中原群豪指控，乔峰正是残杀副帮主马大元的真凶——皆因马大元知晓了其不可告人的契丹异族身世，乔峰为求自保并杀人灭口，才暗中痛下毒手，以极为残忍的“锁喉擒拿手”硬生生扼杀了同袍兄弟马大元！这一控诉如火上浇油，瞬间点燃了全场群雄的怒火。杏子林内群情激愤，丐帮弟子与各路豪杰无不横眉怒目，纷纷拔刀拔剑指向乔峰。昔日那位统领天下第一大帮、受万众景仰的大宋豪侠，在契丹身世与弑兄恶名的双重重压下，顷刻间沦为千夫所指、人人得而诛之的契丹仇寇与武林公敌，人际关系与阵营立场彻底颠覆反转。",
  "事件概要": "康敏抓住乔峰因契丹身世暴露心神剧震的时机当众发难，厉声控诉乔峰为掩盖身世秘密，以锁喉擒拿手残杀副帮主马大元灭口。此言一出，群雄激愤拔刃相向，乔峰顷刻沦为弑兄叛帮的武林公敌。",
