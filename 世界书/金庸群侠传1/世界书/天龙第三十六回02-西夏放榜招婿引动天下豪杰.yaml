  "事件引子": "天山缥缈峰上朔风呼啸，灵鹫宫总坛石阶前快马急报突至，打破了雪域连日来的宁静。",
  "事件详情": "灵鹫宫总坛的宁静被一份自天山传来的加急文书所打破。西夏国皇妃李秋水之孙女、银川公主李清露正式昭告天下，颁布皇室榜文，面向全天下广招青年才俊与王孙公子前往西夏皇宫应聘选婿。这一消息如同平地惊雷，以极快的速度传遍大江南北，令整个中原与边陲江湖为之震动。各国青年俊彦与各路江湖势力纷纷蠢蠢欲动，大理国镇南王世子段誉、心怀复国大计的姑苏慕容复、西域吐蕃国王子宗赞，以及天下间无数自命不凡的英雄豪杰，皆各自怀揣着截然不同的目的与野心，整顿行装启程西赴西夏。他们或是为了求娶倾国倾城的绝色佳人，或是贪图西夏皇室的至高权柄与联姻助力，天下各方风云随之迅速汇聚于西夏皇城。皇榜的传阅不仅在大江南北掀起了滔天波澜，更彻底点燃了中原与外邦青年才俊之间的角逐战火，形成了一场天下英豪竞相西进的浩大声势。",
