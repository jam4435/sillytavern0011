  "事件详情": "杨过与小龙女展开轻功翻越高山出了绝情谷。此时天已黎明二人并肩高冈俯视幽谷——但见树木森森晨光照耀满眼青翠。杨过进谷虽只三日但这三日中遍历艰险数度生死仅隔一线，此时得与心上人离此险地恍如隔世心中欢悦无限。二人来到一株大槐树之下，小龙女偎依在杨过身边嫣然一笑道'我瞧你别再叫我姑姑了罢'。杨过心中早已不将她当作师父看待叫她姑姑只是一向叫得惯了，听她这么说心中一甜回首凝视她漆黑的眼珠子问'那我叫你作什么'。小龙女柔声道'你爱叫什么便叫什么一切都由你'。杨过微一沉吟后道'我一生之中最快活的时光便是在古墓中跟你一起厮守之时那时我叫你姑姑便到死都叫你作姑姑罢'。小龙女笑道'那时我打你屁股你也很快活么'。杨过将她搂在怀里只觉她身上气息温馨混和着山谷间花木清气真是教人心魂俱醉。杨过轻声道'咱们如这般厮守一十八日只怕已快活得要死了别再去杀什么郭靖黄蓉啦与其奔波劳碌厮杀拼命咱们还是安安静静快快活活的过十八天的好'。小龙女微笑道'你说怎么便怎么好以前我老是要你听话从今儿起我只听你的话'——她一向神色冷然如今心胸中充满爱念眉梢眼角以至身体四肢无不温柔婉娈。杨过怔怔望着她道'你眼中为什么有泪水'。小龙女拿他的手将脸颊贴在他手背上轻轻摩擦柔声道'定是我太喜欢你了'。杨过道'我知道你在为一件事难过'——小龙女突然泪如泉涌扑在他怀里哭道'过儿咱们只有十八天那怎么够啊'。杨过捧起她的脸在她淡红的嘴唇上轻轻吻了一下毅然道'好说什么也得去杀了郭靖黄蓉'。舌尖上尝着她泪水的咸味胸中情意激动全身真欲爆裂一般。",
