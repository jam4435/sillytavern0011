  "事件详情": "梁长老正要宣布耶律齐为新帮主，忽听得蹄声紧迫两骑马飞驰进校场——却是郭靖派出打探军情的探子。两探子翻身下马满脸又是迷惘又是喜欢之色。第一个报道蒙古左翼前锋千人队已到新野，第二个报道右翼前锋千人队已抵邓州，但紧接着奇事揭晓——邓州城郊的蒙古千人队一个个都死在就地军官士卒无一得生，新野的蒙古前锋一千人也全变了野鬼。最奇怪的是这些蒙古兵尸首上的左耳都给人割了去。郭靖黄蓉惊喜交集——虽说损折二千人无关大局但讯息传去蒙古三军为之夺气。黄蓉站到台上宣布喜讯全场欢声雷动，随即下令摆设酒筵庆祝。群雄在日光下席地而坐杯觥交错。正饮宴间远处传来阵阵狮吼虎啸猿啼象奔之声——史氏五兄弟各率一百头猛兽浩浩荡荡而来。校场上群雄先是愕然变色纷纷拔出兵刃，郭靖急调二千弓弩手布在大校场之侧。史氏五兄弟齐声高呼'奉神雕大侠之命来向郭二姑娘祝寿恭献寿礼'。五人走到郭襄身前献上五只皮袋——袋中竟是两千只蒙古兵将的耳朵。史伯威说明：神雕侠言道郭二姑娘身在襄阳今日是她十六岁生辰蒙古蛮兵竟敢无礼前来进犯岂不是要惊吓了郭二姑娘实是非杀不可，因此神雕侠率领七百多位江湖好手杀了蒙古两个先锋千人队。郭靖闻言方知灭了蒙古前锋的正是神雕侠，要亲自拜见致谢，史伯威说神雕侠连日忙于为令爱采备生日礼物未克前来。黄蓉低声告知郭靖神雕侠便是杨过，郭靖一呆随即满心欢畅连说了不起——他立下如此奇功当真是大宋之福。",
  "事件概要": "杨过麾下先斩蒙古两路先锋并献耳为礼，襄阳士气大振，郭靖亦确认神雕侠正是杨过。",
