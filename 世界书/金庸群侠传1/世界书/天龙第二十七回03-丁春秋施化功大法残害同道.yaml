  "事件引子": "神木王鼎绿烟袅袅，阿紫施展化功大法吸纳同门内力。",
  "事件详情": "丁春秋高踞客栈主位，幽冷目光径直锁定缩于梁柱旁的铁头游坦之，其意在强夺少林绝学《易筋经》。为彻底击溃游坦之的心防并震慑全场，丁春秋骤起杀心。他羽扇轻摇，阴恻恻冷笑道：“小辈，速将经书呈上，否则叫你求生不得求死不能！”席间一名衡山派老者拍案拔剑怒喝：“妖道休逞凶狂！”丁春秋眼中杀机暴涨，身形微晃便如幽灵般掠至老者身前，袍袖翻卷震断精钢佩剑，惨白右爪疾若闪电扣住其脉门。丁春秋森然催动“化功大法”，掌心泛起惨碧毒雾，老者顿时发出凄厉至极的惨呼，只觉毕生苦修的浑厚内力如决堤狂涛般被生生化散销蚀，五脏六腑如遭万蚁啃噬。丁春秋狞笑抽掌，老者经脉尽断、瘫软如泥断气身亡。旁侧两名意图施援的武师亦被丁春秋挥袖扫出的化骨毒掌击中前胸，惨叫着吐出黑血倒毙。大厅内血腥弥漫，群豪吓得魂飞魄散、贴墙战栗；佩剑断折遗落血泊，游坦之被逼至退无可退的生死关头。",
