  "事件详情": "藏经阁内尘卷飞扬，萧氏父子与慕容氏父子四人已然杀至癫狂境地。萧峰与萧远山催动十成内力，双龙出海般的降龙掌与般若掌蓄势待发，狂暴真气将周遭空气彻底抽空；慕容博与慕容复亦并肩立定，十指连弹凝起毕生功力的参合指剑气，生死存亡的玉石俱焚一击迫在眉睫。便在千钧一发的绝境关头，经阁最深处尘封的书架阴影中，一名身着灰布破旧僧袍的老僧手持一把光秃残破的竹帚，迈着无声轻缓的步伐缓步走出。老僧身形枯瘦如柴，面容苍老干瘪，神态却安详宁和，只低眉持帚沙沙扫地。就在四人毁天灭地的掌风指力轰然爆发、即将触及老僧身前三尺之时，一道无形的三尺气墙骤然凭空生出，狂暴绝伦的真气触之竟如泥牛入海，无声无息间化解得干干净净。四位绝顶宗师只觉胸口气血一窒，齐齐被浑厚柔和的无形巨力逼退三步，狂暴的内息瞬间归于平寂。老僧手扶竹帚合十诵佛，以超凡入圣的莫测神威，刹那间化解了这场同归于尽的武林浩劫。",
