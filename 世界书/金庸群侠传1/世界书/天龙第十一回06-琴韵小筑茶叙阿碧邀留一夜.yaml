  "事件引子": "琴韵小筑内，阿碧请众人入厅，男仆奉上清茶糕点；鸠摩智请阿碧通知阿朱姊姊，阿碧说明水路遥远，今日来不及前往，安排众人留宿一夜。",
  "事件详情": "众人抵达琴韵小筑后，阿碧请客人入厅就座，男仆随即奉上清茶与点心。段誉端起茶碗，只觉满嘴清香，又尝了四色精致糕点，大快平生；鸠摩智与崔百泉、过彦之却因疑心而不敢食用。鸠摩智耐心等段誉尝过茶水糕点后，才请阿碧通知她的阿朱姊姊。阿碧说明阿朱的庄子离这里有四九水路，江南算法即三十六里，今日已来不及前往；她请众人在琴韵小筑住上一晚，明朝一早再送众人去听香水榭。原文此处尚未写红裳少女阿朱现身；阿朱是在次日听香水榭场景中出场。",
