  "事件引子": "少林寺山门前香烟缭绕，晨钟回荡间，一名浑身尘土的盲眼紫衣少女跌撞扑入山门。",
  "事件详情": "阿紫自北国舍命奔逃至中原，心中急切万分，誓要将结义大哥兼姐夫萧峰的惊天危局昭告天下。此前萧峰为了阻止辽国南侵、庇佑宋辽两境亿万生灵免遭涂炭，毅然抗拒辽帝耶律洪基的侵宋命令，因而触怒辽帝，被重重锁链囚禁在大辽国都南京（析津府）戒备森严的玄铁死牢深处，性命危在旦夕。阿紫一路风尘仆仆，将这一惊心动魄的消息飞速传遍中原各路门派。消息传开之后，整个天下为之剧烈震动，江湖群雄无不热泪盈眶。昔日因雁门关惨案与聚贤庄一役而深深误解、仇视萧峰的中原武林豪杰，在得知真相后尽皆感佩萧峰以一人之躯承担国难家仇、换取天下太平的无上大义。群雄心中的往日怨怼在无上义举前冰释消融，中原各方势力当即下定决心，决意抛开门派芥蒂，誓要北上攻破辽国死牢救出萧峰。此番奔走报信彻底扭转了江湖舆论，使得天下正义之士同仇敌徾，为后续联军北伐大辽营救萧峰奠定了坚实的基础。",
  "事件概要": "双目失明的阿紫历经艰险奔抵中原，向武林群雄泣血飞报萧峰因拒旨伐宋被辽帝深锁铁牢、危在旦夕之讯。昔日怨怼尽化敬仰，天下豪杰无不感佩其舍身救苍生的大义，武林各派决意摒弃宿怨，誓师北上破牢营救。",
