  "事件引子": "大智大勇运吐真火，六幅神剑图谱化飞灰。",
  "事件详情": "随着战局持续，鸠摩智的火焰刀气愈发霸道炽烈，六僧组成的六脉神剑阵已难以挽回颓势，随时有被强行击溃之险。枯荣禅师眼见大势不妙，深知一旦剑阵告破，寺中历代相传的至宝《六脉神剑经》必将沦入番邦强虏之手，大理段氏将万劫不复。值此危急存亡之秋，枯荣禅师展现出大智大勇的决绝心性，突然撤掌调运体内极精纯的一阳指力，自口中吐出一股炽热真火，直扑置于身前的六幅经卷。烈焰腾空而起，在鸠摩智与众僧众目睽睽之下，记载着六路无形神剑无上奥秘的六幅图谱瞬间被熊熊烈火吞噬，化作漫天飞扬的灰烬。鸠摩智万万没料到这位得道老僧行事竟如此决绝果断，眼见梦寐以求的绝世神功在眼前毁于一旦，毕生谋划顿成泡影，大轮明王顿时面色铁青，心中又惊又怒。",
  "事件概要": "起因：火焰刀炽烈压制剑阵，枯荣深知剑阵告破至宝必沦番邦之手。发展：枯荣运一阳指力吐出炽热真火，六幅记载神剑奥秘的经卷瞬间化为漫天灰烬。结果：梦寐以求的神功毁于眼前毕生谋划成空，鸠摩智面色铁青又惊又怒。",
