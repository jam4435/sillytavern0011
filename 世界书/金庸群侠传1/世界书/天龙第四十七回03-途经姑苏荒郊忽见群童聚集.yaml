  "事件引子": "荒坟古冢纸冠草服，段誉途经苏州惊见群童朝拜假皇帝。",
  "事件详情": "大理御驾车队一路南行至江南姑苏地界，行经太湖畔一片芦苇丛生、杂草荒芜的旷野荒郊。此地紧邻昔日燕子坞与曼陀山庄，水汽弥漫间触景生情，令王语嫣与段誉心中皆泛起对旧日岁月的复杂思绪与感慨。行进间，前方荒草土丘后方忽地传来一阵阵孩童嘈杂喧闹的嬉笑声，隐约还夹杂着稚嫩高亢的拜伏欢呼之声。大理司空巴天石警觉勒马，掌中短刀霍然出鞘半寸，沉声传令：“戒备！护卫龙辇！”前后禁卫铁骑闻令迅速散开合围，刀枪并举、挽弓戒备。段誉在车内温和制止道：“巴司空莫慌，听声音不过是乡野孩童嬉闹，切勿妄动兵刃惊扰乡邻。”说罢，段誉伸手轻轻掀开明黄车帘，与王语嫣一同凭窗远眺。只见前方荒冢残碑与枯草掩映的土丘坡地上，数十名身着粗布蓝袄的乡野村童正雀跃奔跑、成群围拢，似乎在依循某种奇异规矩争抢着什么。段誉与王语嫣互视一眼，心中甚觉诧异，遂命车仗停驻道旁，携手步下銮驾，在数名亲卫随护下悄步靠近探查究竟。",
