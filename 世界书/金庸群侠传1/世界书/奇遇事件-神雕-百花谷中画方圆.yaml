事件引子: 百花谷中群蜂飞舞，周伯通在花丛中手舞足蹈，硬拉着你玩‘左右画方圆’的滑稽游戏……
事件概要: 玩家因天性质朴纯真，分毫不差画出左右方圆，老顽童大喜过望，倾囊相授左右互搏之术。
事件详情: 周伯通在百花谷木屋前百无聊赖，见玩家到来欢喜非常，随手折断两根树枝插在地上，硬逼玩家两手同时作画：左手画方，右手画圆。心思机巧多智者往往心神分散无法兼顾，而玩家天性质拙纯朴、毫无杂念，信手挥就，左方右圆端正规整。老顽童拍手称奇，引为忘年知己，当场席地而坐传授双手分使两套招数的左右互搏神功起手总诀。
参与人物:
- 玩家
- 周伯通
