  "事件引子": "薛慕华广发英雄帖聚贤庄誓师，群雄结成诛乔阵线布下天罗地网。",
  "事件详情": "在洛阳聚贤庄内，江湖人称“阎王敌”的薛慕华神医此前已广发英雄帖，力邀全天下中原武林豪杰齐聚一堂，召开一场声势浩大的“英雄大会”。此时的聚贤庄大厅中刀枪林立，寒芒闪烁，聚贤庄庄主游骥、游驹兄弟（游氏双雄）、发起人薛神医、少林派德高望重的高僧、丐帮位高权重的长老、各大门派掌门人以及数百名名震江湖的成名豪客尽皆在场。群豪齐聚的唯一动机与核心诉求，便是痛斥乔峰乃“弑父弑母弑师的契丹恶贼”，誓要清算其罪行。大厅之内杀气遮天，各门各派高手群情激愤，严阵以待，在庄内庄外布下重重防备，合力推举并商讨诛灭乔峰的绝杀大计。这场誓师集会使得聚贤庄彻底沦为杀机四伏的绝险之地，中原武林各方势力在庄中结成了坚固的诛乔阵线，只待契丹恶贼现身便要将其合力诛杀，形成了全武林同仇敌徾、天罗地网以待乔峰的严峻围剿态势。",
  "事件概要": "起因：薛慕华在聚贤庄广发英雄帖召开英雄大会，痛斥乔峰为弑父弑母弑师契丹恶贼。发展：游氏双雄、少林高僧、丐帮长老及数百成名豪客齐聚大厅杀气遮天，商讨诛灭乔峰绝杀大计。结果：中原武林各方势力在庄中结成坚固诛乔阵线布下天罗地网，聚贤庄沦为杀机四伏的绝险之地。",
