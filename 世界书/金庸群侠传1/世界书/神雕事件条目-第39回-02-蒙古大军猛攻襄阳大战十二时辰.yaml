  "事件详情": "次日天甫黎明，蒙古大军漫山遍野而来，军容之盛兵力之强前所未有。郭靖熟知蒙古攻城方略早作准备，以弓箭火器垒石云梯一一破解。城中数十万百姓奋起助战，妇孺老弱担土递石。大汗蒙哥亲临督战，九旄大纛之下两个万人队精锐猛攻北门，数百架云梯竖立蒙古兵如蚂蚁般爬向城头。郭靖大呼激励士卒，宋军精神大振拼死力战。安抚使吕文德面如土色要弃城南退，被黄蓉持剑喝止。耶律齐领四千精兵出城冲杀被两个万人队围在垓心。郭靖令二武让开缺口放蒙古兵爬上城头，待五千余人登城后黑旗一招，朱子柳与武三通率伏兵杀出填住缺口围歼登城之敌。郭靖亲自冲阵直逼蒙哥，枪挑掌劈在百万军中来回冲杀如入无人之境，弯弓射蒙哥一箭穿透两名百夫长。黄蓉命泗水渔隐率二千人接应，又散布蒙古大汗已死消息乱敌阵脚。宋军三万精兵追杀而出，攻入襄阳的五千蒙古精锐无一活命。此役蒙古损折四万余，襄阳守军伤亡二万二三千人，自蒙古南侵以来最为惨烈。",
  "事件概要": "襄阳守军血战一昼夜击退猛攻并重创蒙古军，但城中兵民伤亡亦极其惨重。",
