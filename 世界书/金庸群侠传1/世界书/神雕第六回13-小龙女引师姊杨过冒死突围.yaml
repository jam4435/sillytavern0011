  "事件详情": "小龙女给杨过缚好包裹递过长剑，厉声说'待会我叫你走你立刻就走，一出墓门立即放下巨石闭门'，杨过哽咽着声音答应。两人来到李莫愁师徒所在的石室外，小龙女按动石壁机括，石壁缓缓向左移开。她双绸带立即挥出左攻李莫愁右攻洪凌波，身随带进去势迅捷已极。李莫愁拂尘挥出挡开绸带，以柔敌柔但功力远胜，绸带倒卷回来。小龙女左带回转右带继出刹时连进数招，李莫愁又惊又怒师父偏心却不下杀手。洪凌波被杨过点穴后已被师父解开，叱骂着双剑左刺右击杀向杨过。杨过因与小龙女分手在即眼眶满蕴热泪只是顺手招架殊无还击之意。李莫愁与师妹拆手十余招拂尘一翻以刚劲震断小龙女左手绸带大显得色，小龙女不动声色以半截断带裹住拂尘丝线右手绸带卷住木柄一力向左一力向右将拂尘也断为两截。李莫愁微微一惊抛下拂尘空手来夺绸带直逼小龙女连连倒退。小龙女退到东边石壁前反手一抹叫道'过儿快走'——喀喇一响西北角露出洞穴。李莫愁急忙转身要拦住杨过，小龙女抛下绸带双掌连下杀手拦住。杨过望着小龙女知道无可挽回刷刷刷突进三剑逼退洪凌波弯腰冲出石门，却回头想再看姑姑最后一眼。恰见小龙女因见杨过背影一晃想到今后永不能再见胸口一热眼中发酸——她从来不动真情今日却两番要哭，高手对掌这稍一疏神被李莫愁抓住左手会宗穴出脚勾倒在地。杨过回头正见小龙女被师姊勾倒，胸中热血上涌大叫'别伤我姑姑'又从石门中窜入，自后扑上拦腰牢牢抱住了李莫愁。李莫愁守身如玉闯荡多年仍是处女，斗然间被杨过牢牢抱住但觉一股男子热气从背脊传到心里荡心动魄全身酸软满脸通红手臂上登时没了力气。小龙女乘机出手反扣她手腕脉门却见洪凌波剑尖已指到杨过背心，忙带二人滚动避开。小龙女跃起身来再喝杨过快出去，杨过却叫道'姑姑你快出去我抱着她她走不了'——李莫愁被他抱在怀中竟是心魂俱醉快美难言不想挣扎。小龙女心中好生奇怪师姊如此武功怎会被过儿制得动弹不得。就在此时洪凌波左手剑又向杨过刺去，小龙女伸出双指在她右手剑刃上推去，两剑相交当的一声洪凌波虎口发麻双剑落地。火花一闪之中李莫愁觉师妹眼光露出奇异之色不禁大羞，运劲挣脱杨过发掌向小龙女拍去。小龙女还掌挡架被师姊沉厚掌力震得胸口隐痛。杨过爬起仍来相助被喝斥不听——他说'你什么话都听就是这一句不听，好姑姑我跟你死活都在一起'。小龙女听他说得诚挚心中又动真情，眼见李莫愁再挥掌来自知功力大损接不得，低头旁窜抓起杨过从石门中奔出。李莫愁如影随形伸手向她背心抓去，小龙女回手扬出十余枚玉蜂针。李莫愁蓦地闻到一股蜜糖甜香知暗器厉害，大骇之下挺腰向后摔出撞正洪凌波一齐跌倒。但听叮叮叮几响玉蜂针打在石壁上，轧轧两声小龙女带着杨过逃出石室开动机关又将室门堵住了。",
