  "事件引子": "在江南未具名小城客店歇宿后，鸠摩智与段誉再一路向东行了二十余日，终于抵达苏州城外，湖畔遇见崔百泉与过彦之。",
  "事件详情": "第一段北行、东北行结束后，鸠摩智与段誉曾在江南一座未具名小城客店歇宿。原文随后明确写道：“自此一路向东，又行了二十余日”，段誉听着途人口音渐觉清雅绵软，知道已到江南，这一日终于到了苏州城外。鸠摩智向途人询问参合庄路径，继而遇见崔百泉与过彦之。崔百泉与过彦之认出段誉，惊疑之下追问鸠摩智为何擒拿大理段氏小王爷。鸠摩智不肯详述，只说要去慕容氏府上，并向二人打听参合庄所在。段誉担心崔百泉与过彦之因相救自己而枉送性命，出言劝他们尽快离开。崔百泉与过彦之虽知双方武功悬殊，仍心存救人之意，双方在苏州城外湖岸交涉。原文没有点明第一段小城为常熟，也没有写鸠摩智在常熟雇舟；抵达苏州城外的确切年月日时同样未载。",
  "事件概要": "鸠摩智与段誉在江南小城歇宿后，继续一路向东又行二十余日，终于抵达苏州城外。鸠摩智向途人打听参合庄路径，遇见崔百泉与过彦之；二人认出段誉，双方在湖岸交涉。",
