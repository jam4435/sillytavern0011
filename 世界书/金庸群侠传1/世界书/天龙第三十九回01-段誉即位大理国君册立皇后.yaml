  "事件引子": "正殿内钟鼓齐鸣、庄严肃穆，文武百官列队肃立，禅位大典正当其时。",
  "事件详情": "在大理镇南王府惨变平息之后，大理国皇宫正殿内庄严肃穆，文武百官列队肃立。保定帝段正明经历诸般劫难与骨肉变故后看破红尘，决意将大理皇位禅让。段誉秉持仁厚爱民之念，谨遵伯父段正明的禅位法旨，在群臣的齐声朝贺中正式登基即位，成为大理国新一代皇帝，尊号为大理宣仁帝。大典之上钟鼓齐鸣，宫廷仪仗威严庄重，段誉身着天子衮冕御临大宝，当殿颁布安抚黎民、休养生息的即位诏书，并当着满朝文武的面，郑重册立长久相伴、患难与共的王语嫣为大理国皇后。王语嫣身着凤冠霞帔，端庄娴雅，同段誉并肩接受群臣伏地朝拜。这场禅让大典顺利化解了此前王府惨变带来的朝野动荡，使大理国政权平稳过渡，境内四海升平、国泰民安，帝位与后位的权柄至此正式确立归属。",
  "事件概要": "段正明历经变故看破红尘决意禅位，段誉谨遵伯父法旨正式登基为宣仁帝。大典之上，段誉颁布安抚黎民诏书，并当殿册立相伴相许的王语嫣为皇后，二人携手受群臣朝拜，顺利平息朝野动荡，安定大理社稷。",
