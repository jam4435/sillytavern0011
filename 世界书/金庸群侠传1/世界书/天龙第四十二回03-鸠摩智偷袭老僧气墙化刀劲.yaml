  "事件引子": "藏经阁内佛法回荡、杀气初敛，暗角阴影处潜伏之人却已运劲蓄势，杀机暗涌。",
  "事件详情": "吐蕃国师鸠摩智一直悄然潜伏于少林藏经阁暗处，窥伺良机。见老僧言谈之间震慑全场，鸠摩智既忌惮老僧莫测高深的神通，又欲彰显自身强绝武功以称霸武林，遂决定暗施辣手突袭老僧。鸠摩智屏息凝神，毫无预兆地自暗处暴起出手，运起毕生功力悍然轰出足以开山裂石、无坚不摧的少林绝技“火焰刀”，炽热霸道的无形刀劲裹挟着狂暴杀气直逼老僧后心。面对这突如其来的致命突袭，扫地老僧神色安详未变，甚至未曾回头，仅仅轻描淡写地袍袖微拂。刹那之间，老僧周身自然涌现出一股厚达三尺的无形护体真气墙。鸠摩智那开碑裂石、势不可挡的火焰刀神力重重撞击在无形气墙之上，犹如泥牛入海，没有激起半分狂澜，顷刻间便被消融得无影无踪。鸠摩智引以为傲的杀招被老僧以通天神功轻描淡写彻底化解，偷袭图谋瞬间化为泡影，全场绝顶高手皆为老僧这般鬼神莫测的护体神通而深感骇然。",
  "事件概要": "鸠摩智潜伏于藏经阁暗处窥伺，为慑服全场并试探虚实，骤施辣手以毕生功力暗发无形火焰刀直袭老僧后心。不料老僧不闪不避亦未回身，仅拂袖间便以三尺浑厚护体气墙将至刚刀劲尽数化散融解，偷袭瞬成泡影，全场无不震骇于其通天神威。",
