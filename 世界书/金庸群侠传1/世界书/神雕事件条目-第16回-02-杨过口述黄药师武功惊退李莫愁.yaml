  "事件详情": "李莫愁声称黄药师功夫不过如此，转身欲走。杨过叫住她，拿起铁条在地下比划图形，口述玉箫剑法克制拂尘功夫之法——令李莫愁的绝招再无还手余地只得丢拂尘认输。又讲解弹指神通破解五毒神掌之法——指甲弹掌当场废其手掌，削去指甲则剧毒不侵。一连说了十余招克制她武功的法门，每一招皆入情入理巧妙无比。杨过谎称黄药师已将这些法门传给自己命他代为收拾她，但念及她与小龙女同门之谊特来告知，劝她日后见桃花岛门人便远而避之。李莫愁听得脸如土色，默然半晌后说'罢了，罢了'，转头便走，霎时身形已在山后隐没。实则这些法门杨过虽已学会但要练到真能克敌制胜最快也须数年之后——这一番讲述不必出手已将李莫愁吓得心服口服，从此终身不敢再出一句轻侮黄药师之言。",
