  "事件引子": "号角凄厉长鸣，血染弟子闯殿急报灭门大祸。",
  "事件详情": "正当无量剑派数名精锐弟子拔剑合围、大厅内部混战一触即发的危急时刻，殿外山门处忽然由远及近传来了凄厉急促的号角长鸣，其间还夹杂着守山弟子此起彼伏的绝望惨呼。伴随着沉重的撞击声，一名浑身被鲜血染红的无量剑外哨弟子连滚带爬地扑跌进大厅，神色惨白地嘶声大喊神农帮已然大举杀上山来。此言一出，满堂群豪无不骇然失色。原来神农帮帮主司空玄奉天山灵鹫宫的严苛号令，意图彻底强占无量山剑湖宫搜罗灵药，此刻早已率领大批帮众将整座无量山围得水泄不通，更在各条上山要道布下了杀人于无形的剧毒烟雾，导致无量剑外围弟子尸横遍野、死伤极其惨重。大厅内原本针对段誉与钟灵的肃杀包围被这突如其来的灭顶之灾强行打断，无量剑派上下瞬间陷入覆灭在即的极度恐慌与震动之中。",
  "事件概要": "起因：大厅混战一触即发之际，殿外号角凄厉长鸣，浑身鲜血的外哨弟子闯殿急报。发展：弟子嘶声大呼神农帮主司空玄奉灵鹫宫严令大举围山，在上山要道布满毒雾残杀外围。结果：满堂群豪骇然失色，对段钟二人的包围被打断，全派陷入覆灭恐慌之中。",
