  "事件引子": "你听说牛家村的郭啸天和杨铁心两位好汉，最近与一位说书先生相谈甚欢。",
  "事件详情": "八月的一天傍晚，牛家村村民正听着说书人张十五讲述《叶三姐节烈记》。故事中金兵的残暴激起了众人的愤怒。说书结束后，郭啸天和杨铁心被张十五的言辞深深打动，遂邀请他去村头的小酒店喝酒。席间，三人从金兵入侵谈到朝廷腐败，张十五痛陈徽、钦、高三帝的昏庸无能，以及秦桧等奸臣的误国之举，言语间充满了对国家前途的忧虑。郭杨二人听得热血沸腾，对朝廷的软弱和奸臣的当道感到无比愤慨。酒店主人曲三偶发冷笑，一语道破害死岳飞的罪魁祸首实为高宗皇帝，令三人震惊不已。这番交谈加深了郭杨二人的兄弟情谊，也让他们对时局有了更清醒的认识。",
  "事件概要": "郭啸天与杨铁心因共议国难而情谊更深，也由此结识张十五、曲三，对时局有了更清醒的认识。",
