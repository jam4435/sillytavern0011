  "事件引子": "中原群雄收养遗孤寄养乔家拜师玄苦，取名乔峰隐匿身世。",
  "事件详情": "侥幸生还的带头大哥、汪剑通与智光大师等数人立于雁门关绝壁前，望着横陈的十七具同道尸体与跳崖殉情的契丹夫妇，自知误中奸计杀害无辜，铸下了不可挽回的弥天大错，人人悔恨交加、痛心疾首。面对崖顶襁褓中孤苦无依的契丹婴儿，中原群豪动了恻隐与赎罪之心，决定合力将其抚养成人。众人小心翼翼地将婴儿带回中原腹地，送往少室山下一户忠厚善良的农家，托付给乔三槐夫妇当作亲生骨肉悉心抚育。与此同时，群豪为传其安身立命之本，特意引荐并安排其拜入少林寺高僧玄苦大师门下，修习少林正宗武学。中原群雄为这名契丹孤儿取汉名“乔峰”，隐瞒其一切身世过往。三十年来，这名襁褓弃婴在农家与少林的精心哺育下成长为一代威震江湖的顶尖豪杰，昔日雁门关的血泪孽缘亦由此埋下了今日身份剧变的因果。",
  "事件概要": "起因：带头大哥与汪剑通、智光等生还者立于绝壁前深知误杀无辜铸成大错，悔恨痛惜动了恻隐与赎罪之心。发展：群豪将婴儿带回中原托付少室山乔三槐夫妇抚育，并引荐拜入少林寺玄苦大师门下修习少林正宗武学。结果：群雄为孤儿取汉名乔峰并隐瞒一切身世，抚育三十年成为顶尖豪杰却埋下今日因果。",
