  "事件引子": "破败磨坊外雨水混着泥泞脚印，残破门板骤然被西夏恶徒踹得四分五裂，杀气扑面而至。",
  "事件详情": "藏匿于农家磨坊内的段誉与王语嫣立足未稳，数名西夏一品堂精锐武士便循着泥泞脚印追踪而至，踹破残旧门板挥刀杀入。面对寒光闪烁的劈面长刀，身中悲酥清风的王语嫣动弹不得，段誉唯有挺身而出拼死挡在身前相护。段誉催动真气踏起凌波微步，在狭窄逼仄的磨盘与石磨之间飘忽穿梭，险险避开敌人连环劈砍；王语嫣倚在草堆上急声指点：“点他右肩肩井穴，斜刺左胁！”段誉手忙脚乱抬手点出，指尖嗤嗤作响，少商剑与商阳剑气激射而出，当场洞穿两名扑上前的西夏武士胸膛。然而段誉内力运转极不稳定，神剑在关键时刻骤然卡壳失灵，一名西夏头领狞笑着举刀直逼王语嫣咽喉。千钧一发之际，隐于窗外暗处的乔峰果断出手相助，屈指连弹两枚碎石洞穿敌首眉心，更暗吐雄浑掌力隔窗将残余追兵尽数震毙。乔峰为免多生枝节击杀敌寇后悄然退去。磨坊内追兵尽数毙命仆尸，段誉真气耗损剧烈瘫坐喘息，王语嫣虽仍中毒脱力但安然无恙，磨坊危局彻底闭环化解，二人安然脱险。",
