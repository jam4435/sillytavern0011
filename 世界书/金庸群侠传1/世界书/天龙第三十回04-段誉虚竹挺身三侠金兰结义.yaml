  "事件引子": "大殿前杀机森然，三大高手品字合围萧峰，数千群雄屏息凝视，剑拔弩张一触即发。",
  "事件详情": "眼见慕容复、丁春秋与庄聚贤三大绝顶高手即将合力诛杀萧峰，全场中原群雄屏息凝神之际，大理世子段誉义愤填膺，不顾自身安危施展“凌波微步”，白衣飘飘如清风拂柳般疾掠而入，稳稳立在萧峰身侧，慨然高呼：“小弟段誉，愿与结义大哥同生共死！”与此同时，少林僧阵中亦起骚动，身兼逍遥派掌门的小和尚虚竹在众僧惊骇的目光中毅然迈步出列，向萧峰合十躬身行礼道：“萧大侠仁义无双，小僧虽微不足道，亦愿助一臂之力，共御强敌！”萧峰在举世皆敌、四面楚歌的万险关头，见两位青年英豪竟甘冒天下之大不韪舍命相陪，胸中万丈豪情顿起，仰天发出豪迈大笑。三人在大雄宝殿前数千群雄的众目睽睽之下，由燕云骑兵奉上烈酒，当场撮土为香、对天盟誓，痛饮后摔碗立誓，正式结拜为生死与共的金兰三兄弟：萧峰年长居长兄，虚竹居二哥，段誉居三弟。三侠歃血结义、肝胆相照，瞬间将萧峰孤立待毙的凶险杀局彻底逆转为鼎足抗敌的豪壮阵势。",
  "事件概要": "面对慕容复、丁春秋与庄聚贤的三方合围，萧峰深陷死局。段誉感念结义之情施展凌波微步挺身相护，身负逍遥派重任的少林僧虚竹亦毅然离阵共御强敌。萧峰豪气顿生，三人在千百群雄瞩目下撮土为香、痛饮烈酒结为金兰三兄弟，生死与共，杀局骤变。",
