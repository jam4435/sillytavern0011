  "事件引子": "暮色四合，静心殿内重幔低垂，数十盏铜烛台次第点亮，映亮红绸下的玉雕暗影。",
  "事件详情": "“神仙姐姐”玉雕像被安然移置大理皇宫内苑静心殿后，段誉为解开王语嫣的心结，特于暮色四合之际携其步入幽深内殿。殿内重重帷幔低垂，侍从在段誉挥手示意下点燃了数十盏九枝铜烛台，明亮炽热的烛光刹那间驱散了满室昏暗。随着侍从缓缓揭去覆盖在玉像上的厚重红绸锦缎，整尊羊脂白玉雕像在摇曳跳荡的烛影映照下，通体散发出夺人心魄的莹白温润光泽。王语嫣快步抢上前去，凑近玉像凝视那宛若生人的秋水眼眸、精致绝伦的五官与冰肌玉骨，双手止不住地微微颤抖，自惭形秽的巨大绝望涌上心头；段誉则手持一柄银烛台并肩伫立在一旁，目光久久停留在那张曾令自己魂牵梦萦的面庞与嘴角若有若无的清冷浅笑上，整个人犹如被五雷轰顶般僵立当场。在烛火明灭的光影交错之中，段誉脑海中电光石火般翻涌起无量玉洞中的千次叩首、万劫谷外的初逢心悸，以及数年间在江南中原卑微追逐王语嫣的狂乱往事。旧日狂热与眼前冰冷玉石剧烈碰撞，段誉的心神瞬间陷入了前所未有的剧烈震荡与剧变之中。",
  "事件概要": "段誉携王语嫣入静心殿观瞻神仙姐姐玉像以解心结。红绸揭开，羊脂玉像在烛影下莹白如生，王语嫣见其绝代风华而自惭绝望；段誉执烛凝望，忆及昔年痴狂追逐，旧梦与眼前冷玉剧烈冲撞，心神陷入前所未有的剧烈震荡。",
