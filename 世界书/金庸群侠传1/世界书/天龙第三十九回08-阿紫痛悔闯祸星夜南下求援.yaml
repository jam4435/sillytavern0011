  "事件引子": "深幽王府夜色凄冷，窗外风雨潇潇，严密巡防中透着大祸临头的森森杀机。",
  "事件详情": "目睹萧峰身中剧毒功散并被御林军关入玄铁铁笼严刑拷打的惨状后，阿紫如遭晴天霹雳，方才如梦初醒地惊觉自己受了耶律洪基的欺骗蒙蔽，竟亲手将挚爱的姐夫推入了万劫不复的深渊死地。阿紫心中涌起滔天的痛悔与自责，自知在辽国皇城之内已闯下了不可饶恕的弥天大祸。危急关头，阿紫强忍心中无尽的悲痛与绝望，当机立断趁着王府守卫混乱的夜色掩护，悄悄潜逃出南京大王府。她翻身跃上快马，不惜一切代价顶着凄风苦雨跨马狂奔，一路星夜兼程向南疾驰逃离大辽国境。阿紫下定决心南下中原，誓要将萧峰蒙难被囚的惊天危局传达给中原武林豪杰，并火速赶往灵鹫宫与大理国求见虚竹和段誉搬请各方救兵。阿紫成功脱离辽国追捕并星夜南下求援，为身陷死牢绝境的萧峰博取了一线生机。",
  "事件概要": "阿紫惊悉萧峰因毒酒被囚玄铁死牢受刑，方悟受辽帝蒙骗铸成大祸。痛悔欲绝之下，她趁王府戒备混乱潜逃出府，翻身跃马顶风冒雨星夜南奔，脱离辽军追捕疾驰中原，誓死搬请段誉与虚竹等天下群雄发兵解救萧峰。",
