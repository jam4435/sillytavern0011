  "事件详情": "段誉经万劫谷地道艰难脱险后，体内阴阳和合散药力虽已全解，但因在谷中无意间吸取了数名武林高手的驳杂内力，导致体内多股互不相容的真气狂暴奔涌、四处鼓荡激冲。段誉周身奇经八脉如欲撕裂，痛苦不堪，全身冷汗淋漓，已然命在旦夕。保定帝段正明与镇南王段正淳眼见段誉危在旦夕，心中焦急万分，当即决定放下国事，带着段誉急赴大理皇家寺院天龙寺求治。一行人赶至天龙寺后，恭敬求见寺中主事的本因、本观、本相、本参四位本字辈高僧以及辈分极高的枯荣禅师，诚恳说明段誉当前的危殆之势，恳请诸位高僧共同施展大理段氏祖传的一阳指神功为段誉导引疗伤。本因等高僧闻讯立即为段誉按脉诊治，发觉其体内各派内力交错盘踞，寻常一阳指力已无法强行梳理，若不能及时将杂驳真气导气归元，段誉必将经脉寸断爆体而亡，天龙寺内气氛顿时凝重至极。",
