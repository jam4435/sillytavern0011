<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI铜人叠加八脉测试</title>
<style>
body { background: #140e0b; color: #dfd4c1; font-family: "STKaiti", "KaiTi", serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.row { display: flex; gap: 30px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
.card { background: #221812; border: 1px solid #cda462; border-radius: 8px; padding: 15px; text-align: center; width: 280px; }
.svg-wrap { width: 240px; height: 500px; position: relative; margin: 0 auto; background: radial-gradient(circle at 50% 50%, rgba(205, 164, 98, 0.15), transparent 70%); }
svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<h1>AI生成铜人 · 奇经八脉对齐测试</h1>
<div class="row">
  <div class="card">
    <h3>男铜人 · 阳面 (任/冲/带/阴跷/阴维)</h3>
    <div class="svg-wrap">
      <svg viewBox="0 0 240 500">
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <!-- 底图 -->
        <image href="../assets/ui/bronze/male-front.png" x="25" y="20" width="190" height="465" preserveAspectRatio="xMidYMid meet" />
        
        <!-- 任脉 -->
        <path d="M120 400 V72" stroke="#ffe4a0" stroke-width="3" stroke-dasharray="6 3" filter="url(#glow)" fill="none" />
        <!-- 冲脉 -->
        <path d="M96 440 C97 400, 101 340, 101 322 C101 280, 101 200, 101 176 C101 140, 101 120, 101 95" stroke="#f5bc5b" stroke-width="2.5" stroke-dasharray="4 3" fill="none" />
        <!-- 带脉 -->
        <path d="M56 244 C76 232, 100 228, 120 228 C140 228, 164 232, 184 244" stroke="#ff785c" stroke-width="3.5" fill="none" />
        <!-- 阴跷脉 -->
        <path d="M78 450 C78 410, 81 375, 83 356 C85 320, 86 295, 87 278 C89 240, 90 220, 91 198 C93 160, 95 135, 96 116" stroke="#5cb85c" stroke-width="2.5" stroke-dasharray="5 3" fill="none" />
        <!-- 阴维脉 -->
        <path d="M162 450 C162 410, 159 375, 157 350 C155 320, 154 295, 153 270 C151 240, 150 220, 149 190 C147 160, 145 135, 144 110" stroke="#5bc0de" stroke-width="2.5" stroke-dasharray="5 3" fill="none" />

        <!-- 节点示例 -->
        <circle cx="120" cy="84" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="156" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="228" r="6" fill="#ee6a4f" stroke="#ffe4a0" stroke-width="2" />
        <circle cx="120" cy="300" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="378" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
      </svg>
    </div>
  </div>

  <div class="card">
    <h3>男铜人 · 阴面 (督/阳跷/阳维)</h3>
    <div class="svg-wrap">
      <svg viewBox="0 0 240 500">
        <image href="../assets/ui/bronze/male-back.png" x="25" y="20" width="190" height="465" preserveAspectRatio="xMidYMid meet" />
        <!-- 督脉 -->
        <path d="M120 405 V40" stroke="#ffe4a0" stroke-width="3" stroke-dasharray="6 3" filter="url(#glow)" fill="none" />
        <!-- 阳跷脉 -->
        <path d="M70 450 C71 410, 74 375, 76 356 C78 320, 79 295, 80 278 C82 240, 83 220, 84 198 C86 160, 89 135, 91 112" stroke="#5cb85c" stroke-width="2.5" stroke-dasharray="5 3" fill="none" />
        <!-- 阳维脉 -->
        <path d="M170 450 C169 410, 166 375, 164 350 C162 320, 161 295, 160 270 C158 240, 157 220, 156 190 C154 160, 151 135, 149 108" stroke="#5bc0de" stroke-width="2.5" stroke-dasharray="5 3" fill="none" />

        <circle cx="120" cy="72" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="150" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="226" r="6" fill="#ee6a4f" stroke="#ffe4a0" stroke-width="2" />
        <circle cx="120" cy="304" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="390" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
      </svg>
    </div>
  </div>

  <div class="card">
    <h3>女铜人 · 阳面</h3>
    <div class="svg-wrap">
      <svg viewBox="0 0 240 500">
        <image href="../assets/ui/bronze/female-front.png" x="25" y="20" width="190" height="465" preserveAspectRatio="xMidYMid meet" />
        <path d="M120 400 V72" stroke="#ffe4a0" stroke-width="3" stroke-dasharray="6 3" filter="url(#glow)" fill="none" />
        <path d="M56 244 C76 232, 100 228, 120 228 C140 228, 164 232, 184 244" stroke="#ff785c" stroke-width="3.5" fill="none" />
        <circle cx="120" cy="84" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="156" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="228" r="6" fill="#ee6a4f" stroke="#ffe4a0" stroke-width="2" />
        <circle cx="120" cy="300" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="378" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
      </svg>
    </div>
  </div>

  <div class="card">
    <h3>女铜人 · 阴面</h3>
    <div class="svg-wrap">
      <svg viewBox="0 0 240 500">
        <image href="../assets/ui/bronze/female-back.png" x="25" y="20" width="190" height="465" preserveAspectRatio="xMidYMid meet" />
        <path d="M120 405 V40" stroke="#ffe4a0" stroke-width="3" stroke-dasharray="6 3" filter="url(#glow)" fill="none" />
        <circle cx="120" cy="72" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="150" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="226" r="6" fill="#ee6a4f" stroke="#ffe4a0" stroke-width="2" />
        <circle cx="120" cy="304" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
        <circle cx="120" cy="390" r="5" fill="#f5bc5b" stroke="#fff" stroke-width="1.5" />
      </svg>
    </div>
  </div>
</div>
</body>
</html>
