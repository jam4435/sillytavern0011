  <defs>
    <linearGradient id="meridian-export-back-bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f17" />
      <stop offset="35%" stop-color="#4a3422" />
      <stop offset="70%" stop-color="#684a2d" />
      <stop offset="100%" stop-color="#1f1610" />
    </linearGradient>
    <radialGradient id="meridian-export-back-halo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#cda462" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#8d6032" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#3d2a1a" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meridian-export-back-dantian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4a0" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ee6a4f" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#b43a2d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
