      <stop offset="75%" stop-color="rgba(217, 173, 91, 0.4)" />
      <stop offset="100%" stop-color="rgba(217, 173, 91, 0)" />
    </linearGradient>
    <filter id="meridian-export-back-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .halo { fill: url(#meridian-export-back-halo); }
    .axis { stroke: rgba(217, 173, 91, 0.4); stroke-width: 0.8; stroke-dasharray: 2 6; fill: none; }
    .ruler { stroke: rgba(217, 173, 91, 0.25); stroke-width: 0.8; fill: none; }
    .body-head { fill: url(#meridian-export-back-bronze); stroke: rgba(217, 173, 91, 0.52); stroke-width: 1.2; }
    .body-torso { fill: url(#meridian-export-back-bronze); stroke: rgba(217, 173, 91, 0.48); stroke-width: 1.2; }
    .interior-detail { fill: none; stroke: rgba(217, 173, 91, 0.45); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .meridian-track { fill: none; stroke: rgba(217, 173, 91, 0.38); stroke-width: 4.5; stroke-linecap: round; }
    .meridian-base { fill: none; stroke: rgba(185, 140, 75, 0.55); stroke-width: 2.2; stroke-linecap: round; }
    .meridian-seg.is-opened { stroke: #ffe4a0; stroke-width: 3.5; stroke-dasharray: 8 3; filter: drop-shadow(0 0 4px rgba(255, 228, 160, 0.8)); }
    .meridian-badge rect { fill: #4c1d18; stroke: rgba(217, 173, 91, 0.6); stroke-width: 0.9; }
    .meridian-badge text { fill: #ffe4a0; font-size: 8.5px; font-weight: bold; text-anchor: middle; }
    .node-glow { fill: rgba(255, 228, 160, 0.2); }
    .node-ring { fill: #d9ad5b; stroke: #ffe4a0; stroke-width: 1.5; filter: drop-shadow(0 0 5px rgba(245, 188, 91, 0.9)); }
    .node-core { fill: #ffffff; }
    .node-callout line { stroke: rgba(255, 228, 160, 0.6); stroke-width: 0.8; }
    .node-callout text { fill: #ffe4a0; font-size: 8.5px; paint-order: stroke; stroke: rgba(19, 12, 8, 0.92); stroke-width: 2.5px; stroke-linejoin: round; }
  </style>

