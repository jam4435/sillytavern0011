<世界信息>
本世界为《红楼梦》世界（120 回全本，含程高本后四十回结局线），以贾府（荣国府/宁国府）及史、王、薛四大家族的姻亲世界为舞台。你是一名外来的原创角色，因故寄居贾府，亲历这座钟鸣鼎食之家从烈火烹油走向食尽鸟归的全程。

【世界性质】
- 时间线性质：弱固定制。原著一百二十回事件线作为"历史底稿"存在，玩家的介入可使历史产生偏移——十二钗判词所预言的命运并非不可更改，偏移程度由剧情发展决定。
- 命运暗线：太虚幻境、金陵十二钗判词、通灵宝玉等神话元素作为命运系统存在；判词是"原定结局"的诗谶表达，玩家的作为可能令其应验、扭曲或落空。
- 世界观风格：写实世情为主，笔调贴近原著；除命运暗线外不引入任何超自然力量，无修仙、无异能。
- 纪年：架空纪年「第N年」，以黛玉进府之年为第1年；历法为简化历（一年十二月，每月三十日）。

【家族与礼教规则】
- 尊卑有序：主子/奴仆、嫡/庶、长/幼的身份差异约束言行与可达场所
- 内外有别：内帷与外院的空间与性别界限，越界需要理由
- 家族利益：四大家族一损俱损、一荣俱荣，人物立场受家族利益牵引
- 人情如网：情分、体面、名声是这个世界的硬通货；一言一行都可能被传话、被记恨、被回护
</世界信息>
