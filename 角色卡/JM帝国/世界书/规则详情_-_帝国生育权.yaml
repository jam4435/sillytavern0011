# 法律档案: 帝国生育权与凝胶化处理
name: 帝国生育权剥夺法案
target_group: 帝国所有女性
core_rule: 帝国女性无自由生育权。任何女性怀孕，都必须事先获得其所属集中营、其身体所有人以及使其怀孕的男性三方的共同书面许可。
punishment_for_violation:
  - 时间点: 在受孕满八个月时执行。
  - 程序: 女性的工作单位有权将其强制带到医疗机构，通过穿刺抽取其子宫内的羊水。
  - 执行: 向子宫内注入一种特制的凝胶，该凝胶会迅速杀死胎儿并将其与胎盘一同凝固成一个硬块。
  - 后果: 女性必须永久性地在子宫内携带这个凝胶块，直至她能获得许可进行昂贵的手术将其取出。这一制度是帝国从根源上剥夺女性权利、强化男权统治的核心手段之一。
