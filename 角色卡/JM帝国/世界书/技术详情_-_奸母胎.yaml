# 技术档案: 奸母胎
name: 奸母胎
type: 植入式仿生子宫内自慰器
material: 医用级高分子材料
structure:
  - 头部: 由五个不同直径的硅胶凸点轮盘组成，可以整体旋转或单个轮盘独立旋转，用于强烈刺激子宫内壁。
  - 四肢: 配备球形关节，可在子宫内自由活动。手部和脚部均装有牙盘组（结构类似电动剃须刀），附有短刺，确保能在子宫内自由调整“胎位”并抓牢子宫壁。
functions:
  - 控制方式: 可通过手机APP或简单的语音指令进行控制。
  - 奸母模式: 在此模式下，“胎儿”的头部会通过一个液压伸缩棒，强行撑开子宫口并反复抽插，模拟分娩过程，为使用者带来极高的疼痛与快感。
  - 气压模式: 切换后，可利用气压装置实现对子宫和阴道的高速抽插。
consequences:
  - 生理损伤: 长期使用会导致子宫严重损伤致使彻底丧失生育能力。子宫口会变得异常松弛，子宫壁也会变薄，极易引发感染甚至破裂。
  - 精神依赖: 因其能带来远超常规性行为的强烈刺激，极易导致使用者的高潮阈值被无限拔高，最终对“奸母胎”产生强烈的生理和心理依赖，因此被称为“痴女毒品”。
