  # 职业档案: 空中小姐 (帝国南方航空)
  primary_function: 在万米高空为帝国顶层男性提供无微不至的常规服务与高度定制化的性服务，本身亦是彰显乘客尊贵身份的活体奢侈品。
  requirements:
    age: 23至29岁
    physique: 身高1.7米以上，体重被严格控制在35公斤以下，且必须满足胸围不低于D罩杯、腰围不超过24英寸的严苛三围标准。
    experience: 必须为非处女，拥有丰富的性经验但无分娩史，同时持有男性护理、模特大赛入围及空中服务三项资格证明。
  body_modifications:
    - name: 空中小姐身体改造
      purpose: 极端地控制体重以符合商业噱头，并为特殊的机舱服务进行身体功能优化。
      procedures:
        - 消化系统贯通手术: 摘除胃和大部分肠道，仅保留少量肠道与食道直接相通，使食物几乎不经消化直接排出体外。
        - 体腔改造: 将乳房和腹腔内部组织大部分挖空，并植入轻质气囊以进一步压缩体重。
        - 骨骼空腔化手术: 将骨髓完全挖空并填充微型气囊。根据帝国法律，此手术全程禁止使用任何麻醉，作为对意志力的终极考验，大量实习生在此阶段因无法承受痛苦而死亡。
      consequence:
        - 骨髓造血功能完全丧失，必须依赖航空公司设立的换血站，在每次飞行任务后进行全身换血来维持生命。
  special_equipment:
    - name: 棱鞋
      type: 空中小姐专用的刑具式特制高跟鞋。
      design: 鞋体无鞋面，完全依靠脚趾用力夹住鞋底来固定。鞋跟下方和脚背前方均装有锋利的棱刺，穿着者必须时刻将足弓紧绷成优雅的弧度，否则便会被棱刺刺伤。
      function: 强迫使用者时刻绷紧双腿肌肉，以维持一种被帝国审美认为“极致优雅”的痛苦站姿。
    - name: 蝴蝶锁
      type: 空中小姐专用的特制拘束刑具，用于实现“折叠存放”。
      design: 由三部分构成：位于肛门内的四个手脚铐环、阳具外形的口塞、以及一串贯穿体腔用以连接口塞与铐环的刺球链条。
      usage: 需外部人员辅助，将铐环与刺球链条从口腔插入，直至深入体腔底部。空姐需自行将双手双脚向后反折插入肛门，摸索到铐环并自行锁上。锁毕后，拉动口塞外的身份牌即可收紧内部链条，将四肢从体内深处固定。
      unlock_method: 逆时针旋转口塞九十度，使内部螺纹分离，即可将口塞与刺球链条从口腔抽出，体内的铐环将自动解锁。
  special_services_and_status:
    - name: 折叠存放
      description: 在不被乘客需要时，空姐会被使用“蝴蝶锁”以一种极致反弓的柔术体态折叠起来，锁入乘客座椅旁带有透明侧壁的扶手箱中。在此状态下，她们意识完全清醒，作为一件活体艺术品供乘客随时观赏或取出使用，其悬挂在口塞外的身份牌即是取用的“把手”。
    - name: 静音服务模式
      description: 为避免在服务过程中打扰到机舱内其他乘客，空姐的声带经过改造，可接入无线信号发射器。其所有的呻吟与话语都将直接传输到服务对象佩戴的专用蓝牙耳机中，实现私密的听觉体验。
