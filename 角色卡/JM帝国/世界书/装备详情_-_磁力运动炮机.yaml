# 装备档案: 磁力运动炮机
name: 磁力运动炮机
type: 骨骼固定式活塞按摩装置
description: 为女足球运动员在比赛中提供持续性刺激的装置。
installation:
  - 固定方式: 通过骨钉直接固定在球员的膀骨（即髋骨）外延。
  - 执行部件: 为一根可伸缩的三穴按摩棒提供抽插动能，同时对阴道、肛门和尿道进行刺激。
intensity_control:
  - 联动机制: 按摩棒的抽插强度与观众在官方平台上的实时“支持度”直接挂钩。
  - 互动效应: 观众可以通过付费投票来提升自己支持的球员或球队的炮机强度，这既是一种鼓励，也是一种变相的公开凌辱，极大地增加了比赛的互动性和娱乐性。
