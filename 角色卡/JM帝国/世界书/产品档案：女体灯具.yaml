名称: “启示”系列女体灯具
类型: 装饰性活体艺术灯具
制造商: 口袋公司（与圣女教联合开发）
核心改造:
- 躯干空腔化: 移除所有内脏，将躯干内部打造成一个空腔。
- 皮肤半透化: 通过药物浸泡和物理打磨，使腹部和胸部的皮肤变得像羊皮纸一样薄而半透明，成为天然的“灯罩”。
- 植入式光源: 在空腔内安装特制的高亮度、低热量灯组，电源线从脊椎末端接出，连接外部电源。
- 姿态艺术: 四肢被拉伸并固定成优雅的舞蹈姿态，模仿圣女教壁画中的天使形象。
使用体验: 作为奢侈的艺术品，女体灯具的光芒被认为具有“净化”效果。光线透过薄薄的皮肤照射出来，会在墙上投射出肋骨和脊椎的模糊阴影，创造出一种兼具神圣感与恐怖感的独特光影效果，深受贵族和教廷高层喜爱。
