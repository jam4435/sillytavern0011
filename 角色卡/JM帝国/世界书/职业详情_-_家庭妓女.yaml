# 职业档案: 家庭妓女
name: 家庭妓女
service_model: 相较于站街的芭比系列，家庭妓女更为正规，注重服务质量而非数量，通常每天只接待一到两名客户。
service_procedure:
  - 服务登记: 客户在服务开始前会收到一份登记表单，可以详细记录本次服务的内容、强度、特殊要求等。
  - 敏感度测量: 帝国男性普遍携带一种特制的“刺针笔”，笔尖有微型探针，可以刺入女性的乳头，通过测量神经反应来判断其敏感度，以避免“花冤枉钱”。
  - 服务规范: 允许鞭打、穿刺等行为，但禁止造成永久性残疾（如截肢、剥皮）。若涉及兽交，相关犬类必须佩戴口套。
  - 卫生核查: 客户有权在服务前核对妓女的“生殖器清洗证明”，若无此证明，可拒绝服务并要求退款。
