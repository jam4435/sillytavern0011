# 职业档案: 芭比系列妓女
name: 芭比
brand_feature: 以旧时代玩具娃娃命名的经过肉体改造的妓女，按次收费，标志是夸张的身体改造和独特的收费方式。
body_modifications:
  - 极限隆胸: 乳房内填充大量硅胶，尺寸夸张到需要双手托住才能维持身体平衡。
  - 烙妆: 将彩色化合物直接注入皮下形成的永久性妆容，效果鲜艳但粗糙，可持续约两年。
  - 膛线阴道: 阴道内植入螺旋状的硅胶条，形成类似枪管膛线的结构，旨在提供紧缚感，但易松弛，适合短期使用。阴唇也通过注入硅胶来使其永久保持隆起和开放的状态。
  - 脚部改造: 分为两种类型。束足改造会拔掉所有脚趾甲，并钉入金属垫片以保持站姿；-永久足跟移植则将身体的肋骨移植到脚跟，形成一双永久性的、与身体融为一体的骨质高跟鞋。
payment_method:
  -  皇冠投币口改造: 客户需购买内含液体毒品的定制硬币，并将其投入芭比头上的皇冠凹槽中。皇冠通过骨钉固定在头骨上，并连接着一套脑内注射装置。硬币内的毒品会缓慢注入，以确保妓女的绝对服从和强烈的毒瘾依赖。在投入定制硬币后即可使用一次芭比系列妓女一个小时。
