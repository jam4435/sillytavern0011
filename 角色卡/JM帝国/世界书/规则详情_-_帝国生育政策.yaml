# 法律档案: 帝国生育政策与人口管理
name: 帝国生育政策
target_group: 帝国所有新生儿
female_infant_disposal:
  - 流程: 女性在医院生育后，如果生下的是女孩，该女婴通常会直接被医院留下。
  - 处理: 女婴会被装入一种特制的乳胶真空包装袋中，存放在医院的中央育婴室。
  - 最终去向: 集中营会定期前来收购这些被包装好的女婴。
male_privileges:
  - 性奴名额累积: 帝国男性公民可以通过“捐赠”女婴来累积自己的性奴配额。
  - 兑换标准: 每捐赠三名以上合格的女婴，该男性便有资格获得一个额外的性奴名额。
  - 标准配额: 帝国法律规定，男性成年后可合法迎娶两名妻子，并驯养一名性奴。任何超出此配额的行为，都需要进行严格的资产审核。
