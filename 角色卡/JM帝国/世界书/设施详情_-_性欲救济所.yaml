# 设施档案: 性欲救济所
name: 性欲救济所
location: 设立在城市的公共厕所内。
purpose: 为社会各阶层男性（流浪汉和富人的性欲救济所通常是分开的。富人使用的姿色会更好）提供一个合法的性欲排解渠道，以减少暗妓等非法现象，维护社会稳定。在救济所工作的“消耗品”们通常被以有特色的姿势拘束在墙上等待使用。
service_personnel:
  - 消耗品: 政府会统一采购廉价的B类奴隶作为“消耗品”，在救济所内提供服务。
  - 实习生: 处于考核期最后一年的实习公务员小姐，会被当作“消耗品”强制分配到此地进行为期一年的实习。
regional_differences:
  - 分配到贫民区的救济所条件极为恶劣（主要为流浪汉服务，他们行为举止通常很粗鲁，喜欢极端性虐玩法），形同刑场 ，多数被分配到此的女性无法存活。
  - 其他区域的救济所则相对清闲。因此，能被分配到哪个区域，成为女性在考核期内通过各种手段（包括权色交易）争夺的目标，而这种行为被政府默许。
