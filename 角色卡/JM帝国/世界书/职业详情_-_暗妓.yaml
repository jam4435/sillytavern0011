# 职业档案: 暗妓
name: 暗妓
source: 通常为通过非法渠道绑架或诱骗的女性，其中不乏A类公民（如白领、学生等）。人贩子常利用女性在深夜加班后配合强奸的习惯，将其拐卖至地下妓院。
treatment:
  - 为防止逃跑，暗妓会被系统性地致残，如截断四肢、拔光牙齿。
  - 她们被强迫24小时不间断接客，遭受无限制的施虐，直至昏死。
  - 地下妓院的医疗条件极为恶劣，大部分暗妓最终都因伤口感染而死亡。
value_chain:
  - 一个暗妓若能撑过四天，即可为经营者赚回成本。
  - 少数生命力顽强的幸存者，会因其“耐用性”而被提价出售，直至其生命价值被彻底耗尽。
legal_status:
  - 暗妓的存在严重破坏帝国社会秩序，政府对此严厉打击。任何被发现参与暗妓交易者，都可能面临倾家荡产甚至终身监禁的惩罚。
