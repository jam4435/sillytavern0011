# 设施档案: 女体地铁闸机
name: 女体地铁闸机
type: 由活体女性改造而成的地铁检票设施。
mechanism:
  1. 刷卡: 地铁卡的边缘有一排金属齿。刷卡时，金属齿会带动植入女性阴蒂内的齿轮旋转。
  2. 读卡与扣费: 齿轮本身就是一个读卡器，转动时会自动扣除费用。同时，齿轮两侧的尖刺会刺激阴蒂，使女性本能地收缩阴道和肛门。
  3. 开门: 插在女性肛门内的固定棒会感知到收缩带来的压力变化，随即自动打开闸机门让乘客通过。
operational_issue:
  - 在客流高峰期，闸机上的女性常因过度刺激而被活活刷到高潮。高潮时无规律的肛门收缩会被机器误判为“人流过多”，导致闸机短暂锁死，造成拥堵。因此，一个合格的女体闸机必须具备极高的忍耐力。
