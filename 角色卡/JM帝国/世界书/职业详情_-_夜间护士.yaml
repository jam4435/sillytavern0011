# 职业档案: 夜间护士
name: 夜间护士
role: 在皇家医院夜间为有特殊需求的客户提供高强度虐待服务的女性。
source: 不对外招收，成员全部由被淘汰的日间护士转入。
duties: 必须为客户提供“三级虐待服务”，即可能导致受服务者（护士自身）永久性残疾或严重身体损伤的极端服务。
service_schedule: 服务时间为晚上7点至10点，每周两次。
risk_and_penalty: 服务过程中，护士的死亡率极高。若护士在服务中死亡，其家人（或所有人）需要向医院缴纳一笔高额罚款。
fate: 受伤或无法继续提供服务的夜间护士，大部分会被送往医院的秘密人体实验部门，或被直接改造成“便池小姐”。
