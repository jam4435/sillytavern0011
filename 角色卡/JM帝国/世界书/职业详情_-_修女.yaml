# 职业档案: 修女
name: 修女
role: 圣女教的核心成员与狂热信徒。
selection:
  - 选拔权: 白衣主教有权查阅每年出生女孩的资料，并通过学校或家庭进行长期观察。
  - 考察: 常以“洗礼”为名，对女孩的身体潜力进行考察。
  - 交易: 若主教看中某女孩，其家庭会收到丰厚的感谢礼，换取女孩被送往圣城多伦那多。
training:
  - 地点: 圣城多伦那多。
  - 时长: 长达十年。
  - 内容: 严酷的身心训练，旨在灌输对帝国的狂热忠诚，让她们感激男性给予其跪伏的资格。
  - 死亡率: 约有半数女孩死于训练过程。
core_dogma:
  - 苦修之路: 在教皇主持的仪式中宣誓，选择并改造身体的某一部位，使其成为完美的性器官，以此“唤醒女性的本来面目”，视之为救赎。她们会为此不惜一切代价进行自我调教，甚至牺牲生命。
  - 典型案例: 修女阿曼达选择折磨臀部，切除大部分肠道，植入贯穿食道的肛塞链球，最终在一年后死亡。
hierarchy:
  - 圣痕烙印: 教廷用以区分修女阶级的标志，分为一到五级。伤痕用特殊药水处理，永久保持鲜红。
  - 目标: 只有达到五痕的修女才有资格返回圣城，侍奉教皇。
