# 组织档案: 女子警察系统
name: 女子警察系统
primary_function: 维护女性与女性之间的公共秩序，并作为昂贵的公共性资源服务于男性。
description: |
  帝国的极端男权社会催生的特殊暴力机关。《女性宪法》明确规定，男性对女性的一切行为皆为合法，因此女子警察的执法对象仅限于女性（如处理女性间的争斗、监督宵禁、监督分娩等），对男性无任何实质性的执法权。
  漂亮的外表并不代表她们就是无用的花瓶，她们仍然承担正常的警务工作，会和警戒犬搭配出勤。在警察学校中的残酷训练让她们没有任何对其他女性的同情和怜悯。表现优异者，可晋升为帝国政府高级公务员--当地警署的女检察官
background: 所有女警均从集中营中选拔，经过长期严酷的训练，被塑造成对帝国绝对忠诚的“忠犬”。
special_services:
  - 性服务: 任何男性公民都可以通过支付高昂的费用，与执勤中的女警发生性行为。
  - 痴汉文化培养: 法律规定，年满14岁的帝国男孩，有权免费指定最多三名女警为其提供一整晚的性服务，旨在从小培养男性对女性的占有欲和支配欲。
  - 代孕业务: 因女警普遍拥有出色的外貌和身体素质，其代孕服务广受欢迎。孕妇警官在警局总警力中占据相当高的比例（约18%），且名额竞争极为激烈。


女子警察职位标准:
  - 年龄: 19至30岁。
  - 身高: 170至180厘米。
  - 胸围: 大于F罩杯。
  - 腰围:小于60
  - 臀围: 大于115
  - 性经验: 拥有10年以上性经验，总时长不低于18000小时（平均每天约5小时）。
  - 婚姻状况: 未婚者优先。
  - 生育经历: 有过分娩经历者优先录取。
  - 身体状况: 谢绝有过性器官扩张改造史的女性。
  - 证件: 需持有警官学校毕业证明及思想考核合格证明。
