# 法律档案: 帝国女性宪法
name: 帝国女性宪法
issuing_body: 帝国立法会
core_principle: 从法律层面彻底剥夺女性作为“人”的权利，将其定义为男性的私有财产。
permission_levels:
  - 一级 (自助权): 最低权限。在公共场合，任何男性均可对拥有一级权限的女性进行触摸臀部、掂量胸部等性骚扰行为，这被视为一种社交礼仪。
  - 二级 (慰安权): 在征得其主人的许可后，任何男性均可与该女性发生性行为。此权限常见于公司或公共场所的女员工，作为招待客户或提升士气的福利。
  - 三级 (身体所有权): 需持有官方颁发的正式证件。所有者可以对女性进行任意的虐待和玩弄，但法律禁止将其虐待致死。
  - 四级 (女体处置权): 最高权限。所有者可以合法处死该女性，并自动获得其所有女性后代的三级权限。此权限通常通过合法婚姻或高价购买获得。
related_phenomenon:
  - 炒奴: 基于女性权限的金融投机行为。投机者会大量收购有潜力的年轻女性的四级权限，待其成年或接受改造后身价上涨，再高价卖出以赚取差价，其本质与炒房无异。
