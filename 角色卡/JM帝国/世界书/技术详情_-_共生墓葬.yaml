# 技术档案: 共生墓葬
name: 共生墓葬
type: 连接棺内安魂女与地面守墓人的联动系统。
mechanism:
  1. 连接: 一根麻绳的一端挂在安魂女屁眼的钩子上，另一端穿过棺盖和墓台上的孔洞，绑在守墓人的阴蒂环上。
  2. 信号传递: 安魂女在棺内蠕动身体安魂时，会拉动绳子。绳子被拉动时，守墓人便知安魂正在进行；绳子暂时静止时，则表示安魂女达成了一次高潮。
  3. 计数与收费: 看守陵园的修女每天会询问守墓人前一晚的安魂次数，并以此为依据向死者家属收取“安魂费”。
symbiotic_effect:
  - 安魂女拉动绳子在传递信号的同时，也会刺激守墓人的阴蒂，使其产生快感甚至潮吹。守墓人因快感而夹紧肛门的行为，可以略微延缓沉重的墓碑压垮其肚皮的速度。
  - 只要墓碑不落下，墓台下的透气孔就不会被封死，安魂女就不会被憋死。因此，一个“优秀”的守墓人（能通过高潮反应延长时间）可以让安魂女进行更多次的安魂，为教堂赚取更多的费用。
