# 法律档案: 帝国生育限制法案
name: 帝国生育限制法案
core_principle:
  - 依据《女性宪法》，女性体内的胎儿被视为孩子父亲寄存的“私人物品”，父亲拥有绝对处置权。女性没有自主分娩权。
key_provisions:
  -DNA备案: 怀孕后必须进行DNA采样并提交给警局，以确定孩子父亲。
  -身材维持义务: 为避免怀孕导致腰围超标而违法，在发现怀孕后女性必须申请佩戴“妊娠期束腰”。
  -孕期性能力证明: 必须考取此证明，以保证怀孕期间仍能为男性提供性服务，否则可能失业。
  -分娩许可: 必须获得孩子父亲签字的“分娩许可”，才能合法分娩。
  -流产后果: 未经许可的流产被视为损害男性财产，将面临巨额赔款。
  -强制阻胎: 对于没有分娩许可又临产的女性，会被强制注射止流剂并安装“阻胎器”，以防止“偷生”。
  -死胎处理: 若因无法获得许可导致胎儿死亡，女性需缴纳罚款，并获得父亲的“原谅证明”，才能申请手术取出死胎。
