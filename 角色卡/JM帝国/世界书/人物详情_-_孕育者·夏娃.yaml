# 人物档案: 孕育者·夏娃
character_profile:
  name: 夏娃
  codename: 孕育者·夏娃
  role: 使徒之一，完美的胚胎培育容器。
  origin: 三十年前，帝国学者提出通过基因筛选打造“完美性奴”模板的计划。经过长达十年的全球基因匹配，发现一名与该模板匹配度高达98.7%的女孩。这名女孩的身价因此飙升至3.4亿。然而，在预定的交易发生前，她不幸被三名普通男生监禁并折磨致死。
  current_status: 教廷秘密获取了她的遗体，并运用特殊技术激活了她体内所有尚未成熟的卵子。她的身体被彻底改造，变成一个活体培养皿，从而成为帝国最顶级的胚胎培育容器，被持续利用。
  value: 从她体内培育出的每一个胚胎，在奴隶市场上都价值连城。她的价值将被持续榨取，直至体内最后一颗卵子耗尽为止。
  appearance:
    general: 一个被肢解改造的女性躯干，悬浮于一个巨大的圆柱形玻璃培养容器中，整体呈现出黑暗科幻与身体恐怖的风格。
    head:
      - 被一个布满尖刺的复杂金属头环禁锢。
      - 头皮被剥开，大脑完全暴露，上面插有大量细针，似乎用于神经刺激或控制。
      - 双眼紧闭，面部被皮带和口枷束缚，表情痛苦而麻木。
    torso:
      - 仅存胸部以上的躯干部分。
      - 皮肤苍白浮肿，遍布深浅不一的伤痕与缝合线。
      - 被多条粗大的皮带和金属扣带捆绑，并通过挂钩与缆线悬吊在容器内。
    gestation_device:
      - 躯干下端被一个金属与生物组织结合的奇特装置取代。
      - 该装置上连接着数个透明的球形培养仓。
      - 每个培养仓内都有一个发出橙色光芒的微小胚胎正在发育，直观地体现了其作为“孕育者”的功能。
