# 单位档案: 生育型雌豚
name: 生育型雌豚
type: 特殊改造繁殖用女畜
primary_function: 与种猪交配，生育可供食用的高档猪仔。
modifications:
  - 生殖系统改造: 打破生殖隔离，改造卵巢使其能排出可与猪精子正常受精的猪卵。
  - 消化系统改造:
    - 肛门进食: 切除肠道内的防逆流瓣膜，并断开胃与食道的连接。饲养员通过肛门将流食直接泵入肠道。
    - 阀门盖: 肛门处安装有带压力表的金属阀门盖，用于注入食物和水，并监控肠道压力，在压力过高时进行放气。
  - 口腔改造: 口腔内植入乳胶制成的人造阴道，专用于为种猪提供口交服务，以缓解其在非交配期的狂暴性欲。
management:
  - 交配刺激: 未怀孕的雌豚下阴会被涂抹挥发性激素，以刺激种猪发情。
  - 怀孕防护: 怀孕后的雌豚会佩戴特制的防护器具，防止种猪的强行交配行为导致流产。
