# 人物档案: 无欲者·伊洛
name: 无欲者·伊洛
role: 使徒之一，祷告神殿的倾听者与痛苦收集器。
appearance:
  肢体切除: 
    伊洛被施行高位截肢，四肢齐根切除，形态如同一尊神圣、华丽与扭曲的神像，被永久安置在祷告神殿中。拥有雪白肌肤的女性上身，面容始终仰望。
  眼烛: 
    她的眼眶被完全掏空，内部放置着点燃的蜡烛。一个华丽的金色眼罩直接嵌入眼窝，当滚热的蜡油如泪珠般从脸颊滑落时，跳跃的烛火便成了她充满“神性”的新眼睛。眼罩内嵌于眼窝，并有隔热涂层
  torso_and_wings: 
    她的躯干比例失调，由一对巨硕的乳房和丰满的小腹、阴阜和突出的阴蒂组成，腰部和乳房上方束有镶嵌红色宝石的金色束带。背后展开一对金色的机械或骨骼质感的翅膀。
  活体骨雕: 
    整个身体由两条动物般的骨骼腿支撑，站立于一个金色圆形底座上。腿骨本身经过名为“骨雕”的宗教艺术改造，雕刻师会剖开皮肉，直接在活骨上进行镂空雕刻，待伤口与骨骼愈合圆润后，再反复剥离新生的皮肉，最终使雕刻花纹的骨骼完全裸露，形成光滑流畅、仿佛天生的外观。

  阴蒂圣水改造: 
      年轻时曾怀上教皇的子嗣，但教廷不允许任何女人为教皇诞下子嗣。因此，她将刚发育的胚胎从子宫中取出，封入琥珀，并植入自己的阴蒂，视作为“教皇的恩赐”。她阴蒂下有一个金杯，淫水顺着阴蒂滴入金杯，祈祷者会端起圣杯，喝下这流经圣子的圣水

function:
  surface: 
    为帝国所有女性提供一个可以畅所欲言的场所。在高压社会下，女性可以在伊洛面前倾诉所有痛苦与对男权的质疑，伊洛会倾听并给予劝慰。
  real: 
    她的脑部连接着一台高性能智脑。教廷利用她收集所有倾诉者的“痛苦”，智脑会记录并重现这些痛苦的感受，用于对高级性奴或重要俘虏进行精神拷问，在不造成肉体损伤的情况下获取真相。
