# 职业档案: C类清洁女工
name: C类清洁女工
primary_function: 使用高效清扫工具，负责更大面积城区的清洁工作。
special_privilege: C类是唯一保留双手的清洁工，这使她们的工作效率远高于其他两类。
body_modifications:
  - 消化系统改造: 消化腺体被切除，胃和小肠被改造成储水容器，以保持体内储存的水质清洁。
  - 直肠压力塞: 直肠深处装有一个压力塞。通过主动推动压力塞，可以从胃和小肠中吸取清水来清洗拖布。
  - 清洗技巧: 熟练的C类女工能通过收缩肛门，增加拖布与肠壁的摩擦，从而在体内快速完成拖布的清洗工作。
social_status:
  - 因保留双手，常成为性骚扰的对象。但持有“免奸工作证”，在工作期间受到法律保护，普通公民不得强行要求其提供性服务。
