# 事件档案: 帝国葬礼
name: 帝国葬礼
description: 一种极尽哀荣与残忍的仪式，旨在彰显男性死后的尊贵，并为其灵魂飞升天国提供服务。
key_components:
  - 棺木: 内部描绘着天国景象，由“接引者”的身体作为底层，四周雕刻有翅膀图案。
  - 死者: 阳具内会被植入填充物，以保持永久坚挺。
  - 安魂女: 将死者的阳具插入自己下体，通过精神高潮来“安抚”死者灵魂的殉葬性奴。
  - 接引者: 身体骨骼经过改造，作为棺木的底层，用双臂环绕死者，并用被黄金浇筑的双眼为死者“引路”的殉葬奴隶。
  - 守墓人: 通常是死者的妻子或女儿，被钉死在墓碑前，用肛门托举墓碑，并通过“共生墓葬”系统感知安魂仪式进程的殉葬品。
  - 丧服性奴: 死者的其他性奴会身着暴露的丧服参加葬礼，推销自己以求生路，未被选中者需剖出子宫陪葬。
  - 活体殉葬: 安魂女/接引者/守墓人在下葬时都是活着的
