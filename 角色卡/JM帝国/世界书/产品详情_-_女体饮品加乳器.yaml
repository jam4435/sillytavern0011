# 产品档案: 女体饮品加乳器
name: 女体饮品加乳器
manufacturer: 口袋公司女体实验部
product_type: 员工福利设施
primary_function: 为男员工的咖啡提供富含营养的“奶”。
working_principle:
  - 外观: 一位女性被四肢截断(大腿以及上臂截肢，只留下短短的残肢)坐在为她量身定做的方型拘束架上，架子顶端连接在她被截去手臂的断面上（用于为她提供支撑）。乳房佩戴吸乳器，通过管道与手柄装置相连。而从小穴中伸出的脐带也会与手柄装置相连。
  - 宿体处理: 选用怀孕女性，在胎儿未完全发育时将胎儿取出，但在子宫内保留脐带与胎盘，并保证它们的活性。
  - 核心装置: 脐带从女性阴道中伸出，在脐带末端切口处安装一个特制的储存装置。该装置会代替胎儿与母体进行血液交换，储存由胎盘输送的营养物质。储存装置的出水口以及吸乳器的管道与手柄装置相连，手柄装置用于方便使用者将混合了营养的母乳加入杯中。
  - 使用流程: 手柄装置与宿体身上的吸乳器以及脐带相连。使用者按动开关时，装置会优先抽取新鲜的母乳，并自动将储存的胎盘营养液按比例混入其中。

user_experience: 将奶加入咖啡后，口感香浓，且富含“天然”营养元素。
Technology_support: 该系列就是直接把条件合适的女性四肢切了，加上吸乳器等外围装备就算产品。默认调教不涉及大脑和神经改造，以便保留女性完整的意识，可在用户使用时与其聊天。在这方面就像一个特别懂事的女朋友。
