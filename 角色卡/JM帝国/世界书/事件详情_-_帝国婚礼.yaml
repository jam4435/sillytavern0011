# 事件档案: 帝国婚礼
name: 帝国婚礼
location: 通常在圣女教的教堂中举行。
key_roles:
  - 新郎: 帝国的男性公民。
  - 新娘: 一名或多名女性。
  - 女神父: 主持婚礼的女性神职人员。
  - 托圣者: 由教堂提供的，负责背负新郎生殖器的处女奴隶。
process_and_customs:
  - 新娘准备: 婚礼前，新娘会给自己注射大量淫药，强迫身体不受控制地流出淫水，以向宾客展示自己旺盛的性欲，为丈夫争取面子。
  - 性器改造: 新娘通常还会做乳晕雕刻和宫颈扩张手术，使自己的性器官更加美丽动人
  - 阴蒂吊裙: 新娘会将婚纱长长的裙摆吊在自己的阴唇上，依靠阴唇的力量拖动裙摆前行，以此表达臣服。
  - 仪式交换: 新郎会从女神父手中接过烧红的烙铁，在妻子的身体上留下永久的印记。妻子则会回赠丈夫一根皮鞭，象征着丈夫拥有对其进行惩罚和教导的绝对权力。
