# 组织档案: 女子敬国军
name: 女子敬国军
aliases: [帝国慰安妇部队]
primary_function: 为帝国男性士兵提供全面的性服务与文职支持。
description: 一支完全由女性组成的辅助部队，独立于正规军编制。女兵被禁止接触任何常规武器，她们存在的唯一目的就是满足男性的生理与心理需求。每位男性士兵都有权挑选一名敬国军女兵作为其在军中的专属性伴侣。
ideology: 她们被强制学习由国母级性奴南宫婉然编写的《女人的意义》，并接受高强度的军用洗脑，造成永久性脑损伤，部分人会因此出现痴傻症状（军方称之为“痴呆流感”）。她们坚信“我们远离武器，我们思想透明，我们服从命令”，并将性行为中的受伤视为无上光荣。
control_method: 每名女兵的脊椎内都植入了微型炸弹，一旦检测到叛逆思想或与革命军俘虏进行思想接触，炸弹便会引爆，以确保绝对的忠诚。
medal_system:
  肉便器三等勋章: 五年以上慰安妇经历，为超2000人提供服务，忠诚度90分以上。
  肉便器二等勋章: 八年以上经历，为超5000人服务，因性虐待留下永久残疾但仍保持高强度服务，忠诚度95分以上。
  肉便器一等勋章: 十年以上经历，为超1万人及10名高级军官服务，有挡枪等战场贡献，后代继续服役，忠诚度98分以上。
  银精勋章: 授予掌握专业技术的文职女性，可免除性义务，极为稀有。
  妊娠者勋章(非官方): 需在分娩时提供孕交服务并存活，多数幸存者会留下严重性功能残疾。
  圣精子勋章(非官方): 由圣女教信徒女兵授予残忍的男性，作为其退伍后加入教廷的推荐信。
