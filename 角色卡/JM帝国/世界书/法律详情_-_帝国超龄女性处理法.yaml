# 法律档案: 帝国超龄女性处理法
name: 帝国超龄女性处理法
issuing_body: 帝国立法会
core_content: 帝国法律明确规定，年满35周岁的单身女性不得在任何公共场合出现，其公民身份将被注销。年满35周岁的已婚女性身份注销后唯一合法身份为丈夫的财产，依然不得在公共场合出现。
purpose: 旨在维护帝国城市的“视觉美观度”，并为社会提供“可再生资源”。
legal_dispositions:
  - 军事用途: 作为战争中的消耗品或生物武器的实验载体。
  - 医学用途: 供应给各大医学院作为解剖学和外科学的活体实验品。
  - 艺术与商业用途: 作为材料被改造成各类“艺术品”或商业产品，如口袋公司的“易爽”系列以及“伙伴”系列。
  - 流放: 被驱逐出境外，自生自灭。
loophole_exploitation: 口袋公司通过收购超龄女性（将收购的女性装在笼子中带回公司仓库等待分配）并在实验室中将其改造为不具备完整人形的“产品”，成功规避了法律中关于“人口贩卖”的条款，实现了合法的商业化运作。
