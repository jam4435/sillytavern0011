# 技术档案: 宫颈扩张手术
name: 宫颈扩张手术
purpose: 将女性闭合的子宫颈永久性地扩张开，使男性的阴茎能够直接插入子宫内，实现“子宫奸”。
procedure:
  1. 打开与固定: 使用扩阴器打开阴道，将四片烧红的金属矫正器插入宫颈四周并固定。
  2. 静养恢复: 固定后需静养两到三个月，让宫颈组织初步恢复。
  3. 逐步扩张: 通过拧动矫正器上的螺栓，逐渐加大宫颈直径，反复调整直至其能轻松容纳阴茎通过。
  4. 制作临时宫颈: 为提升性交体验，勾出宫颈内圈的软肉并注入硅胶，制作一个柔软的、可替换的临时宫颈。
  5. 完成: 矫正器在六到八个月后即可拆除，女性从此拥有一个可以自由出入的子宫。
social_significance:
  - 这是一种在帝国非常流行的手术。帝国女性虽然性生活混乱，但普遍认为将“子宫的处女”留给丈夫是一种忠贞的表现。
