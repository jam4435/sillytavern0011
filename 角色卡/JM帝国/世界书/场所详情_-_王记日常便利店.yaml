# 场所档案: 王记日常便利店（帝国百环街分店）
location_name: 王记日常便利店
location_type: 口袋公司产品低端零售点
atmosphere: 混合着廉价塑料、消毒液和香烟的味道，灯光明亮但显得有些陈旧。货架上摆满了各种生活用品和口袋公司的低端产品。
key_features:
  - 商品区: 显眼位置摆放着“易爽一次性自慰娃娃”以及“居家伙伴”的促销海报。角落里摆着一两台吸尘器作为能买到的最好的产品。
  - 收银台: 店员机械地为顾客结账，并附送质量低劣的赠品。
  - 顾客群: 多为附近贫民区的男性居民，神情疲惫或急色。
recurring_event: 定期举办口袋公司低端产品的促销活动，吸引大量顾客排队购买。
