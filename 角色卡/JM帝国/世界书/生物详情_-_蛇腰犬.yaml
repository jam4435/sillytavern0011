# 生物档案: 蛇腰犬
name: 蛇腰犬
aliases: [黑夫人]
type: 家用犬、礼仪犬、观赏犬
origin: 教廷特供，拥有其专利权。
modifications: 
  - 蛇腰改造: 人类女性截除大部分肋骨，用束腰紧紧束缚胸腔与腰部。必要时会切除部分肠道，以达到极致的纤细腰肢。
characteristics:
  - 外观: 腰肢细如长蛇，行走时臀部会夸张地扭动，极具观赏性。
  - 性格: 安静、听话。
  - 弱点: 因腹腔压力巨大，心肺和肠道功能严重受损，运动能力和消化能力极差，需喂食易消化的流质营养食物。
acquisition: 不对外出售，仅作为教廷换取新修女时赠予其家庭的感谢礼。偶尔会在二手市场出现。
