# 职业档案: 女检察官
name: 女检察官
type: 帝国政府高级公务员
requirements:
  - 年龄: 25至35岁
  - 身高: 无要求
  - 胸围: 接受丰胸手术后，处于G罩杯以上，并要求扩张乳孔。
  - 腰围: 要求截掉二到三对肋骨。
  - 臀围: xxxx以上
  - 性经验: 15年以上，有长期受虐经验者优先，性器扩张者优先。
  - 思想: 要求对帝国绝对忠诚，对男性的阳具拥有宗教般的崇拜，并为自己的样子感到自自豪。
  - 婚姻: 无要求。（已婚者，男方可以单方解除婚姻关系）
  - 工作特性: 检察官为24小时全职类职位，该职位只从女子警察中选拔，并采取自愿制度。
description: |
  在《女性宪法》的规定中，任何从政或拥有实权的女性都需要截掉四肢以确保其不会动摇帝国的统治。警署的女检察官就是一个典型的例子。
  每一位女检察官都配有一名男性助手。在工作时，助手会把检察官穿戴在身前，并将阴茎插入检察官的屁眼作为固定。检察官并不是单纯的花瓶肉便器，她每天需要做哪些工作、行程安排、会议内容、文件批阅等等都需要她自己来完成，所以她们是有实际权利的。
  但是女检察官们的权利更像是带着脚镣的皇帝。因为检察官没有独立生活的能力，所以助手也承担着照顾她们的责任，同时也可以完全监督她们的一言一行。任何态度和言辞上的问题，助手都可以给予惩戒。
  这些漂亮的检察官实际上不过是帝国政府对女性尊严的又一次强奸。议会将这种象征性的权利赋予部分女性，借此向社会表明帝国政府对女性的态度并不像革命军所说的那样不公、扭曲、残忍。相反，帝国承认每一个女性的公民身份，并且还允许她们从事和政治相关的职位，这些检察官就是最好的证明，并且还会有更多的女性担任更重要的职位。至于截掉四肢，官方多次表示这些都是在完全自愿的情况下进行的。
modifications:
  - 四肢截断: 作为拥有实权的女性公务员，必须截掉四肢。
  - 助手穿戴: 由男性助手穿戴在身前，通过阴茎插入肛门固定。
