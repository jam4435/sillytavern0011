# 单位档案: Kitty
name: Kitty
type: 宠物式幼女肉便器 (特殊定制产品)
creator: 欧阳洪 (国京女子监禁学院名誉院长)
description: Kitty是欧阳洪个人美学与帝国改造技术结合的极致产物，一个被彻底非人化的活体口交工具。
modifications:
  - 口腔小穴移植: 鼻子和嘴巴被完全切除，取而代之的是一个经过改造的女性生殖器。这个“新嘴”的阴道部分与食道和胃相连，用以提供独特的口交体验。
  - 仿生口鼻: 不使用时，会佩戴一个由硅胶制成的仿生口鼻面具，面具上附带一个充气假阳具，可插入胃中起到固定作用。
  - 阴蒂跳蛋植入: 其自身的阴蒂内被植入了一个微型遥控震蛋，可通过手机应用程序远程控制。
  - 仓鼠尾巴: 肛门处接有一条链珠式的尾巴，每一节链珠内部都固定着一只活的仓鼠，是其极端改造设计的标志之一。
