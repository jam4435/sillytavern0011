名称: 女体武器架--“征服王座”系列
类型: 军事级定制奢侈品
制造商: 帝国军方 x 口袋公司联合实验室
原材料: 通常选用身份地位高、反抗意志强的C类革命军女将领战俘，以最大化其作为战利品的象征意义。
核心改造:
  - 基座姿态: 将战俘的脊椎从腰部打断，使其仰躺在地，双脚折到巨乳旁，肥臀和面部向着天空。通过注射巨量的细胞增殖剂和高浓度生物凝胶，使其背部、臀部和腰部的肌肉组织发生增生，形成一个巨大、而充满肉感的“王座坐垫”。数根粗大的钢钉、紧固钢丝、和锁链贯穿束缚其躯干，将这团肉体强行固定成型。
  - 活体武器架: 这是设计的核心与灵魂。一把巨大的、象征主人身份的武器（如战斧、动力锤）的握柄会从朝天的屁眼刺入，贯穿阴道，并顺势放入她的口中，以她的头颅作为武器架的基座。
  - 乳房细节: 左乳头和乳晕被钉上一圈铁钉，右乳乳孔被扩张成拳头大小，双乳乳头都通过铁链，和旁边高跟鞋的鞋跟链接到一起。子宫被翻出，穿上诸多铁环，一根粗大铁链还从子宫内部穿出，可供主人握持。
  -  次级衍生产品: 因为贵族对它的追捧，现在市面上多了不少用普通革命军女战俘制作的女体武器架,

使用体验: “征服王座”是帝国将领夸耀军功的纪念品，象征着帝国不可一世的武力与对敌人的绝对碾压。将武器从她的肉体里取出后，就能坐在仍在痉挛的肉体上，把玩着手中连接其子宫的锁链，感受着身下的革命军高级将领战俘的颤抖与恐惧
