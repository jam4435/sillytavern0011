# 产业档案: 女体畜牧业
name: 女体畜牧业
type: 新兴农业分支产业
core_business: 以工业化、动物化的模式对女性进行集中饲养和大规模繁殖，以满足帝国社会对女性数量的庞大需求。
characteristics:
  - 饲养模式: 类似于女性集中营，但更注重繁殖效率和生长速度，将女性完全按动物标准分批培育。
  - 低风险投资: 由于“女畜”无需提供性服务或与人交流，避免了传统性奴产业中可能出现的各种意外，因此成为低风险、高回报的投资领域。
emerging_branch:
  - 生育型雌豚: 近年新兴的高利润分支，通过生物技术改造雌性人类，使其能与种猪交配并产下真正的猪仔。
  - 美人肉: 这些由“雌豚”产下的猪仔，长大后其猪肉被称为“美人肉”，肉质极为鲜美，是帝国高档餐厅中备受追捧的顶级食材。
