# 设施档案: 女性尸体垃圾箱
name: 女体垃圾箱
type: 专门用于丢弃女性尸体的大型金属回收箱。
location: 遍布城市的街道、写字楼下和居民小区。
usage_rule:
  - 任何女性，无论生前地位多高，死后都只能作为“女体垃圾”被丢弃。
  - 合法丢弃的前提是，必须在尸体上印有该女性的“女体处置权”编码。没有编码的尸体被发现后，警方会以损坏他人或国家财产的罪名追查并起诉杀人者。
regional_characteristics:
  - 居民区垃圾箱: 尸体多为被性虐致死，死相惨烈，节假日期间数量会激增。
  - 办公区垃圾箱: 尸体多为过劳猝死，容貌相对完整，是恋尸癖者非法奸尸的主要目标地点。
