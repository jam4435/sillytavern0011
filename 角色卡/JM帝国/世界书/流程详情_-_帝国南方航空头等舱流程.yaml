  # 服务流程: 帝国南方航空头等舱
  pre_flight:
    - 值机: 地勤人员在私密的VIP室为您办理手续, 并将当日值班的六位空中小姐引荐给您。
    - 空乘选择: 您可以从六位佳丽中挑选一位作为您本次旅程的专属空乘。
    - 安检: 您选定的空乘将以其温软的手为您进行一次 sensuous and thorough 的贴身安全检查。
    - 休息室: 专属空乘将引导您前往顶层休息室, 您可以在全景落地窗前享受美酒, 或在私人套房内体验各项娱乐设施, 直至登机时刻。
  in_flight:
    - 登机: 登机后, 您的专属空乘会为您奉上热毛巾与迎宾饮料。
    - 餐饮: 起飞进入平流层后, 空乘将协助您点选由米其林主厨设计的个性化菜单。用餐时, 她会以高级餐厅的标准为您布设餐桌, 逐道呈上佳肴, 并提供专业的葡萄酒搭配建议。
    - 休息: 当您准备休息时, 空乘会为您提供贴心的铺床服务, 将座椅变为一张舒适的睡床。
    - 娱乐: 在整个巡航阶段, 您可以尽情体验客舱内的所有娱乐设施, 或随时召唤您的专属空乘提供任何您需要的服务。
  post_flight:
    - 降落: 飞机降落后, 您的专属空乘会亲自为您提取托运行李。
    - 告别: 她会将您一路护送至接机的豪华专车, 在为您打开车门后, 微笑着与您道别, 结束本次旅程。
