# 单位档案: 高挑淑女S-07
name: 高挑淑女S-07
type: 辅助作战女畜
primary_function: 在特种作战（如山地、密林）中为士兵背负装备和物资。
appearance: 被改造高挑淑女的女性，双臂消失，肩膀链接手臂的关节变成挂钩，和脸颊的开口一样，连上系带用以配合挺翘臀部固定背部的军用物资箱，肌肉线条分明。头部佩戴军用头盔和面罩，鼻环和巨乳之间也连上系带，固定胸前的军用物资箱。全身几乎被复杂的带子和挽具系统覆盖，她的脚上穿着融合了芭蕾足尖鞋和高跟鞋风格的奇异鞋子，脚踝被镣铐束缚
modifications:
  - 腮角扩口: 腮部被切开并扩大，以增加肺部进气量，提升在崎岖地形的耐力。
  - 驼峰乳拖: 胸部被改造成巨大的驼峰状结构，内部储存经过处理的乳汁，作为士兵在野外的紧急水源。
  - 肛门拖拉锁: 肛门和直肠被改造，可以安装特殊的拖拉锁具，用于配合士兵搬运大件或沉重的物品。
