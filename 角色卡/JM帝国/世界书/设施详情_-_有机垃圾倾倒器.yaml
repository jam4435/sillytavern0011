# 设施档案: 有机垃圾倾倒器
name: 有机垃圾倾倒器
type: 双向肛塞式垃圾转移装置。
location: 安装在每户庭院的围墙上。
working_principle:
  - 第一步 (消化与储存): 家用女仆负责消化家庭产生的厨余垃圾，并将形成的粪便储存在体内。
  - 第二步 (转移): B类清洁女工来到指定位置，将自己的肛门与墙上的倾倒器对接。通过倾倒器，家用女仆体内的粪便被直接转移到B类清洁女工的肠道中。
  - 第三步 (运输与处理): B类清洁女工将收集到的有机垃圾（粪便）运往城市的集中处理厂。
advantages:
  - 整个过程环保且几乎没有异味，深受追求生活品质的帝国绅士喜爱。
