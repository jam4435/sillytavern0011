# 职业档案: 女医生
name: 女医生
role: 皇家医院中拥有较高地位和专业技能的医疗人员。
requirements:
  - 年龄: 25至35岁。
  - 身高: 165至175厘米。
  - 胸围: 最低D罩杯。
  - 身材: 腰臀比例需符合医院制定的黄金标准。
privileges: 拥有有限的性自由权，可以拒绝她们认为无理的性要求。
special_modification:
  - 药箱植入: 左侧的一根肋骨被移除，替换为一个小型内置药箱。
  - 哺乳喂药改造: 药物通过软管从药箱输送至乳头。喂药时，病人像婴儿吸吮母乳一样从女医生的乳头处服药。为改善口感，其乳汁中被加入了特殊的调味成分。喂药结束时，乳头处的软管会轻微震动以作提醒。
