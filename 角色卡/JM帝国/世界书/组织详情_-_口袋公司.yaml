# 组织档案: 口袋公司
name: 口袋公司
aliases: [Pocket Corp]
primary_function: 高端性奴玩具设计、人体改造方案开发与女体办公设施制造。
description: 帝国顶尖的生物科技与奢侈品制造公司，以其大胆、创新甚至残忍的设计理念而闻名。公司的产品不仅是性用具，更是权力与地位的象征。主打产品均为四肢截断式的性奴。口袋公司将其办公环境本身打造成了一个展示其产品的“活体展厅”，从前台到保洁员，无一不体现着其将女性彻底工具化的企业文化。
key_departments:
  - 女体设计组: 负责产品概念与效果图设计，由安娜等女性设计师为主。
  - 女体实验室: 负责将设计图转化为现实，进行高风险人体改造实验，由索菲娅等研究员负责。
reputation: 在男性消费者中享有极高声誉，被视为品位与财富的象征。其办公家具系列，如女体沙发，是普通家庭难以企及的奢侈品。
