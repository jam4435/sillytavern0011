# 职业档案: 女仆长 (夜蕾丝)
name: 女仆长
affiliation: 夜蕾丝女佣家政公司
primary_functions: 监督其他女仆的工作，并对犯错的女仆实施惩罚。
body_modifications:
  - 拉链化马吊移植: 每个女仆长都被移植了一根硕大的马屌作为她们实施惩罚的工具之一这些移植的马屌被整个开，开口处安装了拉链。正常状态下马屌都会以剥开的样子平摊在女仆长的胸前。只有在她们开始惩罚工作时，才会解开束具，拉起拉链，让马屌恢复成肉棒的样子。
  - 子宫储精改造: 女仆长没有睾丸，无法自行产生精液。她们的卵巢被改造后从束腰两侧拉出，作为精液注入的接口。子宫被改造成一个储存精液的容器，大部分阴道被切除，并通过导管与仿生马屌的根部相连。
semen_management:
  - 收集与注入: 女仆长负责收集主人使用过的避孕套，通过一个气压注射泵，将回收的精液从腰侧的卵巢开口注入子宫内储存。
  - 模拟射精: 当子宫内储存了足量的精液后，女仆长可以通过收缩子宫，从仿生马屌的前端模拟射精过程。
standard_equipment:
  - 电击皮鞭: 原厂配置的惩罚工具，鞭柄上有一个金色的指环开关，按压可激活电击功能，拨动开关旁的刻度环可以调节电流强度。
  - 情趣手环: 配备带有内环刺的手环，用于在特定惩罚或服务场景中增加刺激。
punishment_modes:
  - 独立惩罚: 女仆长可以单独对普通女仆进行惩罚。
  - 共同惩罚: 当主人兴致高时，可以与女仆长一同进行。主人可以从被罚女仆的臀部插入，横向穿过其阴道，将自己的阴茎插入女仆长的仿生马屌内侧的预留通道中，实现与女仆长对女仆的“共同”性行为（此玩法对主人的阴茎长度有较高要求）。
