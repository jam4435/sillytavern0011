# 职业档案: 女足球运动员
name: 女足球运动员
primary_function: 帝国美足杯的参赛者，集运动员、艺人、性商品于一体的特殊职业。
training:
  - 球技训练: 需要进行刻苦的足球技术训练。
  - 形体训练: 日常训练更注重形体而非纯粹的体能，以维持对男性观众的吸引力。
  - 装备适应: 需要花费大量时间练习以适应“折足鞋”或“弧跟鞋”等特制装备，过程极为痛苦。
career_path:
  - 明星期: 在比赛中表现出色，身价暴涨，成为万众瞩目的明星，享受富豪的追捧和消费。
  - 衰退期: 随着年龄增长和被“消费”次数增多，价值迅速贬低，逐渐沦为与街边妓女无异。
  - 结局: 多数人因身体创伤无法继续比赛，被迫转入色情行业。少数顶尖明星选手的双脚会被富有的收藏家砍下，制成昂贵的工艺品，其身体剩余部分则被遗弃。
