# 人物档案: 索菲娅
name: 索菲娅
role: 口袋公司女体实验室首席研究员
description: 凭借卓越的个人能力在公司上位的强大女性，以精准还原设计图和极高的实验体存活率而闻名。然而，她也因其刻意施加痛苦的残忍实验手法而备受畏惧。
work_style: 她的实验对象通常是已被截肢的女奴。她从不在实验中使用麻醉，并常通过电击、注射不必要药物等方式故意增加实验体的痛苦。在实验过程中，她会随意地将烟灰弹在实验体身上，或将痰吐在其脸上。
personality_and_social_life: 性格极为强势，在性行为中也占据主导地位，经常抓伤作为性伴侣的男同事，导致许多人对她敬而远之。曾被目击在私人俱乐部中以女王装束调教公司的一位股东，显示出她在公司高层中拥有特殊的、超越普通职员的地位和权力。
