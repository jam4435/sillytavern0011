# 人物档案: 忏悔的·瓦丽安娜
name: 忏悔的瓦丽安娜
aliases: [战争双子之一, 恩赐执掌者]
role: 战争使徒，教皇的行刑工具与惩戒象征。
origin: 原为革命军中一名意志坚定的女战士，被俘后经历了教廷长达数年的精神与肉体改造，最终被彻底摧毁意志，成为教皇最忠诚的使徒之一。
description: 瓦丽安娜面容沉静，眼神空洞，仿佛一具精美的人偶。她沉默寡言，只在教皇的命令下行动。她的身体是教廷“神圣改造”的杰作，对痛苦的感知被扭曲为极致的虔诚与快感。
equipment:
  圣鞭“恩赐”: 一柄由特殊生物材料制成的长鞭。鞭身布满了中空的尖刺，每一根尖刺内部都连接着一个微小的精液囊，储存着由教廷筛选出的“圣精”。当教皇挥动此鞭时，尖刺会刺入受刑者体内，同时将精液注入伤口。对信徒而言，这是一种融合了痛苦与神圣的无上荣光。
  手脚具存: 她的双手从大臂中部被精准地截断，双腿则是在膝盖处被切离。精致的黄金盖子覆盖着断肢的末端，其上雕刻着繁复而神圣的蔓藤花纹，被架在乳房上，呈抱拳状的手掌和拖在臀后的脚掌，通过从黄金盖子下方延伸出的短链，被重新“归还”给了她。
