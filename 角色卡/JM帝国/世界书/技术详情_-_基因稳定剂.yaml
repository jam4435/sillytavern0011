# 技术档案: 基因稳定剂
name: 基因稳定剂
primary_function: 显著延缓女性的生理衰老过程。
usage_protocol:
  - 定制化: 需要根据使用者的基因图谱进行专门定制。
  - 注射周期: 每三年必须注射一次，否则效果会迅速消失，并可能产生加速衰老的副作用。
accessibility:
  - 成本: 由于其高昂的研发和制造成本，只有极少数的富人或权贵才能负担得起。
legal_implication:
  - 豁免权: 使用基因稳定剂的女性可以豁免帝国“超龄废除法案”（即禁止35岁以上女性出现在公共场合的法律），得以在超龄后依然保持合法的社会身份和活动自由。
