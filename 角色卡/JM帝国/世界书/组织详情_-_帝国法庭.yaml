# 组织档案: 帝国法庭
name: 帝国法庭
nature: 男性对女性施加羞辱和暴力的合法工具。
composition:
  - 审判长: 代表政府，象征法律的公正。
  - 正位副审判长: 代表皇族，象征男权。
  - 次位副审判长: 代表圣女教，象征女人的原罪。
courtroom_procedure:
  - 开庭前: 女法警需为所有男性陪审员提供口交服务，以确保他们能“冷静判断”。
  - 原告女性: 必须赤身裸体跪在地上为被告口交。此行为虽触犯“亵渎罪”，但处罚较轻。审判全程不可发言，只能委托律师陈述。
  - 被告女性: 会被吊在审判区，男性原告可随时对其进行鞭打。即使最终被判无罪，也需全裸跪伏12小时以示感谢。
emblem:
  - 法庭徽章为三根相互交叉的阳具，分别象征着政府、皇权与宗教这三大权力支柱。
