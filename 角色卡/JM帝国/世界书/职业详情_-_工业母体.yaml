# 职业档案: 工业母体
name: 工业母体
workplace: 帝国集中营
type: 特化的生育机器。
modifications:
  - 生育机器改造: 集中营的生育机器，可同时怀2-4个胎儿；去除头骨，为暴露的大脑接入电极，以此刺激大脑引发排卵、调节孕激素水平，使其身体永远处于最适合受孕和孕育的状态；被改造的口舌部方便直接灌入营养液；阴道接入的机械装置方便直接排出婴儿。
key_features:
  - 不受“超龄废除法案”限制，只要仍有生育能力，就必须一直在集中营内服役。
  - 怀孕早期，工作人员会进行胚胎细胞采样以鉴定性别，任何男性胚胎都会被清除，绝不允许在集中营内诞生男性。
purpose: 作为集中营的核心生产力，为帝国提供源源不断、标准化的女性“产品”。
