# 人物档案: 利卡·塔罗娜
name: 利卡·塔罗娜
identity_timeline:
  - 早期: 混血儿，母亲是酒吧舞女。18岁进入口袋公司担任前台，因不愿融入公司的性文化而遭排挤，被一位暗中爱慕她的部门主管保护。
  - 崛起: 突然从公司消失，被帝国教廷征召，成为教皇的女人。
  - 回归: 四年后以贵妇身份返回口袋公司，担任人事部主管。名义上每周只工作三小时，实则是与那位部门主管进行公开的恋爱。教皇对此似乎采取默许态度。
  - 陨落: 再次从公众视野中消失。根据其恋人（部门主管）设法得到的照片显示，她正在遭受极端的性虐待。
current_status: 已成为教皇厌弃的玩物。双足被改造成连接着电线的束具，供教皇踩踏并以此产生电击快感，成为了一件活体娱乐工具。
impact: 她的遭遇促使那位深爱她的部门主管下定决心，加入革命军，誓言要推翻帝国，将她解救出来。这个事件标志着帝国体制内部开始出现意图颠覆现有秩序的反抗力量。
