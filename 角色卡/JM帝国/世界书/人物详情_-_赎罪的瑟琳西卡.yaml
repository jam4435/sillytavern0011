# 人物档案: 赎罪的瑟琳西卡
name: 赎罪的瑟琳西卡
aliases: [战争双子之一, 怜悯执掌者]
role: 战争使徒，教皇的“净化”工具与慈悲象征。
origin: 与瓦丽安娜一样，她曾是革命军的成员。她的改造过程更为残酷，专注于让她理解并施加一种“净化之火”的慈悲。
description: 瑟琳西卡总是散发着一股淡淡的焦糊味和香料混合的气息。她的行动略显僵硬，因为她身体的一部分永远在承受着极度的灼热。她将这种永恒的痛苦视为对自身罪孽的赎罪，以及对教皇的无限忠诚。
equipment:
  烙铁“怜悯”: 一根永远保持着炽红状态的特制烙铁。不使用时，这根烙铁会插在她经过特殊改造的“肛炉”之中——一个位于她直肠深处、由耐热合金与生物组织构成的特殊器官，用以维持烙铁的高温。她身体周围的皮肤因此呈现出大面积的永久性烫伤和硬化。这柄烙铁与圣鞭“恩赐”共同象征着教皇至高无上的赏与罚。
