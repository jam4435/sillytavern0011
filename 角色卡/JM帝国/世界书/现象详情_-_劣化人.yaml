# 现象档案: 劣化人
name: 劣化人
description: 指因染色体高度觉醒导致内分泌系统混乱，外表变得异常丑陋（通常为肥胖油腻）的帝国男性。
social_status:
  - 生物学定义: 在生物学上，“劣化人”是一个具有贬义的术语，指代基因的负向变异。
  - 社会学定义: 在日常生活中，劣化人是高贵和血统纯正的象征。因为男性的性欲越旺盛，染色体觉醒程度越高，越容易发生基因劣化。
prevalence:
  - 帝国的皇室与贵族阶层中劣化人比例极高，因为他们的祖先是进化最早、性欲最强的一批男性。因此，肥胖油腻的劣化人特征已成为尊贵地位的标志。
example:
  - 婚礼上的前老板就是一位典型的劣化人，他体型巨大，能够轻易压垮甚至在性交中意外杀死他的新娘。娶多个妻子，甚至包括孕妇，是他们彰显地位和性能力的方式。
