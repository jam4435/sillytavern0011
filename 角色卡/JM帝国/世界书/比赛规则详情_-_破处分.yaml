# 规则档案: 破处分
name: 破处分
type: 美足杯特殊得分规则
description: 一项极具技巧性和观赏性的得分方式，深受资深球迷喜爱。
execution:
  - 条件: 球员在带球过程中，需以极其精准的角度，用鞋尖的撞角部分，将“人肉足球”直接踢入其身体上的小穴（阴道）内。
  - 判定: “人肉足球”内部装有高精度测距器，用于判断鞋尖是否成功进入并达到有效深度。
reward:
  - 计分: 一次成功的“破处分”可以直接计为1分进球。
  - 兑换: 球队也可以选择放弃这1分，将其兑换为两次点球机会。
significance: 该规则考验的不仅是球员的射门力量，更是其细腻的带球角度和对“足球”状态的精准判断力，是人球合一的最高境界之一。
