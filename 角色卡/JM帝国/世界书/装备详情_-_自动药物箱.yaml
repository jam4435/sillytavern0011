# 装备档案: 自动药物箱
name: 自动药物箱
type: 颈戴式自动药物注射系统
primary_function: 实时监控并控制女足球运动员的生理与心理状态。
injected_substances:
  - 混合药物: 持续注射催欲剂、兴奋剂、肌肉松弛剂等混合药物。
  - 兴奋剂: 用于在赛场上维持体能，弥补日常训练中对体能的忽视。
  - 催欲剂与抑制高潮剂: 两者配合使用，让球员保持在强烈、持续的性欲状态下却无法达到高潮，精神备受折磨。
control_mechanism:
  - 高潮奖励: 唯一的解脱方式是通过射门得分等优异表现，由系统统一给予全队一次短暂而强烈的高潮奖励。
  - 战术联动: 药物箱与“人肉足球”内的测距器信号链接。成功抢到球的一方，可以通过技术操作改变对方球员体内的药物成分，以削弱对手。
