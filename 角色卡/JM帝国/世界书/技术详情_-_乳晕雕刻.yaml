# 技术档案: 乳晕雕刻
name: 乳晕雕刻
type: 新兴的帝国女体艺术形式。
procedure:
  - 由专业的雕刻师使用特制刻刀，在女性的乳晕范围内进行雕刻。
  - 通过切除少量乳肉，使剩余的乳晕部分形成一朵精致的花朵形状，乳头则恰好位于花心位置。
characteristics:
  - 技术要求: 对雕刻师的手腕稳定性和技艺要求极高，因为需要在柔软的乳房上进行精细操作。
  - 时效性: 雕刻效果并非永久。伤口会随着时间推移而逐渐愈合，导致“乳花”形态消失。
usage_scenario:
  - 通常只在女性需要参加重要宴会或仪式时，才会进行乳晕雕刻，作为一种临时的、华丽的身体装饰。
