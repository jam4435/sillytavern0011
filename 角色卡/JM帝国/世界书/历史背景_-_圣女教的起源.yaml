# 历史档案: 圣女教的起源
name: 圣女教的起源
background: 帝国诞生初期，战争摧毁了文明，统治者面临着“征服一个女人的灵魂，比在废墟上建起一座城市还难”的困境。酷刑无法根除反抗，教育耗时漫长。
establishment: 宗教成为最佳工具。以帝国政府为背景，圣女教应运而生，在民间迅速传播。战后第一代女性几乎九成都自愿或非自愿地加入了圣女教。
social_impact: 在随后的半个世纪，人类文明被割裂：男性享受现代教育与先进思想，女性则被教廷的封建思想统治。旧时代的女性被隔离在集中营，沦为生育机器。
legacy: 圣女教成功帮助帝国度过动荡期，其思想如遗传病般代代相传，将忠诚根植于女性心中，使她们成为比泄欲工具更有价值的“忠诚的奴隶”。精神枷锁比任何锁链都更牢固。
present_status: 如今，圣女教与帝国完全融合，势力遍布每个角落，成为束缚所有女性的无形锁链。
