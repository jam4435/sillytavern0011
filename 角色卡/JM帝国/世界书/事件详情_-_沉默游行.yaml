# 事件档案: 沉默游行
name: 沉默游行
type: 帝国法律允许的、但代价极高的女性抗议形式。
cost_of_participation:
  -经济惩罚: 扣除未来五个月的工资。
  -档案污点: 户籍档案中的“忠诚度”被扣除5至10分。
  -缩短生命周期: 法定废除年龄由35岁被强制改为30岁甚至25岁。
  -永久额头烙印: 额头被烙上特定标志，终身不可消除，象征其有过“异议”。
rules_of_protest:
  -无声: 不允许发出声音，口号只能是“帝国万岁”，所有诉求只能写在牌子上。
  -路线限制: 参与者必须穿戴特制的“滑索贞操带”，被限制在铺设于街道上的固定滑索上，沿着预定路线移动，不可偏离。
  -信息公开: 游行结束后，所有参与者的个人信息都会在政府网站上被公开。
