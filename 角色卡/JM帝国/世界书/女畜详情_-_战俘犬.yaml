# 单位档案: 战俘犬
name: 战俘犬
background: 帝国与革命军交战，活捉的女战俘被严刑拷问以榨取情报。情报榨干后，女战俘面临死亡、精神崩溃或被改造的命运。
outcomes:
  - type: 屈服者
    description: 部分女战俘在酷刑下彻底屈服，被送往女子学校，从小学级别开始学习如何成为“合格的帝国女人”，包括打扮、与男性交往等，获得新身份以融入帝国社会。
  - type: 战俘犬
    description: 无法独立生活的女战俘被改造成“战俘犬”，一种稀有且昂贵的宠物，专供帝国精英阶层。
body_modifications:
  - 听觉和语言能力破坏: 破坏相关器官，只能通过狗绳交流。
  - 脖颈开口改造: 切除颈部一大块，使食道断开并暴露，可用于灌食或反向奸污口腔。
  - 下颚毁掉，安装乳胶嘴唇: 毁掉下颚并安装乳胶嘴唇用于口交。
  - 气管狗绳: 借助脖颈开口改造，狗绳直接锁在气管上，用于窒息训练和惩罚。
  - 插入式狗嘴/肛塞狗尾巴: 作为狗形态的装饰和束缚。
  - 乳房前肢化: 前肢断臂，通过乳孔插入乳房内，配合弹簧和金属乳箍行走，每一步都在抽插乳房。
  - 后肢踩踏卵巢: 将卵巢作为行走时的缓冲垫。
  - 项圈与肛塞铁链连接: 强制头部在行走时保持女犬标准的昂首姿态。
behavioral_characteristics: 与普通顺从的帝国女犬不同，战俘犬保留革命军的反抗精神，可能逃跑或攻击主人，展现野性。
social_status: 因稀少和高危险性被视为“限制级宠物”，仅限成年男性贵族或富豪饲养，女性和未成年人禁止接触，以防意识形态影响。
market_and_culture:
  - 战俘犬因稀有和野性备受追捧，价格可达千万，常常通过拍卖出售。
  - 她们常出现在电视节目或高端场合，伴随精英阶层，凸显主人地位。
  - 其野性和反抗性反而成为吸引爱好者的“魅力点”。
training_and_control:
  - 主人通过拉扯气管上的狗绳造成窒息来训练战俘犬，控制其行为。
  - 改造后的身体结构使其行动缓慢，无法快速移动，适合在宴会等场合展示，但若跟不上主人步伐，可能因气管拉扯或子宫撕裂而痛苦不堪。
