# 单位档案: 珍妮
name: 珍妮
identity: 夜蕾丝女佣家政公司高层秘书，李经理的私人秘书。
description: 一位外表美丽、业务能力出众的高级服务人员，其身体经过了高度专业化的改造，以满足商务应酬中的特殊需求。
oral_modifications:
  - 乳胶牙齿改造: 仅保留六颗外侧牙齿（包括犬齿），材质为特制乳胶。牙齿为正反两面设计，反面带有凹凸触点，可在阴茎拔出时刺激冠状沟内侧。
  - 口腔改造:
  - 上牙膛: 植入硅胶液囊，内储复合型润滑液。液囊通过脸颊两侧的导管与口腔内膜的排液孔相连。润滑液储备量仅够一次口交，用完后需通过鼻腔的注射点进行补充。
  - 磨牙: 上下磨牙被替换为可高速旋转的磨轮。磨轮主体为柔软刷毛，用于刺激龟头两侧；固定部分为柔软橡胶，避免产生硬物感。
  - 扁桃体: 植入袖珍按摩棒，两端的橡胶球可以震动和旋转，用于深喉时增强刺激。
  - 舌头: 舌头两侧埋入微型跳蛋，在使用卷舌技巧时可刺激龟头底部的肉棱。此外，舌头内还植入了一个磁场发生器，宣传称可促进血液循环，但实际效果存疑，可能仅为营销噱头。
outcome: 在接待王总的过程中，珍妮凭借其专业的口腔技巧，使王总在强烈的快感中高潮，精液甚至从她的鼻孔中喷涌而出。
