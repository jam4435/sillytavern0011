# 单位档案: 人肉足球
name: 人肉足球
type: 活体一次性比赛用具
description: 为增加美足杯的残酷性和观赏性，由帝国足协推出的特制“足球”。
manufacturing_process:
  - 素材: 选用三至四岁，身体健康的幼女。
  - 改造: 将幼女的四肢完全截除。通过外科手术，将其头部强行向后弯折并塞入其自身的肛门内。
  - 维生: 在体外仅保留一根细小的呼吸导管以维持最低限度的生命体征。
  - 成型: 将其身体蜷缩成近似球形，再用印有足球网格的特制皮衣紧紧勒住固定。
usage_and_effects:
  - 消耗性: 这种“足球”是完全一次性的。
  - 比赛过程: 比赛中，随着被球员用钉鞋反复踢击，内部的骨骼会逐渐碎裂，血液会从皮衣的缝隙中渗出，将赛场染红。
  - 触感变化: 随着比赛进行，“足球”会因内部结构的破坏而变得越来越软，这考验着球员对球的控制力。
