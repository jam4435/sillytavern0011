# 职业档案: 实习公务员小姐
name: 实习公务员小姐
eligibility: 年龄在21至40岁之间的女性，通过特殊考核获得该身份。
privileges:
  - 豁免“超龄废除法案”到40岁。
  - 其女性权限被永久锁定为最高四级（女体处置权），但所有权归帝国政府，个人不得买卖。
  - 法律授权她们可以拒绝任何非政府人员的性骚扰或强奸。
probationary_period:
  - 时长: 五年。
  - 职责: 在此期间，女性需担任政府内部的慰安妇，为男性官员提供性服务，并兼顾端茶倒水等简单工作。
  - 礼仪要求: 在政府大楼内的公务招待所待客时，必须保持严格的站立礼仪（安静叠手、挺胸抬头、笑不露齿），有时需要连续站立十余小时。穿上有多个隐蔽开口的制服，方便官员随时抚摸，制服下是束缚套装
  - 轮换制度: 为了确保官员能体验到新鲜感，她们每月都会被调换到不同的城市工作。
  - 通过试用期的公务员通常会被截掉四肢正式成为有实权的帝国政府工作人员。（部分公务员转正后会因为部分男性政府官员特殊需求避免截肢，但作为代价，帝国授权该男性拥有她的女体处置权）
