# 单位档案: 便池小姐
name: 便池小姐
type: 活体排泄处理容器
source: 不对外招收，由被淘汰的夜间护士改造而成。
modifications:
  - 肢体: 高位截肢，移除四肢。
  - 感官: 割除舌头和耳朵，用化学药剂烧蚀眼球，使其丧失视觉。
  - 性器官: 切除阴蒂和大小阴唇，剥夺其性快感能力。
function: 负责处理男性的尿液和粪便。使用时，使用者需让便池小姐的嘴巴张开并对准自己的阴茎或屁眼。使用结束后，她会被戴上一个特制的除臭口塞，口塞内置的香精球会清除口腔内的异味。
maintenance: 一根长柄食道刷被用于定期疏通她的食道，平时这根刷子存放在她的阴道内。
status: 无任何薪资或待遇，是医院内部地位最低的“消耗品”。
