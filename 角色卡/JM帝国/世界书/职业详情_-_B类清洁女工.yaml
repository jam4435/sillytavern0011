# 职业档案: B类清洁女工
name: B类清洁女工
primary_function: 使用身体器官进行精细清洁工作，如舔食垃圾、清洗地面和公共设施。
body_modifications:
  - 舌头改造: 舌头从中间被剪开，并植入类似猫舌的硬质刷毛，以增强清洁能力。
  - 乳房毛刷: 乳房内植入可伸缩的清洁毛刷，通过按压乳房启动刷头，用于清理地面。
  - 鼻环钩齿: 鼻环上带有锋利的钩齿，用于刮除地面上粘附的顽固污物。
  - 喉部导管: 喉部植入导管，与尿道相连。高潮时产生的液体可通过导管从口中喷射，用于冲刷地面。
  - 呕吐限制: 一根金属线穿过喉部软骨，物理性地限制呕吐反射，确保女工能吞下任何恶心的物体，如粪便、烟头、痰液等。
standard_equipment:
  - 唾液刺激项圈: 项圈上装有药瓶，药物通过注射管连接到唾液腺，可随时刺激唾液分泌以提高清洁效率。
