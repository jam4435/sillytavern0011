# 装备档案: 弧跟鞋
name: 弧跟鞋
era: 本世纪初至今
type: 现代成熟型女子足球鞋
description: 从折足鞋发展而来的、技术更为成熟的现代比赛用鞋。它将女性的双足完全锁死，并提供了更强的性能与更隐蔽的残酷性。
technical_improvements:
  - 助力系统: 内嵌式卡扣助力弹簧，运动员可通过脚部技巧压短鞋跟，完成铲球等动作。
  - 跟骨固定: 采用横向贯穿跟骨的金属托架取代了传统的垂直骨钉。
  - 鞋跟固定: 通过多根从指甲缝中穿入的钢钉来固定鞋跟，彻底解决了跟骨崩裂问题。
  - 跟腱改造: 切断跟腱与跟骨的连接，通过一个体外的旋轮装置来固定和调整跟腱长度。运动员可借此增强腿部爆发力，无需大量锻炼也能大力射门，同时保持双腿的柔美曲线。
usage_and_consequences:
  - 永久穿戴: 运动员的脚被完全锁死在鞋内，赛后极少拆下托架，导致双脚常年血肉模糊。
  - 外观遮蔽: 比赛时，教练会为她们套上皮质鞋套，遮盖严重受损的双足，使其外观看起来更像普通球鞋。
