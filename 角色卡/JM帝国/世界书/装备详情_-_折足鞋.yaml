# 装备档案: 折足鞋
name: 折足鞋
era: 钉刺高跟鞋的改进型
type: 女子足球鞋
description: 为解决钉刺高跟鞋的缺陷而设计的改进型球鞋，深受球迷喜爱，因为它给女性足部带来了类似传统裹足的畸形美感。
design_and_usage:
  - 穿戴方式: 要求女性将脚掌向后弯折，足背紧贴小腿，脚尖向下指向地面。
  - 固定结构:
    - 金属托架: 双脚被完全固定在金属托架上。
    - 足跟骨钉: 足跟依然需要埋入骨钉。
    - 贯穿骨锁: 为了降低骨钉撕裂风险，足背被植入了贯穿骨骼的金属锁。
    - 脚趾固定: 脚趾需要用力夹住鞋跟部分。
wearer_experience:
  - 极度疼痛: 初次穿戴者表示重心完全集中在脚跟，踢球时足背疼痛难忍。
  - 常见损伤: 比赛后双脚常因肿胀和疼痛无法脱下，骨锁与皮肉的缝隙中会流出脓血。
  - 特殊癖好: 部分女性表示逐渐喜欢上这种束缚感，甚至在私人生活中也被要求穿着进行性行为。
