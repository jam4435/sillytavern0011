: 1;\n  height: 56px;\n}\n\n/* 新增：router-view 容器 */\n.router-view-container {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  margin-top: 56px; /* 与顶部按钮组高度相同 */\n  padding: 24px;\n  overflow: hidden;\n  background: rgba(255, 255, 255, 0.7);\n  border-radius: 0 0 20px 20px;\n  border-top: 1px solid rgba(255, 255, 255, 0.3);\n}\n\n/* 内容区 */\n.content {\n  flex: 1;\n  overflow-y: auto;\n  padding: 4px;\n  background: white;\n  border-radius: 12px;\n  box-shadow:\n    0 2px 8px rgba(0, 0, 0, 0.05),\n    inset 0 1px 0 rgba(255, 255, 255, 0.8);\n\n  /* 添加内部填充以确保内容不贴边 */\n  & > * {\n    padding: 0 8px;\n  }\n\n  /* 滚动条样式 */\n  &::-webkit-scrollbar {\n    width: 6px;\n  }\n\n  &::-webkit-scrollbar-track {\n    background: #f1f5f9;\n    border-radius: 3px;\n    margin: 4px 0;\n  }\n\n  &::-webkit-scrollbar-thumb {\n    background: #cbd5e1;\n    border-radius: 3px;\n\n    &:hover {\n      background: #94a3b8;\n    }\n  }\n}\n\n/* 按钮样式 */\n.btn {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  padding: 8px 10px;\n  border: none;\n  border-radius: 10px;\n  background: linear-gradient(135deg, #dcd8d8 0%, #f8fafc 100%);\n  color: #64748b;\n  font-size: 12px;\n  cursor: pointer;\n  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n  box-shadow:\n    0 1px 4px rgba(0, 0, 0, 0.05),\n    inset 0 1px 0 rgba(255, 255, 255, 0.8);\n  min-height: 48px;\n\n  &:hover {\n    transform: translateY(-1px);\n    box-shadow:\n      0 2px 8px rgba(0, 0, 0, 0.08),\n      inset 0 1px 0 rgba(255, 255, 255, 0.9);\n    color: #475569;\n  }\n\n  &.active {\n    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);\n    color: white;\n    box-shadow:\n      0 2px 8px rgba(99, 102, 241, 0.3),\n      inset 0 1px 0 rgba(255, 255, 255, 0.2);\n\n    .btn-icon {\n      opacity: 1;\n      transform: scale(1.1);\n    }\n\n    .btn-text {\n      font-weight: 600;\n    }\n  }\n}\n\n.btn-text {\n  font-size: 11px;\n  line-height: 1.2;\n  font-weight: 500;\n  transition: all 0.3s ease;\n  margin-top: 2px;\n}\n\n/* 调整关闭按钮位置 */\n.close-x {\n  position: absolute;\n  top: 62px;\n  right: 16px;\n  width: 28px;\n  height: 28px;\n  border: none;\n  background: #f8fafc;\n  border-radius: 50%;\n  font-size: 18px;\n  line-height: 1;\n  color: #64748b;\n  cursor: pointer;\n  transition: all 0.3s ease;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);\n  z-index: 2;\n\n  &:hover {\n    background: #ef4444;\n    color: white;\n    transform: rotate(90deg);\n    box-shadow: 0 3px 10px rgba(239, 68, 68, 0.3);\n  }\n}\n\n/* 动画 */\n@keyframes fadeIn {\n  from {\n    opacity: 0;\n  }\n  to {\n    opacity: 1;\n  }\n}\n\n@keyframes slideUp {\n  from {\n    transform: translateY(30px) scale(0.95);\n    opacity: 0;\n  }\n  to {\n    transform: translateY(0) scale(1);\n    opacity: 1;\n  }\n}\n\n/* 响应式调整 */\n@media (max-width: 480px) {\n  .card {\n    max-width: 95%;\n    min-height: 360px;\n  }\n\n  .router-view-container {\n    margin-top: 52px;\n    padding: 16px;\n  }\n\n  .top-button-group {\n    padding: 8px 12px;\n    gap: 6px;\n    height: 52px;\n  }\n\n  .btn {\n    padding: 6px 8px;\n    min-height: 44px;\n    font-size: 11px;\n  }\n\n  .btn-text {\n    font-size: 12px;\n  }\n\n  .close-x {\n    top: 58px;\n    right: 12px;\n    width: 26px;\n    height: 26px;\n    font-size: 16px;\n  }\n\n  .content {\n    border-radius: 10px;\n  }\n}\n'],sourceRoot:''}]);const l=r},3035:(n,t,a)=>{n.exports=(e=>{var n={};return a.d(n,e),n})({createPinia:()=>e.createPinia,defineStore:()=>e.defineStore,storeToRefs:()=>e.storeToRefs})},3300:(e,n,t)=>{t.d(n,{A:()=>c});var a=t(4061),o=t(1960);const A={class:'file-import-export'},r=['accept'],l={key:0,class:'button-group'},i={key:0,class:'loading-spinner'},d={key:0,class:'loading-spinner'},s=(0,a.defineComponent)({__name:'FileImportExport',props:{accept:{default:'.json'},importText:{default:'导入'},exportText:{def