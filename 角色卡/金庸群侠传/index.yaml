          n    <\\/script>\\n\\n    \\x3c!--
          \\n    ==============================================================\
          ==\\n    给 AI 的参考代码 (默认注释)\\n    \\n    AI
          你好！当角色卡作者让你修改此文件时，请参考下面的注释代码。\\n    \\n    ### 宏模式 (简单)\\n    -
          **用法**: 直接在 HTML 中写入 `{{ERA:路径.到.变量}}` 宏。\\n    - **优点**: 非常简单，无需编写任何
          JavaScript。\\n    - **缺点**: 需要在 ERA
          设置中开启“强制重载状态栏”，每次变量更新都会导致整个状态栏闪烁刷新。\\n    - **建议**:
          你作为ai，最好提醒一下角色卡作者使用era的api，监听writeDone事件是更优雅更稳健的解决方案。\\n    - **示例**:
          `<div class=\"era-statusbar-item-value\">{{ERA:player.hp}} /
          {{ERA:player.max_hp}}</div>`\\n\\n    ---\\n\\n    ### API 模式
          (进阶，推荐)\\n    - **用法**: 使用 JavaScript 监听和发送 ERA
          框架的事件，来动态地读写变量。\\n    - **优点**:
          更新平滑无闪烁，性能更好，可以实现复杂的前端交互。\\n\\n    #### 核心事件与数据结构\\n    \\n    **1.
          `era:writeDone` 事件**: 这是响应数据变化的**唯一推荐方式**。当任何变量发生改变后，ERA
          都会广播此事件，其回调函数会接收一个包含详细信息的 `detail` 对象。\\n    \\n    **`writeDone` 事件的
          `detail` 对象 (`WriteDonePayload`)
          结构如下:**\\n    ```typescript\\n    {\\n      mk: string; //
          本次更新的消息密钥\\n      message_id: number; // 本次更新的消息 ID\\n      actions:
          {\\n        rollback: boolean; // 是否执行了回滚\\n        apply:
          boolean;    // 是否应用了来自AI输出的变量变更\\n        resync: boolean;   //
          是否因历史记录变化而执行了再同步\\n        api: boolean;      //
          是否由API直接调用触发\\n        apiWrite: boolean; //
          是否由API写入操作(如update/insert)触发\\n      };\\n      selectedMks: (string |
          null)[]; // 当前聊天的主干消息密钥链\\n      editLogs: { [key: string]: any[] };
          // 完整的编辑日志\\n      stat: any; // 包含 $meta
          字段的完整变量状态\\n      statWithoutMeta: any; // 不含 $meta 的纯净变量状态
          (推荐使用)\\n      consecutiveProcessingCount: number; //
          对当前消息的连续处理次数\\n    }\\n    ```\\n\\n    **2. 核心读取事件**:\\n    -
          **`eventOn(\\'era:writeDone\\', callback)`**:
