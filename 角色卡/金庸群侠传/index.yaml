CACE,wBAAA,CAGF,oDACE,0BAAA,CAGF,4BACE,eAAA,CACA,cAAA,CAGF,qCACE,YAAA,CACA,6BAAA,CACA,kBAAA,CACA,kBAAA,CAGF,wCACE,YAAA,CACA,OAAA,CAGF,gCACE,YAAA,CACA,OAAA,CAIF,qCACE,YAAA,CACA,OAAA,CACA,MAAA,CAGF,8BACE,YAAA,CACA,kBAAA,CACA,MAAA,CACA,OAAA,CACA,WAAA,CAGF,8BACE,cAAA,CACA,aAAA,CACA,cAAA,CACA,kBAAA,CACA,eAAA,CAGF,2CACE,MAAA,CACA,eAAA,CACA,wBAAA,CACA,iBAAA,CACA,cAAA,CACA,WAAA,CAIF,8BACE,eAAA,CAGF,qCACE,YAAA,CACA,6BAAA,CACA,kBAAA,CACA,kBAAA,CAGF,gCACE,kBAAA,CACA,YAAA,CACA,kBAAA,CACA,wBAAA,CACA,iBAAA,CAGF,gCACE,YAAA,CACA,6BAAA,CACA,kBAAA,CACA,iBAAA,CACA,kBAAA,CACA,+BAAA,CACA,cAAA,CACA,wBAAA,CAAA,gBAAA,CAGF,oCACE,gBAAA,CACA,wBAAA,CACA,iBAAA,CACA,eAAA,CACA,UAAA,CACA,eAAA,CACA,aAAA,CACA,WAAA,CAGF,0CACE,YAAA,CACA,oBAAA,CACA,yCAAA,CAGF,iCACE,YAAA,CACA,kBAAA,CACA,OAAA,CAGF,iCACE,cAAA,CACA,gBAAA,CACA,aAAA,CACA,wBAAA,CACA,cAAA,CAGF,8BACE,YAAA,CAGF,6BACE,YAAA,CACA,6BAAA,CACA,kBAAA,CACA,iBAAA,CAGF,mCACE,cAAA,CACA,eAAA,CACA,aAAA,CAGF,oCACE,UAAA,CACA,eAAA,CACA,wBAAA,CACA,iBAAA,CACA,cAAA,CACA,kBAAA,CACA,cAAA,CACA,aAAA,CACA,eAAA,CAGF,0CACE,kBAAA,CAIF,8BACE,aAAA,CAGF,2CACE,iBAAA,CACA,WAAA,CACA,kBAAA,CACA,wBAAA,CACA,iBAAA,CAGF,oCACE,YAAA,CACA,cAAA,CACA,aAAA,CACA,eAAA,CACA,oBAAA,CAGF,2CACE,UAAA,CACA,eAAA,CAIF,+BACE,kBAAA,CACA,cAAA,CACA,aAAA,CAGF,mCACE,YAAA,CACA,aAAA,CAIF,yBACE,8BACE,SAAA,CAGF,iCACE,qBAAA,CACA,OAAA,CAGF,wCACE,gBAAA,CACA,cAAA,CAGF,kCACE,mBAAA,CAGF,qCACE,qBAAA,CACA,OAAA,CAGF,8BACE,yBAAA,CAAA',sourcesContent:['\n.era-rule-panel {\n  margin: 8px 0 16px;\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  background: #f5f6fa;\n  font-size: 12px;\n  color: #111827;\n  border-radius: 8px;\n  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);\n  position: relative;\n}\n\n/* 2. 固定的页签容器 */\n.sticky-tabs {\n  position: sticky;\n  top: 0;\n  z-index: 10;\n  background: #f5f6fa;\n  border-bottom: 1px solid #e5e7eb;\n}\n\n.tabs-container {\n  display: flex;\n  gap: 8px;\n  padding: 12px 16px 8px;\n  background: #f5f6fa;\n}\n\n.tabs-container button {\n  padding: 8px 16px;\n  border: none;\n  background: none;\n  font-size: 13px;\n  color: #111827;\n  cursor: pointer;\n  position: relative;\n  transition: color 0.2s;\n  border-radius: 6px;\n  font-weight: 600;\n}\n\n.tabs-container button::after {\n  content: \'\';\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: -9px;\n  height: 2px;\n  background: #6366f1;\n  transform: scaleX(0);\n  transition: transform 0.2s;\n}\n\n.tabs-container button.active {\n  color: #4f46e5;\n  font-weight: 700;\n}\n\n.tabs-container button.active::after {\n  transform: scaleX(1);\n}\n\n/* 悬停效果 */\n.tabs-container button:hover {\n  background: rgba(99, 102, 241, 0.08);\n}\n\n/* 3. 内容包装器 */\n.content-wrapper {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  padding: 0 16px 16px;\n}\n\n/* 4. 内容区统一卡片 */\nsection {\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  padding-top: 12px;\n}\n\nh2 {\n  margin: 0 0 8px;\n  font-size: 15px;\n  font-weight: 600;\n  color: #111827;\n}\n\n/* 5. JSON 展示区 */\n.json-tree-box {\n  flex: 1;\n  min-height: 0;\n  overflow: auto;\n  background: #ffffff;\n  border: 1px solid #e5e7eb;\n  border-radius: 6px;\n  padding: 8px;\n  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);\n}\n\n/* 6. 规则卡片 */\n.rule-card {\n  background: #ffffff;\n  border: 1px solid #e5e7eb;\n  border-radius: 6px;\n  overflow: hidden;\n  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);\n}\n\n.rule-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 8px 10px;\n  background: #f9fafb;\n  cursor: pointer;\n  user-select: none;\n  font-weight: 500;\n}\n\n.rule-body {\n  padding: 10px;\n  border-top: 1px solid #e5e7eb;\n}\n\n/* 7. 表单字段 */\n.field {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin-bottom: 8px;\n}\n\n.field label {\n  width: 70px;\n  font-size: 12px;\n  color: #111827;\n  flex-shrink: 0;\n  font-weight: 500;\n}\n\n.field input,\n.field select {\n  flex: 1;\n  padding: 5px 8px;\n  border: 1px solid #e5e7eb;\n  border-radius: 6px;\n  font-size: 12px;\n  color: #111827;\n  background: #ffffff;\n  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);\n  transition:\n    border-color 0.2s,\n    box-shadow 0.2s;\n}\n\n.field input:focus,\n.field select:focus {\n  outline: none;\n  border-color: #6366f1;\n  box-shadow:\n    0 0 0 3px rgba(99, 102, 241, 0.15),\n    inset 0 1px 2px rgba(0, 0, 0, 0.03);\n}\n\n/* 8. handle 区 */\n.handle-area {\n  margin-top: 10px;\n  padding: 10px;\n  background: #f9fafb;\n  border-radius: 6px;\n}\n\n/* 9. 按钮 */\n.btn {\n  padding: 5px 12px;\n  border: none;\n  border-radius: 6px;\n  font-size: 12px;\n  cursor: pointer;\n  transition:\n    background 0.2s,\n    color 0.2s,\n    transform 0.15s;\n  background: #f3f4f6;\n  color: #111827;\n  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);\n  font-weight: 500;\n}\n\n.btn:hover {\n  background: #e5e7eb;\n  color: #000000;\n}\n\n.btn.primary {\n  background: #4f46e5;\n  color: #ffffff;\n  font-weight: 500;\n}\n\n.btn.primary:hover {\n  background: #4338ca;\n  color: #ffffff;\n}\n\n.btn.danger {\n  background: #dc2626;\n  color: #ffffff;\n  font-weight: 500;\n}\n\n.btn.danger:hover {\n  background: #b91c1c;\n  color: #ffffff;\n}\n\n/* 10. 底部按钮组 */\n.button-group {\n  display: flex;\n  gap: 8px;\n  margin-top: 12px;\n  justify-content: flex-end;\n}\n\n/* 11. 分隔线 */\nhr {\n  border: none;\n  border-top: 1px solid #e5e7eb;\n  margin: 10px 0;\n}\n\n/* 12. 状态提示 */\n.status-message {\n  padding: 6px 10px;\n  border-radius: 4px;\n  font-size: 11px;\n  margin-bottom: 8px;\n}\n\n.status-message.success {\n  background: #d1fae5;\n  color: #065f46;\n  border: 1px solid #a7f3d0;\n}\n\n.status-message.error {\n  background: #fee2e2;\n  color: #991b1b;\n  border: 1px solid #fecaca;\n}\n\n.status-message.warning {\n  background: #fef3c7;\n  color: #92400e;\n  border: 1px solid #fde68a;\n}\n\n/* 14. 空状态 */\n.empty-state {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  padding: 20px;\n  color: #6b7280;\n  font-size: 11px;\n  text-align: center;\n}\n\n.empty-state svg {\n  width: 24px;\n  height: 24px;\n  margin-bottom: 8px;\n  opacity: 0.5;\n}\n\n/* 15. 滚动条美化 */\n.content-wrapper::-webkit-scrollbar {\n  width: 8px;\n}\n\n.content-wrapper::-webkit-scrollbar-track {\n  background: transparent;\n}\n\n.content-wrapper::-webkit-scrollbar-thumb {\n  background: #cbd5e1;\n  border-radius: 4px;\n}\n\n.content-wrapper::-webkit-scrollbar-thumb:hover {\n  background: #94a3b8;\n}\n\n.json-tree-box::-webkit-scrollbar {\n  width: 6px;\n}\n\n.json-tree-box::-webkit-scrollbar-track {\n  background: #f1f5f9;\n  border-radius: 3px;\n}\n\n.json-tree-box::-webkit-scrollbar-thumb {\n  background: #cbd5e1;\n  border-radius: 3px;\n}\n\n.json-tree-box::-webkit-scrollbar-thumb:hover {\n  background: #94a3b8;\n}\n\n/* 17. 规则操作按钮 */\n.rule-operations {\n  display: flex;\n  gap: 8px;\n  margin-top: 8px;\n}\n\n.rule-operations .btn {\n  flex: 1;\n  min-width: 60px;\n}\n\n/* 启用状态指示器 */\n.rule-status {\n  margin-left: 8px;\n  font-size: 11px;\n  color: #6b7280;\n  display: flex;\n  align-items: center;\n  gap: 4px;\n}\n\n.status-indicator {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: #ef4444;\n}\n\n.status-indicator.enabled {\n  background: #10b981;\n}\n\n.rule-name-container {\n  display: flex;\n  align-items: center;\n}\n\n/* 启用开关 */\n.toggle-switch {\n  position: relative;\n  width: 44px;\n  height: 22px;\n}\n\n.toggle-switch input {\n  opacity: 0;\n  width: 0;\n  height: 0;\n}\n\n.toggle-label {\n  position: absolute;\n  cursor: pointer;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  background-color: #e5e7eb;\n  transition: 0.3s;\n  border-radius: 22px;\n}\n\n.toggle-label:before {\n  position: absolute;\n  content: \'\';\n  height: 16px;\n  width: 16px;\n  left: 3px;\n  bottom: 3px;\n  background-color: white;\n  transition: 0.3s;\n  border-radius: 50%;\n}\n\ninput:checked + .toggle-label {\n  background-color: #10b981;\n}\n\ninput:checked + .toggle-label:before {\n  transform: translateX(40px);\n}\n\n.btn.small {\n  padding: 3px 8px;\n  font-size: 11px;\n}\n\n.rule-list-controls {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.import-export-buttons {\n  display: flex;\n  gap: 8px;\n}\n\n.sort-controls {\n  display: flex;\n  gap: 8px;\n}\n\n/* 更新范围限制的样式 */\n.range-limit-inputs {\n  display: flex;\n  gap: 8px;\n  flex: 1;\n}\n\n.input-group {\n  display: flex;\n  align-items: center;\n  flex: 1;\n  gap: 4px;\n  min-width: 0;\n}\n\n.input-label {\n  font-size: 11px;\n  color: #111827;\n  min-width: 28px;\n  white-space: nowrap;\n  font-weight: 500;\n}\n\n.range-limit-inputs input {\n  flex: 1;\n  padding: 4px 6px;\n  border: 1px solid #e5e7eb;\n  border-radius: 4px;\n  font-size: 11px;\n  min-width: 0;\n}\n\n/* handle 区域样式更新 */\n.handle-area {\n  margin-top: 16px;\n}\n\n.handle-area-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 12px;\n}\n\n.handle-editor {\n  margin-bottom: 16px;\n  padding: 12px;\n  background: #f9fafb;\n  border: 1px solid #e5e7eb;\n  border-radius: 6px;\n}\n\n.handle-header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 8px;\n  padding-bottom: 8px;\n  border-bottom: 1px solid #e5e7eb;\n  cursor: pointer;\n  user-select: none;\n}\n\n.handle-name-input {\n  font-weight: bold;\n  border: 1px solid #d1d5db;\n  border-radius: 4px;\n  padding: 4px 8px;\n  width: auto;\n  min-width: 120px;\n  color: #111827; /* 更深的颜色使文字更清晰 */\n  cursor: text;\n}\n\n.handle-name-input:focus {\n  outline: none;\n  border-color: #6366f1;\n  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);\n}\n\n.handle-actions {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.fold-indicator {\n  font-size: 16px;\n  font-weight: bold;\n  color: #6b7280;\n  transition: transform 0.2s;\n  cursor: pointer;\n}\n\n.dsl-builder {\n  margin: 8px 0;\n}\n\n.dsl