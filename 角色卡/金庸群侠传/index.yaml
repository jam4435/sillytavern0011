shrink: 0;\n    background-color: #b6ffbb;\n    box-shadow: 0 1px 2px rgba(99, 102, 241, 0.2);\n\n    // 修正选择器：从 .line:hover & 改为直接父元素选择器\n    &:not(:hover) {\n      opacity: 0.8;\n    }\n\n    &:hover {\n      background: #75b8f1;\n      border-color: #75b8f1;\n    }\n\n    &:active {\n      transform: translateY(0);\n    }\n\n    .add-icon {\n      width: 14px;\n      height: 14px;\n      stroke-width: 2;\n    }\n  }\n\n  .collapse-preview {\n    color: #6b7280;\n    font-size: 11px;\n    font-style: italic;\n    padding: 2px 6px;\n    background-color: #f9fafb;\n    border-radius: 4px;\n    border: 1px dashed #e5e7eb;\n    line-height: 1.3;\n    flex: 1;\n    min-width: 0;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    max-width: 400px;\n    white-space: normal;\n    word-break: break-all;\n    word-wrap: break-word;\n\n    .ellipsis {\n      display: inline-block;\n      max-width: 100%;\n      overflow: hidden;\n      text-overflow: ellipsis;\n    }\n  }\n\n  // 最后一个节点的连接线调整\n  &:last-child::before {\n    bottom: 50%;\n  }\n\n  // 第一个节点的连接线调整\n  &:first-child::before {\n    top: 50%;\n  }\n}\n\n// 深色模式支持\n@media (prefers-color-scheme: dark) {\n  .json-node {\n    &::before {\n      background: linear-gradient(to bottom, transparent 0%, #374151 10%, #374151 90%, transparent 100%);\n    }\n\n    .line {\n      &:hover {\n        background-color: rgba(99, 102, 241, 0.1);\n      }\n    }\n\n    .key {\n      color: #9ca3af;\n    }\n\n    .val {\n      color: #f3f4f6;\n      background-color: #1f2937;\n      border-color: #374151;\n\n      &.type-string {\n        color: #34d399;\n        background-color: #064e3b;\n        border-color: #047857;\n      }\n\n      &.type-number {\n        color: #f87171;\n        background-color: #7f1d1d;\n        border-color: #991b1b;\n      }\n\n      &.type-boolean {\n        color: #a78bfa;\n        background-color: #4c1d95;\n        border-color: #5b21b6;\n      }\n\n      &.type-null {\n        color: #9ca3af;\n