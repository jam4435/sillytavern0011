AAA',sourcesContent:['\n/************ 通用 ************/\n* {\n  box-sizing: border-box;\n}\n\n/* 确保标题有足够的上边距 */\n.title {\n  margin: 8px 0 16px; /* 增加上边距 */\n  font-size: 18px;\n  font-weight: 600;\n  color: #111827;\n  padding-top: 4px; /* 额外内边距 */\n}\n\n/************ 开关 ************/\n.switch-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 16px;\n  cursor: pointer;\n  user-select: none;\n}\n.switch-row input[type=\'checkbox\'] {\n  display: none;\n}\n.switch {\n  position: relative;\n  width: 40px;\n  height: 22px;\n  background: #d1d5db;\n  border-radius: 11px;\n  transition: background 0.3s;\n}\n.switch::after {\n  content: \'\';\n  position: absolute;\n  top: 2px;\n  left: 2px;\n  width: 18px;\n  height: 18px;\n  background: #fff;\n  border-radius: 50%;\n  transition: left 0.3s;\n}\n.switch-row input:checked + .switch {\n  background: #6366f1;\n}\n.switch-row input:checked + .switch::after {\n  left: 20px;\n}\n\n/************ 提示卡片 ************/\n.tip-card {\n  display: block;\n  background: #fffbeb;\n  border: 1px solid #fde68a;\n  color: #b45309;\n  padding: 8px 12px;\n  border-radius: 8px;\n  font-size: 13px;\n  margin-bottom: 16px;\n}\n\n/************ 行 ************/\n.row {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 12px;\n}\n.row span:first-child {\n  width: 130px;\n  font-size: 14px;\n  color: #4b5563;\n  flex-shrink: 0;\n}\n.row input,\n.row select {\n  flex: 1;\n  padding: 6px 10px;\n  border: 1px solid #e5e7eb;\n  border-radius: 8px;\n  font-size: 14px;\n  color: #111827;\n  background: #dcd8d8;\n  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);\n  transition:\n    border-color 0.2s,\n    box-shadow 0.2s;\n}\n.row input:focus,\n.row select:focus {\n  outline: none;\n  border-color: #6366f1;\n  box-shadow:\n    0 0 0 3px rgba(99, 102, 241, 0.15),\n    inset 0 1px 2px rgba(0, 0, 0, 0.03);\n}\n\n/* 强制浅色 select */\n.row select,\n.row select option {\n  background: #dcd8d8 !important;\n  color: #111827 !important;\n}\n/* 为深色模式提供回退 */\n@media (prefers-color-scheme: dark) {\n  .row select,\n  .row select option {\n    background: #dcd8d8 !important;\n    color: #111827 !important;\n  }\n\n  /* 确保在深色模式下卡片内容保持浅色 */\n  .content {\n    background: #dcd8d8;\n    color: #111827;\n  }\n}\n\n/************ 按钮 ************/\n.btn {\n  padding: 6px 16px;\n  border: none;\n  border-radius: 8px;\n  font-size: 14px;\n  cursor: pointer;\n  transition:\n    background 0.2s,\n    color 0.2s,\n    transform 0.15s;\n  background: #f3f4f6;\n  color: #111827;\n  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);\n}\n.btn:hover {\n  background: #e5e7eb;\n}\n.btn.small {\n  padding: 4px 12px;\n  font-size: 13px;\n}\n.btn.primary {\n  background: #6366f1;\n  color: #fff;\n}\n.btn.primary:hover {\n  background: #4f46e5;\n}\n.btn.danger {\n  background: #ef4444;\n  color: #fff;\n}\n.btn.danger:hover {\n  background: #dc2626;\n}\n\n/************ 底部操作区 ************/\n.footer {\n  display: flex;\n  justify-content: flex-end;\n  gap: 8px;\n  margin-top: 16px;\n}\n\n/************ 列表样式 ************/\n.list-item {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 8px 12px;\n  background: #f9fafb;\n  border-radius: 6px;\n  margin-bottom: 8px;\n  border: 1px solid #e5e7eb;\n}\n.list-item:last-child {\n  margin-bottom: 0;\n}\n\n/************ 标签样式 ************/\n.tag {\n  display: inline-block;\n  padding: 2px 8px;\n  background: #e0e7ff;\n  color: #3730a3;\n  border-radius: 4px;\n  font-size: 12px;\n  margin-right: 6px;\n  margin-bottom: 4px;\n}\n\n/************ 消息提示 ************/\n.message {\n  padding: 8px 12px;\n  border-radius: 6px;\n  margin-bottom: 12px;\n  font-size: 13px;\n}\n.message.success {\n  background: #d1fae5;\n  color: #065f46;\n  border: 1px solid #a7f3d0;\n}\n.message.error {\n  background: #fee2e2;\n  color: #991b1b;\n  border: 1px solid #fecaca;\n}\n.message.warning {\n  background: #fef3c7;\n  color: #92400e;\n  border: 1px solid #fde68a;\n}\n.message.info {\n  background: #e0f2fe;\n  color: #1e40af;\n  border: 1px solid #bae6fd;\n}\n\n/************ 表单组 ************/\n.form-group {\n  margin-bottom: 16px;\n}\n.form-group label {\n  display: block;\n  margin-bottom: 6px;\n  font-size: 14px;\n  color: #374151;\n  font-weight: 500;\n}\n\n/************ 分隔线 ************/\n.divider {\n  height: 1px;\n  background: #e5e7eb;\n  margin: 16px 0;\n  border: none;\n}\n\n/************ 卡片容器 ************/\n.card-container {\n  background: #dcd8d8;\n  border: 1px solid #e5e7eb;\n  border-radius: 8px;\n  padding: 16px;\n  margin-bottom: 16px;\n  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);\n}\n\n/************ 加载状态 ************/\n.loading {\n  display: inline-block;\n  width: 20px;\n  height: 20px;\n  border: 2px solid #f3f4f6;\n  border-top: 2px solid #6366f1;\n  border-radius: 50%;\n  animation: spin 1s linear infinite;\n}\n@keyframes spin {\n  0% {\n    transform: rotate(0deg);\n  }\n  100% {\n    transform: rotate(360deg);\n  }\n}\n\n/************ 工具提示 ************/\n.tooltip {\n  position: relative;\n  display: inline-block;\n  cursor: help;\n  margin-left: 4px;\n}\n.tooltip::after {\n  content: attr(data-tooltip);\n  position: absolute;\n  bottom: 100%;\n  left: 50%;\n  transform: translateX(-50%);\n  background: #111827;\n  color: white;\n  padding: 6px 10px;\n  border-radius: 4px;\n  font-size: 12px;\n  white-space: nowrap;\n  opacity: 0;\n  visibility: hidden;\n  transition: opacity 0.2s;\n}\n.tooltip:hover::after {\n  opacity: 1;\n  visibility: visible;\n}\n\n/************ 页面标签 ************/\n.page-tabs {\n  display: flex;\n  margin-bottom: 20px;\n  border-bottom: 1px solid #e5e7eb;\n}\n\n.tab-button {\n  padding: 10px 20px;\n  border: none;\n  background: transparent;\n  cursor: pointer;\n  font-size: 14px;\n  color: #6b7280;\n  border-bottom: 2px solid transparent;\n\n  &.active {\n    color: #6366f1;\n    border-bottom: 2px solid #6366f1;\n  }\n\n  &: